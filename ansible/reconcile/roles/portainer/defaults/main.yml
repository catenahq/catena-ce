---
# reconcile/roles/portainer -- the container control plane.
#
# Portainer CE provides the compose/stack, env, logs and lifecycle API the
# client apps are deployed and driven through; routing stays with
# catena-traefik.
#
# Deployed as a swarm service on catena-network with the docker socket, so it
# manages the local Docker/Swarm endpoint. The UI/API port is published
# host-mode and confined to this host's loopback by the public-ports registry
# (tasks/main.yml): the host's own API calls reach it on 127.0.0.1, and an
# administrator opens the UI through the `panel` account's SSH forward. Once a
# domain is set, reconcile/roles/oauth2_proxy also publishes it, SSO-gated,
# at portainer_admin_hostname through the tunnel.

portainer_service_name: catena-portainer
portainer_data_volume: catena-portainer-data

# The tier-1 SPEC for catena-portainer lives in the host engine, catena-admin
# payload/engines/tier1/catalog.go: the image, the mounts, the hardening, the
# placement constraints, the published port and the admin-password argument.
# reconcile/roles/portainer reads it with `catena-tier1 spec catena-portainer`,
# and the engine's own test pins that declaration against byte-identical create
# argv.
#
# The image pin lives there too, with Renovate and Trivy following it: a version
# is tracked where the host actually reads it.
#
# The role threads portainer_ui_port to the engine as --portainer-ui-port,
# because the public-ports registry fragment confines THAT number to the host
# -- the publish and the firewall must name the same port or the guard covers a
# port nothing listens on.

# portainer_ui_port and portainer_api_base_onbox live in
# playbooks/group_vars/all/main.yml, where every role and playbook that reads
# them finds them.

# The swarm secret holding the initial admin's password: the shared
# admin_password (>= 16 chars, the one Keycloak uses too). Delivered via
# --admin-password-file so the admin `admin` exists from first boot, with no
# race against Portainer's 5-minute /api/users/admin/init window.
portainer_admin_secret_name: catena_portainer_admin_password

# Name of the local Docker environment (endpoint) this role provisions via
# POST /api/endpoints (EndpointCreationType=1). Portainer does NOT auto-create
# a local endpoint on first boot even with the socket mounted, so the role
# creates it once; reconcile/roles/infrastructure/tasks/portainer_endpoint.yml
# checks that it resolves.
portainer_local_endpoint_name: catena-local

# The App Templates catalog Portainer fetches. Cluster-internal by
# construction: it carries this host's real client-app credentials, so it is
# reachable on catena-network and nowhere else -- never through Traefik, never
# from a browser. Portainer's SERVER does the fetch (its docs: host the file
# "somewhere accessible by the Portainer Server instance"), so an internal
# address is the right one and there is no session to carry.
#
# The token segment is the guard: catena_marketplace_token is a per-host secret
# from the on-box store, so another container on the same network cannot read
# the catalog off a well-known URL. Blank => this role leaves App Templates
# alone rather than publishing an unguarded one.
portainer_templates_url: >-
  http://{{ catena_admin_service_name }}:{{ catena_admin_internal_port }}/marketplace/{{ catena_marketplace_token | default('') }}/templates.json

