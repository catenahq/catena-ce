---
# Deploy Portainer CE as the container control plane. Runs after reconcile/roles/traefik
# (catena-network) and reconcile/roles/postgres. Its compose/stack API is what the
# client apps deploy through, and what the panel and the managed-update engine
# drive them with. See defaults for the ownership rationale.

- name: "portainer: assert admin_password is usable as the initial admin"
  ansible.builtin.assert:
    that:
      - admin_password is defined
      - admin_password | length >= 12
    fail_msg: >-
      admin_password missing or < 12 chars. Portainer's initial admin
      needs >= 12; the installer mints admin_password (>= 16).

# --- admin-password swarm secret (immutable; create-once) --------------------
# Delivered to Portainer via --admin-password-file so the admin is set at first
# boot (no racing the 5-minute /api/users/admin/init window). Staged to a 0600
# file for `docker secret create` -- no shell interpolation of the password.
- name: "portainer: check admin-password swarm secret exists"
  ansible.builtin.command: "docker secret inspect {{ portainer_admin_secret_name }}"
  register: _pt_secret
  changed_when: false
  failed_when: false

- name: "portainer: create admin-password swarm secret"
  when: _pt_secret.rc != 0
  block:
    - name: "portainer: stage secret material"
      ansible.builtin.copy:
        dest: /root/.catena-portainer-admin
        content: "{{ admin_password }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "portainer: docker secret create"
      ansible.builtin.command: "docker secret create {{ portainer_admin_secret_name }} /root/.catena-portainer-admin"
      register: _pt_secret_create
      changed_when: _pt_secret_create.rc == 0
  always:
    - name: "portainer: remove staged secret material"
      ansible.builtin.file:
        path: /root/.catena-portainer-admin
        state: absent

# --- the service spec, from the host engine (tier1_stack/tasks/spec_one.yml) ---
# Host-mode publish so the port lands on the node (the registry fragment below
# confines it to this host; an administrator reaches it through an SSH local
# forward) -- never ingress, which would put it on the routing mesh where that
# firewall does not apply. Docker socket lets Portainer manage the local
# Docker/Swarm endpoint.
# /data on a named volume persists its BoltDB store. The trailing
# --admin-password-file arg is passed to the portainer binary.
#
# No `detach`: the create BLOCKS until the service converges, which is the
# first half of the readiness the UI probe below completes.
#
# portainer_ui_port is threaded in so the publish and the public-ports registry
# fragment below, which confines THAT number to the host, name the same port
# from one variable; otherwise the guard covers a port nothing listens on. The
# port itself is the product's (playbooks/group_vars/all/main.yml).
- name: "portainer: read the built-in tier-1 spec from the host engine"
  ansible.builtin.include_role:
    name: tier1_stack
    tasks_from: spec_one.yml
    apply:
      tags: [portainer]
  vars:
    tier1_spec_name: "{{ portainer_service_name }}"
    tier1_spec_args:
      - "--portainer-ui-port={{ portainer_ui_port | int }}"

- name: "portainer: adopt the built-in spec"
  ansible.builtin.set_fact:
    _pt_spec: "{{ tier1_builtin_spec }}"

- name: "portainer: contribute the spec to the control-plane render"
  ansible.builtin.set_fact:
    catena_tier1_specs: >-
      {{ catena_tier1_specs | default([]) | tier1_spec_upsert(_pt_spec) }}

- name: "portainer: create or reconcile the swarm service"
  ansible.builtin.include_role:
    name: tier1_stack
    tasks_from: reconcile_one.yml
    apply:
      tags: [portainer]
  vars:
    tier1_spec: "{{ _pt_spec }}"

# --- host-only firewall for the UI port (registry fragment) ------------------
# `loopback`: nothing off this host reaches the UI. Every API call below runs
# on the host against 127.0.0.1, and an administrator opens the UI through an
# SSH local forward (`ssh -N -L 9000:127.0.0.1:9000 panel@<host>`), which
# arrives on the loopback like any host process. The swarm publish is DNAT'd,
# so the guard is DOCKER-USER (bind docker), with a ufw deny beside it.
- name: "portainer: ensure public-port fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "portainer: declare UI port (registry fragment, host-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/portainer.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": portainer_ui_port | int,
           "scope": "loopback", "bind": "docker", "owner": "portainer",
           "comment": "Portainer control-plane UI -- this host only, SSH forward"}
        ] | to_nice_json
      }}
  register: _pt_ports_fragment

- name: "portainer: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _pt_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# --- readiness ---------------------------------------------------------------
# Portainer serves its SPA on the UI port once the BoltDB store is initialised.
# Probe the SPA root (always 200, no auth, version-agnostic) rather than a
# specific /api/* status path, so the token-mint tasks below do not race first
# boot.
- name: "portainer: wait for the UI to answer"
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_ui_port }}/"
    method: GET
    status_code: [200, 307, 308]
    timeout: 5
  register: _pt_ready
  retries: 40
  delay: 5
  until: _pt_ready.status | default(-1) in [200, 307, 308]
  failed_when: false

# --- mint / heal portainer_api_key -------------------------------------------
# The converge's Portainer calls, the panel and the managed-update engine talk
# to Portainer with an X-API-Key. It is minted from the initial admin
# (created at first boot via --admin-password-file above) by
# helpers/bootstrap_portainer_admin.py: signs in with admin_password,
# resolves the admin user id, POSTs /api/users/{id}/tokens, and prints the
# rawAPIKey. This role then publishes it as a fact for the rest of the
# converge and writes it into the on-box store, which is where every Catena
# secret lives -- the loader adopts it from there on every later run.
#
# Fires when the store has NO key yet (first install) OR when the stored key
# is rejected by the live Portainer (401/403 -- e.g. the operator recreated
# the admin, or a /data restore replaced the BoltDB store the token lived
# in). The validate is one cheap GET; the mint only runs on the miss.
- name: "portainer: validate portainer_api_key against Portainer"
  ansible.builtin.uri:
    url: "{{ portainer_api_base_onbox }}/stacks"
    method: GET
    headers:
      X-API-Key: "{{ portainer_api_key }}"
    status_code: [200, 401, 403]
    timeout: 10
  register: _pt_apikey_validate
  # Transient 5xx / connection refused (Portainer mid-reschedule) must not
  # bomb the converge -- the mint condition below only fires on missing key
  # or an explicit 401/403.
  failed_when: false
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10

# Decided ONCE, here, rather than inline on the block below. A block's `when`
# is re-evaluated for EVERY task in it, and the block's second task set_facts
# portainer_api_key -- the very variable the condition reads. Inline, the
# mint would run, publish the key as a fact, and then every remaining task in
# its own block would skip because the condition had just become false: the
# key would never reach the on-box store, and the converge would report
# success with every later Portainer-API step skipped.
- name: "portainer: decide whether an API key must be minted"
  ansible.builtin.set_fact:
    _pt_apikey_needs_mint: >-
      {{
        portainer_api_key is not defined
        or (portainer_api_key | length) <= 10
        or (_pt_apikey_validate.status | default(200)) in [401, 403]
      }}

- name: "portainer: mint Portainer API key (missing or rejected by live Portainer)"
  when: _pt_apikey_needs_mint | bool
  block:
    # Runs ON THE HOST against 127.0.0.1, like every other API task here: the
    # UI port answers this host only. The helper is staged beside the store
    # (root-only) because `script` has no stdin, and the admin password goes in
    # on stdin so it never lands in argv (world-readable via /proc) and no file
    # holding it is created.
    - name: "portainer: stage the API-key mint helper on the host"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../helpers/bootstrap_portainer_admin.py"
        dest: /root/.catena-bootstrap-portainer-admin.py
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: "portainer: invoke bootstrap_portainer_admin.py to mint an API key"
      ansible.builtin.command:
        argv:
          - python3
          - /root/.catena-bootstrap-portainer-admin.py
          - --host
          - 127.0.0.1
          - --port
          - "{{ portainer_ui_port }}"
        stdin: "{{ admin_password }}"
        stdin_add_newline: false
      register: _pt_apikey_mint
      changed_when: true
      no_log: true

    - name: "portainer: remove the staged mint helper"
      ansible.builtin.file:
        path: /root/.catena-bootstrap-portainer-admin.py
        state: absent
      changed_when: false

    - name: "portainer: publish the minted key for the rest of the converge"
      ansible.builtin.set_fact:
        portainer_api_key: "{{ _pt_apikey_mint.stdout | trim }}"
      no_log: true

    # Staged to a 0600 file rather than passed as --set-secret: the script
    # module has no stdin passthrough, and a secret in argv is readable by
    # any local user through /proc. Same pattern as the converge loader.
    # --overwrite because the 401/403 arm of this block means the STORED key
    # is the dead one; fill-only would keep it.
    - name: "portainer: stage the minted key for the on-box store (0600)"
      ansible.builtin.copy:
        dest: /root/.catena-portainer-key.json
        content: "{{ {'portainer_api_key': portainer_api_key} | to_json }}"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: "portainer: write the minted key into the on-box config store"
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../helpers/onbox_config.py
          --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
          --adopt-file /root/.catena-portainer-key.json
          --overwrite --no-mint --emit none
        executable: python3
      # Staged by playbooks/tasks/stage_knob_registry.yml, which the store
      # loader runs before any role.
      environment:
        CATENA_KNOBS: /root/.catena-knobs.json
      changed_when: true
      no_log: true

    - name: "portainer: remove the staged key file"
      ansible.builtin.file:
        path: /root/.catena-portainer-key.json
        state: absent
      changed_when: false
      no_log: true

# --- local Docker environment (endpoint) -------------------------------------
# Portainer does NOT auto-create a local endpoint on first boot even with the
# socket mounted; the stack API is scoped per-endpoint, so provision it once
# here (POST /api/endpoints, EndpointCreationType=1 = local Docker socket).
# reconcile/roles/infrastructure/tasks/portainer_endpoint.yml checks it resolves.
- name: "portainer: list environments (endpoints)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base_onbox }}/endpoints"
    method: GET
    headers:
      X-API-Key: "{{ portainer_api_key }}"
    status_code: 200
    return_content: true
  register: _pt_endpoints
  failed_when: false
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10

- name: "portainer: create local Docker environment (create-once)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base_onbox }}/endpoints"
    method: POST
    headers:
      X-API-Key: "{{ portainer_api_key }}"
    body_format: form-multipart
    body:
      Name: "{{ portainer_local_endpoint_name }}"
      # 1 = local Docker environment via the mounted /var/run/docker.sock.
      EndpointCreationType: "1"
    status_code: [200, 201]
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10
    - (_pt_endpoints.json | default([]) | selectattr('Name', 'equalto', portainer_local_endpoint_name) | list | length) == 0

# --- App Templates catalog (the client's self-serve marketplace) -------------
# Point Portainer at THIS HOST's catalog rather than Portainer's own built-in
# one. Two things follow from doing it here:
#
#   1. The client sees the Catena apps at all. Left unset, App Templates lists
#      Portainer's public catalog, and nothing a client deploys from it knows
#      about this host's SSO, routing or backups.
#   2. The env form they fill in before clicking Deploy carries this host's
#      real values. The PUBLIC catalog cannot: catenahq/catena-templates ships
#      one templates.json for every client, so every secret in it renders to
#      the __CATENA_OPERATOR_WIRED__ placeholder. Deploying that verbatim gives
#      the app a database password every reader of a public repo knows, and by
#      the time anything could correct it Postgres has already initialised with
#      it. catena-admin serves the resolved copy; see catena-admin
#      shell/marketplace.
#
# Reconciled, not created once: the token in the path changes if the store is
# re-minted, and a stale URL 404s rather than falling back to anything.
- name: "portainer: read settings"
  ansible.builtin.uri:
    url: "{{ portainer_api_base_onbox }}/settings"
    method: GET
    headers:
      X-API-Key: "{{ portainer_api_key }}"
    status_code: 200
    return_content: true
  register: _pt_settings
  failed_when: false
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10
    - catena_marketplace_token | default('') | length > 0

- name: "portainer: point App Templates at this host's catalog"
  ansible.builtin.uri:
    url: "{{ portainer_api_base_onbox }}/settings"
    method: PUT
    headers:
      X-API-Key: "{{ portainer_api_key }}"
    body_format: json
    # The PUT replaces the settings document, so it is built from what the GET
    # returned rather than from this one field. Sending the field alone resets
    # every other setting to its zero value.
    body: "{{ _pt_settings.json | combine({'TemplatesURL': portainer_templates_url}) }}"
    status_code: 200
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10
    - catena_marketplace_token | default('') | length > 0
    - _pt_settings.json is defined
    - (_pt_settings.json.TemplatesURL | default('')) != portainer_templates_url
