---
# The paths the registry uses are not here: six roles drop fragments into the
# fragment dir, so they are shared constants and live in
# playbooks/group_vars/all/main.yml, where a reader that runs before this role
# can still resolve them. The reconciler's cadence is its timer's, in the
# catena-admin payload (payload/lanes/systemd/catena-public-ports.timer).

# Executing-prefix paths this role writes, for
# playbooks/tasks/prune_withdrawn_files.yml.
public_ports_managed_paths:
  - /etc/systemd/system/docker.service.d/30-catena-public-ports.conf
