---
# Wire the declarative public-port reconciler into this host. Single applier
# for every direct public port the VPS exposes outside the Cloudflare Tunnel.
#
# Infra roles (coturn, portainer, infrastructure, catena-admin) drop a JSON
# fragment into /etc/catena/public-ports.d/<owner>.json declaring their ports;
# app templates declare ports via vps.expose.* compose labels harvested live.
# The reconciler, its modules and its units ship in the catena-admin payload,
# which reconcile/roles/payload installs just before this role. This role owns
# what belongs to the host: the fragment dir, the docker.service drop-in, and
# enabling the timer. converge_tail.yml runs the reconciler once at the end of
# a converge, after every role has dropped its fragment.

- name: "public-ports: fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Checked rather than assumed. A payload that came from an image without the
# reconciler leaves DOCKER-USER empty: every restricted docker-published port
# open, and nothing saying so.
- name: "public-ports: is the payload's reconciler unit on this host"
  ansible.builtin.stat:
    path: /etc/systemd/system/catena-public-ports.service
  register: _pp_unit

- name: "public-ports: the payload this converge installed has no reconciler"
  ansible.builtin.fail:
    msg: >-
      /etc/systemd/system/catena-public-ports.service is not on this host after
      the payload install. The catena-admin image the payload came from does
      not ship the public-port reconciler, so this host would run with no
      firewall rules for the ports it declares. Converge with the catena-ce
      that image vendors, or move the panel to an image that ships it.
  when:
    - catena_payload_engines_expected | default(true) | bool
    - not _pp_unit.stat.exists

- name: "public-ports: no reconciler yet -- the payload is staged out of band"
  ansible.builtin.debug:
    msg: >-
      CATENA_PAYLOAD_INSTALL=false and catena-public-ports.service is not on
      this host: whatever stages the payload installs the reconciler, and the
      next converge enables its timer. Until then no declared port is applied.
  when:
    - not (catena_payload_engines_expected | default(true) | bool)
    - not _pp_unit.stat.exists

# Published for the roles below that start the reconciler after dropping their
# fragment, and for converge_tail.yml.
- name: "public-ports: publish whether the reconciler is on this host"
  ansible.builtin.set_fact:
    catena_public_ports_installed: "{{ _pp_unit.stat.exists }}"

# Re-apply DOCKER-USER guards on every docker.service start -- Docker
# flushes the chain on restart/reboot. systemd-run --no-block dispatches async
# so iptables churn does not hold docker.service in "activating"; the
# leading - makes the dispatch non-fatal. Docker ships no drop-in dir.
- name: "public-ports: docker.service.d drop-in dir exists"
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "public-ports: docker.service.d drop-in (reconcile on docker start)"
  ansible.builtin.template:
    src: catena-public-ports-docker-dropin.conf.j2
    dest: /etc/systemd/system/docker.service.d/30-catena-public-ports.conf
    owner: root
    group: root
    mode: "0644"
  register: _pp_docker_dropin

- name: "public-ports: daemon-reload if the drop-in changed"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _pp_docker_dropin.changed

- name: "public-ports: enable + start timer"
  ansible.builtin.systemd_service:
    name: catena-public-ports.timer
    enabled: true
    state: started
  changed_when: false
  when: catena_public_ports_installed | bool
