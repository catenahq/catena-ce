---
# Cloudflare tunnel role defaults.
#
# The tunnel/DNS/ingress/cloudflared-service logic lives in the Go engine
# catena-cloudflared-sync (host payload, installed by reconcile/roles/payload on
# every converge). This role only dispatches that engine's `sync` (see
# tasks/main.yml + catena-admin payload/cmd/catena-cloudflared-sync/SYNC.md).
# The token itself is read from the store by the engine, never passed here, and
# neither is the tunnel name: the engine composes that from the box's own
# hostname and the prefix the store carries.
#
# The role runs BEFORE keycloak + oauth2_proxy in converge.yml (single-pass
# converge): oauth2_proxy's validation probes the public auth.<zone> URL, which
# needs the tunnel up first when a token is present.

# Host engine binary (installed into /usr/local/bin by the catena-admin payload
# installer). SYNC.md is the contract.
cloudflared_sync_bin: "/usr/local/bin/catena-cloudflared-sync"

# The zone list is assembled by the host engine from the on-box store (the
# primary scalar plus whatever the Domains panel attached), capped by the
# licence the same store holds, and published to
# /var/lib/catena/cloudflare-zones.json after a successful converge. Nothing in
# this repo computes it, and nothing has to pass it between roles.

# The engine's spec pins live in the engine. The image, the Traefik ingress
# service, the overlay, the stop grace and the probe counts are product
# constants that catena-cloudflared-sync carries as its own defaults; a copy
# here would be a third one, beside the catena-admin reserved action and the
# engine, agreeing only by hand.
#
# The image pin lives there too: Renovate and Trivy track cloudflare/cloudflared
# in catena-admin, where the engine reads it. cloudflared is the
# highest-blast-radius service in the suite (a broken image kills the public
# path AND the route to catena-admin), so its version belongs in the file the
# host reads. Bumps stay manual and the managed-update engine rolls back on
# health regression.

# `cloudflare_api_base` lives in group_vars/all/main.yml so playbooks
# that hit the Cloudflare API without importing this role (e.g.
# decommission.yml's tunnel-delete leg) can resolve it from the same
# source.
