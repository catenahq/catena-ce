---
# Cloudflare tunnel converge -- unconditional dispatch to the host engine.
#
# The tunnel / wildcard DNS / ingress / cloudflared swarm-service logic (CF
# API find-or-create, DNS CNAME, ingress PUT, service deploy + token/network
# reconcile, edge->tunnel->Traefik chain probe) lives in the Go engine
# catena-cloudflared-sync. That binary ships in the catena-admin host payload
# and is installed to /usr/local/bin by reconcile/roles/payload, four roles ahead of
# this one (it is NOT license-gated -- the Cloudflare tunnel is a Community
# feature). See catena-admin cmd/catena-cloudflared-sync/SYNC.md for the
# contract.
#
# This role does ONE thing: dispatch the engine's `sync` on the host and
# print what it says. Idempotent -- a re-converge after the panel saved a token,
# or a bench that adopted one, finds everything already correct and no-ops.
#
# The engine decides whether there is anything to do. With no token in the store
# it prints its skip line and exits 0, and the tunnel is DEFERRED: the client
# enters the token in catena-admin > Settings, which validates it
# (cloudflared-check) and fires cloudflared-sync in the background. A
# present-but-INVALID token fails the converge here (the engine exits nonzero),
# preserving the fail-fast abort intent (fi_n4/fi_s5) rather than
# half-configuring a broken edge.
#
# The single-domain cap is enforced by the engine, which reads the licence out
# of the on-box store and decides for itself. This role passes no licence flag,
# because one verifier is the whole point: an Ansible fact computed by a second,
# Python implementation of licence verification is a second answer to the same
# question.
# A host with no entitlement converges the PRIMARY domain only and leaves any
# stored secondary domains intact for re-licensing (graceful degrade, never
# fail-closed).
#
# The engine also writes /var/lib/catena/cloudflare-zones.json after a
# successful converge: the list of domains this host actually serves. That file
# is what reconcile/roles/keycloak reads to route one auth.<zone> per attached domain, so
# the routing cannot advertise a domain the edge is not serving.

# The token gate lives in the ENGINE, not here. It reads
# /etc/catena/config.json itself and no-ops exit 0 with
# "cloudflared-sync: skipped (no token)" when the store holds none
# (cmd/catena-cloudflared-sync/SYNC.md). Asking the engine is asking the thing
# that will act on the answer. A gate on the Ansible side is a second
# implementation of "is there a token", and it can only read a fact
# load_onbox_config.yml publishes -- so any play that skips the loader sees no
# token on a host that has one.
#
# reconcile/roles/payload installs the engine right after bootstrap/roles/docker, four roles ahead
# of this one, so on a converge that owns the payload the binary is there. It
# has to be: keycloak and oauth2_proxy run next and wait on
# https://auth.<zone>/.well-known/openid-configuration, which only answers once
# this role has brought the edge up. So a missing engine is a hard stop here,
# with the reason attached: deferring reports success and spends the failure two
# roles later, against an edge nobody has configured.
#
# A host whose engines were staged OUT OF BAND (the bench does this from the
# image it builds on the VPS) is the one case where "not there yet" is
# legitimate: reconcile/roles/payload publishes catena_payload_engines_expected=false and
# the tunnel defers to the next converge, exactly as before. This is ORTHOGONAL
# to the invalid-token abort below -- a missing engine is not a bad token.
- name: "CF: is the tunnel engine expected on this host"
  ansible.builtin.include_role:
    name: common
    tasks_from: _payload_expected
  vars:
    _payload_paths:
      - "{{ cloudflared_sync_bin }}"

- name: "CF: the tunnel engine is missing from a converge that installs it"
  ansible.builtin.fail:
    msg: >-
      {{ cloudflared_sync_bin }} is absent although reconcile/roles/payload ran in this
      converge. The Cloudflare tunnel cannot be brought up, and reconcile/roles/keycloak
      and reconcile/roles/oauth2_proxy are about to wait on an edge that will never
      answer. Check the "Payload:" tasks above for why the extract from
      {{ catena_payload_image | default('the catena-admin image') }} did not
      land.
  when:
    - catena_payload_missing | length > 0
    - catena_payload_expected | bool

- name: "CF: engine staged out of band and not present -- tunnel deferred"
  ansible.builtin.debug:
    msg: >-
      {{ cloudflared_sync_bin }} is not on the host and this converge does not
      install it (CATENA_PAYLOAD_INSTALL=false). The Cloudflare tunnel will
      converge on the next run, or when catena-admin dispatches
      cloudflared-sync after the client saves a token.
  when:
    - catena_payload_missing | length > 0
    - not (catena_payload_expected | bool)

# Pinned before the next _payload_expected include overwrites the decision.
- name: "CF: pin whether the tunnel engine is here"
  ansible.builtin.set_fact:
    _cf_sync_present: "{{ catena_payload_missing | length == 0 }}"

# Bring the tunnel to desired state on the host. Runs on the VPS (the engine
# drives docker + the https chain probe locally). The token is NOT passed here
# -- the engine reads it from /etc/catena/config.json. fail-fast: a
# present-but-invalid token (or any failed converge step) exits nonzero and
# ABORTS the converge (fi_n4/fi_s5).
#
# Runs unconditionally. With no token the engine prints its skip line and exits
# 0, so the deferral happens inside the thing being deferred -- and the
# no-token path is exercised on every tokenless install rather than being the
# branch nothing takes.
- name: "CF: converge the tunnel via catena-cloudflared-sync (host engine)"
  ansible.builtin.command:
    argv:
      - "{{ cloudflared_sync_bin }}"
      - sync
  environment:
    # ONE per-host value. Everything else -- image, ingress service, network,
    # stop grace, probe counts -- is a product constant the engine already
    # carries as its own default; passing it here would make two copies to keep
    # in agreement by hand.
    #
    # The panel fires this same engine, so both dispatch paths must behave
    # identically: an engine that reads its caller's environment only works
    # from the caller it is written beside. That is also why the tunnel NAME is
    # not here -- the engine composes it from the box's own hostname and the
    # prefix in the store, so the panel path resolves the same name with nobody
    # rendering anything for it.
    #
    # Base domain: the engine resolves the primary zone BY NAME, tolerating an
    # account-scoped token that grants more than one zone. Without it the engine
    # falls back to requiring a single-zone-scoped token (grants exactly 1).
    CLOUDFLARE_PRIMARY_ZONE: "{{ cloudflare_zone }}"
  register: _cf_sync
  # The engine is internally idempotent (it owns the cloudflared re-encoded-
  # token no-op that fi_c6 guarded, plus the network/self-heal reconciles), and
  # emits no ansible-parsable changed signal, so report unchanged: a re-converge
  # must not trip the bench changed=0 idempotency gate on this single command.
  changed_when: false
  when: _cf_sync_present | default(false)

- name: "CF: engine summary"
  # Either "cloudflared-sync: ok tunnel=... zones=N" or
  # "cloudflared-sync: skipped (no token)" -- the engine says which, so this
  # prints it rather than deciding what happened a second time.
  #
  # STDERR TOO, on success. The engine writes its per-step decisions there --
  # which zone it resolved, whether the wildcard DNS and the tunnel ingress
  # are a noop or an update. The summary line alone cannot distinguish
  # "converged the right zone and the ingress was already correct" from
  # "converged the wrong zone and so it is", and bench run
  # 2026-09-02T01-47-44-372a has needed exactly that distinction: a host whose
  # tunnel ingress served an anchor's zone logged "ok tunnel=... zones=1" and
  # nothing else, leaving no way to recover which zone the engine converged.
  ansible.builtin.debug:
    msg: |
      {{ _cf_sync.stdout | default('(no summary line)') | trim }}

      engine detail:
      {{ _cf_sync.stderr | default('(no detail)') | trim }}

      DO NOT enable Let's Encrypt / HTTPS on Traefik -- Cloudflare terminates
      TLS at the edge and LE conflicts with the tunnel.
  when: _cf_sync_present | default(false)
