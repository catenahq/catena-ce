---
# Gatus, added as a catalog app -> gatus.<zone>.
#
# Config layout in the app's config volume ({{ gatus_host_config_dir }} on the host):
#   00-base.yaml          (the app's own base service: storage, title, self-check, alert)
#   40-infra.yaml         (catena-gatus-sync, from the infra spec below)
#   50-catena-apps.yaml   (catena-gatus-sync, per-timer)
#   99-<anything>.yaml    (operator-added, untouched)
#
# Gatus loads all *.yaml in the directory alphabetically, which is why the
# numeric prefix determines precedence / override order. The app mounts the
# volume read-only; gatus-sync and the operator write it from the host.

- name: "Gatus: ensure /etc/catena exists for infra spec"
  ansible.builtin.file:
    path: "{{ gatus_infra_spec_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Gatus: render infra-endpoint spec ({{ gatus_infra_spec_path }})"
  ansible.builtin.template:
    src: gatus-infra-spec.json.j2
    dest: "{{ gatus_infra_spec_path }}"
    owner: root
    group: root
    mode: "0644"
  register: _gatus_infra_spec

# The public route for this app is gatus-oauth2-proxy.yml, rendered by
# reconcile/roles/oauth2_proxy: it points Host(gatus.<zone>) at the gatus
# oauth2-proxy instance, which proxies here after auth.

# The publish is host-mode (swarm cannot bind 127.0.0.1), so the port is a
# real host bind and validate.yml's bind-drift check will see it. Declare it
# scope=loopback so the reconciler denies it on every interface but lo: the
# box reaches the port, nothing else does.
#
# bind=docker, NOT host. A swarm host-mode publish is DNAT'd by dockerd and
# never reaches ufw's INPUT chain, so a ufw deny alone leaves 18080 open on
# the bridge IP. The guard that works on the DNAT path is DOCKER-USER,
# which is what bind=docker asks for. Host-local readers are unaffected:
# 127.0.0.1 traffic is delivered on loopback and never traverses FORWARD.
- name: "Gatus: declare the host-side API port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/gatus.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": gatus_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "gatus",
           "comment": "Gatus API for host-side gatus-sync -- this host only"}
        ] | to_nice_json
      }}
  register: _gatus_ports_fragment

- name: "Gatus: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _gatus_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# Its one setting this converge owns is STATUS_HOST, the public address the
# alert body links to, empty while there is no domain. The app reads the
# Healthchecks ping key from the job monitor's provided values.
#
# No route of its own: its gate's route above is its one public path, and a
# default-priority route to the app would bypass the gate the moment that route
# was missing. The aggregate probe in main.yml verifies it is served.
- name: "Gatus: add the app"
  ansible.builtin.include_tasks: default_app.yml
  vars:
    default_app: "{{ default_apps | selectattr('app', 'eq', 'gatus') | first }}"
    default_app_env:
      STATUS_HOST: "{{ '' if (catena_public_surface_deferred | default(false) | bool) else infrastructure_gatus_hostname }}"
