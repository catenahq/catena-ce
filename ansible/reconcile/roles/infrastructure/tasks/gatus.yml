---
# Deploy Gatus as a swarm stack -> gatus.<zone>.
#
# Config layout on the host:
#   {{ gatus_host_config_dir }}/00-base.yaml          (Ansible-managed)
#   {{ gatus_host_config_dir }}/40-infra.yaml         (catena-gatus-sync, from the infra spec below)
#   {{ gatus_host_config_dir }}/50-catena-apps.yaml  (catena-gatus-sync, per-timer)
#   {{ gatus_host_config_dir }}/99-<anything>.yaml    (operator-added, untouched)
#
# Everything in /config is bind-mounted read-only into the container. Gatus
# loads all *.yaml in the directory alphabetically, which is why the
# numeric prefix determines precedence / override order.

- name: "Gatus: host config dir ({{ gatus_host_config_dir }})"
  ansible.builtin.file:
    path: "{{ gatus_host_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Gatus: render 00-base.yaml (alerting, UI and the self-check endpoint)"
  ansible.builtin.template:
    src: gatus-base.yaml.j2
    dest: "{{ gatus_host_config_dir }}/00-base.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _gatus_base_cfg

- name: "Gatus: ensure /etc/catena exists for infra spec"
  ansible.builtin.file:
    path: "{{ gatus_infra_spec_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Gatus: render infra-endpoint spec ({{ gatus_infra_spec_path }})"
  ansible.builtin.template:
    src: gatus-infra-spec.json.j2
    dest: "{{ gatus_infra_spec_path }}"
    owner: root
    group: root
    mode: "0644"
  register: _gatus_infra_spec

# The public route for this app is gatus-oauth2-proxy.yml, rendered by
# reconcile/roles/oauth2_proxy: it points Host(gatus.<zone>) at the gatus
# oauth2-proxy instance, which proxies here after auth.

# The publish is host-mode (swarm cannot bind 127.0.0.1), so the port is a
# real host bind and validate.yml's bind-drift check will see it. Declare it
# scope=loopback so the reconciler denies it on every interface but lo: the
# box reaches the port, nothing else does.
#
# bind=docker, NOT host. A swarm host-mode publish is DNAT'd by dockerd and
# never reaches ufw's INPUT chain, so a ufw deny alone leaves 18080 open on
# the bridge IP. The guard that works on the DNAT path is DOCKER-USER,
# which is what bind=docker asks for. Host-local readers are unaffected:
# 127.0.0.1 traffic is delivered on loopback and never traverses FORWARD.
- name: "Gatus: declare the host-side API port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/gatus.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": gatus_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "gatus",
           "comment": "Gatus API for host-side gatus-sync -- this host only"}
        ] | to_nice_json
      }}
  register: _gatus_ports_fragment

- name: "Gatus: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _gatus_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

- name: "Gatus: deploy as a swarm stack"
  ansible.builtin.include_tasks: swarm_stack.yml
  vars:
    svc_name: "{{ gatus_compose_name }}"
    svc_compose_content: "{{ lookup('template', 'gatus.compose.yml.j2') }}"
    # No route of its own: its gate's route above is its one public path, and
    # a default-priority route to the app would bypass the gate the moment
    # that route was missing.
    svc_domain_host: ""
    # Per-service readiness probe is deferred to the aggregate post-role
    # verification in main.yml -- the SSO chain (Keycloak + oauth2-proxy)
    # finishes settling during the surrounding infra deploys.
    svc_readiness_skip_reason: >-
      Verified by the aggregate post-role probe in main.yml.

# When 00-base.yaml changes, restart Gatus so the new endpoints / alert
# config take effect (Gatus loads config only at startup).
# 50-catena-apps.yaml restart-triggering is owned by gatus-sync itself.
#
# Swarm owns the task, so the restart goes through the service: its
# stop-first update stops the old task before the new one binds the
# host-mode port, where a `docker restart` of the task container races the
# replacement swarm starts ("Bind for 0.0.0.0:18080 failed: port is already
# allocated"). The update waits for the service to converge, including an
# update the stack deploy above left in flight.
- name: "Gatus: restart the service so base config reloads"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - --force
      - --quiet
      - "{{ gatus_compose_name }}_app"
  when: _gatus_base_cfg.changed
  changed_when: true
