---
# Nextcloud Talk + HPB post-deploy wiring.
#
# Installs the post-deploy wire script and opens no port: aio-talk's Janus
# uses TURN-only for media (TURN_DOMAIN points at the standalone coturn at
# turn.<zone>:5349, whose ports reconcile/roles/coturn declares), and the
# HPB's signaling endpoint is HTTP, which needs no host port either.
#
# POST-DEPLOY (catena-admin action "Wire Nextcloud Talk + HPB"): runs the
# `occ talk:turn:add` / `occ talk:stun:add` / `occ talk:signaling:add`
# calls inside the running Nextcloud container, on demand after a
# Portainer deploy. Backed by /usr/local/bin/catena-wire-nextcloud-talk-hpb
# (installed below from scripts/nextcloud-talk-hpb-wire.sh).
# Idempotent and auto-detecting: when the HPB signaling service does not
# answer, the script logs a skip message and exits 0.

- name: "Nextcloud Talk HPB: install host script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/nextcloud-talk-hpb-wire.sh"
    dest: /usr/local/bin/catena-wire-nextcloud-talk-hpb
    owner: root
    group: root
    mode: "0755"
