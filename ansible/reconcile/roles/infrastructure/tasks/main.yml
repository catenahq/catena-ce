---
# Orchestrator for reconcile/roles/infrastructure. Order matters:
#
# 1. portainer_endpoint.yml     -- resolve the Portainer local Docker endpoint
#                              id; capture _portainer_endpoint_id.
#                              Gated on portainer_api_key (minted in-role
#                              by reconcile/roles/portainer earlier in converge.yml).
# 2. gatus.yml / healthchecks.yml --
#    each calls swarm_stack.yml with its own compose YAML, domain and
#    port. All gated on portainer_api_key.
# 3. dashboard_sync.yml + gatus_sync.yml -- sync scripts + systemd timers.
#                              Gated on the API key. dashboard-sync owns
#                              auto-gated Traefik routes (Phase 4b
#                              retired its services.yaml writer);
#                              gatus-sync owns {{ gatus_host_config_dir }}/
#                              50-catena-apps.yaml.
#
# CF tunnel + DNS + cloudflared swarm service moved to reconcile/roles/cloudflare_tunnel
# on 2026-05-08 so converge.yml can deploy them BEFORE keycloak/oauth2_proxy --
# oauth2_proxy's wait-for-public-Keycloak task otherwise can't succeed on a
# fresh DR/migrate target in a single converge.
#
# The per-app oauth2-proxy instances and their `<app>-oauth2-proxy.yml`
# Traefik route files are rendered by reconcile/roles/oauth2_proxy (which runs before
# this role in converge.yml), so every gated public URL already resolves to its
# own auth proxy by the time this role's compose deploys land.

# Self-hosted SSO gates the four UIs; CF Tunnel is the only public ingress
# (owned by reconcile/roles/cloudflare_tunnel) and carries no Access policy of its own.
# Any CF Access application still present in the Cloudflare dashboard for
# this zone is NOT removed via API (avoids destructive cross-account action).
# Manual cleanup: dash.cloudflare.com -> Zero Trust -> Access -> Applications
# -> delete the four `<subdomain>.<zone>` entries.

# --- Everything below requires the Portainer API key. It is minted in-role
#     by reconcile/roles/portainer earlier in converge.yml (and self-heals a missing/
#     rejected key on every converge), so the block runs on a normal
#     converge; it skips cleanly only in the rare window before the key
#     exists. ------------------------------------------------------------
# The per-service stack deploys go through swarm_stack.yml. Nothing catena
# declares is deployed by the control plane any more: Portainer's database
# stays the record of CLIENT choices, which is the one state that cannot be
# recomputed, and nothing else. gatus_sync reads docker labels.
# There is no ACCESS_MODE toggle. An install with no Cloudflare token is the
# tunnel-deferred gate below -- the default path and the bench standard -- and
# it defers these services rather than dropping them: a mode that skipped them
# outright would leave a tailnet host with no monitoring plane and no SSO at
# all.
- name: "Resolve the tunnel-deferred gate"
  ansible.builtin.set_fact:
    # Tunnel-deferred gate. reconcile/roles/cloudflare_tunnel brings the edge up
    # only with a token in the on-box store AND its engine on the host; it pins
    # the second as _cf_sync_present and defers when the engine was staged out
    # of band and has not landed yet. Without both, no *.<zone> public hostname
    # serves, so everything below that needs the edge waits for the converge
    # that has it. Undefined (a tag-scoped play that skipped the tunnel role)
    # reads as present.
    _infra_edge_up: >-
      {{ (cloudflare_api_token | default('')) | length > 0
         and (_cf_sync_present | default(true) | bool) }}
  tags: [always]

# ─── catena-declared services (swarm stacks, no Portainer in the path) ────
#
# They deploy as swarm stacks (swarm_stack.yml) and touch no Portainer API, so
# they sit OUTSIDE the `portainer_api_key` block below. Inside it, the
# monitoring plane becomes a dependent of the control plane it reports on: a
# Portainer that will not start takes Gatus, Healthchecks and Beszel with it, at
# exactly the moment someone needs them to find out why.
#
# clamd did NOT come with them and is still gated below: a swarm service
# cannot attach to a bridge, and the attachable overlay it would need
# deadlocks against its own consumer gate. clamav.yml documents it.
#
# Portainer's DB stays the record of CLIENT choices, which is the one piece
# of state that cannot be recomputed. The app-wiring block below is still
# gated on it for that reason.
#
# include_tasks doesn't propagate tags to sub-tasks by default -- a
# top-level `tags:` here applies only to the include statement itself,
# so `--tags <name>` makes the include fire but every child task
# silently skips. `apply: tags:` pushes the tag down to every task
# inside the included file, which is what operators expect when they
# run `--tags gatus` / `--tags healthchecks` / etc.
- name: Gatus (monitor.<zone>)
  ansible.builtin.include_tasks:
    file: gatus.yml
    apply:
      tags: [gatus]
  tags: [gatus]

- name: Healthchecks (heartbeat.<zone>) -- cron/dead-man monitoring
  ansible.builtin.include_tasks:
    file: healthchecks.yml
    apply:
      tags: [healthchecks]
  tags: [healthchecks]

# Beszel -- hub + agent resource monitor (CPU/memory/network/disk +
# temperature/load history with built-in threshold alerting). The
# agent collects per-container + per-host metrics over docker.sock;
# the hub stores history and serves hub.<zone> (admin-gated via
# oauth2-proxy). A small shim forwards Beszel threshold alerts into
# the Healthchecks plane. Part of the base plane, not opt-in -- the
# No BESZEL_ENABLED off-switch: this task is unconditional.
- name: Beszel (hub + agent + Healthchecks alert shim)
  ansible.builtin.include_tasks:
    file: beszel.yml
    apply:
      tags: [beszel]
  tags: [beszel]

# ─── client-template wiring (needs Portainer alive) ──────────────────────
- name: Has Portainer API key -> wire the client-template apps
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10
  block:
    # Reachability gate for everything below: the client apps these tasks
    # wire are Portainer stacks, so a Portainer that does not answer means
    # there is nothing to wire. It does not feed a stack create/update: the
    # catena-declared services above deploy as swarm stacks, so what it
    # asserts is simply that the control plane is answering.
    - name: "Resolve the Portainer endpoint id"
      ansible.builtin.include_tasks:
        file: portainer_endpoint.yml
        apply:
          tags: [always]
      tags: [always]

    # Shared ClamAV (clamd). Creates the external catena-clamav network
    # (the mailserver + nextcloud templates depend on it existing before
    # a client clicks Deploy) and deploys one clamd for both consumers.
    # Runs before the per-app wiring below so the network + scanner are
    # ready when those land.
    #
    # The one catena-declared service still INSIDE this gate. It deploys
    # through the Portainer stack API -- see the header of clamav.yml for
    # why it could not follow the others onto swarm -- so it needs both a
    # live Portainer and the endpoint id resolved above.
    - name: Shared ClamAV (clamd, used by mail + Nextcloud)
      ansible.builtin.include_tasks:
        file: clamav.yml
        apply:
          tags: [clamav]
      tags: [clamav]

    # EP3: Nextcloud native OIDC. Realm client is registered eagerly
    # so the discovery URL works the moment the operator clicks Deploy
    # in the Portainer marketplace. The occ-based provider registration
    # runs only if the Nextcloud container is currently up (no-op on first
    # converge before Deploy). See nextcloud_oidc.yml header for the
    # full atomicity/idempotency notes.
    - name: Nextcloud native OIDC (Keycloak realm client + occ wiring)
      ansible.builtin.include_tasks:
        file: nextcloud_oidc.yml
        apply:
          tags: [nextcloud_oidc]
      tags: [nextcloud_oidc]

    # Element / Matrix OIDC. Synapse reads the OIDC config straight
    # from its homeserver.yaml (rendered by the element template's
    # catena-synapse-init.py from env vars at container start). All
    # this converge step does is register the matching `element`
    # client in Keycloak so the discovery URL works the moment the
    # operator clicks Deploy. No post-deploy hook needed -- the
    # template's env_managed_keys has dashboard-sync re-inject
    # OIDC_CLIENT_SECRET whenever it drifts.
    - name: Element / Matrix OIDC (Keycloak realm client)
      ansible.builtin.include_tasks:
        file: element_oidc.yml
        apply:
          tags: [element_oidc]
      tags: [element_oidc]

    # Mailserver TLS cert (mail.<zone>). Opt-in template: issues a
    # Let's Encrypt cert via DNS-01 and injects it into the dms container
    # (SSL_TYPE=manual). MUST run BEFORE mailserver_accounts: docker-
    # mailserver has two hard boot gates -- (1) >=1 mailbox, polled for
    # 120s, then (2) the manual cert. The container is in a STABLE, exec-
    # able window only while gate 1 is unmet (no account), so we docker cp
    # the cert in during that window. Adding the account last (next task)
    # then lets the boot proceed past gate 1 to gate 2 with the cert
    # already present. No-ops on tenants without the mailserver (no dms).
    - name: Mailserver TLS cert (Let's Encrypt DNS-01 -> dms inject + reload)
      ansible.builtin.include_tasks:
        file: mailserver_cert.yml
        apply:
          tags: [mailserver_cert]
      when:
        - _infra_edge_up
      tags: [mailserver_cert]

    # Mailserver accounts. docker-mailserver will not start Dovecot until
    # >=1 mailbox exists. Bootstrap postmaster@<zone> as a real mailbox
    # here -- this is the action that unblocks the boot (gate 1), and since
    # the cert task above already injected the cert (gate 2), the same boot
    # proceeds to start Dovecot. The dashboard-sync reconciler manages the
    # rest from Keycloak and never deletes postmaster. No-ops without the
    # mailserver (no dms container).
    # Tunnel-deferred: adding the postmaster mailbox unblocks gate 1, and DMS
    # then proceeds to gate 2 expecting the manual cert. On a tokenless install
    # the cert task above is deferred, so adding the account here would strand
    # Dovecot at gate 2 (no cert). Defer the whole mailserver wiring chain
    # (accounts + oidc + filtering + canary) until a Cloudflare token is saved
    # and a converge re-runs it in the correct cert -> account -> boot order.
    # The dms container stays in its stable, no-account gate-1 window meanwhile.
    - name: Mailserver accounts (bootstrap postmaster mailbox so DMS can start)
      ansible.builtin.include_tasks:
        file: mailserver_accounts.yml
        apply:
          tags: [mailserver_accounts]
      when: _infra_edge_up
      tags: [mailserver_accounts]

    # Mailserver SSO. Opt-in template: registers the roundcube +
    # mailserver-introspect Keycloak clients and injects the Dovecot
    # introspection config + Roundcube oauth config when the mailserver
    # template is deployed. No-ops on tenants without it (no dms container).
    - name: Mailserver OIDC (Keycloak clients + Dovecot/Roundcube OAuth config)
      ansible.builtin.include_tasks:
        file: mailserver_oidc.yml
        apply:
          tags: [mailserver_oidc]
      when:
        - _infra_edge_up
      tags: [mailserver_oidc]

    # Mailserver spam + antivirus filtering. Injects rspamd local.d
    # drop-ins (Spamhaus DQS RBL, shared-clamd antivirus, SMB action
    # thresholds, soft-reject-on-AV-fail) into the dms container. No-ops
    # without the mailserver template (no dms container).
    - name: Mailserver filtering (rspamd DQS RBL + antivirus + thresholds)
      ansible.builtin.include_tasks:
        file: mailserver_filtering.yml
        apply:
          tags: [mailserver_filtering]
      when: _infra_edge_up
      tags: [mailserver_filtering]

    # Mailserver DNS. ops owns only the safe mail-specific records (the
    # gray-cloud mail A + MTA-STS + TLS-RPT TXT); MX/SPF/DKIM/DMARC/rDNS
    # stay operator-manual (see the runbook). No-ops without the dms
    # container.
    - name: Mailserver DNS (mail A + MTA-STS + TLS-RPT via Cloudflare)
      ansible.builtin.include_tasks:
        file: mailserver_dns.yml
        apply:
          tags: [mailserver_dns]
      when:
        - _infra_edge_up
      tags: [mailserver_dns]

    # Mail canary host timer. Proves dms is listening on 25/993 + that the
    # rspamd->clamav AV path detects EICAR (docker-exec rspamc). Wrapper
    # self-gates (no-op without a dms container).
    - name: Mail canary (ports + EICAR rspamc check via Healthchecks)
      ansible.builtin.include_tasks:
        file: mailserver_canary.yml
        apply:
          tags: [mailserver_canary]
      when:
        - _infra_edge_up
      tags: [mailserver_canary]

    # The five includes above all defer on a tokenless host, and all five
    # skipped with NO OUTPUT. The reasoning is sound -- adding the postmaster
    # account before the cert exists strands Dovecot at gate 2 -- but the
    # silence is not part of it: the converge printed a clean run on a host
    # with no mail TLS, no postmaster mailbox, no rspamd antivirus and no
    # canary, and nothing distinguished that from a host where all five had
    # succeeded. One notice rather than five: they share one condition, and
    # five copies of the same line trains the reader to skip it. Same shape
    # as the verify_gated_services notice further down.
    - name: "Mailserver chain: tunnel deferred -- five wiring steps skipped (no Cloudflare edge yet)"
      ansible.builtin.debug:
        msg: >-
          The Cloudflare edge is not up on this converge (no API token in the
          on-box store, or the tunnel engine is not on the host yet), so the
          mailserver wiring chain is DEFERRED, not applied: TLS cert injection, the
          postmaster mailbox bootstrap, OIDC (Roundcube + Dovecot
          introspection), rspamd filtering (DQS RBL + antivirus) and the mail
          canary. The dms container stays in its stable no-account window
          meanwhile. Order matters -- the cert has to land before the first
          account or Dovecot strands at gate 2 -- which is why the whole
          chain waits rather than running the half that would work. The next
          converge with the edge up applies it.
      when: not _infra_edge_up
      tags: [mailserver_accounts, mailserver_cert, mailserver_oidc,
             mailserver_filtering, mailserver_canary]

    # Nextcloud Talk + HPB. Same converge / post-deploy split as OIDC:
    # converge installs the wire script + ufw range when HPB is live;
    # the Actions-tab button runs the in-container occ-based wiring on
    # demand. The wire script itself auto-detects whether the HPB
    # compose block is commented out -- safe to fire unconditionally.
    - name: Nextcloud Talk + HPB (wire script + media-range ufw)
      ansible.builtin.include_tasks:
        file: nextcloud_talk_hpb.yml
        apply:
          tags: [nextcloud_talk_hpb]
      tags: [nextcloud_talk_hpb]

    # Nextcloud office editors (Collabora / OnlyOffice). Pure host-side
    # wiring-script install; no Keycloak realm client. The matching
    # catena templates ship their own composes; the Actions-tab buttons
    # do the post-deploy occ wiring. See nextcloud_office.yml header.
    - name: Nextcloud office editors (Collabora + OnlyOffice wire scripts)
      ansible.builtin.include_tasks:
        file: nextcloud_office.yml
        apply:
          tags: [nextcloud_office]
      tags: [nextcloud_office]

    # Nextcloud antivirus. Pure host-side wire-script install (mirrors
    # nextcloud_office.yml). The shared clamd is deployed by clamav.yml
    # above; the Actions-tab button does the in-container occ wiring on
    # demand (files_antivirus Daemon mode -> clamav:3310).
    - name: Nextcloud antivirus (files_antivirus -> shared clamd wire script)
      ansible.builtin.include_tasks:
        file: nextcloud_antivirus.yml
        apply:
          tags: [nextcloud_antivirus]
      tags: [nextcloud_antivirus]

    # Nextcloud first-party apps (Mail today; more later). Pure host-side
    # wire-script install. Mail is the prerequisite for the Email Archive
    # feature (sidecar reads oc_mail_accounts). Idempotent on every
    # converge; Actions-tab button does the in-container occ work on demand.
    - name: Nextcloud first-party apps (Mail wire script)
      ansible.builtin.include_tasks:
        file: nextcloud_apps.yml
        apply:
          tags: [nextcloud_apps]
      tags: [nextcloud_apps]

    # Rocket.Chat + bundled Jitsi. Wire script only: JVB's media port is a
    # swarm host-mode publish, which Docker DNATs past ufw INPUT, so the
    # registry learns it from the template's vps.expose.udp label instead.
    - name: Rocket.Chat + Jitsi (wire script)
      ansible.builtin.include_tasks:
        file: rocketchat_jitsi.yml
        apply:
          tags: [rocketchat_jitsi]
      tags: [rocketchat_jitsi]


    # Productized WordPress: post-deploy plugin curation + config.
    # Pre-installs the lean plugin stack (kadence-blocks, performance-
    # lab, NPP cache purge/preload, redis-cache, wp-mail-smtp, etc.)
    # and configures the cross-plugin wiring (Redis object cache,
    # FastCGI cache purge, Performance Lab module enablement). Skips
    # cleanly when the wp container is not deployed or the in-browser
    # install wizard has not yet been run.
    - name: WordPress curated plugin install + config (post-deploy wp-cli)
      ansible.builtin.include_tasks:
        file: wordpress_plugins.yml
        apply:
          tags: [wordpress_plugins]
      tags: [wordpress_plugins]

    - name: dashboard-sync script + systemd timer
      ansible.builtin.include_tasks:
        file: dashboard_sync.yml
        apply:
          tags: [dashboard_sync]
      tags: [dashboard_sync]

    # Aggregate end-of-role readiness probe for the gated services.
    # Deferred here (rather than per-service inside each swarm_stack
    # include) so the SSO chain (Keycloak + oauth2-proxy) has the full
    # wall-clock of the other infra deploys to finish settling before
    # we test. Fails fast with diagnostic output if any gated app's
    # public URL doesn't respond with 200/302/etc. Total additional
    # wall clock on a healthy run: 6 probes × ~1s each = 6s.
    # Gated on the edge too: while the tunnel is deferred none of these public
    # *.<zone> URLs serve, and the converge that brings the edge up runs this
    # probe.
    - name: Verify gated services serve healthy HTTP
      ansible.builtin.include_tasks:
        file: verify_gated_services.yml
        apply:
          tags: [verify_gated]
      when:
        - _infra_edge_up
        - not (catena_public_surface_deferred | default(false) | bool)
      tags: [verify_gated]

    - name: "Verify gated services: tunnel deferred -- skipping public-URL probe (no Cloudflare edge yet)"
      ansible.builtin.debug:
        msg: >-
          The Cloudflare tunnel is deferred on this converge (no API token in
          the on-box store, or the tunnel engine is not on the host yet), so the
          gated *.{{ cloudflare_zone | default('<zone>') }} URLs do not serve.
          Skipping the public-URL readiness probe until a converge with the
          edge up.
      when:
        - not _infra_edge_up
      tags: [verify_gated]

    # A SECOND WAY TO HAVE NO PUBLIC URLS, which the token check does not
    # catch: the domain is its own field, so a host can hold a token while its
    # zone is still empty.
    #
    # The probe would then GET https://monitor./ three times over, twelve
    # retries apiece, and call the result a service verdict.
    - name: "Verify gated services: no domain yet -- skipping public-URL probe"
      ansible.builtin.debug:
        msg: >-
          No domain is configured, so there are no public URLs to probe. The
          shared services are running and reachable on the private network.
          Enter a domain in the dashboard's Settings; the next converge
          publishes them and this probe starts checking them.
      when:
        - _infra_edge_up
        - catena_public_surface_deferred | default(false) | bool
      tags: [verify_gated]

# gatus-sync reads CLIENT-app monitoring from `docker ps` labels
# (vps.route.host + com.docker.stack.namespace), no control-plane API -- so
# it runs on any converge, OUTSIDE the Portainer-key-gated block above (a
# partial --tags infrastructure run before reconcile/roles/portainer ran must still
# install it).
- name: gatus-sync script + systemd timer
  ansible.builtin.include_tasks:
    file: gatus_sync.yml
    apply:
      tags: [gatus, gatus_sync]
  tags: [gatus, gatus_sync]

- name: Note -- Portainer-managed services skipped (no API key yet)
  ansible.builtin.debug:
    msg: >-
      portainer_api_key not set. Gatus / Healthchecks / Recovery
      deploys skipped. reconcile/roles/portainer mints it on a converge (it may not be
      in scope yet on a partial --tags infrastructure run before reconcile/roles/portainer
      ran); re-run a full site converge, or --tags portainer,infrastructure
      --limit {{ inventory_hostname }}.
  when: portainer_api_key is not defined or (portainer_api_key | length) < 10
