---
# Resolve the dms container ONCE, for every step of the mailserver chain.
#
# WHY THIS IS SHARED. mailserver_cert.yml, mailserver_accounts.yml and
# mailserver_oidc.yml all need the same answer, and a `docker ps --filter
# label=vps.component=dms` per caller is three copies of one lookup, each
# sampled at a different second of the converge -- against the one container on
# the host that is deliberately not up yet.
#
# THE DEADLOCK. docker-mailserver polls 120s for at least one mailbox and shuts
# down without one. Until the chain gives it a cert and postmaster@ it cycles
# up-and-down forever, so it is absent from `docker ps` for a slice of every
# cycle. A single sample that lands in a gap returns empty; the step gates on
# that emptiness and skips; and the converge whose entire job was to unblock
# dms finishes green having done nothing. dms is missing BECAUSE it has no
# mailbox, and the task that creates the mailbox skips BECAUSE it is
# missing.
#
# Bench run 2026-08-25T18-01-29-b726 at cf_activate stage-3b has shown that
# shape: the cert step located the container and, seconds later, the accounts
# step did not. Whether an install completes comes down to which phase of a
# restart cycle each lookup samples.
#
# THE DISCRIMINATOR is the swarm SERVICE, which exists continuously from deploy
# to teardown. "No service" is a genuine not-deployed and must stay instant --
# most hosts never deploy the mailserver and none of them should pay a timeout
# to establish it. "Service but no container" is the repairable state, and it
# is worth waiting out.
#
# Sets, for the caller:
#   mailserver_deployed     -- bool, the stack exists
#   mailserver_dms_ct       -- container name, or '' when there is none

- name: "Mailserver: is the stack deployed at all?"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - ls
      - --filter
      - "label=com.docker.stack.namespace=catena-mailserver"
      - --format
      - "{{ '{{' }}.Name{{ '}}' }}"
  register: _ms_locate_svc
  changed_when: false

- name: "Mailserver: wait for a running dms container"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --filter label=vps.component=dms \
      --format '{{ "{{" }}.Names{{ "}}" }}' | head -n1
  args:
    executable: /bin/bash
  register: _ms_locate_ct
  changed_when: false
  # 18 x 10s spans several full cycles of a 120s account-wait plus restart, so
  # a flapping dms is caught rather than missed. failed_when is false because
  # exhausting the retries is not itself the verdict -- the caller decides,
  # and mailserver_accounts fails loudly on it.
  until: (_ms_locate_ct.stdout | default('') | trim | length) > 0
  retries: 18
  delay: 10
  failed_when: false
  when: (_ms_locate_svc.stdout | default('') | trim | length) > 0

- name: "Mailserver: publish the resolved container to the chain"
  ansible.builtin.set_fact:
    mailserver_deployed: >-
      {{ (_ms_locate_svc.stdout | default('') | trim | length) > 0 }}
    mailserver_dms_ct: "{{ _ms_locate_ct.stdout | default('') | trim }}"

# THE VERDICT LIVES HERE, so every caller gets the same one.
#
# One verdict, because the callers cannot each reach their own and still agree:
# a loud failure in mailserver_accounts and a debug-and-skip in mailserver_oidc
# for the same host state leaves a host whose dms is deployed but never comes up
# with its SSO wiring silently not written, on a converge that reports success.
# Nothing observes dovecot-oauth2.conf.ext, so that state stays invisible until
# a user cannot log into webmail. From a single reading the two cases are
# indistinguishable, which is exactly the difference the fact above records.
#
# "No service" stays free: most hosts never deploy the mailserver, this whole
# chain no-ops for them, and that is the case the debug lines in the callers are
# for. What cannot pass quietly is a stack that exists with no container behind
# it, which is a broken deploy rather than an absent one.
- name: "Mailserver: the stack is deployed but dms never appeared"
  ansible.builtin.fail:
    msg: >-
      The catena-mailserver stack exists but no dms container came up within
      three minutes. This is NOT the "template not deployed" case -- something
      is stopping the task from starting at all, and every step of the
      mailserver chain (TLS cert, postmaster mailbox, Dovecot OIDC, rspamd
      filtering, mail DNS) needs a running container to act on. Check
      `docker service ps --no-trunc catena-mailserver_dms` for the task error
      and `docker logs` on the most recent attempt.
  when:
    - mailserver_deployed | bool
    - (mailserver_dms_ct | length) == 0
