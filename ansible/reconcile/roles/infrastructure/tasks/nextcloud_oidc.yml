---
# Nextcloud native OIDC against Keycloak.
#
# Nextcloud's Keycloak client is its own sign-in entry, which catena-admin's
# settings sync (dashboard-sync) makes from the template's vps.auth.oidc
# labels; the same pass writes the entry's OIDC_CLIENT_ID,
# OIDC_CLIENT_SECRET and OIDC_ISSUER_URL into the stack env, which the
# template maps onto NEXTCLOUD_OIDC_*. Registering that provider inside
# Nextcloud is the `occ user_oidc:provider` call of the catena-admin action
# "Wire Nextcloud OIDC", run on demand against the running container. This
# file installs the host script behind that action,
# /usr/local/bin/catena-wire-nextcloud-oidc (scripts/wire-nextcloud-oidc.sh).
#
# Why an action: a catalog deploy is not followed by a converge. A converge
# runs at install, on an update, from the panel, or on the scheduled
# converge lane a licensed host can turn on, so wiring an app's OIDC the
# first time it is deployed cannot wait for one.
#
# Idempotency: the copy is idempotent, and the host script is upsert-safe
# (user_oidc:provider create-or-update by identifier).

# Backs the "Wire Nextcloud OIDC" catena-admin action defined in the
# catalog at reconcile/roles/catena-admin/templates/actions.yml.j2. That catalog
# is rendered into the host dispatch table + allow-list by
# reconcile/roles/catena-admin/tasks/catalog.yml.
- name: "Nextcloud OIDC: install host script (/usr/local/bin/catena-wire-nextcloud-oidc)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/wire-nextcloud-oidc.sh"
    dest: /usr/local/bin/catena-wire-nextcloud-oidc
    owner: root
    group: root
    mode: "0755"
