---
# The names the mailserver stack runs under, for the certificate and the mail DNS
# records. A primary-domain change does not move the stack (its hostname and
# mail domain are baked into the deployed stack), so these follow the stack and
# not cloudflare_zone. The service spec holds both for as long as the service
# exists, whether or not dms is up.
#
# Sets, for the caller:
#   _ms_names_known            -- bool, docker described the service and it has a
#                                 hostname. Callers run after the service was
#                                 found, so a failed inspect is an error: both
#                                 names are then empty and nothing is issued or
#                                 published.
#   mailserver_stack_hostname  -- the stack's MAIL_HOSTNAME ('' when unknown)
#   mailserver_stack_domain    -- the stack's MAIL_DOMAIN ('' when unknown)
#   _ms_host_zone_id           -- id of the Cloudflare zone the hostname is in,
#                                 '' when the token reaches none
#   _ms_domain_zone_id         -- the same for the mail domain
#   _ms_host_reachable         -- bool, the hostname is in a zone the token reaches
#   _ms_domain_reachable       -- bool, the mail domain is in one
#
# A zone the token reaches is cloudflare_zone or one the token lists
# (_mailserver_zones.yml, run first under the `edge` tag: a restore converge
# skips it and this file then sees cloudflare_zone alone). The longest zone that
# contains the name wins.

- name: "Mailserver names: read the hostname and mail domain the stack runs under"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - inspect
      - --format
      - "{{ '{{' }}.Spec.TaskTemplate.ContainerSpec.Hostname{{ '}}' }}{{ '{{' }}println{{ '}}' }}{{ '{{' }}range .Spec.TaskTemplate.ContainerSpec.Env{{ '}}' }}{{ '{{' }}println .{{ '}}' }}{{ '{{' }}end{{ '}}' }}"
      - catena-mailserver_dms
  register: _ms_names_stack
  changed_when: false
  failed_when: false

- name: "Mailserver names: choose the hostname and mail domain"
  ansible.builtin.set_fact:
    mailserver_stack_hostname: >-
      {{ (_ms_names_stack.stdout_lines | default([]) | first | default('') | trim)
         if (_ms_names_stack.rc | default(1)) == 0 else '' }}
    mailserver_stack_domain: >-
      {% set ns = namespace(d='') %}{% if (_ms_names_stack.rc | default(1)) == 0 %}{% for e in _ms_names_stack.stdout_lines | default([]) %}{% if e.startswith('POSTMASTER_ADDRESS=') and '@' in e %}{% set ns.d = e.split('@')[-1] | trim %}{% endif %}{% endfor %}{% endif %}{{ ns.d }}
    _ms_names_known: >-
      {{ (_ms_names_stack.rc | default(1)) == 0
         and (_ms_names_stack.stdout_lines | default([]) | first | default('') | trim | length) > 0 }}
    _ms_zone_index: >-
      {{ (((_ms_names_zones | default({})).get('json', {}).get('result', []))
          if (_ms_names_zones | default({})).get('status', 0) == 200 else [])
         + [{'name': cloudflare_zone, 'id': cloudflare_zone_id | default('')}] }}

- name: "Mailserver names: find the zone of each name"
  ansible.builtin.set_fact:
    _ms_host_zone: >-
      {% set ns = namespace(z='') %}{% for e in _ms_zone_index %}{% if (mailserver_stack_hostname == e.name or mailserver_stack_hostname.endswith('.' ~ e.name)) and (e.name | length) > (ns.z | length) %}{% set ns.z = e.name %}{% endif %}{% endfor %}{{ ns.z }}
    _ms_domain_zone: >-
      {% set ns = namespace(z='') %}{% for e in _ms_zone_index %}{% if (mailserver_stack_domain == e.name or mailserver_stack_domain.endswith('.' ~ e.name)) and (e.name | length) > (ns.z | length) %}{% set ns.z = e.name %}{% endif %}{% endfor %}{{ ns.z }}

- name: "Mailserver names: publish the zone ids"
  ansible.builtin.set_fact:
    _ms_host_reachable: "{{ (_ms_host_zone | length) > 0 }}"
    _ms_domain_reachable: "{{ (_ms_domain_zone | length) > 0 }}"
    _ms_host_zone_id: >-
      {{ (_ms_zone_index | selectattr('name', 'equalto', _ms_host_zone) | map(attribute='id') | first | default(''))
         if (_ms_host_zone | length) > 0 else '' }}
    _ms_domain_zone_id: >-
      {{ (_ms_zone_index | selectattr('name', 'equalto', _ms_domain_zone) | map(attribute='id') | first | default(''))
         if (_ms_domain_zone | length) > 0 else '' }}
