---
# Deploy one catena-DECLARED compose stack as SWARM services. No Portainer
# in the path.
#
# WHY. Every app in this file is something catena declares -- the monitoring
# plane (gatus, healthchecks, beszel), the SSO plane (keycloak,
# oauth2-proxy), the shared clamd. They were deployed through the Portainer
# stack API, which made Portainer a dependency of the things that report on
# Portainer: a control plane that would not start took the monitors down with
# it, at exactly the morning somebody needed them to find out why. Portainer's
# DB stays the record of CLIENT choices -- the one state that cannot be
# recomputed -- and nothing else.
#
# Inputs (caller sets via include_tasks vars) -- unchanged names, so the
# nine call sites keep their shape:
#
#   svc_name            -- stack name (also the compose project label and the
#                          prefix of every service/container it creates)
#   svc_compose_content -- the full compose YAML as a string
#   svc_domain_host     -- FQDN to route to this app ("" = intra-cluster only)
#   svc_domain_extra_hosts -- additional Host() rules on the same router
#   svc_domain_service  -- the network alias the Traefik route targets
#   svc_domain_port     -- backend port inside the container
#   svc_readiness_url / svc_readiness_ok_codes / svc_readiness_validate_certs
#   svc_readiness_skip_reason
#
# There is no `svc_env`. Values reach these services from the on-box store
# through the compose template, which is the single read path: nothing here
# is edited in a stack editor, so there is no operator-typed value to
# preserve across a redeploy.
#
# `docker stack deploy --detach=false` is synchronous: it returns only once
# every service in the file has converged (or failed), which is what the
# Portainer create/update call gave us and what the readiness probe below
# still does not replace -- converged means the tasks are RUNNING, not that
# the app is serving healthy HTTP through Traefik.

- name: "Swarm: stack file dir ({{ swarm_stack_dir }})"
  ansible.builtin.file:
    path: "{{ swarm_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The rendered file is kept on the host rather than piped through stdin so a
# failed deploy is diagnosable after the fact: `docker stack deploy -c
# /etc/catena/stacks/<name>.yml <name>` reproduces the exact converge by
# hand. 0640 because a compose body can carry a credential.
- name: "Swarm: write the stack file ({{ svc_name }})"
  ansible.builtin.copy:
    content: "{{ svc_compose_content }}"
    dest: "{{ swarm_stack_dir }}/{{ svc_name }}.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true

- name: "Swarm: initialize deploy attempt state ({{ svc_name }})"
  ansible.builtin.set_fact:
    _swarm_deploy_done: false
    _swarm_deploy_transient: false
    _swarm_deploy_addr_conflict: false

- name: "Swarm: deploy with retry on registry transient ({{ svc_name }})"
  ansible.builtin.include_tasks: _swarm_stack_deploy_attempt.yml
  loop: "{{ range(1, (infrastructure_deploy_max_attempts | default(3)) + 1) | list }}"
  loop_control:
    loop_var: _swarm_deploy_attempt_n
  when: not _swarm_deploy_done

- name: "Swarm: fail if all retries exhausted on registry transients ({{ svc_name }})"
  ansible.builtin.fail:
    msg: >-
      Swarm stack deploy for {{ svc_name }} failed all
      {{ infrastructure_deploy_max_attempts | default(3) }} attempts on
      registry transients. Reproduce with:
      docker stack deploy --detach=false -c
      {{ swarm_stack_dir }}/{{ svc_name }}.yml {{ svc_name }}
  when: not _swarm_deploy_done

# Routing: write a Traefik file-provider route that catena-traefik serves
# directly. Unchanged from the Portainer path -- routing was never the
# control plane's job, so nothing here moves.
#
# Opt-out: intra-cluster-only services (e.g. oauth2-proxy, reached by their
# catena-network alias) pass svc_domain_host="" -> the route file is removed
# instead of written.
- name: "Route: write Traefik file-provider route ({{ svc_name ~ ' -> ' ~ svc_domain_host }})"
  ansible.builtin.template:
    # Explicit playbook_dir-relative path: this file is include_tasks'd from
    # OTHER roles (keycloak, oauth2_proxy). Ansible resolves a bare `src:`
    # against the CALLING role's templates/ dir, so a bare name is not found
    # when the caller is keycloak. Anchor it to infrastructure/templates.
    src: "{{ playbook_dir }}/../reconcile/roles/infrastructure/templates/app-route.yml.j2"
    dest: "{{ traefik_dynamic_dir }}/{{ svc_name }}-route.yml"
    owner: root
    group: root
    mode: "0644"
  when: svc_domain_host | default('') | length > 0

- name: "Route: remove Traefik route for intra-cluster-only service ({{ svc_name }})"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/{{ svc_name }}-route.yml"
    state: absent
  when: svc_domain_host | default('') | length == 0

# Atomicity: a converged stack means every task reached RUNNING -- NOT that
# the app is serving healthy HTTP. The tunnel + Traefik + container-init
# chain can take tens of seconds after that. Probe the public URL before
# handing control back to the caller.
- name: "Swarm: wait for public URL to serve healthy HTTP ({{ svc_name }})"
  ansible.builtin.uri:
    url: "{{ svc_readiness_url }}"
    method: GET
    status_code: "{{ svc_readiness_ok_codes | default([200, 204, 301, 302]) }}"
    validate_certs: "{{ svc_readiness_validate_certs | default(true) }}"
    follow_redirects: none
    return_content: false
    timeout: 10
  register: _svc_readiness
  retries: "{{ infrastructure_readiness_poll_retries | default(60) }}"
  delay: "{{ infrastructure_readiness_poll_delay | default(5) }}"
  until: _svc_readiness.status in (svc_readiness_ok_codes | default([200, 204, 301, 302]))
  when:
    - svc_readiness_url is defined
    - svc_readiness_url | length > 0
  delegate_to: localhost
  become: false

- name: "Swarm: log intentional readiness-probe skip ({{ svc_name }})"
  ansible.builtin.debug:
    msg: >-
      Swarm[{{ svc_name }}]: readiness probe intentionally skipped --
      {{ svc_readiness_skip_reason }}
  when:
    - svc_readiness_url is not defined or (svc_readiness_url | length) == 0
    - svc_readiness_skip_reason is defined
    - svc_readiness_skip_reason | length > 0

- name: "Swarm: warn if no readiness probe configured ({{ svc_name }})"
  ansible.builtin.debug:
    msg: >-
      No svc_readiness_url set for {{ svc_name }}; skipping post-deploy HTTP
      probe. The caller is relying on stack convergence alone, which does NOT
      confirm the app is serving healthy traffic. Add a probe URL -- or set
      svc_readiness_skip_reason to declare the skip intentional.
  when:
    - svc_readiness_url is not defined or (svc_readiness_url | length) == 0
    - svc_readiness_skip_reason is not defined or (svc_readiness_skip_reason | length) == 0
