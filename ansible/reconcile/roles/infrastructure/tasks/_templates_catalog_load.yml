---
# Load the catenahq/catena-templates catalog and expose it as the
# `catena_template_catalog` fact.
#
# Source URL defaults to the public raw URL of catenahq/catena-templates. The
# controller running ansible-playbook can override with the env var
# CATENAHQ_TEMPLATES_BASE (e.g. file:///path/to/local/templates checkout)
# for bench scenarios or local dev against unpushed catalog changes.
#
# Idempotent: gated on `catena_template_catalog is not defined`. Safe
# to include multiple times in the same play.
#
# Include this file from a task list. Do NOT include it from a play
# block (uses set_fact which is fine in tasks, not at play level).

- name: "templates_catalog: resolve catenahq/catena-templates base"
  ansible.builtin.set_fact:
    _catenahq_templates_base: >-
      {{
        lookup('env', 'CATENAHQ_TEMPLATES_BASE')
        | default('https://raw.githubusercontent.com/catenahq/catena-templates/main', true)
      }}
  when: _catenahq_templates_base is not defined

- name: "templates_catalog: fetch catalog list"
  # url lookup defaults split_lines=true which silently turns the
  # multi-line document into a list-of-lines that gets comma-joined
  # before parsing, and the parse then fails somewhere unhelpful. file
  # lookup does not split, so file:// works either way; the explicit
  # kwarg keeps http(s) and file:// paths producing the same raw text.
  #
  # catalog.json is GENERATED by catena-templates (from its per-template
  # sources/) and is the published machine view; the hand-edited files
  # under sources/ are deliberately not what this reads.
  ansible.builtin.set_fact:
    catena_template_catalog: >-
      {{
        (
          (lookup('ansible.builtin.file', _catenahq_templates_base[7:] + '/catalog.json')
           if _catenahq_templates_base.startswith('file://')
           else lookup('ansible.builtin.url', _catenahq_templates_base + '/catalog.json', split_lines=false))
          | from_json
        ).templates
      }}
  when: catena_template_catalog is not defined
