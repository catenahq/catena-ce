---
# Add self-hosted Healthchecks as a catalog app, served at
# healthchecks.<zone> through its sign-in gate. Purpose-built cron/dead-man
# monitoring -- the OSS project behind healthchecks.io. One container, SQLite,
# no metrics, ntfy-capable.
#
# The app sets itself up in its configure hook: the admin account, the project,
# the ping and API keys read from the store, the admin email channel. Host lanes
# ping http://127.0.0.1:18000/ping/<ping_key>/<slug>. The scheduled lanes'
# checks are created and kept on the lanes' schedule by catena-admin's
# catena-schedule, which runs after this role; any other check is created by
# its first `?create=1` ping. Alerts reach the admin email through the
# outgoing mail chosen in Settings > Mail, and any channel added in
# Healthchecks' integrations page.

# Preflight -- fail loudly if the on-box store is missing any of the keys
# the app's hook reads. They are all internal-minted, so a gap here means the
# loader did not run or the store was truncated.
- name: "Healthchecks: preflight secret keys"
  ansible.builtin.assert:
    that:
      - healthchecks_ping_key is defined
      - healthchecks_api_key_readonly is defined
      - healthchecks_api_key_readwrite is defined
    fail_msg: >-
      Missing Healthchecks secrets. Every healthchecks_* secret is
      minted on the box by the converge loader, so a gap here means the
      on-box store at /etc/catena/config.json was not loaded.

# The public route is healthchecks-oauth2-proxy.yml, rendered by
# reconcile/roles/oauth2_proxy.

# Host-mode publish (swarm cannot bind 127.0.0.1), so the port is a real
# host bind. scope=loopback denies it everywhere but lo, which is what the
# ALLOWED_HOSTS 127.0.0.1 entry below assumes about who can reach it.
#
# bind=docker, as for beszel.yml's hub port.
- name: "Healthchecks: declare the host-side API port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/healthchecks.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": healthchecks_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "healthchecks",
           "comment": "Healthchecks API for gatus-sync + the host watchdogs -- this host only"}
        ] | to_nice_json
      }}
  register: _healthchecks_ports_fragment

- name: "Healthchecks: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _healthchecks_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# The values this converge owns, written into the app's .env: the address it
# answers to, the outgoing mail chosen in Settings > Mail
# (infrastructure_smtp) and the name of the project its hook keeps. The mail
# password is the app's own: its block manages EMAIL_HOST_PASSWORD from the
# store's smtp_password.
#
# A host with no domain yet addresses itself by the network alias every on-box
# consumer dials: `<sub>.` with the zone empty is a name Django rejects, and
# Healthchecks refuses to start (hc.api.E002) when SITE_ROOT's host is not an
# allowed one.
#
# 127.0.0.1 is in ALLOWED_HOSTS because every host-side consumer dials the
# loopback publish by IP: gatus-sync (HEALTHCHECKS_API_URL) and the other
# host-side pingers (HEALTHCHECKS_LOOPBACK_PORT). Django answers 400
# DisallowedHost to a Host it does not list, which looks exactly like "nothing
# to report".
#
# Port 465 is implicit TLS, any other port STARTTLS, as every sender on the
# host. Mail turned off leaves EMAIL_HOST empty, which gives Healthchecks no
# mailer.
- name: "Healthchecks: the values the converge owns"
  ansible.builtin.set_fact:
    _healthchecks_env:
      SITE_ROOT: >-
        {{ ('http://' ~ healthchecks_network_alias ~ ':' ~ healthchecks_internal_port)
           if (catena_public_surface_deferred | default(false) | bool)
           else ('https://' ~ healthchecks_hostname) }}
      SITE_NAME: >-
        {{ 'heartbeats' if (catena_public_surface_deferred | default(false) | bool)
           else (cloudflare_zone ~ ' heartbeats') }}
      ALLOWED_HOSTS: >-
        {{ (healthchecks_network_alias ~ ',localhost,127.0.0.1')
           if (catena_public_surface_deferred | default(false) | bool)
           else (healthchecks_hostname ~ ',' ~ healthchecks_network_alias ~ ',localhost,127.0.0.1') }}
      EMAIL_HOST: "{{ infrastructure_smtp.host if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_PORT: "{{ (infrastructure_smtp.port | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_HOST_USER: "{{ infrastructure_smtp.user if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_USE_TLS: "{{ ((not (infrastructure_smtp.implicit_tls | bool)) | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_USE_SSL: "{{ ((infrastructure_smtp.implicit_tls | bool) | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      DEFAULT_FROM_EMAIL: "{{ infrastructure_smtp.sender }}"
      HC_PROJECT_NAME: "{{ inventory_hostname }}"
  no_log: true

# No route of its own: Healthchecks is on healthchecks_network, which Traefik
# is not, so its only public path is its gate's route. Readiness is verified by
# the aggregate post-role probe in main.yml, and the app's own check.
- name: "Healthchecks: add the app"
  ansible.builtin.include_tasks: default_app.yml
  vars:
    default_app: "{{ default_apps | selectattr('app', 'eq', 'healthchecks') | first }}"
    default_app_env: "{{ _healthchecks_env }}"

# Say it out loud on the converge: a host whose alerts go nowhere must not look
# exactly like a healthy one. Checks still record every ping, but nothing is
# sent anywhere until a channel exists.
- name: "Healthchecks: warn when outgoing mail is off"
  ansible.builtin.debug:
    msg: >-
      Outgoing mail is off on this host, so Healthchecks has no alert channel to
      the admin's email. It records pings and marks checks down, and sends only
      through channels added in its integrations page. Choose a mail service in
      Settings > Mail to send alerts to the admin's email.
  when: not (infrastructure_smtp.enabled | bool)
