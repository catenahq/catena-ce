---
# Add self-hosted Healthchecks as a catalog app, served at
# healthchecks.<zone> through its sign-in gate. Purpose-built cron/dead-man
# monitoring -- the OSS
# project behind healthchecks.io. One container, SQLite, no metrics,
# ntfy-capable.
#
# healthchecks_ping_key is a random value minted at install time; host lanes
# ping http://127.0.0.1:18000/ping/<ping_key>/<slug>. The scheduled lanes'
# checks are created and kept on the lanes' schedule by catena-admin's
# catena-schedule, which runs after this role; any other check is created by
# its first `?create=1` ping. Alerts reach the admin email through the
# outgoing mail chosen in Settings > Mail, a channel seeded below with no
# manual UI step, and any channel added in Healthchecks' integrations page.

# Preflight -- fail loudly if the on-box store is missing any of the keys
# the app's .env and the seed need. They are all internal-minted, so a gap
# here means the loader did not run or the store was truncated.
- name: "Healthchecks: preflight secret keys"
  ansible.builtin.assert:
    that:
      - healthchecks_superuser_password is defined
      - healthchecks_ping_key is defined
      - healthchecks_api_key_readonly is defined
      - healthchecks_api_key_readwrite is defined
    fail_msg: >-
      Missing Healthchecks secrets. Every healthchecks_* secret is
      minted on the box by the converge loader, so a gap here means the
      on-box store at /etc/catena/config.json was not loaded.

# The public route is healthchecks-oauth2-proxy.yml, rendered by
# reconcile/roles/oauth2_proxy.

# Host-mode publish (swarm cannot bind 127.0.0.1), so the port is a real
# host bind. scope=loopback denies it everywhere but lo, which is what the
# ALLOWED_HOSTS 127.0.0.1 entry below assumes about who can reach it.
#
# bind=docker, as for beszel.yml's hub port.
- name: "Healthchecks: declare the host-side API port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/healthchecks.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": healthchecks_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "healthchecks",
           "comment": "Healthchecks API for gatus-sync + the host watchdogs -- this host only"}
        ] | to_nice_json
      }}
  register: _healthchecks_ports_fragment

- name: "Healthchecks: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _healthchecks_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# The values this converge owns, written into the app's .env: the address it
# answers to and the outgoing mail chosen in Settings > Mail
# (infrastructure_smtp).
#
# A host with no domain yet addresses itself by the network alias every on-box
# consumer dials: `<sub>.` with the zone empty is a name Django rejects, and
# Healthchecks refuses to start (hc.api.E002) when SITE_ROOT's host is not an
# allowed one.
#
# 127.0.0.1 is in ALLOWED_HOSTS because every host-side consumer dials the
# loopback publish by IP: gatus-sync (HEALTHCHECKS_API_URL) and the other
# host-side pingers (HEALTHCHECKS_LOOPBACK_PORT). Django answers 400
# DisallowedHost to a Host it does not list, which looks exactly like "nothing
# to report".
#
# Port 465 is implicit TLS, any other port STARTTLS, as every sender on the
# host. Mail turned off leaves EMAIL_HOST empty, which gives Healthchecks no
# mailer, and the seed removes the email channel.
- name: "Healthchecks: the values the converge owns"
  ansible.builtin.set_fact:
    _healthchecks_env:
      SITE_ROOT: >-
        {{ ('http://' ~ healthchecks_network_alias ~ ':' ~ healthchecks_internal_port)
           if (catena_public_surface_deferred | default(false) | bool)
           else ('https://' ~ healthchecks_hostname) }}
      SITE_NAME: >-
        {{ 'heartbeats' if (catena_public_surface_deferred | default(false) | bool)
           else (cloudflare_zone ~ ' heartbeats') }}
      ALLOWED_HOSTS: >-
        {{ (healthchecks_network_alias ~ ',localhost,127.0.0.1')
           if (catena_public_surface_deferred | default(false) | bool)
           else (healthchecks_hostname ~ ',' ~ healthchecks_network_alias ~ ',localhost,127.0.0.1') }}
      EMAIL_HOST: "{{ infrastructure_smtp.host if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_PORT: "{{ (infrastructure_smtp.port | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_HOST_USER: "{{ infrastructure_smtp.user if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_HOST_PASSWORD: "{{ (smtp_password | default('')) if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_USE_TLS: "{{ ((not (infrastructure_smtp.implicit_tls | bool)) | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      EMAIL_USE_SSL: "{{ ((infrastructure_smtp.implicit_tls | bool) | string) if (infrastructure_smtp.enabled | bool) else '' }}"
      DEFAULT_FROM_EMAIL: "{{ infrastructure_smtp.sender }}"
  no_log: true

# No route of its own: Healthchecks is on healthchecks_network, which Traefik
# is not, so its only public path is its gate's route. Readiness is verified by
# the aggregate post-role probe in main.yml, and the seed below retries against
# the Django ORM from inside the container, independent of Traefik and the auth
# proxy.
- name: "Healthchecks: add the app"
  ansible.builtin.include_tasks: default_app.yml
  vars:
    default_app: "{{ default_apps | selectattr('app', 'eq', 'healthchecks') | first }}"
    default_app_env: "{{ _healthchecks_env }}"

- name: "Healthchecks: pin whether the app runs"
  ansible.builtin.set_fact:
    _healthchecks_running: "{{ _default_app_running | bool }}"

- name: "Healthchecks: not running -- nothing is seeded"
  ansible.builtin.debug:
    msg: >-
      Healthchecks is not running on this host (stopped or removed, or its tag
      could not be fetched), so the converge seeds nothing in it.
  when: not (_healthchecks_running | bool)

# ─── Bootstrap channels via Django shell ─────────────────────────────
# scripts/healthchecks-seed.py seeds Catena's channel -- the admin email while
# outgoing mail is on. Re-running reconciles and leaves every other channel
# alone. Retries while the swarm task, Django and migrations come up.
#
# Budget: 60 × 5s = 300s (5 min). Covers cold image pulls without
# a mirror plus swarm placement + container start. Diagnostic dump
# below surfaces the real cause if we actually hit this ceiling, so
# the operator doesn't need to re-run with -vvv to see why.
- name: "Healthchecks: find running container"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ healthchecks_stack | swarm_container_regex("app") }}' || true
  args:
    executable: /bin/bash
  register: _healthchecks_container_name
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until: _healthchecks_container_name.stdout | length > 0
  when: _healthchecks_running | bool

# Three-view diag block (docker ps -a, docker service ls,
# docker service ps --no-trunc) so a timeout on the bench -- where
# the VM is torn down before the
# operator can shell in -- still yields enough signal to classify
# the failure: image pull / swarm placement / the control plane
# never scheduled the compose.
- name: "Healthchecks: diag -- docker ps -a (container-level state)"
  ansible.builtin.shell: |
    docker ps -a --format 'table {{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}\t{{ "{{" }}.Image{{ "}}" }}' \
      | { head -n1; grep -E '{{ healthchecks_stack }}' || true; }
  args:
    executable: /bin/bash
  register: _healthchecks_diag_ps
  changed_when: false
  failed_when: false
  when:
    - _healthchecks_running | bool
    - (_healthchecks_container_name.stdout | default('') | trim) | length == 0

- name: "Healthchecks: diag -- docker service ls (swarm-level state)"
  ansible.builtin.shell: |
    docker service ls --format 'table {{ "{{" }}.Name{{ "}}" }}\t{{ "{{" }}.Replicas{{ "}}" }}\t{{ "{{" }}.Image{{ "}}" }}' \
      | { head -n1; grep -E '{{ healthchecks_stack }}' || true; }
  args:
    executable: /bin/bash
  register: _healthchecks_diag_services
  changed_when: false
  failed_when: false
  when:
    - _healthchecks_running | bool
    - (_healthchecks_container_name.stdout | default('') | trim) | length == 0

- name: "Healthchecks: diag -- docker service ps --no-trunc (per-task errors)"
  ansible.builtin.shell: |
    for svc in $(docker service ls --format '{{ "{{" }}.Name{{ "}}" }}' | grep -E '{{ healthchecks_stack }}' || true); do
      echo "==== $svc ===="
      docker service ps "$svc" --no-trunc --format 'table {{ "{{" }}.ID{{ "}}" }}\t{{ "{{" }}.CurrentState{{ "}}" }}\t{{ "{{" }}.Error{{ "}}" }}' 2>&1 || true
    done
  args:
    executable: /bin/bash
  register: _healthchecks_diag_taskps
  changed_when: false
  failed_when: false
  when:
    - _healthchecks_running | bool
    - (_healthchecks_container_name.stdout | default('') | trim) | length == 0

- name: "Healthchecks: diag -- surface collected state"
  ansible.builtin.debug:
    msg: |
      ---- docker ps -a (healthchecks rows) ----
      {{ _healthchecks_diag_ps.stdout | default('(none)') }}

      ---- docker service ls (healthchecks swarm services) ----
      {{ _healthchecks_diag_services.stdout | default('(none)') }}

      ---- docker service ps --no-trunc (per-task state + error) ----
      {{ _healthchecks_diag_taskps.stdout | default('(none)') }}
  when:
    - _healthchecks_running | bool
    - (_healthchecks_container_name.stdout | default('') | trim) | length == 0

- name: "Healthchecks: fail clearly if container never appeared"
  ansible.builtin.fail:
    msg: |
      Timed out (300s) waiting for a running container matching
      '{{ healthchecks_stack | swarm_container_regex("app") }}'.

      Diagnostic output dumped above (docker ps -a, docker service ls,
      docker service ps --no-trunc). Interpret:
        - Container in `docker ps -a` with Exited / Restarting status
          -> app crashed; check `docker logs` of that container.
        - Task in `docker service ps` with Rejected / Failed + an Error
          column -> image pull / placement / config failure.
        - Service replicas=0/1 and no task history -> the control plane
          accepted the compose but never scheduled it; check
          `docker stack ps healthchecks`.
  when:
    - _healthchecks_running | bool
    - (_healthchecks_container_name.stdout | default('') | trim) | length == 0

# The Django seed lives at scripts/healthchecks-seed.py -- plain
# Python, no Jinja markers. Per-host values reach it on stdin, as one JSON
# line ahead of the script, never in an argv or environment, which `ps`
# shows every local user; the script KeyErrors loudly on any wiring break.
#
# The script is copied to disk and piped into `docker exec` rather than
# embedded inline in the shell module's `|` scalar: inlining the Python
# block with Jinja substitutions breaks ansible-core 2.19's stricter arg
# scanner ("failed at splitting arguments, either an unbalanced jinja2
# block or quotes"). Copying to disk sidesteps the entire class of issues
# -- only the path is a shell argument, the Python body is a regular file.
- name: "Healthchecks: drop Django seed script to /root"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/healthchecks-seed.py"
    dest: /root/catena-healthchecks-seed.py
    owner: root
    group: root
    mode: "0600"
  changed_when: false # reconciliation is idempotent; don't noisy-up the run

# The seed's own retry loop is the single readiness check for this
# deploy: if the seed succeeds, Django is ready by definition. A separate
# "probe Django ORM" task states that same requirement twice and adds one
# more source of "is this task looping for a good reason or not?"
# confusion on a broken run.
#
# Budget: 12 × 5s = 60s. On a healthy container the seed lands on the
# first try. If Django isn't ready in 60s something real is wrong
# (worker crash, DB lock on prior stale session, volume mount issue)
# -- fail fast rather than dragging it out.
#
# The keys mirror the top-level reads in healthchecks-seed.py; missing one
# surfaces as a KeyError, a blank api_key_readwrite leaves the existing
# project.api_key in place (migration path).
- name: "Healthchecks: the seed's values"
  ansible.builtin.set_fact:
    _healthchecks_seed_config:
      admin_email: "{{ admin_email }}"
      superuser_password: "{{ healthchecks_superuser_password }}"
      inventory_hostname: "{{ inventory_hostname }}"
      api_key_readonly: "{{ healthchecks_api_key_readonly }}"
      api_key_readwrite: "{{ healthchecks_api_key_readwrite | default('') }}"
      ping_key: "{{ healthchecks_ping_key }}"
      mail_enabled: "{{ infrastructure_smtp.enabled | bool | lower }}"
  no_log: true

# `cat -` puts the values (this task's stdin) ahead of the script; the
# `shell -c` line reads them into seed_config and runs the rest.
- name: "Healthchecks: run the Django seed script"
  # Re-resolved per attempt (playbooks/filter_plugins/swarm_naming.py).
  ansible.builtin.shell: |
    set -o pipefail
    ct=$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ healthchecks_stack | swarm_container_regex("app") }}' | head -n1)
    [ -n "$ct" ] || { echo "no running healthchecks container right now" >&2; exit 1; }
    cat - /root/catena-healthchecks-seed.py \
      | docker exec -i "$ct" python manage.py shell \
          -c 'import json, sys; seed_config = json.loads(sys.stdin.readline()); exec(sys.stdin.read())'
  args:
    executable: /bin/bash
    stdin: "{{ _healthchecks_seed_config | to_json }}"
  register: _healthchecks_seed
  changed_when: false
  retries: 12
  delay: 5
  until: _healthchecks_seed.rc == 0
  no_log: true
  when: _healthchecks_running | bool

# Say it out loud on the converge: the seed task runs no_log (it carries the
# superuser password), so nothing it prints is seen. A host whose alerts go
# nowhere must not be a host that looks exactly like a healthy one -- checks
# still record every ping, but nothing is sent anywhere until a channel exists.
- name: "Healthchecks: warn when the converge seeds no notification channel"
  ansible.builtin.debug:
    msg: >-
      Outgoing mail is off on this host, so the converge seeds no alert
      channel. Healthchecks will record pings and mark checks down, and send
      only through channels added in its integrations page. Choose a mail
      service in Settings > Mail to send alerts to the admin's email.
  when:
    - _healthchecks_running | bool
    - not (infrastructure_smtp.enabled | bool)
