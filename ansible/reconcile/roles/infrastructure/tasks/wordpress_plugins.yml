---
# Post-deploy WordPress plugin curation + configuration: find the running
# container, wait for the install wizard to finish, install and activate the
# curated plugins with wp-cli, enable the redis-cache drop-in, seed the
# options of the plugins that need pre-configuration (once per site, step 5.5),
# and keep WP Mail SMTP's relay on the outgoing mail set in Settings (step 7).
#
# Readiness gate: `wp core is-installed` returns rc 0 only AFTER the in-browser
# install wizard has provisioned wp_options / wp_users (the wp image
# entrypoint only copies files). Until then the task is a no-op (skipped with a
# debug message).
#
# Idempotent: every mutation gates on a `wp <foo> is-X` check or an option diff
# first, and each seed runs once per site. Running this task twice in a row
# produces zero `changed=` on the second run.

# ── Step 0: curated plugin slugs ─────────────────────────────────
# Order is irrelevant -- each step gates independently. Adding a slug
# here installs + activates it on the next converge; removing one
# leaves it in place (we only flow forward, never deactivate, to
# avoid clobbering operator-side decisions).
- name: "WordPress plugins: declare curated set"
  ansible.builtin.set_fact:
    _wp_plugins:
      - { slug: kadence-blocks }
      # Performance Lab parent + its seven feature modules. In
      # Performance Lab v3+, the modules ship as separate plugins on
      # wordpress.org; the parent plugin acts as a discovery / settings
      # hub. Installing each module as a top-level plugin is the
      # supported wiring (the parent does not auto-install them).
      - { slug: performance-lab }
      - { slug: auto-sizes }
      - { slug: dominant-color-images }
      - { slug: embed-optimizer }
      - { slug: image-prioritizer }
      - { slug: optimization-detective }
      - { slug: speculation-rules }
      - { slug: webp-uploads }
      - { slug: fastcgi-cache-purge-and-preload-nginx }
      - { slug: redis-cache }
      - { slug: wp-mail-smtp }
      - { slug: wp-mail-logging }
      - { slug: complianz-gdpr }
      - { slug: wp-consent-api }
      - { slug: seo-by-rank-math }
      - { slug: fluentform }

# ── Step 1: detect running wp container ─────────────────────────
#
# By the swarm service name, like every other container lookup in this tree:
# catena-container resolves catena-wordpress_wp, the catalog's app name and the
# compose service key. A container NAME carries a swarm task id, so a pattern
# on it matches nothing on the next deploy, this whole block skips, and the
# converge is green with no plugin curation and no option seeding -- the silent
# no-op test_container_lookup_is_label_based exists to stop.
#
# ONE SITE: the stack named catena-wordpress, first container. The per-site
# markers below are keyed for more, but nothing here iterates.
- name: "WordPress plugins: find running wp container"
  ansible.builtin.command:
    argv: [/usr/local/bin/catena-container, catena-wordpress, wp]
  register: _wp_ct
  changed_when: false

- name: "WordPress plugins: skip wiring (no running container)"
  ansible.builtin.debug:
    msg: >-
      WordPress not yet deployed (Portainer marketplace / wordpress). On
      the next converge AFTER the operator clicks Deploy and runs the
      install wizard, this task will auto-install the curated plugin set.
  when: (_wp_ct.stdout | default('') | length) == 0

- name: "WordPress plugins: wire when container is up"
  when: (_wp_ct.stdout | default('') | length) > 0
  block:
    # ── Step 2: install wp-cli phar in the wp container ──────────
    # The wordpress:fpm-alpine image does not bundle wp-cli. Pull the
    # official phar once into /usr/local/bin/wp; rerun is no-op while
    # the binary exists. Container recreation re-fetches.
    - name: "WordPress plugins: install wp-cli phar in container (idempotent)"
      ansible.builtin.shell: |
        set -e
        CT={{ _wp_ct.stdout | quote }}
        if docker exec "$CT" test -x /usr/local/bin/wp 2>/dev/null; then
          echo OK
          exit 0
        fi
        WP_CLI_URL="https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar"
        docker exec "$CT" sh -c "php -r \"copy('$WP_CLI_URL', '/usr/local/bin/wp');\" \
          && chmod +x /usr/local/bin/wp"
        echo CHANGED
      args:
        executable: /bin/bash
      register: _wp_cli_install
      changed_when: "'CHANGED' in _wp_cli_install.stdout"

    # ── Step 3: readiness gate -- wp core is-installed ───────────
    # Returns rc 0 when WP is installed (wp_options.siteurl set,
    # wp_users seeded). rc 1 while the operator has not yet completed
    # the in-browser install wizard. Retry loop covers the deploy-
    # but-not-yet-configured window (max 60s).
    - name: "WordPress plugins: wait for wp core is-installed"
      # Re-resolved per attempt: a swarm task id changes on every reschedule,
      # and this loop exists to span exactly that window.
      # uid 82 is www-data in php-fpm-alpine; wp-cli refuses root without
      # --allow-root.
      ansible.builtin.shell: |
        set -o pipefail
        ct=$(/usr/local/bin/catena-container catena-wordpress wp)
        [ -n "$ct" ] || { echo "no running wordpress container right now" >&2; exit 1; }
        docker exec --user 82 "$ct" wp core is-installed
      args:
        executable: /bin/bash
      register: _wp_installed
      changed_when: false
      failed_when: false
      retries: 30
      delay: 2
      until: _wp_installed.rc == 0

    - name: "WordPress plugins: skip wiring (wp not yet installed)"
      ansible.builtin.debug:
        msg: >-
          WordPress container is up but the install wizard has not yet
          been run (rc {{ _wp_installed.rc }}). Visit your WordPress
          domain, complete the install wizard, then re-run this task.
      when: _wp_installed.rc != 0

    # ── Step 4: ensure curated plugin set is installed + active ──
    - name: "WordPress plugins: check is-installed for each curated plugin"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - plugin
          - is-installed
          - "{{ item.slug }}"
      register: _wp_plugin_present
      changed_when: false
      failed_when: false
      loop: "{{ _wp_plugins }}"
      loop_control:
        label: "{{ item.slug }}"
      when: _wp_installed.rc == 0

    - name: "WordPress plugins: install + activate any missing plugin"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - plugin
          - install
          - "{{ item.item.slug }}"
          - "--activate"
      changed_when: true
      loop: "{{ _wp_plugin_present.results | default([]) }}"
      loop_control:
        label: "{{ item.item.slug }}"
      when:
        - _wp_installed.rc == 0
        - item.rc is defined
        - item.rc != 0

    - name: "WordPress plugins: check is-active for each curated plugin"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - plugin
          - is-active
          - "{{ item.slug }}"
      register: _wp_plugin_active
      changed_when: false
      failed_when: false
      loop: "{{ _wp_plugins }}"
      loop_control:
        label: "{{ item.slug }}"
      when: _wp_installed.rc == 0

    - name: "WordPress plugins: activate any installed-but-inactive plugin"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - plugin
          - activate
          - "{{ item.item.slug }}"
      changed_when: true
      loop: "{{ _wp_plugin_active.results | default([]) }}"
      loop_control:
        label: "{{ item.item.slug }}"
      when:
        - _wp_installed.rc == 0
        - item.rc is defined
        - item.rc != 0

    # ── Step 5: enable redis-cache drop-in ───────────────────────
    # `wp redis status` returns rc 0 + stdout containing "Connected"
    # when the object-cache.php drop-in is active. Otherwise enable
    # it; the WP_REDIS_HOST + WP_CACHE_KEY_SALT constants in
    # WORDPRESS_CONFIG_EXTRA already point at the redis service.
    - name: "WordPress plugins: check redis-cache status"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - redis
          - status
      register: _wp_redis_status
      changed_when: false
      failed_when: false
      when: _wp_installed.rc == 0

    - name: "WordPress plugins: enable redis-cache drop-in"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - redis
          - enable
      changed_when: true
      when:
        - _wp_installed.rc == 0
        - _wp_redis_status.rc | default(1) != 0 or 'Connected' not in (_wp_redis_status.stdout | default(''))

    # ── Step 5.5: has this site already been seeded? ─────────────
    #
    # Steps 6 and 7 write plugin OPTIONS -- rows in wp_options that the
    # WordPress admin UI also writes. What the site's admin owns is seeded once
    # and then left: the NPP settings, and WP Mail SMTP's sender. Same rule as
    # the Keycloak realm settings. A marker per seed makes each one
    # unambiguous, and rm-ing a marker re-seeds from the converge, which is the
    # documented recovery path. WP Mail SMTP's relay follows Settings on every
    # converge instead (step 7).
    #
    # One marker per seed, because the two are reached at different times: NPP
    # on the first converge after the install wizard, the mail sender on the
    # first converge with outgoing mail on, which can come later.
    #
    # Per SITE, keyed on com.docker.stack.namespace -- the Portainer stack
    # Name, the stable identifier the app intent keys every app on -- because
    # one host can run more than one WordPress and each is seeded the first
    # time this reaches it. A container name carries the swarm task id, which
    # changes on every reschedule, and a marker keyed on it would reset itself
    # and re-seed catena's values over the admin's edits.
    - name: "WordPress plugins: resolve this site's stack name"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{ index .Config.Labels \"com.docker.stack.namespace\" }}' }}"
          - "{{ _wp_ct.stdout }}"
      register: _wp_stack_name
      changed_when: false
      failed_when: false

    - name: "WordPress plugins: resolve this site's seed markers"
      ansible.builtin.set_fact:
        _wp_seed_marker: "/var/lib/catena/wordpress-options-bootstrapped-{{ _wp_site_key }}"
        _wp_mail_seed_marker: "/var/lib/catena/wordpress-mail-bootstrapped-{{ _wp_site_key }}"
      vars:
        # Falls back to the container name only when the label is missing (a
        # plain `docker compose` deploy). A per-run marker would be no marker
        # at all, so a missing label is worth the weaker key rather than
        # silently seeding every converge.
        _wp_site_key: >-
          {{ (_wp_stack_name.stdout | default('') | trim)
             | default(_wp_ct.stdout | regex_replace('^(wordpress-[0-9a-z]+).*$', '\1'), true) }}

    - name: "WordPress plugins: probe the option-seed marker"
      ansible.builtin.stat:
        path: "{{ _wp_seed_marker }}"
      register: _wp_seed_marker_stat

    - name: "WordPress plugins: probe the mail-seed marker"
      ansible.builtin.stat:
        path: "{{ _wp_mail_seed_marker }}"
      register: _wp_mail_seed_marker_stat

    - name: "WordPress plugins: NPP settings already seeded on this site"
      ansible.builtin.debug:
        msg: >-
          {{ _wp_seed_marker }} exists, so the NPP settings are this site's to
          change. Delete the marker and re-converge to re-seed them from the
          values this role ships.
      when: _wp_seed_marker_stat.stat.exists | default(false)

    - name: "WordPress plugins: decide whether to seed the NPP settings"
      ansible.builtin.set_fact:
        _wp_seed_options: >-
          {{ (_wp_installed.rc == 0)
             and not (_wp_seed_marker_stat.stat.exists | default(false)) }}

    # ── Step 6: configure NPP (FastCGI cache purge + preload) ────
    # Stored as a serialized array in the `nginx_cache_settings`
    # option. Seed-once: current wins over desired in the combine, so any key
    # the site already carries -- whether this role wrote it last converge or
    # an admin set it in the NPP UI -- is kept, and catena's values fill only
    # what has never been set. Sitemap path /sitemap_index.xml matches Rank
    # Math defaults; Yoast users would need to retune in the NPP UI.
    - name: "WordPress plugins: declare NPP desired settings"
      ansible.builtin.set_fact:
        _wp_npp_desired:
          nginx_cache_path: /var/cache/nginx/fastcgi
          nginx_cache_method: unlink
          nginx_cache_reject_regex: "/wp-admin/|/wp-.*\\.php|/feed/|/sitemap.*\\.xml"
          nginx_cache_auto_purge: "1"
          nginx_cache_purge_homepage_on_edit: "1"
          nginx_cache_purge_homepage_on_del: "1"
          nginx_cache_preload_enable: "1"
          nginx_cache_preload_method: wget
          nginx_cache_preload_sitemap: /sitemap_index.xml
      when: _wp_seed_options | bool

    - name: "WordPress plugins: get current NPP settings (defaults to {} if missing)"
      ansible.builtin.shell: |
        set -o pipefail
        docker exec --user 82 {{ _wp_ct.stdout | quote }} wp option get nginx_cache_settings --format=json 2>/dev/null || echo '{}'
      args:
        executable: /bin/bash
      register: _wp_npp_current
      changed_when: false
      when: _wp_seed_options | bool

    # Desired FIRST, current second: combine lets the RIGHT-hand side win, so
    # anything the site already carries survives and catena's values fill only
    # the keys that have never been set. Reversing the operands puts an admin's
    # retuned preload method back every converge.
    - name: "WordPress plugins: seed NPP settings under whatever the site already has"
      ansible.builtin.set_fact:
        _wp_npp_merged: >-
          {{ _wp_npp_desired | combine(_parsed if _parsed is mapping else {}) }}
      vars:
        _parsed: "{{ _wp_npp_current.stdout | from_json }}"
      when: _wp_seed_options | bool

    - name: "WordPress plugins: update NPP settings (only on diff)"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - option
          - update
          - nginx_cache_settings
          - "{{ _wp_npp_merged | to_json }}"
          - --format=json
      changed_when: true
      when:
        - _wp_seed_options | bool
        - _wp_npp_merged != (_parsed if _parsed is mapping else {})
      vars:
        _parsed: "{{ _wp_npp_current.stdout | from_json }}"

    # ── Step 7: configure wp-mail-smtp (only when SMTP configured) ──
    # The mail settings are this role's infrastructure_smtp
    # (../defaults/main.yml), the one resolution Healthchecks and Beszel read
    # too, sender fallback to the admin email included. A second resolution
    # here would let one host send a contact-form mail through a different
    # relay, or from a different sender, than its alerts, from the same stored
    # config, with nothing saying so.
    #
    # The wp_mail_smtp option holds two owners' values:
    #   - the relay (mail.mailer, and smtp host, port, user, encryption,
    #     autotls, auth) is Settings > Outgoing mail's, put back on every
    #     converge with mail on, as the Keycloak realm's mail is. The password
    #     beside it is Catena's (below), so a relay left from another provider
    #     would pair that provider's host and user with the new password.
    #   - the sender (mail.from_email, from_name, their force flags, and
    #     return_path) is seeded once per site, on the first converge with mail
    #     on, and is the site admin's from then on.
    # With mail off nothing here writes, and the site keeps what it has.
    #
    # The password stays out of the option and the WP database: WP Mail SMTP
    # reads the WPMS_SMTP_PASS constant in its place while WPMS_ON is defined
    # true, and WORDPRESS_CONFIG_EXTRA (catena-templates
    # blueprints/wordpress/docker-compose.yml) defines that constant from the
    # WPMS_SMTP_PASS env var, auto-healed via env_managed_keys from
    # smtp_password.
    - name: "WordPress plugins: derive consolidated SMTP config"
      ansible.builtin.set_fact:
        _wp_smtp_enabled: "{{ infrastructure_smtp.enabled }}"
        _wp_smtp_host: "{{ infrastructure_smtp.host }}"
        _wp_smtp_port: "{{ infrastructure_smtp.port }}"
        _wp_smtp_user: "{{ infrastructure_smtp.user }}"
        _wp_smtp_from: "{{ infrastructure_smtp.sender }}"
      when: _wp_installed.rc == 0

    - name: "WordPress plugins: skip wp-mail-smtp wiring (no SMTP configured)"
      ansible.builtin.debug:
        msg: >-
          This server has no outgoing mail configured, so WP Mail SMTP keeps
          the settings the site has. Set the provider and sender address under
          Settings > Outgoing mail in the admin panel and the next converge
          wires it, or fill in Settings > WP Mail SMTP inside the WordPress
          admin.
      when:
        - _wp_installed.rc == 0
        - not (_wp_smtp_enabled | bool)

    # _wp_mail_wire: the relay is written on this converge. _wp_mail_seed: the
    # sender is too, once per site.
    - name: "WordPress plugins: decide what to write to wp_mail_smtp"
      ansible.builtin.set_fact:
        _wp_mail_wire: "{{ (_wp_installed.rc == 0) and (_wp_smtp_enabled | default(false) | bool) }}"
        _wp_mail_seed: >-
          {{ (_wp_installed.rc == 0) and (_wp_smtp_enabled | default(false) | bool)
             and not (_wp_mail_seed_marker_stat.stat.exists | default(false)) }}

    - name: "WordPress plugins: WP Mail SMTP sender already seeded on this site"
      ansible.builtin.debug:
        msg: >-
          {{ _wp_mail_seed_marker }} exists, so WP Mail SMTP's sender is this
          site's to change, and its relay follows Settings > Outgoing mail.
          Delete the marker and re-converge to re-seed the sender from
          Settings.
      when:
        - _wp_mail_wire | bool
        - not (_wp_mail_seed | bool)

    - name: "WordPress plugins: declare wp-mail-smtp relay and sender"
      ansible.builtin.set_fact:
        _wp_mail_smtp_relay:
          mail:
            mailer: smtp
          smtp:
            host: "{{ _wp_smtp_host }}"
            port: "{{ _wp_smtp_port | int }}"
            encryption: tls
            autotls: true
            auth: true
            user: "{{ _wp_smtp_user }}"
        _wp_mail_smtp_sender:
          mail:
            from_email: "{{ _wp_smtp_from }}"
            from_email_force: true
            from_name: "{{ _wp_smtp_from }}"
            from_name_force: false
            return_path: false
      when: _wp_mail_wire | bool

    - name: "WordPress plugins: get current wp_mail_smtp option (defaults to {} if missing)"
      ansible.builtin.shell: |
        set -o pipefail
        docker exec --user 82 {{ _wp_ct.stdout | quote }} wp option get wp_mail_smtp --format=json 2>/dev/null || echo '{}'
      args:
        executable: /bin/bash
      register: _wp_mail_smtp_current
      changed_when: false
      when: _wp_mail_wire | bool

    # Recursive (mail.*, smtp.*), and each combine lets its RIGHT-hand side
    # win: the sender, on the run that seeds it, goes under whatever the site
    # carries, so a sender the site already has is kept; the relay goes over
    # it, so Settings' host, port and user replace the site's. Every other key
    # in the option stays as the site has it.
    - name: "WordPress plugins: seed the sender, put the relay back"
      ansible.builtin.set_fact:
        _wp_mail_smtp_merged: >-
          {{ (_wp_mail_smtp_sender if (_wp_mail_seed | bool) else {})
             | combine(_parsed if _parsed is mapping else {}, recursive=True)
             | combine(_wp_mail_smtp_relay, recursive=True) }}
      vars:
        _parsed: "{{ _wp_mail_smtp_current.stdout | from_json }}"
      when: _wp_mail_wire | bool

    - name: "WordPress plugins: update wp_mail_smtp option (only on diff)"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - "82"
          - "{{ _wp_ct.stdout }}"
          - wp
          - option
          - update
          - wp_mail_smtp
          - "{{ _wp_mail_smtp_merged | to_json }}"
          - --format=json
      changed_when: true
      when:
        - _wp_mail_wire | bool
        - _wp_mail_smtp_merged != (_parsed if _parsed is mapping else {})
      vars:
        _parsed: "{{ _wp_mail_smtp_current.stdout | from_json }}"
      no_log: true # option contents are non-secret but option-update logs the JSON; keep terse

    # Each marker is written LAST and only on a run that actually seeded, so an
    # interrupted converge is retried by the next one rather than skipped
    # forever. The plugin install/activate loops above are unaffected: they
    # only flow forward, never deactivate, and they keep running on every
    # converge.
    - name: "WordPress plugins: mark this site's WP Mail SMTP sender as seeded"
      ansible.builtin.file:
        path: "{{ _wp_mail_seed_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: _wp_mail_seed | bool

    - name: "WordPress plugins: mark this site's NPP settings as seeded"
      ansible.builtin.file:
        path: "{{ _wp_seed_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: _wp_seed_options | bool
