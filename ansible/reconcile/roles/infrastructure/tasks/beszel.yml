---
# Beszel resource monitor -- hub + agent (+ Healthchecks alert shim,
# appended below).
#
# Deterministic, one-pass, no manual UI step (mechanism verified against
# henrygd/beszel @ main):
#   1. Add the hub app, with no credential in its spec. First boot generates
#      + persists its SSH key at /beszel_data/id_ed25519. The seed and the agent
#      run only while the hub runs.
#   2. Read that private key back out of the running container and derive
#      the public key (ssh-keygen -y) -- the agent needs it as KEY.
#   3. The seed claims a hub that has no user yet as the admin (its first-user
#      endpoint, over the loopback publish), then seeds a permanent universal
#      token into the hub's universal_tokens collection
#      (superuser-authenticated, idempotent). With it, the
#      agent auto-registers its system on first WebSocket connect
#      (createNewSystemForUniversalToken) -- no "add system" UI click.
#   4. Deploy the agent on the host network with KEY + HUB_URL, and the token
#      as a swarm secret.
#
# Always runs: the include in main.yml carries no gate. The universal token is
# an INTERNAL_SECRET minted on the box by helpers/onbox_config.py; this role
# only ASSERTS it (healthchecks preflight pattern).
#
# The hub login is the SHARED admin_password, the same one that opens
# Keycloak and this panel. It is deliberately not a per-service
# mint: the hub is a tab the panel links to, and the install surfaces exactly
# one first-login password. A credential minted for this service alone would
# appear in no keyset and on no page, which locks the operator out of a tab
# their own panel offers them.

- name: "Beszel: preflight secrets"
  ansible.builtin.assert:
    that:
      - admin_password is defined
      - admin_password | length > 0
      - beszel_universal_token is defined
      - beszel_universal_token | length > 0
      - (beszel_universal_token | length) <= 64
    fail_msg: >-
      Missing or invalid Beszel secrets. The converge mints them on the box
      (the universal token must be <= 64 chars; Beszel rejects longer
      X-Token headers), so a gap here means the on-box store at
      /etc/catena/config.json was not loaded or holds a truncated value.

# Host-mode publish (swarm cannot bind 127.0.0.1), so the hub port is a real
# host bind. scope=loopback denies it everywhere but lo -- the only readers
# are beszel-seed on the host and the host-network agent below.
#
# bind=docker: a swarm host-mode publish is DNAT'd (catena-admin
# payload/lib/public_ports.py).
- name: "Beszel: declare the hub loopback port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/beszel.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": beszel_hub_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "beszel",
           "comment": "Beszel hub API for the seed + the host-network agent -- this host only"}
        ] | to_nice_json
      }}
  register: _beszel_ports_fragment

- name: "Beszel: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _beszel_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# The hub trusts the sign-in header from peers inside this subnet. Beszel
# trusts EVERY peer when the allowlist is empty, so the converge stops unless
# the network carries exactly one IPv4 CIDR no wider than /8.
- name: "Beszel: read the gate network's subnet"
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ beszel_gate_network }}"]
  register: _beszel_gate_inspect
  changed_when: false

- name: "Beszel: the gate network has exactly one valid subnet"
  ansible.builtin.assert:
    that:
      - _beszel_gate_configs | length == 1
      - _beszel_gate_configs[0].Subnet | default('') is match(_beszel_cidr_pattern)
    fail_msg: >-
      {{ beszel_gate_network }} must carry exactly one IPv4 subnet (found
      {{ _beszel_gate_configs | map(attribute='Subnet', default='') | list }}).
      Without a valid one the hub would trust the sign-in header from any peer,
      so it is not deployed.
  vars:
    _beszel_gate_configs: "{{ (_beszel_gate_inspect.stdout | from_json)[0].IPAM.Config | default([], true) }}"
    _beszel_cidr_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|1[0-9]|2[0-9]|30)$'

- name: "Beszel: pin the gate network's subnet as a fact"
  ansible.builtin.set_fact:
    _beszel_gate_subnet: "{{ (_beszel_gate_inspect.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

# The values this converge owns, written into the hub's .env. Its address:
# with no domain entered yet `beszel_hostname` renders `beszel.`, and a URL
# whose host ends in a dot is not a degraded address, it is a malformed one.
# Deferred, the hub addresses itself by the network alias it is already
# reachable at. The hub writes APP_URL over PocketBase's stored meta.appURL each
# time it starts (internal/hub/hub.go initialize, beszel v0.20.0), so a new
# hostname reaches the links in its mail through the redeploy that this changed
# value causes.
#
# USER_CREATION lets an OIDC identity with no local record sign in. Without it
# the Keycloak button works for exactly ONE person -- the holder of
# admin_email, whose users record the seed's first-user claim created -- and
# every other admin still meets the password prompt this is here to remove. The
# blast radius is bounded by who reaches the hub, not by this flag: its public
# host is routed through the admin-only oauth2-proxy (reconcile/roles/
# oauth2_proxy), its loopback publish answers this host only, and its networks
# are shared with its gate, its alert shim and Gatus alone. So driving its
# sign-in requires having authenticated to Keycloak AND being in the admin
# group, and auto-creating a monitoring account for someone who has already
# cleared that grants nothing new.
#
# TRUSTED_AUTH_HEADER opens the hub signed in as the email the gate sets. Beszel
# reads the header from the TCP peer only if the peer is inside
# TRUSTED_PROXY_IPS, and trusts every peer when that is empty, so the two are
# written together: the subnet is that of beszel_gate_network, which only the
# gate and this hub join (read and checked above). The loopback publish and
# beszel_network sit outside it, so a header sent from there signs no one in.
# An email with no hub record stays anonymous. Behind the gate the hub's own Log
# out signs no one out; the gate's sign-out does.
#
# DISABLE_PASSWORD_AUTH is deliberately NOT set. See scripts/beszel-seed.py:
# Beszel is base-plane infrastructure, and a monitoring tool reachable only
# through the SSO tool cannot diagnose the SSO tool. tests/unit/test_beszel_oidc.py
# asserts the name never appears.
- name: "Beszel: the values the converge owns"
  ansible.builtin.set_fact:
    _beszel_hub_env:
      APP_URL: >-
        {{ ('http://' ~ beszel_hub_network_alias ~ ':' ~ beszel_hub_internal_port)
           if (catena_public_surface_deferred | default(false) | bool)
           else ('https://' ~ beszel_hostname) }}
      USER_CREATION: "true"
      TRUSTED_AUTH_HEADER: "X-Forwarded-Email"
      TRUSTED_PROXY_IPS: "{{ _beszel_gate_subnet | trim }}"

# No route of its own: the hub is on beszel_network and beszel_gate_network,
# which Traefik is not, so its one public path is its gate's route. Public
# readiness (302 through oauth2-proxy) is verified by the aggregate probe in
# main.yml; the pubkey read and the seed below retry against the loopback API,
# which is the real readiness gate for the hub<->agent wiring.
- name: "Beszel: add the hub app"
  ansible.builtin.include_tasks: default_app.yml
  vars:
    default_app: "{{ default_apps | selectattr('app', 'eq', 'beszel') | first }}"
    default_app_env: "{{ _beszel_hub_env }}"

- name: "Beszel: pin whether the hub runs"
  ansible.builtin.set_fact:
    _beszel_hub_running: "{{ _default_app_running | bool }}"

- name: "Beszel: hub not running -- the seed and the agent are skipped"
  ansible.builtin.debug:
    msg: >-
      The Beszel hub is not running on this host (stopped or removed, or its tag
      could not be fetched), so the converge seeds nothing in it and deploys no
      agent for it.
  when: not (_beszel_hub_running | bool)

- name: "Beszel: wait for hub container"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ beszel_hub_stack | swarm_container_regex("app") }}' || true
  args:
    executable: /bin/bash
  register: _beszel_hub_container
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until: _beszel_hub_container.stdout | length > 0
  when: _beszel_hub_running | bool

- name: "Beszel: fail clearly if hub container never appeared"
  ansible.builtin.fail:
    msg: >-
      Timed out (300s) waiting for a running container matching
      '{{ beszel_hub_stack | swarm_container_regex("app") }}'.
      Check the swarm stack on the host:
      `docker stack ps {{ beszel_hub_stack }} --no-trunc`.
  when:
    - _beszel_hub_running | bool
    - (_beszel_hub_container.stdout | default('') | trim) | length == 0

# Read the hub-generated private key out of the container and derive the
# public key on the host. Written to a 0600 temp file (umask 077) and
# removed immediately -- the key never lands on persistent host storage.
# Retries because the key is written during the hub's first-boot
# migration, a beat after the container is "running".
#
# `docker cp`, not `docker exec cat`: the hub image ships the binary and
# nothing else, so there is no cat (nor any shell) to exec. cp is served
# by the daemon and needs no in-container process.
- name: "Beszel: derive hub public key for the agent"
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    tmp="$(mktemp)"
    trap 'rm -f "$tmp"' EXIT
    # Re-resolved per attempt: a swarm task id changes on every reschedule,
    # and this loop exists to span exactly that window.
    ct=$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ beszel_hub_stack | swarm_container_regex("app") }}' | head -n1)
    [ -n "$ct" ] || { echo "no running beszel hub container right now" >&2; exit 1; }
    docker cp "$ct":/beszel_data/id_ed25519 "$tmp"
    ssh-keygen -y -f "$tmp"
  args:
    executable: /bin/bash
  register: _beszel_pubkey
  changed_when: false
  retries: 24
  delay: 5
  until:
    - _beszel_pubkey.rc == 0
    - (_beszel_pubkey.stdout | trim) is match('^ssh-ed25519 ')
  when: _beszel_hub_running | bool
  # No no_log: the private key never reaches stdout (ssh-keygen -y prints
  # only the public half, and the temp file dies with the shell). Hidden, a
  # failed 120s retry loop would report nothing but "censored".

- name: "Beszel: pin derived hub public key as a fact"
  ansible.builtin.set_fact:
    _beszel_hub_pubkey: "{{ _beszel_pubkey.stdout | trim }}"
  when: _beszel_hub_running | bool

# Seed the permanent universal token. Plain stdlib script (no Jinja
# markers) dropped to /root and run on the host against the hub's
# loopback publish; per-host values arrive on stdin, never in an argv or
# environment, which `ps` shows every local user. Idempotent:
# find-or-update the single universal_tokens row (unique on user).
- name: "Beszel: drop universal-token seed script to /root"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/beszel-seed.py"
    dest: /root/catena-beszel-seed.py
    owner: root
    group: root
    mode: "0700"
  changed_when: false

# The Keycloak client backing the hub's own sign-in button. Rendered before
# the seed below, because the seed points PocketBase at it -- a provider
# configured against a client the realm does not carry yet is a button that
# 400s until the next converge.
- name: "Beszel OIDC: render Keycloak client into realm config dir"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-beszel.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/beszel.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _beszel_realm_render

- name: "Beszel OIDC: re-import realm config with the new client"
  ansible.builtin.include_tasks:
    file: ../../keycloak/tasks/realm_bootstrap.yml
    apply:
      tags: [beszel_realm]
  when: _beszel_realm_render is changed
  tags: [beszel_realm]

# The Shoutrrr URL the hub notifies through, pointed at the alert shim
# deployed at the bottom of this file. One definition, read by both seed
# invocations, so the delivery channel and the thing that receives it cannot
# drift apart. The hub's outgoing mail is infrastructure_smtp
# (../defaults/main.yml), the resolution Healthchecks and Keycloak use too.
- name: "Beszel: resolve the alert-shim webhook URL"
  ansible.builtin.set_fact:
    _beszel_alert_webhook: >-
      generic+http://{{ beszel_hc_shim_network_alias }}:{{ beszel_hc_shim_internal_port }}/notify

# What both seed passes read on stdin (scripts/beszel-seed.py documents each
# key).
- name: "Beszel: the seed's config"
  ansible.builtin.set_fact:
    _beszel_seed_config:
      hub_url: "http://127.0.0.1:{{ beszel_hub_host_localhost_port }}"
      state_file: "{{ beszel_seed_state_file }}"
      admin_email: "{{ admin_email }}"
      admin_password: "{{ admin_password }}"
      universal_token: "{{ beszel_universal_token }}"
      oidc_client_id: beszel
      oidc_client_secret: "{{ beszel_oidc_client_secret }}"
      oidc_auth_url: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}/protocol/openid-connect/auth"
      oidc_token_url: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}/protocol/openid-connect/token"
      oidc_userinfo_url: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}/protocol/openid-connect/userinfo"
      oidc_display_name: "{{ beszel_oidc_display_name }}"
      alert_webhook: "{{ _beszel_alert_webhook }}"
      smtp_host: "{{ infrastructure_smtp.host }}"
      smtp_port: "{{ infrastructure_smtp.port | string }}"
      smtp_implicit_tls: "{{ infrastructure_smtp.implicit_tls | bool }}"
      smtp_user: "{{ infrastructure_smtp.user }}"
      smtp_sender: "{{ infrastructure_smtp.sender }}"
      smtp_password: "{{ smtp_password | default('') }}"
  no_log: true

- name: "Beszel: seed the universal token + OIDC login (superuser-authenticated)"
  ansible.builtin.command:
    argv: [python3, /root/catena-beszel-seed.py]
    stdin: "{{ _beszel_seed_config | to_json }}"
  register: _beszel_seed
  # The script prints one line carrying all FIVE outcomes. Steady state is
  # "ok-exists" from every one, or "no-mail" from the mail step on a host with
  # mail off; anything else is a real write. Counting them rather than matching
  # a 'minted'/'updated' substring keeps a half-changed run (token current,
  # OIDC newly configured) reported as changed.
  #
  # The alert rules report "no-systems" here on a first converge, because this
  # runs BEFORE the agent deploy below -- the agent needs the universal token
  # this task seeds. The pass after the agent is what turns that into
  # "created N".
  changed_when: >-
    (_beszel_seed.stdout.count('ok-exists') + _beszel_seed.stdout.count('no-mail')) < 5
  retries: 24
  delay: 5
  until: _beszel_seed.rc == 0
  no_log: true
  when: _beszel_hub_running | bool

# The agent's token and the alert shim's ping key: each compose names its
# secret and mounts it, and swarm holds the value.
- name: "Beszel: name the agent's and the alert shim's swarm secrets after their values"
  ansible.builtin.set_fact:
    _beszel_agent_secrets: "{{ beszel_agent_swarm_secrets | swarm_secret_entries }}"
    _beszel_hc_shim_secrets: "{{ beszel_hc_shim_swarm_secrets | swarm_secret_entries }}"
  no_log: true

- name: "Beszel: create the missing swarm secrets"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/swarm_secrets.yml"
  vars:
    swarm_secrets: "{{ _beszel_agent_secrets + _beszel_hc_shim_secrets }}"

- name: "Beszel: deploy agent as a swarm stack"
  ansible.builtin.include_tasks: swarm_stack.yml
  vars:
    svc_name: "{{ beszel_agent_compose_name }}"
    svc_compose_content: "{{ lookup('template', 'beszel-agent.compose.yml.j2') }}"
    # No public domain -- agent is host-network only, dials the hub on
    # the loopback. swarm_stack.yml removes the route file when
    # svc_domain_host is empty.
    svc_domain_host: ""
    svc_readiness_skip_reason: >-
      Host-network metrics agent; no HTTP surface. The hub's Systems view
      shows it online within a poll once it registers via the universal
      token.
  when: _beszel_hub_running | bool

# The alert rules need a SYSTEM to attach to, and a system only exists once the
# agent above has registered itself. The seed ran before that, deliberately --
# the agent needs the universal token it writes -- so it reported "no-systems"
# and created nothing.
#
# This is the same script again, which is safe because every step in it is
# find-or-create: the token, the OIDC provider and the webhook all report
# ok-exists on this pass, and only the rules do work. `until` waits for the
# registration rather than assuming it, so a fresh host finishes with a
# complete alert path in ONE converge instead of needing a second.
- name: "Beszel: seed the default alert rules once the agent has registered"
  ansible.builtin.command:
    argv: [python3, /root/catena-beszel-seed.py]
    stdin: "{{ _beszel_seed_config | to_json }}"
  register: _beszel_alert_seed
  changed_when: >-
    (_beszel_alert_seed.stdout.count('ok-exists') + _beszel_alert_seed.stdout.count('no-mail')) < 5
  # Long enough for the agent to come up and complete its first WebSocket
  # registration. Failing here is a real failure: an agent that never registers
  # is a monitor with nothing to watch, and it should not pass silently.
  retries: 30
  delay: 5
  until:
    - _beszel_alert_seed.rc == 0
    - "'no-systems' not in _beszel_alert_seed.stdout"
  no_log: true
  when: _beszel_hub_running | bool

# --- Beszel -> Healthchecks alert shim --------------------------------------
# Bridges Beszel's static-URL Shoutrrr webhook to the Gatus-style
# Healthchecks /fail + success pings. The seed above points the hub's
# notifications at it (_beszel_alert_webhook) and creates the default alert
# rules; per-system thresholds are set in the hub UI.
- name: "Beszel: ensure shim host dir exists"
  ansible.builtin.file:
    path: "{{ beszel_hc_shim_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Beszel: drop alert-shim script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/beszel-hc-shim.py"
    dest: "{{ beszel_hc_shim_host_dir }}/beszel-hc-shim.py"
    owner: root
    group: root
    mode: "0644"

- name: "Beszel: deploy alert shim as a swarm stack"
  ansible.builtin.include_tasks: swarm_stack.yml
  vars:
    svc_name: "{{ beszel_hc_shim_compose_name }}"
    svc_compose_content: "{{ lookup('template', 'beszel-hc-shim.compose.yml.j2') }}"
    svc_domain_host: ""
    svc_readiness_skip_reason: >-
      Internal webhook receiver on the hub's network; no public surface.
      Exercised by a Beszel alert firing.

- name: "Beszel: remove the swarm secrets no service mounts"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/swarm_secrets_prune.yml"
  vars:
    swarm_secret_bases: >-
      {{ (beszel_agent_swarm_secrets + beszel_hc_shim_swarm_secrets)
         | map(attribute='base') | list }}
