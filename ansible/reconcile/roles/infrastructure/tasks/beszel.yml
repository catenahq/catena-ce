---
# Beszel resource monitor, one catalog app: the hub, the host agent and the
# relay that forwards the hub's alerts to Healthchecks. The relay's configure
# hook sets the hub up (first user, sign-in provider, alert delivery, the agent's
# key); this file adds the app and writes the values the converge owns.
#
# Always runs: the include in main.yml carries no gate.

- name: "Beszel: preflight secrets"
  ansible.builtin.assert:
    that:
      - beszel_oidc_client_secret is defined
      - beszel_oidc_client_secret | length > 0
    fail_msg: >-
      Missing Beszel secrets. The converge mints them on the box, so a gap here
      means the on-box store at /etc/catena/config.json was not loaded.

# Host-mode publish (swarm cannot bind 127.0.0.1), so the hub port is a real
# host bind. scope=loopback denies it everywhere but lo -- the only reader is
# the off-site heartbeat on the host.
#
# bind=docker: a swarm host-mode publish is DNAT'd (catena-admin
# payload/lib/public_ports.py).
- name: "Beszel: declare the hub loopback port (registry fragment, loopback-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/beszel.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": beszel_hub_host_localhost_port | int,
           "scope": "loopback", "bind": "docker", "owner": "beszel",
           "comment": "Beszel hub API for the off-site heartbeat -- this host only"}
        ] | to_nice_json
      }}
  register: _beszel_ports_fragment

- name: "Beszel: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when:
    - _beszel_ports_fragment.changed
    - catena_public_ports_installed | default(true) | bool

# The hub trusts the sign-in header from peers inside this subnet. Beszel
# trusts EVERY peer when the allowlist is empty, so the converge stops unless
# the network carries exactly one IPv4 CIDR no wider than /8.
- name: "Beszel: read the gate network's subnet"
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ beszel_gate_network }}"]
  register: _beszel_gate_inspect
  changed_when: false

- name: "Beszel: the gate network has exactly one valid subnet"
  ansible.builtin.assert:
    that:
      - _beszel_gate_configs | length == 1
      - _beszel_gate_configs[0].Subnet | default('') is match(_beszel_cidr_pattern)
    fail_msg: >-
      {{ beszel_gate_network }} must carry exactly one IPv4 subnet (found
      {{ _beszel_gate_configs | map(attribute='Subnet', default='') | list }}).
      Without a valid one the hub would trust the sign-in header from any peer,
      so it is not deployed.
  vars:
    _beszel_gate_configs: "{{ (_beszel_gate_inspect.stdout | from_json)[0].IPAM.Config | default([], true) }}"
    _beszel_cidr_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|1[0-9]|2[0-9]|30)$'

- name: "Beszel: pin the gate network's subnet as a fact"
  ansible.builtin.set_fact:
    _beszel_gate_subnet: "{{ (_beszel_gate_inspect.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

# The Keycloak client backing the hub's own sign-in button. Rendered before the
# app is added, because the relay's hook points the hub at it -- a provider
# configured against a client the realm does not carry yet is a button that
# 400s until the next converge.
- name: "Beszel OIDC: render Keycloak client into realm config dir"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-beszel.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/beszel.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _beszel_realm_render

- name: "Beszel OIDC: re-import realm config with the new client"
  ansible.builtin.include_tasks:
    file: ../../keycloak/tasks/realm_bootstrap.yml
    apply:
      tags: [beszel_realm]
  when: _beszel_realm_render is changed
  tags: [beszel_realm]

# The values this converge owns, written into the app's .env. Its address:
# with no domain entered yet `beszel_hostname` renders `beszel.`, and a URL
# whose host ends in a dot is not a degraded address, it is a malformed one.
# Deferred, the hub addresses itself by the network alias it is already
# reachable at. The hub writes APP_URL over PocketBase's stored meta.appURL each
# time it starts, so a new hostname reaches the links in its mail through the
# redeploy that this changed value causes.
#
# USER_CREATION lets an OIDC identity with no local record sign in. Without it
# the Keycloak button works for exactly ONE person, and every other admin still
# meets the password prompt this is here to remove. The blast radius is bounded
# by who reaches the hub, not by this flag: its public host is routed through
# the admin-only oauth2-proxy (reconcile/roles/oauth2_proxy), its loopback
# publish answers this host only, and its networks are shared with its gate and
# Gatus alone. So driving its sign-in requires having authenticated to Keycloak
# AND being in the admin group, and auto-creating a monitoring account for
# someone who has already cleared that grants nothing new.
#
# TRUSTED_AUTH_HEADER opens the hub signed in as the email the gate sets. Beszel
# reads the header from the TCP peer only if the peer is inside
# TRUSTED_PROXY_IPS, and trusts every peer when that is empty, so the two are
# written together: the subnet is that of beszel_gate_network, which only the
# gate and this hub join (read and checked above). The loopback publish and
# beszel_network sit outside it, so a header sent from there signs no one in.
# An email with no hub record stays anonymous. Behind the gate the hub's own Log
# out signs no one out; the gate's sign-out does.
#
# HUB_OIDC_ISSUER is the realm the hub's sign-in button points at; the relay's
# hook builds the provider from it and the client secret in the store.
#
# DISABLE_PASSWORD_AUTH is deliberately NOT set: Beszel is base-plane
# infrastructure, and a monitoring tool reachable only through the SSO tool
# cannot diagnose the SSO tool.
- name: "Beszel: the values the converge owns"
  ansible.builtin.set_fact:
    _beszel_hub_env:
      APP_URL: >-
        {{ ('http://' ~ beszel_hub_network_alias ~ ':' ~ beszel_hub_internal_port)
           if (catena_public_surface_deferred | default(false) | bool)
           else ('https://' ~ beszel_hostname) }}
      USER_CREATION: "true"
      TRUSTED_AUTH_HEADER: "X-Forwarded-Email"
      TRUSTED_PROXY_IPS: "{{ _beszel_gate_subnet | trim }}"
      HUB_OIDC_ISSUER: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}"

# No route of its own: the hub is on beszel_network and beszel_gate_network,
# which Traefik is not, so its one public path is its gate's route. Public
# readiness (302 through oauth2-proxy) is verified by the aggregate probe in
# main.yml.
- name: "Beszel: add the app"
  ansible.builtin.include_tasks: default_app.yml
  vars:
    default_app: "{{ default_apps | selectattr('app', 'eq', 'beszel') | first }}"
    default_app_env: "{{ _beszel_hub_env }}"
