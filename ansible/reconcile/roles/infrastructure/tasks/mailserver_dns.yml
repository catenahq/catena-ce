---
# Mailserver DNS -- the safe, mail-specific records the converge writes via
# the Cloudflare API, with the same upsert idiom as reconcile/roles/coturn
# dns.yml (look up -> create-if-absent -> update-if-drift).
#
# The records follow the names the mailserver stack runs under
# (_mailserver_names.yml): a primary-domain change does not move the stack, so
# its hostname and mail domain keep their zones. A name in a zone the token does
# not reach is left as it is and reported in the converge output.
#
# Written here:
#   - <stack hostname>  A   (gray-cloud) -> VPS public IP (mail.<zone> on a
#                      fresh deploy). The mail plane (25/465/587/993) cannot
#                      ride the CF tunnel, so the MX/mail FQDN must resolve
#                      straight to the VPS.
#   - _mta-sts.<mail domain>  TXT -> MTA-STS policy id (RFC 8461). The policy
#                      file itself is served by the mta-sts nginx in the
#                      template at mta-sts.<mail domain>/.well-known/mta-sts.txt
#                      (which resolves via the existing wildcard CNAME).
#   - _smtp._tls.<mail domain>  TXT -> TLS-RPT (RFC 8460) reporting address.
#
# Left to the domain's owner, by hand:
#   - MX     -- a cutover decision; auto-creating it would hijack a
#               domain's existing inbound mail.
#   - SPF    -- the relay include is relay-specific.
#   - DKIM   -- the relay is the sole signer; publish ITS selector. The
#               mailserver does not sign locally (no `setup config dkim`).
#   - DMARC  -- operator policy.
#   - rDNS   -- set at the VPS provider.
#
# Gated on the mailserver being deployed (_mailserver_dms_locate.yml): the
# Cloudflare calls run from localhost (delegate_to), and mail DNS is never
# published for a tenant without it.

- name: "Mailserver DNS: resolve the dms container (shared, waits out its restart cycle)"
  ansible.builtin.include_tasks: _mailserver_dms_locate.yml

- name: "Mailserver DNS: skip when mailserver template not deployed"
  ansible.builtin.debug:
    msg: >-
      mailserver template not deployed (no catena-mailserver stack); skipping
      mail DNS.
  when: not (mailserver_deployed | bool)

- name: "Mailserver DNS: skip when the host has no domain yet"
  ansible.builtin.debug:
    msg: >-
      No domain is configured, so no mail DNS is published: no A record, no
      MTA-STS policy, no TLS-RPT. Mail needs a domain before any of those mean
      anything. Enter one in the dashboard's Settings.
  when: catena_public_surface_deferred | default(false) | bool

# Deployed AND a domain to publish under.
#
# cloudflare_zone_id is resolved by whichever Ansible-side Cloudflare caller
# needs it first in the run (this file, or reconcile/roles/coturn/tasks/dns.yml)
# and reused after, so a `--tags infrastructure` run resolves it here.
- name: "Mailserver DNS: resolve cloudflare_zone_id (when not resolved yet)"
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)
    - cloudflare_zone_id is not defined
  delegate_to: localhost
  become: false
  block:
    - name: "Mailserver DNS: look up zone_id for {{ cloudflare_zone }}"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones?name={{ cloudflare_zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _ms_dns_zones
      retries: 5
      delay: 6
      until: _ms_dns_zones.status == 200
      no_log: true

    - name: "Mailserver DNS: assert the zone is visible to this token"
      ansible.builtin.assert:
        that:
          - _ms_dns_zones.json.result | length == 1
        fail_msg: >-
          Zone '{{ cloudflare_zone }}' not found (or token lacks access).
          Mail DNS records need an API token with Zone:DNS:Edit scope.

    - name: "Mailserver DNS: capture zone_id"
      ansible.builtin.set_fact:
        cloudflare_zone_id: "{{ _ms_dns_zones.json.result[0].id }}"

- name: "Mailserver DNS: the zones the Cloudflare token reaches"
  ansible.builtin.include_tasks: _mailserver_zones.yml
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)

- name: "Mailserver DNS: the names the mailserver stack runs under"
  ansible.builtin.include_tasks: _mailserver_names.yml
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)

- name: "Mailserver DNS: the stack's names could not be read"
  ansible.builtin.debug:
    msg: >-
      docker could not describe the catena-mailserver_dms service
      ({{ _ms_names_stack.stderr | default('no output') | trim }}), so the name
      and mail domain the mail server runs under are unknown. No mail DNS record
      is published on this converge.
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)
    - not (_ms_names_known | bool)

- name: "Mailserver DNS: report the records left alone"
  ansible.builtin.debug:
    msg: >-
      Mail DNS left alone: {{ skipped | join('; ') }}. The Cloudflare token
      reaches no zone that holds the name, so those records stay as they are.
  vars:
    skipped: >-
      {{ ([] if (_ms_host_reachable | bool) else ['the A record for ' ~ mailserver_stack_hostname])
         + ([] if (_ms_domain_reachable | bool) else ['_mta-sts.' ~ mailserver_stack_domain ~ ' and _smtp._tls.' ~ mailserver_stack_domain]) }}
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)
    - _ms_names_known | bool
    - not (_ms_host_reachable | bool) or not (_ms_domain_reachable | bool)

# --- <stack hostname> A (gray-cloud) -------------------------------------
- name: "Mailserver DNS: publish the mail A record (dms deployed)"
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)
    - _ms_host_reachable | bool
  delegate_to: localhost
  become: false
  block:
    - name: "Mailserver DNS: look up A record for {{ mailserver_stack_hostname }}"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ _ms_host_zone_id }}/dns_records?type=A&name={{ mailserver_stack_hostname }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _ms_dns_a
      retries: 5
      delay: 6
      until: _ms_dns_a.status == 200
      no_log: true

    - name: "Mailserver DNS: create mail A record (gray-cloud) if absent"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ _ms_host_zone_id }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        body_format: json
        body:
          type: A
          name: "{{ mailserver_stack_hostname }}"
          content: "{{ public_ip }}"
          proxied: false
          ttl: 1
          comment: "Managed by catena -- mail plane, MUST be gray-cloud"
        status_code: 200
      when: _ms_dns_a.json.result | length == 0
      no_log: true

    - name: "Mailserver DNS: update mail A record if content/proxy drifted"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ _ms_host_zone_id }}/dns_records/{{ _ms_dns_a.json.result[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        body_format: json
        body:
          type: A
          name: "{{ mailserver_stack_hostname }}"
          content: "{{ public_ip }}"
          proxied: false
          ttl: 1
          # Re-sent because a Cloudflare PUT REPLACES the record: without it a
          # record that drifts once comes back with the ownership marker
          # stripped, and cleanup keyed on "Managed by catena" stops seeing it
          # as ours.
          comment: "Managed by catena -- mail plane, MUST be gray-cloud"
        status_code: 200
      when:
        - _ms_dns_a.json.result | length > 0
        - >-
          _ms_dns_a.json.result[0].content != public_ip
          or _ms_dns_a.json.result[0].proxied | default(false)
      no_log: true

# --- _mta-sts and _smtp._tls under the stack's mail domain ---------------
- name: "Mailserver DNS: publish MTA-STS + TLS-RPT (dms deployed)"
  when:
    - (mailserver_dms_ct | length) > 0
    - not (catena_public_surface_deferred | default(false) | bool)
    - _ms_domain_reachable | bool
  delegate_to: localhost
  become: false
  block:
    # --- _mta-sts.<mail domain> TXT (policy id) -----------------------
    - name: "Mailserver DNS: look up _mta-sts TXT"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ _ms_domain_zone_id }}/dns_records?type=TXT&name=_mta-sts.{{ mailserver_stack_domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _ms_dns_stsid
      no_log: true

    - name: "Mailserver DNS: set _mta-sts TXT (create or update on drift)"
      ansible.builtin.uri:
        url: >-
          {{ cloudflare_api_base }}/zones/{{ _ms_domain_zone_id }}/dns_records{{
            '/' ~ _ms_dns_stsid.json.result[0].id if (_ms_dns_stsid.json.result | length > 0) else '' }}
        method: "{{ 'PUT' if (_ms_dns_stsid.json.result | length > 0) else 'POST' }}"
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        body_format: json
        body:
          type: TXT
          name: "_mta-sts.{{ mailserver_stack_domain }}"
          content: "v=STSv1; id={{ mailserver_mta_sts_policy_id }};"
          ttl: 1
          comment: "Managed by catena -- mail plane, MTA-STS policy id"
        status_code: 200
      when: >-
        (_ms_dns_stsid.json.result | length) == 0
        or _ms_dns_stsid.json.result[0].content != ('v=STSv1; id=' ~ mailserver_mta_sts_policy_id ~ ';')
      no_log: true

    # --- _smtp._tls.<mail domain> TXT (TLS-RPT) -----------------------
    - name: "Mailserver DNS: look up _smtp._tls TXT"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ _ms_domain_zone_id }}/dns_records?type=TXT&name=_smtp._tls.{{ mailserver_stack_domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _ms_dns_tlsrpt
      no_log: true

    - name: "Mailserver DNS: set _smtp._tls TXT (create or update on drift)"
      ansible.builtin.uri:
        url: >-
          {{ cloudflare_api_base }}/zones/{{ _ms_domain_zone_id }}/dns_records{{
            '/' ~ _ms_dns_tlsrpt.json.result[0].id if (_ms_dns_tlsrpt.json.result | length > 0) else '' }}
        method: "{{ 'PUT' if (_ms_dns_tlsrpt.json.result | length > 0) else 'POST' }}"
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        body_format: json
        body:
          type: TXT
          name: "_smtp._tls.{{ mailserver_stack_domain }}"
          content: "v=TLSRPTv1; rua={{ mailserver_tlsrpt_rua }}"
          ttl: 1
          comment: "Managed by catena -- mail plane, TLS reporting"
        status_code: 200
      when: >-
        (_ms_dns_tlsrpt.json.result | length) == 0
        or _ms_dns_tlsrpt.json.result[0].content != ('v=TLSRPTv1; rua=' ~ mailserver_tlsrpt_rua)
      no_log: true
