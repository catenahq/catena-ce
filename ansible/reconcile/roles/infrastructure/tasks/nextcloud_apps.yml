---
# Nextcloud first-party app provisioning -- post-deploy wiring scripts, one
# per Nextcloud app catena treats as a first-party feature:
#
#   /usr/local/bin/catena-wire-nextcloud-mail  -- installs and enables the
#       Mail app, in which users configure their own mail accounts.
#   /usr/local/bin/catena-wire-nextcloud-webmail-link -- below.
#
# The Mail app is server-local Nextcloud state; no Keycloak realm client is
# needed.

- name: "Nextcloud apps: install Mail wiring script (/usr/local/bin/catena-wire-nextcloud-mail)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/wire-nextcloud-mail.sh"
    dest: /usr/local/bin/catena-wire-nextcloud-mail
    owner: root
    group: root
    mode: "0755"

# Webmail nav link -> standalone Roundcube (mailserver template). Run from
# mailserver_oidc.yml when both Nextcloud and the mailserver are deployed.
# Opens top-level (redirect, not iframe) so Roundcube's Keycloak OAuth works.
- name: "Nextcloud apps: install Webmail-link script (/usr/local/bin/catena-wire-nextcloud-webmail-link)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/wire-nextcloud-webmail-link.sh"
    dest: /usr/local/bin/catena-wire-nextcloud-webmail-link
    owner: root
    group: root
    mode: "0755"
