---
# Rocket.Chat + bundled Jitsi post-deploy wiring. Mirrors
# nextcloud_talk_hpb.yml.
#
# Two layers:
#
#   1. CONVERGE (this file). Install the wire script. meet.<base>
#      resolves through the existing cloudflared wildcard CNAME, so no
#      DNS task is needed here.
#
#   2. POST-DEPLOY (catena-admin action "Wire Rocket.Chat Jitsi"). The
#      RC REST API calls (POST /api/v1/settings/Jitsi_*) inside the
#      running Rocket.Chat container, run on demand by the operator
#      after a Portainer deploy. Backed by
#      /usr/local/bin/catena-wire-rocketchat-jitsi (installed below
#      from vps-scripts/rocketchat-jitsi-wire.sh).
#
# meet.<base> intentionally rides the wildcard CNAME -- the Jitsi web
# UI is HTTP only and goes through cloudflared like every other web
# app. JVB's UDP media is the part that bypasses the tunnel; that one
# binds directly via mode: host on 10000/udp.
#
# WHY NOTHING HERE OPENS THAT PORT. A swarm `mode: host` publish is
# DNAT'd by dockerd in PREROUTING and never reaches ufw's INPUT chain
# -- helpers/public_ports.py states the rule and bench 050b measured
# it, finding three loopback-scoped ports wide open with ufw deny
# rules installed. So a ufw allow for 10000/udp decided nothing: the
# port is reachable because Docker published it, and it closes when
# the service stops. The declaration that makes it AUDITABLE is the
# `vps.expose.udp` label on the jvb service in catena-templates, which
# the registry harvests off the running container; an app port belongs
# to the app's template, not to a converge role.

- name: "RC Jitsi: install host script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/rocketchat-jitsi-wire.sh"
    dest: /usr/local/bin/catena-wire-rocketchat-jitsi
    owner: root
    group: root
    mode: "0755"
