---
# Nextcloud office editors -- the post-deploy wiring script
# /usr/local/bin/catena-wire-nextcloud-office, behind the two mutually
# reversing catena-admin actions "Wire Nextcloud Collabora" and "Wire
# Nextcloud OnlyOffice" (scripts/wire-nextcloud-office.sh says what it does).
#
# Office editors have no Keycloak realm client; they are server-to-server
# WOPI integrations gated by JWT (OnlyOffice) or WOPI-host regex
# (Collabora) inside the editor's own compose.

- name: "Nextcloud office: install the wiring script (/usr/local/bin/catena-wire-nextcloud-office)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/wire-nextcloud-office.sh"
    dest: /usr/local/bin/catena-wire-nextcloud-office
    owner: root
    group: root
    mode: "0755"
