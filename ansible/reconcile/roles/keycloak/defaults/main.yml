---
# reconcile/roles/keycloak deploys Keycloak (Phase Two distribution) as a compose
# app. Phase Two extensions ship in the same image: Admin Portal,
# Organizations (multi-tenancy), IdP Wizards, Events (audit log +
# webhooks), Magic Link, themes.
#
# Database: Keycloak gets its own Postgres database (`keycloak`) and
# user (`keycloak`) inside the catena-postgres swarm service that
# reconcile/roles/postgres deploys. Project convention is one Postgres per VPS,
# multiple DBs inside (see the PLANNING.md sec 2 decision in the sibling
# catenahq/sales repo). This DB lives in catena-owned Postgres, not the
# control plane's own (Portainer uses BoltDB, no shared Postgres to
# piggyback on).

# --- Hostname ---
keycloak_subdomain: "{{ cfg_keycloak_subdomain | default('auth', true) }}"
keycloak_hostname: "{{ keycloak_subdomain }}.{{ cloudflare_zone }}"

# --- Image pin ---
# Phase Two distribution image. Repo:
#   https://github.com/p2-inc/phasetwo-containers
#   quay.io/phasetwo/phasetwo-keycloak
# Pinned to an immutable build, <kc-version>.<unix-build-time>. Phase Two
# re-pushes the plain <kc-version> tag on every rebuild, so that tag names
# different bytes over time; a build tag names one image, and the update
# engine orders builds of one version by their build time. Phase Two tracks
# Keycloak 26.6.x (one minor behind stock 26.7).
keycloak_image_tag: "26.6.7.1790010472"
keycloak_image: >-
  {{ ('quay.io/phasetwo/phasetwo-keycloak:' ~ keycloak_image_tag)
     | catena_image_pin(catena_image_pins | default({})) }}

# --- Compose ---
keycloak_compose_name: "keycloak"
keycloak_internal_port: 8080 # KC's HTTP port inside the container

# The swarm secret holding Keycloak's credentials file
# (templates/keycloak.conf.j2): the name its content's hash is appended to,
# and the file it is mounted as under /run/secrets/.
keycloak_config_secret_base: "keycloak-conf"
keycloak_config_target: "keycloak.conf"

# Keycloak 26 split health/metrics off onto a separate "management"
# port (default 9000). Probes against http://localhost:8080/health/*
# return 404 even when KC_HEALTH_ENABLED=true. Used by validate.yml's
# in-container probe + the compose healthcheck.
keycloak_management_port: 9000

# --- DB (inside catena-postgres) ---
keycloak_db_name: "keycloak"
keycloak_db_user: "keycloak"

# --- Hostnames + reverse-proxy mode ---
# Behind CF Tunnel + Traefik. CF terminates TLS, Traefik forwards on
# the `web` entrypoint, KC sees plain HTTP. proxy_headers=xforwarded
# tells KC to trust X-Forwarded-* so absolute URLs in the login flow
# come out as https://auth.<zone>/...
keycloak_proxy_headers: "xforwarded"
keycloak_http_enabled: true

# --- Health probe ---
# Phase Two image enables /health/* endpoints by default. We probe
# /health/ready post-deploy + during validate.yml.
keycloak_health_path: "/health/ready"

# --- Realm bootstrap (keycloak-config-cli) ---
# adorsys' import-update-merge tool. Runs as a one-shot docker container
# attached to catena-network so it can hit keycloak-server:8080. Image
# tag must not target a Keycloak major.minor newer than
# keycloak_image_tag (the tool's CRD parser breaks across major-version
# drift). Track upstream:
#   https://hub.docker.com/r/adorsys/keycloak-config-cli/tags
# Tag form: `<cli-version>-<kc-version>`, immutable (the `latest-<kc>`
# form is re-pushed on every cli release). The update engine moves it
# together with Keycloak and caps it at Keycloak's major.minor. It can run
# one minor behind Keycloak while adorsys has no build for the newer minor:
# the realm-import REST surface is stable across minors, and ce_install
# runs config-cli during bootstrap, so the bench gates the pairing.
keycloak_config_cli_image_tag: "6.5.1-26.5.5"
keycloak_config_cli_image: >-
  {{ ('adorsys/keycloak-config-cli:' ~ keycloak_config_cli_image_tag)
     | catena_image_pin(catena_image_pins | default({})) }}

# Host-side dirs of the rendered realm YAML files, under a 0700 parent
# (tasks/realm_bootstrap.yml). Each import bind-mounts one of them into the
# keycloak-config-cli container at /config (RO): the realm dir on every
# converge, the seed dir while the realm is bootstrapped.
keycloak_config_dir: "/etc/catena/keycloak"
keycloak_realm_host_dir: "{{ keycloak_config_dir }}/realms"
keycloak_realm_seed_dir: "{{ keycloak_config_dir }}/seed"

# The admin email the last realm import ran under, beside the bootstrap
# markers: an admin email change moves the admin's accounts from it
# (tasks/realm_bootstrap.yml).
keycloak_admin_email_record: "/var/lib/catena/keycloak-realm-admin-email"

# Realm name owning all per-VPS clients + groups + users. Single-realm
# per VPS today; Phase Two Organizations (multi-tenancy inside one
# realm) is the upgrade path when a client wants sub-tenants.
keycloak_realm: "vps"

# Display name surfaced on the login page and as the sender name of the realm's
# mail: the client's own domain, which is what a person signing in recognises.
#
# Derived from cloudflare_zone, which is a host fact the store already owns. The
# login page takes it in the realm seed and follows a new domain while it still
# holds the name the seed or a converge wrote, which the realm records in the
# attribute below; a trading name given to it in Keycloak's realm settings
# stays (playbooks/filter_plugins/keycloak_signin_name.py). The sender name
# follows the zone with the rest of the realm's mail settings.
keycloak_realm_display_name: "{{ cloudflare_zone }}"
keycloak_realm_display_name_attribute: "catenaDisplayName"

# Nightly realm-export OnCalendar. Default 03:30 host-local --
# spaced from the backup window (default 02:00) and any auto-update
# fire window. Override per inventory if the host has unusual
# scheduling pressure.
keycloak_realm_export_oncalendar: "*-*-* 03:30:00"

# --- SMTP resolution ---------------------------------------------------
# One choice, one sender address, one credential.
#
# SMTP_PROVIDER says where mail goes: `resend` and `brevo` are known relays
# whose host, port and (for Resend) username are constants, and `server` is the
# escape hatch for anything else. SMTP_SENDER is the address it comes from, in
# every case. The password is the same EXTERNAL_SECRET in all three.
#
# SMTP_PROVIDER is the whole answer to "where does this server send mail
# from": one declared field, on the page that sets it, with no precedence rule
# behind it and no second field that can contradict it. Changing provider is
# changing that one value.
#
# An unrecognised provider resolves to no SMTP rather than to a guess: mail
# that silently goes nowhere is harder to notice than a realm with no mail
# configured, which says so on its own login page.

# The ladder itself lives in playbooks/filter_plugins/smtp_resolve.py, and
# every consumer calls it -- here, and the infrastructure role's
# infrastructure_smtp (Beszel, Healthchecks, WordPress) -- so a host's
# password-reset mail, its alerts and its contact form resolve to the same
# relay from the same stored config. test_smtp_resolution.py holds each
# consumer to the filter.
_smtp: >-
  {{ cfg_smtp_provider | default('') | catena_smtp_resolve(
       host=cfg_smtp_host | default(''),
       port=cfg_smtp_port | default(''),
       user=cfg_smtp_user | default(''),
       sender=cfg_smtp_sender | default(''),
       fallback_sender=admin_email) }}

smtp_enabled: "{{ _smtp.enabled }}"
smtp_host: "{{ _smtp.host }}"
smtp_port: "{{ _smtp.port }}"
smtp_user: "{{ _smtp.user }}"
smtp_from: "{{ _smtp.sender }}"
# Always STARTTLS on the port given, never implicit TLS: that is what
# realm-vps.yaml.j2 renders (starttls true, ssl false) and what both known
# providers expect on 587. There is no TLS toggle to set: the template pins
# both values, so nothing can accept a setting that changes nothing.
smtp_use_starttls: true

# The catena-admin panel's realm service account (users + groups). The panel
# reads the id from its own env default, so this is the converge's copy of a
# product constant and the two must agree -- ops automation/audit/panel_env.py
# gates exactly that class of duplication.
catena_admin_panel_client_id: "catena-admin-panel"

# The identity-posture probe's realm service account (read-only supervision).
# Same shape as the line above, and the same duplication for the same reason:
# only the converge can create the client, only the image knows what it
# authenticates as. It is the probe binary's own -client-id default
# (catena-admin payload/cmd/catena-identity-probe).
catena_identity_probe_client_id: "catena-identity-probe"

# Whether every account in this realm must set up a second factor.
#
# Read from the on-box store (IDENTITY_ENFORCE_MFA, a Settings page value), so
# a client turns it on without an operator. The CONVERGE owns the write because
# a required action is realm configuration, and the boundary this repo draws
# puts realm config here and realm PEOPLE in the panel -- which is also why the
# panel's service account is denied manage-realm.
#
# Off by default: turning it on mid-life locks every existing user out of their
# next login until they enrol, and that is a decision with a support cost
# attached rather than one a converge should make on a client's behalf.
keycloak_enforce_mfa: "{{ cfg_identity_enforce_mfa | default('false') }}"
