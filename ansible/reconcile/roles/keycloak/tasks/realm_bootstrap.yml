---
# Realm bootstrap via keycloak-config-cli (adorsys/keycloak-config-cli).
#
# Idempotency: keycloak-config-cli's default import behavior is "merge"
# (existing entities reconciled by identifier; new entities created;
# absent entities NOT removed unless explicitly listed with
# `state: absent`). Re-running this task on every converge is safe and
# cheap.
#
# Atomicity: gated on Keycloak's /health/ready (set by tasks/validate.yml's
# in-container probe -- which runs AFTER tasks/deploy.yml). Per project
# CLAUDE.md, the import MUST NOT race the server's own first-boot
# migrate; /health/ready is the canonical "migrations are done" signal,
# stronger than "container exists in docker ps".
#
# Two imports. The SEED (realm-vps.yaml.j2 with realm_seed true: the realm
# admin's account, the realm's tunable settings and, when it creates the realm,
# the realm switched on) is rendered into keycloak_realm_seed_dir, imported
# while a bootstrap marker or the realm itself is missing, and deleted. The
# PERSISTENT realm dir (realm_seed false, plus the client files) is imported on
# every converge, and what it renders depends on the store alone, so the
# converge that bootstraps the realm leaves it settled.

# The realm files carry the SMTP password and the client secrets, and the
# seed the admin password. 0700 on their parent keeps every account but root
# out; the config-cli container bind-mounts a 0755 subdirectory and still
# reads it.
- name: "Keycloak realm: keep the realm config root private"
  ansible.builtin.file:
    path: "{{ keycloak_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Keycloak realm: ensure host-side realm dir"
  ansible.builtin.file:
    path: "{{ keycloak_realm_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The bootstrap markers. Either one missing renders and imports the seed, then
# writes both; so does a realm missing from Keycloak (below).
#
# The realm admin: KC_BOOTSTRAP_ADMIN_* creates the admin's account in the
# MASTER realm and nowhere else, and this realm's copy of that account has no
# password unless one is imported. Seeding it from the same on-box
# admin_password keeps one identity from becoming two accounts, one of them
# passwordless. The account is seeded once, password and all: asserting it on
# every converge would undo each edit made to it, a password changed in the
# Account Console or the account disabled in the admin console. Removing the
# marker re-seeds it from the store, which is the recovery path for an admin
# who has lost it.
#
# The tunable settings (login flow, brute-force numbers, defaultGroups,
# locales) are preferences about how this client runs their own tenant, so an
# edit made in the Keycloak admin UI must survive the next converge. The four
# that are NOT preferences -- registrationAllowed, duplicateEmailsAllowed,
# editUsernameAllowed, bruteForceProtected -- are in the persistent file,
# because public self-registration or an unprotected login on an SSO tenant is
# a security posture this product states, not a setting.
#
# The markers live under /var/lib/catena, outside the restore set, so a host
# that restores its data keeps its own: its realm was seeded here once, and
# the restored database carries the source's settings, which a later converge
# must not reset.
- name: "Keycloak realm: probe admin-password bootstrap marker"
  ansible.builtin.stat:
    path: /var/lib/catena/keycloak-realm-admin-bootstrapped
  register: _kc_admin_pw_marker

- name: "Keycloak realm: probe realm-settings bootstrap marker"
  ansible.builtin.stat:
    path: /var/lib/catena/keycloak-realm-settings-bootstrapped
  register: _kc_settings_marker

# realm_bootstrap.yml is included from BOTH reconcile/roles/keycloak/tasks/main.yml
# AND reconcile/roles/oauth2_proxy/tasks/main.yml (the latter calls back here to
# re-import the realm after rendering its own client. Mirrors the
# pattern oauth2_proxy uses for realm-oauth2-proxy.yaml.j2). Ansible's
# template lookup uses the CALLING role's templates/ dir, so when the
# call comes from oauth2_proxy this template wouldn't resolve. Use an
# explicit playbook_dir-relative path so it works from either caller.
- name: "Keycloak realm: render realm config ({{ keycloak_realm }})"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-vps.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/{{ keycloak_realm }}.yaml"
    owner: root
    group: root
    mode: "0644"
  vars:
    realm_seed: false
  register: _keycloak_realm_render

# Service-account client for the host-side dashboard-sync cron. Rendered
# into the same /config dir so the keycloak-config-cli import below picks
# it up. Gated on the secret being present so a realm imports cleanly
# when it is not (the client is simply absent). The dashboard-sync
# redirect-URI sync no-ops without the client.
- name: "Keycloak realm: render dashboard-sync service-account client"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-dashboard-sync.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/dashboard-sync.yaml"
    owner: root
    group: root
    mode: "0644"
  when: dashboard_sync_client_secret | default('') | length > 0

# The panel's own service account: users, groups and memberships. Same shape,
# same gate, DIFFERENT roles -- dashboard-sync manages clients, this manages
# people, and one credential holding both would let a leak meant to add a
# user rewrite what an application trusts instead.
#
# The converge owns this client, its secret and the roles it may use. It does
# NOT own the users and groups the panel then manages with it: those change when
# the client hires somebody, not when the product ships, so they are client-owned
# and the panel is their single writer.
- name: "Keycloak realm: render catena-admin panel service-account client"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-admin-panel.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/admin-panel.yaml"
    owner: root
    group: root
    mode: "0644"
  when: catena_admin_panel_client_secret | default('') | length > 0

# The identity-posture probe's own client. Same shape and same gate as the two
# above, and a THIRD client rather than a reuse of either: this one needs
# view-realm (which is how it reads whether MFA is enforced) and the panel is
# deliberately denied it, while the panel needs manage-users and a supervision
# credential must never hold it.
- name: "Keycloak realm: render identity-probe service-account client"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-identity-probe.yaml.j2"
    dest: "{{ keycloak_realm_host_dir }}/identity-probe.yaml"
    owner: root
    group: root
    mode: "0644"
  when: catena_identity_probe_client_secret | default('') | length > 0

# In-container /health/ready re-probe immediately before the import.
# tasks/validate.yml's probe is run AFTER this file (see main.yml
# order); we duplicate the probe here so realm-bootstrap is safe to
# invoke standalone (e.g. `--tags keycloak_realm` without re-running
# the full role).
- name: "Keycloak realm: find running server container"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{{ "{{" }}.Names{{ "}}" }}' \
      | grep -E '{{ keycloak_compose_name | swarm_container_regex(keycloak_server_service) }}' \
      | head -n1
  args:
    executable: /bin/bash
  register: _keycloak_realm_server_ct
  changed_when: false
  retries: 30
  delay: 4
  until: _keycloak_realm_server_ct.stdout | length > 0

- name: "Keycloak realm: gate import on /health/ready"
  # Phase Two image has no curl; use bash + /dev/tcp like validate.yml.
  #
  # Re-resolved per attempt, for the same reason validate.yml's probe is: a
  # swarm task id changes on every reschedule, and this loop exists to span
  # exactly that window.
  ansible.builtin.shell: |
    set -o pipefail
    ct=$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ keycloak_compose_name | swarm_container_regex(keycloak_server_service) }}' | head -n1)
    [ -n "$ct" ] || { echo "no running keycloak container right now" >&2; exit 1; }
    docker exec "$ct" bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ keycloak_management_port }} && printf "GET {{ keycloak_health_path }} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q 200 && echo 200'
  args:
    executable: /bin/bash
  register: _keycloak_realm_health
  changed_when: false
  failed_when: false
  retries: 30
  delay: 4
  until:
    - _keycloak_realm_health.rc == 0
    - "'200' in (_keycloak_realm_health.stdout | default(''))"

# The email the last import ran under, recorded beside the bootstrap markers:
# the automation client's first sign-in and an admin email change read it.
- name: "Keycloak realm: the admin email the last import ran under"
  ansible.builtin.slurp:
    src: "{{ keycloak_admin_email_record }}"
  register: _kc_admin_email_record
  failed_when: false

- name: "Keycloak realm: keep the admin email the last import ran under"
  ansible.builtin.set_fact:
    _kc_recorded_admin_email: >-
      {{ (_kc_admin_email_record.content | default('') | b64decode) | trim }}

# --- The automation client ---
#
# Every realm import and kcadm session of the converge signs in to the master
# realm as the automation client (_master_login.yml): the master admin carries a
# second factor (below), which a kcadm sign-in cannot answer. The client's
# service account holds the master realm's admin role: the converge manages the
# master realm's own settings and its admin's account as well as this realm,
# and a credential that may change the master admin's account reaches every
# realm through it, so no narrower set of roles would narrow what it can reach.
#
# The client is ready once it signs in and reads the master realm, which takes
# an admin role (RealmAdminResource getRealm, Keycloak 26.6.7). Otherwise it is
# created, or given the store's secret and the role, on an admin-password
# sign-in as admin_email, then as the email the last import ran under when that
# differs (an email change not yet moved). That works while the master admin
# has no second factor, which is asked for only once the client exists: the
# converge that first meets a host, fresh or upgraded, makes it, and a restore
# brings it back with the database that holds it. The secret and the password
# reach kcadm as KC_CLI_CLIENT_SECRET and KC_CLI_PASSWORD, read from this
# task's stdin, and the client's representation on kcadm's stdin, never an
# argv.
#
# A refused password counts toward the master realm's lockout: 30 failures by
# Keycloak's default failureFactor, which the lockout step below leaves as it
# finds it, and two within a second lock the account for a minute
# (DefaultBruteForceProtector, Keycloak 26.6.7). So an attempt tries each
# address once, and an attempt in which Keycloak is ready (/health/ready) and
# refuses them all exits 3, which ends the retries: they wait out a Keycloak
# still starting or rescheduled, which refuses no password.
- name: "Keycloak realm: the automation client exists"
  ansible.builtin.shell: |
    set -euo pipefail
    IFS= read -r KC_CLI_CLIENT_SECRET
    IFS= read -r KC_CLI_PASSWORD
    export KC_CLI_CLIENT_SECRET KC_CLI_PASSWORD
    client={{ keycloak_automation_client_id | quote }}
    server=http://localhost:{{ keycloak_internal_port }}
    ct=$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -E '{{ keycloak_compose_name | swarm_container_regex(keycloak_server_service) }}' | head -n1) || true
    [ -n "$ct" ] || { echo "no running keycloak container right now" >&2; exit 1; }
    kc() { docker exec -e KC_CLI_CLIENT_SECRET -e KC_CLI_PASSWORD "$ct" /opt/keycloak/bin/kcadm.sh "$@"; }
    ready() { docker exec "$ct" bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ keycloak_management_port }} && printf "GET {{ keycloak_health_path }} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'; }
    acts() {
      kc config credentials --server "$server" --realm master --client "$client" \
        && kc get realms/master --fields realm >/dev/null
    }
    if acts; then
      exit 0
    fi
    admin=
    for user in {{ [admin_email, _kc_recorded_admin_email] | select | unique | map('quote') | join(' ') }}; do
      if kc config credentials --server "$server" --realm master --user "$user"; then
        admin=$user
        break
      fi
    done
    if [ -z "$admin" ]; then
      if ready; then
        echo "$client cannot manage the master realm, and the admin's password does not sign in to it" >&2
        exit 3
      fi
      echo "keycloak is not ready" >&2
      exit 1
    fi
    rep=$(printf '{"clientId":"%s","name":"Catena automation","description":"%s","enabled":true,"publicClient":false,"clientAuthenticatorType":"client-secret","serviceAccountsEnabled":true,"standardFlowEnabled":false,"implicitFlowEnabled":false,"directAccessGrantsEnabled":false,"secret":"%s"}' \
      "$client" "Signs the converge and its realm imports in to the master realm." "$KC_CLI_CLIENT_SECRET")
    id=$(kc get clients -r master -q "clientId=$client" --fields id --format csv --noquotes)
    if [ -z "$id" ]; then
      printf '%s' "$rep" | docker exec -i "$ct" /opt/keycloak/bin/kcadm.sh create clients -r master -f -
      echo "created: $client"
    else
      printf '%s' "$rep" | docker exec -i "$ct" /opt/keycloak/bin/kcadm.sh update "clients/$id" -r master -m -f -
      echo "secret reset: $client"
    fi
    kc add-roles -r master --uusername "service-account-$client" --rolename admin
    acts
  args:
    executable: /bin/bash
    stdin: "{{ keycloak_automation_client_secret }}\n{{ admin_password }}"
  register: _kc_automation_client
  changed_when: >-
    'created:' in _kc_automation_client.stdout
    or 'secret reset:' in _kc_automation_client.stdout
  # Reported by the task below, which no_log here would leave unexplained.
  # Retries that run out fail the task whatever failed_when says, so the error
  # is ignored here and that task stops the converge.
  ignore_errors: true
  retries: 15
  delay: 4
  until: _kc_automation_client.rc in [0, 3]
  no_log: true

# The last attempt's stderr: kcadm's errors, which name the sign-ins it tried
# and how each was refused, and the script's own, neither carrying a
# credential.
- name: "Keycloak realm: stop when the automation client cannot be made"
  ansible.builtin.fail:
    msg:
      - "The converge cannot manage Keycloak (rc={{ _kc_automation_client.rc }}): {{ _kc_automation_client_failure }}"
      - "{{ (_kc_automation_client.stderr_lines | default([]))[-20:] }}"
  vars:
    _kc_automation_client_failure: >-
      {{ ("the automation client " ~ keycloak_automation_client_id
          ~ " cannot manage Keycloak's master realm, and the master admin's password does not sign in to it."
          ~ " The client must exist in the master realm with keycloak_automation_client_secret from"
          ~ " /etc/catena/config.json as its secret, and its service account must hold the master realm's admin role.")
         if _kc_automation_client.rc == 3
         else "the automation client step ran out of retries, Keycloak not ready or the client not made; its last attempt's errors follow." }}
  when: _kc_automation_client.rc != 0

# The session the admin move and the realm list run on. Its `always` is the
# one the realm seed's import below explains.
- name: "Keycloak realm: sign kcadm in to the master realm"
  ansible.builtin.include_tasks:
    file: _master_login.yml
    apply:
      tags: [always]

# --- An admin email change moves the admin, and adds none ---
#
# The realm seed keys the realm admin on its username, admin_email.
# keycloak-config-cli finds a user by username (then by email, first and last
# name together), creates one it does not find, and deletes none
# (UserImportService, keycloak-config-cli v6.5.1): re-seeded under a new email,
# the seed would add a second admin. The step that refills an empty /admin
# finds this realm's account by admin_email, and the master realm's second
# factor is asked of the master account named by it. So before either import,
# on the automation client's session, the admin's two accounts take the new
# email, by id, which keeps their passwords and second factors (Keycloak keys
# both on the user id):
#   - the master realm's, whose username the admin API changes only while the
#     realm allows username edits, so that is allowed for the one update;
#   - this realm's, whose username follows its email
#     (registrationEmailAsUsername).
# In either realm, a new email that already holds an account is left for an
# administrator to settle.
- name: "Keycloak realm: move the admin's accounts to a changed admin email"
  ansible.builtin.shell: |
    set -euo pipefail
    old={{ _kc_recorded_admin_email | quote }}
    new={{ admin_email | quote }}
    realm={{ keycloak_realm | quote }}
    kc() { docker exec {{ _kc_master_login.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    user_id() { kc get users -r "$1" -q "username=$2" -q exact=true --fields id --format csv --noquotes; }
    old_id=$(user_id master "$old")
    new_id=$(user_id master "$new")
    if [ -n "$old_id" ] && [ -z "$new_id" ]; then
      allowed=$(kc get realms/master --fields editUsernameAllowed --format csv --noquotes)
      kc update realms/master -s editUsernameAllowed=true
      kc update "users/$old_id" -r master -s "username=$new"
      kc update realms/master -s "editUsernameAllowed=$allowed"
      echo "moved: master"
    elif [ -n "$old_id" ]; then
      echo "both $old and $new hold an account in master: neither was moved" >&2
    fi
    old_id=$(user_id "$realm" "$old")
    new_id=$(user_id "$realm" "$new")
    if [ -n "$old_id" ] && [ -z "$new_id" ]; then
      kc update "users/$old_id" -r "$realm" -s "email=$new"
      echo "moved: $realm"
    elif [ -n "$old_id" ]; then
      echo "both $old and $new hold an account in $realm: neither was moved" >&2
    fi
  args:
    executable: /bin/bash
  register: _kc_admin_move
  changed_when: "'moved:' in _kc_admin_move.stdout"
  when:
    - _kc_recorded_admin_email | length > 0
    - _kc_recorded_admin_email != admin_email

# Whether the realm exists, from the master realm's list of realms. A realm
# Keycloak's database lost while the markers remain is created again by the
# seed, the one import that switches it on: the persistent import would create
# it switched off and without its admin account. A failed listing fails the
# task rather than reading as a missing realm, which would re-seed the admin's
# password.
- name: "Keycloak realm: list the realms Keycloak holds"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ _kc_master_login.stdout }}"
      - /opt/keycloak/bin/kcadm.sh
      - get
      - realms
      - --fields
      - realm
      - --format
      - csv
      - --noquotes
  register: _kc_realms
  changed_when: false

# The seed, imported alone, and deleted whether the import succeeded or not.
# The markers are written only once it has.
- name: "Keycloak realm: seed the admin password and the realm settings"
  when: >-
    not (_kc_admin_pw_marker.stat.exists and _kc_settings_marker.stat.exists)
    or keycloak_realm not in _kc_realms.stdout_lines
  block:
    - name: "Keycloak realm: ensure the seed dir"
      ansible.builtin.file:
        path: "{{ keycloak_realm_seed_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Keycloak realm: render the realm seed ({{ keycloak_realm }})"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-vps.yaml.j2"
        dest: "{{ keycloak_realm_seed_dir }}/{{ keycloak_realm }}.yaml"
        owner: root
        group: root
        mode: "0644"
      vars:
        realm_seed: true
        realm_create: "{{ keycloak_realm not in _kc_realms.stdout_lines }}"

    # apply: the tasks inside an include carry no tag of their own, so a
    # tag-scoped converge (--tags keycloak_realm) would fire this include and
    # skip the import. `always` runs them whenever the include itself runs.
    - name: "Keycloak realm: import the realm seed"
      ansible.builtin.include_tasks:
        file: _config_cli_import.yml
        apply:
          tags: [always]
      vars:
        kc_import_dir: "{{ keycloak_realm_seed_dir }}"
        kc_import_rendered: true

    - name: "Keycloak realm: mark the admin password as bootstrapped"
      ansible.builtin.file:
        path: /var/lib/catena/keycloak-realm-admin-bootstrapped
        state: touch
        owner: root
        group: root
        mode: "0644"

    - name: "Keycloak realm: mark the realm settings as bootstrapped"
      ansible.builtin.file:
        path: /var/lib/catena/keycloak-realm-settings-bootstrapped
        state: touch
        owner: root
        group: root
        mode: "0644"
  always:
    - name: "Keycloak realm: delete the realm seed"
      ansible.builtin.file:
        path: "{{ keycloak_realm_seed_dir }}/{{ keycloak_realm }}.yaml"
        state: absent

- name: "Keycloak realm: import the realm config"
  ansible.builtin.include_tasks:
    file: _config_cli_import.yml
    apply:
      tags: [always]
  vars:
    kc_import_dir: "{{ keycloak_realm_host_dir }}"
    kc_import_rendered: "{{ _keycloak_realm_render is changed }}"

# Read by the next converge's move of the admin's accounts above.
- name: "Keycloak realm: record the admin email this import ran under"
  ansible.builtin.copy:
    dest: "{{ keycloak_admin_email_record }}"
    content: "{{ admin_email }}\n"
    owner: root
    group: root
    mode: "0644"

# ─── Clear the "temporary admin" marker on the master-realm bootstrap user ───
#
# Keycloak 26's `KC_BOOTSTRAP_ADMIN_*` env vars create the first master-
# realm admin AND tag the user with `is_temporary_admin=true` (set in
# ApplianceBootstrap.java via UserModel.IS_TEMP_ADMIN_ATTR_NAME). The
# admin console reads this attribute via the WhoAmI endpoint
# (AdminConsole.java) and renders a yellow banner urging the operator
# to "create a permanent admin account and delete the temporary one".
#
# In our automated stack the bootstrap admin IS the permanent admin
# (single-operator; the password lives in the on-box store and is rotated
# from catena-admin).
# The banner is noise. Clear the attribute so the WhoAmI check
# returns false and the banner stays hidden.
#
# Two-step because Keycloak 26's master realm has
# `unmanagedAttributePolicy=DISABLED` by default: any attempt to
# modify a user attribute that isn't in the declared user-profile
# (`username`, `email`, `firstName`, `lastName`, etc.) is SILENTLY
# DROPPED -- the kcadm update returns rc=0 but the value doesn't
# change. Workaround: flip the policy to ENABLED, clear the attr,
# flip back to DISABLED. Both transitions are idempotent.

# RE-RESOLVE the container before the cleanup block runs.
#
# The name captured at the top of this file is a swarm TASK container
# (`keycloak_server.1.<task-id>`), and the task id changes on every reschedule.
# Everything between here and there -- the realm import, the client work, a
# health blip, a docker restart on a freshly restored host -- can cost the
# server its task, and swarm replaces it with a new id. The eight docker execs
# below would then address a container that is gone.
#
# In `docker service ps keycloak_server` that reads as
#
#   keycloak_server.1  Failed  "No such container: keycloak_server.1.6h4k73..."
#
# and the converge dies on the next task, with no_log hiding the reason.
#
# The /health/ready gate above this file's import re-resolves per attempt, for
# exactly this reason. This applies the same rule to the cleanup half.
- name: "Keycloak realm: re-resolve the server container before cleanup"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{{ "{{" }}.Names{{ "}}" }}' \
      | grep -E '{{ keycloak_compose_name | swarm_container_regex(keycloak_server_service) }}' \
      | head -n1
  args:
    executable: /bin/bash
  register: _keycloak_realm_server_ct
  changed_when: false
  retries: 30
  delay: 4
  until: _keycloak_realm_server_ct.stdout | length > 0

# Retried and re-resolving the container each attempt (_master_login.yml): the
# sign-in is the first use of the name above, so a reschedule landing between
# the two would put the whole cleanup back where it started, and a server still
# finishing its own startup is waited out. `always` for the reason the realm
# seed's import gives.
- name: "Keycloak realm: kcadm login to master (for temp-admin cleanup)"
  ansible.builtin.include_tasks:
    file: _master_login.yml
    apply:
      tags: [always]

- name: "Keycloak realm: look up bootstrap admin user-id in master"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ _keycloak_realm_server_ct.stdout }}"
      - /opt/keycloak/bin/kcadm.sh
      - get
      - users
      - -r
      - master
      - -q
      - "username={{ admin_email }}"
      - --fields
      - id,attributes
  register: _master_admin_lookup
  changed_when: false
  failed_when: false

- name: "Keycloak realm: parse bootstrap admin id + temp-admin marker"
  ansible.builtin.set_fact:
    # `default('[]', true)` fires when stdout is falsy (undefined OR
    # empty string), not just undefined. kcadm.sh get users (above) has
    # failed_when:false so a transient master-realm hiccup yields an
    # empty string; without the truthy-default, from_json('') raises
    # and bombs the converge. The downstream clear-temp-admin block is
    # already gated on `_master_admin_id | length > 0`, so falling
    # through with id='' is the correct no-op.
    _master_admin_id: >-
      {{
        ((_master_admin_lookup.stdout | default('[]', true) | from_json)
         | first | default({})).get('id', '')
      }}
    _master_admin_is_temp: >-
      {{
        ((((_master_admin_lookup.stdout | default('[]', true) | from_json)
           | first | default({})).get('attributes', {}) or {})
         .get('is_temporary_admin', ['false'])
         | first | default('false')) | lower == 'true'
      }}

- name: "Keycloak realm: clear is_temporary_admin marker (skip if already gone)"
  when:
    - (_master_admin_id | default('')) | length > 0
    - _master_admin_is_temp | bool
  block:
    - name: "Keycloak realm: read master users-profile (capture current policy)"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_realm_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - get
          - realms/master/users/profile
      register: _master_profile_pre
      changed_when: false

    - name: "Keycloak realm: stage profile with unmanagedAttributePolicy=ENABLED"
      ansible.builtin.copy:
        dest: /tmp/master-profile-enabled.json
        mode: "0600"
        content: >-
          {{ (_master_profile_pre.stdout | from_json)
             | combine({'unmanagedAttributePolicy': 'ENABLED'})
             | to_json }}

    - name: "Keycloak realm: copy enabled-policy profile into KC container"
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - /tmp/master-profile-enabled.json
          - "{{ _keycloak_realm_server_ct.stdout }}:/tmp/master-profile-enabled.json"
      changed_when: false

    - name: "Keycloak realm: temporarily set master profile to ENABLED policy"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_realm_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - update
          - realms/master/users/profile
          - -f
          - /tmp/master-profile-enabled.json
      changed_when: true

    - name: "Keycloak realm: clear is_temporary_admin attribute"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_realm_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - update
          - "users/{{ _master_admin_id }}"
          - -r
          - master
          - -s
          - "attributes.is_temporary_admin=[]"
      changed_when: true

    - name: "Keycloak realm: stage profile with original policy (revert)"
      ansible.builtin.copy:
        dest: /tmp/master-profile-restored.json
        mode: "0600"
        content: "{{ _master_profile_pre.stdout }}"

    - name: "Keycloak realm: copy restored-policy profile into KC container"
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - /tmp/master-profile-restored.json
          - "{{ _keycloak_realm_server_ct.stdout }}:/tmp/master-profile-restored.json"
      changed_when: false

    - name: "Keycloak realm: revert master profile to original policy"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_realm_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - update
          - realms/master/users/profile
          - -f
          - /tmp/master-profile-restored.json
      changed_when: true

# The master realm's sign-in at auth.<zone>/admin: repeated wrong passwords
# lock an account out as they do in this realm, a pause that grows with each
# failure up to 15 minutes (bruteForceProtected; the numbers are the ones
# Keycloak gives every realm it creates, which this realm's seed repeats:
# RealmManager setupRealmDefaults, Keycloak 26.6.7), and the master admin, while
# holding no one-time code, is asked to set one up at their next sign-in
# (CONFIGURE_TOTP), after which the master realm's browser flow asks for it at
# every sign-in. Only the switch and the missing second factor are put back:
# numbers tuned in the master realm stay. The role README says how a lockout or
# a lost second factor is lifted from the server.
- name: "Keycloak realm: the master realm locks out wrong passwords and asks its admin for a second factor"
  ansible.builtin.shell: |
    set -euo pipefail
    kc() { docker exec {{ _keycloak_realm_server_ct.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    admin={{ admin_email | quote }}
    if [ "$(kc get realms/master --fields bruteForceProtected --format csv --noquotes)" != true ]; then
      kc update realms/master -s bruteForceProtected=true
      echo "locks out: master"
    fi
    id=$(kc get users -r master -q "username=$admin" -q exact=true --fields id --format csv --noquotes)
    if [ -z "$id" ]; then
      echo "the master realm has no account $admin to ask for a second factor" >&2
      exit 0
    fi
    held=$(kc get "users/$id/credentials" -r master --fields type --format csv --noquotes)
    if grep -qxF otp <<<"$held"; then
      exit 0
    fi
    asked=$(kc get "users/$id" -r master --fields requiredActions --format csv --noquotes)
    if grep -qxF CONFIGURE_TOTP <<<"${asked//,/$'\n'}"; then
      exit 0
    fi
    kc update "users/$id" -r master -s 'requiredActions+=CONFIGURE_TOTP'
    echo "asks for a second factor: $admin"
  args:
    executable: /bin/bash
  register: _keycloak_master_posture
  changed_when: >-
    'locks out:' in _keycloak_master_posture.stdout
    or 'asks for a second factor:' in _keycloak_master_posture.stdout

# The tier roles the sign-in flows of realm-vps.yaml.j2 check, each held
# through its group. keycloak-config-cli makes a declared role's composites and
# a declared group's role mappings exact, so the realm file declares neither and
# this task only adds: a missing tier role is created, a group without its tier
# role gets it back, and a role an admin maps to /admin or /staff, or adds to a
# tier role, stays. Runs on the kcadm session the login above opened.
- name: "Keycloak realm: each tier group holds its tier role"
  ansible.builtin.shell: |
    set -euo pipefail
    kc() { docker exec {{ _keycloak_realm_server_ct.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    realm={{ keycloak_realm | quote }}
    role={{ item.role | quote }}
    group={{ ('/' ~ item.group) | quote }}
    if ! kc get "roles/$role" -r "$realm" >/dev/null 2>&1; then
      kc create roles -r "$realm" -s "name=$role" -s {{ ('description=' ~ item.description) | quote }}
      echo "created: $role"
    fi
    held=$(kc get-roles -r "$realm" --gpath "$group" --fields name --format csv --noquotes)
    if ! grep -qxF "$role" <<<"$held"; then
      kc add-roles -r "$realm" --gpath "$group" --rolename "$role"
      echo "granted: $role to $group"
    fi
  args:
    executable: /bin/bash
  loop:
    - group: admin
      role: catena-tier-admin
      description: "Signs in to applications limited to administrators. Held through /admin."
    - group: staff
      role: catena-tier-staff
      description: "Signs in to applications open to staff. Held through /staff and its departments."
  loop_control:
    label: "/{{ item.group }}: {{ item.role }}"
  register: _keycloak_tier_role
  changed_when: "'created:' in _keycloak_tier_role.stdout or 'granted:' in _keycloak_tier_role.stdout"

# The realm's default client scopes, which Keycloak copies onto a client it
# creates without scope lists (the applications' own sign-in entries are):
# groups for the group claim every gate and application reads, basic for the
# sub and auth_time claims, acr for the authentication level, and Keycloak's
# own profile, email, roles and web-origins. keycloak-config-cli makes a
# declared list exact, so the realm file declares none and this task only adds:
# a scope an admin adds to the list stays, and one of these taken off it comes
# back.
- name: "Keycloak realm: the default client scopes hold the ones applications need"
  ansible.builtin.shell: |
    set -euo pipefail
    kc() { docker exec {{ _keycloak_realm_server_ct.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    realm={{ keycloak_realm | quote }}
    held=$(kc get default-default-client-scopes -r "$realm" --fields name --format csv --noquotes)
    scopes=$(kc get client-scopes -r "$realm" --fields id,name --format csv --noquotes)
    for name in {{ _keycloak_needed_scopes | map('quote') | join(' ') }}; do
      if grep -qxF "$name" <<<"$held"; then
        continue
      fi
      id=
      while IFS=, read -r sid sname; do
        if [ "$sname" = "$name" ]; then id=$sid; fi
      done <<<"$scopes"
      if [ -z "$id" ]; then
        echo "client scope $name is missing from realm $realm" >&2
        exit 1
      fi
      kc update "default-default-client-scopes/$id" -r "$realm"
      echo "added: $name"
    done
  args:
    executable: /bin/bash
  vars:
    _keycloak_needed_scopes: [groups, profile, email, roles, web-origins, basic, acr]
  register: _keycloak_default_scopes
  changed_when: "'added:' in _keycloak_default_scopes.stdout"

# The realm admin is a seed (realm-vps.yaml.j2), so an edit made to it stays.
# The one thing put back: when /admin has no member left, nobody reaches the
# panel or the admin tools, so the admin account rejoins it. A deleted account
# comes back only through a re-seed (the bootstrap markers above).
- name: "Keycloak realm: an empty /admin gets the realm admin back"
  ansible.builtin.shell: |
    set -euo pipefail
    kc() { docker exec {{ _keycloak_realm_server_ct.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    realm={{ keycloak_realm | quote }}
    admin={{ admin_email | quote }}
    group=$(kc get group-by-path/admin -r "$realm" --fields id --format csv --noquotes)
    members=$(kc get "groups/$group/members" -r "$realm" -l 1 --fields id --format csv --noquotes)
    if [ -n "$members" ]; then
      exit 0
    fi
    user=$(kc get users -r "$realm" -q "username=$admin" -q exact=true --fields id --format csv --noquotes)
    if [ -z "$user" ]; then
      echo "/admin is empty and realm $realm has no account $admin" >&2
      exit 0
    fi
    kc update "users/$user/groups/$group" -r "$realm"
    echo "joined: $admin"
  args:
    executable: /bin/bash
  register: _keycloak_admin_rejoin
  changed_when: "'joined:' in _keycloak_admin_rejoin.stdout"

# A sign-in through an external identity provider finishes in Keycloak's broker
# flows and never returns to the application's sign-in flow, so its tier check
# does not run (IdentityBrokerService, Keycloak 26.6.7). The post-broker-login
# flow realm-vps.yaml.j2 declares runs it, and a provider runs that flow only
# when it names it; the realm has no default for it. So each provider that
# names none is bound to it, adding only: a provider bound to another flow by
# hand keeps it. A provider linked to an organization is left out, since this
# update would unlink it (IdentityProviderResource strips the organization).
- name: "Keycloak realm: every identity provider runs the tier check after a brokered sign-in"
  ansible.builtin.shell: |
    set -euo pipefail
    kc() { docker exec {{ _keycloak_realm_server_ct.stdout | quote }} /opt/keycloak/bin/kcadm.sh "$@"; }
    realm={{ keycloak_realm | quote }}
    flow=catena-post-broker-login
    providers=$(kc get identity-provider/instances -r "$realm" -q realmOnly=true --fields alias,postBrokerLoginFlowAlias --format csv --noquotes)
    while IFS=, read -r alias bound; do
      if [ -z "$alias" ] || [ -n "$bound" ]; then
        continue
      fi
      kc update "identity-provider/instances/$alias" -r "$realm" -s "postBrokerLoginFlowAlias=$flow"
      echo "bound: $alias"
    done <<<"$providers"
  args:
    executable: /bin/bash
  register: _keycloak_post_broker_binding
  changed_when: "'bound:' in _keycloak_post_broker_binding.stdout"

# The whole realm, for its switch and its sign-in page name. `--fields` would
# print the attributes map with its values dropped.
- name: "Keycloak realm: read the realm"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ _keycloak_realm_server_ct.stdout }}"
      - /opt/keycloak/bin/kcadm.sh
      - get
      - "realms/{{ keycloak_realm }}"
  register: _keycloak_realm_rep
  changed_when: false

# A realm an administrator switched off stays off: it may have been cut off
# over a leaked password. Every step of this converge works on it, since kcadm
# and keycloak-config-cli sign in to the master realm and the OIDC discovery
# document and keys the sign-in gates are checked against answer for a realm
# switched off; what stops is every sign-in through it.
- name: "Keycloak realm: the realm is switched off, and stays off"
  ansible.builtin.debug:
    msg: >-
      Realm {{ keycloak_realm }} is switched off in Keycloak, and this converge
      leaves it off. Nobody signs in through it, to the applications or to the
      panel at its public address, and its service accounts get no token:
      dashboard-sync leaves the applications' own sign-in entries waiting and
      the panel's People page cannot read the realm. To switch it back on, open
      the Keycloak admin console, choose realm {{ keycloak_realm }} and turn
      Enabled on in its Realm settings.
  when: not ((_keycloak_realm_rep.stdout | from_json).enabled | bool)

# The sign-in page follows the domain while it holds the name the seed or an
# earlier converge wrote, and keeps a name a person gave it
# (playbooks/filter_plugins/keycloak_signin_name.py). kcadm merges the
# changes into the realm it reads, so the realm's other attributes stay.
- name: "Keycloak realm: the sign-in page name follows the domain"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'exec', _keycloak_realm_server_ct.stdout,
          '/opt/keycloak/bin/kcadm.sh', 'update', 'realms/' ~ keycloak_realm]
         + _keycloak_signin_name_sets }}
  vars:
    _keycloak_signin_name_sets: >-
      {{ _keycloak_realm_rep.stdout | from_json
         | keycloak_signin_name_sets(keycloak_realm_display_name,
                                     keycloak_realm_display_name_attribute) }}
  when: _keycloak_signin_name_sets | length > 0

# The ids of the two sign-in flows realm-vps.yaml.j2 declares, for
# dashboard-sync (reconcile/roles/infrastructure/templates/dashboard-sync.env.j2):
# a client's flow binding takes an id, and the sync's service account manages
# clients without reading the realm's flows. keycloak-config-cli rebuilds a
# changed flow under the id it had, so the ids hold from one converge to the
# next.
- name: "Keycloak realm: read the sign-in flow ids"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ _keycloak_realm_server_ct.stdout }}"
      - /opt/keycloak/bin/kcadm.sh
      - get
      - authentication/flows
      - -r
      - "{{ keycloak_realm }}"
      - --fields
      - id,alias
  register: _keycloak_signin_flow_list
  changed_when: false

- name: "Keycloak realm: keep the sign-in flow ids for dashboard-sync"
  ansible.builtin.set_fact:
    keycloak_signin_flows:
      admin: "{{ _flows['catena-signin-admin'] | default('') }}"
      staff: "{{ _flows['catena-signin-staff'] | default('') }}"
  vars:
    _flows: "{{ _keycloak_signin_flow_list.stdout | from_json | items2dict(key_name='alias', value_name='id') }}"

- name: "Keycloak realm: both sign-in flows exist"
  ansible.builtin.assert:
    that:
      - keycloak_signin_flows.admin | length > 0
      - keycloak_signin_flows.staff | length > 0
    fail_msg: >-
      The realm import succeeded but realm {{ keycloak_realm }} lacks the
      sign-in flow catena-signin-admin or catena-signin-staff that
      realm-vps.yaml.j2 declares. dashboard-sync makes no sign-in entry for an
      application limited to staff or administrators without them. Compare
      `kcadm.sh get authentication/flows -r {{ keycloak_realm }}` in the
      Keycloak container with the file.
