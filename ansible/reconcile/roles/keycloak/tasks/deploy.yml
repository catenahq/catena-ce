---
# Render keycloak.compose.yml.j2 + deploy onto the swarm. Reuses
# reconcile/roles/infrastructure/tasks/swarm_stack.yml -- single canonical helper
# for stack deploy + Traefik route + readiness probe. See its header for
# contract details.
#
# The readiness probe is the public URL (auth.<zone>) which only
# resolves once cloudflared + Traefik route this host AND Keycloak's
# /health/ready returns 200. cloudflared is up by now (roles/
# cloudflare_tunnel runs before this role), but the
# Traefik route for auth.<zone> is the route file swarm_stack.yml writes
# in this same include, after the deploy. Skip the public probe and let
# the in-container healthcheck (defined in keycloak.compose.yml.j2)
# gate readiness; the post-deploy probe in tasks/validate.yml handles
# the cross-check once Traefik picks up the route file.

# Multi-domain: the domains this host serves after its primary,
# catena_secondary_zones, which the compose and the route below both read.
- name: "Keycloak: the served domains"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/served_zones.yml"

# The compose mounts its credentials file (templates/keycloak.conf.j2) by this
# name; swarm holds the value.
- name: "Keycloak: name the credentials file's swarm secret after its content"
  ansible.builtin.set_fact:
    _keycloak_secrets: >-
      {{ [{'base': keycloak_config_secret_base, 'target': keycloak_config_target,
           'value': lookup('template', 'keycloak.conf.j2')}] | swarm_secret_entries }}
  no_log: true

- name: "Keycloak: create the missing swarm secret"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/swarm_secrets.yml"
  vars:
    swarm_secrets: "{{ _keycloak_secrets }}"

- name: "Keycloak: deploy as a swarm stack"
  ansible.builtin.include_tasks: ../../infrastructure/tasks/swarm_stack.yml
  vars:
    svc_name: "{{ keycloak_compose_name }}"
    svc_compose_content: "{{ lookup('template', 'keycloak.compose.yml.j2') }}"
    svc_domain_host: "{{ keycloak_hostname }}"
    # Multi-domain: route every served secondary domain's auth host to Keycloak
    # too (the primary is svc_domain_host above). Empty on a single-domain
    # host, whose route rule is a single Host().
    svc_domain_extra_hosts: >-
      {{ catena_secondary_zones
         | map('regex_replace', '^', keycloak_subdomain ~ '.')
         | list }}
    svc_domain_service: "{{ keycloak_server_service }}"
    svc_domain_port: "{{ keycloak_internal_port }}"
    svc_readiness_skip_reason: >-
      auth.<zone> only becomes reachable once reconcile/roles/infrastructure
      renders the cloudflared ingress + Traefik route. Verified by
      tasks/validate.yml's /health/ready probe + the aggregate post-
      role probe in reconcile/roles/infrastructure.

- name: "Keycloak: remove the swarm secrets no service mounts"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/swarm_secrets_prune.yml"
  vars:
    swarm_secret_bases: ["{{ keycloak_config_secret_base }}"]
