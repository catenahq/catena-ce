---
# Orchestrator for reconcile/roles/keycloak. Order:
# 1. Preflight: secrets + admin email + cloudflare_zone defined.
# 2. Provision keycloak DB + user inside catena-postgres (idempotent
#    via `CREATE ... IF NOT EXISTS`-equivalent guards).
# 3. Render compose + deploy via the Portainer API. Health-gated readiness
#    probe.
# 4. Realm bootstrap (Phase Two extensions, groups, IdP wizards,
#    default clients) via realm_bootstrap.yml -- calls keycloak-config-
#    cli once /health/ready returns 200.
#
# Atomicity: per project CLAUDE.md "Ansible tasks must be idempotent
# AND atomic w.r.t. concurrent service boot": the DB-provision step
# (psql in catena-postgres) only runs once catena-postgres is
# `running`, and the realm-config one-shot gates on Keycloak's
# /health/ready (NOT on container-exists).

- name: "Keycloak: preflight secrets + env"
  ansible.builtin.assert:
    that:
      - keycloak_db_password is defined
      - keycloak_db_password | length > 20
      - admin_password is defined
      - admin_password | length >= 16
      - admin_email | length > 0
      - keycloak_hostname | length > 0
      - cloudflare_zone | length > 0
    fail_msg: >-
      Missing Keycloak config. Expected keycloak_db_password
      (>= 20 chars), admin_password (>= 16 chars), ADMIN_EMAIL,
      AUTH_SUBDOMAIN, and CLOUDFLARE_ZONE in .env. Both secrets are minted
      on the box by the converge loader.

# apply: propagate the tag to every task INSIDE each include. Without it the
# include fires (it carries the tag) and its inner tasks are filtered out under
# any `converge --tags X`, so a tag-scoped run does NOTHING while reporting
# ok/changed=0 as though the role were already converged.
#
# `converge --tags keycloak_realm` was exactly that: the realm-render tasks
# never ran, keycloak-config-cli imported the realm files left by an earlier
# converge, and a Settings change the store had already recorded could not
# reach the realm. Read on bench run 2026-08-30T19-22-52-155e as
# "expected mfa_enforced=true after enforce, got False" beside a realm
# converge of ok=28 changed=0 -- the setting was in the store, and nothing
# rendered it.
#
# playbooks/site.yml carries the same apply: on the on-box config loader, for
# the same reason (fi_s3 caught a poisoned password surviving `--tags
# postgres` there).
- name: "Keycloak: provision DB + user inside catena-postgres"
  ansible.builtin.include_tasks:
    file: provision_db.yml
    apply:
      tags: [keycloak_db]
  tags: [keycloak_db]


# The compose-deploy + realm-bootstrap + post-deploy probe all hit the
# Portainer stack API. portainer_api_key is minted by reconcile/roles/portainer
# earlier in the SAME site converge (it runs before keycloak in site.yml and
# set_facts the freshly-minted key into play scope), so this block converges
# in a single pass -- no two-pass pass-1/pass-2 dance. Mirror the gate
# reconcile/roles/infrastructure uses; the key is present here on a fresh install
# because portainer already ran.
- name: "Keycloak: Portainer-API-gated steps (compose, validate, realm)"
  when:
    - portainer_api_key is defined
    - portainer_api_key | length > 10
  block:
    - name: "Keycloak: deploy compose via the Portainer stack API"
      ansible.builtin.include_tasks:
        file: deploy.yml
        apply:
          tags: [keycloak_compose]
      tags: [keycloak_compose]

    - name: "Keycloak: post-deploy /health/ready probe"
      ansible.builtin.include_tasks:
        file: validate.yml
        apply:
          tags: [keycloak_health]
      tags: [keycloak_health]

    - name: "Keycloak: realm bootstrap (keycloak-config-cli)"
      ansible.builtin.include_tasks:
        file: realm_bootstrap.yml
        apply:
          tags: [keycloak_realm]
      tags: [keycloak_realm]

    # One-time membership migration for the four-tier group rename.
    # Runs AFTER realm_bootstrap so the new admin/staff groups exist
    # before members are moved into them. Marker-gated -- no-op on
    # greenfield installs and on every converge after the first.
    - name: "Keycloak: migrate legacy groups to four-tier model"
      ansible.builtin.include_tasks:
        file: migrate_groups.yml
        apply:
          tags: [keycloak_realm, keycloak_group_migration]
      tags: [keycloak_realm, keycloak_group_migration]

    # R22: dump the live realm + clients to backup-staging (so restic
    # picks them up) AND install the nightly drift-export timer.
    # Idempotent. Captures any operator UI edits that happened since
    # the previous converge, then keeps running between converges.
    - name: "Keycloak: realm export"
      ansible.builtin.include_tasks:
        file: realm_export.yml
        apply:
          tags: [keycloak_realm_export]
      tags: [keycloak_realm_export]

- name: "Keycloak: skipped Portainer-API steps (no API key yet)"
  ansible.builtin.debug:
    msg: >-
      Skipping Keycloak compose + realm bootstrap -- portainer_api_key
      is not yet present. It is normally minted by reconcile/roles/portainer earlier in
      this same converge; if you see this, portainer did not run or failed to
      mint the key. Check the portainer role, then re-run.
  when: portainer_api_key is not defined or (portainer_api_key | length) < 10
