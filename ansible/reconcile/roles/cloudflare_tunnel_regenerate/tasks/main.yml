---
# Regenerate the Cloudflare tunnel for this host. The panel's Settings >
# Domain > Apply runs it (playbooks/rotate-tunnel.yml) to put a newly saved
# domain or token into effect, which also covers rotating a tunnel credential
# suspected of compromise and recovering a tunnel someone deleted out of band
# in the Cloudflare dashboard.
#
# WHAT IS ROTATED is the tunnel's own credential -- the TUNNEL_TOKEN carried in
# the cloudflared swarm service spec. The Cloudflare API token is what
# authenticates the calls that rotate it, and it is a different secret with a
# different lifecycle.
#
# THE API TOKEN COMES FROM THE STORE, and it has to. Both halves authenticate
# with it: the delete here, and the re-create in
# reconcile/roles/cloudflare_tunnel, which dispatches catena-cloudflared-sync
# -- and the engine reads /etc/catena/config.json itself. A token supplied per
# run could only ever reach the delete, so a run whose supplied token differed
# from the stored one would delete the tunnel with one credential and fail to
# mint its replacement with the other. One source, one answer.
#
# So rotating the API token is a separate act that lands in the store first
# (catena-admin > Settings). This role refuses before deleting anything when
# the store holds none.
#
# Sequence:
#   1. Read the store: API token, zone, tunnel-name prefix (_read_store.yml).
#   2. Resolve the zone and the account behind it via the CF API, and list the
#      tunnels named for this host (_list_tunnels.yml).
#   3. Delete the existing tunnel for this host (if any).
#   4. Hand off to reconcile/roles/cloudflare_tunnel, whose engine mints a new
#      tunnel, re-points the wildcard CNAME and rolls cloudflared onto the new
#      TUNNEL_TOKEN.
#
# The rotation reaches live state on its own; the Apply runs a converge after
# it so every route follows the new domain.

# There is nothing to rotate until the client has provisioned a tunnel by
# saving a Cloudflare token in catena-admin > Settings (the token lands in the
# on-box store). Refuse up front rather than deleting-then-failing-to-recreate.
- name: "CF regen: read the store"
  ansible.builtin.include_tasks: _read_store.yml

# The handoff to cloudflare_tunnel reads cloudflare_zone, and the rotate play
# loads no store to publish it.
- name: "CF regen: publish the zone the handoff reads"
  ansible.builtin.set_fact:
    cloudflare_zone: "{{ _cf_regen_zone }}"
  no_log: true

# No no_log here. assert reports the unrendered expression, never the value, so
# the fail_msg below is the whole point of the task and censoring it would cost
# the one sentence that says what to do about the refusal.
- name: "CF regen: refuse when the store holds no Cloudflare token"
  ansible.builtin.assert:
    that:
      - (_cf_regen_api_token | length) > 0
    fail_msg: >-
      No Cloudflare token in the on-box store -- enter it in catena-admin >
      Settings before regenerating the tunnel. The tunnel is provisioned on-box
      from the stored token: there is nothing to rotate until one exists, and
      nothing to authenticate the delete with.

- name: "CF regen: the store names a zone"
  ansible.builtin.assert:
    that:
      - cloudflare_zone | length > 0
    fail_msg: >-
      No Cloudflare zone in the on-box store. Enter the domain with the
      Cloudflare token in catena-admin > Settings first.
  run_once: true
  delegate_to: localhost
  become: false

- name: "CF regen: list the tunnels named for this host"
  ansible.builtin.include_tasks: _list_tunnels.yml

# cloudflared keeps running on this host and reconnects at any moment, and
# Cloudflare refuses to delete a tunnel with live connections.
# cascade=true has Cloudflare drop the tunnel's connections and the tunnel in
# the one call, the way `cloudflared tunnel delete --force` does. A refusal is
# retried, then the task below says which tunnel and which status; 404 is a
# tunnel already gone.
- name: "CF regen: delete existing tunnel(s) with their connections"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/accounts/{{ _cf_regen_account_id }}/cfd_tunnel/{{ item.id }}?cascade=true"
    method: DELETE
    headers:
      Authorization: "Bearer {{ _cf_regen_api_token }}"
    status_code: [200, 404]
  register: _cf_regen_delete
  until: _cf_regen_delete.status in [200, 404]
  retries: 6
  delay: 5
  failed_when: false
  loop: "{{ _cf_regen_list.json.result }}"
  loop_control:
    label: "{{ item.id }}"
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true

# Prints the tunnel id and the HTTP status alone: the registered
# results also hold the call's headers.
- name: "CF regen: stop when Cloudflare kept an old tunnel"
  ansible.builtin.fail:
    msg: >-
      Cloudflare refused to delete the old tunnel, so no new one was made and
      the host still serves the old one:
      {% for r in _cf_regen_refused %}DELETE cfd_tunnel/{{ r.item.id }}?cascade=true
      answered HTTP {{ r.status }} on every try{{ '; ' if not loop.last else '.' }}{% endfor %}
      Apply the domain again in catena-admin > Settings.
  vars:
    _cf_regen_refused: "{{ _cf_regen_delete.results | rejectattr('status', 'in', [200, 404]) | list }}"
  when: _cf_regen_refused | length > 0
  run_once: true
  delegate_to: localhost
  become: false

# Hand off to the find-or-create. Nothing is passed: that role dispatches
# catena-cloudflared-sync, and the engine reads the token out of the store
# itself, so it authenticates as the same credential the delete above used.
- name: "CF regen: re-create tunnel + roll cloudflared via the tunnel role"
  ansible.builtin.include_role:
    name: cloudflare_tunnel
