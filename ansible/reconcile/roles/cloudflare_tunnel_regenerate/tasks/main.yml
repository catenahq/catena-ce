---
# Regenerate the Cloudflare tunnel for this host. Two scenarios: rotation of
# the tunnel credential when compromise is suspected, and recovery after the
# tunnel was deleted out of band in the Cloudflare dashboard.
#
# WHAT IS ROTATED is the tunnel's own credential -- the TUNNEL_TOKEN carried in
# the cloudflared swarm service spec. The Cloudflare API token is what
# authenticates the calls that rotate it, and it is a different secret with a
# different lifecycle.
#
# THE API TOKEN COMES FROM THE STORE, and it has to. Both halves authenticate
# with it: the delete here, and the re-create in
# reconcile/roles/cloudflare_tunnel, which dispatches catena-cloudflared-sync
# -- and the engine reads /etc/catena/config.json itself. A token supplied per
# run could only ever reach the delete, so a run whose supplied token differed
# from the stored one would delete the tunnel with one credential and fail to
# mint its replacement with the other. One source, one answer.
#
# So rotating the API token is a separate act that lands in the store first
# (catena-admin > Settings). This role refuses before deleting anything when
# the store holds none.
#
# Sequence:
#   1. Read the store: API token, zone, tunnel-name prefix.
#   2. Resolve the zone and the account behind it via the CF API.
#   3. Delete the existing tunnel for this host (if any).
#   4. Hand off to reconcile/roles/cloudflare_tunnel, whose engine mints a new
#      tunnel, re-points the wildcard CNAME and rolls cloudflared onto the new
#      TUNNEL_TOKEN.
#
# Single-button for the client: the rotation reaches live state without a
# converge.

# There is nothing to rotate until the client has provisioned a tunnel by
# saving a Cloudflare token in catena-admin > Settings (the token lands in the
# on-box store). Refuse up front rather than deleting-then-failing-to-recreate.
# Read the store on the host (0600 root); this play has no load_onbox_config
# pre_task, so slurp + parse directly.
- name: "CF regen: stat the on-box config store"
  ansible.builtin.stat:
    path: "{{ catena_onbox_config_path | default('/etc/catena/config.json') }}"
  register: _cf_regen_store_stat

- name: "CF regen: read the on-box config store"
  ansible.builtin.slurp:
    src: "{{ catena_onbox_config_path | default('/etc/catena/config.json') }}"
  register: _cf_regen_store
  when: _cf_regen_store_stat.stat.exists | default(false)
  no_log: true

# A fact rather than a task-scoped var: every CF API call below authenticates
# with it, and the re-create at the end reads the same key out of the same file
# from inside the engine.
- name: "CF regen: take the API token from the store"
  ansible.builtin.set_fact:
    _cf_regen_api_token: >-
      {{ ((_cf_regen_store.content | default('') | b64decode | from_json).secrets
          | default({})).get('cloudflare_api_token', '')
         if (_cf_regen_store_stat.stat.exists | default(false))
         else '' }}
  no_log: true

# No no_log here. assert reports the unrendered expression, never the value, so
# the fail_msg below is the whole point of the task and censoring it would cost
# the one sentence that says what to do about the refusal.
- name: "CF regen: refuse when the store holds no Cloudflare token"
  ansible.builtin.assert:
    that:
      - (_cf_regen_api_token | length) > 0
    fail_msg: >-
      No Cloudflare token in the on-box store -- enter it in catena-admin >
      Settings before regenerating the tunnel. The tunnel is provisioned on-box
      from the stored token: there is nothing to rotate until one exists, and
      nothing to authenticate the delete with.

# The zone comes from the store this role already slurped, not from the
# inventory. This play has no load_onbox_config pre_task by design -- it is
# dispatched from the panel with the token on the command line -- so it reads
# the same source the loader would have published, one file, one answer.
- name: "CF regen: take the zone from the store"
  ansible.builtin.set_fact:
    cloudflare_zone: >-
      {{ ((_cf_regen_store.content | default('') | b64decode | from_json).config
          | default({})).get('CLOUDFLARE_ZONE', '')
         if (_cf_regen_store_stat.stat.exists | default(false))
         else '' }}

# The tunnel this host owns is named the way catena-cloudflared-sync names it:
# the box's own hostname, with the store's prefix in front. Read the hostname
# from the host rather than from inventory_hostname -- the engine calls
# os.Hostname(), and a play that guessed differently would rotate a tunnel that
# does not exist and leave the real one alone.
- name: "CF regen: read this host's own name"
  ansible.builtin.command:
    cmd: hostname
  register: _cf_regen_hostname
  changed_when: false

- name: "CF regen: name the tunnel the way the engine does"
  ansible.builtin.set_fact:
    cloudflared_tunnel_name: >-
      {{ (((_cf_regen_store.content | default('') | b64decode | from_json).config
           | default({})).get('CLOUDFLARED_TUNNEL_NAME_PREFIX', '')
          if (_cf_regen_store_stat.stat.exists | default(false))
          else '')
         ~ (_cf_regen_hostname.stdout | trim) }}

- name: "CF regen: the store names a zone"
  ansible.builtin.assert:
    that:
      - cloudflare_zone | length > 0
    fail_msg: >-
      No Cloudflare zone in the on-box store. The zone is seeded there on the
      first converge; a host without one has never finished an install.
  run_once: true
  delegate_to: localhost
  become: false

# Resolved fresh every run rather than stored, on the Zone:DNS:Edit scope the
# token already needs (mirrors reconcile/roles/coturn/tasks/dns.yml's zone_id
# lookup). Which account a zone belongs to is the API's answer to give, and a
# copy of it in the store would be one more thing to keep true.
- name: "CF regen: resolve Cloudflare account id from the zone"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones?name={{ cloudflare_zone }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _cf_regen_api_token }}"
    status_code: 200
    return_content: true
  register: _cf_regen_zone_lookup
  run_once: true
  delegate_to: localhost
  become: false

- name: "CF regen: assert the zone is visible to the supplied token"
  ansible.builtin.assert:
    that:
      - _cf_regen_zone_lookup.json.result | length == 1
    fail_msg: >-
      Zone '{{ cloudflare_zone }}' not found (or token lacks access). The
      stored Cloudflare token needs Zone:DNS:Edit scope on this zone. Update it
      in catena-admin > Settings, then run this again.
  run_once: true
  delegate_to: localhost
  become: false

- name: "CF regen: bind the resolved Cloudflare account id"
  ansible.builtin.set_fact:
    _cf_regen_account_id: "{{ _cf_regen_zone_lookup.json.result[0].account.id }}"

- name: "CF regen: list existing tunnels matching this host"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/accounts/{{ _cf_regen_account_id }}/cfd_tunnel?name={{ cloudflared_tunnel_name }}&is_deleted=false"
    method: GET
    headers:
      Authorization: "Bearer {{ _cf_regen_api_token }}"
    status_code: 200
    return_content: true
  register: _cf_regen_list
  run_once: true
  delegate_to: localhost
  become: false

- name: "CF regen: clean up stale connectors (refuses delete on tunnels with active connections)"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/accounts/{{ _cf_regen_account_id }}/cfd_tunnel/{{ item.id }}/connections"
    method: DELETE
    headers:
      Authorization: "Bearer {{ _cf_regen_api_token }}"
    status_code: [200, 204, 404]
  loop: "{{ _cf_regen_list.json.result }}"
  loop_control:
    label: "{{ item.id }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: "CF regen: delete existing tunnel(s)"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/accounts/{{ _cf_regen_account_id }}/cfd_tunnel/{{ item.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ _cf_regen_api_token }}"
    status_code: [200, 404]
  loop: "{{ _cf_regen_list.json.result }}"
  loop_control:
    label: "{{ item.id }}"
  run_once: true
  delegate_to: localhost
  become: false

# Hand off to the find-or-create. Nothing is passed: that role dispatches
# catena-cloudflared-sync, and the engine reads the token out of the store
# itself, so it authenticates as the same credential the delete above used.
- name: "CF regen: re-create tunnel + roll cloudflared via the tunnel role"
  ansible.builtin.include_role:
    name: cloudflare_tunnel
