---
# Configure the swarm bootstrap/roles/docker created: the task-history bound,
# the data-node label, the private overlays, and the self-heal for
# containers the overlay race strands. Every step is read-then-set or
# create-if-absent, so a converge against a host already in this state changes
# nothing.

# Every task below needs a manager. Asserted rather than assumed, so a host
# whose swarm is gone fails here, naming the cause, rather than at the first
# `docker node` call with a message about something else.
- name: "swarm: read local node state"
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
  register: _swarm_state
  changed_when: false

- name: "swarm: this node is an active swarm member"
  ansible.builtin.assert:
    that:
      - (_swarm_state.stdout | trim) == 'active'
    fail_msg: >-
      docker reports swarm state {{ _swarm_state.stdout | trim | default('unknown', true) }}.
      bootstrap/roles/docker creates the single-node swarm every catena service
      runs on; re-run it from an operator controller.

# ─── how much task history swarm keeps ───────────────────────────────────
# Lowering the limit is retroactive: dockerd drops the excess task records and
# reaps their containers, so this reclaims the accumulated ones rather than only
# bounding future growth.
- name: "swarm: read the task-history retention limit"
  ansible.builtin.command: >-
    docker info --format
    '{{ "{{" }}.Swarm.Cluster.Spec.Orchestration.TaskHistoryRetentionLimit{{ "}}" }}'
  register: _swarm_task_history
  changed_when: false
  failed_when: false

- name: "swarm: bound task history to {{ swarm_task_history_limit }}"
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - update
      - --task-history-limit
      - "{{ swarm_task_history_limit }}"
  # Gated on the read rather than run-and-report: `docker swarm update` exits 0
  # and prints "Swarm updated." whether or not anything changed, so an ungated
  # task reports changed on every converge.
  when: >-
    (_swarm_task_history.stdout | default('') | trim)
    != (swarm_task_history_limit | string)
  register: _swarm_task_history_set
  changed_when: _swarm_task_history_set.rc == 0

# ─── node label: where state lives ───────────────────────────────────────
# `docker node update --label-add` with an unchanged value is a no-op, and the
# read gates it, so this reports changed only when it set something.
- name: "swarm: read the local node id"
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.NodeID{{ "}}" }}'
  register: _swarm_node_id
  changed_when: false

- name: "swarm: read the local node labels"
  ansible.builtin.command: >-
    docker node inspect {{ _swarm_node_id.stdout | trim }}
    --format '{{ "{{" }}index .Spec.Labels "catena.role"{{ "}}" }}'
  register: _swarm_node_role
  changed_when: false
  failed_when: false

- name: "swarm: label the local node as the data node"
  ansible.builtin.command:
    argv:
      - docker
      - node
      - update
      - --label-add
      - "catena.role={{ swarm_node_role_label }}"
      - "{{ _swarm_node_id.stdout | trim }}"
  when: (_swarm_node_role.stdout | default('') | trim) != swarm_node_role_label
  register: _swarm_node_label
  changed_when: _swarm_node_label.rc == 0

# ─── the overlays a service shares with its callers only ─────────────────
# Healthchecks takes the signed-in user from a header whoever reaches it can
# set, and Beszel's hub offers a sign-in that creates an account for any realm
# user, so each is on its own network rather than catena-network
# (playbooks/group_vars/all/main.yml healthchecks_network, beszel_network).
# Created here, ahead of reconcile/roles/oauth2_proxy and
# reconcile/roles/infrastructure, because a stack naming an external network
# that does not exist does not deploy. Not attachable: only a swarm service
# declared to join one can.
- name: "swarm: ensure the private overlays exist"
  ansible.builtin.command:
    argv: [docker, network, create, --driver, overlay, "{{ item }}"]
  loop:
    - "{{ healthchecks_network }}"
    - "{{ beszel_network }}"
  register: _swarm_private_net_create
  changed_when: _swarm_private_net_create.rc == 0
  # rc!=0 with "already exists" in stderr is the idempotent no-op path.
  failed_when:
    - _swarm_private_net_create.rc != 0
    - "'already exists' not in (_swarm_private_net_create.stderr | default(''))"

# ─── overlay-race self-heal (catena-network-nudge) ───────────────────────
# dockerd restores restart-policy containers during "Loading containers",
# which runs BEFORE the swarm node re-materializes catena-network -- and the
# boot-time restore gets exactly ONE attempt per container, so whatever loses
# that race stays Exited with RestartCount=0 until something starts it.
#
# Swarm services re-dispatch themselves by name. A container a client started
# by hand has nothing to heal it, and that is what this nudge is for. It fires
# from a docker.service drop-in on every daemon start.
- name: "swarm: drop network-nudge script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-network-nudge.sh"
    dest: /usr/local/bin/catena-network-nudge
    owner: root
    group: root
    mode: "0755"

- name: "swarm: render network-nudge systemd unit"
  ansible.builtin.template:
    src: catena-network-nudge.service.j2
    dest: /etc/systemd/system/catena-network-nudge.service
    owner: root
    group: root
    mode: "0644"
  register: _swarm_nudge_unit

- name: "swarm: ensure docker.service drop-in dir exists"
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "swarm: render docker.service drop-in that fires the nudge"
  ansible.builtin.template:
    src: docker-service-nudge-dropin.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-catena-network-nudge.conf
    owner: root
    group: root
    mode: "0644"
  register: _swarm_nudge_dropin

- name: "swarm: daemon-reload if the nudge unit or drop-in changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _swarm_nudge_unit.changed or _swarm_nudge_dropin.changed
