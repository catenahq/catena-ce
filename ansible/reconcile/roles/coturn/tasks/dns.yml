---
# Render the gray-cloud (proxied: false) A record `turn.<zone>` ->
# the host's public IP. Required because cloudflared cannot carry UDP, so
# coturn lives directly on the public IP -- the TURN hostname must resolve
# there, NOT to Cloudflare's edge.
#
# Same upsert idiom as reconcile/roles/infrastructure/tasks/mailserver_dns.yml
# (look up + create-if-absent + update-if-drift), for an A record with
# proxied=false.
#
# This record stays when a client changes their domain. The tunnel engine
# retires the old domain's wildcard, which is what stops every name under it
# resolving; turn.<old-zone> keeps pointing at this host's public IP until
# someone deletes it.

# cloudflare_zone_id is resolved by whichever Ansible-side Cloudflare caller
# needs it first in the run (this file, or mailserver_dns.yml, which runs
# earlier in a full converge) and reused after. A `--tags coturn` run resolves
# it here.
- name: "coturn DNS: resolve cloudflare_zone_id (when not resolved yet)"
  when: cloudflare_zone_id is not defined
  delegate_to: localhost
  become: false
  block:
    - name: "coturn DNS: look up zone_id for {{ cloudflare_zone }}"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones?name={{ cloudflare_zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _coturn_dns_zones
      retries: 5
      delay: 6
      until: _coturn_dns_zones.status == 200

    - name: "coturn DNS: assert the zone is visible to this token"
      ansible.builtin.assert:
        that:
          - _coturn_dns_zones.json.result | length == 1
        fail_msg: >-
          Zone '{{ cloudflare_zone }}' not found (or token lacks access).
          The API token needs Zone:DNS:Edit scope on this zone.

    - name: "coturn DNS: capture zone_id"
      ansible.builtin.set_fact:
        cloudflare_zone_id: "{{ _coturn_dns_zones.json.result[0].id }}"

- name: "coturn DNS: look up existing A record for {{ coturn_hostname }}"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records?type=A&name={{ coturn_hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
    return_content: true
  register: _coturn_dns_existing
  delegate_to: localhost
  become: false
  retries: 5
  delay: 6
  until: _coturn_dns_existing.status == 200

- name: "coturn DNS: create A record (gray-cloud) if absent"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    body_format: json
    body:
      type: A
      name: "{{ coturn_hostname }}"
      content: "{{ public_ip }}"
      proxied: false
      ttl: 1 # 1 = automatic
      comment: "Managed by catena reconcile/roles/coturn -- MUST be gray-cloud (UDP)"
    status_code: 200
  when: _coturn_dns_existing.json.result | length == 0
  delegate_to: localhost
  become: false

# A Cloudflare PUT REPLACES the record, so the comment has to be re-sent: a
# record that ever drifts would otherwise come back with the ownership marker
# stripped, and cleanup keyed on "Managed by catena" stops recognising it as
# ours -- leaving it behind on a domain this host has moved off.
- name: "coturn DNS: update A record if content / proxy state drifted"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records/{{ _coturn_dns_existing.json.result[0].id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    body_format: json
    body:
      type: A
      name: "{{ coturn_hostname }}"
      content: "{{ public_ip }}"
      proxied: false
      ttl: 1
      comment: "Managed by catena reconcile/roles/coturn -- MUST be gray-cloud (UDP)"
    status_code: 200
  when:
    - _coturn_dns_existing.json.result | length > 0
    - >-
      _coturn_dns_existing.json.result[0].content != public_ip
      or _coturn_dns_existing.json.result[0].proxied | default(false)
  delegate_to: localhost
  become: false
