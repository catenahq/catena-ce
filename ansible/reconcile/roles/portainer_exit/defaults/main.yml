---
# reconcile/roles/portainer_exit -- what a Portainer left on this host is made of.
# The names are the ones it was created with.

portainer_exit_service: catena-portainer
portainer_exit_data_volume: catena-portainer-data
# The swarm secret holding the admin login Portainer was started with.
portainer_exit_admin_login: catena_portainer_admin_password
portainer_exit_network: catena-portainer-net

# The swarm service of its sign-in gate is pruned with the oauth2-proxy stack;
# what is left of that gate is a Traefik route file and the swarm secrets named
# after its slug.
portainer_exit_gate_slug: portainer

# Its public-port fragment, which confines the UI port to this host while it runs.
portainer_exit_ports_fragment: "{{ public_ports_fragment_dir }}/portainer.json"
