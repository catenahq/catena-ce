---
# Remove a Portainer left on the host once none of its stacks is left on it.
#
# Portainer may still hold client stacks. `catena-apps adopt` (catena-admin
# payload/engines/apps) gives each of them a folder under /srv/catena/compose
# and redeploys it from there. Portainer, its data volume and everything that
# served it go only when that pass ran, exited 0 and refused no stack (the
# portainer_exit_verdict filter, playbooks/filter_plugins/portainer_exit.py).
# Otherwise Portainer keeps running and the converge says which stacks still
# need attention; the next converge tries again. A host with no Portainer has
# nothing to adopt and nothing to remove.
#
# The pass reads the API key of Portainer from the on-box store, so no secret
# rides the command line or the environment; its output is hidden because the
# redeploy of a stack with credentials in its Env is part of it. -held: this
# converge holds /run/catena.lock for the whole play, so the verb must not wait
# for it.

- name: "portainer exit: is there a Portainer service"
  ansible.builtin.command:
    argv: [docker, service, inspect, --format, "{{ '{{' }}.ID{{ '}}' }}", "{{ portainer_exit_service }}"]
  register: _pe_service
  changed_when: false
  failed_when: false

- name: "portainer exit: is catena-apps installed"
  ansible.builtin.stat:
    path: /usr/local/bin/catena-apps
  register: _pe_apps_bin
  when: _pe_service.rc == 0

- name: "portainer exit: adopt the client stacks as application folders"
  ansible.builtin.command:
    argv: [/usr/local/bin/catena-apps, adopt, -held]
  register: _pe_adopt
  changed_when: _pe_adopt.rc == 0 and ((_pe_adopt.stdout | default('{}', true) | from_json).adopted | default([]) | length) > 0
  failed_when: false
  no_log: true
  when:
    - _pe_service.rc == 0
    - _pe_apps_bin.stat.exists

- name: "portainer exit: decide whether Portainer may go"
  ansible.builtin.set_fact:
    _pe_verdict: "{{ _pe_adopt | default({'skipped': true}) | portainer_exit_verdict }}"
  when: _pe_service.rc == 0

- name: "portainer exit: Portainer stays, and why"
  ansible.builtin.debug:
    msg: "Portainer stays on this host: {{ _pe_verdict.why }}"
  when:
    - _pe_service.rc == 0
    - not _pe_verdict.remove

# Portainer's own gate is gone with the oauth2_proxy entry whether or not
# Portainer stays, so its route would answer for nothing.
- name: "portainer exit: remove the route of Portainer's sign-in gate"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/{{ portainer_exit_gate_slug }}-oauth2-proxy.yml"
    state: absent

- name: "portainer exit: remove the swarm secrets of Portainer's sign-in gate"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/swarm_secrets_prune.yml"
  vars:
    swarm_secret_bases: ["oauth2-proxy-{{ portainer_exit_gate_slug }}"]

# No service, or a verdict that lets it go: what is left of it is removed, each
# piece when it is there, so a converge that stopped half way finishes here.
- name: "portainer exit: remove Portainer and what it was made of"
  when: _pe_service.rc != 0 or _pe_verdict.remove
  block:
    - name: "portainer exit: remove the service"
      ansible.builtin.command:
        argv: [docker, service, rm, "{{ portainer_exit_service }}"]
      when: _pe_service.rc == 0
      changed_when: true

    - name: "portainer exit: is there a data volume"
      ansible.builtin.command:
        argv: [docker, volume, inspect, "{{ portainer_exit_data_volume }}"]
      register: _pe_volume
      changed_when: false
      failed_when: false

    # The volume is held until the service's task container is gone.
    - name: "portainer exit: remove the data volume"
      ansible.builtin.command:
        argv: [docker, volume, rm, "{{ portainer_exit_data_volume }}"]
      register: _pe_volume_rm
      retries: 12
      delay: 5
      until: _pe_volume_rm.rc == 0
      changed_when: true
      when: _pe_volume.rc == 0

    - name: "portainer exit: is there an admin-password secret"
      ansible.builtin.command:
        argv: [docker, secret, inspect, "{{ portainer_exit_admin_login }}"]
      register: _pe_secret
      changed_when: false
      failed_when: false

    - name: "portainer exit: remove the admin-password secret"
      ansible.builtin.command:
        argv: [docker, secret, rm, "{{ portainer_exit_admin_login }}"]
      changed_when: true
      when: _pe_secret.rc == 0

    - name: "portainer exit: is there a private network"
      ansible.builtin.command:
        argv: [docker, network, inspect, "{{ portainer_exit_network }}"]
      register: _pe_network
      changed_when: false
      failed_when: false

    # Held while its sign-in gate runs: a host with no domain keeps that gate,
    # and the next converge removes the network.
    - name: "portainer exit: remove the private network"
      ansible.builtin.command:
        argv: [docker, network, rm, "{{ portainer_exit_network }}"]
      register: _pe_network_rm
      retries: 6
      delay: 5
      until: _pe_network_rm.rc == 0
      changed_when: true
      failed_when: false
      when: _pe_network.rc == 0

    - name: "portainer exit: remove its public-port fragment"
      ansible.builtin.file:
        path: "{{ portainer_exit_ports_fragment }}"
        state: absent
      register: _pe_ports_fragment

    - name: "portainer exit: reconcile public ports now (fragment removed)"
      ansible.builtin.systemd_service:
        name: catena-public-ports.service
        state: started
      changed_when: false
      when:
        - _pe_ports_fragment.changed
        - catena_public_ports_installed | default(true) | bool
