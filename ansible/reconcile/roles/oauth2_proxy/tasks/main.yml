---
# Orchestrator for reconcile/roles/oauth2_proxy. Order:
# 0. Defer entirely when the host has no domain yet.
# 1. Preflight: secrets, including each instance's cookie secret and the
#    password a gate sends its upstream.
# 2. Render the Keycloak `oauth2-proxy` client into the keycloak realm
#    config dir + re-run keycloak-config-cli (merge mode -- safe).
# 3. Render the shared Traefik middleware definitions.
# 4. Render the per-app Traefik route files (one per gated app).
# 5. Deploy the per-app instances as one swarm stack, each reading its
#    credentials from a swarm secret.
# 6. Validate.
#
# This role MUST run AFTER reconcile/roles/keycloak (the realm + admin user must
# exist before keycloak-config-cli can add the client) and BEFORE
# reconcile/roles/infrastructure deploys gated apps (so the chain middleware is
# in place when those apps' routes get registered with Traefik).

# EVERY output of this role is named after the domain: the Host() each route
# matches, the issuer and login URL it redirects to, the redirect domain it
# allows and the callback list it registers with Keycloak. With no domain those render
# as bare trailing dots -- gatus., auth. -- which resolve nowhere, so the role
# would publish a gate in front of nothing and then probe it.
#
# Deferred rather than allowed to fail: the preflight below asserts the zone, so
# an ungated run turns "this host has no domain yet" into a converge that cannot
# finish -- which is the order the install is supposed to support, since the
# domain arrives in Settings after the install that brings Settings up.
- name: "oauth2-proxy: skip the auth gates when the host has no domain yet"
  ansible.builtin.debug:
    msg: >-
      No domain is configured, so the single sign-on gates in front of the
      shared services are NOT deployed. Those services stay reachable on the
      private network; nothing is published publicly for them to guard. Enter
      a domain in the dashboard's Settings; the next converge deploys them.
  when: catena_public_surface_deferred | default(false) | bool

- name: "oauth2-proxy: preflight secrets + env"
  ansible.builtin.assert:
    that:
      - oauth2_proxy_client_secret is defined
      - oauth2_proxy_client_secret | length > 20
      - oauth2_proxy_cookie_secret is defined
      # oauth2-proxy v7 decodes --cookie-secret with `base64.RawURLEncoding`
      # (URL-safe alphabet `-_`, no padding) and rejects any decoded
      # length other than 16/24/32 bytes (AES-128/192/256). Standard
      # base64 with `+/` characters fails RawURLEncoding so oauth2-proxy
      # falls back to the literal 44-char string -> "is 44 bytes" error
      # -> restart loop. Validate by stripping any `=` padding and
      # asserting the resulting length matches one of the three valid
      # b64-of-{16,24,32}-bytes lengths. Works for both URL-safe and
      # standard b64; the alphabet itself is enforced at oauth2-proxy
      # boot, not here.
      - (oauth2_proxy_cookie_secret | regex_replace('=+$', '') | length) in [22, 32, 43]
      - cloudflare_zone | length > 0
      - keycloak_realm | length > 0
      - keycloak_server_alias | length > 0
    fail_msg: >-
      Missing or invalid oauth2-proxy config. Expected
      oauth2_proxy_client_secret (>= 20 chars),
      oauth2_proxy_cookie_secret (URL-safe base64 of 16/24/32
      raw bytes -- 32 raw bytes is the canonical choice -> 43 chars
      no-pad / 44 chars with `=`; a 64-char b64 of 48 bytes WILL FAIL
      oauth2-proxy preflight, AND standard base64 with `+/` characters
      will silently decode to a 44-byte literal at oauth2-proxy boot),
      CLOUDFLARE_ZONE, and a healthy reconcile/roles/keycloak pass earlier in
      the play. The converge mints both secrets correctly on the box; to
      regenerate the cookie secret by hand, delete
      oauth2_proxy_cookie_secret from /etc/catena/config.json and
      re-converge (minting is fill-only, so it will not touch a value that
      is still there).
  when: not (catena_public_surface_deferred | default(false) | bool)

# A gate that sends its upstream no password leaves every request it forwards
# served as nobody there: the panel accepts an identity only beside its gate
# secret.
- name: "oauth2-proxy: preflight the password each gate sends its upstream"
  ansible.builtin.assert:
    that:
      - lookup('vars', _app.basic_auth_password_var, default='') | length > 20
    fail_msg: >-
      {{ _app.basic_auth_password_var }} is missing from the on-box store.
      The converge mints it there, so a gap here means the store at
      /etc/catena/config.json was not loaded.
  loop: "{{ oauth2_proxy_apps | selectattr('basic_auth_password_var', 'defined') | list }}"
  loop_control:
    loop_var: _app
    label: "{{ _app.slug }}"
  when: not (catena_public_surface_deferred | default(false) | bool)

# Each instance signs its session cookie with a secret of its own, under the
# same length rule as oauth2_proxy_cookie_secret above.
- name: "oauth2-proxy: preflight each instance's cookie secret"
  ansible.builtin.assert:
    that:
      - (lookup('vars', _app.cookie_secret_var, default='') | regex_replace('=+$', '') | length) in [22, 32, 43]
    fail_msg: >-
      {{ _app.cookie_secret_var }} is missing from the on-box store or is not
      URL-safe base64 of 16, 24 or 32 bytes. The converge mints it there; to
      regenerate it, delete it from /etc/catena/config.json and re-converge.
  loop: "{{ oauth2_proxy_apps }}"
  loop_control:
    loop_var: _app
    label: "{{ _app.slug }}"
  when: not (catena_public_surface_deferred | default(false) | bool)

# Realm-config render + middleware render + compose deploy + validate
# all assume Keycloak is up (so keycloak-config-cli can reach it). Gated on
# the Portainer API key like reconcile/roles/keycloak: portainer_api_key is
# minted by reconcile/roles/portainer earlier in the SAME converge, and
# reconcile/roles/keycloak has already brought Keycloak up by the time this
# role runs, so this body converges in a single pass. The deploy itself is a
# swarm stack (reconcile/roles/infrastructure/tasks/swarm_stack.yml).
- name: "oauth2-proxy: Portainer-API-gated body (realm + middleware + compose + validate)"
  when:
    - not (catena_public_surface_deferred | default(false) | bool)
    - portainer_api_key is defined
    - portainer_api_key | length > 10
  block:
    - name: "oauth2-proxy: render Keycloak client into realm config dir"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../reconcile/roles/keycloak/templates/realm-oauth2-proxy.yaml.j2"
        dest: "{{ keycloak_realm_host_dir }}/oauth2-proxy.yaml"
        owner: root
        group: root
        mode: "0644"
      register: _oauth2_realm_render

    - name: "oauth2-proxy: re-import realm config with the new client"
      ansible.builtin.include_tasks:
        file: ../../keycloak/tasks/realm_bootstrap.yml
        apply:
          tags: [oauth2_proxy_realm]
      when: _oauth2_realm_render is changed
      tags: [oauth2_proxy_realm]

    - name: "oauth2-proxy: render shared Traefik middlewares"
      ansible.builtin.template:
        src: oauth2-proxy-middlewares.yml.j2
        dest: "{{ traefik_dynamic_dir }}/oauth2-proxy-middlewares.yml"
        owner: root
        group: root
        mode: "0644"

    - name: "oauth2-proxy: render per-app Traefik route files"
      ansible.builtin.template:
        src: app-oauth2-proxy.yml.j2
        dest: "{{ traefik_dynamic_dir }}/{{ _app.slug }}-oauth2-proxy.yml"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ oauth2_proxy_apps }}"
      loop_control:
        loop_var: _app
        label: "{{ _app.slug }}"
      vars:
        _app_hostname: "{{ hostvars[inventory_hostname][_app.host_var] | default(lookup('vars', _app.host_var, default='')) }}"
      when: _app_hostname | length > 0

    # Deployed without waiting on the public OIDC discovery URL. oauth2-proxy
    # boots with --skip-oidc-discovery + intra-cluster
    # --oidc-jwks-url/--redeem-url (defaults/main.yml says why), so a
    # container start makes ZERO calls to the public auth.<zone> endpoint. A
    # gate on the public URL (delegate_to localhost) would hard-fail the
    # converge in the window where cloudflared re-registers during a
    # same-converge Keycloak/cloudflared redeploy, coupling a restore to the
    # public edge being up at that instant. End-to-end public login
    # reachability is asserted in validate.yml.
    - name: "oauth2-proxy: deploy compose via Portainer API"
      ansible.builtin.include_tasks:
        file: deploy.yml
        apply:
          tags: [oauth2_proxy_compose]
      tags: [oauth2_proxy_compose]

    # With --skip-oidc-discovery the container's /ping is independent of the
    # public auth endpoint; validate.yml gates its per-app /ping on the
    # public issuer + JWKS being reachable (end-to-end validation).
    - name: "oauth2-proxy: post-deploy /ping probe"
      ansible.builtin.include_tasks:
        file: validate.yml
        apply:
          tags: [oauth2_proxy_health, edge]
      tags: [oauth2_proxy_health, edge]

- name: "oauth2-proxy: skipped Portainer-API steps (no API key yet)"
  ansible.builtin.debug:
    msg: >-
      Skipping oauth2-proxy realm + middleware + compose + validate --
      portainer_api_key is not yet present. It is normally minted by
      reconcile/roles/portainer earlier in this same converge; if you see this,
      portainer did not run or failed to mint the key.
  when:
    - not (catena_public_surface_deferred | default(false) | bool)
    - portainer_api_key is not defined or (portainer_api_key | length) <= 10
