---
# reconcile/roles/tier1_stack -- render the directly-created swarm services as compose,
# and dispatch the engine that actually creates them.

tier1_stack_dir: /etc/catena/stacks
tier1_stack_path: "{{ tier1_stack_dir }}/tier1.yml"

# App companions render to their own file. They are directly-created swarm
# services for the same reason the control plane is (host networking, global
# mode), but they arrive with the applications that consume them: coturn
# appears the converge after a Talk or Jitsi deploy. Mixed into tier1.yml, they
# would make the control-plane render a moving target: the file would gain a
# service on a converge where the control plane did not change.
tier1_companions_path: "{{ tier1_stack_dir }}/companions.yml"

# The host engine that creates and reconciles these services
# (catena-admin payload/engines/tier1). Installed to /usr/local/bin by
# reconcile/roles/payload, which runs right after bootstrap/roles/docker -- ahead of every role
# that includes tasks/reconcile_one.yml.
tier1_engine_bin: /usr/local/bin/catena-tier1

# Services that MUST have contributed a spec before the file is written.
#
# This is the guard against a partial render. A `--tags postgres` converge
# runs one role, so one spec accumulates, and a stack file holding one service
# is not an incomplete description of the control plane -- once applied it is
# an instruction to DELETE the other two.
tier1_stack_required:
  - catena-traefik
  - catena-postgres
  - catena-portainer
