---
# Orchestrator for reconcile/roles/catena-admin.
#
#   lanes.yml   -- the host lanes' configuration (daily.env, stack-update.env,
#                  managed-services.json) and the panel's UI port declaration.
#   catalog.yml -- merges the source-of-truth action catalog with
#                  per-inventory extras, renders the allow-list +
#                  dispatch table on the host.
#   deploy.yml  -- creates or reconciles the catena-admin Go shell as a
#                  swarm service (pulls the published GHCR image). Runs
#                  after the host-side state its container binds to exists.
#
# The runner account and the panel's SSH key are bootstrap/roles/catena_admin_host
# (bootstrap-side, as boundary.yml says why); the forced command, the sudo and
# sshd rules and the dispatcher are reconcile/roles/dispatch_path. Both run
# before this role in converge.yml.

- name: Catena-admin host lanes' configuration + UI port declaration
  ansible.builtin.import_tasks: lanes.yml
  tags: [catena_admin, catena_admin_lanes]

- name: Catena-admin action catalog + allow-list
  ansible.builtin.import_tasks: catalog.yml
  tags: [catena_admin, catena_admin_catalog]

- name: Catena-admin container deploy (swarm service)
  ansible.builtin.import_tasks: deploy.yml
  tags: [catena_admin, catena_admin_deploy]
