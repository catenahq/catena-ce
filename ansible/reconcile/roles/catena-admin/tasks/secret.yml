---
# Create ONE swarm secret from ca_secret ({name, target, value}).
#
# Included per missing secret rather than looped inline because creating one
# takes two steps that must stay paired: stage the material in a 0600 file,
# then `docker secret create` from that path. The value never appears in an
# argv -- /proc is world-readable, so a secret on a command line is a secret
# every local user has.
#
# The staged file is removed in `always`, so an interrupted converge does not
# leave the credential on disk.

- name: "Catena-admin: create swarm secret {{ ca_secret.name }}"
  block:
    - name: "Catena-admin: stage secret material (0600)"
      ansible.builtin.copy:
        dest: "{{ catena_admin_secret_staging_path }}"
        content: "{{ ca_secret.value }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "Catena-admin: docker secret create"
      ansible.builtin.command:
        argv:
          - docker
          - secret
          - create
          - "{{ ca_secret.name }}"
          - "{{ catena_admin_secret_staging_path }}"
      register: _ca_secret_create
      changed_when: _ca_secret_create.rc == 0
  always:
    - name: "Catena-admin: remove staged secret material"
      ansible.builtin.file:
        path: "{{ catena_admin_secret_staging_path }}"
        state: absent
