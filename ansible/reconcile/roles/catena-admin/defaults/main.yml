---
# reconcile/roles/catena-admin -- per-VPS admin panel (the catena-admin Go shell).
#
# The role manages the container's HOST-SIDE state (lanes.yml + catalog.yml)
# AND deploys the container itself as a swarm service (deploy.yml, pulling
# catena_admin_image). See README.md.

# --- Container image + port -------------------------------------------
# The PUBLIC catena-admin image the converge deploys (deploy.yml). Clients PULL
# it at converge time -- they never build on the client box (no Go toolchain on
# a client VPS). Published by the private catena-admin repo's publish-image.yml
# on a v* tag from main; the IMAGE is public (anonymous pull, no registry
# credential) while the Business feature set inside it is gated at runtime by
# the licence check.
#
# catena_admin_image lives in catena-ce/ansible/playbooks/group_vars/all/main.yml:
# reconcile/roles/payload extracts the host engines from the same image long
# before this role's defaults are in scope, and the two must agree. It is
# CATENA_ADMIN_IMAGE, the image the converge was started with. See the block
# there.

# Deploy the catena-admin container FROM the converge (deploy.yml), as every
# converge does; CATENA_ADMIN_DEPLOY_FROM_CONVERGE=false skips it.
catena_admin_deploy_from_converge: >-
  {{ lookup('env', 'CATENA_ADMIN_DEPLOY_FROM_CONVERGE', default='true') | bool }}

# --- tier-1 swarm service ---------------------------------------------
# The panel is created directly with `docker service create`, not through a
# stack deploy. It is the tool that repairs the host, so it depends on nothing
# but the local swarm.
#
# catena_admin_service_name lives in playbooks/group_vars/all/main.yml for the same reason
# the image does: reconcile/roles/payload, which runs well before this role,
# reads it to ask swarm which image this service runs, and this role's
# defaults are not in scope that early. See
# the block there, including why the name is load-bearing for oauth2_proxy.

# Swarm secrets for the values that must not travel in argv. Each real name
# gets the value's hash appended (playbooks/filter_plugins/
# catena_admin_service.py secret_name) because swarm secrets are immutable -- a
# fixed name would make every rotation a silent no-op.
#
# The target name doubles as the env var: <KEY>_FILE points at
# /run/secrets/<target>, which catena-admin's secretenv.go reads.
catena_admin_secret_specs:
  - base: catena_admin_session_key
    target: CATENA_ADMIN_SESSION_KEY
    value: "{{ catena_admin_session_key }}"
  # What the panel's sign-in gate sends with every request it forwards
  # (reconcile/roles/oauth2_proxy). The panel takes a signed-in identity only
  # from a request carrying it; without it every request is served as nobody.
  - base: catena_admin_gate_secret
    target: CATENA_ADMIN_GATE_SECRET
    value: "{{ catena_admin_gate_secret | default('') }}"
  - base: catena_admin_healthchecks_key
    target: HEALTHCHECKS_API_KEY_READONLY
    value: "{{ healthchecks_api_key_readonly | default('') }}"
  # The realm service account behind the People panel. Absent on a host whose
  # converge predates it, which the panel renders as "no directory credential
  # yet" rather than as an error -- an empty secret is a state, not a fault.
  - base: catena_admin_keycloak_secret
    target: KEYCLOAK_ADMIN_CLIENT_SECRET
    value: "{{ catena_admin_panel_client_secret | default('') }}"
  # The token the host's dashboard-sync lane sends to the panel's Keycloak
  # forward. A secret rather than an --env for the same reason as the others:
  # an --env value is in the host's process table for the length of the create.
  - base: catena_admin_marketplace_token
    target: CATENA_MARKETPLACE_TOKEN
    value: "{{ catena_marketplace_token | default('') }}"

# Supplementary group. The recovery export dir is 0750 root:1000 (gid 1000
# is the shared recovery-downloads group) and the image runs USER nonroot,
# so without this the Recovery tab lists nothing even when the host wrote a
# recovery zip.
catena_admin_supplementary_gid: "1000"

# Hardening subset, reconciled by swarm_service_drift on every converge.
#
# No health_cmd HERE, on purpose. The image is distroless, and swarm's
# --health-cmd is always run as `/bin/sh -c`, which it cannot. The healthcheck
# is the image's own HEALTHCHECK in exec form (`catena-admin health`, probing
# its /health), which swarm honours without a shell. swarm_service_drift only
# touches the healthcheck when health_cmd is in this spec, so the image's
# survives every converge -- and `docker service ls` reading 1/1 means the
# listener answers, not merely that the process started.
#
# stop-first: the UI port is published mode=host, so two tasks cannot hold it at once and start-first would have
# the new task fail its bind while the old one still listens.
catena_admin_limit_memory: "512m"
catena_admin_reserve_memory: "128m"
catena_admin_stop_grace_period: "20s"
catena_admin_update_failure_action: "pause"
catena_admin_update_monitor: "30s"
catena_admin_update_max_failure_ratio: 0
catena_admin_update_order: "stop-first"

# Placement. It bind-mounts node-LOCAL paths (the audit chain, the SSH runner
# key, the host lanes' reports), so it must land on the node that has them,
# and it reaches the host dispatch, which is that node's.
catena_admin_constraints:
  - "node.role==manager"
  - "node.labels.catena.role==data"

catena_admin_desired:
  image: "{{ catena_admin_image }}"
  constraints: "{{ catena_admin_constraints }}"
  limit_memory: "{{ catena_admin_limit_memory }}"
  reserve_memory: "{{ catena_admin_reserve_memory }}"
  stop_grace_period: "{{ catena_admin_stop_grace_period }}"
  update_failure_action: "{{ catena_admin_update_failure_action }}"
  update_monitor: "{{ catena_admin_update_monitor }}"
  update_max_failure_ratio: "{{ catena_admin_update_max_failure_ratio }}"
  update_order: "{{ catena_admin_update_order }}"

# Port the Go shell listens on inside the container (CATENA_ADMIN_ADDR
# in the service env; oauth2_proxy upstreams to catena-admin:8000).
# catena_admin_internal_port lives in playbooks/group_vars/all/main.yml beside
# catena_admin_service_name, which the other roles read.

# Native-login listener inside the container, published on the host as
# catena_admin_ui_port and confined to this host by the public-ports registry
# (lanes.yml fragment), so the panel is reachable through an SSH forward
# without the Cloudflare/oauth2-proxy edge.
catena_admin_direct_port: 8001

# How long the converge waits for a newly-created service to report a Running
# task before giving up and printing what swarm said. Five minutes: long enough
# for a cold image pull on a slow link, short enough that a task which will
# never start is reported rather than waited on.
catena_admin_converge_retries: 60
catena_admin_converge_delay: 5
catena_admin_allowed_actions_path: "/etc/catena/admin-allowed.yaml"
catena_admin_dispatch_actions_path: "/etc/catena/admin-actions"
# Where the PAYLOAD drops dispatch arms the converge does not know about. The
# converge creates the directory root-owned and reads nothing from it, a
# one-way dependency: the converge provides the moment, the image subscribes to
# it.
#
# Base-first: the rendered case arms are tried first and win outright, so a
# drop-in can only ADD a name. It also can never add an env var -- AcceptEnv and
# sudoers env_keep stay converge-owned, deliberately.
catena_admin_actions_overlay_dir: "/etc/catena/admin-actions.d"
catena_admin_actions_yml_path: "/etc/catena/admin-actions.yml"
catena_admin_actions_extra_yml_path: "/etc/catena/admin-actions.extra.yml"
catena_admin_extra_tiles_path: "/etc/catena/extra-tiles.yml"

# Source-of-truth action catalog. Rendered by catalog.yml into the
# host dispatch table + the catalog the Go shell reads at runtime.
# Role-relative template; the only Jinja marker is `ansible_managed`.
catena_admin_actions_source: "{{ role_path }}/templates/actions.yml.j2"

# Per-inventory action extras + tiles. Same shape as the canonical
# `actions:` list in templates/actions.yml.j2 and the `tiles:` list the
# Go shell's Apps tab consumes (shell/apps).
catena_admin_extra_actions: []
catena_admin_extra_tiles: []

# The scheduling owner. Installed with the rest of the ungated payload; it
# reads /etc/catena/config.json and is the only thing that enables a timer,
# writes a timer OnCalendar drop-in, or renders the restic retention file.
catena_schedule_bin: /usr/local/bin/catena-schedule

# The container-bump engine, which also carries the `self-update` verb that
# moves the panel itself.
catena_admin_stack_update_bin: /usr/local/bin/catena-stack-update-managed

# --- the host lanes' configuration (lanes.yml) -------------------------
# Per-host configuration for the daily chain. catena-daily.service and
# catena-daily-resume.service declare EnvironmentFile for it with no leading
# dash, so systemd fails the unit when it is missing. Paths and toggles only:
# the chain reads its credentials from the config store.
catena_daily_env_path: /etc/catena/daily.env

# The container-bump lane's configuration and the spec list it bumps from.
# catena-stack-update-managed.service declares its EnvironmentFile with no
# leading dash too, and the engine's --specs-file names the list.
catena_stack_update_env_path: /etc/catena/stack-update.env
catena_managed_services_path: /etc/catena/managed-services.json

# Container-bump gates: two minutes of stabilisation before the next service is
# bumped. The days a new version waits come from the config store (the
# Schedules page).
catena_stack_update_stabilize_seconds: 120
catena_stack_update_cve_severity: "HIGH,CRITICAL"
# Gatus's endpoint statuses, on the loopback port reconcile/roles/infrastructure
# publishes it on. The daily chain's pre-update gate reads it (daily.env), and
# so does the health baseline the update lanes compare a bump against
# (stack-update.env); both run on the host.
catena_gatus_statuses_url: "http://127.0.0.1:{{ gatus_host_localhost_port }}/api/v1/endpoints/statuses"

# The daily chain's own Healthchecks check, which catena-schedule (catena-admin
# payload/engines/schedule) keeps on the daily lane's schedule: the chain pings
# it when it starts, on a failed step, and when it completes. The loopback
# publish, for the reason reconcile/roles/backup/defaults gives for the
# backup's checks; ?create=1 provisions the check a first ping finds missing.
daily_healthcheck_chain_url: >-
  {{
    healthchecks_ping_base
    ~ '/ping/' ~ (healthchecks_ping_key | default(''))
    ~ '/catena-daily?create=1'
    if healthchecks_ping_key is defined else ''
  }}

# EE-reserved HOST dispatch entries. The Go shell renders Business action
# BUTTONS at runtime from its compiled-in panels (audit, daily, ...) only
# under an active license, and dispatches each by NAME through the host
# forced-command runner. The runner's dispatch table is CE-rendered, so
# without a matching entry it rejects the action name; these entries authorize
# the known Business action names -> the host engines. The engines install on
# EVERY host at converge (the payload is not license-gated -- see
# reconcile/roles/payload), so the binaries are present even on a plain
# Community host; the license only controls which buttons the shell RENDERS.
# The dispatcher already runs as root (the forced-command pipes through sudo),
# so no extra sudoers is needed. These are appended to the host dispatch table
# + allow-list ONLY, never to the shell-read catalog (actions.yml), so no
# Business button ever appears on a Community host -- the panel contributes the
# button only while its license is active. The name MUST match the daily panel's ActionSpec (catena-admin
# shell/panels/daily); a drift means the shell dispatches a name the host
# cannot resolve.
catena_admin_ee_reserved_actions:
  # Payload (re-)install: refreshes the host payload (engines + lane scripts +
  # units) from the image the panel is running. The converge installs the
  # payload unconditionally (reconcile/roles/payload); this reserved action
  # lets the shell re-run the install out of band after an image bump without
  # a full converge.
  #
  # It runs the ENGINE, which copies the tree out of the running image, as
  # root, into the root-owned stage directory reconcile/roles/payload uses
  # (catena_payload_stage_dir), and runs the installer from there: the image
  # is the trust root, and nothing the panel can write is read back as root
  # input. The panel is built with no root and no docker socket for exactly
  # this reason.
  #
  # Detached under its own unit, holding /run/catena.lock for the engine's
  # lifetime, like the panel's self-update. The self-update and the host's own
  # converge (catena-converge) hold that lock while they empty and refill the
  # same stage directory and rotate the payload manifest, so a reinstall
  # beside either would install from a half-filled tree and record a partial
  # manifest, whose next prune removes engines the image still ships. flock
  # waits for the holder inside the unit, where the panel's action timeout
  # does not reach, so the button reports that the install started. A second
  # press while the unit runs is refused by systemd-run, and the report is
  # printed only once the unit started.
  - name: ee-install-engines
    shell: >-
      systemd-run --unit catena-install-payload --collect
      /usr/bin/flock -w 3600 /run/catena.lock
      {{ catena_admin_stack_update_bin }} install-payload
      && echo 'Engine install started in the background. It waits for any
      backup, update or converge already running on this server, then installs
      the engines from the image this panel runs. Follow it with: journalctl -u
      catena-install-payload -f'
  # ee-install-engines is the ONLY entry in this table, and the rule that keeps
  # it alone is the reconcile invariant applied to the dispatch table itself:
  # the action that REINSTALLS the payload cannot depend on the payload having
  # installed correctly. Everything else follows the ordinary rule -- whoever
  # ships a command authorises it.
  #
  # So the paid names (catena-admin payload/actions.d/10-paid.sh
  # _CATENA_PAID_NAMES) are authorised by that dispatch drop-in of the
  # payload's own, next to the binaries they run. An entry here for any of them would be an
  # authorization record for a name and a path this converge neither chooses nor
  # can verify, and it would put a whole converge between a panel that gains an
  # action and a host willing to accept it.
  #
  # The two panel self-update entries are Community and live in the shell-read
  # catalog (catena_admin_ce_selfupdate_actions below): a panel nobody has
  # patched is the same shape of problem as a backup nobody has verified, and a
  # free-edition host gets the mechanism too.
  #
  # The dispatcher offers any name this table does not carry to
  # {{ catena_admin_actions_overlay_dir }} before refusing it, and the payload
  # installer records the names it added, with their forms, in release.json's
  # payload_actions, from which the panel renders their buttons.

# --- on-box config store (settings API) --------------------------------
# Neither the store's path nor its writer is a variable this role renders. The
# settings action and the zone save ship in the panel image, and the image
# installs the writer (helpers/onbox_config.py) as one of its own payload
# binaries, so nothing in this repo's dispatch table pipes through them.
#
# The registries in helpers/onbox_config.py remain the enforcement point, and
# they are read TWICE -- once by the writer when a request arrives, and again by
# this converge's loader when it projects the store into facts. A key this repo
# does not declare is a key it never projects, whatever the file holds. That is
# the property that survives the writer shipping in the image.

# --- why this role declares no CE reserved-actions table ---------------
#
# The Community action names -- the settings store, scheduling, offsite
# copies, the backup password, the panel self-update, the backup endpoint
# check, the state register, quiesce, the journal seal check, the licence
# check and refresh, the whole restore family, and the receiving side of a
# migration -- are authorised by the payload's own dispatch drop-in,
# catena-admin payload/actions.d/20-catena.sh, on the same rule as the paid
# names above: whoever ships a command authorises it. An entry here instead
# would make a one-line change to any of them need an operator with a laptop and
# an SSH session against a live client.
#
# Two of those commands are catena-ce scripts (onbox_config.py,
# catena-restic-key.py). The image build copies them into the payload's own bin
# out of the vendored tree, so the image ships every command it authorises, and
# their paths are product constants the payload installer chooses -- which is
# why no Ansible variable here spells them out.
#
# NOTHING may be added to this table for them: the dispatcher is base-first, so
# a name here wins over the drop-in and the file where the command is maintained
# is never reached. tests/unit/test_converge_dispatch_table.py is the gate on
# that.

# The Cloudflare tunnel actions are NOT here. cloudflared-check and
# cloudflared-sync are image drop-ins (catena-admin payload/actions.d/
# 20-catena.sh), because neither body interpolates a fact about this host: the
# engine reads the token, the zones and the tunnel-name prefix from the store,
# and names the tunnel after the box's own hostname. The one thing this repo
# still owns for them is the sshd AcceptEnv entry that carries the candidate
# token, in reconcile/roles/dispatch_path's passthrough list -- a drop-in may
# read that name and can never add to it.
