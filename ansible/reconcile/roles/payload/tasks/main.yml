---
# Extract the host engine payload from the catena-admin image and install it.
# See defaults/main.yml for why this runs right after bootstrap/roles/docker
# rather than with reconcile/roles/catena-admin.

# Published for the roles downstream that dispatch an engine. They cannot read
# this role's defaults reliably, and the difference matters to them: with the
# converge owning the engines a missing binary is a real failure, while a host
# whose engines were staged out of band may legitimately not have them yet.
- name: "Payload: publish whether this converge owns the host engines"
  ansible.builtin.set_fact:
    catena_payload_engines_expected: "{{ catena_payload_install | bool }}"

# ─── which image the engines come from ───────────────────────────────────
# catena_admin_image, the image this converge was started with:
# install-host.sh names the release it installs, and catena-admin's
# catena-converge the image the panel runs, by digest.
# reconcile/roles/catena-admin reconciles the panel's service to the same
# image later in this converge, so the engines and the shell have one input.

# Refused, before anything is pulled, copied out or run. The engines run as
# root, and without a digest nothing holds them, or the panel, to the bytes a
# registry published. Every install, every host's own converge and the panel's
# update name the image by digest (README.md, "Which digest this asserts"), so
# what reaches this is a converge started by hand with a tag, or an image
# built or loaded on the server.
- name: "Payload: the image names no digest -- refusing"
  ansible.builtin.fail:
    msg: >-
      This converge names the catena-admin image {{ catena_admin_image }}
      without a digest, so nothing can check that its engines and the panel
      are the bytes a registry published.
      Nothing was pulled, extracted or run.
      Name the image by digest (repo:tag@sha256:...). An image built or
      loaded by hand on the server has no digest until it is pushed to a
      registry and pulled from there.
  when: catena_payload_image_digest | length == 0

- name: "Payload: install skipped -- engines are staged out of band"
  ansible.builtin.debug:
    msg: >-
      CATENA_PAYLOAD_INSTALL=false: not extracting engines from
      {{ catena_admin_image }}. Whatever put /usr/local/bin/catena-* on this
      host owns them for this converge.
  when: not (catena_payload_install | bool)

- name: "Payload: extract and install the host engines"
  when: catena_payload_install | bool
  block:
    # A digest names the same bytes wherever they come from, so an image
    # addressed by one and already on this host needs no registry. The host's
    # own converge names the image the panel runs, which always is, so that
    # converge keeps running while the registry does not answer. A tag can
    # move, so a reference without a digest is always pulled.
    - name: "Payload: is the digest-pinned image already on this host"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ .Id }}' }}"
          - "{{ catena_admin_image }}"
      register: _payload_present
      changed_when: false
      failed_when: false
      when:
        - catena_payload_pull | bool
        - "'@sha256:' in catena_admin_image"

    - name: "Payload: pull {{ catena_admin_image }}"
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ catena_admin_image }}"
      register: _payload_pull
      changed_when: "'Downloaded newer image' in _payload_pull.stdout"
      when:
        - catena_payload_pull | bool
        - (_payload_present.rc | default(1)) != 0

    - name: "Payload: resolve the image ID"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ .Id }}' }}"
          - "{{ catena_admin_image }}"
      register: _payload_image_id
      changed_when: false

    # The digest gate sits here on purpose: after the image is resolvable and
    # BEFORE anything is copied out of it or executed. A mismatch must never
    # reach `docker create`, let alone install-ee-payload.sh, which runs as
    # root. The ordering is what the unit test pins.
    - name: "Payload: resolve the image's repo digest"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ join .RepoDigests \",\" }}' }}"
          - "{{ catena_admin_image }}"
      register: _payload_repo_digests
      changed_when: false

    - name: "Payload: the image is not the pinned one -- refusing to extract"
      ansible.builtin.fail:
        msg: >-
          {{ catena_admin_image }} resolved to
          {{ _payload_repo_digests.stdout | default('') | trim | default('no repo digest', true) }}
          but this deployment pins {{ catena_payload_image_digest }}. Refusing
          to extract or root-execute the payload.
      when: catena_payload_image_digest not in (_payload_repo_digests.stdout | default(''))

    # Said out loud, so a converge's output shows the check ran.
    - name: "Payload: image digest matches the pin"
      ansible.builtin.debug:
        msg: >-
          {{ catena_admin_image }} carries {{ catena_payload_image_digest }},
          the digest this converge pins: digest check passed.

    - name: "Payload: read the image, then remove what was created to read it"
      block:
        - name: "Payload: create a throwaway container to copy out of"
          ansible.builtin.command:
            argv:
              - docker
              - create
              - "{{ catena_admin_image }}"
          register: _payload_cid
          changed_when: false

        # ─── the tree and the engines are one version ──────────────────────
        # The roles running now and the engines about to be installed must come
        # from one catena-ce tree. A file one version's converge installs and
        # the other version's payload claims, or the reverse, is otherwise left
        # with no owner, and the next converge fails on its absence. Checked on
        # every converge, before anything is copied out or run.
        - name: "Payload: a file to read the image's tree record into"
          ansible.builtin.tempfile:
            state: file
          register: _payload_record_file
          changed_when: false

        - name: "Payload: copy out the record of the tree the image was built with"
          ansible.builtin.command:
            argv:
              - docker
              - cp
              - "{{ _payload_cid.stdout | trim }}:{{ catena_payload_tree_record }}"
              - "{{ _payload_record_file.path }}"
          changed_when: false

        - name: "Payload: read the image's tree record"
          ansible.builtin.slurp:
            src: "{{ _payload_record_file.path }}"
          register: _payload_record_raw

        # A lookup, so it runs where ansible-playbook and the tree it runs are.
        - name: "Payload: name the tree this converge runs, and the image's"
          ansible.builtin.set_fact:
            _payload_tree: >-
              {{ lookup('pipe', ansible_playbook_python | quote ~ ' '
                 ~ (catena_payload_tree_root ~ '/ansible/helpers/tree_hash.py') | quote ~ ' '
                 ~ catena_payload_tree_root | quote) | from_json }}
            _payload_record: "{{ _payload_record_raw.content | b64decode | from_json }}"

        - name: "Payload: the tree and the image are not one version -- refusing to install"
          ansible.builtin.fail:
            msg: >-
              This converge runs catena-ce
              {{ _payload_tree.describe | default('(unknown)', true) }},
              and {{ catena_admin_image }} was built with catena-ce
              {{ _payload_record.describe | default('(unknown)', true) }}.
              Their contents differ, so its engines would run under another
              version's configuration. Nothing was installed. Converge with the
              tree that image carries, or build an image from this tree.
          when: >-
            (_payload_record.tree_sha256 | default('', true) | length == 0)
            or (_payload_record.tree_sha256 != _payload_tree.tree_sha256)

        - name: "Payload: read the installed-image marker"
          ansible.builtin.slurp:
            src: "{{ catena_payload_marker }}"
          register: _payload_marker
          failed_when: false

        - name: "Payload: decide whether the installed engines are current"
          ansible.builtin.set_fact:
            _payload_current: >-
              {{ (_payload_marker.content | default('') | b64decode | trim)
                 == (_payload_image_id.stdout | trim) }}

        - name: "Payload: engines already installed from this image"
          ansible.builtin.debug:
            msg: >-
              /usr/local/bin already carries the engines from
              {{ _payload_image_id.stdout | trim }} -- nothing to install.
          when: _payload_current | bool

        # --- the tree root runs ---------------------------------------------
        # Root runs install-ee-payload.sh out of this directory, so root is the
        # only writer: it is created here, root-owned and 0700, inside the
        # /var/lib/catena the panel's service mounts read-only
        # (playbooks/filter_plugins/catena_admin_service.py). The panel is built
        # with no root and no docker socket so that a compromise of it does not
        # become host root, and a tree it could write would let it choose what
        # root installs into /usr/local/bin and /etc/catena/admin-actions.d.
        #
        # Emptied first. The installer installs every file it finds and records
        # each one in the manifest its prune reads, so a file an earlier image
        # left here would be installed again and never withdrawn.
        #
        # The panel's self-update and its install-payload verb extract into the
        # same directory the same way (catena-admin
        # payload/engines/stackupdate/selfupdate.go, payloadStageDir).
        - name: "Payload: empty the stage directory"
          ansible.builtin.file:
            path: "{{ catena_payload_stage_dir }}"
            state: absent
          when: not (_payload_current | bool)

        - name: "Payload: create the stage directory, root-owned"
          ansible.builtin.file:
            path: "{{ catena_payload_stage_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          when: not (_payload_current | bool)

        - name: "Payload: docker cp the payload tree into the stage directory"
          ansible.builtin.command:
            argv:
              - docker
              - cp
              - "{{ _payload_cid.stdout | trim }}:{{ catena_payload_image_path }}/."
              - "{{ catena_payload_stage_dir }}/"
          changed_when: true
          when: not (_payload_current | bool)

      always:
        # The container is created, never started; it still holds a writable
        # layer until removed. Removing it in `always` keeps a failed copy from
        # leaking one container per converge.
        - name: "Payload: remove the throwaway container"
          ansible.builtin.command:
            argv:
              - docker
              - rm
              - "-f"
              - "{{ _payload_cid.stdout | trim }}"
          changed_when: false
          failed_when: false
          when: _payload_cid.stdout | default('') | length > 0

        - name: "Payload: remove the copied tree record"
          ansible.builtin.file:
            path: "{{ _payload_record_file.path }}"
            state: absent
          changed_when: false
          when: _payload_record_file.path is defined

    - name: "Payload: install the engines onto the host"
      ansible.builtin.command:
        argv:
          - bash
          - "{{ catena_payload_stage_dir }}/install-ee-payload.sh"
      register: _payload_install
      changed_when: true
      when: not (_payload_current | bool)

    - name: "Payload: record the image the engines came from"
      ansible.builtin.copy:
        content: "{{ _payload_image_id.stdout | trim }}\n"
        dest: "{{ catena_payload_marker }}"
        mode: "0644"
      when: not (_payload_current | bool)

    - name: "Payload: installed"
      ansible.builtin.debug:
        msg: "{{ _payload_install.stdout | trim }}"
      when: not (_payload_current | bool)
