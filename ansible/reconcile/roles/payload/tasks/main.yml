---
# Extract the host engine payload from the catena-admin image and install it.
# See defaults/main.yml for why this runs at role 5.5 rather than at 13.

# Published for the roles downstream that dispatch an engine. They cannot read
# this role's defaults reliably, and the difference matters to them: with the
# converge owning the engines a missing binary is a real failure, while a host
# whose engines were staged out of band may legitimately not have them yet.
- name: "Payload: publish whether this converge owns the host engines"
  ansible.builtin.set_fact:
    catena_payload_engines_expected: "{{ catena_payload_install | bool }}"

# ─── which image the engines come from ───────────────────────────────────
# The shell's, whenever there is a shell. Asking swarm instead of resolving the
# floor a second time is what makes drift unrepresentable rather than merely
# detectable: "which image do the engines come from" stops being a separate
# question from "which image does the shell come from", so the two cannot
# answer differently.
#
# reconcile/roles/catena-admin reconciles the service to catena_admin_image
# later in this converge. On a host's own converge that is the image the
# service already runs, so following the service and following
# catena_admin_image name the same image.
#
# The spec's image carries the digest swarm resolved at create/update time, so
# following it is byte-exact rather than tag-exact.
- name: "Payload: what image is the catena-admin service running"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - inspect
      - "{{ catena_admin_service_name }}"
      - "--format={{ '{{ .Spec.TaskTemplate.ContainerSpec.Image }}' }}"
  register: _payload_service_image
  changed_when: false
  # "no such service" is the normal first-converge answer, not an error: this
  # role runs at 5.5 and reconcile/roles/catena-admin creates the service at 13.
  failed_when: false

- name: "Payload: the engines follow the shell"
  ansible.builtin.set_fact:
    catena_payload_image: "{{ _payload_service_image.stdout | trim }}"
    _payload_from_service: true
  when:
    - lookup('env', 'CATENA_PAYLOAD_IMAGE') | default('', true) | length == 0
    - _payload_service_image.rc | default(1) == 0
    - (_payload_service_image.stdout | default('') | trim) | length > 0

- name: "Payload: nothing to follow -- using the resolved image"
  ansible.builtin.debug:
    msg: >-
      The engines come from {{ catena_payload_image }}. Either this host has no
      {{ catena_admin_service_name }} service yet -- reconcile/roles/catena-admin creates
      it later in this converge, from this same image -- or
      CATENA_PAYLOAD_IMAGE named one explicitly.
  when: not (_payload_from_service | default(false))

- name: "Payload: install skipped -- engines are staged out of band"
  ansible.builtin.debug:
    msg: >-
      CATENA_PAYLOAD_INSTALL=false: not extracting engines from
      {{ catena_payload_image }}. Whatever put /usr/local/bin/catena-* on this
      host owns them for this converge.
  when: not (catena_payload_install | bool)

- name: "Payload: extract and install the host engines"
  when: catena_payload_install | bool
  block:
    # Created owned by the CONTAINER's uid, not root.
    #
    # This role runs fifteen roles before catena-admin, so on a first converge
    # it is what brings this directory into existence -- and the capture-restore
    # pair below preserves whatever owner it finds. Creating it root-owned meant
    # restoring it root-owned, and the chown in reconcile/roles/catena-admin only touches
    # the TOP directory, so `bin/` and every other subdirectory the extract made
    # stayed root's. The container's startup sync then failed on its first
    # write:
    #
    #   payload: sync to /var/lib/catena/ee-payload failed:
    #   open /var/lib/catena/ee-payload/bin/.payload-...: permission denied
    #
    # Both writers put the SAME payload here, from the same digest-pinned image,
    # so the shared ownership grants the container nothing it does not already
    # ship itself.
    - name: "Payload: ensure the extraction directory exists"
      ansible.builtin.file:
        path: "{{ catena_payload_dir }}"
        state: directory
        owner: "{{ catena_container_uid }}"
        group: "{{ catena_container_gid }}"
        mode: "0755"

    # Capture BEFORE the extract. The catena-admin container mirrors its own
    # payload into this directory as its nonroot uid; `docker cp` writes as
    # root. Leaving the tree root-owned makes the container's next startup sync
    # fail, which is silent until an engine goes stale.
    - name: "Payload: capture the extraction directory's ownership"
      ansible.builtin.stat:
        path: "{{ catena_payload_dir }}"
      register: _payload_dir_before

    # A digest names the same bytes wherever they come from, so an image
    # addressed by one and already on this host needs no registry. The image
    # the panel service runs always is, which keeps the host's own converge
    # running while the registry does not answer. A tag can move, so a
    # reference without a digest is always pulled.
    - name: "Payload: is the digest-pinned image already on this host"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ .Id }}' }}"
          - "{{ catena_payload_image }}"
      register: _payload_present
      changed_when: false
      failed_when: false
      when:
        - catena_payload_pull | bool
        - "'@sha256:' in catena_payload_image"

    - name: "Payload: pull {{ catena_payload_image }}"
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ catena_payload_image }}"
      register: _payload_pull
      changed_when: "'Downloaded newer image' in _payload_pull.stdout"
      when:
        - catena_payload_pull | bool
        - (_payload_present.rc | default(1)) != 0

    - name: "Payload: resolve the image ID"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ .Id }}' }}"
          - "{{ catena_payload_image }}"
      register: _payload_image_id
      changed_when: false

    # The digest gate sits here on purpose: after the image is resolvable and
    # BEFORE anything is copied out of it or executed. A mismatch must never
    # reach `docker create`, let alone install-ee-payload.sh, which runs as
    # root. The ordering is what the unit test pins.
    - name: "Payload: resolve the image's repo digest"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "--format={{ '{{ join .RepoDigests \",\" }}' }}"
          - "{{ catena_payload_image }}"
      register: _payload_repo_digests
      changed_when: false
      when: catena_payload_image_digest | length > 0

    - name: "Payload: the image is not the pinned one -- refusing to extract"
      ansible.builtin.fail:
        msg: >-
          {{ catena_payload_image }} resolved to
          {{ _payload_repo_digests.stdout | default('') | trim | default('no repo digest', true) }}
          but this deployment pins {{ catena_payload_image_digest }}. Refusing
          to extract or root-execute the payload.
      when:
        - catena_payload_image_digest | length > 0
        - catena_payload_image_digest not in (_payload_repo_digests.stdout | default(''))

    - name: "Payload: image digest is NOT pinned"
      ansible.builtin.debug:
        msg: >-
          {{ catena_admin_image }} names no digest, so
          {{ catena_payload_image }} is being extracted and root-executed
          WITHOUT a digest check. Name the image by digest
          (repo:tag@sha256:...) or set CATENA_PAYLOAD_IMAGE_DIGEST. This is
          unchecked, not verified.
      when: catena_payload_image_digest | length == 0

    - name: "Payload: read the image, then remove what was created to read it"
      block:
        - name: "Payload: create a throwaway container to copy out of"
          ansible.builtin.command:
            argv:
              - docker
              - create
              - "{{ catena_payload_image }}"
          register: _payload_cid
          changed_when: false

        # ─── the tree and the engines are one version ──────────────────────
        # The roles running now and the engines about to be installed must come
        # from one catena-ce tree. A file one version's converge installs and
        # the other version's payload claims, or the reverse, is otherwise left
        # with no owner, and the next converge fails on its absence. Checked on
        # every converge, before anything is copied out or run.
        - name: "Payload: a file to read the image's tree record into"
          ansible.builtin.tempfile:
            state: file
          register: _payload_record_file
          changed_when: false

        - name: "Payload: copy out the record of the tree the image was built with"
          ansible.builtin.command:
            argv:
              - docker
              - cp
              - "{{ _payload_cid.stdout | trim }}:{{ catena_payload_tree_record }}"
              - "{{ _payload_record_file.path }}"
          changed_when: false

        - name: "Payload: read the image's tree record"
          ansible.builtin.slurp:
            src: "{{ _payload_record_file.path }}"
          register: _payload_record_raw

        # A lookup, so it runs where ansible-playbook and the tree it runs are.
        - name: "Payload: name the tree this converge runs, and the image's"
          ansible.builtin.set_fact:
            _payload_tree: >-
              {{ lookup('pipe', ansible_playbook_python | quote ~ ' '
                 ~ (catena_payload_tree_root ~ '/ansible/helpers/tree_hash.py') | quote ~ ' '
                 ~ catena_payload_tree_root | quote) | from_json }}
            _payload_record: "{{ _payload_record_raw.content | b64decode | from_json }}"

        - name: "Payload: the tree and the image are not one version -- refusing to install"
          ansible.builtin.fail:
            msg: >-
              This converge runs catena-ce
              {{ _payload_tree.describe | default('(unknown)', true) }},
              and {{ catena_payload_image }} was built with catena-ce
              {{ _payload_record.describe | default('(unknown)', true) }}.
              Their contents differ, so its engines would run under another
              version's configuration. Nothing was installed. Converge with the
              tree that image carries, or build an image from this tree.
          when: >-
            (_payload_record.tree_sha256 | default('', true) | length == 0)
            or (_payload_record.tree_sha256 != _payload_tree.tree_sha256)

        - name: "Payload: read the installed-image marker"
          ansible.builtin.slurp:
            src: "{{ catena_payload_marker }}"
          register: _payload_marker
          failed_when: false

        - name: "Payload: decide whether the installed engines are current"
          ansible.builtin.set_fact:
            _payload_current: >-
              {{ (_payload_marker.content | default('') | b64decode | trim)
                 == (_payload_image_id.stdout | trim) }}

        - name: "Payload: engines already installed from this image"
          ansible.builtin.debug:
            msg: >-
              /usr/local/bin already carries the engines from
              {{ _payload_image_id.stdout | trim }} -- nothing to install.
          when: _payload_current | bool

        - name: "Payload: docker cp the payload tree onto the host"
          ansible.builtin.command:
            argv:
              - docker
              - cp
              - "{{ _payload_cid.stdout | trim }}:{{ catena_payload_image_path }}/."
              - "{{ catena_payload_dir }}/"
          changed_when: true
          when: not (_payload_current | bool)

      always:
        # The container is created, never started; it still holds a writable
        # layer until removed. Removing it in `always` keeps a failed copy from
        # leaking one container per converge.
        - name: "Payload: remove the throwaway container"
          ansible.builtin.command:
            argv:
              - docker
              - rm
              - "-f"
              - "{{ _payload_cid.stdout | trim }}"
          changed_when: false
          failed_when: false
          when: _payload_cid.stdout | default('') | length > 0

        - name: "Payload: remove the copied tree record"
          ansible.builtin.file:
            path: "{{ _payload_record_file.path }}"
            state: absent
          changed_when: false
          when: _payload_record_file.path is defined

    - name: "Payload: restore the extraction directory's ownership"
      ansible.builtin.file:
        path: "{{ catena_payload_dir }}"
        state: directory
        owner: "{{ _payload_dir_before.stat.uid }}"
        group: "{{ _payload_dir_before.stat.gid }}"
        recurse: true
      when:
        - not (_payload_current | bool)
        - _payload_dir_before.stat.exists | default(false)

    - name: "Payload: install the engines onto the host"
      ansible.builtin.command:
        argv:
          - bash
          - "{{ catena_payload_dir }}/install-ee-payload.sh"
      register: _payload_install
      changed_when: true
      when: not (_payload_current | bool)

    - name: "Payload: record the image the engines came from"
      ansible.builtin.copy:
        content: "{{ _payload_image_id.stdout | trim }}\n"
        dest: "{{ catena_payload_marker }}"
        mode: "0644"
      when: not (_payload_current | bool)

    - name: "Payload: installed"
      ansible.builtin.debug:
        msg: "{{ _payload_install.stdout | trim }}"
      when: not (_payload_current | bool)
