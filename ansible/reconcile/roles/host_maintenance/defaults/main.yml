---
# The host's own upkeep: its packages, Debian's unattended-upgrades, the
# journal, the NTP servers, the settings the client changes in catena-admin,
# telling somebody the host needs a reboot, the hourly licence check, the error
# reports to Catena support and the hourly verify hook of each application. The
# package list is shared with bootstrap/roles/common, so it lives in
# playbooks/group_vars/all/main.yml (catena_baseline_packages).
#
# Nothing in this role reboots the host. The reboot-required probe is the half
# that makes "patched but not in effect yet" visible instead of silent.

# From the store (COMMON_TIMEZONE, COMMON_LOCALE); the literals are what a host
# with nothing stored uses.
host_maintenance_timezone: "{{ cfg_common_timezone | default('America/Toronto', true) | trim }}"
host_maintenance_locale: "{{ cfg_common_locale | default('en_CA.UTF-8', true) | trim }}"

# The account catena-apps (catena-admin payload/engines/apprepo) runs git as.
host_maintenance_git_user: catena-git

reboot_check_env_file: /etc/catena/reboot-check.env
reboot_check_report_file: /var/lib/catena/reboot-required.json
reboot_check_systemd_unit_name: catena-reboot-check

# The Healthchecks check this reports through. One slug per host-level probe,
# matching the clamd watch and the mail canary.
reboot_check_slug: catena-reboot-required

# The licence check's units, shipped in the catena-admin payload.
license_refresh_systemd_unit_name: catena-license-refresh

# The error reporter's units, shipped in the catena-admin payload.
error_report_systemd_unit_name: catena-error-report

# The units that run the verify hook of each application, shipped in the
# catena-admin payload.
app_verify_systemd_unit_name: catena-app-verify

# Executing-prefix paths this role writes, for
# playbooks/tasks/prune_withdrawn_files.yml. Empty: the probe, the licence
# check, the error reporter, the app verify and their units ship in the
# catena-admin payload.
host_maintenance_managed_paths: []
