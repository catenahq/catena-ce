---
# journald: a restart (not a reload) picks up Storage=persistent and Seal=yes
# and starts sealing the persistent journal.
- name: Restart systemd-journald
  listen: restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# timesyncd's unit has no reload; a restart reads the new NTP= list.
- name: Restart systemd-timesyncd
  listen: restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
