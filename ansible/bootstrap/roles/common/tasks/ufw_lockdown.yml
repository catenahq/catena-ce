---
# Close public port 22 behind a proven tailnet when the panel's Lockdown asks,
# or, on a host with no tailnet, open it.
#
# THE ONE TASK FILE THAT CAN LOCK EVERYBODY OUT. It is built to fail CLOSED --
# you stay reachable -- rather than fail OPEN, and the shape that guarantees
# that is prove-then-close:
#
#   1. read the access method this host declared;
#   2. add the new rules, which allow a subset of what is already allowed;
#   3. PROVE the new path works: bootstrap/roles/tailscale/tasks/reachable.yml,
#      which playbooks/lockdown.yml runs before this file when it closes. The
#      control server sees the host connected and accepting, and a peer
#      answers through the tunnel;
#   4. only then remove the public rule, and narrow the registry declaration;
#   5. assert the firewall ended up where step 4 put it.
#
# A failure at step 3 ends the play before this file, so public 22 stays
# allowed and nobody is locked out. The rules added at step 2 are harmless on
# their own: they allow traffic the broader public rule already allowed.
#
# STEPS 4 AND 5 RUN ONLY WHEN catena_lockdown_close_public_ssh IS TRUE, which
# playbooks/lockdown.yml sets from the panel's Lockdown action and nowhere else.
# A run that does not close joins the tailnet, adds the step-2 rules and stops:
# public 22 stays open, because the host's security rests on key-only SSH and
# the tailnet is a convenience whose one security feature is closing the port.
#
# FOUR COMBINATIONS. `no tailnet + 22 open` is what a host with no alternative
# gets, and it is a posture rather than a failure. `tailnet + 22 open` is where
# a host joined to a tailnet stays until the panel's Lockdown. `tailnet + 22
# closed` is the panel's Lockdown, below; the port reconciler reopens 22 while
# the tailnet is down and closes it again when it is back. `no tailnet + 22
# closed` is what that Lockdown leaves once the provider goes back to none:
# SSH still reaches the host over the tailnet it is still on, the reconciler
# reopens 22 if that tailnet goes down, and applying the chosen access opens 22
# for good. Nothing closes 22 on a host with no tailnet: there is nothing to
# prove.
#
# Detection is not proof. `ip link show tailscale0` says an interface exists,
# which is a different question from whether anyone can reach this host over
# it -- an ACL change, a DERP-only route or a superseded session all leave the
# interface up and the path dead.

- name: "Lockdown: the access method this host declared"
  ansible.builtin.debug:
    msg: >-
      access method: {{ catena_access_method }}
      ({{ ('public 22 closes once the tailnet path is proven'
           if catena_lockdown_close_public_ssh | default(false) | bool
           else "public 22 stays open; the panel's Lockdown closes it")
          if catena_access_method == 'tailnet'
          else 'public 22 opens -- this host has no other path' }})

# ─── No alternative path: 22 opens, and the host says so ─────────────────
# The rule bootstrap/roles/common adds, and the declaration it first writes, so
# the reconciler keeps the port open on every later timer fire. Both are no-ops
# on a host whose port is open.
- name: "Lockdown: open public 22 on a host with no alternative path"
  when: catena_access_method != 'tailnet'
  block:
    - name: Allow public SSH
      ansible.builtin.command:
        argv: [ufw, allow, from, any, to, any, port, "22", proto, tcp,
               comment, "{{ catena_ssh_ufw_comment }}"]
      register: _ufw_public_ssh
      changed_when: >-
        'Rule added' in _ufw_public_ssh.stdout
        or 'Rule updated' in _ufw_public_ssh.stdout

    - name: "Lockdown: declare port 22 open"
      ansible.builtin.copy:
        dest: "{{ public_ports_fragment_dir }}/{{ catena_ssh_fragment_name }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          {{
            [
              {"proto": "tcp", "port": 22, "scope": "any", "bind": "host",
               "owner": "ssh", "comment": "administrative SSH"}
            ] | to_nice_json
          }}
      register: _ssh_fragment_open

    # `restarted`: the unit is a oneshot, and a start joins a timer-fired run
    # already in flight, which read the declaration before this change.
    - name: "Lockdown: reconcile public ports now (port 22 declared open)"
      ansible.builtin.systemd_service:
        name: catena-public-ports.service
        state: restarted
      changed_when: false
      when: _ssh_fragment_open.changed

    - name: "Lockdown: public 22 is open with no alternative path"
      ansible.builtin.debug:
        msg: |
          Public port 22 is OPEN on this host.

          Its access method is {{ catena_access_method }}, so SSH on the public
          address is how it is reached for maintenance. Closing 22 would leave
          no administrative path at all -- the provider's console, which is not
          a path this playbook can reach.

          To close it, choose a private network and enter its credentials in
          catena-admin > Settings, then apply the chosen access again. It joins
          the tailnet first, and closes the port only once the tailnet confirms
          this server is reachable on it.

# ─── The tailnet path ────────────────────────────────────────────────────
- name: "Lockdown: allow SSH over the tailnet"
  when: catena_access_method == 'tailnet'
  block:
    - name: Assert tailscale0 interface is up
      ansible.builtin.command: ip link show tailscale0
      changed_when: false
      register: tailscale_iface_check
      failed_when: tailscale_iface_check.rc != 0

    - name: Capture tailnet IPv4 from current tailscale status
      ansible.builtin.command: tailscale status --json
      register: ts_status_for_lockdown
      changed_when: false

    - name: Set tailnet IP fact
      ansible.builtin.set_fact:
        _ts_json: "{{ ts_status_for_lockdown.stdout | from_json }}"

    - name: Extract tailnet IPv4
      ansible.builtin.set_fact:
        tailnet_ipv4: "{{ (_ts_json.Self.TailscaleIPs | default([])) | select('match', '100[.]') | list | first | default('') }}"

    - name: Assert tailnet IPv4 was found
      ansible.builtin.assert:
        that: tailnet_ipv4 | length > 0
        fail_msg: >-
          Could not extract tailnet IPv4 from `tailscale status --json`.
          Self.TailscaleIPs={{ _ts_json.Self.TailscaleIPs | default('(missing)') }},
          BackendState={{ _ts_json.BackendState | default('(missing)') }}.
          Is tailscale connected?

    # ─── Step 2: ADD new rules (nothing is removed yet) ──────────────────
    # The ufw CLI rather than community.general.ufw: the panel runs this file
    # on the host, where ansible-core carries no collections. ufw skips a rule
    # it already has ("Skipping adding existing rule"), so a rerun is a no-op.
    - name: Allow SSH on tailscale0
      ansible.builtin.command:
        # "on" quoted: YAML 1.1 reads a bare on as the boolean true.
        argv: [ufw, allow, in, "on", tailscale0, from, any, to, any, port, "22",
               proto, tcp, comment, "{{ catena_ssh_ufw_comment }}"]
      register: _ufw_tailnet_ssh
      changed_when: >-
        'Rule added' in _ufw_tailnet_ssh.stdout
        or 'Rule updated' in _ufw_tailnet_ssh.stdout

    # Allow SSH from RFC 1918 Docker bridge networks. catena-admin runs as
    # a container and reaches the forced-command dispatcher at
    # host.docker.internal, the host-gateway alias its service carries
    # (playbooks/filter_plugins/catena_admin_service.py). Those packets
    # arrive on the Docker bridge, which the tailscale0 rule above does not
    # match. RFC 1918 can't be spoofed from the public internet; the
    # dispatcher is the actual authz boundary (key-auth + allow-list),
    # not this UFW rule.
    - name: Allow SSH from Docker bridge networks (catena-admin dispatcher path)
      ansible.builtin.command:
        argv: [ufw, allow, from, "{{ item }}", to, any, port, "22", proto, tcp,
               comment, "{{ catena_ssh_ufw_comment }}"]
      loop:
        - 172.16.0.0/12
        - 10.0.0.0/8
      register: _ufw_bridge_ssh
      changed_when: >-
        'Rule added' in _ufw_bridge_ssh.stdout
        or 'Rule updated' in _ufw_bridge_ssh.stdout

- name: "Lockdown: public 22 stays open until the panel's Lockdown closes it"
  ansible.builtin.debug:
    msg: >-
      This host is on the tailnet at {{ tailnet_ipv4 }} and public port 22
      stays open. Choose Lockdown in catena-admin > Settings to close it; the
      host then keeps 22 closed while its tailnet is up and reopens it while
      the tailnet is down.
  when:
    - catena_access_method == 'tailnet'
    - not (catena_lockdown_close_public_ssh | default(false) | bool)

- name: "Lockdown: close public 22 behind the tailnet"
  when:
    - catena_access_method == 'tailnet'
    - catena_lockdown_close_public_ssh | default(false) | bool
  block:
    # ─── Step 4: close the port (step 3 ran before this file) ───────────
    # The same rule bootstrap/roles/common adds (from any to any port 22
    # proto tcp); ufw matches a delete on the rule, not its comment. A rule
    # already gone prints "Could not delete non-existent rule" and exits 0.
    - name: Remove the public SSH allow rule
      ansible.builtin.command:
        argv: [ufw, delete, allow, from, any, to, any, port, "22", proto, tcp]
      register: _public_ssh_removal
      changed_when: "'Rule deleted' in _public_ssh_removal.stdout"

    # Only reload when the delete actually removed something, so a clean rerun
    # reports no change.
    - name: Reload ufw so rule changes take effect
      ansible.builtin.command:
        argv: [ufw, reload]
      changed_when: true
      when: _public_ssh_removal is changed

    # The declaration follows the firewall. bootstrap/roles/common writes this
    # fragment open and refuses to rewrite it; narrowing it is this block's
    # alone, because narrowing it is what makes the reconciler keep 22 closed
    # on every later timer fire -- and doing that without the proof would be
    # the lockout this sequence exists to prevent. The block above widens it
    # again on a host with no tailnet.
    # `private` rather than `tailnet`: the reconciler resolves it from
    # the same declared method, so the client's port document names the path
    # this host actually has. The same reconciler reopens 22 while the tailnet
    # is down, so this declaration never strands a host whose tailnet broke.
    - name: "Lockdown: declare port 22 private now that the tailnet is proven"
      ansible.builtin.copy:
        dest: "{{ public_ports_fragment_dir }}/{{ catena_ssh_fragment_name }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          {{
            [
              {"proto": "tcp", "port": 22, "scope": "private", "bind": "host",
               "owner": "ssh", "comment": "administrative SSH -- never public"}
            ] | to_nice_json
          }}
      register: _ssh_fragment

    # `restarted`, for the reason the open block gives: a joined in-flight run
    # would add back the public rule the delete above removed.
    - name: "Lockdown: reconcile public ports now (declaration changed)"
      ansible.builtin.systemd_service:
        name: catena-public-ports.service
        state: restarted
      changed_when: false
      when: _ssh_fragment.changed

    # ─── Step 5: assert the firewall state ──────────────────────────────
    - name: Capture ufw status for assertion
      ansible.builtin.command: ufw status verbose
      register: ufw_after
      changed_when: false

    - name: Assert public 22 is closed and tailscale0 22 is allowed
      ansible.builtin.assert:
        that:
          - "'22/tcp' not in ufw_after.stdout or 'tailscale0' in ufw_after.stdout"
          - "'tailscale0' in ufw_after.stdout"
        fail_msg: >-
          ufw post-lockdown state unexpected. Inspect: `ufw status verbose`.
          Public 22 may still be open, or tailscale0 rule is missing.
