---
# Baseline host setup and the sshd hardening, run on the server by the
# install's second leg (playbooks/bootstrap.yml) and by every converge.yml.
# Idempotent.

- name: Wait for cloud-init to finish (if present)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false # some base images don't have cloud-init

- name: Set hostname from inventory_hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

# The host resolves its new name from here on; sudo needs it for every task
# that follows. reconcile/roles/host_maintenance applies the same file on
# every converge.
- name: "common: the host resolves its own name"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/host_name_resolution.yml"

# apt's proxy and dpkg lock timeout, before the first apt operation below.
# reconcile/roles/host_maintenance applies the same file on every converge.
- name: "common: apt settings"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/apt_settings.yml"

# apt-cacher-ng (and any operator-supplied APT_PROXY_URL) is a single
# failure point for every downstream apt operation. When it goes flaky
# the apt module's `update_cache_retries` loop returns the unhelpful
# "Failed to update cache after 10 retries: " message (empty stderr,
# because the module folds individual retries into a summary string)
# and every subsequent role that touches apt -- docker install,
# tailscale install, backup install -- cascades. The block-then-rescue
# below: first tries via whatever proxy is configured; on failure,
# captures the real apt-get error for the log, then if a proxy is in
# play drops it, retries direct (slower but always available), and
# restores the proxy file so later apt calls hit the cacher again
# once /var/lib/apt/lists is warm. With no proxy configured, a
# rescue here is a real network failure and we fail loudly with the
# captured stderr instead of the empty module summary.
- name: "Refresh apt cache (with proxy-bypass fallback)"
  block:
    - name: "apt update (honors APT_PROXY_URL if configured)"
      ansible.builtin.apt:
        update_cache: true
        # Skip the refresh if /var/lib/apt/periodic/update-success-stamp
        # is younger than this. An optimisation, not a correctness
        # crutch: it saves a round-trip to every mirror on a converge
        # that just ran. Idempotency is changed_when's job below, not
        # this window's: one hour covers a rerun minutes after the install,
        # but the bench's install_rerun lands HOURS after the install it
        # re-applies, so any window short enough
        # to be an optimisation is too short to carry the claim.
        cache_valid_time: 3600
        # Belt-and-braces: the 05-lock-timeout conf above tells apt
        # itself to wait, the module's own lock_timeout matches so
        # the Ansible wrapper doesn't time out earlier than the
        # underlying apt-get.
        lock_timeout: 300
        # Default is 5 retries with backoff capped at 12s (~27s total).
        # Stretch that to ride out short mirror flakes.
        update_cache_retries: 10
        update_cache_retry_max_delay: 30
      # Refreshing the package index is not a change to this host's
      # configuration -- it is a read of the mirrors. Reporting it as
      # `changed` makes whether the converge is idempotent depend on how
      # long ago the last one ran, and on whether an upstream feed rolled
      # in between. Failures still fail; the rescue below is unaffected.
      changed_when: false
  rescue:
    - name: "apt update failed; capture diagnostic via raw apt-get update"
      ansible.builtin.command:
        cmd: apt-get update
      register: _apt_update_diag
      failed_when: false
      changed_when: false

    - name: "Report first-attempt failure (module's summary is empty)"
      ansible.builtin.debug:
        msg: |
          apt update failed via the apt module (empty error is a known
          retry-loop artifact). Real diagnostic from apt-get update:
            rc={{ _apt_update_diag.rc }}
            stderr={{ _apt_update_diag.stderr | default('') | trim }}
          {% if _apt_update_diag.rc == 0 %}
          That succeeded, so the index IS refreshed and the module failure
          was the retry-loop artifact. Nothing further to do.
          {% elif catena_apt_proxy_url | length > 0 %}
          Retrying without HTTP proxy ({{ catena_apt_proxy_url }}).
          {% endif %}

    # rc == 0 means the diagnostic IS the successful retry: apt-get refreshed
    # the index, so there is no failure left to report or work around. Every
    # task below is therefore gated on rc != 0.
    #
    # Without that gate the rescue aborts the bootstrap while printing its own
    # proof that apt worked -- "Real apt-get error: rc=0, stderr=" -- which is a
    # contradiction on its face. The shape is common: the apt module exhausts
    # its 10 retries against a cold mirror and the raw retry seconds later
    # returns 0. Any client install with no APT_PROXY_URL (the default) can
    # meet such a transient flake, already healed by the time the rescue runs.
    - name: "No proxy to bypass; fail with the real error"
      ansible.builtin.fail:
        msg: |
          apt update failed and no APT_PROXY_URL is configured, so
          there is nothing to bypass. Real apt-get error:
            rc={{ _apt_update_diag.rc }}
            stderr={{ _apt_update_diag.stderr | default('') | trim }}
      when:
        - catena_apt_proxy_url | length == 0
        - _apt_update_diag.rc != 0

    - name: "Temporarily drop proxy conf for direct retry"
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/01proxy
        state: absent
      when: _apt_update_diag.rc != 0

    - name: "apt update (direct, no proxy)"
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300
        update_cache_retries: 5
        update_cache_retry_max_delay: 30
      when: _apt_update_diag.rc != 0

    # Also gated on a proxy actually being configured: with none, this wrote
    # `Acquire::http::Proxy "";` -- re-creating the very file the main path's
    # "Remove apt HTTP proxy (when APT_PROXY_URL is unset)" task deletes, so a
    # converge that entered this rescue stopped being idempotent.
    - name: "Restore proxy conf so subsequent apt calls hit the cacher"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/01proxy
        content: |
          Acquire::http::Proxy "{{ catena_apt_proxy_url }}";
          Acquire::https::Proxy "DIRECT";
        owner: root
        group: root
        mode: "0644"
      when:
        - _apt_update_diag.rc != 0
        - catena_apt_proxy_url | length > 0

- name: Full system upgrade (fresh VPS images ship stale)
  ansible.builtin.apt:
    upgrade: dist
    lock_timeout: 300
  register: _apt_upgrade

- name: Remove packages no longer needed
  ansible.builtin.apt:
    autoremove: true
    purge: true
    lock_timeout: 300
  when: _apt_upgrade.changed

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ catena_baseline_packages }}"
    state: present
    cache_valid_time: 3600
    lock_timeout: 300

# ─── the ops and panel accounts ───────────────────────────────────────────
- name: "common: the ops and panel accounts, with the installer's key"
  ansible.builtin.import_tasks: accounts.yml

# ─── console break-glass password ────────────────────────────────────────
# ops carries password `*` (no usable password) by default, so once SSH is
# key-only the operator has NO way back in if the tailnet path is lost --
# the provider web console (KVM/serial) and an on-prem physical keyboard
# both authenticate against the local TTY via PAM, which needs a real
# password. Set one from admin_password on the persistent ops account.
#
# This is console-ONLY: sshd_hardening.conf.j2 sets
# PasswordAuthentication no, so the password is rejected over SSH and only
# usable at a local console. The mechanism is provider-agnostic (cloud KVM
# or on-prem physical) and does not depend on the provider default user,
# which root-disable + AllowUsers already lock out of SSH.
#
# The password is USER_HELD (helpers/onbox_config.py): minted on-box if absent,
# by the install right after bootstrap (playbooks/show-keyset.yml, which shows
# it once) or by any converge, because a break-glass credential the user does
# not hold a copy of is not one. Only an on-box mint reaches every host: a
# self-hoster runs no ops operator tool, and a host whose password nothing
# mints reaches this task with nothing to set and skips in silence.
#
# Deterministic salt (derived from the secret itself) keeps the sha512 hash
# stable across converges so /etc/shadow does not churn -- update_password:
# always then reports no change on a steady-state run. The guard now covers
# only a store that failed to load, not a store that never minted it.
- name: Set ops console break-glass password (key-only SSH keeps it console-only)
  ansible.builtin.user:
    name: "{{ ops_user }}"
    password: >-
      {{ console_recovery_password
         | password_hash('sha512', salt=(console_recovery_password | hash('sha256'))[:16]) }}
    update_password: always
  no_log: true
  when: console_recovery_password | default('') | length > 0

# ─── prove the replacement path BEFORE closing every other one ───────────
# ORDERING. This role performs the second of the two irreversible access
# handoffs in the product, and both carry a gate:
#
#   ufw_lockdown.yml:  add tailnet rule -> VERIFY -> remove public 22
#   here:              install ops key   -> VERIFY -> deny everything else
#
# The template below turns off password auth, root login, and every account
# except ops in a single write. A non-empty key list proves nothing about
# whether sshd accepts that key for ops, or whether ops is locked in
# /etc/shadow (Debian's `!`, which OpenSSH 9.8+ refuses pubkey auth for -- see
# the ops user task in accounts.yml).
#
# The proof is the install's: ansible/install-host.sh runs this role only in a
# session that logged in as ops with the installer's key, checked against
# sshd's own record of that session (helpers/session_proof.py), and passes
# catena_install_key_proven. Every fallback is still live at that point:
# password auth is on, the provider account still passes AllowUsers, public 22
# is still open.
#
# Bypass with -e skip_ssh_lockout_gate=true (same shape as
# skip_disk_preflight / skip_external_preflight): hardening on an unproven key.
- name: "sshd: refuse to harden -- no session proved that ops opens with its key"
  ansible.builtin.fail:
    msg: |
      Refusing to apply the sshd hardening: nothing proved that {{ ops_user }}
      logs in with the installer's key. The next task disables password auth
      and root login and restricts AllowUsers to
      {{ ssh_allowed_users | join(', ') }}, which without that proof can leave
      this host with no working way in. Nothing has been closed yet.

      Run the install with the installer, which logs in as {{ ops_user }}
      with its key before this leg and proves it on the server.
  when:
    - not (skip_ssh_lockout_gate | default(false) | bool)
    - not (catena_install_key_proven | default(false) | bool)

# ─── sshd hardening ──────────────────────────────────────────────────────
# After this runs, root+password login stops working. The ops user with key
# auth is the only remaining path in, which is why the proof above is
# mandatory -- no WORKING key on ops means locked out.
#
# Every directive we set ships as a drop-in under /etc/ssh/sshd_config.d/,
# which sshd reads ONLY if the main config includes that directory. Debian 12
# and Ubuntu ship the Include, but a provider image or a cloud-init variant
# can replace sshd_config with something minimal that does not -- and then
# every drop-in is inert while the converge still reports success. That
# failure is silent and it fails OPEN: password auth and root login stay
# enabled, and AllowUsers never applies. So the Include is established here
# rather than assumed, before anything is written into the directory.
#
# It is PREPENDED, not appended: sshd takes the first value it sees for most
# keywords, so an Include below a directive the drop-in means to override
# would parse but change nothing.
- name: "sshd: is the drop-in directory included?"
  ansible.builtin.command:
    cmd: "grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\\.d/\\*\\.conf' /etc/ssh/sshd_config"
  register: _sshd_include
  changed_when: false
  failed_when: false

- name: "sshd: include the drop-in directory (first line, so drop-ins win)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    firstmatch: true
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: _sshd_include.rc != 0
  notify: reload sshd

- name: Drop sshd hardening config
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-catena.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sshd

# ─── journald: persistent + sealed audit log ─────────────────────────────
# Community keeps an on-box audit trail of catena-admin actions in journald
# (the Go shell emits structured entries under SYSLOG_IDENTIFIER=catena-admin
# via internal/auditlog). Persistent storage survives reboots; Forward Secure
# Sealing (FSS) makes after-the-fact tampering of the LOCAL journal detectable
# (verify with `journalctl --verify` during an incident). The verification key
# is printed ONCE below -- save it off-box; it is what proves the seal.
# Shipping this journal to a central collector is a Business feature handled
# elsewhere; CE keeps it local and the EE audit panel reads it back.
#
# The sealing KEY is minted here, once, because the install hands its
# verification half to the client (show-keyset.yml). The journald drop-in that
# keeps storage persistent and sealing on is reconcile/roles/host_maintenance's.
#
# Sealing keys live under the persistent journal dir, so it must exist before
# setup-keys can write them. With the directory present, journald's default
# Storage=auto keeps the journal there once the runtime one is flushed.
- name: "journald: ensure persistent journal directory"
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: "journald: read machine-id (FSS key path component)"
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: _journal_machine_id_raw

# journald may still be running volatile here -- on a fresh host nothing has
# restarted it since the directory appeared, and on a restored host the
# directory came back before journald started -- so the per-machine-id journal
# dir may not exist. --setup-keys below writes its sealing key INTO that dir, so
# it must exist first. Create it explicitly (deterministic) and flush the
# runtime journal so journald adopts persistent storage. Both idempotent.
- name: "journald: ensure machine-id journal dir exists (DR target may still be volatile)"
  ansible.builtin.file:
    path: "/var/log/journal/{{ (_journal_machine_id_raw.content | b64decode | trim) }}"
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: "journald: flush runtime journal to persistent storage"
  ansible.builtin.command:
    cmd: journalctl --flush
  changed_when: false

- name: "journald: check whether FSS is already set up"
  ansible.builtin.stat:
    path: "/var/log/journal/{{ (_journal_machine_id_raw.content | b64decode | trim) }}/fss"
  register: _journal_fss

# Generate the sealing key exactly once. Re-running --setup-keys would rotate
# the FSPRG seed and invalidate the verification key the operator saved, so it
# is guarded on the fss file's absence. --setup-keys writes the sealing key to
# the journal dir and prints the verification key to stdout.
- name: "journald: set up Forward Secure Sealing (once)"
  ansible.builtin.command:
    cmd: journalctl --setup-keys
  register: _journal_setup_keys
  changed_when: true
  when: not _journal_fss.stat.exists

- name: "journald: SAVE THE FSS VERIFICATION KEY (shown once)"
  ansible.builtin.debug:
    msg: >-
      {{ _journal_setup_keys.stdout_lines
         + ['',
            'SAVE the verification key above off-box (password manager).',
            'It proves the local journal was not tampered with:',
            '  journalctl --verify'] }}
  when: _journal_setup_keys is not skipped

# Hand the key to the keyset display the install runs right after bootstrap,
# then have that display DELETE it. Printing it here alone loses it: it scrolls
# past among hundreds of install tasks and nothing shows it again, so in
# practice nobody saved it and the seal was unverifiable -- a guarantee nobody
# can check is not one.
#
# It is deliberately NOT written to the on-box config store like the other
# user-held secrets. The verification key is the FSPRG seed: whoever holds it
# can regenerate the sealing key for any past epoch and re-seal an ALTERED
# journal. Leaving it on the box would hand a root-level attacker the tool that
# defeats the tamper evidence they just tripped. It lives here for the minutes
# between minting and display, 0600 root, and show-keyset.yml removes it.
- name: "journald: stage the FSS verification key for the one-shot keyset display"
  when: _journal_setup_keys is not skipped
  block:
    - name: "journald: ensure the catena config dir exists"
      ansible.builtin.file:
        path: /etc/catena
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "journald: write the FSS verification key for hand-off"
      ansible.builtin.copy:
        dest: /etc/catena/fss-verification-key.pending
        content: "{{ _journal_setup_keys.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

# ─── ufw baseline ────────────────────────────────────────────────────────
# Public SSH is allowed, and stays allowed after the install. On a host whose
# access method is `tailnet`, the panel's Lockdown (playbooks/lockdown.yml)
# swaps this rule for "allow 22 on tailscale0 only" and closes public 22 -- but
# only after it has PROVEN the tailnet path. On a `public_ssh` host it stays,
# because there is no other path to prove.
#
# The ufw CLI, in the argv style ufw_lockdown.yml uses. `ufw default`
# reports a change whether or not it made one, so the defaults and the
# switch-on run only when `ufw status verbose` shows them missing. An inactive
# ufw prints its status line alone, so a first run sets all three.
- name: "ufw: read the current state"
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: _ufw_state
  changed_when: false

- name: Set ufw default deny incoming
  ansible.builtin.command:
    argv: [ufw, default, deny, incoming]
  changed_when: true
  when: "'deny (incoming)' not in _ufw_state.stdout"

- name: Set ufw default allow outgoing
  ansible.builtin.command:
    argv: [ufw, default, allow, outgoing]
  changed_when: true
  when: "'allow (outgoing)' not in _ufw_state.stdout"

# Detect whether tailscale0 is up. On first boot it is not, and the public SSH
# rule is the only way in. On a tailnet host where it is up, the rule the
# install added stays until the panel's Lockdown removes it, and adding it back
# on every converge would undo that Lockdown. The port reconciler reopens 22 by
# itself while the tailnet is down.
- name: "ufw bootstrap: probe tailscale0 to decide if public SSH is still needed"
  ansible.builtin.command: ip link show tailscale0
  register: _ufw_tailscale_iface
  changed_when: false
  failed_when: false

# ufw skips a rule it already has ("Skipping adding existing rule"). A rule it
# adds while inactive prints "Rules updated" rather than "Rule added".
- name: Allow public SSH (bootstrap, and permanently on a host with no tailnet)
  ansible.builtin.command:
    argv: [ufw, allow, from, any, to, any, port, "22", proto, tcp,
           comment, "{{ catena_ssh_ufw_comment }}"]
  register: _ufw_public_ssh
  changed_when: >-
    'Rule added' in _ufw_public_ssh.stdout
    or 'Rule updated' in _ufw_public_ssh.stdout
    or 'Rules updated' in _ufw_public_ssh.stdout
  when: >-
    _ufw_tailscale_iface.rc != 0
    or catena_access_method != 'tailnet'

- name: Enable ufw
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  changed_when: true
  when: "'Status: active' not in _ufw_state.stdout"

# ─── port 22 in the public-port registry ─────────────────────────────────
# Without a declaration, a host that keeps 22 open FAILS validation: the
# external scan's expectation is derived from the registry's scope=any ports,
# and a port nothing declares reads as an unexpected open one -- "SECURITY
# REGRESSION" for the posture the client chose.
#
# WRITTEN ONCE, AND ONLY WIDENED HERE. `force: false` is load-bearing: this
# task runs on every converge, and rewriting the fragment to `any` on a host
# whose lockdown already closed 22 would have the reconciler re-open it on the
# next timer fire. The only writer that may NARROW it is
# tasks/ufw_lockdown.yml, which does so after proving the alternative path.
- name: "ufw: public-port fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "ufw: declare port 22 as open (first converge only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/{{ catena_ssh_fragment_name }}"
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      {{
        [
          {"proto": "tcp", "port": 22, "scope": "any", "bind": "host",
           "owner": "ssh", "comment": "administrative SSH"}
        ] | to_nice_json
      }}

# ─── State directories ──────────────────────────────────────────────────
- name: "/etc/catena exists"
  ansible.builtin.file:
    path: /etc/catena
    state: directory
    owner: root
    group: root
    mode: "0755"

# /var/lib/catena is the catena VAR-state dir (restore markers, the
# backup stats dir, the keycloak-realm SMTP-bootstrap marker, ...).
# Several roles WRITE under it before the backup role runs near the end of
# the converge. On a two-pass
# fresh install the pass-1 backup happens to create it for pass-2's
# keycloak, but a single-pass converge (key already in the on-box store)
# runs keycloak's realm marker touch with no dir yet and fails with ENOENT.
# Create it here in common (first role) so every later writer can rely on
# it regardless of role order.
- name: "/var/lib/catena exists"
  ansible.builtin.file:
    path: /var/lib/catena
    state: directory
    owner: root
    group: root
    mode: "0755"

# ─── The public address, for the converge the host runs itself ──────────
# Only the operator's inventory knows it. Recorded where fact gathering reads
# it, so playbooks/group_vars/all/main.yml resolves public_ip to this value on
# the host's own converge too.
- name: "common: facts directory exists"
  ansible.builtin.file:
    path: "{{ catena_host_facts_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "common: record the public address the operator gave this host"
  ansible.builtin.copy:
    dest: "{{ catena_host_facts_path }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ {'public_ip': public_ip} | to_nice_json }}\n"
  when: public_ip | default('') | length > 0
