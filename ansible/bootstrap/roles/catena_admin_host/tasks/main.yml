---
# Host-side state for catena-admin that only the install writes: the runner
# account the panel's dispatch signs in as, the SSH keypair the Go shell
# container dispatches with and the host key it trusts, the migration account,
# and the bind-mount sources the panel's service needs. A dedicated per-service
# runner account makes attribution unambiguous: any command through it is
# sourced from the admin container, never anything else.
#
# Past the sign-in (sshd's AcceptEnv for the runner, the forced command on the
# panel key's line, the sudo rule, the dispatcher) everything belongs to
# reconcile/roles/dispatch_path, which runs right after this role.

- name: "Runner: ensure system account exists ({{ catena_admin_runner_user }})"
  ansible.builtin.user:
    name: "{{ catena_admin_runner_user }}"
    system: true
    shell: /bin/bash
    home: "{{ catena_admin_runner_home }}"
    create_home: true
    # useradd --system leaves the shadow password as `!` (locked); sshd
    # then rejects key auth with "User ... not allowed because account
    # is locked" (the PAM `account` stack treats !-prefixed entries as
    # locked, independent of PubkeyAuthentication). `*` means "no valid
    # password" without locking the account, which is what we want for
    # a key-only forced-command runner.
    password: "*"
    state: present

# The runner owns its home, so ~/.ssh can be a link it planted. follow: false
# makes the module see the link itself and fail, where following it would
# chown and chmod whatever the link names as root.
- name: "Runner: ~/.ssh directory"
  ansible.builtin.file:
    path: "{{ catena_admin_runner_home }}/.ssh"
    state: directory
    follow: false
    owner: "{{ catena_admin_runner_user }}"
    group: "{{ catena_admin_runner_user }}"
    mode: "0700"

- name: "Runner: /etc/catena config dir"
  ansible.builtin.file:
    path: /etc/catena
    state: directory
    owner: root
    group: root
    mode: "0755"

# onbox_config.py and catena-restic-key.py arrive with the payload, not from
# here. The settings and backup-password dispatch actions that run them ship in
# the panel image's dispatch drop-in, and an image must not authorise a command
# it does not ship -- so the image build copies both scripts out of the vendored
# catena-ce tree into the payload's own bin, and reconcile/roles/payload installs
# them with the rest of the engines.
#
# They are still THIS repo's files. Delivery follows the rule the engines
# already follow: whoever runs a command ships it.

# --- The migration account --------------------------------------------
# What a server taking this one over signs in as. Its only key is the open
# migration window's: the migration lane (catena-admin
# payload/engines/migratelane) writes {{ catena_migrate_grant_file }} while a
# window is open and removes it when the window closes, so with no window no
# key opens the account. Its only command is the pipe to the lane's socket.
#
# /bin/sh rather than nologin: sshd runs ForceCommand through the account's
# login shell (`<shell> -c <command>`), and nologin refuses every command.
# Password `*` for the reason the runner account's task gives.
- name: "Migration: system account ({{ catena_migrate_user }})"
  ansible.builtin.user:
    name: "{{ catena_migrate_user }}"
    system: true
    shell: /bin/sh
    home: "{{ catena_migrate_home }}"
    create_home: false
    password: "*"
    state: present

- name: "Migration: the account's home, root-owned ({{ catena_migrate_home }})"
  ansible.builtin.file:
    path: "{{ catena_migrate_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A Match block's keywords override the global config for the account.
# AuthorizedKeysFile is absolute, so no file under the home is read, and
# AuthorizedKeysCommand none keeps a key command a provider image configures
# from vouching for the account. The client-alive pair keeps a call that runs
# for hours open through a NAT's idle timer and drops a dead peer after two
# minutes.
- name: "sshd: the migration account's rules"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/31-catena-migrate.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      # The account a server taking this one over signs in as. Its only key
      # is the open migration window's and its only command is the pipe to
      # the migration lane's socket.
      Match User {{ catena_migrate_user }}
          AuthorizedKeysFile {{ catena_migrate_grant_file }}
          AuthorizedKeysCommand none
          ForceCommand {{ catena_migrate_connect }}
          PermitTTY no
          AllowTcpForwarding no
          AllowStreamLocalForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
          PermitUserRC no
          ClientAliveInterval 30
          ClientAliveCountMax 4
      Match all
  notify: reload sshd

# The whole config, drop-ins included, so a rule sshd would refuse fails the
# run here, before the reload, while the config sshd last loaded still serves.
- name: "sshd: the config parses (sshd -t)"
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false

# --- SSH keypair for the catena-admin container ----------------------
# Generated on the VPS so the private key never leaves the host. We
# bind-mount the dir read-only into the admin container; the container
# uses the key to SSH back to this host (host.docker.internal) as the runner
# user. reconcile/roles/dispatch_path pins the key's authorized_keys line to
# the running generation's forced command.

- name: "SSH dir on host ({{ catena_admin_host_ssh_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_host_ssh_dir }}"
    state: directory
    # The container runs as the distroless nonroot user
    # ({{ catena_admin_container_uid }}); this 0700 dir + the files in it
    # are mounted read-only and must be owned by that uid or the Go shell's
    # SSH runner cannot read them (EACCES on every action dispatch).
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0700"
    follow: false

# Generated once and never replaced: `creates` skips ssh-keygen whenever the
# private key exists.
- name: "SSH dir: generate ed25519 keypair if missing"
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "",
           -f, "{{ catena_admin_host_ssh_dir }}/id_ed25519"]
    creates: "{{ catena_admin_host_ssh_dir }}/id_ed25519"

- name: "SSH dir: keypair owned by the container user"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0600"
    follow: false
  loop:
    - "{{ catena_admin_host_ssh_dir }}/id_ed25519"
    - "{{ catena_admin_host_ssh_dir }}/id_ed25519.pub"

# SCANNED OVER LOOPBACK, not over ansible_host. This task runs ON the box, so
# 127.0.0.1 addresses the very sshd whose key is wanted, and reading it needs
# no route to anywhere.
#
# The address matters even though the key does not change with it. ansible_host
# flips public-IP <-> tailnet-IP across converges and differs again after a
# cross-host restore, and ssh-keyscan exits 0 with EMPTY stdout when it cannot
# reach what it is given: an address the box cannot dial writes an empty
# known_hosts with no error anywhere, and every panel action then dies on host
# key verification with nothing naming the cause. The alias filter below keeps
# the recorded CONTENT stable whichever address the scan used.
- name: "SSH dir: scan this host's own key over loopback"
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -t
      - ed25519
      - 127.0.0.1
  register: _catena_admin_keyscan
  changed_when: false
  # ssh-keyscan reports failure on stderr and still exits 0. An empty result
  # here means the next task writes an empty known_hosts, so it is a hard stop
  # rather than a file to discover later from a failed dispatch.
  failed_when: (_catena_admin_keyscan.stdout | default('') | trim | length) == 0

- name: "SSH dir: write known_hosts"
  ansible.builtin.copy:
    dest: "{{ catena_admin_host_ssh_dir }}/known_hosts"
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0644"
    follow: false
    # ssh-keyscan emits "HOST keytype keydata"; the SSH client matches the
    # connection hostname against the first field literally. From inside the
    # container, the Go shell's SSH runner ONLY ever connects to
    # host.docker.internal (resolved via the extra_hosts host-gateway mapping
    # in the admin compose), so the scanned HOST is never matched against. The
    # `keyscan_alias` filter (Python; see playbooks/filter_plugins/
    # keyscan_alias.py) with replace=true REPLACES it with the constant alias,
    # emitting "host.docker.internal keytype keydata" -- no functional loss --
    # in Python, clear of the YAML folded-scalar + Jinja string-literal layers
    # that drop a regex_replace backreference.
    #
    # The alias is what makes the CONTENT constant; scanning over loopback
    # above is what makes the SCAN constant. Both are needed: the filter cannot
    # rescue a scan that returned nothing.
    content: "{{ _catena_admin_keyscan.stdout_lines | keyscan_alias('host.docker.internal', replace=true) }}"

- name: "SSH dir: ssh client config (StrictHostKeyChecking yes)"
  ansible.builtin.template:
    src: admin-ssh-config.j2
    dest: "{{ catena_admin_host_ssh_dir }}/config"
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0644"
    follow: false

# --- Bind-mount targets the admin container expects -----------------
# {{ catena_admin_stats_dir }} hosts the JSON reports the payload lanes
# write and the panel reads.
# The backup role's install task creates this dir; we mirror
# `state: directory` here as belt-and-braces in case catena-admin runs
# on a host where backup is somehow disabled.
- name: "Stats dir for admin gauges ({{ catena_admin_stats_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_stats_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Admin state volume: the shell's own writable state, bind-mounted rw. The
# audit hash chain and its per-host signing key live here, which is why the
# ownership matters -- it must be the CONTAINER's uid (65532, from USER
# nonroot in the image). The distroless image runs as that uid and nothing
# else, so a directory owned by any other uid is one the shell cannot write,
# and every audit append degrades silently.
- name: "State dir for admin container ({{ catena_admin_state_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_state_dir }}"
    state: directory
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0700"
    follow: false

# The panel bind-mounts this read-only for the /recovery tab, and swarm
# REJECTS a task whose bind source is missing rather than creating it. Its
# contents belong to reconcile/roles/backup, which runs LATER in the converge,
# so without this task a first converge has no directory when the panel's
# service starts and swarm rejects every task it places, forever, under
# --restart-condition=any. Creating it here is not taking ownership of it:
# attributes come from bootstrap/roles/common so both tasks say the same thing,
# and reconcile/roles/backup's own create still runs.
- name: "Recovery export dir for the admin container ({{ catena_export_dir }})"
  ansible.builtin.file:
    path: "{{ catena_export_dir }}"
    state: directory
    owner: root
    group: "{{ catena_export_dir_group }}"
    mode: "{{ catena_export_dir_mode }}"

- name: Catena-admin host setup summary
  ansible.builtin.debug:
    msg: |
      catena-admin host setup:
        hostname:        {{ catena_admin_hostname }}
        runner user:     {{ catena_admin_runner_user }} ({{ catena_admin_runner_home }})
        ssh keys (host): {{ catena_admin_host_ssh_dir }}/
        stats dir:       {{ catena_admin_stats_dir }}
        state dir:       {{ catena_admin_state_dir }}
        default theme:   {{ catena_admin_default_theme }}
