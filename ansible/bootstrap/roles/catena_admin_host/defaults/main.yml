---
# The host-side half of the catena-admin role that only the install writes:
# the runner account, the panel's SSH keypair and the host key it trusts, the
# migration account.
#
# Everything here is read by tasks/main.yml or by one of its templates and
# by nothing else. The handful of values BOTH halves need -- the panel's
# hostname, its UI port, its state and stats dirs, its default theme, the
# runner account and the panel's SSH dir -- are in
# playbooks/group_vars/all/main.yml instead: this role runs before
# reconcile/roles/dispatch_path and reconcile/roles/catena-admin, so a value
# left in their defaults would not resolve here.

# --- The migration account ---------------------------------------------
# The home of catena_migrate_user (playbooks/group_vars/all/main.yml). Root's
# and empty: sshd reads the account's key from an absolute path elsewhere, and
# the account writes nowhere. Outside reconcile/roles/backup's
# backup_product_paths, since it holds nothing to restore.
catena_migrate_home: "/var/lib/catena-migrate"

# The catena-admin container runs as the distroless `nonroot` user
# (uid/gid 65532), set by `USER nonroot:nonroot` in the repo-root Dockerfile
# -- NOT uid 1000. Host-side files the container reads through its read-only
# bind mounts (the SSH runner private key, known_hosts, ssh config) must be
# owned by this uid, and the 0700 ssh dir must be owned by it, or the Go
# shell's SSH action runner fails every dispatch with
# "known_hosts load failed: ... permission denied". Keep in lockstep with
# the Dockerfile's USER.
catena_admin_container_uid: "{{ catena_container_uid }}"
catena_admin_container_gid: "{{ catena_container_gid }}"
