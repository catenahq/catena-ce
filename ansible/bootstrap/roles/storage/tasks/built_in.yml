---
# The data prefix: a parent directory on the disk the host already has, and the
# subdirectories under it. No filesystem, no fstab, no mount.
#
# The data and the OS share a disk, so a filesystem-level failure takes both.
# Restic is the mitigation, and it is the one that works across the failures a
# second disk does not cover -- the provider losing the instance, a delete, a
# ransom. A client who wants a separate disk mounts one and declares its path
# for backup; the product does not manage it.

- name: Ensure the data prefix exists
  ansible.builtin.file:
    path: "{{ storage_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure data subdirectories exist with correct ownership
  ansible.builtin.file:
    path: "{{ storage_mount_point }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ storage_data_subdirs }}"
  loop_control:
    label: "{{ item.name }}"
