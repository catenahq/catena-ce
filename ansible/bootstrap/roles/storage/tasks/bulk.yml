---
# Optional secondary tier -- CIFS or NFS share mounted alongside the primary
# storage. Intended for append-heavy, latency-tolerant data (media archives,
# cold backup staging). DO NOT put databases, Docker data-root, or anything
# latency-sensitive here -- network shares stall on link blips.
#
# Safety-critical mount options: _netdev,nofail. Without both of these a
# missing or unreachable share at boot will hang systemd indefinitely, turning
# a degraded-network incident into an unbootable-host incident.

- name: Assert bulk remote is set
  ansible.builtin.assert:
    that:
      - storage_bulk_remote | length > 0
      - storage_bulk_type in ['cifs', 'nfs']
    fail_msg: >-
      storage_bulk_enabled=true but storage_bulk_remote is empty or
      storage_bulk_type is not cifs|nfs. Fix STORAGE_BULK_* in inventory/<name>/.env.

- name: Install filesystem client package
  ansible.builtin.apt:
    name: "{{ 'cifs-utils' if storage_bulk_type == 'cifs' else 'nfs-common' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure bulk mount point exists
  ansible.builtin.file:
    path: "{{ storage_bulk_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# CIFS needs a credentials file; NFS does not (auth by source IP / sec=sys).
- name: Configure CIFS credentials
  when: storage_bulk_type == 'cifs'
  block:
    - name: Assert CIFS credentials are supplied
      ansible.builtin.assert:
        that:
          - storage_bulk_username is defined
          - storage_bulk_password is defined
        fail_msg: >-
          storage_bulk_type=cifs but storage_bulk_username /
          storage_bulk_password are not set. They are client-held
          credentials: enter them in catena-admin > Settings.

    - name: Ensure credentials directory exists
      ansible.builtin.file:
        path: /etc/catena
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write CIFS credentials file (root-only)
      ansible.builtin.copy:
        dest: /etc/catena/bulk.cifs
        content: |
          username={{ storage_bulk_username }}
          password={{ storage_bulk_password }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

- name: Compute effective bulk mount options
  ansible.builtin.set_fact:
    _storage_bulk_effective_opts: >-
      {%- if storage_bulk_mount_options | length > 0 -%}
        {{ storage_bulk_mount_options }}
      {%- elif storage_bulk_type == 'cifs' -%}
        _netdev,nofail,credentials=/etc/catena/bulk.cifs,uid={{ ops_user }},gid={{ ops_user }},file_mode=0640,dir_mode=0750,iocharset=utf8
      {%- else -%}
        _netdev,nofail,soft,timeo=50,retrans=2
      {%- endif -%}

# fstab first, then the mount. A run that stops between the two leaves an
# entry the next boot mounts, and the default options' nofail,_netdev keep a
# share that is unreachable then from holding the boot. The entry is matched
# on its mount point, so changed options or a changed remote replace it; a
# mounted share whose entry changed is unmounted and mounted again so the new
# entry is the one in effect.
- name: Persist bulk share in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^[^#\s]\S*\s+{{ storage_bulk_mount_point | regex_escape }}\s'
    line: >-
      {{ storage_bulk_remote }} {{ storage_bulk_mount_point }}
      {{ storage_bulk_type }} {{ _storage_bulk_effective_opts }} 0 0
  register: _storage_bulk_fstab

- name: Is the bulk share mounted?
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ storage_bulk_mount_point }}"]
  register: _storage_bulk_findmnt
  changed_when: false
  failed_when: _storage_bulk_findmnt.rc not in [0, 1]

- name: Unmount bulk share so its changed fstab entry applies
  ansible.builtin.command:
    argv: [umount, "{{ storage_bulk_mount_point }}"]
  changed_when: true
  when:
    - _storage_bulk_findmnt.rc == 0
    - _storage_bulk_fstab is changed

- name: Mount bulk share
  ansible.builtin.command:
    argv: [mount, "{{ storage_bulk_mount_point }}"]
  changed_when: true
  when: _storage_bulk_findmnt.rc != 0 or _storage_bulk_fstab is changed
