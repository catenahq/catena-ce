---
# The product's data prefix, plus an independent optional bulk tier.
#
# ONE PRIMARY TIER. Catena carves its prefix out of the disk the host already
# has and does not manage block devices: a client who needs more space mounts a
# disk themselves, bind-mounts it into the app, and declares the path for
# backup (backup_extra_paths). Managing the mount ourselves meant a mode switch
# on a live host could mount a device OVER a populated directory and hide every
# volume under it, with nothing detecting that the data was still on the disk
# below.

- name: Set up the data prefix
  ansible.builtin.include_tasks: built_in.yml

- name: Set up optional bulk tier
  ansible.builtin.include_tasks: bulk.yml
  when: storage_bulk_enabled | bool
