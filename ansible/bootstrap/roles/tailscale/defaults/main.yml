---
# tailscale_hostname, tailscale_tags and tailscale_accept_dns are declared in
# playbooks/group_vars/all/main.yml, which loads on every path this role runs
# on and outranks role defaults. tailscale_tags reads the store's
# TAILSCALE_TAGS with no default, so a missing value fails the join.
tailscale_force_reauth: false

# True when the play runs on the host itself (the panel's lockdown, through
# catena-converge's local-connection inventory). A probe of the tailnet address
# from "where the play is driven from" then dials the host's own address, so
# tasks/reachable.yml requires a peer instead.
tailscale_on_host: "{{ (ansible_connection | default('ssh')) == 'local' }}"

# Ephemeral nodes auto-evict from the tailnet shortly after `tailscale logout`
# (or when the daemon stops). False keeps the node identity across reboots.
tailscale_ephemeral: false

# Debian codename-aware repo path.
tailscale_apt_codename: "{{ ansible_facts['distribution_release'] }}"
tailscale_apt_keyring_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_apt_codename }}.noarmor.gpg"
tailscale_apt_source_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_apt_codename }}.tailscale-keyring.list"

# API endpoints (the OAuth mint runs where the play is driven from: the host
# itself from the panel's lockdown, the controller when rotate-tailscale.yml
# runs from one).
tailscale_api_base: "https://api.tailscale.com/api/v2"
tailscale_auth_key_ttl_seconds: 600 # 10 minutes -- plenty for one `tailscale up`

# --- Control server: Tailscale SaaS (default) or self-hosted Headscale ---
# tailnet_provider is the whole routing decision. `tailscale` mints a tagged
# auth key per join from the OAuth client above; `headscale` joins a
# self-hosted control server with a pre-auth key -- minted per join via the
# Headscale API (headscale_api_key, preferred: no long-lived key on the VPS) or
# a static key the operator supplies (headscale_preauth_key, fallback).
#
# All three values are store-owned (catena-admin > Settings). The provider is
# always stored -- helpers/onbox_config.py settles it on every load -- and this
# role only runs when it names one (catena_access_method == 'tailnet').
#
# tailnet_headscale_user names the Headscale user the minted key belongs to
# (Headscale pre-auth keys are per-user). tag:vps must be in that user's ACL
# tagOwners for --advertise-tags to succeed.
tailnet_control_url: "{{ cfg_tailnet_control_url | default('') }}"
tailnet_headscale_user: "{{ cfg_headscale_user | default('') }}"
tailnet_provider: "{{ cfg_tailnet_provider | default('none', true) | trim | lower }}"
