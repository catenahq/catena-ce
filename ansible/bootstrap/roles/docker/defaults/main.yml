---
# Where Docker stores containers/images/volumes. Points at the storage role's
# /srv/catena/docker subdir so container layers + named volumes live on the
# block volume (attached mode) or the pre-carved dir (built_in mode), not on
# the root filesystem where they'd eat into the OS disk.
docker_data_root: "{{ storage_mount_point }}/docker"

# json-file log driver with rotation. Prevents a misbehaving container from
# filling the disk with stdout. These values apply globally; per-container
# overrides are still possible via compose.
docker_log_max_size: "50m"
docker_log_max_files: 5

# live-restore lets dockerd restart without killing running containers.
# HOWEVER: it is incompatible with Docker Swarm mode, which the catena
# control plane requires (catena-traefik, catena-postgres, catena-portainer
# all run as swarm services). live-restore must be false; swarm's own
# orchestrator handles container lifecycle across daemon restarts instead.
docker_live_restore: false

# Docker Swarm advertise address: the address the installer reaches the host
# at (public_ip, the installer's HOST_PUBLIC_IP), recorded in the swarm raft at
# init. This role inits a single-node swarm that the reverse-proxy +
# control-plane roles deploy their services onto, and reconcile/roles/swarm
# configures.
docker_swarm_advertise_addr: "{{ public_ip }}"

# Seconds a single systemctl call against docker.service may take before the
# converge gives up on it.
#
# docker.service is Type=notify with TimeoutStartSec=0, so systemd waits for
# dockerd's READY=1 with NO bound of its own: against a wedged daemon
# `systemctl restart docker` blocks for as long as the converge is willing to
# wait -- forever, without this cap. Every other docker call on this path is
# already bounded (the API probe wraps `docker info` in `timeout 10`); the
# systemctl calls that bring the daemon up are the one pair this bounds, and
# they run BEFORE the probe, so the probe's own bound could never be reached.
#
# 120s is well clear of a healthy restart (seconds, and live-restore is off so
# nothing is being handed over) while still failing the task rather than
# hanging the run. `timeout` kills the systemctl CLIENT; the systemd job keeps
# running, which is what we want -- the point is to bound the converge, not to
# cancel the restart.
docker_daemon_control_timeout: 120

# Codename-aware apt repo. Matches the pattern used by bootstrap/roles/tailscale/.
docker_apt_codename: "{{ ansible_facts['distribution_release'] }}"
docker_apt_key_url: "https://download.docker.com/linux/debian/gpg"
docker_apt_repo: "deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/debian {{ docker_apt_codename }} stable"

# The container engine this release installs, and the containerd.io it runs
# on, as upstream versions in Docker's apt repository. A first install gets
# exactly these and holds them, so neither an operator converge's dist-upgrade
# nor unattended-upgrades moves them. An installed engine moves only through
# catena-admin's catena-engine-upgrade, which reads these two keys from the
# reconcile tree the panel image carries. Renovate (renovate.json) proposes a
# bump 14 days after a release.
docker_version: "29.8.1"
docker_containerd_version: "2.3.5"

# How Docker's repository names those versions for this host's Debian release.
# catena-admin's catena-engine-upgrade builds the same strings.
docker_apt_version_suffix: "-1~debian.{{ ansible_facts['distribution_major_version'] }}~{{ docker_apt_codename }}"
docker_engine_packages:
  - "docker-ce=5:{{ docker_version }}{{ docker_apt_version_suffix }}"
  - "docker-ce-cli=5:{{ docker_version }}{{ docker_apt_version_suffix }}"
  - "containerd.io={{ docker_containerd_version }}{{ docker_apt_version_suffix }}"

# The CLI plugins, at whatever version the repository offers: they do not run
# the containers.
docker_plugin_packages:
  - docker-buildx-plugin
  - docker-compose-plugin

# Optional pull-through Docker Hub mirror. Empty string = no mirror
# (direct docker.io pulls). Set to the mirror base URL
# (e.g. http://10.72.185.1:5000) to route registry-mirrors entries
# through it. The test bench sets this via its DOCKER_REGISTRY_MIRROR_URL
# dotenv key so VMs cache docker.io pulls on the host. The matching
# insecure-registries entry (plain host:port, no scheme) is derived
# automatically when the URL is http:// (lab use); https:// mirrors
# need no insecure-registries listing.
docker_registry_mirror_url: "{{ cfg_docker_registry_mirror_url | default('') }}"
