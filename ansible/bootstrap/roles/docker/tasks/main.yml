---
# Install Docker CE from the official apt repo (NOT distro's docker.io, which
# lags upstream by months-to-years and occasionally ships broken containerd
# combos).
#
# Order matters here: we write /etc/docker/daemon.json BEFORE installing the
# packages, so dockerd's very first start already uses the custom data-root.
# If we installed first, dockerd would auto-start with /var/lib/docker,
# populate it with some base state, then need a restart to pick up the new
# data-root -- leaving orphan cruft behind on the root FS.

# ─── apt repo ────────────────────────────────────────────────────────────
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Install Docker apt source list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "{{ docker_apt_repo }}\n"
    owner: root
    group: root
    mode: "0644"
  register: docker_source

# Probe whether docker-ce is already indexed. The source-list task above
# is `ok` (not changed) on a DR restore where restic brought back the
# same docker.list from the backup; the apt cache on the fresh testvm-c
# was populated by cloud-init BEFORE that file landed, so docker-ce is
# absent from /var/lib/apt/lists. Without this probe the next task's
# `when: docker_source.changed` skips, and `Install Docker CE` fails
# with "No package matching docker-ce".
- name: Check whether docker-ce is in the apt index
  ansible.builtin.command:
    cmd: apt-cache madison docker-ce
  register: _docker_apt_indexed
  changed_when: false
  failed_when: false

- name: Update apt cache if Docker source changed or docker-ce not indexed
  ansible.builtin.apt:
    update_cache: true
  when: docker_source.changed or (_docker_apt_indexed.stdout | default('') | trim | length == 0)

# ─── daemon.json BEFORE first install ────────────────────────────────────
- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop /etc/docker/daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ _docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    # Base daemon config every install gets.
    _docker_daemon_base:
      data-root: "{{ docker_data_root }}"
      log-driver: "json-file"
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_files | string }}"
      live-restore: "{{ docker_live_restore | bool }}"
    # When a pull-through mirror URL is configured, add registry-mirrors
    # plus (for http:// mirrors) the matching insecure-registries entry.
    # Splits the scheme off the URL because insecure-registries takes
    # plain host:port -- feeding it the full http:// URL silently does
    # nothing and the daemon falls through to direct docker.io pulls, with
    # the test bench's mirror sitting unused. This task rewrites the whole
    # daemon.json, cloud-init's copy included, so a mirror survives only by
    # being rebuilt correctly here.
    _docker_mirror_host: "{{ docker_registry_mirror_url | regex_replace('^https?://', '') }}"
    _docker_mirror_extras:
      registry-mirrors:
        - "{{ docker_registry_mirror_url }}"
      insecure-registries: "{{ [_docker_mirror_host] if docker_registry_mirror_url.startswith('http://') else [] }}"
    _docker_daemon_config: "{{ _docker_daemon_base | combine(_docker_mirror_extras if docker_registry_mirror_url else {}) }}"
  notify: restart docker

# ─── install packages ────────────────────────────────────────────────────
- name: Install Docker CE + compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Verify docker binary exists on disk (guard against phantom-installed dpkg state)"
  # If /var/lib/dpkg says docker-ce is installed but /usr/bin/docker is
  # missing, apt's idempotent install is a no-op and the failure only
  # surfaces two roles later when something tries to run `docker`.
  # Force a --reinstall when the binary is absent. This catches the
  # class of bug where dpkg DB was restored without the package files
  # (e.g. the restore.yml -> site.yml flow before commit that excluded
  # /var/lib/dpkg from the full-host restore).
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _docker_bin

# Phantom-installed dpkg state recovery (DR convergence after restic
# restore). When /var/lib/dpkg says docker-ce + friends are installed
# but /usr/bin/docker is missing, plain `apt-get install --reinstall`
# can fail under "Packages were downgraded and -y was used without
# --allow-downgrades" if the catalog version on the host's apt index
# differs from the dpkg-recorded version (e.g. an installer
# pinned to a different docker-ce version). Purge the stale dpkg
# records with --force-all, then re-install cleanly via the apt
# module.
#
# --force-all skips dependency checks (the docker-ce-rootless-extras
# / containerd.io / docker-buildx-plugin chain depends on each other
# and can't be purged in isolation under default policy). Purging
# stale records doesn't touch on-disk binaries (there are none --
# that's the precondition), only the dpkg DB.
- name: "Purge stale docker dpkg state (DR phantom-installed recovery)"
  ansible.builtin.command:
    argv:
      - dpkg
      - --purge
      - --force-all
      - "{{ item }}"
  loop:
    - docker-ce
    - docker-ce-cli
    - docker-ce-rootless-extras
    - docker-buildx-plugin
    - docker-compose-plugin
    - docker-model-plugin
    - containerd.io
  failed_when: false
  changed_when: true
  when: not _docker_bin.stat.exists

- name: "Reinstall docker packages cleanly after purge"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  when: not _docker_bin.stat.exists

- name: Ensure docker.service is enabled and running
  ansible.builtin.command:
    # Bounded for the same reason as the `restart docker` handler: `--now` on
    # an inactive docker.service waits for dockerd's READY=1, and
    # TimeoutStartSec=0 means systemd never gives up. See
    # docker_daemon_control_timeout.
    cmd: "timeout {{ docker_daemon_control_timeout }} systemctl enable --now docker"
  changed_when: false

# Flush the `restart docker` handler NOW, before any app role deploys a
# container onto the daemon. Ansible runs handlers at play-end by default;
# on a fresh install daemon.json changes above (the "Drop
# /etc/docker/daemon.json" task) and the deferred restart would then fire
# AFTER traefik/postgres/portainer/keycloak/oauth2-proxy/infrastructure are
# already up. live-restore keeps most containers alive across the restart,
# but a docker restart re-materializes the catena-network swarm overlay
# with a NEW id; swarm SERVICES (catena-postgres, catena-portainer)
# reconnect on their own, while the PLAIN containers the Portainer stacks
# deploy (keycloak-server-1, oauth2-proxy, gatus, ...) come back with
# "network catena-network not found" and stay Exited, which surfaced as
# reconcile/roles/keycloak validate finding keycloak-server-1 dead. Those are healed
# out-of-band by catena-network-nudge (installed by reconcile/roles/traefik, fired
# from a docker.service drop-in on every daemon start), but restarting here
# still settles the daemon before the app layer lands on it rather than
# leaning on the nudge to clean up afterwards. Idempotent: a no-op when
# daemon.json was unchanged (no handler was notified).
- name: "docker: flush pending daemon restart before the app layer deploys"
  meta: flush_handlers

# Atomicity: prove the daemon actually serves API requests before any
# downstream role (swarm services, infra compose, backup's `docker
# exec`) assumes it. `systemctl is-active` alone doesn't -- the unit
# can be active while dockerd's socket is still initializing, or the
# daemon.json validation is mid-parse. `docker info` round-trips the
# UNIX socket and only returns 0 once the API is serving. Cheap,
# local, ~1s typical.
#
# `timeout` wrapper is load-bearing: `retries`/`until` only bound the
# wait when each attempt RETURNS. A HUNG daemon (socket accepts but the
# API never answers -- disk-wedged dockerd, a paused/SIGSTOP'd daemon,
# the fi_c1 fault-injection) makes a bare `docker info` BLOCK on the
# socket forever, so ansible never re-enters the retry loop and the whole
# converge hangs on this one task with no bound (observed: a fi_c1 run
# wedged >30 min here). `timeout 10` forces each attempt to return
# rc=124 on a stuck daemon, so the retries do their job and the converge
# ABORTS cleanly after ~15*(10+2)s instead of hanging indefinitely.
- name: "Probe docker daemon is serving API requests"
  ansible.builtin.command:
    cmd: timeout 10 docker info
  register: _docker_info_probe
  retries: 15
  delay: 2
  until: _docker_info_probe.rc == 0
  changed_when: false

# ─── Docker Swarm (single-node) init ─────────────────────────────────────
# The reverse-proxy + control-plane roles that follow (traefik, postgres,
# portainer) all deploy `docker service`s, which require an active swarm
# manager, so this role inits it -- right after the daemon is confirmed
# serving and before any swarm-service role runs.
#
# Idempotent: `docker swarm init` errors on an already-active node, so gate on
# LocalNodeState. Swarm raft + overlay IPAM are NOT in the restic set (backup
# captures only {{ storage_mount_point }}/docker/volumes); they are rebuilt,
# not restored. On a DR restore the fresh host has no swarm state -> this init
# runs clean. On a rollback restore, reconcile/roles/backup/tasks/restore.yml removes the
# surviving {{ storage_mount_point }}/docker/swarm raft while dockerd is stopped
# (but keeps docker/network, so per-stack compose bridges survive), so this init
# runs clean there too instead of reconciling a stale raft against just-restored
# volumes.
- name: "swarm: read local node state"
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
  register: _docker_swarm_state
  changed_when: false

- name: "swarm: init single-node swarm (advertise on the tailnet)"
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - init
      - --advertise-addr
      - "{{ docker_swarm_advertise_addr }}"
  when: (_docker_swarm_state.stdout | trim) != 'active'
  register: _docker_swarm_init
  changed_when: _docker_swarm_init.rc == 0

# ─── how much task history swarm keeps ───────────────────────────────────
# Docker's default is 5, and the default is what this host was running.
#
# Swarm keeps one CONTAINER per retained task record, in Exited state, for
# every roll of every service -- an image bump, a spec change, a restart. So
# `docker ps -a` on a converged host shows five gatus containers with one
# running, five of each of the others, and the count is not a symptom of
# anything: it is the retention limit, doing exactly what it says. Reading it
# as a crash loop or as a naming collision is the natural first guess and it
# costs an afternoon.
#
# Two is the smallest number that still answers the question the history exists
# for. At 1 (or 0) `docker service ps <svc>` shows only the task running now, so
# a service that just recovered has no record of what it recovered FROM, and a
# crash loop looks identical to a healthy service on its first task. At 2 the
# previous task's state and Error are still there, which is what a converge
# failure and the bench's readiness probe both read.
#
# Lowering the limit is retroactive: dockerd drops the excess task records and
# reaps their containers, so this reclaims the accumulated ones rather than only
# bounding future growth.
- name: "swarm: read the task-history retention limit"
  ansible.builtin.command: >-
    docker info --format
    '{{ "{{" }}.Swarm.Cluster.Spec.Orchestration.TaskHistoryRetentionLimit{{ "}}" }}'
  register: _docker_task_history
  changed_when: false
  failed_when: false

- name: "swarm: bound task history to {{ docker_swarm_task_history_limit }}"
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - update
      - --task-history-limit
      - "{{ docker_swarm_task_history_limit }}"
  # Gated on the read rather than run-and-report: `docker swarm update` exits 0
  # and prints "Swarm updated." whether or not anything changed, so an
  # ungated task reports changed on every converge forever.
  when:
    - (_docker_swarm_state.stdout | trim) == 'active'
      or (_docker_swarm_init is defined and _docker_swarm_init is changed)
    - (_docker_task_history.stdout | default('') | trim)
      != (docker_swarm_task_history_limit | string)
  register: _docker_task_history_set
  changed_when: _docker_task_history_set.rc == 0

# ─── node label: where state lives ───────────────────────────────────────
# Every swarm service that mounts state is constrained to
# node.labels.catena.role==data. At one node the constraint is a no-op. The
# moment a second node joins it is the difference between a working cluster
# and a data-loss event: swarm will happily reschedule a service with a LOCAL
# named volume onto another node and create a fresh EMPTY volume there, with
# no error. The container starts, the data is simply gone. That is the
# known Docker Swarm gotcha with local named volumes, and the cheapest
# possible moment to close it is now, while there is only one node and the
# constraint costs nothing.
#
# Correct by construction across DR: node labels live in the swarm raft, raft
# is deliberately NOT in the restic set (see the swarm init below), so a
# restored host has no labels -- and this task puts them back on the converge
# that follows, before any role reads them.
#
# Idempotent: `docker node update --label-add` with an unchanged value is a
# no-op, so this reports changed only when it actually set something.
- name: "swarm: read the local node id"
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.NodeID{{ "}}" }}'
  register: _docker_node_id
  changed_when: false

- name: "swarm: read the local node labels"
  ansible.builtin.command: >-
    docker node inspect {{ _docker_node_id.stdout | trim }}
    --format '{{ "{{" }}index .Spec.Labels "catena.role"{{ "}}" }}'
  register: _docker_node_role
  changed_when: false
  failed_when: false

- name: "swarm: label the local node as the data node"
  ansible.builtin.command:
    argv:
      - docker
      - node
      - update
      - --label-add
      - "catena.role={{ docker_node_role_label }}"
      - "{{ _docker_node_id.stdout | trim }}"
  when: (_docker_node_role.stdout | default('') | trim) != docker_node_role_label
  register: _docker_node_label
  changed_when: _docker_node_label.rc == 0

# ─── overlay-race self-heal (catena-network-nudge) ───────────────────────
# dockerd restores restart-policy containers during "Loading containers",
# which runs BEFORE the swarm node re-materializes catena-network -- and the
# boot-time restore gets exactly ONE attempt per container, so whatever loses
# that race stays Exited with RestartCount=0 until something starts it.
#
# Swarm services re-dispatch themselves by name, so catena-traefik,
# catena-postgres, catena-portainer and cloudflared all self-heal. The
# Portainer COMPOSE containers (keycloak-server-1, oauth2-proxy, gatus,
# nextcloud-talk-hpb-1, ...) have nothing to heal them, and they are what this
# nudge is for. It lives here rather than in reconcile/roles/traefik because the race is
# between the daemon start and the swarm init, both of which this role owns.
- name: "docker: drop network-nudge script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-network-nudge.sh"
    dest: /usr/local/bin/catena-network-nudge
    owner: root
    group: root
    mode: "0755"

- name: "docker: render network-nudge systemd unit"
  ansible.builtin.template:
    src: catena-network-nudge.service.j2
    dest: /etc/systemd/system/catena-network-nudge.service
    owner: root
    group: root
    mode: "0644"
  register: _docker_nudge_unit

- name: "docker: ensure docker.service drop-in dir exists"
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "docker: render docker.service drop-in that fires the nudge"
  ansible.builtin.template:
    src: docker-service-nudge-dropin.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-catena-network-nudge.conf
    owner: root
    group: root
    mode: "0644"
  register: _docker_nudge_dropin

- name: "docker: daemon-reload if the nudge unit or drop-in changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _docker_nudge_unit.changed or _docker_nudge_dropin.changed

# ─── UFW FORWARD policy ──────────────────────────────────────────────────
# /etc/default/ufw ships with DEFAULT_FORWARD_POLICY="DROP" by default
# (Debian/Ubuntu OS-level setting; not devsec, not catena). With Docker
# installed, every container's outbound traffic transits the host's
# FORWARD chain, so a DROP policy blackholes ALL container egress to the
# internet -- cloudflared cannot reach the CF edge, no container can pull
# from external registries past the local mirror, etc.
#
# Flip to ACCEPT. Inbound is still default-deny via the INPUT chain
# (bootstrap/roles/common). DOCKER-USER remains the per-container ingress filter
# point if we ever need to constrain a specific bridge.
- name: "ufw: set DEFAULT_FORWARD_POLICY=ACCEPT for Docker container egress"
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
    state: present
  notify: cycle ufw to apply forward policy

# ─── ops in docker group ─────────────────────────────────────────────────
# Note: membership takes effect on the user's NEXT login. Ansible continues
# using its existing SSH session, authenticated before the group change;
# operator interactive sessions need to log out + back in to get the new
# group applied without sudo.
- name: Add ops user to docker group
  ansible.builtin.user:
    name: "{{ ops_user }}"
    groups: docker
    append: true
