[project]
name = "catena-ce-installer"
version = "0.1.0"
description = "Community Catena installer / CLI (seed + ansible wrapper)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    # Pin to the bench-validated ansible-core line. The floor is above the
    # 2.19 series (which needed systemd/ufw workarounds), the ceiling below
    # the next unvalidated minor; requires-python>=3.12 keeps a single
    # resolution (2.21.x) rather than splitting py3.11 onto 2.19. uv
    # provisions a 3.12+ interpreter, so older-distro controllers are not
    # blocked.
    "ansible-core>=2.20,<2.22",
    # bootstrap Phase 0.5 runs helpers/install_key.py to install the operator
    # key over the provider password; pexpect drives that SSH session.
    "pexpect>=4.9",
]

[project.scripts]
# Expose the CLI as a bare `catena` console script so self-hosters run
# `uv run catena install` (not `uv run ./catena`). catena_cli loads the
# extensionless `catena` script (kept extensionless because the bench + docs
# invoke it as ./catena) and re-exports its entry point.
catena = "catena_cli:_entry"

[build-system]
# Required so uv builds + installs this project into the env, which is what
# creates the `catena` console script above.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.setuptools]
# catena_cli is the only importable module (the console-script shim). The rest
# of the tree (seed.py, helpers/, playbooks/, roles/) is run in place, not
# packaged.
py-modules = ["catena_cli"]
