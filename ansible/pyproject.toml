[project]
name = "catena-ce-ansible"
version = "0.1.0"
description = "The catena-ce Ansible tree's test environment"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    # The range bootstrap/roles/ansible_runtime installs on the server, so the
    # tests and syntax checks read the tree with the ansible-core it runs on.
    # tests/unit/test_ansible_runtime_pin.py holds the two together.
    "ansible-core>=2.20,<2.22",
]

[tool.uv]
# Nothing here is built or installed: the tree runs in place, on the server.
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
