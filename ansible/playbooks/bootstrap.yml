---
# First contact with a fresh server, and the first leg of `catena-cli install`.
# It trusts the host key, installs the operator's SSH key with the provider's
# initial login when the key does not open the host yet, hardens the box, and
# seeds the on-box config store and the ansible-core the host reconciles itself
# with. Run again on an installed host, Phases 0 to 1 find their work done and
# skip it.
#
# Plays in order:
#
#   Phase 0   -- TOFU: keyscan the host into known_hosts, first contact only
#   Phase 0.5 -- install the operator key with the provider password
#   Phase 1   -- baseline + harden as the initial user: bootstrap/roles/common
#   Phase 2   -- seed the on-box store + the host's ansible runtime (ops + key)
#
# The install reaches the host at one SSH address for every leg: the one
# `catena-cli install --address` gives for one run, else HOST_SSH_ADDRESS, else
# HOST_PUBLIC_IP. Phase 2 hands it to the steady-state host entry, under the
# `vps:` group the later legs target. Public port 22 stays open until the
# panel's Lockdown closes it.
- name: "Phase 0 -- TOFU: add bootstrap host SSH key to ~/.ssh/known_hosts"
  hosts: "{{ stage_hosts | default('bootstrap') }}"
  gather_facts: false
  become: false

  # ssh-keyscan the host first, TOFU style, and only when known_hosts holds no
  # key for it. A rerun against an installed host keeps the key it trusted, and
  # ssh refuses a server that presents another one: re-trusting whatever
  # answers on every run would accept an impostor at the same address.
  # `catena-cli install` settles a changed key before this runs
  # (helpers/host_key.py).
  #
  # The tasks use `delegate_to: localhost` rather than play-level
  # `connection: local`. Play-level `connection: local` triggers Python
  # interpreter discovery for the bootstrap host against the controller, caches
  # the controller's venv python as the host's interpreter, and breaks Phase 1
  # when it reconnects over SSH.
  tasks:
    # Create-only: an existing controller ~/.ssh keeps its mode. A controller
    # may make it group-traversable on purpose (a runner reading the operator
    # pubkey through a bind mount needs g+rx), which a forced 0700 would break.
    - name: Stat controller ~/.ssh
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
      register: _controller_ssh_dir
      delegate_to: localhost

    - name: Ensure ~/.ssh exists on the controller
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"
      when: not _controller_ssh_dir.stat.exists
      delegate_to: localhost

    - name: Is a key for this host already trusted?
      ansible.builtin.command:
        argv: [ssh-keygen, -F, "{{ ansible_host }}"]
      register: _known_host
      changed_when: false
      failed_when: false
      delegate_to: localhost

    # Atomicity: append with `>>` is neither atomic (crash mid-write can
    # truncate known_hosts) nor idempotent (rerun produces duplicates). Run
    # ssh-keyscan as a read-only capture, then hand each line to
    # ansible.builtin.known_hosts which writes via temp-file + atomic rename
    # and dedupes automatically. Re-runnable without guards.
    - name: ssh-keyscan the host (controller-side)
      ansible.builtin.command:
        cmd: "ssh-keyscan -T 10 {{ ansible_host }}"
      register: _keyscan
      changed_when: false
      delegate_to: localhost
      # A freshly booted (or snapshot-restored) host may not have sshd
      # accepting connections yet when this first runs -- ssh-keyscan then
      # exits rc=1 with empty output and the install dies before Phase 1.
      # Retry until it captures at least one host key, so the keyscan waits
      # for sshd instead of racing it.
      retries: 20
      delay: 6
      until:
        - _keyscan.rc == 0
        - (_keyscan.stdout | trim | length) > 0
      when: _known_host.rc != 0

    - name: Add host keys to ~/.ssh/known_hosts (atomic, deduped)
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ ansible_host }}"
        key: "{{ item }}"
        hash_host: true
        state: present
      loop: "{{ _keyscan.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ (item.split() | length > 1) | ternary(item.split()[1] + ' key', 'skipped') }}"
      when:
        - _known_host.rc != 0
        - item | length > 0
        - not item.startswith('#')
      delegate_to: localhost

- name: "Phase 0.5 -- install operator SSH key via provider password"
  hosts: "{{ stage_hosts | default('bootstrap') }}"
  gather_facts: false
  become: false

  vars_prompt:
    - name: bootstrap_initial_user
      prompt: "Initial SSH user (OVH/Hetzner: root; OVH Debian images: debian; Ubuntu/AWS: ubuntu)"
      private: false
      default: "root"
    - name: bootstrap_root_password
      prompt: "Provider password for that user (leave blank if key already installed)"
      private: true
      default: ""

  tasks:
    # DECIDE ON THE KEY, NOT ON THE PASSWORD.
    #
    # The gate below probes for the KEY, because a blank password is not
    # evidence about the key. `catena-cli install` ALWAYS emits
    # bootstrap_root_password, blank when install.yaml carries no
    # host_initial_password (cli _bootstrap_extra_vars) -- deliberately, so a
    # vars_prompt cannot stop the deploy chain to ask partway through.
    # Extra-vars outrank vars_prompt, so on a fresh VPS driven by the CLI with
    # no host_initial_password the prompt never appears and the password is
    # blank on exactly the hosts that still need the key. Read there as "the
    # key is already installed" and this play skips, the key never lands, and
    # Phase 1 cannot connect:
    #
    #   debian@<ip>: Permission denied (publickey).
    #
    # A blank password and an installed key are not the same state, so probe
    # for the state instead of inferring it from the input. Both accounts are
    # probed because either one answering means there is nothing to install:
    # the provider account on a fresh box, ops on a box Phase 1 already
    # hardened (which removes the provider account from AllowUsers).
    # helpers/install_key.py::_key_already_works checks the same pair for the
    # same reason -- this is that check, hoisted to where it can decide.
    - name: "Phase 0.5: does key auth already work for either account?"
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - IdentitiesOnly=yes
          - -o
          - PreferredAuthentications=publickey
          - -o
          - StrictHostKeyChecking=accept-new
          - -i
          - "{{ ansible_ssh_private_key_file }}"
          - "{{ item }}@{{ ansible_host }}"
          - "true"
      loop:
        - "{{ bootstrap_initial_user }}"
        - "{{ ops_user }}"
      register: _key_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: "Phase 0.5: record whether the operator key already opens this host"
      ansible.builtin.set_fact:
        _key_works: >-
          {{ (_key_probe.results | selectattr('rc', 'equalto', 0) | list | length) > 0 }}

    - name: "Phase 0.5: key already installed -- nothing to do"
      ansible.builtin.debug:
        msg: >-
          {{ ansible_ssh_private_key_file }} already opens
          {{ (_key_probe.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list | join(' or ')) }}@{{ ansible_host }}.
          Skipping the key install.
      when: _key_works | bool

    # Fail HERE, where the fix is one input away, rather than three tasks into
    # Phase 1 as an unattributed "Permission denied (publickey)".
    - name: "Phase 0.5: no key on the host and no provider password to install one"
      ansible.builtin.fail:
        msg: |
          {{ ansible_ssh_private_key_file }} does not open
          {{ bootstrap_initial_user }}@{{ ansible_host }} or {{ ops_user }}@{{ ansible_host }},
          and no provider password was supplied to install it with.

          This is the normal state of a FRESH VPS. The key install needs the
          password the provider issued for {{ bootstrap_initial_user }}:
          `catena-cli install` asks for it when the key does not open the
          server, and an install.yaml gives it as
          `host_initial_password: <password>`.

          If the host was rebuilt on a recycled IP, also check that
          HOST_PUBLIC_IP in {{ inventory_dir }}/.env still names it.
      when:
        - not (_key_works | bool)
        - bootstrap_root_password | length == 0

    - name: Install your public key (handles forced password change via pexpect)
      ansible.builtin.command:
        # helpers/install_key.py needs pexpect (its only third-party dep).
        argv:
          - python3
          - helpers/install_key.py
          - "{{ ansible_host }}"
          - "--user={{ bootstrap_initial_user }}"
          - "--port={{ ansible_port | default(22) }}"
          - "--pubkey={{ ansible_ssh_private_key_file }}.pub"
          - "--privkey={{ ansible_ssh_private_key_file }}"
        chdir: "{{ playbook_dir }}/.."
      environment:
        INSTALL_KEY_PASSWORD: "{{ bootstrap_root_password }}"
      delegate_to: localhost
      when:
        - not (_key_works | bool)
        - bootstrap_root_password | length > 0

- name: "Phase 1 -- baseline + harden (connects as initial user, skipped if already done)"
  hosts: "{{ stage_hosts | default('bootstrap') }}"
  gather_facts: false
  vars:
    # Connect as the same initial user that Phase 0.5 installed the key for.
    # When initial_user == root (OVH, Hetzner bare images), no become needed
    # because we are root. When initial_user is a non-root cloud user (debian,
    # ubuntu, ...), become: true lets the common role run as root via NOPASSWD
    # sudo that cloud-init configured. Either way, root SSH is never opened
    # on the host.
    ansible_user: "{{ bootstrap_initial_user }}"
    # Interpreter discovery runs against the REMOTE rather than a value cached
    # by Phase 0, whose tasks ran with delegate_to: localhost.
    ansible_python_interpreter: auto_silent
  become: "{{ bootstrap_initial_user != 'root' }}"
  pre_tasks:
    # --- Root-provider idempotency check -------------------------------------
    # When initial_user == root: after Phase 1 the common role disables root
    # login. A failed root-SSH probe means Phase 1 already ran -- skip.
    - name: "Phase 1 idempotency (root path) -- can root still SSH in?"
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - IdentitiesOnly=yes
          - -o
          - PreferredAuthentications=publickey
          - -o
          - StrictHostKeyChecking=accept-new
          - -i
          - "{{ ansible_ssh_private_key_file }}"
          - "root@{{ ansible_host }}"
          - "true"
      register: root_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      when: bootstrap_initial_user == 'root'

    - name: Phase 1 already complete (root path) -- root login is disabled
      ansible.builtin.debug:
        msg: |
          Root SSH no longer works -- Phase 1 has already run on this host.
          Skipping to Phase 2.
      when: bootstrap_initial_user == 'root' and (root_probe.rc | default(0)) != 0

    - name: End Phase 1 (root path)
      ansible.builtin.meta: end_play
      when: bootstrap_initial_user == 'root' and (root_probe.rc | default(0)) != 0

    # --- Non-root provider idempotency check ---------------------------------
    # Probe OPS, not the provider account. Phase 1's sshd hardening removes the
    # provider account from AllowUsers, so a probe dialled as that account
    # fails from the moment Phase 1 succeeds, and a play that carried on would
    # fail at its fact gathering with `Permission denied (publickey)`.
    #
    # The root path above probes the account whose access Phase 1 REMOVES and
    # reads failure as "already ran". This path probes the account Phase 1
    # CREATES and reads success the same way. Probing ops also proves what
    # Phase 2 needs next: that ops accepts the operator key.
    # helpers/install_key.py::_key_already_works checks both accounts for the
    # same reason.
    - name: "Phase 1 idempotency (non-root path) -- can ops SSH in?"
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - IdentitiesOnly=yes
          - -o
          - PreferredAuthentications=publickey
          - -o
          - StrictHostKeyChecking=accept-new
          - -i
          - "{{ ansible_ssh_private_key_file }}"
          - "{{ ops_user }}@{{ ansible_host }}"
          - "true"
      register: ops_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      when: bootstrap_initial_user != 'root'

    - name: Phase 1 already complete (non-root path) -- ops accepts the key
      ansible.builtin.debug:
        msg: |
          {{ ops_user }}@{{ ansible_host }} accepts the operator key -- Phase 1
          has already run on this host. Skipping to Phase 2.
      when: bootstrap_initial_user != 'root' and (ops_probe.rc | default(1)) == 0

    - name: End Phase 1 (non-root path)
      ansible.builtin.meta: end_play
      when: bootstrap_initial_user != 'root' and (ops_probe.rc | default(1)) == 0

    # Neither account answering is a THIRD state, and it is the one worth
    # naming. Phase 1 needs the provider account: it is how the common role
    # gets on the box. Letting the play discover that on its own produces a
    # connection failure attributed to whatever task ran first -- the same
    # misattribution described above.
    # RETRIED, unlike the two probes above, and the asymmetry is deliberate.
    #
    # A "no" from those two is the EXPECTED answer on a fresh host -- it means
    # Phase 1 has not run yet -- so retrying them would add the whole deadline
    # to every first install to confirm something already true. A "no" HERE is
    # the one that aborts, and it is the last word before a message that tells
    # the operator to go and look at their provider console.
    #
    # A single sample cannot carry that, and neither can a probe that hides
    # why it failed. Both halves are load-bearing here.
    #
    # StrictHostKeyChecking, explicitly: accept-new is the posture ansible.cfg
    # uses for the connections this probe is predicting, so the probe and the
    # connection agree. A probe left on the default `ask` fails with "Host key
    # verification failed" wherever known_hosts holds no entry for the name it
    # dials -- rc=255, no auth attempted -- against a host that is answering
    # normally. A CHANGED key is still refused.
    #
    # And the reason SSH gives goes into the failure, rather than to
    # /dev/null. Discarded, it leaves a failure here reading exactly like a
    # timeout, and the abort listing five candidate causes without the real
    # one.
    #
    # Both accounts are re-probed, because either answering means the install
    # can continue: ops answering means Phase 1 already ran, and the provider
    # account answering means it can run now.
    - name: "Phase 1 (non-root path) -- can the provider account still SSH in?"
      ansible.builtin.shell:
        cmd: |
          set -u
          for user in "{{ bootstrap_initial_user }}" "{{ ops_user }}"; do
            if out=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
                   -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
                   -o StrictHostKeyChecking=accept-new \
                   -i "{{ ansible_ssh_private_key_file }}" \
                   "$user@{{ ansible_host }}" true 2>&1); then
              echo "$user"
              exit 0
            fi
            echo "$user: $out" >&2
          done
          exit 1
      register: initial_probe
      changed_when: false
      failed_when: false
      # ~60s of deadline before declaring a host unreachable, which is cheap
      # against the cost of being wrong: this aborts an install.
      retries: 5
      delay: 10
      until: initial_probe.rc == 0
      delegate_to: localhost
      become: false
      when: bootstrap_initial_user != 'root'

    - name: "Phase 1 (non-root path) -- no account answers at this address"
      ansible.builtin.fail:
        msg: |
          Neither {{ ops_user }} nor {{ bootstrap_initial_user }} can SSH to
          {{ ansible_host }} with {{ ansible_ssh_private_key_file }}.

          Phase 1 cannot run: it needs {{ bootstrap_initial_user }} to get onto
          the box, and Phase 1's sshd hardening removes that account once it has
          run. Phase 0.5 should have caught this and named the case; reaching
          HERE means it did not.

          Both accounts were re-probed over ~60s before this fired, so a host
          that was merely slow to answer has already been given its chance --
          treat this as a real access problem, not a timeout. Check in this
          order:

            - the key was never installed because no provider password was
              supplied. Usual cause on a FRESH VPS. Answer the provider
              password `catena-cli install` asks for, or add
              `host_initial_password: <password>` to install.yaml -- the CLI
              passes that variable through BLANK when it is omitted, and an
              extra-var outranks the prompt, so omitting it does not fall back
              to asking.

            - the host is not reachable at this address. The install dials
              {{ ansible_host }} (--address, else HOST_SSH_ADDRESS, else
              HOST_PUBLIC_IP in {{ inventory_dir }}/.env); confirm the rebuilt
              VPS still has it.

            - Phase 1 already ran and the panel's Lockdown closed public 22,
              so {{ ops_user }} is only reachable over the tailnet. Run the
              install again with `--address <tailnet-ip>`.

            - the operator key is not the one installed on this host. Recover at
              the provider console: {{ bootstrap_initial_user }} still logs in
              there (sshd's AllowUsers does not govern console login), then
              inspect /home/{{ ops_user }}/.ssh/authorized_keys.

            - the host is not reachable at all (rebuilt, wrong IP, ufw).

          What SSH reported on the last attempt for each account:

          {{ (initial_probe.stderr | default('(nothing captured)')) | trim | indent(12) }}
      when:
        - bootstrap_initial_user != 'root'
        - (ops_probe.rc | default(1)) != 0
        - (initial_probe.rc | default(1)) != 0

    - name: Gather facts now that we know Phase 1 needs to run
      ansible.builtin.setup:
  roles:
    - role: common

- name: "Phase 2 -- seed the on-box store + the ansible runtime (ops + key)"
  hosts: "{{ stage_hosts | default('bootstrap') }}"
  gather_facts: true
  vars:
    ansible_user: "{{ ops_user }}"
    ansible_python_interpreter: auto_silent
  become: true # ops uses NOPASSWD sudo (set up in Phase 1)
  pre_tasks:
    # THE STORE IS CREATED HERE, before any later leg reads it. Those legs read
    # their settings from store-projected cfg_* facts with no inventory
    # fallback, so against a host with no store every one of them is blank.
    #
    # Only the CONFIG half seeds here. The rest of load_onbox_config.yml MINTS
    # the internal secrets and the user-held passwords, and asks the container
    # registry which catena-admin release to install: a converge's work, on a
    # machine that has no Docker yet.
    #
    # Phase 1 has already run the common role, so python3 and ops exist; the
    # store's parent directory does not have to (onbox_config.dump() creates it).
    - name: "Seed the on-box config store before anything reads it"
      ansible.builtin.include_tasks:
        file: tasks/seed_onbox_config.yml
  roles:
    # The ansible-core the host reconciles itself with. Here rather than in
    # Phase 1 because Phase 1 can end early on its own idempotency check, and a
    # host that skipped it would never gain the runtime.
    - role: ansible_runtime

  post_tasks:
    # --- Record the install address -----------------------------------------
    # The later legs of the install reach the host at the address this
    # playbook reached it on. This playbook leaves hosts.yml as it is:
    #   1. add_host sets ansible_host on the steady-state hostname for the
    #      plays that follow in this ansible-playbook run;
    #   2. helpers/bootstrap_output.py merges the value into
    #      <inventory_dir>/.bootstrap-output.yml (gitignored), which catena_cli
    #      folds into hosts.yml before the next leg, unless --address names
    #      the address for the run.
    - name: "Compute steady-state hostname (drop -bootstrap suffix)"
      ansible.builtin.set_fact:
        _steady_state_host: "{{ inventory_hostname | regex_replace('-bootstrap$', '') }}"
        _steady_state_ip: "{{ ansible_host }}"

    - name: "Inject the install address into in-memory inventory"
      ansible.builtin.add_host:
        name: "{{ _steady_state_host }}"
        ansible_host: "{{ _steady_state_ip }}"

    - name: "Emit the install address into <inventory_dir>/.bootstrap-output.yml"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../helpers/bootstrap_output.py"
          - --inventory-dir
          - "{{ inventory_dir }}"
          - --host
          - "{{ _steady_state_host }}"
          - --key
          - ansible_host
          - --value
          - "{{ _steady_state_ip }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Bootstrap complete
      ansible.builtin.debug:
        msg: |
          Bootstrap complete for {{ inventory_hostname }}.

          Install address: {{ _steady_state_ip }}
          Steady-state host: {{ _steady_state_host }}

          The rest of the install reaches the host at this address. Public
          port 22 stays open: the panel's Lockdown closes it, after proving
          the tailnet path.
