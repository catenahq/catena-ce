---
# Hand control of this host back to the operating system.
#
# unattended-upgrades keeps applying OS security patches on every edition. This
# unmasks and re-enables the native apt timers (idempotent on an unmasked
# host), and removes the unattended-upgrades origins and the needrestart policy
# reconcile/roles/host_maintenance added, so both run on Debian's defaults.
#
# The apps, the data, Portainer and the VPS's Tailscale and Cloudflare
# registrations stay in place. Those are the client's to tear down
# deliberately; the printed guidance at the end lists them.
#
# Usage (via the installer):
#   uv run catena-cli uninstall --inventory <name>
# Or directly:
#   ansible-playbook -i inventory/<name> playbooks/uninstall.yml
- name: "Uninstall -- hand unattended-upgrades back to Debian"
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Unmask, enable, and start the native apt timers (security patching)
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: false
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Remove the unattended-upgrades origins and the needrestart policy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ catena_apt_origins_path }}"
        - "{{ catena_needrestart_conf_path }}"

    - name: Teardown guidance (Catena left your apps and data in place)
      ansible.builtin.debug:
        msg:
          - "Done: apt-daily-upgrade.timer is unmasked + active -- the OS keeps patching itself."
          - "Catena did NOT remove your apps, data, or accounts. You still own these steps:"
          - "  - Portainer + app containers: remove from the Portainer UI, or with docker directly."
          - "  - Cloudflare tunnel + DNS records: delete in the Cloudflare dashboard."
          - "  - Tailscale node: remove in the Tailscale admin console."
          - "  - Backups: your restic repo on your own S3 stays until you delete it (your data, your call)."
