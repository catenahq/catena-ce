---
# Shared across every inventory -- Ansible auto-loads group_vars/all/*.yml
# from the playbook directory for every run, regardless of which inventory is
# targeted (-i inventory/<name>), same as it does from the inventory
# directory itself. This file is pure structure: reconstructing complex
# types (lists, dicts) from dotenv strings. It never varies between
# inventories, only the values it reads do -- the dotenv lookup plugin
# resolves <inventory_dir>/.env for whichever inventory is active, so one
# copy here serves all of them. Edit .env per inventory, never this file.

# --- Global ---
ansible_managed: "Managed by catena -- do not edit directly; regenerate via the installer / converge.yml."

# This machine's public address: coturn advertises it in its ICE candidates and
# the mail and TURN A records point at it. A controller's inventory states it
# (hosts.yml, from HOST_PUBLIC_IP), and a host var outranks this file. A host
# converging itself has no inventory to ask and reads the address of its own
# default route, which is the public address on a provider that puts it on the
# interface; behind a provider's NAT that address is private.
public_ip: "{{ ansible_default_ipv4.address | default('') }}"

# --- Identity ---
ops_user: "{{ lookup('dotenv', 'OPS_USER', default='ops') }}"
# The controller's key for reaching the host over SSH. A host converging itself
# (catena-converge, local connection) has no .env and no use for one.
# The HOST's own connection, read through hostvars: a task delegated to
# localhost (bootstrap.yml's key install and key checks) templates
# ansible_connection as localhost's `local`, which would blank the key the
# task hands to ssh.
ansible_ssh_private_key_file: >-
  {{ lookup('dotenv', 'SSH_PRIVATE_KEY')
     if (hostvars[inventory_hostname].ansible_connection | default('ssh')) != 'local'
     else '' }}
# The public half sits beside the private key, as ssh-keygen writes it.
ops_ssh_public_keys:
  - "{{ lookup('file', lookup('dotenv', 'SSH_PRIVATE_KEY') ~ '.pub') }}"
# The forward-only account an administrator opens the panel and Portainer
# through (`ssh -N -L 9010:127.0.0.1:9010 panel@<host>`). A product constant:
# the installer's access page and the keyset banner print it.
catena_panel_user: panel

# --- The access plane ---
# How this host is reached for administration, and therefore whether public
# port 22 may be closed at all. Derived from the store's TAILNET_PROVIDER, the
# one answer the panel's Settings gives (helpers/onbox_config.py settles it on
# every load), so it rides /etc into the snapshot and a rebuilt host comes back
# with the firewall posture it had.
#
# `tailnet`     a provider is chosen: the host joins that private network.
#               Public 22 stays open until the panel's Lockdown closes it, which
#               it does only once it has PROVEN that path; the port reconciler
#               reopens 22 while the tailnet is down.
# `public_ssh`  `none`: no private network; port 22 stays open on the public IP,
#               because a host with no alternative path has nothing to prove and
#               closing it would be a lockout. The tailscale role is skipped, and
#               the panel's apply opens 22 after a Lockdown taken on a tailnet.
catena_access_method: >-
  {{ 'tailnet'
     if (cfg_tailnet_provider | default('none', true) | trim | lower)
        in ['tailscale', 'headscale']
     else 'public_ssh' }}

# Port 22's declaration in the public-port registry. Shared because two tasks
# write it and they must agree on the name: bootstrap/roles/common creates it
# open and never narrows it, and tasks/ufw_lockdown.yml narrows it to `private`
# once it has proven the alternative path.
catena_ssh_fragment_name: ssh.json

# The ufw comment on every port-22 rule. scripts/catena-public-ports.py writes
# the same rules for the ssh fragment as `<UFW_COMMENT_PREFIX>:<owner>`, and ufw
# rewrites a rule whose comment differs, so any other comment here would have
# the reconciler and the converge rewrite each other's rule on every run.
# tests/unit/test_ssh_ufw_rules_share_one_comment.py holds the two together.
catena_ssh_ufw_comment: "catena-ports:ssh"

# --- Tailscale ---
tailscale_hostname: "{{ inventory_hostname }}"
# From the store, which the panel writes. No fallback tag: a missing value
# fails here rather than advertising a tag the credential is not scoped for.
tailscale_tags: >-
  {{ cfg_tailscale_tags.split(',') | map('trim') | list }}
# Tailscale leaves systemd-resolved alone: the host resolves through its own
# resolvers whether or not the tailnet is up.
tailscale_accept_dns: false

# --- Cloudflare Tunnel ---
cloudflare_api_base: "https://api.cloudflare.com/client/v4"
# Store-owned, entered in the panel's Settings with the Cloudflare token. Empty
# until then: every server is installed without a domain.
cloudflare_zone: "{{ cfg_cloudflare_zone | default('', true) }}"
# An empty zone builds every hostname as `dash.`, `auth.`, `monitor.` -- names
# that resolve nowhere and certificates no authority will issue. So nothing
# public is published until there is a domain to publish it under, and this is
# what every role that would publish a name gates on.
#
# DERIVED, not set: a fact set by one play is absent in every play that does not
# run it, and the roles reading this are reached from several. The question is
# the same wherever it is asked -- is there a domain -- so it is answered in one
# place from the value it depends on.
catena_public_surface_deferred: >-
  {{ (cloudflare_zone | default('') | trim | length) == 0 }}
# cloudflare_zone above is the primary domain every <sub>.<zone> hostname
# interpolates, and the only one a Community host serves. Additional domains
# are attached in the catena-admin Domains panel and live in the on-box store;
# the host engine assembles the full list from there and caps it on the
# subscription, so there is no zone list to set here.
# Each host owns its own tunnel, and NAMES IT ITSELF: the engine composes
# <prefix> + the box's hostname, which bootstrap/roles/common set to inventory_hostname.
# The prefix is a store key (CLOUDFLARED_TUNNEL_NAME_PREFIX) the engine reads
# for itself, so nothing here has to render a name -- which is what lets the
# cloudflared dispatch actions ship in the image instead of being converge-owned.
# Cloudflared runs as a swarm service on catena-network. Ingress target is
# the catena-traefik container, reachable by service name inside the network.
cloudflared_ingress_service: "http://catena-traefik:80"

# --- Infrastructure subdomains ---
# Public-facing hostnames. Each is routed to its own oauth2-proxy instance,
# which authenticates against Keycloak and proxies to the app behind it. SSO
# works across them via a session cookie scoped to .<zone>.
# Store keys, set in catena-admin > Settings; the literal is the name a host
# with nothing stored uses.
infrastructure_gatus_subdomain: "{{ cfg_gatus_subdomain | default('monitor', true) }}"
infrastructure_gatus_hostname: "{{ infrastructure_gatus_subdomain }}.{{ cloudflare_zone }}"
# catena-admin is served at dash.<zone>, and `catena_admin_hostname` below
# is the one place that is said. A second name rendering dash.<zone> from its
# own subdomain variable would agree until the first change to one moved the
# panel for oauth2-proxy and the trust path while the DR keyset banner and the
# gated-host probe set kept printing the old name.

healthchecks_subdomain: "{{ cfg_healthchecks_subdomain | default('heartbeat', true) }}"
healthchecks_hostname: "{{ healthchecks_subdomain }}.{{ cloudflare_zone }}"

# The SSO host (auth.<zone>) is the only subdomain with no oauth2-proxy in
# front of it (it IS the auth layer). keycloak_hostname / keycloak_subdomain are
# defined in reconcile/roles/keycloak/defaults, from the store's
# KEYCLOAK_SUBDOMAIN.
# Store-owned, seeded once from the .env. Empty is a real state -- it is what a
# host has before anyone has said who to contact -- and the roles that use it
# (ACME registration, the Keycloak admin account) already handle blank.
admin_email: "{{ cfg_admin_email | default('') }}"

# SMTP -- resolved by reconcile/roles/keycloak from the store. SMTP_PROVIDER
# (resend | brevo | server) decides where mail goes, SMTP_SENDER is the address
# it comes from, and smtp_password is the one credential; the role fills in
# host, port and username from the choice. Don't re-declare
# smtp_host/smtp_port/etc. here -- doing so shadows the role default and
# defeats the resolution.

# ntfy + backup repo are NOT set here. They are store-owned (catena-admin >
# Settings), and the roles and lanes read the store.

# Auth is handled entirely by self-hosted SSO at auth.<zone> plus a per-app
# oauth2-proxy in front of each gated host. User membership in the access
# groups controls access to the gated subdomains.

# --- Portainer API (container control plane) ---
# Global so any role (infrastructure stack seam, dashboard-sync env) can
# reference it. reconcile/roles/portainer consumes the same names.
# The port, like the hostname scheme, is the product's. It is published
# host-mode and confined to this host by the public-ports registry, so no client
# picks it to avoid a collision -- nothing else on the box may bind it either
# way. An administrator opens the UI through an SSH local forward.
portainer_ui_port: "9000"

# The API, addressed from ON the host, which is the only place it answers. The
# converge's own API calls run on the host against it, and so does everything
# that runs on the box -- catena-dashboard-sync, the container-update lane.
#
# Never ansible_host. It is where the CONTROLLER reaches the box, the UI port
# refuses it, and it is not stable: it flips between the public and tailnet
# address across converges and differs again after a restore onto other
# infrastructure. Baking it into a file a
# host-local service reads gives that service an address for a machine it is
# already running on, which stops working the moment the address changes:
#
#   catena-dashboard-sync.service: FAILED
#   request failed on GET /stacks: <urlopen error [Errno 113] No route to
#   host>            (env said 10.139.244.121, the host was 10.139.244.110)
#
# dashboard-sync is what renders the Traefik route files for client apps, so
# a stale base means every app deployed after the address moved gets NO route
# and answers 404. Read on bench run 2026-08-31T14-59-08-adca as
# "traefik did not route 'book.11003300.xyz'" with the app healthy at 1/1 and
# its vps.route.host label correct.
#
# It is also why these env files are not idempotent: a rendered address
# that changes between converges rewrites the file every time.
portainer_api_base_onbox: "http://127.0.0.1:{{ portainer_ui_port }}/api"

# Public, oauth2-gated hostname for the Portainer UI over the Cloudflare
# tunnel (admin-only; wired by reconcile/roles/oauth2_proxy oauth2_proxy_apps). This is
# the client admin's self-serve deploy surface. Distinct from
# portainer_api_base_onbox above, which only this host reaches -- both reach
# the same catena-portainer service.
# A store key (PORTAINER_SUBDOMAIN), set in catena-admin > Settings like the
# subdomains above; the literal is the name a host with nothing stored uses.
portainer_admin_subdomain: "{{ cfg_portainer_admin_subdomain | default('portainer', true) }}"
portainer_admin_hostname: "{{ portainer_admin_subdomain }}.{{ cloudflare_zone }}"

# --- Declarative public-port registry ---
# The two paths the registry is built from. Here rather than in
# reconcile/roles/public_ports because SIX roles read the fragment dir -- coturn,
# portainer, infrastructure's three lanes and catena-admin's host setup all drop
# a <owner>.json into it -- and a role default is only reliably in scope once
# that role has run. A constant six roles share is the product's, not one
# role's.
#
# The reconciler imports public_ports and labels_schema by bare name from its
# own directory, so all three install side by side in the lib dir.
public_ports_lib_dir: /usr/local/lib/catena
public_ports_fragment_dir: /etc/catena/public-ports.d

# --- Provenance of the tree this converge is running ---
# Written by catena-admin scripts/vendor-catena-ce.sh and shipped beside the
# ansible/ directory inside the panel image, so it sits one level above
# playbook_dir's parent on the on-host path and does not exist at all on a
# controller. tasks/record_release_manifest.yml reads the commit out of it to
# answer "which catena-ce did this host apply".
#
# A variable rather than the literal expression at the point of use, because
# playbook_dir is a magic variable nothing can override -- so a path written
# inline is a path no test can point anywhere else.
catena_vendor_manifest_path: "{{ playbook_dir }}/../../VENDOR.json"

# --- What this converge installed, so the next one can withdraw it ---
# /var/lib rather than /etc, for the reason the payload's own manifest gives:
# it describes what is on this host right now, it is rewritten every converge,
# and /etc rides the backup set -- a restored manifest would describe the
# machine the snapshot came from and hand the delete leg a list of paths this
# host never had.
catena_converge_manifest_path: /var/lib/catena/converge-manifest.json

# What the panel payload installed (catena-admin
# payload/installer/install-ee-payload.sh writes it). The prune reads it so a
# path handed from this converge to the payload is never withdrawn from under
# the payload.
catena_payload_manifest_path: /var/lib/catena/payload-manifest.json

# What this converge delivered, written at the very end of converge.yml and
# reconcile.yml so it describes a converge that finished. The panel reads it to
# tell "this feature is off" from "this feature's plumbing never reached this
# host": every button dispatches a FIXED action name through the SSH forced
# command, and that table is rendered by the converge, so a panel built after
# an action was added shows a button a host converged before it will refuse.
#
# It lives under /var/lib/catena: it is rebuildable state, that directory is
# already bind-mounted read-only into the panel, and it stays out of restic
# snapshots because a restored host's converge state is its own.
catena_release_manifest_path: "/var/lib/catena/release.json"

# --- What the bootstrap-owned files looked like last time a converge ran ---
# Same reasoning for /var/lib: it describes this host now, it is rewritten
# every converge, and a copy restored from a snapshot would be a baseline taken
# on a different machine -- which for a drift report is worse than no baseline,
# because every file would read as changed.
catena_bootstrap_drift_path: /var/lib/catena/bootstrap-drift.json

# The boundary declaration itself, read at run time by
# tasks/report_bootstrap_drift.yml so the list of operator-owned paths has one
# home. A variable rather than an inline expression for the same reason
# catena_vendor_manifest_path is one: playbook_dir is magic and cannot be
# overridden, so a path built from it inline is a path no test can redirect.
catena_boundary_path: "{{ playbook_dir }}/../boundary.yml"

# --- Storage ---
# The product's data prefix. FHS: "data for services provided by this system".
# Named literally in the backup path set, the docker data-root, the volume
# layout and the restore machine, so it is the product's layout rather than an
# operator choice -- moving it means moving every one of those with it.
#
# It also carries a meaning that decides what may live under it: THIS COMES
# BACK ON A RESTORE. /etc, /usr/local and /var/lib belong to the machine, not
# to the data, and reconcile's restore engine skips them deliberately. See
# reconcile/roles/backup/defaults/main.yml.
#
# One tier, on the disk the host already has. Catena does not manage block
# devices: more space is a disk the client mounts themselves and declares in
# BACKUP_EXTRA_PATHS.
storage_mount_point: "/srv/catena"
storage_bulk_enabled: >-
  {{ lookup('dotenv', 'STORAGE_BULK_ENABLED', default='false') | bool }}
storage_bulk_mount_point: "{{ lookup('dotenv', 'STORAGE_BULK_MOUNT_POINT', default='/mnt/bulk') }}"

# --- Backup ---
# Backup creds, repo and schedule are configured post-install in catena-admin
# (Settings > Backup), written to the on-box store, and read by run-backup.sh
# at runtime. backup_healthcheck_url is owned by reconcile/roles/backup/defaults.
# Retention is the `backup_retention` object in /etc/catena/config.json, set on
# the panel's Schedules page and rendered to /etc/catena/backup-retention.env by
# catena-schedule, the only file run-backup.sh sources it from.

# --- Per-inventory / per-host customization -------------------------------
# Universal defaults ship in roles/*/vars/ and roles/*/defaults/ -- a specific
# deployment that needs to ADD to them (never remove -- fork the repo for
# that) drops an inventory/<name>/group_vars/all/*.yml file of its own.
# Ansible loads group_vars from the inventory directory too, so it merges
# on top of this shared file with no edit here.
#
# Extra catena-admin action buttons are the one hook. reconcile/roles/catena-admin/
# defaults/main.yml defaults catena_admin_extra_actions to [], so most
# inventories need nothing. A deployment that wants one adds
# inventory/<name>/group_vars/all/actions.yml:
#
#   catena_admin_extra_actions:
#     - name: acme-refresh-prices
#       title: "Refresh ACME prices"
#       icon: "&#128176;"   # 💰
#       timeout: 60
#       shell: "sudo -u acme /opt/acme/bin/refresh-prices"
#
# Required keys: `name`, `shell`. Optional: `title` (defaults to name),
# `icon`, `timeout` (defaults to 10s). Same shape as the canonical catalog
# (reconcile/roles/catena-admin/templates/actions.yml.j2) -- each entry becomes a
# dispatcher case + allow-list entry automatically.

# --- The admin panel's shared identity ---
# Read by BOTH halves of the panel's converge -- bootstrap/roles/catena_admin_host, which
# sets up the trust path and the host lane env files, and reconcile/roles/catena-admin,
# which deploys the container -- and by reconcile/roles/oauth2_proxy, which resolves
# catena_admin_hostname by NAME at a point where neither role's defaults are
# reliably in scope.
#
# A role default is only dependable once that role has run, so a value two roles
# on either side of the boundary share is the product's rather than one role's.
# Same call as the public-port paths above and the subdomains in phase 3. It is
# also what lets a host converge itself: playbooks/reconcile.yml runs no
# bootstrap role, so a bootstrap default is undefined there.

# The swarm service's name, and its DNS name on catena-network, which
# reconcile/roles/oauth2_proxy upstreams to: renaming it 502s every
# authenticated dash.<zone> request. reconcile/roles/catena-admin creates the
# service; reconcile/roles/payload asks swarm which image it runs.
catena_admin_service_name: "catena-admin"

# What the shell binds. reconcile/roles/portainer builds the App Templates URL
# from the name and this port, long before reconcile/roles/catena-admin runs.
catena_admin_internal_port: 8000

# The distroless image's `USER nonroot:nonroot`. reconcile/roles/payload owns
# /var/lib/catena/ee-payload for it and reconcile/roles/catena-admin chowns what
# the container writes. Keep in lockstep with catena-admin's Dockerfile.
catena_container_uid: "65532"
catena_container_gid: "65532"

# Where bootstrap/roles/catena_admin_host installs the SSH forced command the
# panel dispatches through; the admin-actions templates name it.
catena_admin_dispatcher_path: "/usr/local/sbin/catena-admin-runner"

# The recovery export directory. reconcile/roles/backup owns what goes in it;
# reconcile/roles/catena-admin BIND-MOUNTS it into the panel earlier, and swarm
# rejects a task whose bind source does not exist. The container joins the
# group so it can list the artifacts; the recovery sidecar serves them.
catena_export_dir: /var/backups/catena-export
catena_export_dir_group: "1000"
catena_export_dir_mode: "0750"

# Where reconcile/roles/infrastructure/tasks/swarm_stack.yml writes the body it
# hands to `docker stack deploy`; keycloak and oauth2_proxy include that helper
# from their own roles. Kept on disk so a failed deploy is reproducible by hand:
# `docker stack deploy -c <dir>/<name>.yml <name>`.
swarm_stack_dir: /etc/catena/stacks

# The catena-admin image. reconcile/roles/payload extracts the host engines from
# it and reconcile/roles/catena-admin runs the shell from it, so both read this
# one declaration: a host whose engines and panel come from different images
# disagrees with itself about the config schema.
#
# The BOOTSTRAP input: it decides the image a first converge creates the service
# from; afterwards reconcile/roles/payload follows the service's own image, so a
# host has one version input at a time and the update lane moves both halves.
# PUBLIC, pulled anonymously: the Business set is gated at runtime by the
# licence check.
#
# Precedence:
#   1. CATENA_ADMIN_IMAGE, if set -- change control, ahead of any pin. The bench
#      converges against an image it built this way, and catena-admin
#      catena-converge sets it to the image the panel is running, so a host
#      converging itself stays on the image its reconcile tree came from.
#   2. The version this host recorded in /etc/catena/config.json, rollback
#      included.
#   3. The newest published release, asked of the registry once per converge by
#      playbooks/tasks/load_onbox_config.yml (catena_admin_release).
#
# The empty minimum on the pin filter is what lets (2) beat (3); a pin must name
# this repository and a real version, and the result carries its digest, so the
# pull is byte-addressed (playbooks/filter_plugins/image_pin.py). An inline
# conditional rather than ternary: ternary evaluates both branches, and the pin
# filter refuses the empty reference an override leaves behind.
catena_admin_image_override: >-
  {{ lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) }}
catena_admin_image: >-
  {{ catena_admin_image_override
     if (catena_admin_image_override | default('', true) | length > 0)
     else ((catena_admin_release.ref | default(''))
           | catena_image_pin(catena_image_pins | default({}), '')) }}

# --- Hostname ---------------------------------------------------------
# The admin panel is served at dash.<zone>. The subdomain is a product
# constant, like the hostname scheme above: every inventory in this repo, in
# the operator skeleton and on every host uses it, and nothing looks up an
# override.
catena_admin_subdomain: "{{ cfg_catena_admin_subdomain | default('dash', true) }}"
catena_admin_hostname: "{{ catena_admin_subdomain }}.{{ cloudflare_zone }}"
catena_admin_ui_port: "9010"
# Host dir where catena-backup-run + catena-gatus-sync write their summary JSON
# files (backup-stats.json, gatus-summary.json, healthchecks-summary.json).
# Bind-mounted read-only into the admin container; the admin's stats
# reader picks up the files unchanged. Matches reconcile/roles/backup defaults'
# backup_stats_dir; do not move without updating that role.
catena_admin_stats_dir: "/var/lib/catena"
# Where the panel writes its own state, chiefly the hash-chained audit trail.
#
# UNDER the state directory above rather than beside it. One tier, one parent:
# two top-level directories for the one answer to "where does Catena keep its
# runtime state" meant two entries in the backup set, two things a restore
# could half-carry, and one more path an operator had to know before they could
# find the audit trail.
#
# A SUBDIRECTORY and not the parent itself, because the parent is bind-mounted
# READ-ONLY into the panel: the lanes' own state is not the panel's to rewrite.
# The panel's writable scope stays exactly its own directory, the same shape
# /var/lib/catena/ee-payload already uses.
catena_admin_state_dir: "/var/lib/catena/admin"

# Default theme rendered into the admin container's env. Inventory override
# via catena_default_theme. Language has no install-time default: the panel
# always starts in English, and a visitor can switch to French any time via
# the header toggle (shell/i18n) -- no inventory field for it.
catena_admin_default_theme: "{{ catena_default_theme | default('system') }}"
