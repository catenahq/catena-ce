---
# Regenerate this host's Cloudflare tunnel. Maintenance action (Community).
#
# Run on the host when the panel's Settings > Domain > Apply puts the stored
# domain and Cloudflare token into effect: the catena-domain-apply action runs
# it, then reconcile.yml. Applying the domain already in use is how a client
# regenerates the tunnel.
#
# Takes no secret. The role authenticates as the cloudflare_api_token in the
# host's own store, because the engine that mints the replacement tunnel reads
# that store directly; see the role's header for why a per-run token cannot
# work here.

- name: Regenerate Cloudflare tunnel
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false
  roles:
    - role: cloudflare_tunnel_regenerate
