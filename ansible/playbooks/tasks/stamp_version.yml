---
# Stamp /etc/catena/version.txt with the catena-ce version this converge
# applies, and set `catena_version` for the rest of the play.
#
# SHARED BY BOTH CONVERGE PATHS, and the first thing either writes after loading
# the store, so the stamp says "a converge started here" and the release
# manifest, written last from the same fact, says it finished. validate.yml
# holds the two equal.
#
# The stamp rides the backup. catena-admin's restore check orders a snapshot's
# stamp against the host's, and its move check requires two servers to carry
# the same one, so it has to name the version the host RUNS: a host that updated
# itself from the panel image converges with that image's tree and stamps that
# tree's version.
#
# The version is the `git describe --always --dirty --tags` the image's vendor
# step recorded in VENDOR.json, beside the tree it vendored. A tree without the
# record resolves nothing, and nothing is written: a true stamp from an earlier
# converge is the only record of which version produced this host's data, and
# replacing it with a placeholder would leave the restore check nothing to
# order.

# Machine-written, so "not there" and "not JSON" are both ordinary answers
# rather than failures.
- name: "Version: read the image's vendor record"
  ansible.builtin.slurp:
    src: "{{ catena_vendor_manifest_path }}"
  register: _catena_vendor_record
  failed_when: false

- name: "Version: resolve the version this converge applies"
  vars:
    _vendor_raw: >-
      {{ (_catena_vendor_record.content | b64decode | trim)
         if (_catena_vendor_record.content is defined) else '' }}
    _vendor: >-
      {{ (_vendor_raw | from_json)
         if (_vendor_raw.startswith('{') and _vendor_raw.endswith('}'))
         else {} }}
  ansible.builtin.set_fact:
    catena_version: "{{ _vendor.describe | default('', true) }}"
    catena_version_date: "{{ _vendor.committed_at | default('', true) }}"

- name: "Version: stamp /etc/catena/version.txt"
  ansible.builtin.copy:
    dest: /etc/catena/version.txt
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ catena_version }}
      {{ catena_version_date }}
      converged-at: {{ ansible_date_time.iso8601 | default('') }}
  # `converged-at` moves on every converge, and a fresh timestamp is the point
  # of the file rather than drift. A change of version still shows, in the
  # manifest the converge writes last.
  changed_when: false
  when: catena_version | length > 0
