---
# Remove every swarm secret of `swarm_secret_bases` ([base, ...]) that no
# service mounts. playbooks/tasks/swarm_secrets.yml names a secret
# <base>-<hash of its value>, so a rotated value arrives as a new secret and
# the one it replaced is left holding the old value: included right after the
# services of these bases are deployed, this removes it once nothing reads it.

- name: "Swarm secrets: list them"
  ansible.builtin.command:
    argv: [docker, secret, ls, --format, '{{ "{{" }}.Name{{ "}}" }}']
  register: _swarm_secret_names
  changed_when: false

- name: "Swarm secrets: list the services"
  ansible.builtin.command:
    argv: [docker, service, ls, --quiet]
  register: _swarm_service_ids
  changed_when: false

- name: "Swarm secrets: read the services' specs"
  ansible.builtin.command:
    argv: "{{ ['docker', 'service', 'inspect'] + _swarm_service_ids.stdout_lines }}"
  register: _swarm_service_specs
  changed_when: false
  when: _swarm_service_ids.stdout_lines | length > 0

- name: "Swarm secrets: remove the ones of these bases no service mounts"
  ansible.builtin.command:
    argv: [docker, secret, rm, "{{ item }}"]
  loop: >-
    {{ _swarm_secret_names.stdout_lines
       | swarm_secrets_unmounted(_swarm_service_specs.stdout | default('[]', true) | from_json,
                                 swarm_secret_bases) }}
  changed_when: true
