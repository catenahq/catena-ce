---
# The end of every converge, after its roles: converge.yml and reconcile.yml
# both include it, naming themselves in `catena_converge_path`. Each task keeps
# its own tag, so a --tags run still selects one of them.

# Render the control plane and the app companions as compose files and prove
# they load. Applies nothing: the services were already created and reconciled
# by the catena-tier1 engine, role by role, as each contributed its spec. This
# is the oracle -- `docker stack config` type-checking the same dicts against
# the docker actually installed. Here, after the roles, so it renders the specs
# every one of them contributed, on whichever path converged the host.
#
# `apply:` carries the tag inward: without it, `--tags tier1_stack` fires the
# include and then filters out every task inside it.
- name: "Tier 1: render + validate the swarm-service oracle files"
  ansible.builtin.include_role:
    name: tier1_stack
    apply:
      tags: [tier1_stack]
  tags: [tier1_stack]

# Reconcile the declarative public-port registry, after every role has dropped
# its /etc/catena/public-ports.d/ fragment and deployed its containers
# (vps.expose.* labels), so the merged effective set is complete. Applies ufw +
# DOCKER-USER rules and writes the effective set validate.yml reads. The
# firewall's default-deny policy is bootstrap's; this only opens what is
# declared. Not a change of its own: a converge that alters what is declared
# reports it on the fragment it writes, and a start joins a run the timer
# already has in flight. Skipped only where reconcile/roles/public_ports found
# the payload staged out of band and the reconciler not yet on the host.
- name: "Public ports: reconcile firewall from registry"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when: catena_public_ports_installed | default(true) | bool
  tags: [public_ports]

# Report -- never repair -- changes to the files boundary.yml puts on the
# operator's side. A converge does not write them; this task is what keeps
# that rule from also meaning blindness to them.
- name: "Bootstrap drift: report changes to operator-owned files"
  ansible.builtin.include_tasks:
    file: report_bootstrap_drift.yml
    apply:
      tags: [bootstrap_drift]
  tags: [bootstrap_drift]

# Remove what a previous converge installed and this one does not ship.
# Before the release manifest, so a converge that fails here does not record
# itself as finished.
- name: "Prune: remove files withdrawn from the product"
  ansible.builtin.include_tasks:
    file: prune_withdrawn_files.yml
    apply:
      tags: [prune]
  tags: [prune]

# Record what this converge delivered, last, so the manifest describes a
# converge that finished (record_release_manifest.yml says what it holds).
- name: "Release: record what this converge delivered"
  ansible.builtin.include_tasks:
    file: record_release_manifest.yml
    apply:
      tags: [release_manifest]
  tags: [release_manifest]
