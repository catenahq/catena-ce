---
# The non-secret half of the on-box store: seed it once from the inventory
# `.env`, then read only the store.
#
# Split out of tasks/load_onbox_config.yml so bootstrap.yml can run THIS and
# nothing else. The rest of that loader belongs to a converge: it mints the
# internal service secrets and the user-held admin/restic DR keyset, and it asks
# the container registry which catena-admin release to install -- on a machine
# that has no Docker yet. Bootstrap needs neither, and needs the config half
# because bootstrap/roles/tailscale chooses its control plane from cfg_tailnet_provider
# with no inventory fallback. A machine that reaches its first converge already
# on the wrong tailnet is the defect this split exists to close.
#
# The full loader includes this file, so there is one copy of these four tasks.
#
# Post-install config has to have ONE live reader. The inventory `.env` is the
# first-install SEED (fill-only, so a converge never overwrites what the client
# later set in catena-admin), and from then on the store answers.
#
# Before this, both were live at once: run-backup.sh reconciled them in shell
# at runtime, retention ended up with two copies and the converge's silently
# dead, and a tag-scoped converge that skipped the loader fell back to a stale
# `.env` with no signal.
- name: "onbox: read the store-owned config key names"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../helpers/onbox_config.py --emit settings-config-names"
    executable: python3
  register: _onbox_cfg_known
  changed_when: false

# Each declared key is read out of the inventory .env on the CONTROLLER and
# passed as --set-config. A blank never seeds: apply_inputs skips empty values
# the same way it skips a blank secret, so an unset key leaves the store alone
# rather than writing "" over a value the client set.
#
# On a bare machine this is also what CREATES the store: onbox_config.dump()
# does p.parent.mkdir(parents=True), so /etc/catena does not have to exist yet.
- name: "onbox: seed the store's config from .env (fill-only, first install)"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --no-mint --emit none
      {% for k in (_onbox_cfg_known.stdout | from_json) %}
      {% set v = lookup('dotenv', k, default='') %}
      {% if v | string | length > 0 %}--set-config {{ (k ~ '=' ~ v) | quote }} {% endif %}
      {% endfor %}
    executable: python3
  register: _onbox_cfg_seeded
  changed_when: false

- name: "onbox: publish the store's config as facts (outranks role defaults)"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --no-mint --emit config-vars
    executable: python3
  register: _onbox_cfg_emit
  changed_when: false

- name: "onbox: set_fact each store-owned config value"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (_onbox_cfg_emit.stdout | from_json) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Every public hostname is <sub>.<zone>, so a host with no zone has no public
# surface to build. That used to be an assert, on the reasoning that an empty
# zone "converges a host that looks finished and serves nothing".
#
# The reasoning was right and the remedy was backwards. A server is installed
# before its domain is decided -- SPEC guarantees a credential-free install, and
# the domain arrives with the Cloudflare token in Settings, afterwards. Failing
# the converge made the supported order impossible: the install could not
# finish, so the panel that takes the domain never came up.
#
# So the state is DECLARED rather than refused. Deferred is not the same as
# broken, and the difference has to be visible: every role that would publish a
# name gates on this fact and says it skipped, so a host serving nothing says
# why, once, instead of issuing a certificate for `dash.` three roles later.
- name: "onbox: say that the public surface is waiting for a domain"
  ansible.builtin.debug:
    msg: >-
      No domain is configured, so nothing public is published on this converge:
      no certificates, no routes, no DNS records. The server is reachable on the
      private network and everything on it runs. Enter a domain in the
      dashboard's Settings, then converge again.
  when: catena_public_surface_deferred | bool
  run_once: true
