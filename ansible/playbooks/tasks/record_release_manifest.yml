---
# Record what this converge delivered.
#
# LAST on purpose, and the difference from /etc/catena/version.txt is the
# whole point of having both. version.txt is stamped before the first role, so
# it says "a converge started here" -- which is what a client reading it out of
# a snapshot wants. This manifest says "a converge finished here, and here is
# what it left behind", so a converge that died at role 9 leaves the previous
# manifest standing rather than claiming plumbing it never delivered.
#
# `actions` is every name the dispatch table carries, read from the same merged
# list catena-ce/ansible/reconcile/roles/catena-admin renders that table from.
# `payload_actions` belongs to the catena-admin payload installer, and the panel
# renders the host actions it declares.
#
# SHARED BY BOTH CONVERGE PATHS. converge_tail.yml includes this file, and
# converge.yml and reconcile.yml both run that tail, each naming itself in
# `catena_converge_path`, so the manifest describes the converge that ran last
# on either path.
#
# THE VERSION is `catena_version`, which stamp_version.yml resolved and stamped
# into /etc/catena/version.txt at the start of this same converge, on either
# path. catena-ce/ansible/bootstrap/roles/common/tasks/validate.yml holds the
# two equal: written at opposite ends of one converge, a disagreement means it
# did not reach the end.

- name: "Release: read the marker for the installed host engines"
  ansible.builtin.slurp:
    src: "{{ catena_payload_marker }}"
  register: _release_payload_marker
  failed_when: false

# The payload installer owns `payload_actions`, the actions ITS dispatch
# drop-ins add; the converge owns the rest of what it writes below.
# `copy` writes full content, so the payload's half has to be read back and
# carried, exactly as the marker slurp above is. Without this, every converge
# would erase the payload's declarations, and the panel would drop those
# actions until the next payload install.
- name: "Release: read the payload's half of the manifest"
  ansible.builtin.slurp:
    src: "{{ catena_release_manifest_path }}"
  register: _release_prev
  failed_when: false

- name: "Release: record what this converge delivered"
  vars:
    _prev_raw: >-
      {{ (_release_prev.content | b64decode | trim)
         if (_release_prev.content is defined) else '' }}
    # Guarded rather than trusted. This file is deliberately not load-bearing
    # -- a host with no manifest converges fine -- so a corrupt one must not be
    # the thing that fails a converge.
    _prev: >-
      {{ (_prev_raw | from_json)
         if (_prev_raw.startswith('{') and _prev_raw.endswith('}'))
         else {} }}
    # No version resolved leaves the previous one standing: a true value from
    # an earlier converge is worth more than a field that is always filled.
    _ce: >-
      {{ catena_version | default('', true)
         or (_prev.catena_ce_version | default('')) }}
  ansible.builtin.copy:
    dest: "{{ catena_release_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ {
           'schema': 1,
           'converged_at': ansible_date_time.iso8601 | default(''),
           'converged_by': catena_converge_path,
           'catena_ce_version': _ce,
           'catena_admin_image': catena_admin_image,
           'payload_image_id': (_release_payload_marker.content | default('') | b64decode | trim),
           'actions': (_catena_admin_actions_dispatch | default([]))
                      | map(attribute='name') | select | sort | list,
           'payload_actions': (_prev.payload_actions | default([])),
         } | to_nice_json }}
  # `converged_at` moves on every converge, so `copy` would report this changed
  # every time -- and a converge that always reports a change is one nobody can
  # read for real drift. Same reasoning, and the same answer, as the
  # version.txt stamp in stamp_version.yml: a fresh timestamp is the POINT
  # of the file, not a drift signal.
  changed_when: false
