---
# On-box config store loader. THE secret source of truth.
#
# The store is a plaintext 0600 file at /etc/catena/config.json, which rides
# the restic backup (/etc is in reconcile/roles/backup backup_paths). On every
# run it ADOPTS any declared secret in scope (fill-only) -- on an install that
# is the admin password the install's input file pins, which install-host.sh
# passes as `-e @file`; on any other run nothing is in scope and the store is
# already the truth. It MINTS every missing INTERNAL service secret and the
# user-held admin and console passwords on-box (reconcile-not-overwrite, via
# helpers/onbox_config.py), then set_facts each one from the store so all
# downstream roles read the on-box source of truth. The restic password is
# generated in the panel instead.
#
# Included UNCONDITIONALLY from the pre_tasks of converge.yml, reconcile.yml,
# validate.yml, lockdown.yml and rotate-tailscale.yml (runs before any role). A
# rebuild needs only the {restic endpoint, S3 creds, restic password} keyset:
# the store returns with the data, internals and all.

- name: "onbox: stage the knob registry"
  ansible.builtin.include_tasks:
    file: stage_knob_registry.yml
    apply:
      tags: [always, onbox]
  tags: [always, onbox]

# Which variables count as secrets is DECLARED, in the four category tables
# in helpers/onbox_config.py, and read back here -- captured by declared
# name rather than by a spelling convention, so a variable is captured
# because someone said it is a secret, not because of how it is spelled.
# Asking the module keeps one declaration.
#
# Pure query, no store I/O -- it answers before the store exists on a fresh box.
- name: "onbox: read the declared secret names"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../helpers/onbox_config.py --emit secret-names"
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_known
  changed_when: false

# Capture by NAME first (the varnames lookup does not evaluate values), then
# extract only those values. A blanket `vars | dict2items` would force
# evaluation of EVERY in-scope var -- including role defaults that only
# resolve inside their role (e.g. catena-admin's
# catena_admin_actions_source: "{{ role_path }}/..."), which is undefined in
# play pre_tasks scope and aborts the converge.
- name: "onbox: list the in-scope secret variable names"
  ansible.builtin.set_fact:
    _onbox_names: >-
      {{ lookup('ansible.builtin.varnames',
                '^(' ~ (_onbox_known.stdout | from_json | join('|')) ~ ')$',
                wantlist=True) }}
  no_log: true

- name: "onbox: capture those into a migration map"
  ansible.builtin.set_fact:
    _onbox_capture: "{{ dict(_onbox_names | zip(_onbox_names | map('extract', vars))) }}"
  no_log: true

# Stage the capture map to a 0600 host file: this ansible-core's script
# module has no stdin passthrough, so onbox_config.py reads --adopt-file.
# changed_when: false on the stage + remove pair: they are loader
# scaffolding (a temp file created and deleted within the same play,
# zero net host delta), and a converge that changes nothing reports
# changed=0.
- name: "onbox: stage the capture map on the host (0600)"
  ansible.builtin.copy:
    dest: /root/.catena-onbox-adopt.json
    content: "{{ _onbox_capture | to_json }}"
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  no_log: true

- name: "onbox: adopt existing secrets, mint missing internal, emit store"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --adopt-file /root/.catena-onbox-adopt.json --emit secrets
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_emit
  changed_when: false
  no_log: true

- name: "onbox: remove the staged capture map"
  ansible.builtin.file:
    path: /root/.catena-onbox-adopt.json
    state: absent
  changed_when: false
  no_log: true

# Publish every store secret as a fact, the Portainer API key included: it
# is minted mid-converge by reconcile/roles/portainer, which set_facts the fresh
# value, and a later set_fact wins over an earlier one -- so publishing the
# stored value here is what stops the role re-minting a key on every single
# converge.
- name: "onbox: publish store secrets as facts (on-box source of truth)"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (_onbox_emit.stdout | from_json) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# --- non-secret config: seed once from .env, then read only the store --------
#
# Its own file because bootstrap.yml and show-keyset.yml run THAT and nothing
# else: they need the config half and must not run the rest of this loader,
# which mints the internal secrets and calls the container registry, on a
# machine with no Docker yet.
- name: "onbox: seed and publish the store-owned config"
  ansible.builtin.include_tasks:
    file: seed_onbox_config.yml
    apply:
      tags: [always, onbox]
  tags: [always, onbox]

# --- image pins: what the on-host update lane last applied -------------------
#
# The converge owns TOPOLOGY -- which services exist and how they wire. The
# on-host lane owns IMAGE VERSIONS, and it bumps them between converges. A
# converge that deployed the shipped floor would put every managed bump back,
# so it ASKS. Roles resolve their image through the catena_image_pin
# filter, which takes max(floor, pin) -- see filter_plugins/image_pin.py for why
# neither side can simply win.
#
# A pure query: no mint, no write, answers on a host that has no store yet.
- name: "onbox: read the image pins the on-host update lane recorded"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --emit image-pins
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_image_pins
  changed_when: false

- name: "onbox: publish the image pins"
  ansible.builtin.set_fact:
    catena_image_pins: "{{ _onbox_image_pins.stdout | from_json }}"

# --- which catena-admin release this converge installs -----------------------
#
# ASKED, not remembered. The registry writes the version and its digest in one
# answer, so the two cannot disagree. That is the whole requirement, because
# reconcile/roles/payload refuses an image whose digest is not the recorded one:
#
#   ...:v0.5.1 resolved to sha256:205a5a70... but this deployment pins
#   sha256:09e03d74... Refusing to extract or root-execute the payload.
#
# Any arrangement whose two halves can move separately -- a version literal and
# a digest literal in bootstrap/roles/common/defaults, bumped by hand on each
# catena-admin release -- turns that correct refusal into a failed fresh install
# on a correct host holding a correct image. helpers/catena_admin_release.py
# states why it resolves the highest vX.Y.Z tag rather than :latest.
#
# It runs ON the host, like every other step in this loader: the machine that
# resolves the tag is then the machine that pulls it, so the answer is one the
# host can actually act on.
#
# Skipped entirely when CATENA_ADMIN_IMAGE names one. That is the change-control
# escape hatch -- a client who wants to decide when their panel version moves
# sets it, and this makes no network call at all.
- name: "onbox: resolve the catena-admin release to install"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/catena_admin_release.py
      --repository {{ catena_admin_repository | quote }}
    executable: python3
  register: _catena_admin_release
  changed_when: false
  failed_when: false
  when: lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0

# When the registry does not answer, the converge keeps the panel where it is:
# the catena-admin version this host recorded (a rollback or a managed bump),
# else the image its catena-admin service runs. Keeping the running image is
# the one answer that needs no registry, and the engines follow the service's
# image anyway (reconcile/roles/payload). Most hosts record no catena-admin
# version, so the running service is the usual fallback.
- name: "onbox: read the image the catena-admin service runs"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - inspect
      - "{{ catena_admin_service_name }}"
      - "--format={{ '{{ .Spec.TaskTemplate.ContainerSpec.Image }}' }}"
  register: _catena_admin_running
  changed_when: false
  # No service yet is an answer: the fail below names it.
  failed_when: false
  when:
    - lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0
    - (_catena_admin_release.rc | default(1)) != 0

- name: "onbox: keep the catena-admin image this host already runs"
  ansible.builtin.set_fact:
    catena_admin_fallback_image: "{{ _pinned if _pinned else _running }}"
    _catena_admin_fallback_from: >-
      {{ 'the version this host recorded' if _pinned
         else 'the image its ' ~ catena_admin_service_name ~ ' service runs' }}
  vars:
    _pinned: >-
      {{ catena_image_pins | default({})
         | catena_image_pinned(catena_admin_repository) }}
    _running: >-
      {{ (_catena_admin_running.stdout | default('') | trim)
         if (_catena_admin_running.rc | default(1)) == 0 else '' }}
  when:
    - lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0
    - (_catena_admin_release.rc | default(1)) != 0

# Fails HERE rather than deep in reconcile/roles/payload. The panel image is
# also where the host engines come from, and every role after
# bootstrap/roles/docker depends on those; a hardcoded version is the one thing
# this resolution exists to avoid.
- name: "onbox: the catena-admin release could not be resolved"
  ansible.builtin.fail:
    msg: >-
      Could not resolve which catena-admin image to install:
      {{ (_catena_admin_release.stderr | default('') | trim)
         | default('no output', true) }}
      This host records no catena-admin version and runs no
      {{ catena_admin_service_name }} service to keep, and the panel image is
      also where the host engines are extracted from. Pin an image explicitly
      with CATENA_ADMIN_IMAGE=ghcr.io/catenahq/catena-admin:vX.Y.Z to converge
      without asking the registry.
  when:
    - lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0
    - (_catena_admin_release.rc | default(1)) != 0
    - (catena_admin_fallback_image | default('')) | length == 0

- name: "onbox: publish the resolved catena-admin release"
  ansible.builtin.set_fact:
    catena_admin_release: "{{ _catena_admin_release.stdout | from_json }}"
  when:
    - lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0
    - (_catena_admin_release.rc | default(1)) == 0

# Named after what this converge deploys, catena_admin_image, which is the
# newest release only when this host records no catena-admin version of its own
# (playbooks/group_vars/all/main.yml gives the precedence).
- name: "onbox: catena-admin release"
  ansible.builtin.debug:
    msg: >-
      Installing catena-admin {{ catena_admin_release.version }}
      ({{ catena_admin_release.digest }}), resolved from
      {{ catena_admin_release.repository }}.
  when:
    - catena_admin_release is defined
    - _deployed == _newest
  vars:
    _deployed: "{{ catena_admin_image | regex_replace('@sha256:[0-9a-f]{64}$', '') }}"
    _newest: "{{ catena_admin_release.ref | regex_replace('@sha256:[0-9a-f]{64}$', '') }}"

- name: "onbox: catena-admin kept at the version this host recorded"
  ansible.builtin.debug:
    msg: >-
      Keeping catena-admin at {{ catena_admin_image }}, the version this host
      recorded, which a converge does not move. The newest release is
      {{ catena_admin_release.version }}: catena-admin > Settings > Control
      panel version moves the panel and its engines to it.
  when:
    - catena_admin_release is defined
    - _deployed != _newest
  vars:
    _deployed: "{{ catena_admin_image | regex_replace('@sha256:[0-9a-f]{64}$', '') }}"
    _newest: "{{ catena_admin_release.ref | regex_replace('@sha256:[0-9a-f]{64}$', '') }}"

- name: "onbox: catena-admin kept without the registry"
  ansible.builtin.debug:
    msg: >-
      The registry did not answer, so this converge keeps catena-admin at
      {{ catena_admin_fallback_image }}, {{ _catena_admin_fallback_from }}.
      Its payload digest goes unchecked on this converge.
  when: catena_admin_fallback_image is defined
