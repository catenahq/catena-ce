---
# 0b: on-box config store loader. THE secret source of truth (SOPS was dropped;
# no persisted laptop vault).
#
# The store is a plaintext 0600 file at /etc/catena/config.json, which rides
# the restic backup (/etc is in roles/backup backup_paths). On every converge
# it ADOPTS any declared secret in scope (fill-only) -- on a fresh install that
# is the install-critical vendor creds the CLI threads in as `-e @file`; on a
# fresh recover it is the DR keyset re-entered at the prompt; on a day-2
# converge nothing is in scope and the store is already the truth. It MINTS
# every missing INTERNAL service secret AND the user-held admin/restic DR
# keyset on-box (reconcile-not-overwrite, via helpers/onbox_config.py) so no
# secret is minted on the laptop, then set_facts each one from the store so
# all downstream roles read the on-box source of truth.
#
# Included UNCONDITIONALLY from site.yml + validate.yml + restore.yml pre_tasks
# (runs before any role). A rebuild needs only the {restic endpoint, S3 creds,
# restic password} keyset: the store returns with the data, internals and all.

# Which variables count as secrets is DECLARED, in the four category tables
# in helpers/onbox_config.py, and read back here -- captured by declared
# name rather than by a spelling convention, so a variable is captured
# because someone said it was a secret, not because of how it was spelled.
# Asking the module keeps one declaration.
#
# Pure query, no store I/O -- it answers before the store exists on a fresh box.
- name: "onbox: read the declared secret names"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../helpers/onbox_config.py --emit secret-names"
    executable: python3
  register: _onbox_known
  changed_when: false

# Capture by NAME first (the varnames lookup does not evaluate values), then
# extract only those values. A blanket `vars | dict2items` would force
# evaluation of EVERY in-scope var -- including role defaults that only
# resolve inside their role (e.g. catena-admin's
# catena_admin_actions_source: "{{ role_path }}/..."), which is undefined in
# play pre_tasks scope and aborts the converge.
- name: "onbox: list the in-scope secret variable names"
  ansible.builtin.set_fact:
    _onbox_names: >-
      {{ lookup('ansible.builtin.varnames',
                '^(' ~ (_onbox_known.stdout | from_json | join('|')) ~ ')$',
                wantlist=True) }}
  no_log: true

- name: "onbox: capture those into a migration map"
  ansible.builtin.set_fact:
    _onbox_capture: "{{ dict(_onbox_names | zip(_onbox_names | map('extract', vars))) }}"
  no_log: true

# Stage the capture map to a 0600 host file: this ansible-core's script
# module has no stdin passthrough, so onbox_config.py reads --adopt-file.
# changed_when: false on the stage + remove pair: they are loader
# scaffolding (a temp file created and deleted within the same play,
# zero net host delta), and reporting them changed made every converge
# recap carry changed>=2 -- which turned the bench's strict changed=0
# idempotency gates (assert_ce_idempotent_rerun) into guaranteed
# failures post-0b.
- name: "onbox: stage the capture map on the host (0600)"
  ansible.builtin.copy:
    dest: /root/.catena-onbox-adopt.json
    content: "{{ _onbox_capture | to_json }}"
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  no_log: true

- name: "onbox: adopt existing secrets, mint missing internal, emit store"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --adopt-file /root/.catena-onbox-adopt.json --emit secrets
    executable: python3
  register: _onbox_emit
  changed_when: false
  no_log: true

- name: "onbox: remove the staged capture map"
  ansible.builtin.file:
    path: /root/.catena-onbox-adopt.json
    state: absent
  changed_when: false
  no_log: true

# Publish every store secret as a fact, the Portainer API key included: it
# is minted mid-converge by roles/portainer, which set_facts the fresh
# value, and a later set_fact wins over an earlier one -- so publishing the
# stored value here is what stops the role re-minting a key on every single
# converge.
- name: "onbox: publish store secrets as facts (on-box source of truth)"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (_onbox_emit.stdout | from_json) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# ─── non-secret config: seed once from .env, then read only the store ───────
#
# Its own file because bootstrap.yml runs THAT and nothing else: it needs the
# config half (roles/tailscale picks its control plane from cfg_tailnet_provider)
# and must not run the rest of this loader, which mints the DR keyset and calls
# the container registry on a machine with no Docker.
- name: "onbox: seed and publish the store-owned config"
  ansible.builtin.include_tasks:
    # Absolute: a relative include inside an included file resolves against the
    # including file's own directory first, which is this same tasks/ folder.
    file: "{{ playbook_dir }}/tasks/seed_onbox_config.yml"
    apply:
      tags: [always, onbox]
  tags: [always, onbox]

# ─── image pins: what the on-host update lane last applied ─────────────────
#
# The converge owns TOPOLOGY -- which services exist and how they wire. The
# on-host lane owns IMAGE VERSIONS, and it bumps them between converges. Before
# this, a converge asked the catalog for a service's image, got the shipped
# floor, and emitted `--image` to put the old version back: every managed bump
# was silently reverted by the next converge.
#
# So the converge ASKS. Roles resolve their image through the catena_image_pin
# filter, which takes max(floor, pin) -- see filter_plugins/image_pin.py for why
# neither side can simply win.
#
# A pure query: no mint, no write, answers on a host that has no store yet.
- name: "onbox: read the image pins the on-host update lane recorded"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --emit image-pins
    executable: python3
  register: _onbox_image_pins
  changed_when: false

- name: "onbox: publish the image pins"
  ansible.builtin.set_fact:
    catena_image_pins: "{{ _onbox_image_pins.stdout | from_json }}"

# ─── which catena-admin release this converge installs ─────────────────────
#
# ASKED, not remembered. The image used to be two literals in
# roles/common/defaults -- the version and its digest -- bumped by hand together
# on every catena-admin release. They drifted, and roles/payload is right to
# refuse an image whose digest is not the recorded one, so the drift failed
# fresh installs on a correct host with a correct image:
#
#   ...:v0.5.1 resolved to sha256:205a5a70... but this deployment pins
#   sha256:09e03d74... Refusing to extract or root-execute the payload.
#
# The registry is now the single writer of both halves at once, so they cannot
# disagree. helpers/catena_admin_release.py states why it resolves the highest
# vX.Y.Z tag rather than :latest.
#
# It runs ON the host, like every other step in this loader: the machine that
# resolves the tag is then the machine that pulls it, so the answer is one the
# host can actually act on.
#
# Skipped entirely when CATENA_ADMIN_IMAGE names one. That is the change-control
# escape hatch -- a client who wants to decide when their panel version moves
# sets it, and this makes no network call at all.
- name: "onbox: resolve the catena-admin release to install"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/catena_admin_release.py
      --repository {{ catena_admin_repository
                      | default('ghcr.io/catenahq/catena-admin', true) | quote }}
    executable: python3
  register: _catena_admin_release
  changed_when: false
  failed_when: false
  when: lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0

# Fails HERE rather than deep in roles/payload, and says which of the two
# reasons it is. A converge cannot proceed without this: the panel image is
# also where the host engines come from, and every role after roles/docker
# depends on those. Nothing downstream has a usable fallback -- the previous
# fallback WAS the stale literal this replaces.
- name: "onbox: the catena-admin release could not be resolved"
  ansible.builtin.fail:
    msg: >-
      Could not resolve which catena-admin image to install:
      {{ (_catena_admin_release.stderr | default('') | trim)
         | default('no output', true) }}
      This converge needs the registry to answer, because the panel image is
      also where the host engines are extracted from. Pin an image explicitly
      with CATENA_ADMIN_IMAGE=ghcr.io/catenahq/catena-admin:vX.Y.Z to converge
      without asking the registry.
  when:
    - lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0
    - (_catena_admin_release.rc | default(1)) != 0

- name: "onbox: publish the resolved catena-admin release"
  ansible.builtin.set_fact:
    catena_admin_release: "{{ _catena_admin_release.stdout | from_json }}"
  when: lookup('env', 'CATENA_ADMIN_IMAGE') | default('', true) | length == 0

- name: "onbox: catena-admin release"
  ansible.builtin.debug:
    msg: >-
      Installing catena-admin {{ catena_admin_release.version }}
      ({{ catena_admin_release.digest }}), resolved from
      {{ catena_admin_release.repository }}.
  when: catena_admin_release is defined
