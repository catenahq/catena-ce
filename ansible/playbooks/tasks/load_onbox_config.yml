---
# 0b: on-box config store loader. THE secret source of truth (SOPS was dropped).
#
# The store is a plaintext 0600 file at /etc/catena/config.json, which rides
# the restic backup (/etc is in roles/backup backup_paths). On every converge
# it ADOPTS the plaintext group_vars vault_* in scope (fill-only -- the
# user-held externals: vendor creds + the admin/restic DR keyset), MINTS any
# missing INTERNAL service secret on-box (reconcile-not-overwrite, via
# helpers/onbox_config.py ensure_internal_secrets -- so internals never touch
# the client's laptop), and set_facts every vault_* from the store so all
# downstream roles read the on-box source of truth.
#
# Included UNCONDITIONALLY from site.yml + validate.yml pre_tasks (runs before
# any role). A rebuild needs only the {restic endpoint, S3 creds, restic
# password} keyset: the store returns with the data, internals and all.

# Capture by NAME first (varnames lookup does not evaluate values), then
# extract only the vault_* values. A blanket `vars | dict2items` would force
# evaluation of EVERY in-scope var -- including role defaults that only
# resolve inside their role (e.g. catena-admin's
# catena_admin_actions_source: "{{ role_path }}/..."), which is undefined in
# play pre_tasks scope and aborts the converge.
- name: "onbox: list in-scope vault_* variable names"
  ansible.builtin.set_fact:
    _onbox_names: "{{ lookup('ansible.builtin.varnames', '^vault_.+$', wantlist=True) }}"
  no_log: true

- name: "onbox: capture those vault_* into a migration map"
  ansible.builtin.set_fact:
    _onbox_capture: "{{ dict(_onbox_names | zip(_onbox_names | map('extract', vars))) }}"
  no_log: true

# Stage the capture map to a 0600 host file: this ansible-core's script
# module has no stdin passthrough, so onbox_config.py reads --adopt-file.
# changed_when: false on the stage + remove pair: they are loader
# scaffolding (a temp file created and deleted within the same play,
# zero net host delta), and reporting them changed made every converge
# recap carry changed>=2 -- which turned the bench's strict changed=0
# idempotency gates (assert_ce_idempotent_rerun) into guaranteed
# failures post-0b.
- name: "onbox: stage the capture map on the host (0600)"
  ansible.builtin.copy:
    dest: /root/.catena-onbox-adopt.json
    content: "{{ _onbox_capture | to_json }}"
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  no_log: true

- name: "onbox: adopt existing secrets, mint missing internal, emit store"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --adopt-file /root/.catena-onbox-adopt.json --emit secrets
    executable: python3
  register: _onbox_emit
  changed_when: false
  no_log: true

- name: "onbox: remove the staged capture map"
  ansible.builtin.file:
    path: /root/.catena-onbox-adopt.json
    state: absent
  changed_when: false
  no_log: true

# Publish every store secret as a fact EXCEPT vault_portainer_api_key.
# That key is minted mid-converge by roles/portainer and reloaded into scope
# via include_vars on the plaintext group_vars vault; a set_fact here (facts
# outrank include_vars) would pin a pre-mint / stale value and shadow the
# freshly-minted one -- on a rewound host the stale key no longer authenticates
# and every Portainer API call 401s. The store still persists the key (adopt on
# the next converge); the portainer role owns it in-flight.
- name: "onbox: publish store secrets as facts (on-box source of truth)"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: >-
    {{ (_onbox_emit.stdout | from_json) | dict2items
       | rejectattr('key', 'in', catena_onbox_fact_exclude) | list }}
  loop_control:
    label: "{{ item.key }}"
  vars:
    catena_onbox_fact_exclude:
      - vault_portainer_api_key
  no_log: true
