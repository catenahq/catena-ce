---
# On-box config store loader. THE secret source of truth.
#
# The store is a plaintext 0600 file at /etc/catena/config.json, which rides
# the restic backup (/etc is in reconcile/roles/backup backup_paths). On every
# run it ADOPTS any declared secret in scope (fill-only) -- on an install that
# is the admin password the install's input file pins, which install-host.sh
# passes as `-e @file`; on any other run nothing is in scope and the store is
# already the truth. It MINTS every missing INTERNAL service secret and the
# user-held admin and console passwords on-box (reconcile-not-overwrite, via
# helpers/onbox_config.py), then set_facts each one from the store so all
# downstream roles read the on-box source of truth. The restic password is
# generated in the panel instead.
#
# Included UNCONDITIONALLY from the pre_tasks of converge.yml, reconcile.yml,
# validate.yml, lockdown.yml and rotate-tailscale.yml (runs before any role). A
# rebuild needs only the {restic endpoint, S3 creds, restic password} keyset:
# the store returns with the data, internals and all.

- name: "onbox: stage the knob registry"
  ansible.builtin.include_tasks:
    file: stage_knob_registry.yml
    apply:
      tags: [always, onbox]
  tags: [always, onbox]

# Which variables count as secrets is DECLARED, in the four category tables
# in helpers/onbox_config.py, and read back here -- captured by declared
# name rather than by a spelling convention, so a variable is captured
# because someone said it is a secret, not because of how it is spelled.
# Asking the module keeps one declaration.
#
# Pure query, no store I/O -- it answers before the store exists on a fresh box.
- name: "onbox: read the declared secret names"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../helpers/onbox_config.py --emit secret-names"
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_known
  changed_when: false

# Capture by NAME first (the varnames lookup does not evaluate values), then
# extract only those values. A blanket `vars | dict2items` would force
# evaluation of EVERY in-scope var -- including role defaults that only
# resolve inside their role (e.g. catena-admin's
# catena_admin_actions_source: "{{ role_path }}/..."), which is undefined in
# play pre_tasks scope and aborts the converge.
- name: "onbox: list the in-scope secret variable names"
  ansible.builtin.set_fact:
    _onbox_names: >-
      {{ lookup('ansible.builtin.varnames',
                '^(' ~ (_onbox_known.stdout | from_json | join('|')) ~ ')$',
                wantlist=True) }}
  no_log: true

- name: "onbox: capture those into a migration map"
  ansible.builtin.set_fact:
    _onbox_capture: "{{ dict(_onbox_names | zip(_onbox_names | map('extract', vars))) }}"
  no_log: true

# Stage the capture map to a 0600 host file: this ansible-core's script
# module has no stdin passthrough, so onbox_config.py reads --adopt-file.
# changed_when: false on the stage + remove pair: they are loader
# scaffolding (a temp file created and deleted within the same play,
# zero net host delta), and a converge that changes nothing reports
# changed=0.
- name: "onbox: stage the capture map on the host (0600)"
  ansible.builtin.copy:
    dest: /root/.catena-onbox-adopt.json
    content: "{{ _onbox_capture | to_json }}"
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  no_log: true

- name: "onbox: adopt existing secrets, mint missing internal, emit store"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --adopt-file /root/.catena-onbox-adopt.json --emit secrets
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_emit
  changed_when: false
  no_log: true

- name: "onbox: remove the staged capture map"
  ansible.builtin.file:
    path: /root/.catena-onbox-adopt.json
    state: absent
  changed_when: false
  no_log: true

# Publish every store secret as a fact, the Portainer API key included: it
# is minted mid-converge by reconcile/roles/portainer, which set_facts the fresh
# value, and a later set_fact wins over an earlier one -- so publishing the
# stored value here is what stops the role re-minting a key on every single
# converge.
- name: "onbox: publish store secrets as facts (on-box source of truth)"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (_onbox_emit.stdout | from_json) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# --- non-secret config: seed once from .env, then read only the store --------
#
# Its own file because bootstrap.yml and show-keyset.yml run THAT and nothing
# else: they need the config half and must not run the rest of this loader,
# which mints the internal secrets.
- name: "onbox: seed and publish the store-owned config"
  ansible.builtin.include_tasks:
    file: seed_onbox_config.yml
    apply:
      tags: [always, onbox]
  tags: [always, onbox]

# --- image pins: what the on-host update lane last applied -------------------
#
# The converge owns TOPOLOGY -- which services exist and how they wire. The
# on-host lane owns IMAGE VERSIONS, and it bumps them between converges. A
# converge that deployed the shipped floor would put every managed bump back,
# so it ASKS. Roles resolve their image through the catena_image_pin
# filter, which takes max(floor, pin) -- see filter_plugins/image_pin.py for why
# neither side can simply win.
#
# A pure query: no mint, no write, answers on a host that has no store yet.
- name: "onbox: read the image pins the on-host update lane recorded"
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../helpers/onbox_config.py
      --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
      --emit image-pins
    executable: python3
  environment:
    CATENA_KNOBS: /root/.catena-knobs.json
  register: _onbox_image_pins
  changed_when: false

- name: "onbox: publish the image pins"
  ansible.builtin.set_fact:
    catena_image_pins: "{{ _onbox_image_pins.stdout | from_json }}"

# --- the catena-admin image this converge runs ------------------------------
#
# Named by whoever starts the converge: install-host.sh names the release it
# installs, and catena-admin's catena-converge the image the panel runs. Either
# way it is the image the running tree came from, so the tree, the engines and
# the panel are one release (catena_admin_image,
# catena-ce/ansible/playbooks/group_vars/all/main.yml). Checked before any
# role, which would otherwise pull or deploy an empty reference.
- name: "onbox: the converge names the catena-admin image it runs"
  ansible.builtin.assert:
    that:
      - catena_admin_image | length > 0
    fail_msg: >-
      CATENA_ADMIN_IMAGE is not set, so this converge does not know which
      catena-admin image it runs. A converge is started by install-host.sh,
      which sets it to the release it installs, or by catena-converge, which
      sets it to the image the panel runs.
    quiet: true
