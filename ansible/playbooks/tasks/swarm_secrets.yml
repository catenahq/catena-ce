---
# Create each swarm secret of `swarm_secrets` ([{name, value}, ...], from the
# swarm_secret_entries filter) that does not exist yet. A name carries its
# value's hash, so a name that exists already holds that value, and a rotated
# value arrives under a new name.
#
# The value reaches `docker secret create` on stdin, never in an argv: /proc
# shows every process's argv to every local user.

- name: "Swarm secrets: which already exist"
  ansible.builtin.command:
    argv: [docker, secret, inspect, "{{ item.name }}"]
  loop: "{{ swarm_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: _swarm_secret_exists
  changed_when: false
  failed_when: false

- name: "Swarm secrets: create the missing ones"
  ansible.builtin.command:
    argv: [docker, secret, create, "{{ item.item.name }}", "-"]
    stdin: "{{ item.item.value }}"
    stdin_add_newline: false
  loop: "{{ _swarm_secret_exists.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: _swarm_secret_create
  changed_when: _swarm_secret_create.rc == 0
  no_log: true
