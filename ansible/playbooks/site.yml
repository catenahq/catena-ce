---
# Main converge: bring a bootstrapped host to the desired state and keep it
# there. Safe to re-run. Runs over Tailscale.
#
# This file is a single atomic unit (one converge), with no cross-playbook
# imports. Composition (preflight + site + validate) lives in the
# installer/CLI, which runs preflight as its own invocation before this.
# Direct invocation runs site alone.
#
# Usage (cwd = ansible/):
#   ansible-playbook -i inventory/example playbooks/site.yml --limit host1

- name: Converge VPS to desired state
  # `stage_hosts` lets a wrapper target a specific host/group via
  # import_playbook + vars. Direct invocation with `--limit` still uses
  # the `vps:` group default.
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true

  vars:
    # Converge-time disk gate. Refuse to converge onto a filesystem at or
    # above crit_pct full, ABORTING before any role writes. Live disk
    # alerting is Beszel's (the disk_watch timer this used to mirror was
    # removed 2026-07-29); this is the install-time refusal, which Beszel
    # cannot provide because it reports rather than blocks.
    converge_disk_preflight_paths: ["/", "/mnt/data"]
    converge_disk_preflight_crit_pct: 90

  # ─── Fail-fast external-service reachability ───────────────────────────
  # Probe every configured external backend the converge depends on BEFORE
  # any heavy role runs, so a dead / unreachable / misconfigured endpoint
  # fails the install in ~10s with a clear message -- not 10-30 min in when
  # the backup role finally writes (a restic-repo-unreachable converge once
  # took 29 min to surface). Probes run ON the VPS (where the backup / mail
  # traffic actually originates), so they catch VM-side network blocks a
  # controller-side check would miss. Values come from the inventory `.env`
  # (dotenv), not role defaults (out of scope in pre_tasks). Bypass for
  # offline dev with -e skip_external_preflight=true.
  pre_tasks:
    # 0b: load the on-box config store (/etc/catena/config.json). Runs FIRST so
    # downstream roles read the on-box secret facts. This is the source of
    # truth now that SOPS was dropped: it adopts the seed's plaintext externals,
    # MINTS every internal service secret on-box, and set_facts them. See
    # tasks/load_onbox_config.yml.
    - name: "0b: load on-box config store"
      # apply: propagate [always] to every task INSIDE the include. Without
      # it, include_tasks fires the include (it is `always`) but the inner
      # set_fact tasks are filtered out under any `converge --tags X` -- the
      # vault_* facts never publish and every role falls back to the raw
      # inventory (placeholder / stale) values. fi_s3 caught this as a
      # poisoned postgres password surviving a `--tags postgres` converge.
      # apply must nest under include_tasks (with file:), not sit as a
      # sibling task key -- a top-level apply conflicts with the action.
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

    # 0c: hard disk-space preflight. A converge onto a critically full
    # filesystem fails deep inside a role (image pull ENOSPC, container
    # write failure) 10-30 min in; refuse up front instead. Complements
    # roles/backup's catena-disk-preflight (backup/restore/auto-update
    # free-bytes aborts) and Beszel's threshold alerting -- this is the
    # converge-time gate. gather_facts already populated ansible_mounts;
    # /mnt/data may be absent on a fresh target (storage role mounts it
    # later), so the selectattr filter checks only mounts that exist now.
    # Bypass for dev with -e skip_disk_preflight=true.
    - name: "Preflight (disk): refuse to converge on a critically full filesystem"
      ansible.builtin.assert:
        that:
          - >-
            ((mnt.size_total - mnt.size_available) / mnt.size_total * 100)
            < (converge_disk_preflight_crit_pct | int)
        fail_msg: >-
          Disk preflight: {{ mnt.mount }} is
          {{ ((mnt.size_total - mnt.size_available) / mnt.size_total * 100)
             | round(1) }}% full
          ({{ (mnt.size_available / 1073741824) | round(2) }} GiB free),
          at or above the {{ converge_disk_preflight_crit_pct }}% converge
          ceiling. Free space before re-running -- a converge onto a full
          disk fails mid-role with no space left on device. Bypass (NOT
          recommended): -e skip_disk_preflight=true
        quiet: true
      loop: >-
        {{ ansible_mounts
           | selectattr('mount', 'in', converge_disk_preflight_paths)
           | selectattr('size_total', 'gt', 0)
           | list }}
      loop_control:
        loop_var: mnt
        label: "{{ mnt.mount }}"
      when: not (skip_disk_preflight | default(false) | bool)
      tags: [always, disk_preflight]

    - name: "Preflight (external): probe configured S3 backends (HEAD, 10s)"
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: HEAD
        timeout: 10
        validate_certs: false
      register: _ext_s3
      failed_when: false # never fail per-probe; the assert below fails once, clearly
      changed_when: false
      loop: >-
        {{ [
             {'name': 'BACKUP_RESTIC_REPO',
              'url': (cfg_backup_restic_repo | default('')
                      | restic_repo_endpoint)},
             {'name': 'BACKUP_WORM_REPO',
              'url': (cfg_backup_worm_repo | default('')
                      | restic_repo_endpoint)},
             {'name': 'NEXTCLOUD_WORM_REPO',
              'url': (cfg_nextcloud_worm_repo | default('')
                      | restic_repo_endpoint)},
           ] | selectattr('url', 'ne', '') | list }}
      loop_control:
        label: "{{ item.name }} -> {{ item.url }}"
      when: not (skip_external_preflight | default(false) | bool)
      tags: [always, external_preflight]

    - name: "Preflight (external): fail fast if any S3 backend is unreachable"
      ansible.builtin.fail:
        msg: |
          External S3 backend(s) unreachable from {{ inventory_hostname }}.
          Failing the install NOW instead of 10-30 min into the converge:
          {% for r in _ext_s3.results | default([]) if (r.status | default(-1)) == -1 %}
            - {{ r.item.name }} ({{ r.item.url }}): {{ r.msg | default('connection failed') }}
          {% endfor %}
          Check the endpoint URL, credentials, region, and network/firewall,
          then re-run. To bypass (NOT recommended): -e skip_external_preflight=true
      when:
        - not (skip_external_preflight | default(false) | bool)
        - _ext_s3.results | default([]) | selectattr('status', 'defined')
          | selectattr('status', 'equalto', -1) | list | length > 0
      tags: [always, external_preflight]

    - name: "Preflight (external): SMTP relay reachable (TCP, 10s)"
      ansible.builtin.wait_for:
        host: "{{ _smtp_host }}"
        port: "{{ _smtp_port | int }}"
        timeout: 10
        state: started
        msg: >-
          SMTP relay {{ _smtp_host }}:{{ _smtp_port }} (SMTP_HOST/SMTP_PORT)
          did not accept a connection within 10s. Keycloak + alert mail would
          fail later in the converge; fix the relay host/port or network, or
          re-run with -e skip_external_preflight=true.
      vars:
        _smtp_host: "{{ cfg_smtp_host | default('') }}"
        _smtp_port: "{{ cfg_smtp_port | default('587') }}"
      when:
        - not (skip_external_preflight | default(false) | bool)
        - (cfg_smtp_host | default('') | length) > 0
      tags: [always, external_preflight]

  # Tags allow iterating on a single role:
  #   ansible-playbook -i inventory/example playbooks/site.yml --limit host1 --tags storage
  # Preflight runs as its own ansible-playbook invocation (the installer
  # runs it first); tag filters here never skip it.
  # Each role's tag matches its name; ufw_lockdown has its own tag so it only
  # runs in a full converge (otherwise it re-probes tailscale0 unnecessarily).
  roles:
    - { role: common, tags: [common] }
    # Anti-container-escape kernel hardening. MUST run after common (needs
    # python3-apt) and BEFORE docker (so /etc/sysctl.d/ files are in place
    # before dockerd's first start; otherwise dockerd's runtime /proc/sys
    # writes win until next boot, leaving Day-1 vs reboot-recovery state
    # divergent). See roles/host_hardening/README.md for the full var-set
    # rationale.
    - { role: host_hardening, tags: [host_hardening, hardening] }
    - { role: tailscale, tags: [tailscale] }
    - { role: storage, tags: [storage] } # mount block volume at /mnt/data (+ optional bulk)
    - { role: docker, tags: [docker] } # Docker CE + single-node swarm init
    # catena-owned reverse proxy (catena-traefik on the catena-network
    # overlay). Runs AFTER docker (which inits the swarm) and BEFORE
    # cloudflare_tunnel, which points cloudflared's ingress at catena-traefik
    # and joins catena-network.
    - { role: traefik, tags: [traefik] } # reverse proxy: catena-traefik + catena-network
    # catena-owned Postgres (catena-postgres swarm service on catena-network),
    # hosting the Keycloak DB. Runs after traefik (needs catena-network) and
    # BEFORE keycloak (which provisions its DB inside it).
    - { role: postgres, tags: [postgres] } # infra Postgres (Keycloak DB)
    # Portainer CE -- the container control plane (Docker + Swarm + later K8s).
    # The CE + EE API seams + catena-admin drive it via its stack API. Runs
    # after postgres (both are swarm services on catena-network).
    - { role: portainer, tags: [portainer] } # container control plane
    # cloudflared swarm service + CF tunnel + wildcard DNS. Runs BEFORE
    # keycloak + oauth2_proxy so the public auth.<zone> URL is reachable
    # by the time oauth2_proxy waits for Keycloak's OIDC discovery doc.
    # Without this ordering, a fresh-target converge would fail in a
    # single-pass site.yml (CF 530 from oauth2_proxy's wait task).
    # Idempotent: subsequent converges find the tunnel + DNS + service
    # already in the desired state and no-op.
    # Not gated on an access mode any more. The role self-defers when the store
    # holds no Cloudflare token (_infra_cf_token_present + cf_activate), which
    # is what ACCESS_MODE=tailnet was originally for and covers it without a
    # second install shape.
    - { role: cloudflare_tunnel, tags: [cloudflare_tunnel, cloudflare] } # CF tunnel + DNS + cloudflared swarm service
    # Keycloak MUST come before oauth2_proxy so its realm exists before
    # oauth2_proxy registers its OIDC client via keycloak-config-cli. Both
    # MUST come before infrastructure so the gated apps' forward-auth chain
    # (rendered by oauth2_proxy) is in place when infrastructure deploys
    # those apps with their Traefik routes.
    - { role: keycloak, tags: [keycloak, auth] } # SSO IdP
    - { role: oauth2_proxy, tags: [oauth2_proxy, auth] } # forward-auth gateway: staff + admin instances
    - { role: infrastructure, tags: [infrastructure] } # recovery archive, gated apps (Gatus, Healthchecks, ...), dashboard-sync, gatus-sync
    # catena-admin host-side state -- runner user, dispatcher, action
    # catalog, bind-mount targets. The Go shell container is deployed via the
    # Portainer stack flow; this role only manages the host prerequisites.
    - { role: catena-admin, tags: [catena_admin] }
    - { role: coturn, tags: [coturn] } # shared TURN/STUN for NC Talk HPB + RC Jitsi (UDP media plane, direct on VPS public IP)
    - { role: backup, tags: [backup] } # restic + the manual oneshot catena-backup.service

  post_tasks:
    # Reconcile the declarative public-port registry. Runs AFTER every role
    # has dropped its /etc/catena/public-ports.d/ fragment + deployed its
    # containers (vps.expose.* labels), so the merged effective set is
    # complete. Applies ufw + DOCKER-USER rules and writes the effective set
    # read by validate.yml. The timer + docker drop-in keep it current at
    # runtime; this is the converge-time anchor.
    - name: "Public ports: reconcile firewall from registry"
      ansible.builtin.systemd_service:
        name: catena-public-ports.service
        state: started
      changed_when: false
      tags: [public_ports]

    # Post-restore seam. A filesystem restore brings back Portainer's own
    # database and every data volume, but the applications stay down (image
    # layers are deliberately not in the backup) and a per-app database may not
    # survive its compose recreate. Finishing that is day-2 work, which this
    # repo does not own: the converge only provides the moment.
    #
    # So this runs whatever is installed in the hook directory and knows nothing
    # about what that is. The management layer drops its own script there; a
    # host with no hooks converges identically to one before this existed. That
    # keeps the dependency pointing one way -- this repo sets the scene, and
    # whatever manages the host afterwards subscribes to it.
    #
    # This is the same shape as /etc/catena/quiesce.d, whose hooks the on-host
    # daily chain runs without this repo knowing their contents.
    #
    # Marker-gated, and the marker is the safety property: it is dropped by
    # roles/backup/tasks/restore.yml and cleared by whichever hook completes the
    # recovery, so an ordinary converge runs nothing and an interrupted recovery
    # is retried by the next one.
    #
    # End of the converge on purpose: the hooks need the control plane the roles
    # above just brought up. A trigger that fired when the marker APPEARED
    # (a systemd path unit) would run before docker exists on the DR path.
    - name: "Post-restore: detect a pending recovery"
      ansible.builtin.stat:
        path: "{{ backup_stats_dir }}/post-restore.needed"
      register: _site_post_restore_marker
      tags: [post_restore]

    - name: "Post-restore: run the installed hooks"
      ansible.builtin.shell: |
        set -u
        ran=0
        failed=0
        for hook in {{ catena_post_restore_hook_dir }}/*.sh; do
            [ -f "$hook" ] || continue
            ran=$((ran + 1))
            echo "== $hook"
            if ! /bin/sh "$hook" 2>&1; then
                echo "== $hook exited non-zero"
                failed=$((failed + 1))
            fi
        done
        echo "HOOKS_RAN=$ran HOOKS_FAILED=$failed"
        # This task only runs when a recovery is PENDING. Zero hooks then is not
        # an empty directory being tolerated, it is a host that restored its data
        # and has nothing installed that knows how to finish: applications stay
        # down (image layers are not in the backup), databases stay unreplayed,
        # and the marker stays. Reporting that as a green converge is how a
        # half-finished recovery gets mistaken for a complete one.
        if [ "$ran" -eq 0 ]; then
            echo "A recovery is pending but {{ catena_post_restore_hook_dir }}" >&2
            echo "holds no hook, so nothing brought the applications back up or" >&2
            echo "replayed their databases. The host payload installs one; if it" >&2
            echo "is absent, the catena-admin payload install did not run." >&2
            echo "Re-run the converge, or install a hook, then re-run: the marker" >&2
            echo "survives so the work is retried rather than skipped." >&2
            exit 1
        fi
        [ "$failed" -eq 0 ]
      args:
        executable: /bin/bash
      # The facts about the scene a hook cannot discover for itself. Passing
      # them is the seam's whole contract: this repo says WHERE things are,
      # the hook decides what to do about them. A hook that guessed /mnt/data
      # would silently do nothing on a host with a different storage mount.
      environment:
        STORAGE_MOUNT_POINT: "{{ storage_mount_point }}"
        CATENA_POST_RESTORE_MARKER: "{{ backup_stats_dir }}/post-restore.needed"
      register: _site_post_restore
      changed_when: "'HOOKS_RAN=0' not in (_site_post_restore.stdout | default(''))"
      when: _site_post_restore_marker.stat.exists | bool
      tags: [post_restore]

    # Surfaced unconditionally, not only on failure: a recovery that half-worked
    # is when someone needs the detail most, and ansible would otherwise swallow
    # it behind a green task. A hook that failed already failed the task above,
    # which is right -- a converge that left a recovery unfinished is not a
    # successful converge, and the marker survives for the retry.
    - name: "Post-restore: hook output"
      ansible.builtin.debug:
        var: _site_post_restore.stdout_lines
      when: _site_post_restore is not skipped
      tags: [post_restore]

    # Final lockdown. Must come AFTER tailscale + infrastructure are healthy,
    # otherwise we lock ourselves out.
    - name: Lock ufw to tailscale-only ingress
      ansible.builtin.include_role:
        name: common
        tasks_from: ufw_lockdown.yml
        # apply: propagates tags to every task inside ufw_lockdown.yml.
        # Without it, `--tags lockdown` would fire the include but then
        # filter out all the inner tasks (they have no "lockdown" tag).
        apply:
          tags: [lockdown]
      tags: [lockdown]

# Post-converge validation runs as its own ansible-playbook invocation
# (playbooks/validate.yml), composed by the installer/CLI after this
# converge. A failed validate still fails the overall run.
#
# The post-restore multi-app redeploy + pg-replay coupling is a
# Business-edition lane and is not part of the Community converge.
