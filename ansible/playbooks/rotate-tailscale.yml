---
# Re-authenticate this node to the tailnet (force re-auth). Maintenance action
# (Community): for a node that lost tailnet reachability or whose tags change.
# Every join mints a fresh key, so this exists for explicit re-auth only.
#
# Run on the host by the panel's re-join action (catena-tailnet-reauth).

- name: Rotate Tailscale auth on VPS nodes
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false

  # WHICH tailnet is a store value: tailnet_provider, tailnet_control_url and
  # tailnet_headscale_user resolve from cfg_* facts with no inventory fallback,
  # so this play loads the store. A re-auth against the wrong control server
  # takes the host further from the tailnet it has lost.
  pre_tasks:
    - name: "Load the on-box config store"
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

  roles:
    - role: tailscale
      vars:
        tailscale_force_reauth: true
