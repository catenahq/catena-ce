---
# The half of a converge a host runs against itself, from the tree inside the
# panel image. On the host, catena-admin's catena-converge copies that tree out
# of the image the panel is running, writes a one-host inventory naming the box
# by its own hostname, applies this playbook, then runs validate.yml's on-host
# checks.
#
# Same roles as converge.yml, in the same order, minus the bootstrap roles,
# which only the install applies, and minus the converge's preflights
# and its tier1_stack render. What is left is the work a host can do to itself:
# render config from the image, reconcile swarm services, install units, apply
# the schedule. boundary.yml declares which roles belong here, and
# tests/unit/test_converge_boundary.py holds the two files to each other.
#
# Every value comes from the on-box store or the image, none from an installer's
# inventory. That test holds at zero the inventory variables a reconcile role
# names directly; a value reached through a derived name escapes its count.
- name: Reconcile a VPS from its on-box configuration
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true

  vars:
    # The floor, here rather than in a role's defaults, because the assertion
    # that reads it runs in pre_tasks where role defaults are not in scope.
    # bootstrap/roles/ansible_runtime carries the same number as
    # ansible_runtime_minimum and tests/unit/test_ansible_runtime_pin.py holds
    # the two together.
    catena_reconcile_min_ansible: "2.20"

  pre_tasks:
    # REFUSE FIRST, and say which version. This runs on a host, unattended,
    # under a transient systemd unit -- so the alternative to one sentence here
    # is a module failing eleven roles in with a message about a keyword, on a
    # machine nobody is watching, having already half-converged it.
    #
    # bootstrap/roles/ansible_runtime installs the range; this is the floor a host may
    # RUN. They are different questions: a host converged a year ago runs
    # whatever ansible-core it received at that converge, and the answer has
    # to come from the runtime rather than from what the current tree would
    # have installed.
    - name: "The ansible-core running this is new enough"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(catena_reconcile_min_ansible, '>=')
        fail_msg: >-
          This reconcile needs ansible-core {{ catena_reconcile_min_ansible }}
          or newer and is running {{ ansible_version.full }}. The runtime at
          /opt/catena/ansible is what the install put there; run the install
          again (`catena-installer install`), which moves it. Refusing here rather
          than failing partway through a converge on a host nobody is watching.
      run_once: true
      tags: [always]

    # The store is the desired state. Loaded first for the same reason converge.yml
    # loads it first: every role below reads cfg_* facts projected from it.
    # include_tasks with apply:, exactly as converge.yml does it and for the reason
    # converge.yml gives: without apply the include fires but the set_fact tasks
    # inside it are filtered out under any --tags run, so every role silently
    # falls back to raw inventory values.
    - name: "Load the on-box config store"
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

    # The version this converge applies, from the image's vendor record, before
    # any role writes. The same file converge.yml includes.
    - name: "Version: stamp the version this converge applies"
      ansible.builtin.include_tasks:
        file: tasks/stamp_version.yml
        apply:
          tags: [stamp_version]
      tags: [stamp_version]

  roles:
    - { role: payload, tags: [payload] }
    # Right after the payload that installs the reconciler, as in converge.yml:
    # every role below drops a fragment into the registry it wires up.
    - { role: public_ports, tags: [public_ports] }
    - { role: host_maintenance, tags: [host_maintenance] }
    - { role: swarm, tags: [swarm] }
    - { role: traefik, tags: [traefik] }
    - { role: postgres, tags: [postgres] }
    - { role: portainer, tags: [portainer] }
    # `edge` marks what moves or checks the public edge (this role, the mail
    # and TURN A records, the public-URL probes). A restore converges with
    # --skip-tags edge; tests/unit/test_restore_converge_leaves_the_edge_alone.py.
    - { role: cloudflare_tunnel, tags: [cloudflare_tunnel, cloudflare, edge] }
    - { role: keycloak, tags: [keycloak, auth] }
    - { role: oauth2_proxy, tags: [oauth2_proxy, auth] }
    - { role: infrastructure, tags: [infrastructure] }
    # The panel's container and its action catalog. Its trust path -- the runner
    # account, the sudoers drop-in, the forced command -- is the bootstrap-side
    # bootstrap/roles/catena_admin_host.
    - { role: catena-admin, tags: [catena_admin] }
    - { role: coturn, tags: [coturn] }
    - { role: backup, tags: [backup] }

  post_tasks:
    # The tail converge.yml ends on too.
    - name: "Converge tail: ports, drift, prune, release"
      ansible.builtin.include_tasks:
        file: tasks/converge_tail.yml
      vars:
        catena_converge_path: reconcile
      tags: [public_ports, bootstrap_drift, prune, release_manifest]
