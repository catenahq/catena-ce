---
# Mint the passwords the install shows (admin + console) when the store has
# none, and hand them to the installer ONCE with the journal verification key
# and the first-login URLs.
#
# `catena-cli install` runs it right after bootstrap, before the converge, so
# the block is on screen while the long part of the install runs; the installer
# prints it then and again when the install ends. The passwords are minted
# ON-BOX (helpers/onbox_config.py USER_HELD_SECRETS), and the block reaches the
# controller only as a transient 0600 file the installer reads and deletes. The
# backup encryption password is not among them: the client generates it in the
# panel, beside the repository it encrypts.
#
# Everything the user must write down is in the FINAL task, as one block. The
# mint, the reads and the FSS delete run ahead of it.
#
# Usage (driven by `catena-cli install`; cwd = ansible/):
#   ansible-playbook -i inventory/<name> playbooks/show-keyset.yml -e keyset_out=<dir>

- name: Surface the DR keyset once
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false

  # The admin email, the domain and the subdomains the URLs are built from are
  # store keys, published as cfg_* facts by the seed half of the loader.
  pre_tasks:
    - name: "onbox: publish the store-owned config"
      ansible.builtin.include_tasks:
        file: tasks/seed_onbox_config.yml

  tasks:
    # The journal's tamper-evidence key (bootstrap/roles/common stages it at mint time).
    # Read it, show it, then DELETE it below: whoever holds this key can
    # re-seal an altered journal, so a copy left on the box would defeat the
    # very thing it proves. Absent = FSS was already set up on an earlier run
    # and the key was surfaced then.
    - name: Read the staged FSS verification key
      ansible.builtin.slurp:
        src: /etc/catena/fss-verification-key.pending
      register: _fss_pending
      failed_when: false
      no_log: true

    # The script module ships onbox_config.py alone; the knob registry it reads
    # is staged from this same checkout (see tasks/load_onbox_config.yml).
    - name: Stage the knob registry for the store helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../helpers/knobs.json"
        dest: /root/.catena-knobs.json
        owner: root
        group: root
        mode: "0644"

    # Only the passwords shown here are minted; the internal secrets stay the
    # converge loader's. An admin password the install pins (install.yaml,
    # threaded in as `-e @file`) is adopted first, fill-only like the loader's
    # adopt, so the pin is the password shown and the one the converge creates
    # the admins with. It reaches the helper through a 0600 file, off the
    # host's command line.
    - name: "Store: the shown passwords, adopting a pin"
      block:
        - name: Stage the install's admin password pin (0600)
          ansible.builtin.copy:
            dest: /root/.catena-onbox-adopt.json
            content: "{{ {'admin_password': admin_password} | to_json }}"
            owner: root
            group: root
            mode: "0600"
          when: admin_password is defined
          no_log: true

        - name: Mint the shown passwords if absent, and read the store
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/../helpers/onbox_config.py
              --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
              --mint-user-held --emit all
              {{ '--adopt-file /root/.catena-onbox-adopt.json' if admin_password is defined else '' }}
            executable: python3
          environment:
            CATENA_KNOBS: /root/.catena-knobs.json
          register: _dr_store
          changed_when: false
          no_log: true
      always:
        - name: Remove the staged admin password pin
          ansible.builtin.file:
            path: /root/.catena-onbox-adopt.json
            state: absent
          no_log: true

    # Removed BEFORE the hand-off, not after. Its content is already in
    # _fss_pending above, so the block still carries it; deleting first is what
    # makes the removal unconditional. A key left behind silently voids the
    # seal it proves, which is worse than a key never shown -- so the delete
    # must not be reachable only through a hand-off that rendered.
    - name: Remove the staged FSS verification key from the server
      ansible.builtin.file:
        path: /etc/catena/fss-verification-key.pending
        state: absent

    # ONE task, and the LAST one. Everything the user has to write down is in
    # this single block on purpose: the installer prints it as one piece, and
    # these values are shown once. One file per host in the installer's 0700
    # directory, and no_log because the installer is what shows it. The URLs
    # live here rather than in the inventory template because the ports are
    # defaults nobody customizes and the hostnames only resolve once the tunnel
    # is up.
    - name: "SAVE THIS -- passwords and first-login URLs, shown once"
      ansible.builtin.copy:
        dest: "{{ keyset_out }}/{{ inventory_hostname }}"
        content: "{{ _banner }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      vars:
        _secrets: "{{ (_dr_store.stdout | from_json).secrets }}"
        _fss: >-
          {{ (_fss_pending.content | b64decode).strip()
             if (_fss_pending.content is defined) else '' }}
        _admin_port: "{{ catena_admin_ui_port | default(9010) }}"
        _banner: |
          ==================================================================
          SAVE THESE TO YOUR PASSWORD MANAGER NOW -- shown once.

            Admin password (Portainer + Keycloak): {{ _secrets.admin_password }}
            Console password for `{{ ops_user | default('ops') }}` (break-glass): {{ _secrets.console_recovery_password }}

          The backup encryption password is generated in the panel, under
          Settings > Backup, with the repository it encrypts: save it then.
          With it plus your S3 keys and repository address a wiped server is
          rebuilt from backup; without it the backups cannot be restored, by
          anyone.

          The console password is your way back in when the network path is
          gone. SSH refuses it (key-only); it works at the provider web
          console (KVM/serial) or a physical keyboard, and nowhere else.
          {% if _fss %}

            Journal verification key (tamper evidence):

          {{ _fss }}

          This key proves the server's own log of administrative actions was
          not altered after the fact (`journalctl --verify` on the server).
          Store it OFF the server: anyone holding it can re-seal an edited
          journal. The server's copy has already been deleted -- what is
          printed above is the only one left.
          {% endif %}
          ------------------------------------------------------------------
          First login, once the install has finished. Same password
          everywhere; the USERNAME differs per service, so it is spelled out
          per service below.

            catena-admin panel  http://localhost:{{ _admin_port }}  (over the SSH forward below)
          {% if not (catena_public_surface_deferred | bool) %}
                                https://{{ catena_admin_hostname }}
          {% endif %}
                                username: {{ admin_email }}

            Portainer           http://localhost:{{ portainer_ui_port }}  (over the SSH forward below)
          {% if not (catena_public_surface_deferred | bool) %}
                                https://{{ portainer_admin_hostname }}
          {% endif %}
                                username: admin
                                (the literal word `admin`, NOT an email address --
                                 Portainer's first-boot admin has no email field)

          The localhost addresses work whenever SSH does, through a forward
          as the `{{ catena_panel_user }}` account, which can only forward:

            ssh -N -L {{ _admin_port }}:127.0.0.1:{{ _admin_port }} -L {{ portainer_ui_port }}:127.0.0.1:{{ portainer_ui_port }} {{ catena_panel_user }}@{{ ansible_host }}

          Enter the domain, backups and the private network in the panel's
          Settings.
          {% if not (catena_public_surface_deferred | bool) %}

          The public hostnames are SSO-gated and go through the Cloudflare
          tunnel. There the SSO gate asks first, and it wants {{ admin_email }}.
          The service's own login form comes after it, and asks for the
          username listed above -- so reaching Portainer through the tunnel
          means the email once, then `admin`.
          {% endif %}
          ==================================================================
