---
# Main converge: bring a bootstrapped host to the desired state and keep it
# there. Safe to re-run. Runs over Tailscale.
#
# This file is a single atomic unit (one converge), with no cross-playbook
# imports. Composition (preflight + site + validate) lives in the
# installer/CLI, which runs preflight as its own invocation before this.
# Direct invocation runs site alone.
#
# Usage (cwd = ansible/):
#   ansible-playbook -i inventory/<name> playbooks/converge.yml --limit host1

- name: Converge VPS to desired state
  # `stage_hosts` lets a wrapper target a specific host/group via
  # import_playbook + vars. Direct invocation with `--limit` still uses
  # the `vps:` group default.
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true

  vars:
    # Converge-time disk gate. Refuse to converge onto a filesystem at or
    # above crit_pct full, ABORTING before any role writes. Live disk
    # alerting is Beszel's; this is the install-time refusal, which Beszel
    # cannot provide because it reports rather than blocks.
    converge_disk_preflight_paths: ["/", "/srv/catena"]
    converge_disk_preflight_crit_pct: 90

  # ─── Fail-fast external-service reachability ───────────────────────────
  # Probe every configured external backend the converge depends on BEFORE
  # any heavy role runs, so a dead / unreachable / misconfigured endpoint
  # fails the install in ~10s with a clear message -- not 10-30 min in when
  # the backup role finally writes (a restic-repo-unreachable converge once
  # took 29 min to surface). Probes run ON the VPS (where the backup / mail
  # traffic actually originates), so they catch VM-side network blocks a
  # controller-side check would miss. Values come from the inventory `.env`
  # (dotenv), not role defaults (out of scope in pre_tasks). Bypass for
  # offline dev with -e skip_external_preflight=true.
  pre_tasks:
    # Load the on-box config store (/etc/catena/config.json). Runs FIRST so
    # downstream roles read the on-box secret facts. It is the source of
    # truth: it adopts the seed's plaintext externals, MINTS every internal
    # service secret on-box, and set_facts them. See
    # tasks/load_onbox_config.yml.
    - name: "0b: load on-box config store"
      # apply: propagate [always] to every task INSIDE the include. Without
      # it, include_tasks fires the include (it is `always`) but the inner
      # set_fact tasks are filtered out under any `converge --tags X` -- the
      # vault_* facts never publish and every role falls back to the raw
      # inventory (placeholder / stale) values. fi_s3 caught this as a
      # poisoned postgres password surviving a `--tags postgres` converge.
      # apply must nest under include_tasks (with file:), not sit as a
      # sibling task key -- a top-level apply conflicts with the action.
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

    # Hard disk-space preflight. A converge onto a critically full
    # filesystem fails deep inside a role (image pull ENOSPC, container
    # write failure) 10-30 min in; refuse up front instead. Complements the
    # backup's own free-bytes abort (catena-disk-preflight, in the catena-admin
    # payload) and Beszel's threshold alerting -- this is the converge-time
    # gate. gather_facts already populated ansible_mounts;
    # /srv/catena may be absent on a fresh target (storage role mounts it
    # later), so the selectattr filter checks only mounts that exist now.
    # Bypass for dev with -e skip_disk_preflight=true.
    - name: "Preflight (disk): refuse to converge on a critically full filesystem"
      ansible.builtin.assert:
        that:
          - >-
            ((mnt.size_total - mnt.size_available) / mnt.size_total * 100)
            < (converge_disk_preflight_crit_pct | int)
        fail_msg: >-
          Disk preflight: {{ mnt.mount }} is
          {{ ((mnt.size_total - mnt.size_available) / mnt.size_total * 100)
             | round(1) }}% full
          ({{ (mnt.size_available / 1073741824) | round(2) }} GiB free),
          at or above the {{ converge_disk_preflight_crit_pct }}% converge
          ceiling. Free space before re-running -- a converge onto a full
          disk fails mid-role with no space left on device. Bypass (NOT
          recommended): -e skip_disk_preflight=true
        quiet: true
      loop: >-
        {{ ansible_mounts
           | selectattr('mount', 'in', converge_disk_preflight_paths)
           | selectattr('size_total', 'gt', 0)
           | list }}
      loop_control:
        loop_var: mnt
        label: "{{ mnt.mount }}"
      when: not (skip_disk_preflight | default(false) | bool)
      tags: [always, disk_preflight]

    - name: "Preflight (external): probe configured S3 backends (HEAD, 10s)"
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: HEAD
        timeout: 10
        validate_certs: false
      register: _ext_s3
      failed_when: false # never fail per-probe; the assert below fails once, clearly
      changed_when: false
      # Only the repository this host backs up TO. The offsite copies are
      # not install inputs -- they are declared in the panel afterwards, and
      # the lane that reads them fails soft on an unreachable destination by
      # design, so failing an install over one would contradict the contract
      # the lane is built on. The panel validates a copy when it is saved,
      # which is where the mistake was made.
      loop: >-
        {{ [
             {'name': 'BACKUP_RESTIC_REPO',
              'url': (cfg_backup_restic_repo | default('')
                      | restic_repo_endpoint)},
           ] | selectattr('url', 'ne', '') | list }}
      loop_control:
        label: "{{ item.name }} -> {{ item.url }}"
      when: not (skip_external_preflight | default(false) | bool)
      tags: [always, external_preflight]

    - name: "Preflight (external): fail fast if any S3 backend is unreachable"
      ansible.builtin.fail:
        msg: |
          External S3 backend(s) unreachable from {{ inventory_hostname }}.
          Failing the install NOW instead of 10-30 min into the converge:
          {% for r in _ext_s3.results | default([]) if (r.status | default(-1)) == -1 %}
            - {{ r.item.name }} ({{ r.item.url }}): {{ r.msg | default('connection failed') }}
          {% endfor %}
          Check the endpoint URL, credentials, region, and network/firewall,
          then re-run. To bypass (NOT recommended): -e skip_external_preflight=true
      when:
        - not (skip_external_preflight | default(false) | bool)
        - _ext_s3.results | default([]) | selectattr('status', 'defined')
          | selectattr('status', 'equalto', -1) | list | length > 0
      tags: [always, external_preflight]

    - name: "Preflight (external): SMTP relay reachable (TCP, 10s)"
      ansible.builtin.wait_for:
        host: "{{ _smtp_host }}"
        port: "{{ _smtp_port | int }}"
        timeout: 10
        state: started
        msg: >-
          SMTP relay {{ _smtp_host }}:{{ _smtp_port }} (SMTP_HOST/SMTP_PORT)
          did not accept a connection within 10s. Keycloak + alert mail would
          fail later in the converge; fix the relay host/port or network, or
          re-run with -e skip_external_preflight=true.
      vars:
        _smtp_host: "{{ cfg_smtp_host | default('') }}"
        _smtp_port: "{{ cfg_smtp_port | default('587') }}"
      # Only the `server` choice. The two known providers resolve their host
      # inside reconcile/roles/keycloak, and reproducing that mapping here would be a
      # second copy of it, free to drift from the one the realm is rendered
      # from -- for a probe of an endpoint whose reachability is the provider's
      # problem, not the client's.
      when:
        - not (skip_external_preflight | default(false) | bool)
        - (cfg_smtp_provider | default('') | trim | lower) == 'server'
        - (cfg_smtp_host | default('') | length) > 0
      tags: [always, external_preflight]

  # Tags allow iterating on a single role:
  #   ansible-playbook -i inventory/<name> playbooks/converge.yml --limit host1 --tags storage
  # Preflight runs as its own ansible-playbook invocation (the installer
  # runs it first); tag filters here never skip it.
  # Each role's tag matches its name.
  #
  # Closing public 22 is NOT here. It is playbooks/lockdown.yml, which the
  # install chain runs last and the panel's toggle drives: a converge is
  # something a host runs on itself, and the one step that can make it
  # unreachable is a decision taken once rather than re-taken every run.
  roles:
    - { role: common, tags: [common] }
    # The declarative public-port registry. It sits right after common and
    # before every role that drops a fragment into it. Needs no Docker -- it
    # creates the docker.service.d drop-in dir itself, and systemd reads
    # drop-ins only once docker.service exists.
    - { role: public_ports, tags: [public_ports] }
    # Anti-container-escape kernel hardening. MUST run after common (needs
    # python3-apt) and BEFORE docker (so /etc/sysctl.d/ files are in place
    # before dockerd's first start; otherwise dockerd's runtime /proc/sys
    # writes win until next boot, leaving Day-1 vs reboot-recovery state
    # divergent). See bootstrap/roles/host_hardening/README.md for the full var-set
    # rationale.
    - { role: host_hardening, tags: [host_hardening, hardening] }
    # Skipped entirely on a host whose access method is public SSH: there is no
    # tailnet to join, and installing the daemon anyway would leave a node this
    # host never authenticates and a tailscale0 that never appears.
    - role: tailscale
      tags: [tailscale]
      when: catena_access_method == 'tailnet'
    - { role: storage, tags: [storage] } # mount block volume at /srv/catena (+ optional bulk)
    - { role: docker, tags: [docker] } # Docker CE + single-node swarm init
    # Host engine payload (catena-cloudflared-sync, catena-recovery,
    # catena-schedule, catena-daily, the lanes + units), extracted from the
    # public catena-admin image. Needs docker and nothing else, and every role
    # from here down may assume /usr/local/bin/catena-* exists. cloudflare_tunnel
    # five roles below fixes the deadline: an engine that lands any later leaves
    # a first converge with no tunnel, and oauth2_proxy then waits on an edge
    # nobody has brought up. See reconcile/roles/payload/README.md.
    - { role: payload, tags: [payload] } # host engine binaries + units
    # catena-owned reverse proxy (catena-traefik on the catena-network
    # overlay). Runs AFTER docker (which inits the swarm) and BEFORE
    # cloudflare_tunnel, which points cloudflared's ingress at catena-traefik
    # and joins catena-network.
    - { role: traefik, tags: [traefik] } # reverse proxy: catena-traefik + catena-network
    # catena-owned Postgres (catena-postgres swarm service on catena-network),
    # hosting the Keycloak DB. Runs after traefik (needs catena-network) and
    # BEFORE keycloak (which provisions its DB inside it).
    - { role: postgres, tags: [postgres] } # infra Postgres (Keycloak DB)
    # Portainer CE -- the container control plane (Docker + Swarm + later K8s).
    # The CE + EE API seams + catena-admin drive it via its stack API. Runs
    # after postgres (both are swarm services on catena-network).
    - { role: portainer, tags: [portainer] } # container control plane
    # cloudflared swarm service + CF tunnel + wildcard DNS. Runs BEFORE
    # keycloak + oauth2_proxy so the public auth.<zone> URL is reachable
    # by the time oauth2_proxy waits for Keycloak's OIDC discovery doc.
    # Without this ordering, a fresh-target converge would fail in a
    # single-pass converge.yml (CF 530 from oauth2_proxy's wait task).
    # Idempotent: subsequent converges find the tunnel + DNS + service
    # already in the desired state and no-op.
    # No access-mode gate. The role self-defers when the store holds no
    # Cloudflare token, or its engine is not on the host yet, so one install
    # shape covers both the tailnet-only host and the tunnelled one.
    - { role: cloudflare_tunnel, tags: [cloudflare_tunnel, cloudflare] } # CF tunnel + DNS + cloudflared swarm service
    # Keycloak MUST come before oauth2_proxy so its realm exists before
    # oauth2_proxy registers its OIDC client via keycloak-config-cli. Both
    # MUST come before infrastructure so each gated app's oauth2-proxy
    # instance and route (rendered by oauth2_proxy) is in place when
    # infrastructure deploys those apps with their Traefik routes.
    - { role: keycloak, tags: [keycloak, auth] } # SSO IdP
    - { role: oauth2_proxy, tags: [oauth2_proxy, auth] } # one auth proxy per gated upstream
    - { role: infrastructure, tags: [infrastructure] } # gated apps (Gatus, Healthchecks, ...), dashboard-sync, gatus-sync
    # The reboot-required probe. After infrastructure because it reports
    # through the Healthchecks plane that role deploys.
    - { role: host_maintenance, tags: [host_maintenance] }
    # The panel's trust path: the runner account, the sudoers drop-in, the
    # forced command and its authorized_keys, plus the env files the host lanes
    # read. BOOTSTRAP-side -- a reconcile that could rewrite the way in could
    # rewrite what a reconcile is -- and immediately before the role it
    # prepares for.
    - { role: catena_admin_host, tags: [catena_admin, catena_admin_host] }
    # catena-admin: the action catalog, the bind-mount targets, AND the Go shell
    # container, created directly against the local swarm. It holds the API key
    # that drives Portainer, so it cannot depend on Portainer to run: the one
    # tool that can repair a Portainer that will not start must not be deployed
    # by it.
    - { role: catena-admin, tags: [catena_admin] }
    - { role: coturn, tags: [coturn] } # shared TURN/STUN for NC Talk HPB + RC Jitsi (UDP media plane, direct on VPS public IP)
    - { role: backup, tags: [backup] } # restic + the manual oneshot catena-backup.service

  post_tasks:
    # Reconcile the declarative public-port registry. Runs AFTER every role
    # has dropped its /etc/catena/public-ports.d/ fragment + deployed its
    # containers (vps.expose.* labels), so the merged effective set is
    # complete. Applies ufw + DOCKER-USER rules and writes the effective set
    # read by validate.yml. The timer + docker drop-in keep it current at
    # runtime; this is the converge-time anchor.
    - name: "Public ports: reconcile firewall from registry"
      ansible.builtin.systemd_service:
        name: catena-public-ports.service
        state: started
      changed_when: false
      tags: [public_ports]

    # Render the control plane and the app companions as compose files and
    # prove they load. Applies nothing: the services were already created and
    # reconciled by the catena-tier1 engine, role by role, as each contributed
    # its spec. This is the oracle -- `docker stack config` type-checking the
    # same dicts against the docker actually installed.
    #
    # In post_tasks rather than the roles list, so it renders the specs every
    # role above contributed.
    #
    # `apply:` carries the tag inward for the same reason the includes above
    # do: without it, `--tags tier1_stack` fires the include and then filters
    # out every task inside it.
    - name: "Tier 1: render + validate the swarm-service oracle files"
      ansible.builtin.include_role:
        name: tier1_stack
        apply:
          tags: [tier1_stack]
      tags: [tier1_stack]

    # Report -- never repair -- changes to the files boundary.yml puts on the
    # operator's side. A converge does not write them; this task is what keeps
    # that rule from also meaning blindness to them.
    - name: "Bootstrap drift: report changes to operator-owned files"
      ansible.builtin.include_tasks:
        file: tasks/report_bootstrap_drift.yml
        apply:
          tags: [bootstrap_drift]
      vars:
        catena_converge_path: converge
      tags: [bootstrap_drift]

    # Remove what a previous converge installed and this one does not ship.
    # Before the release manifest, so a converge that fails here does not
    # record itself as finished.
    - name: "Prune: remove files withdrawn from the product"
      ansible.builtin.include_tasks:
        file: tasks/prune_withdrawn_files.yml
        apply:
          tags: [prune]
      vars:
        catena_converge_path: converge
      tags: [prune]

    # Record what this converge delivered. The tasks live in
    # tasks/record_release_manifest.yml, shared with playbooks/reconcile.yml so
    # an on-host converge stamps the same fields rather than leaving them
    # describing the last converge an operator ran.
    - name: "Release: record what this converge delivered"
      ansible.builtin.include_tasks:
        file: tasks/record_release_manifest.yml
        apply:
          tags: [release_manifest]
      vars:
        catena_converge_path: converge
      tags: [release_manifest]

# Post-converge validation runs as its own ansible-playbook invocation
# (playbooks/validate.yml), composed by the installer/CLI after this
# converge. A failed validate still fails the overall run.
