---
# Validation orchestrator: the checks a server runs on itself, so a service
# that only answers on the box is not mistaken for a working one.
#
#   1. On-host  -- each role's own tasks/validate.yml, and the test email
#   2. Access   -- the two UIs on the host's loopback, the public hostnames
#                  once a domain is set, the host's published ports
#
# The install's last step: ansible/install-host.sh runs both, and the
# installer then checks the server from the client's machine (the public
# port scan, the container network unreachable from outside). catena-converge
# runs vantage 1 after every converge that applies reconcile.yml. With no
# domain, tailnet or backup in the store yet, the checks that need one skip and
# say so.

- name: "Vantage 1 -- on-host checks via per-role validate.yml"
  # Each role under test ships its own tasks/validate.yml, invoked via
  # include_role + tasks_from so each role gets first-class Ansible
  # diagnostics (named asserts, structured fail_msg) on its own fixtures,
  # from first-party Ansible primitives (stat, slurp, package_facts,
  # service_facts, command, assert) with no extra runtime dependency.
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true
  tags: [validate_role, vantage1]
  vars:
    # Source of truth for which roles have on-host validation tasks.
    # Adding a role here without a companion roles/<role>/tasks/
    # validate.yml file will fail loudly at include time -- good, means
    # the list stays honest.
    # The list stays a literal: the audit's ansible parser resolves the
    # validate.yml -> role edges from it statically.
    validate_roles:
      - common
      - host_hardening
      - tailscale
      - storage
      - docker
      - host_maintenance
      - swarm
      - traefik
      - postgres
      - backup
      - infrastructure
      - keycloak
      - oauth2_proxy
      - coturn
    # reconcile/roles/infrastructure/tasks/validate.yml carries the cloudflared
    # swarm check for the tunnel reconcile/roles/cloudflare_tunnel brings up.

  pre_tasks:
    # Load the on-box config store so the validate checks that read its
    # secrets (the Keycloak admin login smoke test) see them. See
    # tasks/load_onbox_config.yml.
    - name: "Load on-box config store"
      ansible.builtin.include_tasks: tasks/load_onbox_config.yml
      tags: [always, onbox]

  tasks:
    - name: "validate: run each role's validate.yml"
      ansible.builtin.include_role:
        name: "{{ _validate_role }}"
        tasks_from: validate
      loop: "{{ validate_roles }}"
      loop_control:
        # Rename the loop var so child role loops using `item` don't
        # collide with the parent's binding (triggers a noisy warning
        # from ansible-core 2.20).
        loop_var: _validate_role
        label: "{{ _validate_role }}"

# DR SMTP positive smoke test (Keycloak / Phase Two)
#
# Uses kcadm.sh (the Keycloak Admin REST CLI shipped in the
# server image) to:
#   1. authenticate as the master-realm admin,
#   2. trigger sendverifyemail against the bootstrap admin user in the
#      `vps` realm.
# Keycloak's worker reads the realm-level smtpServer config (rendered
# by reconcile/roles/keycloak's realm-config import), connects out, and dispatches
# the email. Empty / missing SMTP config short-circuits to a "verifyEmail
# requires email server" error which we catch as a fast-fail.
#
# Atomicity: gated on /health/ready -- the canonical "DB pool is up,
# migrations done, admin REST is accepting tokens" signal.
#
# Skip when the host has no SMTP configured at all (SMTP_PROVIDER unset): the
# contract is "if SMTP is supposed to work, prove it works", not "demand
# SMTP."

- name: "Vantage 1b -- Keycloak SMTP reachability (on-host)"
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false
  tags: [smtp, vantage1]
  vars:
    _smtp_enabled: >-
      {{
        (cfg_smtp_provider | default('') | trim | lower)
        in ['resend', 'brevo', 'server']
      }}
    # The store, not the inventory: ADMIN_EMAIL lives in the on-box config
    # with the zone; this play already loads it, and reading .env here would be
    # the second live reader the whole seed-once design exists to remove -- the
    # one that answers with a stale value nobody edited.
    _bootstrap_email: "{{ admin_email | default('') }}"

  tasks:
    - name: "Keycloak: find running server container"
      ansible.builtin.shell: |
        set -o pipefail
        docker ps --format '{{ "{{" }}.Names{{ "}}" }}' \
          | grep -E '{{ "keycloak" | swarm_container_regex("server") }}' \
          | head -n1 || true
      args:
        executable: /bin/bash
      register: _keycloak_server_ct
      changed_when: false
      when: _smtp_enabled | bool

    - name: "Keycloak: gate test on management port readiness"
      # Phase Two image (quay.io/phasetwo/phasetwo-keycloak) ships
      # without curl, and Keycloak 26 split health to management port
      # 9000 (NOT 8080 -- 8080 only serves OIDC + admin REST). So the
      # probe speaks HTTP over bash /dev/tcp and reads the answer.
      #
      # ACCEPTING A CONNECTION IS NOT BEING READY. Quarkus binds BOTH
      # listeners before Keycloak finishes bootstrapping, and the login
      # below lands on 8080 during that window:
      #
      #   03:32:16.067  started ... Listening on: http://0.0.0.0:8080.
      #                 Management interface listening on http://0.0.0.0:9000.
      #   03:32:18.599  BootstrapFilter: Request received during
      #                 bootstrapping, returning a 503 error. Use the
      #                 readiness health endpoint to ensure the service is
      #                 ready before forwarding requests to the service.
      #   03:32:19.555  Bootstrap completed in 3.563000 seconds
      #
      # A bare TCP connect passed at 16.07 and the gate let kcadm through
      # 3.5s too early. /health/ready reports the "Keycloak Initialized"
      # check, which is the state the login actually needs.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_server_ct.stdout }}"
          - bash
          - -c
          - >-
            exec 3<>/dev/tcp/127.0.0.1/9000 &&
            printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
            cat <&3
      register: _keycloak_ready
      changed_when: false
      retries: 30
      delay: 4
      until:
        - _keycloak_ready.rc == 0
        # The STATUS LINE, not the body: /health/ready answers 503 while
        # bootstrapping, and its body still carries "status": "UP" for the
        # individual checks that already passed. Matching the body would
        # pass on exactly the response this gate exists to wait out.
        - "'200' in ((_keycloak_ready.stdout | default('')).splitlines() | first | default(''))"
      when:
        - _smtp_enabled | bool
        - (_keycloak_server_ct.stdout | default('') | length) > 0

    - name: "Keycloak: kcadm login as master-realm admin"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - config
          - credentials
          - --server
          - "http://localhost:8080"
          - --realm
          - master
          - --user
          - "{{ _bootstrap_email }}"
          - --password
          - "{{ admin_password }}"
      register: _kc_login
      changed_when: false
      no_log: true
      when:
        - _smtp_enabled | bool
        - (_keycloak_server_ct.stdout | default('') | length) > 0

    # The Phase Two kcadm.sh ships only 9 top-level commands (config,
    # create, get, update, delete, get-roles, add-roles, remove-roles,
    # set-password) -- no `sendverifyemail` convenience subcommand.
    # The equivalent path uses the Admin REST endpoint directly:
    # PUT /admin/realms/{realm}/users/{id}/send-verify-email, which
    # kcadm exposes as `update users/{id}/send-verify-email -r {realm}`.
    # That requires the user-id; we look it up by username first.
    - name: "Keycloak: look up admin user-id in vps realm"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - get
          - users
          - -r
          - "{{ keycloak_realm | default('vps') }}"
          - -q
          - "username={{ _bootstrap_email }}"
          - --fields
          - id
      register: _kc_user_lookup
      changed_when: false
      when:
        - _smtp_enabled | bool
        - (_keycloak_server_ct.stdout | default('') | length) > 0
        - _kc_login is succeeded

    - name: "Keycloak: parse admin user-id"
      ansible.builtin.set_fact:
        _kc_admin_user_id: >-
          {{
            (_kc_user_lookup.stdout | default('[]') | from_json | first | default({})).get('id', '')
          }}
      when:
        - _smtp_enabled | bool
        - _kc_user_lookup is defined
        - _kc_user_lookup is succeeded

    - name: "Keycloak: send-verify-email to admin in vps realm"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ _keycloak_server_ct.stdout }}"
          - /opt/keycloak/bin/kcadm.sh
          - update
          - "users/{{ _kc_admin_user_id }}/send-verify-email"
          - -r
          - "{{ keycloak_realm | default('vps') }}"
      register: _kc_send_verify
      changed_when: false
      when:
        - _smtp_enabled | bool
        - (_keycloak_server_ct.stdout | default('') | length) > 0
        - _kc_login is succeeded
        - (_kc_admin_user_id | default('') | length) > 0
      # kcadm update on send-verify-email returns 0 if the realm has
      # SMTP wired AND the worker accepts the dispatch. A real SMTP
      # failure surfaces in `docker logs <keycloak-server>` (the worker
      # logs the SMTP exception) but that asynchronous path doesn't
      # influence rc here. Treat any non-zero rc as a real failure.
      failed_when: false

    # Surface the actual SMTP exception from the keycloak worker on
    # send-verify failure. The kcadm CLI returns a generic "Failed to
    # send verify email" with rc=1; the real cause (rate limit, bad
    # creds, sender domain not verified, network) is logged by the
    # worker. Capture + emit so we don't have to SSH in to diagnose.
    - name: "Keycloak: capture worker logs on SMTP failure"
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --tail
          - "200"
          - "{{ _keycloak_server_ct.stdout }}"
      register: _kc_logs_on_smtp_fail
      changed_when: false
      failed_when: false
      when:
        - _smtp_enabled | bool
        - _kc_send_verify is defined
        - _kc_send_verify.rc | default(0) != 0

    - name: "Keycloak: surface SMTP failure with worker logs"
      ansible.builtin.fail:
        msg: |
          Keycloak send-verify-email to {{ _bootstrap_email }} failed
          (kcadm rc={{ _kc_send_verify.rc }}, stderr={{ _kc_send_verify.stderr | default('') | trim }}).

          Worker logs (last 200 lines, filtered for mail):
          {{ (_kc_logs_on_smtp_fail.stdout_lines | default([]) +
              _kc_logs_on_smtp_fail.stderr_lines | default([]))
             | select('search', '(?i)mail|smtp|resend|brevo|verify')
             | list | join('\n')
             | default('(no mail-related lines in last 200)') }}
      when:
        - _smtp_enabled | bool
        - _kc_send_verify is defined
        - _kc_send_verify.rc | default(0) != 0

    - name: "Keycloak: SMTP send dispatched (check inbox)"
      ansible.builtin.debug:
        msg: |
          send-verify-email to {{ _bootstrap_email }} dispatched. If the
          mail does not arrive within 2 minutes, inspect:

              docker logs {{ _keycloak_server_ct.stdout }} --tail 200 | grep -i mail

          Common real failure modes (bad creds, host unreachable, sender
          domain not verified at the SMTP provider) surface there, not
          in this CLI wrapper.
      when:
        - _smtp_enabled | bool
        - _kc_send_verify is succeeded

- name: "Vantage 2 -- access checks on the host"
  hosts: "{{ stage_hosts | default('vps') }}"
  gather_facts: false
  become: false
  tags: [tailnet, vantage2]
  tasks:
    # The two UIs answer this host's loopback only, and an administrator reaches
    # them through an SSH local forward that lands there. So the probe runs ON
    # the host, against 127.0.0.1 -- the address the forward delivers to.
    - name: "Probe Portainer UI on the host's loopback"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ portainer_ui_port | default(9000) }}/"
        status_code: [200, 301, 302, 307, 308]
        timeout: 10

    - name: "Probe catena-admin native-login page on the host's loopback"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ catena_admin_ui_port | default(9010) }}/login"
        status_code: [200]
        timeout: 10
      # The panel's host-published native-login listener serves /login without a
      # session (200). It is the way in before a Cloudflare token has been saved,
      # which is why it is unconditional rather than a mode.
      # Only asserted when the converge itself deployed catena-admin
      # (catena_admin_deploy_from_converge, as an extra var or the env var),
      # which every converge does, so the container is up by the time validate
      # runs.
      when: >-
        (catena_admin_deploy_from_converge
         | default(lookup('env', 'CATENA_ADMIN_DEPLOY_FROM_CONVERGE', default='true')))
        | bool

    # The public via-tunnel probes below (Keycloak Account Console at auth.<zone>
    # and each gated host's /oauth2/start) only work once a Cloudflare token has
    # been saved (catena-admin > Settings) and the tunnel converged. With no
    # token the tunnel is DEFERRED, so skip them with a clear reason. The token
    # is a host fact from the Vantage-1 load_onbox_config pre_task.
    #
    # A token alone is not an edge: the tunnel also defers while its engine is
    # not on the host. Vantage 1's reconcile/roles/infrastructure validate
    # resolves both into _infra_edge_up, a host fact that outlives its play;
    # token presence is the fallback for a run that skipped Vantage 1.
    - name: "Resolve whether the edge should be up"
      ansible.builtin.set_fact:
        _v2_edge_up: >-
          {{ _infra_edge_up
             | default((cloudflare_api_token | default('')) | length > 0)
             | bool }}

    - name: "Tunnel probes deferred"
      ansible.builtin.debug:
        msg: >-
          Skipping the via-tunnel probes (auth.<zone>, /oauth2/start) -- the
          tunnel is deferred (no Cloudflare token in the on-box store yet, or
          the tunnel engine is not on the host yet).
      when: not (_v2_edge_up | bool)

    - name: "Probe Keycloak (auth.<zone>) login page via CF"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../helpers/public_https.py"
          - --url
          - "https://{{ keycloak_hostname | default('auth.' ~ cloudflare_zone) }}/realms/{{ keycloak_realm | default('vps') }}/account"
          - --timeout
          - "15"
      register: _v2_keycloak_probe
      changed_when: false
      failed_when: (_v2_keycloak_probe.stdout | from_json).status not in [200, 302]
      # Gated on the edge: while the tunnel is deferred auth.<zone> is not
      # reachable via CF.
      when: _v2_edge_up | bool
      # Keycloak's Account Console redirects unauth'd hits to the login
      # page (302). Authenticated would be 200. Either is healthy.

    # Assert the auth-redirect chain
    # actually lands on Keycloak's login URL with state + redirect_uri +
    # client_id query params -- not just "auth required" (status 302 with
    # no further evidence). Failure modes this catches:
    #   - oauth2-proxy realm misconfigured: redirect goes to wrong issuer
    #   - state param missing: oauth2-proxy CSRF-defense failure
    #   - redirect_uri param missing: callback would 4xx
    # Hits oauth2-proxy's /oauth2/start endpoint on each gated host;
    # helpers/public_https.py follows no redirect, so the FIRST redirect's
    # Location is what comes back.
    # _gated_hosts keeps only the hostnames that are set.
    #
    # Coverage:
    #   - The platform's gated apps (gatus, catena-admin at dash.<zone>,
    #     healthchecks, portainer, beszel) are always probed.
    #   - `validate_extra_gated_hosts` adds ad-hoc gated hostnames.
    #   - Client apps get their Traefik routes + oauth2-proxy gating from
    #     dashboard-sync (the route service's vps.route.host + vps.auth.*
    #     labels). Their auth contract is checked on the host by
    #     verify_gated_intent.py (reconcile/roles/infrastructure
    #     verify_gated_services.yml), from the same app intent dashboard-sync
    #     builds.
    #
    # Native-OIDC hosts (vps.auth.mode=public + vps.auth.oidc=true) are not
    # in this set: those apps run their own OAuth dance against Keycloak
    # with no oauth2-proxy in the chain, so /oauth2/start does not exist at
    # their hosts and a probe there 200s against the app's own UI.
    - name: "Build gated-host probe set"
      ansible.builtin.set_fact:
        # Keycloak's own host (auth.<zone>) is the IdP, not an
        # oauth2-proxy-gated client, so it is dropped unconditionally.
        _gated_hosts: >-
          {{
            (
              [
                infrastructure_gatus_hostname | default(''),
                catena_admin_hostname | default(''),
                healthchecks_hostname | default(''),
                portainer_admin_hostname | default(''),
                beszel_hostname | default(''),
              ]
              + (validate_extra_gated_hosts | default([]))
            )
            | reject('equalto', '')
            | reject('equalto', keycloak_hostname | default('auth.' ~ cloudflare_zone))
            | unique
            | list
          }}
        _r3_keycloak_login_prefix: >-
          https://{{ keycloak_hostname | default('auth.' ~ cloudflare_zone) }}/realms/{{ keycloak_realm | default('vps') }}/protocol/openid-connect/auth?
      # Only build the probe set when the edge is up; otherwise _gated_hosts
      # stays unset and the probe loop below skips.
      when: _v2_edge_up | bool

    - name: "Probe /oauth2/start on each gated host (Location -> Keycloak)"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../helpers/public_https.py"
          - --url
          - "https://{{ item }}/oauth2/start?rd=https%3A%2F%2F{{ item }}%2F"
          - --timeout
          - "15"
      register: _r3_probes
      changed_when: false
      failed_when: (_r3_probes.stdout | from_json).status != 302
      loop: "{{ _gated_hosts | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: _gated_hosts | default([]) | length > 0

    - name: "Assert each probe redirects to Keycloak login with state + redirect_uri"
      vars:
        _location: "{{ (_probe.stdout | from_json).location }}"
      ansible.builtin.assert:
        that:
          - _location | length > 0
          - _location.startswith(_r3_keycloak_login_prefix)
          - "'state=' in _location"
          - "'redirect_uri=' in _location"
          - "'client_id=oauth2-proxy' in _location"
          - "'response_type=code' in _location"
        fail_msg: |
          Gated host {{ _probe.item }} did NOT redirect /oauth2/start to
          the Keycloak login URL with the expected query params.

          Got Location: {{ _location if _location else '<missing>' }}
          Expected prefix: {{ _r3_keycloak_login_prefix }}
          Required params: state, redirect_uri, client_id=oauth2-proxy,
                           response_type=code

          Likely causes:
          - oauth2-proxy --oidc-issuer-url mismatch (check
            reconcile/roles/oauth2_proxy/defaults/main.yml: oauth2_proxy_oidc_issuer)
          - Keycloak realm name drift (KEYCLOAK_REALM in .env vs
            keycloak_realm role default)
          - oauth2-proxy container restart-looping (check `docker logs`)
        success_msg: "{{ _probe.item }} -> Keycloak login (state + redirect_uri OK)"
      loop: "{{ _r3_probes.results | default([]) }}"
      loop_control:
        loop_var: _probe
        label: "{{ _probe.item | default('?') }}"
      when: _r3_probes.results is defined

    # Catch host-published-port drift -- a
    # client compose with `ports: ["8080:80"]` would expose its
    # container directly to the tailnet, bypassing Traefik and the
    # app's auth proxy. Container IPs themselves aren't routable
    # from tailnet (catena-network is host-internal), so the actual
    # attack surface is host-published ports. Enumerate every
    # listening TCP port on the host and assert the set matches the
    # allowlist (Traefik 80/443, SSH 22, Portainer admin 9000 on the
    # tailnet alias, anything explicitly opted-in via .env).
    #
    # Runs ON the host (no delegate_to), so it sees the full ss(8)
    # output including loopback-only binds. We filter to public-
    # facing binds (0.0.0.0 / [::]); 127.0.0.1-bound ports
    # (gatus_host_localhost_port, catena-postgres internals, etc)
    # never reach tailnet so they're skipped.
    - name: "Enumerate listening TCP ports on host"
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -tlnp4
      register: _r4_listen
      changed_when: false
      become: true

    # The host-port allowlist is DERIVED from the public-port registry
    # (catena-admin payload/lib/public_ports.py), not hand-maintained. The
    # reconciler writes
    # /etc/catena/public-ports.summary.json with precomputed integer port
    # lists; we add the always-present infra ports (22 SSH, 80/443 Traefik
    # via CF Tunnel) that are not registry-managed.
    - name: "stat public-port registry summary"
      ansible.builtin.stat:
        path: /etc/catena/public-ports.summary.json
      register: _pp_summary_stat
      become: true

    - name: "read public-port registry summary"
      ansible.builtin.slurp:
        src: /etc/catena/public-ports.summary.json
      register: _pp_summary_raw
      become: true
      when: _pp_summary_stat.stat.exists | default(false)

    - name: "Parse + filter to public-facing binds"
      ansible.builtin.set_fact:
        # Each ss line: State Recv-Q Send-Q LocalAddr:Port PeerAddr:Port users
        # We want the column 4 LocalAddr:Port. Filter to lines whose local
        # bind is 0.0.0.0:* or *:* (any-IPv4). Loopback (127.0.0.1) +
        # tailnet-only binds (100.x.y.z) are NOT publicly reachable from
        # tailnet hosts other than the host itself, so excluded here.
        _r4_public_ports: >-
          {{
            (_r4_listen.stdout_lines | default([]))
            | map('split')
            | map('list')
            | selectattr('3', 'defined')
            | map(attribute='3')
            | select('match', '^(0\\.0\\.0\\.0|\\*):')
            | map('regex_replace', '^.*:(\\d+)$', '\\1')
            | map('int')
            | sort
            | unique
            | list
          }}
        # Allowlist = 22 (SSH, public until the panel's Lockdown narrows it),
        # 80 and 443, plus the registry's bound TCP ports (Portainer 9000,
        # coturn 5349, mailserver 25/465/587/993, ...) from
        # /etc/catena/public-ports.summary.json (all_tcp_bound). No catena
        # service binds 80 or 443 on the host: web traffic enters through the
        # Cloudflare tunnel, and catena-traefik publishes no port. A static
        # fallback applies when the summary is absent (e.g. a partial converge
        # before the reconciler ran), so this check never silently passes on
        # an empty allowlist.
        _r4_allowed_ports: >-
          {{
            ([22, 80, 443] +
              ((_pp_summary_raw.content | b64decode | from_json).all_tcp_bound
               if (_pp_summary_stat.stat.exists | default(false))
               else [portainer_ui_port | default(9000) | int, 5349]))
            | map('int') | unique | sort | list
          }}

    - name: "Assert no unexpected host-published ports (port-binding drift catch)"
      ansible.builtin.assert:
        that:
          - (_r4_public_ports | difference(_r4_allowed_ports)) | length == 0
        fail_msg: |
          violation: host has unexpected publicly-bound TCP
          listeners. A container with `ports: ["<host>:<container>"]`
          binding bypasses Traefik and the app's auth proxy, exposing
          the service directly to the tailnet (and, depending on UFW,
          to the public internet).

          Allowed: {{ _r4_allowed_ports }}
          Found:   {{ _r4_public_ports }}
          Drift:   {{ _r4_public_ports | difference(_r4_allowed_ports) }}

          Diagnostic:
            ss -tlnp4 | grep -E '^(0\\.0\\.0\\.0|\\*):'
            docker ps --format '{{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Ports{{ "}}" }}'

          To fix: change the offending compose's `ports:` list to
          omit the host-side mapping (drop the "<host>:" prefix), or
          restrict the bind to 127.0.0.1 if loopback-only is needed.
        success_msg: "Host port set OK ({{ _r4_public_ports | join(', ') }} - all in allowlist)"

    # Every list above describes what the registry DECLARES. This is the one
    # field that says whether the host is in that state: a reconciler that
    # could not install its DOCKER-USER rules leaves the same declared lists
    # as a correctly guarded host, and only rules_unapplied tells them apart.
    - name: "Assert the port reconciler applied every rule it planned"
      ansible.builtin.assert:
        that:
          - ((_pp_summary_raw.content | b64decode | from_json).rules_unapplied
             | default(0) | int) == 0
        fail_msg: |
          violation: catena-public-ports could not install
          {{ (_pp_summary_raw.content | b64decode | from_json).rules_unapplied }}
          of its planned firewall rules. The port lists in this summary
          describe the DECLARED set; the host is not in it, and every
          restricted docker-bound port those rules cover is reachable.

          Diagnostic:
            systemctl status catena-public-ports.service
            journalctl -u catena-public-ports.service -n 50
            iptables -nL DOCKER-USER

          Most likely: the reconcile ran before Docker finished creating the
          DOCKER-USER chain. The 5-minute timer re-asserts; if it persists,
          Docker is not managing iptables on this host.
        success_msg: "Port reconciler applied its full rule plan"
      when: _pp_summary_stat.stat.exists | default(false)
