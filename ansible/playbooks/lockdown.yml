---
# Join the tailnet, and -- only when the panel's Lockdown asks -- close public
# port 22 behind it. On a host with no tailnet, open public port 22, which a
# Lockdown taken while the host had one closed.
#
# THE PANEL'S LOCKDOWN ACTION, run on the host. The install never runs it:
# public 22 stays open after an install, because the host's security rests on
# key-only SSH with no root and no password login, and the tailnet is a
# convenience whose one security feature is closing 22.
#
# CLOSING IS THE PANEL'S DECISION ALONE. catena_lockdown_close_public_ssh is
# false unless the panel's Lockdown action sets CATENA_LOCKDOWN_CLOSE_PUBLIC_SSH
# on the unit it starts; any other run, such as the join a Settings save of the
# tailnet starts, joins and leaves 22 open.
# Once closed, the port reconciler (catena-public-ports) reopens 22 whenever
# this host's tailnet is down, and closes it again when the tailnet is back.
#
# ITS OWN PLAYBOOK, not a converge post_task:
#
#   - It is the one step that can make a host unreachable, so it runs alone,
#     where a failure is a failure of lockdown rather than of a converge that
#     did fifteen other things correctly.
#   - A converge is something a host runs on itself, on a timer. Closing the
#     administrative port is not; it is a decision, taken once, and re-taking it
#     on every converge re-probes a path nobody asked about.
#
# It is idempotent: on a host already joined the join is a no-op, and on one
# already locked down the delete is a no-op and the proof runs again as a cheap
# reachability check.
#
# The firewall half is bootstrap/roles/common's tasks/ufw_lockdown.yml, which
# reads the access method this host declared and either closes the port behind
# the proven alternative path, or, with no alternative, opens it and says so.

- name: Join the tailnet, and close public SSH when the panel asks
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true

  vars:
    # An -e on the command line outranks this; the panel's unit sets the
    # environment variable instead, because catena-converge takes no extra vars.
    catena_lockdown_close_public_ssh: >-
      {{ lookup('env', 'CATENA_LOCKDOWN_CLOSE_PUBLIC_SSH') | default('false', true) | bool }}

  pre_tasks:
    # The tailnet provider is a STORE key, so the store has to be loaded before
    # anything reads it. Without this the access method resolves to its default
    # on every run rather than to this host's own answer.
    - name: "Load on-box config store"
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

  tasks:
    # Skipped on a host whose access method is public SSH: there is no tailnet
    # to join, and installing the daemon anyway would leave a node this host
    # never authenticates and a tailscale0 that never appears.
    - name: Join the tailnet
      ansible.builtin.include_role:
        name: tailscale
        apply:
          tags: [lockdown, tailscale]
      when: catena_access_method == 'tailnet'
      tags: [lockdown, tailscale]

    # Before anything is closed: the control server has to see this host
    # connected and accepting, and a peer has to answer through the tunnel. A
    # failure ends the play here, with public 22 still open. A run that only
    # joins has nothing to prove: it closes nothing.
    - name: Prove the tailnet reaches this host
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: reachable.yml
        apply:
          tags: [lockdown, tailscale]
      when:
        - catena_access_method == 'tailnet'
        - catena_lockdown_close_public_ssh | bool
      tags: [lockdown, tailscale]

    - name: Lock ufw to the declared access method
      ansible.builtin.include_role:
        name: common
        tasks_from: ufw_lockdown.yml
        # apply: propagates tags to every task inside ufw_lockdown.yml.
        # Without it, `--tags lockdown` would fire the include but then
        # filter out all the inner tasks (they have no "lockdown" tag).
        apply:
          tags: [lockdown]
      tags: [lockdown]
