---
# Join the tailnet, and -- only when the panel's Lockdown asks -- close public
# port 22 behind it.
#
# THE INSTALL'S LAST LEG AND THE PANEL'S LOCKDOWN ACTION. Every leg before this
# one reaches the host over the public SSH address the install started on, so
# there is one install path whatever the client chose. On the tailnet method
# this leg joins and proves the new path. Public 22 stays open after an install:
# the host's security rests on key-only SSH with no root and no password login,
# and the tailnet is a convenience whose one security feature is closing 22.
#
# CLOSING IS THE PANEL'S DECISION ALONE. catena_lockdown_close_public_ssh is
# false unless the panel's Lockdown action sets CATENA_LOCKDOWN_CLOSE_PUBLIC_SSH
# on the unit it starts. The installer and every other caller join and prove,
# and leave 22 open. Once closed, the port reconciler (catena-public-ports)
# reopens 22 whenever this host's tailnet is down, and closes it again when the
# tailnet is back.
#
# ITS OWN PLAYBOOK, not a converge post_task. Three reasons, and the first is
# the one that matters:
#
#   - It is the one step that can make a host unreachable, so it runs LAST and
#     alone, where a failure is a failure of lockdown rather than of a converge
#     that did fifteen other things correctly.
#   - A converge is something a host runs on itself, on a timer. Closing the
#     administrative port is not; it is a decision, taken once, and re-taking it
#     on every converge re-probes a path nobody asked about.
#   - The panel's apply button and the installer's last step join the same
#     way. One playbook means they cannot diverge: a client who enters the
#     tailnet credentials in the panel after the install gets the same join and
#     the same proof the installer runs.
#
# `catena-cli install` runs it after its converge and passes
# catena_lockdown_emit_address, so the tailnet address lands in
# .bootstrap-output.yml for the legs and invocations that follow. It is
# idempotent: on a host already joined the join is a no-op, and on one already
# locked down the delete is a no-op and the proof runs again as a cheap
# reachability check.
#
# The firewall half is bootstrap/roles/common's tasks/ufw_lockdown.yml, which
# reads the access method this host declared and either proves the alternative
# path before closing, or refuses and says so.

- name: Join the tailnet, and close public SSH when the panel asks
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: true

  vars:
    # An -e on the command line outranks this; the panel's unit sets the
    # environment variable instead, because catena-converge takes no extra vars.
    catena_lockdown_close_public_ssh: >-
      {{ lookup('env', 'CATENA_LOCKDOWN_CLOSE_PUBLIC_SSH') | default('false', true) | bool }}

  pre_tasks:
    # The access method is a STORE key, so the store has to be loaded before
    # anything reads it. Without this the method resolves to its default on
    # every run, and a host that chose public SSH would have its port closed
    # by the fallback rather than by its own answer.
    - name: "0b: load on-box config store"
      ansible.builtin.include_tasks:
        file: tasks/load_onbox_config.yml
        apply:
          tags: [always, onbox]
      tags: [always, onbox]

  tasks:
    # Skipped on a host whose access method is public SSH: there is no tailnet
    # to join, and installing the daemon anyway would leave a node this host
    # never authenticates and a tailscale0 that never appears.
    - name: Join the tailnet
      ansible.builtin.include_role:
        name: tailscale
        apply:
          tags: [lockdown, tailscale]
      when: catena_access_method == 'tailnet'
      tags: [lockdown, tailscale]

    # Before anything is closed: the control server has to see this host
    # connected and accepting, and on the host itself (the panel's lockdown) a
    # peer has to answer through the tunnel. A failure ends the play here, with
    # public 22 still open.
    - name: Prove the tailnet reaches this host
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: reachable.yml
        apply:
          tags: [lockdown, tailscale]
      when: catena_access_method == 'tailnet'
      tags: [lockdown, tailscale]

    - name: Lock ufw to the declared access method
      ansible.builtin.include_role:
        name: common
        tasks_from: ufw_lockdown.yml
        # apply: propagates tags to every task inside ufw_lockdown.yml.
        # Without it, `--tags lockdown` would fire the include but then
        # filter out all the inner tasks (they have no "lockdown" tag).
        apply:
          tags: [lockdown]
      tags: [lockdown]

    # The next leg and every later invocation reach the host at its tailnet
    # address, which keeps answering once the panel's Lockdown closes public
    # 22. add_host is not enough on its own: each leg of the install is its own
    # ansible-playbook run, so the address has to travel through
    # <inventory_dir>/.bootstrap-output.yml, which catena_cli folds into
    # hosts.yml after this leg. Only the installer asks for it; the panel runs
    # this play on the host, where there is no controller inventory.
    - name: "Emit the tailnet address into <inventory_dir>/.bootstrap-output.yml"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../helpers/bootstrap_output.py"
          - --inventory-dir
          - "{{ inventory_dir }}"
          - --host
          - "{{ inventory_hostname }}"
          - --key
          - ansible_host
          - --value
          - "{{ tailnet_ipv4 }}"
      delegate_to: localhost
      become: false
      changed_when: true
      when:
        - catena_lockdown_emit_address | default(false) | bool
        - catena_access_method == 'tailnet'
      tags: [lockdown]
