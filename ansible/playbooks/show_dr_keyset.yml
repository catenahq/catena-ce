---
# Surface the user-held DR keyset (admin + restic + console passwords) ONCE,
# plus the first-login URLs, at the end of a fresh `catena install`. The
# passwords are minted ON-BOX (helpers/onbox_config.py USER_HELD_SECRETS) and
# never touch the laptop, so the installer reads them back from the store here
# and prints them for the user's password manager. Deliberately NOT no_log on
# the debug: showing them once is the point.
#
# Everything the user must write down is in the FINAL task, as one block. The
# reads and the FSS delete run ahead of it so nothing prints after the thing
# the user is supposed to be copying down.
#
# Usage (driven by `catena install`; cwd = ansible/):
#   ansible-playbook -i inventory/<name> playbooks/show_dr_keyset.yml

- name: Surface the DR keyset once
  hosts: "{{ stage_hosts | default('vps') }}"
  become: true
  gather_facts: false

  tasks:
    # The journal's tamper-evidence key (bootstrap/roles/common stages it at mint time).
    # Read it, show it, then DELETE it below: whoever holds this key can
    # re-seal an altered journal, so a copy left on the box would defeat the
    # very thing it proves. Absent = FSS was already set up on an earlier run
    # and the key was surfaced then.
    - name: Read the staged FSS verification key
      ansible.builtin.slurp:
        src: /etc/catena/fss-verification-key.pending
      register: _fss_pending
      failed_when: false
      no_log: true

    - name: Read the on-box config store
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../helpers/onbox_config.py
          --path {{ catena_onbox_config_path | default('/etc/catena/config.json') }}
          --emit all --no-mint
        executable: python3
      register: _dr_store
      changed_when: false
      no_log: true

    # Removed BEFORE the display, not after. Its content is already in
    # _fss_pending above, so the banner still prints it; deleting first is what
    # makes the removal unconditional. A key left behind silently voids the
    # seal it proves, which is worse than a key never shown -- so the delete
    # must not be reachable only through a display task that rendered.
    - name: Remove the staged FSS verification key from the server
      ansible.builtin.file:
        path: /etc/catena/fss-verification-key.pending
        state: absent

    # ONE task, and the LAST one. Everything the user has to write down is in
    # this single block on purpose: split across two tasks, with other output
    # after them, the first block scrolls off and gets missed -- and these
    # values are shown once. The URLs live here rather than in the inventory
    # template because the ports are defaults nobody customizes and the
    # hostnames only resolve once the tunnel is up, so this is the first moment
    # they are both known and true.
    - name: "SAVE THIS -- passwords and first-login URLs, shown once"
      ansible.builtin.debug:
        msg: "{{ _banner.split('\n') }}"
      vars:
        _secrets: "{{ (_dr_store.stdout | from_json).secrets }}"
        _fss: >-
          {{ (_fss_pending.content | b64decode).strip()
             if (_fss_pending.content is defined) else '' }}
        _admin_port: "{{ catena_admin_ui_port | default(9010) }}"
        _banner: |
          ==================================================================
          SAVE THESE TO YOUR PASSWORD MANAGER NOW -- shown once.

            Admin password (Portainer + Keycloak): {{ _secrets.admin_password }}
            Restic backup password (DR keyset):    {{ _secrets.backup_restic_password }}
            Console password for `{{ ops_user | default('ops') }}` (break-glass): {{ _secrets.console_recovery_password }}

          The restic password is the ONE secret you must hold off-box: with it
          plus your S3 keys and repo URL you can rebuild a wiped VPS from
          backup. Without it your backups cannot be restored, by anyone.

          The console password is your way back in when the network path is
          gone. SSH refuses it (key-only); it works at the provider web
          console (KVM/serial) or a physical keyboard, and nowhere else.
          {% if _fss %}

            Journal verification key (tamper evidence):

          {{ _fss }}

          This key proves the server's own log of administrative actions was
          not altered after the fact (`journalctl --verify` on the server).
          Store it OFF the server: anyone holding it can re-seal an edited
          journal. The server's copy has already been deleted -- what is
          printed above is the only one left.
          {% endif %}
          ------------------------------------------------------------------
          First login. Same password everywhere; the USERNAME differs per
          service, so it is spelled out per service below.

            catena-admin panel  https://{{ infrastructure_dash_hostname }}
                                http://{{ ansible_host }}:{{ _admin_port }}  (tailnet, no Cloudflare)
                                username: {{ admin_email }}

            Portainer           https://{{ portainer_admin_hostname }}
                                http://{{ ansible_host }}:{{ portainer_ui_port }}  (tailnet, no Cloudflare)
                                username: admin
                                (the literal word `admin`, NOT an email address --
                                 Portainer's first-boot admin has no email field)

          The public hostnames are SSO-gated and go through the Cloudflare
          tunnel; the tailnet addresses stay reachable when the tunnel or
          Cloudflare is not, and are the way in if SSO itself is broken.

          On a public hostname the SSO gate asks first, and it wants
          {{ admin_email }}. The service's own login form comes after it, and
          asks for the username listed above -- so reaching Portainer through
          the tunnel means the email once, then `admin`.
          ==================================================================
