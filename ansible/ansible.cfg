[defaults]
# Self-hosters copy inventory/example/.env.example to inventory/<name>/.env
# and point at it with -i inventory/<name> (or change this default) -- see
# INSTALL.md. hosts.yml/localhost.yml auto-scaffold from skel/ on first
# `catena install`, so they never live in inventory/example/ where a
# self-hoster might mistake them for something to copy too. Real inventories
# are gitignored; they are non-secret (0b): a real inventory is a .env and a
# hosts.yml. Shared group_vars structure lives at playbooks/group_vars/all/
# -- Ansible loads group_vars from both the inventory directory and the
# playbook directory on every run.
#
# The default below points at skel/ rather than inventory/example/ so a bare
# ansible-playbook invocation with no -i (a direct/dev run, never how the
# catena CLI itself calls ansible-playbook -- it always passes -i explicitly)
# still resolves a working `localhost` group instead of an inventory with no
# YAML in it at all.
inventory = skel
# Two role roots, because a role has a SIDE. bootstrap/ is what an operator
# runs from outside the server -- the account, the mesh, the disk, the container
# engine, the SSH trust path -- and reconcile/ is what the server runs against
# itself, unattended, from the tree inside the panel image.
#
# The line is declared in boundary.yml and enforced by
# tests/unit/test_converge_boundary.py. It was a declaration alone until the
# directories followed it; a role's side is now a fact about where it lives.
#
# Order matters only if a name existed under both, which
# tests/unit/test_every_role_reference_resolves.py refuses.
roles_path = bootstrap/roles:reconcile/roles
# Dot-prefixed from the era when this repo carried a Go module (Go skips
# dot-dirs; the galaxy-vendored collections ship .go test fixtures).
# There is no Go here anymore; the name stays for path stability -- the
# catena-admin ansible.cfg references it as a sibling path.
collections_path = .collections
# ansible_managed is set as a regular variable in playbooks/group_vars/all/main.yml
# (not here -- the ansible.cfg setting is deprecated in ansible-core 2.23+).
# Lookup plugins live at playbooks/lookup_plugins/ and are auto-discovered
# by Ansible from playbook_dir -- no explicit lookup_plugins= setting needed.
# Silence deprecation warnings from third-party modules we can't fix
# (e.g. ansible.builtin.authorized_key importing from _text.to_native).
# Our own deprecation issues (ansible_facts[] accessor, ansible_managed
# variable) are already fixed in our code.
deprecation_warnings = False
host_key_checking = True
retry_files_enabled = False
# In ansible-core 2.13+ the YAML-formatted stdout uses the built-in default
# callback plus result_format. The legacy `community.general.yaml` callback
# that older docs reference was removed in community.general 12.0.0.
stdout_callback = default
result_format = yaml
forks = 10
interpreter_python = auto_silent
# Keep .example files out of inventory parsing: skel/hosts.yml.example (the
# template every real inventory's gitignored hosts.yml scaffolds from) and
# inventory/example/.env.example both sit inside directories Ansible could
# otherwise try to read as inventory sources.
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .example, .md
# No persisted laptop secret (0b): `catena install` writes NO vault.yml into
# the inventory. The on-box config store (/etc/catena/config.json, 0600 root)
# is the sole runtime source of truth; it rides the restic backup so a rebuild
# needs only the {restic endpoint, S3 creds, restic password} keyset. Install-
# critical vendor creds arrive as transient `-e @file` extra-vars that the
# loader adopts. The host_group_vars plugin stays enabled to load the
# non-secret group_vars/all/ (both playbooks/ and per-inventory).
vars_plugins_enabled = host_group_vars

[inventory]
# Disable the 'script' inventory plugin. Same reason as above -- on a filesystem
# that force-marks every file executable, Ansible's script plugin tries to
# exec YAML inventory files and fails with "Exec format error" before the
# yaml/auto plugins get a chance.
enable_plugins = host_list, auto, yaml, ini, toml

# Keep module code off the target's disk -- piped to Python on stdin.
# This is the primary "no script leakage to VPS" knob.
[ssh_connection]
pipelining = True
control_path = ~/.ansible/cp/%%h-%%p-%%r
# StrictHostKeyChecking=accept-new: trust new hosts on first contact (TOFU),
# but STILL error on key mismatch for known hosts. This handles first contact
# for key-auth plays (site.yml first-time against tailnet name, migrations).
# For password-auth bootstrap, Ansible has its own guard that refuses password
# auth when the host isn't in known_hosts -- bootstrap.yml handles that with a
# TOFU pre-play that ssh-keyscans the host into known_hosts before Phase 1.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[persistent_connection]
command_timeout = 60
