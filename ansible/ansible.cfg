[defaults]
# An inventory is inventory/<name>/.env, written by `catena-cli init` or the
# graphical installer, and named with -i inventory/<name> -- see
# inventory/README.md. hosts.yml auto-scaffolds from skel/ on first
# `catena-cli install`. Real inventories are gitignored; they are non-secret:
# a real inventory is a .env and a hosts.yml. Shared group_vars structure lives at
# playbooks/group_vars/all/ -- Ansible loads group_vars from both the inventory
# directory and the playbook directory on every run.
#
# Two role roots, because a role has a SIDE. bootstrap/ is what
# `catena-cli install` applies from outside the server -- the account, the
# mesh, the disk, the container engine, the SSH trust path -- and reconcile/ is
# what the server runs against itself, unattended, from the tree inside the
# panel image.
#
# The line is declared in boundary.yml and enforced by
# tests/unit/test_converge_boundary.py.
#
# Order would matter only for a name under both, which
# tests/unit/test_every_role_reference_resolves.py refuses.
roles_path = bootstrap/roles:reconcile/roles
# The catena-admin ansible.cfg names this path too.
collections_path = .collections
# ansible_managed is a regular variable in playbooks/group_vars/all/main.yml.
# Lookup plugins live at playbooks/lookup_plugins/, auto-discovered from
# playbook_dir.
# Silence deprecation warnings from third-party modules
# (e.g. ansible.builtin.authorized_key importing from _text.to_native).
deprecation_warnings = False
host_key_checking = True
retry_files_enabled = False
# YAML-formatted stdout: the built-in default callback plus result_format.
stdout_callback = default
result_format = yaml
forks = 10
interpreter_python = auto_silent
# Keep .example files out of inventory parsing: skel/hosts.yml.example, the
# template every real inventory's gitignored hosts.yml scaffolds from.
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .example, .md
# The on-box config store (/etc/catena/config.json, 0600 root)
# is the sole runtime source of truth; it rides the restic backup so a rebuild
# needs only the {restic endpoint, S3 creds, restic password} keyset. An admin
# password the install pins arrives as a transient `-e @file` extra-var that
# the loader adopts. The host_group_vars plugin stays enabled to load the
# non-secret group_vars/all/ (both playbooks/ and per-inventory).
vars_plugins_enabled = host_group_vars

[inventory]
# Disable the 'script' inventory plugin. On a filesystem that force-marks
# every file executable, Ansible's script plugin tries to
# exec YAML inventory files and fails with "Exec format error" before the
# yaml/auto plugins get a chance.
enable_plugins = host_list, auto, yaml, ini, toml

# Keep module code off the target's disk -- piped to Python on stdin.
# This is the primary "no script leakage to VPS" knob.
[ssh_connection]
pipelining = True
control_path = ~/.ansible/cp/%%h-%%p-%%r
# StrictHostKeyChecking=accept-new: trust new hosts on first contact (TOFU),
# but STILL error on key mismatch for known hosts. This handles first contact
# for key-auth plays, such as an install run with `--address` at an address
# this machine has not dialled before. For password-auth bootstrap, Ansible has
# its own guard that refuses password auth when the host isn't in known_hosts
# -- bootstrap.yml handles that with a TOFU pre-play that ssh-keyscans the
# host into known_hosts before Phase 1.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[persistent_connection]
command_timeout = 60
