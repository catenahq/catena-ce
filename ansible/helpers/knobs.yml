# The knob registry: every value a client supplies, declared once.
#
# Its readers, each of which sees a knob declared here or none at all:
#
#   helpers/onbox_config.py   which keys the store accepts, and how the
#                             converge sees them; on a host it reads the JSON
#                             playbooks/tasks/stage_knob_registry.yml stages
#   seed.py                   what the installer asks for, and the inventory
#                             `.env` it writes (render_knobs.render_env)
#   catena-admin settings     which fields the panel renders
#   gui/                      which fields each installer step shows
#
# An inventory `.env` is rendered from this file: `env_header` is its preamble,
# `env_sections` the ordered headings it groups keys under, and each knob's
# `env.section` the heading it prints under. So this file groups by residence
# while the file a client edits groups by subject.
#
# WHAT IS NOT HERE. Secrets the client never supplies: the internal service
# secrets and the user-held DR keyset are minted on-box, and the role-minted
# ones are captured by the role that provisioned them. All three carry python
# callables or a role name rather than a client-facing shape, nothing outside
# the box reads them, and none of them is ever rendered on a form. They stay in
# `onbox_config.py`.
#
# CLIENT COPY. `label` and `help` are what a client reads: on the graphical
# installer's page, in the page's language, and `help.en` as the comment above
# the key in an inventory `.env`. They say what to enter, in the client's
# terms. Why a knob is declared the way it is goes in a `#` comment above it,
# which nothing renders. A `help` is one folded paragraph, re-wrapped on the
# way out; a line indented further than its neighbours is held verbatim, which
# is how a command keeps its shape.
#
# FIELD MEANINGS
#
#   residence   where the value LIVES.
#               store      -- /etc/catena/config.json, which the host reads.
#                             A knob with a `panel` field is edited there and
#                             nowhere else. A knob with an `env` home instead
#                             is one the first converge needs before the panel
#                             exists: the `.env` seeds it once and is never
#                             read for it again, unless it declares
#                             `env.reseed`.
#               controller -- the inventory `.env`. The installer needs it
#                             before there is a box to ask.
#               host       -- the target's identity. Written into hosts.yml by
#                             seed, not into either registry above.
#
#   ONE PLACE TO EDIT EACH VALUE. A knob has an `env` home or a `panel` field,
#   never both. The installer asks only for what reaches and installs the
#   server; anything the panel can change without consequence lives in the
#   panel alone.
#   var         the Ansible fact the converge loader publishes a stored value
#               as. Declared rather than derived by lowercasing: four keys do
#               not follow that rule, and a derived mapping fails silently by
#               publishing a fact nothing reads. Absent means no projection --
#               a runtime lane reads the value straight off the store.
#   env         the key's place in an inventory `.env`: which `section` it
#               prints under, the `default` it carries, and the `options` it
#               is limited to. Absent means the key never appears in the
#               `.env`. An EMPTY default is also what marks a key optional to
#               seed's structural checks, unless the key has an `example`: a
#               value with no sensible default that is still needed, shown as a
#               placeholder and never filled in. `reseed: true` on a stored
#               knob makes every converge run from the inventory write a
#               non-blank `.env` value over the stored one: for a key with no
#               panel field, whose one editor the `.env` stays.
#   panel       how catena-admin renders it. Absent means the settings page
#               does not show it; the page's own labels and help are its
#               translations, keyed by the knob. `default` is the value a field
#               shows while nothing is stored, the same literal the converge
#               falls back to; `options_from` names a list the host supplies
#               when the page renders (`timezones`, `cloudflare_zones`).
#   step        which section of the graphical installer asks for it, named in
#               `gui_steps`. Only a knob with an `env` home has one. Absent
#               means the launcher never asks: the value is either the
#               product's, or a setting the client makes afterwards in the
#               panel. Fields appear in a section in the order they are
#               declared here.
#   label       {en, fr}: the field's name on the graphical installer's page.
#               Only on a knob with a `step`.
#   help        {en, fr}: what to enter. Required on a knob with a `step` (both
#               languages) or an `env` home (`en`), and on no other.
#   depends     the choice field and values that govern whether the panel shows
#               this one. The same fact the converge acts on, which is why it
#               is declared and not left to a template. The field is `choice`
#               rather than the `on` it reads as in English, because YAML 1.1
#               parses a bare `on` as the boolean true.
#   required    true when the graphical installer refuses to install without a
#               value. Everything else is labelled optional there.
#   gui_choice  {public, private}, each {en, fr}: the two options of a radio
#               the graphical installer shows in front of the field. `public`
#               leaves the field empty, `private` asks for it.
#   gui_suggestions_from
#               a named source of values the graphical installer suggests
#               beside a free-text field (`ssh_keys`: the keypairs in the
#               client's ~/.ssh). Suggestions only: any value is accepted,
#               which is why these are not `env.options`.
version: 1

env_header: |-
  catena: client-editable, non-secret configuration of one server.

  Written by `catena-cli init` or the graphical installer, every key at its
  default. Edit the values here; `catena-cli install` reads them. One
  inventory directory per server, so several coexist in one checkout.

  No secret belongs in here, or anywhere else in an inventory. Every secret
  lives on the server at /etc/catena/config.json, minted there or entered in
  catena-admin > Settings. See catena-ce/ansible/SECRETS.md.

# The graphical installer's sections, in order, all on one page. Each knob that
# names one appears in it; a knob that names none is never asked for. `doc` is
# shown above the section's fields and `note`, when present, below them. A
# section with a probe in gui/catena_gui/steps.py is verified before the
# install starts.
gui_steps:
  - name: target
    title:
      en: Target information
      fr: Informations sur la cible
    doc:
      en: >-
        This information is needed to initially reach the machine on which
        Catena will be installed.
      fr: >-
        Ces informations permettent de joindre une première fois la machine sur
        laquelle Catena sera installé.
    note:
      en: >-
        Note that the initial user can no longer sign in over SSH once Catena
        is installed. A new user, "ops", is created to administer the server.
      fr: >-
        L'utilisateur initial ne peut plus se connecter en SSH une fois Catena
        installé. Un nouvel utilisateur, "ops", est créé pour administrer le
        serveur.

  - name: configuration
    title:
      en: Configuration
      fr: Configuration
    doc:
      en: >-
        This information is required to configure access to the machine after
        Catena is installed.
      fr: >-
        Ces informations servent à configurer l'accès à la machine une fois
        Catena installé.

env_sections:
  - name: host
    title: Host
    doc: |-
      Where the server is and how the first SSH connection reaches it, before
      the ops account exists.

      That is all this file configures about the server's reach. The domain,
      the private network and the backups are entered in catena-admin >
      Settings once it runs, reached through an SSH forward as the `panel`
      account.

  - name: ssh
    title: SSH
    doc: |-
      Generate the pair once:

          ssh-keygen -t ed25519 -f ~/.ssh/catena_ed25519 -C catena

  - name: admin
    title: Admin identity

  - name: storage
    title: Storage
    doc: |-
      App data and the Docker data-root live under one prefix on the disk this
      server already has: /srv/catena, which the backup set, the volume layout
      and the restore all name. Catena does not manage block devices. More
      space is a disk mounted by hand, bind-mounted into the app, and declared
      in backup_extra_paths so the backup set knows about it.

  - name: site
    title: Site policy

  - name: development
    title: Development only
    doc: |-
      Leave every key in this section at its default on a client install.
      They point certificate issuance at a local Pebble or at Let's Encrypt
      staging, whose certificates browsers, TURN clients and sending MTAs all
      reject. The test bench sets them to its own host-side ACME server.

# --- vendor credentials the client HOLDS ------------------------------------
#
# Stored, never minted. They arrive through the settings API, which accepts
# only these (onbox_config.EXTERNAL_SECRETS).
secrets:
  # The one credential the public surface needs. The account id is not an
  # input: the host engine resolves it from the token. Beside the domain on
  # the page, because the domains offered are the ones this token reaches.
  - key: cloudflare_api_token
    panel: {group: hostnames, section: secrets, kind: secret, optional: false}

  # Multi-domain (Business): a JSON map of zone to API token, each token scoped
  # to its one zone. The panel's domains page edits it.
  - key: cloudflare_api_tokens

  # Tailscale SaaS mints a tagged auth key from this client each time the
  # lockdown joins the host, so nothing long-lived lands on the VPS, and the
  # lockdown reads the device list to confirm the host is connected before it
  # closes public SSH: the client needs the Auth Keys (write) and Devices >
  # Core (read) scopes. Required on that path, hidden on the Headscale one, so
  # the badge is only read where it is true.
  - key: tailscale_oauth_client_id
    panel: {group: tunnel, section: secrets, kind: secret, optional: false}
    depends: {choice: TAILNET_PROVIDER, values: [tailscale]}

  - key: tailscale_oauth_client_secret
    panel: {group: tunnel, section: secrets, kind: secret, optional: false}
    depends: {choice: TAILNET_PROVIDER, values: [tailscale]}

  # Headscale has no OAuth API. The node joins with a pre-auth key, minted from
  # this one at each join (nothing long-lived on the VPS). Either this or the
  # static key satisfies the join, so neither is required on its own. A
  # lockdown applied from the panel also uses this key to ask Headscale whether
  # the host is online, and refuses without it.
  - key: headscale_api_key
    panel: {group: tunnel, section: secrets, kind: secret, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  # The static fallback when no API key is stored. Long-lived, hence second.
  - key: headscale_preauth_key
    panel: {group: tunnel, section: secrets, kind: secret, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  - key: backup_s3_access_key
    panel: {group: backup, section: secrets, kind: secret, optional: false}

  - key: backup_s3_secret_key
    panel: {group: backup, section: secrets, kind: secret, optional: false}

  # The one mail credential, whichever provider is chosen: the Resend API key,
  # the Brevo SMTP key, or the relay's password.
  - key: smtp_password
    panel: {group: mail, section: secrets, kind: secret, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [resend, brevo, server]}

  # The mailserver APPLICATION's relay credential and Spamhaus subscription.
  # They configure that template, not the host's shared outbound path, so they
  # are not in the mail group on the settings page.
  - key: mailserver_relay_password

  - key: mailserver_spamhaus_dqs_key

  # CIFS credentials for the optional bulk mount. Client-held: the share is
  # the client's NAS. NFS authenticates by source IP and supplies neither. The
  # storage role's bulk.yml names both on the settings page when it asks for
  # them, so the page has to offer them under exactly these names.
  - key: storage_bulk_username
    panel: {group: share, section: secrets, kind: secret, optional: true}

  - key: storage_bulk_password
    panel: {group: share, section: secrets, kind: secret, optional: true}

  # A signed claim rather than a shared secret: this repo neither mints nor
  # verifies it, it only stores it. Optional -- Community is the default and an
  # empty field must stay empty rather than reading as "not set yet".
  - key: catena_license
    panel: {group: license, section: secrets, kind: secret, optional: true}

# --- non-secret configuration ------------------------------------------------
config:
  # ---- the target's identity (hosts.yml, neither store nor .env) ----
  - key: HOST_PUBLIC_IP
    step: target
    label:
      en: Host public IP
      fr: Adresse IP publique du serveur
    help:
      en: The server's public IPv4 address, as given by the provider.
      fr: L'adresse IPv4 publique du serveur, telle que fournie par l'hébergeur.
    required: true
    residence: host
    env: {section: host, default: "", example: "203.0.113.10"}

  # Written into hosts.yml as the bootstrap entry's ansible_host: the address
  # every install leg dials. Empty means HOST_PUBLIC_IP, which stays the
  # host's public address either way (coturn, the external checks). The
  # launcher asks for it behind its public/private choice, labelled by
  # gui_choice; `catena-cli install --address` overrides it for one run.
  - key: HOST_SSH_ADDRESS
    step: target
    label:
      en: Host private SSH address
      fr: Adresse SSH privée du serveur
    help:
      en: >-
        The address the installer reaches the server at over SSH when port 22
        is not reachable on its public IP, such as its tailnet address. Leave
        empty to install over the public IP.
      fr: >-
        L'adresse par laquelle l'installateur joint le serveur en SSH quand le
        port 22 n'est pas joignable sur son adresse IP publique, par exemple
        son adresse sur le réseau privé (tailnet). Laisser vide pour installer
        par l'adresse IP publique.
    gui_choice:
      public:
        en: Install over the public IP
        fr: Installer par l'adresse IP publique
      private:
        en: Install over a private IP (when port 22 is not reachable from the public IP)
        fr: >-
          Installer par une adresse IP privée (quand le port 22 n'est pas
          joignable depuis l'adresse IP publique)
    residence: host
    env: {section: host, default: ""}

  # Written into hosts.yml as ansible_port: the port the controller connects
  # on. The firewall rules name 22 literally, so this moves what the controller
  # dials and not what the host opens.
  - key: HOST_SSH_PORT
    step: target
    label:
      en: Host SSH port
      fr: Port SSH du serveur
    help:
      en: The port SSH answers on, on the server as delivered. Usually 22.
      fr: Le port sur lequel SSH répond, sur le serveur tel que livré. Habituellement 22.
    required: true
    residence: host
    env: {section: host, default: "22"}

  # The provider's login, used until bootstrap creates OPS_USER.
  - key: HOST_INITIAL_USER
    step: target
    label:
      en: Host initial user
      fr: Utilisateur initial du serveur
    help:
      en: >-
        The login the provider gave for the new server, such as root, debian
        or ubuntu.
      fr: >-
        L'identifiant fourni par l'hébergeur pour le nouveau serveur, par
        exemple root, debian ou ubuntu.
    required: true
    residence: host
    env: {section: host, default: "root"}

  # ---- the administrator, whose email is the panel's login ----
  #
  # One address for the Portainer admin and the initial realm admin. A host
  # fact by any reading: the `.env` only seeds the store with it.
  - key: ADMIN_EMAIL
    step: configuration
    label:
      en: Admin email
      fr: Courriel de l'administrateur
    help:
      en: >-
        The administrator's email address. It is the login of the Catena panel;
        the matching password is shown during the install.
      fr: >-
        L'adresse courriel de l'administrateur. C'est l'identifiant de
        connexion du panneau Catena. Le mot de passe correspondant est affiché
        pendant l'installation.
    required: true
    residence: store
    var: cfg_admin_email
    env: {section: admin, default: "", example: "you@example.com"}

  # ---- controller-resident ----
  #
  # A dedicated pair per project makes revocation one file delete. catena-cli
  # install offers to generate a missing pair; the graphical installer suggests
  # the pairs already in ~/.ssh.
  - key: SSH_PRIVATE_KEY
    step: configuration
    label:
      en: SSH key file
      fr: Fichier de clé SSH
    help:
      en: >-
        Private key used to log in to the server. Its public key (same path
        ending in .pub) is already on the server, or is added with the initial
        user's password.
      fr: >-
        Clé privée utilisée pour se connecter au serveur. Sa clé publique (même
        chemin, terminé par .pub) est déjà sur le serveur, ou y est ajoutée
        avec le mot de passe de l'utilisateur initial.
    required: true
    residence: controller
    gui_suggestions_from: ssh_keys
    env: {section: ssh, default: "~/.ssh/catena_ed25519"}

  # Not asked: sshd's AllowUsers, the sudoers drop-in, the home paths and the
  # bootstrap probes all name it, so an operator who needs another sets it in
  # the inventory.
  - key: OPS_USER
    residence: controller
    help:
      en: >-
        The administration account created on the server, which the SSH key
        above logs in to.
    env: {section: ssh, default: "ops"}

  # The server's clock zone, an IANA name such as America/Toronto, which
  # schedules and logs follow. Applied by the next converge. A list the host
  # supplies rather than one declared here: the zones a host can set are the
  # ones its own tzdata carries.
  - key: COMMON_TIMEZONE
    residence: store
    var: cfg_common_timezone
    panel:
      group: server
      section: config
      kind: text
      optional: true
      default: America/Toronto
      options_from: timezones

  # A locale the server generates for its shells. Applied by the next converge.
  - key: COMMON_LOCALE
    residence: store
    var: cfg_common_locale
    panel:
      group: server
      section: config
      kind: choice
      optional: true
      default: en_CA.UTF-8
      options: [en_CA.UTF-8, fr_CA.UTF-8, en_US.UTF-8, en_GB.UTF-8, fr_FR.UTF-8,
                de_DE.UTF-8, es_ES.UTF-8, it_IT.UTF-8, nl_NL.UTF-8, pt_BR.UTF-8,
                C.UTF-8]

  # Comma-separated tags advertised by each node. Every tag must be authorized
  # on the control server first, or key minting rejects with a 400. Read with
  # NO fallback tag, so a missing value fails the join rather than advertising
  # a tag the credential is not scoped for.
  - key: TAILSCALE_TAGS
    residence: store
    var: cfg_tailscale_tags
    panel: {group: tunnel, section: config, kind: text, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [tailscale, headscale]}

  # A separate optional tier, independent of the primary disk.
  - key: STORAGE_BULK_ENABLED
    residence: controller
    help:
      en: >-
        Mount an optional bulk storage share over CIFS or NFS, for append-only
        data. Never database storage, never the Docker data-root.
    env: {section: storage, default: "false"}

  - key: STORAGE_BULK_MOUNT_POINT
    residence: controller
    help:
      en: Where the bulk storage share is mounted on the server.
    env: {section: storage, default: "/mnt/bulk"}

  # ---- the install's identity ----
  #
  # THE identity of the install: every public hostname is <sub>.<zone>, so this
  # is the value the rest of the page renders against. Every server is
  # installed without one; the public surface defers until one arrives. The
  # page offers the domains the Cloudflare token reaches, since a domain it
  # cannot reach is one the tunnel cannot serve.
  - key: CLOUDFLARE_ZONE
    residence: store
    var: cfg_cloudflare_zone
    panel: {group: hostnames, section: config, kind: text, optional: true,
            options_from: cloudflare_zones}

  # ---- public hostnames ----
  #
  # Each is a single DNS label, never an FQDN: the zone is appended by the
  # converge, so "auth.example.com" here would render auth.example.com.example.com.
  # Blank means the product's own default, which `panel.default` names.
  - key: PORTAINER_SUBDOMAIN
    residence: store
    var: cfg_portainer_admin_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: portainer}

  - key: KEYCLOAK_SUBDOMAIN
    residence: store
    var: cfg_keycloak_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: auth}

  - key: CATENA_ADMIN_SUBDOMAIN
    residence: store
    var: cfg_catena_admin_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: dash}

  - key: GATUS_SUBDOMAIN
    residence: store
    var: cfg_gatus_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: monitor}

  - key: HEALTHCHECKS_SUBDOMAIN
    residence: store
    var: cfg_healthchecks_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: heartbeat}

  - key: BESZEL_SUBDOMAIN
    residence: store
    var: cfg_beszel_subdomain
    panel: {group: subdomains, section: config, kind: text, optional: true,
            default: hub}

  # Prefixes the name of the tunnel a host creates. Blank leaves each host
  # owning one tunnel named after its inventory hostname; a prefix of "corp-"
  # on a host named "vps1" names the tunnel "corp-vps1". A store key because the
  # host composes its own tunnel name and reads the prefix straight off the
  # store, which is what lets the cloudflared actions ship in the image instead
  # of being rendered by a converge. Not a field on any form: it is written to
  # the store (catena-onbox-config) before the domain's token is saved, and
  # names the tunnel created next.
  - key: CLOUDFLARED_TUNNEL_NAME_PREFIX
    residence: store
    var: cfg_cloudflared_tunnel_prefix

  # ---- the access plane ----
  #
  # A blank submission on the settings page means "leave this alone", so a
  # choice with the empty string as its off position could be turned on and
  # never off. TAILNET_PROVIDER and SMTP_PROVIDER therefore store `none`.
  #
  # Whether this host joins a private network, and which control plane runs it.
  # `none` keeps key-only SSH on the public address as the only way in, and port
  # 22 open, because a host with no alternative path has nothing to prove and
  # closing it would be a lockout. With a provider, the host joins the tailnet,
  # and the panel's Lockdown can close public 22 once it has proven that path;
  # the host reopens 22 while its tailnet is down.
  - key: TAILNET_PROVIDER
    residence: store
    var: cfg_tailnet_provider
    panel:
      group: tunnel
      section: config
      kind: choice
      optional: true
      options: [none, tailscale, headscale]
      warning: settings.warning.tailnet_provider

  - key: TAILNET_CONTROL_URL
    residence: store
    var: cfg_tailnet_control_url
    panel: {group: tunnel, section: config, kind: text, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  # The Headscale user the minted pre-auth keys belong to; Headscale keys are
  # per-user, and the advertised tag must be in THAT user's tagOwners.
  - key: HEADSCALE_USER
    residence: store
    var: cfg_headscale_user
    panel: {group: tunnel, section: config, kind: text, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  # ---- backup ----
  #
  # ONE address that carries the endpoint and the bucket:
  # s3:https://<endpoint>/<bucket>. Blank schedules no backup.
  - key: BACKUP_RESTIC_REPO
    residence: store
    var: cfg_backup_restic_repo
    panel: {group: backup, section: config, kind: text, optional: false}

  # Absolute paths outside /srv/catena to include in the backup, separated by
  # commas: what a client who mounted their own disk declares, since the
  # product does not manage block devices and a bind mount from elsewhere is
  # invisible to the backup set until it is named here. The nightly coverage
  # lane reads the same value, so one declaration both captures the path and
  # stops it reading as an uncovered bind-mount source.
  - key: BACKUP_EXTRA_PATHS
    residence: store
    var: cfg_backup_extra_paths
    panel: {group: backup, section: config, kind: text, optional: true}

  # Dead-man endpoints. The first pair overrides the locally provisioned pings;
  # the second is off-host only and has no default, which is the one case a
  # whole-host outage can still be reported.
  - key: BACKUP_HEALTHCHECK_URL
    residence: store
    var: cfg_backup_healthcheck_url
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_ATTEMPTED_URL
    residence: store
    var: cfg_backup_healthcheck_attempted_url
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_URL_CLIENT
    residence: store
    var: cfg_backup_healthcheck_url_client
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_URL_OPERATOR
    residence: store
    var: cfg_backup_healthcheck_url_operator
    panel: {group: alerts, section: config, kind: text, optional: true}

  # The offsite-copy lane's dead-man endpoints. WHICH buckets it copies is not
  # a knob: that is the store's offsite_copies list, read straight off disk so
  # adding a copy takes effect with no converge in between.
  - key: OFFSITE_HEALTHCHECK_URL
    residence: store
    var: cfg_offsite_healthcheck_url

  - key: OFFSITE_HEALTHCHECK_ATTEMPTED_URL
    residence: store
    var: cfg_offsite_healthcheck_attempted_url

  # ---- outbound mail ----
  #
  # One choice, one address, one credential. The provider routes it and the
  # converge fills in the host, the port and (for Resend, whose SMTP username
  # is the literal string "resend" for every account) the username. `none` is
  # stored, as for TAILNET_PROVIDER above.
  - key: SMTP_PROVIDER
    residence: store
    var: cfg_smtp_provider
    panel:
      group: mail
      section: config
      kind: choice
      optional: true
      options: [none, resend, brevo, server]

  # ONE address, whichever provider routes it. A field per provider, one
  # non-empty at a time, would make the converge infer which is active, and
  # switching provider would mean knowing to CLEAR the old field rather than
  # filling the new one.
  - key: SMTP_SENDER
    residence: store
    var: cfg_smtp_sender
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [resend, brevo, server]}

  - key: SMTP_HOST
    residence: store
    var: cfg_smtp_host
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [server]}

  - key: SMTP_PORT
    residence: store
    var: cfg_smtp_port
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [server]}

  # The `server` relay's login, and also the Brevo one, which is
  # account-specific unlike Resend's.
  - key: SMTP_USER
    residence: store
    var: cfg_smtp_user
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [brevo, server]}

  # ---- alert delivery ----
  - key: NTFY_SERVER
    residence: store
    var: cfg_ntfy_server
    panel: {group: alerts, section: config, kind: text, optional: true}

  # Must be hard to guess: anyone who knows it can post to it.
  - key: NTFY_TOPIC
    residence: store
    var: cfg_ntfy_topic
    panel: {group: alerts, section: config, kind: text, optional: true}

  # ---- who may sign in ----
  #
  # Whether every account must enrol a second factor. A choice rather than free
  # text because the converge renders it straight into the realm's
  # required-action config, where a value it cannot read as a boolean would
  # either fail the import or silently mean off. The identity probe reads the
  # resulting posture back and reports drift.
  - key: IDENTITY_ENFORCE_MFA
    residence: store
    var: cfg_identity_enforce_mfa
    panel:
      group: access
      section: config
      kind: choice
      optional: true
      options: ["false", "true"]

  # ---- site policy ----
  #
  # A site policy rather than an install input.
  - key: APT_PROXY_URL
    residence: store
    var: cfg_apt_proxy_url
    help:
      en: >-
        Optional apt HTTP proxy, such as an apt-cacher-ng. Blank pulls packages
        directly; HTTPS sources always do.
    env: {section: site, default: ""}

  - key: DOCKER_REGISTRY_MIRROR_URL
    residence: store
    var: cfg_docker_registry_mirror_url
    help:
      en: >-
        Optional pull-through registry mirror, as a base URL with scheme, host
        and port. Blank pulls from docker.io directly.
    env: {section: site, default: ""}

  # ---- certificate issuance, development only ----
  #
  # Store keys rather than `.env` ones because the roles that read them are
  # reconcile-side: a host that converges itself cannot ask an operator's
  # laptop which CA to trust. Empty and false on every client install. No panel
  # field shows them, so the `.env` stays their one editor and every converge
  # from the inventory reseeds them: a bench host follows its Pebble when the
  # address moves.

  # Staging has no rate limit, and coturn only validates presence and expiry.
  - key: COTURN_CERTBOT_STAGING
    residence: store
    var: cfg_coturn_certbot_staging
    help:
      en: Issue the TURN server's certificate from Let's Encrypt's staging CA.
    env: {section: development, default: "false", reseed: true}

  - key: MAILSERVER_CERTBOT_STAGING
    residence: store
    var: cfg_mailserver_certbot_staging
    help:
      en: >-
        Issue the self-hosted mailserver's mail.<zone> certificate from Let's
        Encrypt's staging CA.
    env: {section: development, default: "false", reseed: true}

  - key: CATENA_ACME_DIRECTORY_URL
    residence: store
    var: cfg_acme_directory_url
    help:
      en: A local ACME server's directory URL. Blank issues from Let's Encrypt.
    env: {section: development, default: "", reseed: true}

  # Mapped to the hostname `pebble` in /etc/hosts: Pebble's endpoint-cert SAN.
  - key: CATENA_ACME_HOST_IP
    residence: store
    var: cfg_acme_host_ip
    help:
      en: The local ACME server's address on the network the server reaches.
    env: {section: development, default: "", reseed: true}

  # Base64 because a raw multi-line PEM cannot live in a `.env`.
  - key: CATENA_ACME_CA_BUNDLE_PEM_B64
    residence: store
    var: cfg_acme_ca_bundle_b64
    help:
      en: The local ACME server's CA bundle, base64-encoded.
    env: {section: development, default: "", reseed: true}
