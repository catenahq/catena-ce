# The knob registry: every value a client supplies, declared once.
#
# THIS FILE IS THE SOURCE. `knobs.json` beside it is RENDERED from it by
# `render_knobs.py` and committed; nothing hand-edits the JSON. Four consumers
# read the JSON rather than this file, because one of them cannot read YAML:
# `onbox_config.py` runs as root on a minimal target host whose system python
# has no PyYAML, which is a constraint that file states about itself and this
# one has to respect.
#
#   helpers/onbox_config.py   which keys the store accepts, and how the
#                             converge sees them
#   seed.py                   what the installer asks for, and the `.env`
#                             template it generates
#   catena-admin settings     which fields the panel renders
#   gui/                      which fields each installer step shows
#
# A knob declared here appears in all of them or in none. That is the property
# this file exists for: the same names lived in four places, and eight of them
# drifted across two sessions before a test was written to hold two of the four
# together.
#
# `inventory/example/.env.example` is the SECOND rendered artifact, produced by
# the same `render_knobs.py --write`. `env_header` is its preamble,
# `env_sections` is the ordered list of headings it groups keys under, and each
# knob's `env.section` names the one it belongs to. Its order comes from
# `env_sections`, so this file can group by residence while the file a client
# edits groups by subject.
#
# WHAT IS NOT HERE. Secrets the client never supplies: the internal service
# secrets and the user-held DR keyset are minted on-box, and the role-minted
# ones are captured by the role that provisioned them. All three carry python
# callables or a role name rather than a client-facing shape, nothing outside
# the box reads them, and none of them is ever rendered on a form. They stay in
# `onbox_config.py`.
#
# PROSE IS RENDERED, so write it for a client reading the template as well as
# for whoever edits this file. A `doc` is one folded paragraph and is re-wrapped
# on the way out; a line indented further than its neighbours is held verbatim,
# which is how a command or a JSON fragment keeps its shape.
#
# FIELD MEANINGS
#
#   residence   where the value LIVES.
#               store      -- /etc/catena/config.json. The client owns it and
#                             the panel may write it; the `.env` only seeds it
#                             on the first converge and is never read again.
#               controller -- the inventory `.env`. The installer needs it
#                             before there is a box to ask.
#               host       -- the target's identity. Written into hosts.yml by
#                             seed, not into either registry above.
#   var         the Ansible fact the converge loader publishes a stored value
#               as. Declared rather than derived by lowercasing: four keys do
#               not follow that rule, and a derived mapping fails silently by
#               publishing a fact nothing reads. Absent means no projection --
#               a runtime lane reads the value straight off the store.
#   env         the key's place in the generated `.env.example`: which
#               `section` it prints under, the `default` it carries, and the
#               `options` it is limited to. Absent means the key never appears
#               in the template. An EMPTY default is also what marks a key
#               optional to seed's structural checks.
#   panel       how catena-admin renders it. Absent means the settings page
#               does not show it.
#   depends     the choice field and values that govern whether the panel shows
#               this one. The same fact the converge acts on, which is why it
#               is declared and not left to a template. The field is `choice`
#               rather than the `on` it reads as in English, because YAML 1.1
#               parses a bare `on` as the boolean true.
version: 1

env_header: |-
  catena: client-editable, non-secret configuration.

  GENERATED from catena-ce/ansible/helpers/knobs.yml. To change a key or its
  explanation, edit that file and run `python3 helpers/render_knobs.py
  --write`; an edit made here is replaced by the next render, and fails the
  CI check until then.

  Copy it to `.env` inside a host directory (gitignored), one per inventory
  so several hosts coexist in one checkout: inventory/example/.env,
  inventory/clientco/.env. Ansible resolves <inventory_dir>/.env through the
  `dotenv` lookup plugin at playbooks/lookup_plugins/, and group_vars reads a
  value with "{{ lookup('dotenv', 'KEY') }}".

  No secret belongs in here, or anywhere else in an inventory. Every secret
  lives on the target at /etc/catena/config.json, minted there or entered in
  catena-admin > Settings. See catena-ce/SECRETS.md.

env_sections:
  - name: host
    title: Host
    doc: |-
      Where the box is and how the first SSH lands on it, before the ops
      account exists and before the firewall closes.

  - name: ssh
    title: SSH
    doc: |-
      Generate the pair once:

          ssh-keygen -t ed25519 -f ~/.ssh/catena_ed25519 -C catena

  - name: tailnet
    title: Private network
    doc: |-
      Every host joins a private network before anything else is reachable.
      One method, two providers: Tailscale SaaS or a self-hosted Headscale.

      The three keys below SEED the on-box store on the first converge and
      are never read again. After the install the choice lives in
      catena-admin > Settings > Access and tunnels, which is where a client
      changes it; editing them here afterwards changes nothing.

      Tailscale SaaS: leave all three blank. `catena install` prints the
      one-time admin-console steps, then prompts for the OAuth client id and
      secret. Headscale: set TAILNET_PROVIDER=headscale and fill the two
      below it; `catena install` prompts instead for a headscale_api_key
      (preferred, a short-lived tagged pre-auth key is minted per run) or a
      static headscale_preauth_key.

      Either credential is asked for at install rather than in the panel,
      because it is what JOINS the host to the tailnet and the panel is
      published on that tailnet. Rotating it later is a Settings job;
      supplying it the first time cannot be.

  - name: cloudflare
    title: Cloudflare
    doc: |-
      Filling the domain in makes `catena install` ask for the API token that
      publishes it, and the tunnel comes up during the install. Leaving it
      blank installs a server with no public surface; the domain and the token
      are then entered together in catena-admin > Settings, and the next
      converge publishes it.

  - name: admin
    title: Admin identity

  - name: storage
    title: Storage
    doc: |-
      The primary disk holds app data and the Docker data-root under one
      prefix, which the backup set, the volume layout and the restore machine
      all name.

  - name: site
    title: Site policy

  - name: locale
    title: Locale and timezone

  - name: development
    title: Development only
    doc: |-
      Leave every key in this section at its default on a client install.
      They point certificate issuance at a local Pebble or at Let's Encrypt
      staging, whose certificates browsers, TURN clients and sending MTAs all
      reject. The test bench sets them to its own host-side ACME server.

# --- vendor credentials the client HOLDS ------------------------------------
#
# Stored, never minted here. They arrive through the transient bootstrap adopt
# file or the settings API, and this list is the allowlist that write enforces:
# a credential a role tells the client to enter, that is not declared here, has
# a documented path that raises.
secrets:
  - key: cloudflare_api_token
    doc: >-
      The one credential the public surface needs. The account id is not an
      input: the host engine resolves it from the token.
    panel: {group: tunnel, section: secrets, kind: secret, optional: false}

  - key: cloudflare_api_tokens
    doc: >-
      Multi-domain (Business): a JSON map of zone to API token, each token
      scoped to its one zone. The panel's domains page owns it, so it is not a
      field on the settings form.

  - key: tailscale_oauth_client_id
    doc: >-
      Tailscale SaaS mints a per-converge tagged auth key from this client, so
      nothing long-lived lands on the VPS. Required on that path, hidden on the
      Headscale one, so the badge is only read where it is true.
    panel: {group: tunnel, section: secrets, kind: secret, optional: false}
    depends: {choice: TAILNET_PROVIDER, values: [tailscale]}

  - key: tailscale_oauth_client_secret
    panel: {group: tunnel, section: secrets, kind: secret, optional: false}
    depends: {choice: TAILNET_PROVIDER, values: [tailscale]}

  - key: headscale_api_key
    doc: >-
      Headscale has no OAuth API. The node joins with a pre-auth key, minted
      per converge from this one (preferred, nothing long-lived on the VPS).
      Either this or the static key satisfies the converge, so neither is
      required on its own.
    panel: {group: tunnel, section: secrets, kind: secret, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  - key: headscale_preauth_key
    doc: The static fallback when no API key is stored. Long-lived, hence second.
    panel: {group: tunnel, section: secrets, kind: secret, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  - key: backup_s3_access_key
    panel: {group: backup, section: secrets, kind: secret, optional: false}

  - key: backup_s3_secret_key
    panel: {group: backup, section: secrets, kind: secret, optional: false}

  - key: smtp_password
    doc: >-
      The one mail credential, whichever provider is chosen: the Resend API
      key, the Brevo SMTP key, or the relay's password.
    panel: {group: mail, section: secrets, kind: secret, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [resend, brevo, server]}

  - key: mailserver_relay_password
    doc: >-
      Configures the mailserver APPLICATION, not the host's shared outbound
      path, so it belongs to that template's own configuration rather than the
      mail group on the settings page.

  - key: mailserver_spamhaus_dqs_key
    doc: The mailserver template's Spamhaus subscription. Same reasoning.

  - key: storage_bulk_username
    doc: >-
      CIFS credentials for the optional bulk mount. Client-held: the share is
      the client's NAS. NFS authenticates by source IP and supplies neither. The
      storage role's bulk.yml names both on the settings page when it asks for
      them, so the page has to offer them under exactly these names.
    panel: {group: share, section: secrets, kind: secret, optional: true}

  - key: storage_bulk_password
    panel: {group: share, section: secrets, kind: secret, optional: true}

  - key: catena_license
    doc: >-
      A signed claim rather than a shared secret: this repo neither mints nor
      verifies it, it only stores it. Optional -- Community is the default and
      an empty field must stay empty rather than reading as "not set yet".
    panel: {group: license, section: secrets, kind: secret, optional: true}

  - key: portal_stripe_secret_key
    doc: >-
      The optional client portal's billing keys. Never minted; billing routes
      degrade gracefully while they are blank.

  - key: portal_stripe_webhook_secret

# --- non-secret configuration ------------------------------------------------
config:
  # ---- the target's identity (hosts.yml, neither store nor .env) ----
  - key: HOST_PUBLIC_IP
    residence: host
    doc: >-
      The provider's public IPv4. Used during bootstrap, before the firewall
      closes and the box is reached another way.
    env: {section: host, default: "203.0.113.10"}

  - key: HOST_INITIAL_USER
    residence: host
    doc: >-
      The provider's default login for that same phase (root, ubuntu, debian,
      ec2-user). Not OPS_USER -- that account does not exist yet.
    env: {section: host, default: "root"}

  - key: HOST_SSH_PORT
    residence: host
    doc: >-
      The port the controller CONNECTS on, written into hosts.yml as
      ansible_port. The firewall rules name 22 literally, so a value here moves
      what the controller dials and not what the host opens.
    env: {section: host, default: "22"}

  # ---- the installer needs these before there is a box to ask ----
  - key: SSH_PRIVATE_KEY
    residence: controller
    doc: >-
      A dedicated keypair for this project, so revoking at engagement end is
      throwing away one file. The installer offers to generate it when absent.
    env: {section: ssh, default: "~/.ssh/catena_ed25519"}

  - key: SSH_PUBLIC_KEY_FILE
    residence: controller
    env: {section: ssh, default: "~/.ssh/catena_ed25519.pub"}

  - key: OPS_USER
    residence: controller
    doc: The non-root account created on every VPS, authorized for the key above.
    env: {section: ssh, default: "ops"}

  - key: COMMON_TIMEZONE
    residence: controller
    env: {section: locale, default: "America/Toronto"}

  - key: COMMON_LOCALE
    residence: controller
    env: {section: locale, default: "en_CA.UTF-8"}

  - key: TAILSCALE_TAGS
    residence: controller
    doc: >-
      Comma-separated tags advertised by each node. Every tag must be
      authorized on the control server first, or key minting rejects with a
      400. Read with NO default, so a missing key fails the lookup rather than
      falling back to a tag the credential is not scoped for.
    env: {section: tailnet, default: "tag:vps"}

  - key: TAILSCALE_ACCEPT_DNS
    residence: controller
    doc: Whether Tailscale may override systemd-resolved. Usually false.
    env: {section: tailnet, default: "false"}

  - key: STORAGE_MODE
    residence: controller
    doc: >-
      built_in carves directories on the root disk; attached formats and mounts
      a separate block device.
    env: {section: storage, default: "built_in", options: [built_in, attached]}

  - key: STORAGE_BLOCK_DEVICE
    residence: controller
    doc: Read only when STORAGE_MODE is attached.
    env: {section: storage, default: "/dev/sdb"}

  - key: STORAGE_BULK_ENABLED
    residence: controller
    doc: >-
      A separate optional tier over CIFS or NFS, independent of the primary
      disk. Append-only data only: never database storage, never the Docker
      data-root.
    env: {section: storage, default: "false"}

  - key: STORAGE_BULK_MOUNT_POINT
    residence: controller
    env: {section: storage, default: "/mnt/bulk"}

  # ---- the install's identity ----
  - key: CLOUDFLARE_ZONE
    residence: store
    var: cfg_cloudflare_zone
    doc: >-
      THE identity of the install: every public hostname is <sub>.<zone>, so
      this is the value the rest of the page renders against. Blank is a real
      state -- a server is installed before its domain is decided, and the
      public surface defers until one arrives.
    env: {section: cloudflare, default: ""}
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: ADMIN_EMAIL
    residence: store
    var: cfg_admin_email
    doc: >-
      One address for the Portainer admin and the initial realm admin. The
      matching password is minted on the box and shown once at the end of the
      install, with the first-login URLs. A host fact by any reading, which is
      why the `.env` only seeds it.
    env: {section: admin, default: "operator@example.com"}

  # ---- public hostnames ----
  #
  # Each is a single DNS label, never an FQDN: the zone is appended by the
  # converge, so "auth.example.com" here would render auth.example.com.example.com.
  # Blank means the product's own default, which is what every host used when
  # these were compiled in.
  - key: PORTAINER_SUBDOMAIN
    residence: store
    var: cfg_portainer_admin_subdomain
    doc: >-
      The one subdomain three sources give three answers for -- `portainer` in
      the shipped starter, `apps` in the operator skeleton, `admin` for
      established clients -- which is what makes it a host fact rather than the
      product's. The rest are the product's scheme and are compiled in, because
      a host has to converge itself without reading this file.
    env: {section: cloudflare, default: "portainer"}
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: KEYCLOAK_SUBDOMAIN
    residence: store
    var: cfg_keycloak_subdomain
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: CATENA_ADMIN_SUBDOMAIN
    residence: store
    var: cfg_catena_admin_subdomain
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: GATUS_SUBDOMAIN
    residence: store
    var: cfg_gatus_subdomain
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: HEALTHCHECKS_SUBDOMAIN
    residence: store
    var: cfg_healthchecks_subdomain
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: BESZEL_SUBDOMAIN
    residence: store
    var: cfg_beszel_subdomain
    panel: {group: hostnames, section: config, kind: text, optional: true}

  - key: CLOUDFLARED_TUNNEL_NAME_PREFIX
    residence: store
    var: cfg_cloudflared_tunnel_prefix
    doc: >-
      Prefixes the name of the tunnel a host creates. Blank leaves each host
      owning one tunnel named after its inventory hostname; a prefix of
      "corp-" on a host named "vps1" names the tunnel "corp-vps1". A store key
      because the host composes its own tunnel name and reads the prefix
      straight off the store, which is what lets the cloudflared actions ship
      in the image instead of being rendered by a converge.
    env: {section: cloudflare, default: ""}

  # ---- the private network ----
  - key: TAILNET_PROVIDER
    residence: store
    var: cfg_tailnet_provider
    doc: >-
      The whole routing decision. Blank means Tailscale SaaS. Explicit rather
      than inferred from whether a control URL happens to be filled in: that
      inference made "switch back to Tailscale" mean "know to CLEAR a field",
      and a blank submission on the settings page means "leave this alone", so
      the client could make that decision in one direction only.
    env: {section: tailnet, default: ""}
    panel:
      group: tunnel
      section: config
      kind: choice
      optional: true
      options: [tailscale, headscale]
      warning: settings.warning.tailnet_provider

  - key: TAILNET_CONTROL_URL
    residence: store
    var: cfg_tailnet_control_url
    doc: The Headscale server's base URL.
    env: {section: tailnet, default: ""}
    panel: {group: tunnel, section: config, kind: text, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  - key: HEADSCALE_USER
    residence: store
    var: cfg_headscale_user
    doc: >-
      The Headscale user the minted pre-auth keys belong to; Headscale keys are
      per-user, and the advertised tag must be in THAT user's tagOwners.
    env: {section: tailnet, default: ""}
    panel: {group: tunnel, section: config, kind: text, optional: true}
    depends: {choice: TAILNET_PROVIDER, values: [headscale]}

  # ---- backup ----
  - key: BACKUP_RESTIC_REPO
    residence: store
    var: cfg_backup_restic_repo
    panel: {group: backup, section: config, kind: text, optional: false}

  - key: BACKUP_MIN_INTERVAL_HOURS
    residence: store
    doc: >-
      Lengthens the effective cadence beyond the base timer. No Ansible
      projection: the backup wrapper reads it off the store at runtime, with no
      converge in between. There is deliberately no enable switch beside it --
      whether a host backs up is answered by whether the endpoint is usable and
      whether the lane is scheduled, and a third answer could disagree with
      both.
    panel: {group: backup, section: config, kind: text, optional: true}

  # Dead-man endpoints. The first pair overrides the locally provisioned pings;
  # the second is off-host only and has no default, which is the one case a
  # whole-host outage can still be reported.
  - key: BACKUP_HEALTHCHECK_URL
    residence: store
    var: cfg_backup_healthcheck_url
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_ATTEMPTED_URL
    residence: store
    var: cfg_backup_healthcheck_attempted_url
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_URL_CLIENT
    residence: store
    var: cfg_backup_healthcheck_url_client
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: BACKUP_HEALTHCHECK_URL_OPERATOR
    residence: store
    var: cfg_backup_healthcheck_url_operator
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: OFFSITE_HEALTHCHECK_URL
    residence: store
    var: cfg_offsite_healthcheck_url
    doc: >-
      The offsite-copy lane's dead-man endpoints. WHICH buckets it copies is
      not a knob: that is the store's offsite_copies list, read straight off
      disk so adding a copy takes effect with no converge in between.

  - key: OFFSITE_HEALTHCHECK_ATTEMPTED_URL
    residence: store
    var: cfg_offsite_healthcheck_attempted_url

  # ---- outbound mail ----
  #
  # One choice, one address, one credential. The provider routes it and the
  # converge fills in the host, the port and (for Resend, whose SMTP username
  # is the literal string "resend" for every account) the username.
  - key: SMTP_PROVIDER
    residence: store
    var: cfg_smtp_provider
    doc: >-
      `none` is a real stored value, not a blank: a blank submission means
      "leave this alone", so an off position spelled as the empty string would
      be a control that could turn mail on and never off.
    panel:
      group: mail
      section: config
      kind: choice
      optional: true
      options: [none, resend, brevo, server]

  - key: SMTP_SENDER
    residence: store
    var: cfg_smtp_sender
    doc: >-
      ONE address, whichever provider routes it. A field per provider
      (RESEND_SENDER_EMAIL, BREVO_SENDER_EMAIL, SMTP_FROM, one non-empty at a
      time) would make the converge infer which is active, and switching
      provider would mean knowing to CLEAR the old field rather than filling
      the new one -- leaving it filled would keep sending through the provider
      the client just left.
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [resend, brevo, server]}

  - key: SMTP_HOST
    residence: store
    var: cfg_smtp_host
    doc: Applies to the `server` choice only.
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [server]}

  - key: SMTP_PORT
    residence: store
    var: cfg_smtp_port
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [server]}

  - key: SMTP_USER
    residence: store
    var: cfg_smtp_user
    doc: >-
      The `server` relay's login, and also the Brevo one, which is
      account-specific unlike Resend's.
    panel: {group: mail, section: config, kind: text, optional: true}
    depends: {choice: SMTP_PROVIDER, values: [brevo, server]}

  # ---- alert delivery ----
  - key: NTFY_SERVER
    residence: store
    var: cfg_ntfy_server
    panel: {group: alerts, section: config, kind: text, optional: true}

  - key: NTFY_TOPIC
    residence: store
    var: cfg_ntfy_topic
    doc: Must be hard to guess -- anyone who knows it can post to it.
    panel: {group: alerts, section: config, kind: text, optional: true}

  # ---- who may sign in ----
  - key: IDENTITY_ENFORCE_MFA
    residence: store
    var: cfg_identity_enforce_mfa
    doc: >-
      Whether every account must enrol a second factor. A choice rather than
      free text because the converge renders it straight into the realm's
      required-action config, where a value it cannot read as a boolean would
      either fail the import or silently mean off. The identity probe reads the
      resulting posture back and reports drift, which is the pair this
      completes.
    panel:
      group: access
      section: config
      kind: choice
      optional: true
      options: ["false", "true"]

  # ---- site policy ----
  - key: APT_PROXY_URL
    residence: store
    var: cfg_apt_proxy_url
    doc: >-
      Optional apt HTTP proxy, typically an apt-cacher-ng. Blank pulls direct.
      HTTPS sources stay direct either way. A site policy rather than an
      install input.
    env: {section: site, default: ""}

  - key: DOCKER_REGISTRY_MIRROR_URL
    residence: store
    var: cfg_docker_registry_mirror_url
    doc: >-
      Optional pull-through mirror, as a base URL with scheme, host and port.
      Blank pulls from docker.io directly.
    env: {section: site, default: ""}

  # ---- certificate issuance, development only ----
  #
  # Store keys rather than `.env` ones because the roles that read them are
  # reconcile-side: a host that converges itself cannot ask an operator's
  # laptop which CA to trust. They point issuance at a local Pebble or at Let's
  # Encrypt staging, and are empty and false on every client install.
  - key: COTURN_CERTBOT_STAGING
    residence: store
    var: cfg_coturn_certbot_staging
    doc: >-
      Issue the coturn TLS-TURN certificate from Let's Encrypt's staging CA.
      Staging has no rate limit and coturn only validates presence and expiry.
    env: {section: development, default: "false"}

  - key: MAILSERVER_CERTBOT_STAGING
    residence: store
    var: cfg_mailserver_certbot_staging
    doc: The same, for the self-hosted mailserver's mail.<zone> certificate.
    env: {section: development, default: "false"}

  - key: CATENA_ACME_DIRECTORY_URL
    residence: store
    var: cfg_acme_directory_url
    doc: >-
      A local ACME server's directory endpoint. Blank issues against Let's
      Encrypt as normal.
    env: {section: development, default: ""}

  - key: CATENA_ACME_HOST_IP
    residence: store
    var: cfg_acme_host_ip
    doc: Mapped to the hostname `pebble` in /etc/hosts, Pebble's endpoint-cert SAN.
    env: {section: development, default: ""}

  - key: CATENA_ACME_CA_BUNDLE_PEM_B64
    residence: store
    var: cfg_acme_ca_bundle_b64
    doc: Base64 because a raw multi-line PEM cannot live in a `.env`.
    env: {section: development, default: ""}
