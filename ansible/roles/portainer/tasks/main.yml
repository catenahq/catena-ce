---
# Deploy Portainer CE as the container control plane. Runs after roles/traefik
# (catena-network) and roles/postgres. The compose/stack API this exposes is
# consumed by the CE infrastructure tasks + the EE managed-update engine (their
# seam swaps land next). See defaults for the ownership rationale.

- name: "portainer: assert vault_admin_password is usable as the initial admin"
  ansible.builtin.assert:
    that:
      - vault_admin_password is defined
      - vault_admin_password | length >= 12
    fail_msg: >-
      vault_admin_password missing or < 12 chars. Portainer's initial admin
      needs >= 12; the installer mints vault_admin_password (>= 16).

# ─── admin-password swarm secret (immutable; create-once) ────────────────
# Delivered to Portainer via --admin-password-file so the admin is set at first
# boot (no racing the 5-minute /api/users/admin/init window). Staged to a 0600
# file for `docker secret create` -- no shell interpolation of the password.
- name: "portainer: check admin-password swarm secret exists"
  ansible.builtin.command: "docker secret inspect {{ portainer_admin_secret_name }}"
  register: _pt_secret
  changed_when: false
  failed_when: false

- name: "portainer: create admin-password swarm secret"
  when: _pt_secret.rc != 0
  block:
    - name: "portainer: stage secret material"
      ansible.builtin.copy:
        dest: /root/.catena-portainer-admin
        content: "{{ vault_admin_password }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "portainer: docker secret create"
      ansible.builtin.command: "docker secret create {{ portainer_admin_secret_name }} /root/.catena-portainer-admin"
      register: _pt_secret_create
      changed_when: _pt_secret_create.rc == 0
  always:
    - name: "portainer: remove staged secret material"
      ansible.builtin.file:
        path: /root/.catena-portainer-admin
        state: absent

# ─── swarm service ───────────────────────────────────────────────────────
- name: "portainer: check catena-portainer swarm service exists"
  ansible.builtin.command: "docker service inspect {{ portainer_service_name }} --format '{{ '{{' }}.ID{{ '}}' }}'"
  register: _pt_service
  changed_when: false
  failed_when: false

# Host-mode publish so the port lands on the node IP (reached over the tailnet;
# the registry fragment below firewalls it to tailnet + RFC1918). Docker socket
# lets Portainer manage the local Docker/Swarm endpoint. /data on a named volume
# persists its BoltDB store (replaces the old control-plane Postgres DB). The
# trailing --admin-password-file arg is passed to the portainer binary.
- name: "portainer: create catena-portainer swarm service (first run)"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - create
      - "--name={{ portainer_service_name }}"
      - --network=catena-network
      - --restart-condition=any
      - "--publish=mode=host,published={{ portainer_ui_port }},target=9000"
      - "--secret={{ portainer_admin_secret_name }}"
      - "--mount=type=bind,source=/var/run/docker.sock,destination=/var/run/docker.sock"
      - "--mount=type=volume,source={{ portainer_data_volume }},destination=/data"
      - --constraint=node.role==manager
      - "{{ portainer_image }}"
      - "--admin-password-file=/run/secrets/{{ portainer_admin_secret_name }}"
  when: _pt_service.rc != 0
  register: _pt_service_create
  changed_when: _pt_service_create.rc == 0

# Rolling image-drift upgrade (pinned-tag bump takes effect next converge).
- name: "portainer: read running image (drift check)"
  ansible.builtin.command: >-
    docker service inspect {{ portainer_service_name }}
    --format '{{ "{{" }}.Spec.TaskTemplate.ContainerSpec.Image{{ "}}" }}'
  register: _pt_running_image
  changed_when: false
  failed_when: false
  when: _pt_service.rc == 0

- name: "portainer: rolling image upgrade on drift"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - --image
      - "{{ portainer_image }}"
      - "{{ portainer_service_name }}"
  when:
    - _pt_service.rc == 0
    - _pt_running_image.stdout is defined
    - portainer_image not in (_pt_running_image.stdout | default(''))
  register: _pt_upgrade
  changed_when: _pt_upgrade.rc == 0

# ─── tailnet-only firewall for the UI port (registry fragment) ───────────
- name: "portainer: ensure public-port fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "portainer: declare UI port (registry fragment, tailnet-only)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/portainer.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": portainer_ui_port | int,
           "scope": "tailnet", "bind": "docker", "owner": "portainer",
           "comment": "Portainer control-plane UI -- tailnet + RFC1918 only"}
        ] | to_nice_json
      }}
  register: _pt_ports_fragment

- name: "portainer: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when: _pt_ports_fragment.changed

# ─── readiness ───────────────────────────────────────────────────────────
# Portainer serves its SPA on the UI port once the BoltDB store is initialised.
# Probe the SPA root (always 200, no auth, version-agnostic) rather than a
# specific /api/* status path, before the token-mint tasks (which land next)
# can race first boot.
- name: "portainer: wait for the UI to answer"
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_ui_port }}/"
    method: GET
    status_code: [200, 307, 308]
    timeout: 5
  register: _pt_ready
  retries: 40
  delay: 5
  until: _pt_ready.status | default(-1) in [200, 307, 308]
  failed_when: false

# ─── mint / heal vault_portainer_api_key ─────────────────────────────────
# The CE compose seam (roles/infrastructure) + the EE managed-update engine
# talk to Portainer with an X-API-Key. It is minted from the initial admin
# (created at first boot via --admin-password-file above) by
# helpers/bootstrap_portainer_admin.py: signs in with vault_admin_password,
# resolves the admin user id, POSTs /api/users/{id}/tokens, and writes the
# rawAPIKey into the plaintext group_vars vault.yml (SOPS+age was dropped,
# 0b). include_vars then brings it into the in-flight playbook scope; the
# on-box config loader adopts it into /etc/catena/config.json next converge.
#
# Fires when the vault has NO key yet (first install) OR when the stored key
# is rejected by the live Portainer (401/403 -- e.g. the operator recreated
# the admin, or a /data restore replaced the BoltDB store the token lived
# in). The validate is one cheap GET; the mint only runs on the miss.
- name: "portainer: validate vault_portainer_api_key against Portainer"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/stacks"
    method: GET
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    status_code: [200, 401, 403]
    timeout: 10
  register: _pt_apikey_validate
  delegate_to: localhost
  become: false
  # Transient 5xx / connection refused (Portainer mid-reschedule) must not
  # bomb the converge -- the mint condition below only fires on missing key
  # or an explicit 401/403.
  failed_when: false
  when:
    - vault_portainer_api_key is defined
    - vault_portainer_api_key | length > 10

- name: "portainer: mint Portainer API key (missing or rejected by live Portainer)"
  when: >-
    vault_portainer_api_key is not defined
    or (vault_portainer_api_key | length) <= 10
    or (_pt_apikey_validate.status | default(200)) in [401, 403]
  block:
    - name: "portainer: pin the inventory vault.yml path"
      ansible.builtin.set_fact:
        _pt_apikey_vault_file: "{{ inventory_dir }}/group_vars/all/vault.yml"

    - name: "portainer: invoke bootstrap_portainer_admin.py to mint an API key"
      ansible.builtin.command:
        # Stdlib-only helper -- skip the `uv` indirection so a minimal
        # controller (Alpine system python) can run it via python3 directly.
        argv:
          - python3
          - "{{ playbook_dir }}/../helpers/bootstrap_portainer_admin.py"
          - --vault
          - "{{ _pt_apikey_vault_file }}"
          - --admin-password-vault
          - "{{ _pt_apikey_vault_file }}"
          - --tailnet-ip
          - "{{ ansible_host }}"
          - --port
          - "{{ portainer_ui_port }}"
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "portainer: reload vault so the freshly-minted key is in playbook scope"
      ansible.builtin.include_vars:
        file: "{{ _pt_apikey_vault_file }}"

# ─── local Docker environment (endpoint) ─────────────────────────────────
# Portainer does NOT auto-create a local endpoint on first boot even with the
# socket mounted; the stack API is scoped per-endpoint, so provision it once
# here (POST /api/endpoints, EndpointCreationType=1 = local Docker socket).
# roles/infrastructure/tasks/portainer_endpoint.yml resolves its Id per converge.
- name: "portainer: list environments (endpoints)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/endpoints"
    method: GET
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    status_code: 200
    return_content: true
  register: _pt_endpoints
  delegate_to: localhost
  become: false
  failed_when: false
  when:
    - vault_portainer_api_key is defined
    - vault_portainer_api_key | length > 10

- name: "portainer: create local Docker environment (create-once)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/endpoints"
    method: POST
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    body_format: form-multipart
    body:
      Name: "{{ portainer_local_endpoint_name }}"
      # 1 = local Docker environment via the mounted /var/run/docker.sock.
      EndpointCreationType: "1"
    status_code: [200, 201]
  delegate_to: localhost
  become: false
  when:
    - vault_portainer_api_key is defined
    - vault_portainer_api_key | length > 10
    - (_pt_endpoints.json | default([]) | selectattr('Name', 'equalto', portainer_local_endpoint_name) | list | length) == 0

# ─── legacy Dokploy control-plane teardown (one-time cutover) ─────────────
# On a host that ran the Dokploy era, the retired control plane (the
# `dokploy` swarm service on :3000 plus its dokploy-postgres/dokploy-redis
# backends) keeps running forever unless removed -- orphaned attack surface
# alongside the new stack. Remove the SERVICES only, once the Portainer
# control plane above is live (this point in the role means the admin is
# bootstrapped and the API answered). Data volumes are deliberately left in
# place: they hold the Dokploy-era control-plane DB and cost only disk;
# an operator can prune them manually once satisfied with the cutover.
# The dokploy-network overlay is NOT removed here -- legacy app containers
# may still be attached to it; it dies with its last consumer.
# `docker service rm` prints removed names to stdout and rc=1 for names
# that do not exist, so one fixed-name rm is idempotent: failed_when
# absorbs the already-gone (or raced-away) case, changed_when fires only
# when something was actually removed.
- name: "portainer: remove the legacy Dokploy control-plane services"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - rm
      - dokploy
      - dokploy-postgres
      - dokploy-redis
  when:
    - vault_portainer_api_key is defined
    - vault_portainer_api_key | length > 10
  register: _legacy_dokploy_rm
  failed_when: false
  changed_when: _legacy_dokploy_rm.stdout | default('') | length > 0
