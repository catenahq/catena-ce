---
# roles/portainer -- the container control plane.
#
# Portainer CE spans Docker + Swarm + (later) Kubernetes, which the old control
# plane could not. It provides the compose/stack + env + logs + lifecycle API the migration
# needs; routing stays with catena-traefik (Portainer does no reverse proxy).
#
# Deployed as a swarm service on catena-network with the docker socket, so it
# manages the local Docker/Swarm endpoint (id 1). The UI/API port is published
# host-mode and firewalled to the tailnet via the public-ports registry -- same
# model as the old control-plane :3000 (operators + the controller reach it over the
# tailnet; a catena-traefik route at apps.<zone> comes later).

# Pinned LTS. Portainer 2.27.0 removed the old POST /api/stacks form; 2.39.4
# (lts tag) uses the typed /api/stacks/create/{type}/{method} paths the CE +
# EE API seams target. Renovate should track portainer_image_tag.
portainer_image_tag: "2.43.0"
portainer_image: "portainer/portainer-ce:{{ portainer_image_tag }}"

portainer_service_name: catena-portainer
portainer_data_volume: catena-portainer-data

# ─── swarm-service hardening ─────────────────────────────────────────────
# One dict, two renderers -- see playbooks/filter_plugins/swarm_service_drift.py
# and the same block in roles/postgres/defaults for the full rationale.
#
# Memory: Portainer is a Go binary over a BoltDB store; 1g is well above its
# working set and exists to bound a leak, not to pack the box.
portainer_limit_memory: "1g"
portainer_reserve_memory: "128m"

# Enough to close the BoltDB store cleanly.
portainer_stop_grace_period: "30s"

# FailureAction is `pause`, NEVER `rollback` -- the catena-admin managed-update
# engine is the rollback authority and swarm rolling back underneath it
# corrupts its outcome accounting. Full reasoning in roles/postgres/defaults.
portainer_update_failure_action: "pause"
# No healthcheck (see below), so the monitor window only ever catches a task
# that fails to START. A long window would just slow every bump down for a
# signal that cannot arrive later than the first few seconds.
portainer_update_monitor: "30s"
portainer_update_max_failure_ratio: 0
# stop-first, NOT start-first, despite Portainer being replaceable in place:
# the UI port is published `mode=host`, so the port is bound on the node
# itself and two tasks cannot hold it at once. start-first would have the new
# task fail its port bind while the old one is still listening.
portainer_update_order: "stop-first"

# NO healthcheck. `--health-cmd` is executed as `/bin/sh -c`, and the
# portainer/portainer-ce image has no shell: its whole filesystem is the
# `/portainer` binary, the web assets and a CA bundle. There is no in-image
# probe to call. Readiness is covered instead by the HTTP probe of the SPA
# root at the bottom of tasks/main.yml, which runs from the controller.
#
# Consequence to know: `docker service ls` showing 1/1 for catena-portainer
# means the process started, not that it is serving. For catena-postgres and
# catena-traefik, which do carry healthchecks, the replica count is a real
# health signal.

# Placement. BOTH constraints live here, not split between the create argv and
# this dict: swarm_service_drift reconciles the FULL constraint set, so a
# constraint passed in the argv but absent from the dict would be
# --constraint-rm'd on the next converge.
#
#   node.role==manager -- it bind-mounts the docker socket and manages the
#     local Docker/Swarm endpoint, which only a manager can serve.
#   catena.role==data  -- /data is a node-LOCAL named volume holding the
#     BoltDB store. Rescheduled elsewhere, Portainer would come up empty:
#     no endpoint, no stacks, no admin user.
portainer_constraints:
  - "node.role==manager"
  - "node.labels.catena.role==data"

portainer_desired:
  image: "{{ portainer_image }}"
  constraints: "{{ portainer_constraints }}"
  limit_memory: "{{ portainer_limit_memory }}"
  reserve_memory: "{{ portainer_reserve_memory }}"
  stop_grace_period: "{{ portainer_stop_grace_period }}"
  update_failure_action: "{{ portainer_update_failure_action }}"
  update_monitor: "{{ portainer_update_monitor }}"
  update_max_failure_ratio: "{{ portainer_update_max_failure_ratio }}"
  update_order: "{{ portainer_update_order }}"

# NOTE: portainer_ui_port + portainer_api_base are defined GLOBALLY in
# group_vars/all/main.yml so roles/infrastructure + dashboard-sync can reference
# them cross-role. Not redeclared here to avoid drift. portainer_ui_port default
# = 9000 (env PORTAINER_UI_PORT); it is published host-mode + firewalled to the
# tailnet, same model as the old control-plane :3000.

# Initial admin. Reuses the shared operator identity (vault_admin_password,
# >= 16 chars, same as Keycloak). Delivered via --admin-password-file
# from a swarm secret so it is set at first boot (no racing the 5-minute
# /api/users/admin/init window).
portainer_admin_user: admin
portainer_admin_secret_name: catena_portainer_admin_password

# portainer_api_base is GLOBAL (group_vars/all/main.yml), used cross-role by
# the token-mint + downstream CE/EE seam calls. Not redeclared here.

# Name of the local Docker environment (endpoint) this role provisions via
# POST /api/endpoints (EndpointCreationType=1). Portainer does NOT auto-create
# a local endpoint on first boot even with the socket mounted, so the role
# creates it once; portainer_endpoint.yml resolves its Id for every stack call.
portainer_local_endpoint_name: catena-local

# HTTP timeout (seconds) for a stack create/update -- Portainer deploys
# synchronously (image pull + compose up happen inside the request), so this
# must comfortably exceed a cold multi-image pull. Consumed by
# roles/infrastructure/tasks/_portainer_stack_deploy_attempt.yml.
portainer_deploy_http_timeout: 600
