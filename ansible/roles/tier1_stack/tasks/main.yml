---
# Render the accumulated tier-1 specs into one compose file and prove it
# loads. This file is the ORACLE, not the apply.
#
# What applies is tasks/reconcile_one.yml, which each tier-1 role includes
# with the very same spec it contributes here. So the stack file is not a
# parallel description that could drift from the running services -- it is
# the other rendering of the identical dict, and `docker stack config`
# type-checking it every converge is what proves the specs are coherent
# against the docker actually installed rather than against our reading of
# the schema.
#
# `docker stack deploy` was the other candidate for the apply and lost on
# measurement: it always names services `<stack>_<key>`, with no flag to
# suppress the prefix and no adoption of an existing standalone service. The
# rename reaches 13 DNS sites, three ANCHORED matchers in catena-admin's
# recovery engines, and 107 bench assertions -- and the anchored ones fail
# silently, which is the class of wrong this phase exists to remove. Full
# reasoning in playbooks/filter_plugins/tier1_stack.py.
#
# catena-admin is NOT in this stack, and that is a schema limit rather than a
# choice: it joins the supplementary group owning the 0750 recovery export
# dir, `docker stack config` answers "Additional property group_add is not
# allowed", and the compose schema has no other spelling. It keeps its own
# create argv (playbooks/filter_plugins/catena_admin_service.py). cloudflared
# is absent for a different reason -- its converge is already a Go engine.

- name: "tier1_stack: which tier-1 services contributed a spec"
  ansible.builtin.set_fact:
    _tier1_present: >-
      {{ catena_tier1_specs | default([]) | map(attribute='name') | list }}

# A tag-scoped converge runs some roles and not others, so the accumulator
# holds a SUBSET. Writing that would leave an oracle describing three
# services on a host running four -- something that LOOKS like the whole
# plane and is not, which is worse than no file. So the incomplete case skips
# loudly and leaves the last complete render in place.
- name: "tier1_stack: skipped -- not every tier-1 role ran this converge"
  ansible.builtin.debug:
    msg: >-
      Rendered no stack file: {{ tier1_stack_required
        | difference(_tier1_present) | join(', ') }} contributed no spec
      (present: {{ _tier1_present | join(', ') | default('none', true) }}).
      Expected under a tag-scoped converge; a FULL converge reaching this
      message means a tier-1 role failed before its contribute task.
  when: tier1_stack_required | difference(_tier1_present) | length > 0

- name: "tier1_stack: render, write and validate"
  when: tier1_stack_required | difference(_tier1_present) | length == 0
  block:
    - name: "tier1_stack: ensure the stack dir exists"
      ansible.builtin.file:
        path: "{{ tier1_stack_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # 0640 root:root. It names every swarm secret the control plane mounts.
    # That is not the secret material -- swarm holds that -- but it is a map
    # of what to ask for, and nothing on this host needs to read it but root.
    - name: "tier1_stack: write the rendered stack file"
      ansible.builtin.copy:
        dest: "{{ tier1_stack_path }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          # GENERATED by roles/tier1_stack -- do not edit.
          # Rendered from the specs each tier-1 role contributes during the
          # converge. Edits here are overwritten on the next run; change the
          # role defaults instead.
          {{ catena_tier1_specs | tier1_stack_render
             | to_nice_yaml(indent=2, width=200) }}
      register: _tier1_stack_written

    # The compose loader, not our reading of it. It catches what the renderer
    # cannot know: a property this docker rejects, a duration it will not
    # parse, an external it cannot resolve a name for. Failing here is the
    # whole point of rendering before applying.
    - name: "tier1_stack: validate the rendered file loads"
      ansible.builtin.command:
        argv:
          - docker
          - stack
          - config
          - --compose-file
          - "{{ tier1_stack_path }}"
      register: _tier1_stack_config
      changed_when: false

    # The DECLARATION the Go engine reads (payload/engines/tier1). Same specs,
    # same order, verbatim -- no second rendering, so the file cannot describe
    # a control plane different from the one the Ansible ladder just applied.
    #
    # It is written even though nothing consumes it yet. The engine is the
    # apply path Phase 5 moves to, and having the declaration land on every
    # converge NOW means the switch is one caller change rather than a caller
    # change plus a file that has never existed on a real host.
    #
    # Same 0640 root as the stack file and for the same reason: it names every
    # swarm secret the control plane mounts. Not the material -- swarm holds
    # that -- but a map of what to ask for.
    - name: "tier1_stack: write the engine declaration"
      ansible.builtin.copy:
        dest: "{{ tier1_declaration_path }}"
        owner: root
        group: root
        mode: "0640"
        content: "{{ {'services': catena_tier1_specs} | to_nice_json(indent=2) }}\n"

    - name: "tier1_stack: rendered services"
      ansible.builtin.debug:
        msg: >-
          {{ tier1_stack_path }} validates:
          {{ _tier1_present | join(', ') }}
          (declaration: {{ tier1_declaration_path }})
