---
# Read ONE service's built-in spec from the catena-tier1 host engine.
#
# The counterpart to reconcile_one.yml: that one hands the engine a
# declaration, this one asks the engine for it. Roles that have no per-host
# opinion about their service use this and stop carrying a dict of their own,
# which is what keeps a single description of the control plane rather than two
# that agree until the next field is added to one of them.
#
# Caller contract:
#   tier1_spec_name   the service name (catena-postgres, catena-traefik, ...)
# Sets:
#   tier1_builtin_spec  the spec dict, in the same shape the roles used to
#                       build and the same shape reconcile_one.yml takes
#
# WHY THE ENGINE OWNS IT. The desired state then travels with the IMAGE: bump
# the catena-admin tag, roles/payload re-extracts the engines, and what the
# host reconciles toward moves with it. A spec assembled here instead means
# every change to the control plane needs a laptop and an inventory that is up
# to date -- which is the property roles/tier1_stack's own header complains
# about ("a control plane that drifted at 3am waited for a laptop").

- name: "tier1: stat the reconcile engine"
  ansible.builtin.stat:
    path: "{{ tier1_engine_bin }}"
  register: _t1_spec_bin

# Same refusal as reconcile_one.yml, and for the same reason: without the
# engine there is no control plane at all, so a converge that carried on would
# report success over a host with nothing running.
- name: "tier1: the reconcile engine is missing"
  ansible.builtin.fail:
    msg: >-
      {{ tier1_engine_bin }} is absent, so the built-in spec for
      {{ tier1_spec_name }} cannot be read. The engine ships in the
      catena-admin host payload and roles/payload installs it right after
      roles/docker -- check the "Payload:" tasks above for why the extract did
      not land. A host whose payload is staged out of band
      (CATENA_PAYLOAD_INSTALL=false) must be staged BEFORE the converge that
      brings the control plane up.
  when: not (_t1_spec_bin.stat.exists | default(false))

- name: "tier1: read the built-in spec for {{ tier1_spec_name }}"
  ansible.builtin.command:
    argv:
      - "{{ tier1_engine_bin }}"
      - spec
      - "{{ tier1_spec_name }}"
  register: _t1_spec_raw
  changed_when: false

# services[0] rather than a search: `spec <name>` is asked for exactly one
# service and errors on a name it does not know, so a second element here would
# mean the engine answered a question nobody asked.
- name: "tier1: decode the built-in spec for {{ tier1_spec_name }}"
  ansible.builtin.set_fact:
    tier1_builtin_spec: "{{ (_t1_spec_raw.stdout | from_json).services[0] }}"
