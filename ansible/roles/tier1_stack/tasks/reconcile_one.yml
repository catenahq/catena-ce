---
# Create-or-reconcile ONE tier-1 swarm service from its spec. Included by
# roles/traefik, roles/postgres, roles/portainer and roles/coturn, each
# passing the same spec it contributes to the stack file.
#
# This file is the point of Phase 4. Those four roles each carried their own
# copy of this ladder -- inspect, create on the miss, inspect again, diff,
# update on the diff -- and four copies of a reconcile loop is four places a
# fix has to land and three places it can be forgotten. The spec is per-role;
# the ladder is not.
#
# Caller contract:
#   tier1_spec  the service spec (same dict the role upserts into
#               catena_tier1_specs)
#
# Ordering is unchanged by this refactor: each role still creates its service
# where it always did in site.yml, so traefik still makes the overlay before
# postgres wants it and postgres is still accepting connections before
# keycloak provisions its DB. Role-specific work stays in the role -- traefik
# force-rolls on a static-config change, coturn SIGHUPs on a cert change,
# neither of which is a spec diff.

# _t1_drift is a set_fact, so it OUTLIVES this include. Without the reset, a
# service that exists and has drifted would leave its flags behind for the
# next service in the converge -- and the next one might be a first-run
# create, whose reconcile task would then fire with someone else's diff
# against a service it never inspected.
- name: "tier1: reset the drift accumulator"
  ansible.builtin.set_fact:
    _t1_drift: []

- name: "tier1: {{ tier1_spec.name }} -- does the swarm service exist"
  ansible.builtin.command:
    argv: [docker, service, inspect, "{{ tier1_spec.name }}",
           --format, '{{ "{{" }}.ID{{ "}}" }}']
  register: _t1_service
  changed_when: false
  failed_when: false

- name: "tier1: {{ tier1_spec.name }} -- create the swarm service (first run)"
  ansible.builtin.command:
    argv: >-
      {{ tier1_spec | tier1_service_create_argv(
           tier1_spec | swarm_service_create_args) }}
  register: _t1_create
  changed_when: _t1_create.rc == 0
  when: _t1_service.rc != 0

- name: "tier1: {{ tier1_spec.name }} -- inspect the live spec"
  ansible.builtin.command:
    argv: [docker, service, inspect, "{{ tier1_spec.name }}"]
  register: _t1_inspect
  changed_when: false
  failed_when: false
  when: _t1_service.rc == 0

# Reconciles the FULL hardening spec, not just the pinned tag, so a flag added
# to a role's desired dict reaches an existing host and not only a fresh
# install. Empty list means converged, which the reconcile's changed_when keys
# off -- so a re-converge with nothing to change recreates no task.
- name: "tier1: {{ tier1_spec.name }} -- compute spec drift"
  ansible.builtin.set_fact:
    _t1_drift: >-
      {{ (_t1_inspect.stdout | from_json) | swarm_service_drift(tier1_spec) }}
  when:
    - _t1_service.rc == 0
    - _t1_inspect.rc == 0

- name: "tier1: {{ tier1_spec.name }} -- reconcile the spec (rolling)"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'service', 'update'] + _t1_drift + [tier1_spec.name] }}
  register: _t1_reconcile
  changed_when: _t1_reconcile.rc == 0
  when:
    - _t1_service.rc == 0
    - _t1_drift | length > 0
