---
# Pinned Dokploy version (match a GitHub release tag). Matches the
# Keycloak pattern: role-default hardcoded; override per-client by
# setting dokploy_version in inventory/<name>/group_vars/all/main.yml.
dokploy_version: "v0.29.8"

# Upstream Dokploy installer. Fetched to disk before running so the exact
# bytes we scan for bootstrap-image pre-pull are the bytes we execute.
dokploy_install_url: "https://dokploy.com/install.sh"

# Port Dokploy's web UI listens on (inside the container). Not published to
# the host -- reachable only via apps.<zone> (CF tunnel) or by operators on
# the tailnet via direct Traefik container routing.
dokploy_port: 3000

# On-disk root for Dokploy's own state.
dokploy_data_root: "{{ storage_mount_point }}/dokploy"

# Dokploy uses Docker Swarm. Advertise address is the tailnet IP so that
# any future multi-node expansion uses the private tailnet path.
dokploy_advertise_addr: "{{ ansible_host }}"

# Traefik moved to roles/traefik (2026-07 Dokploy->Portainer migration):
# the reverse proxy is now the catena-owned catena-traefik container, not
# Dokploy's install.sh-born dokploy-traefik. See roles/traefik/defaults.

# The admin UI hostname -- must match cloudflared_ingress_rules and the
# matching `dokploy-admin` entry in `oauth2_proxy_apps`. Set
# DOKPLOY_ADMIN_SUBDOMAIN in inventory/<name>/.env
# to override. Default is `apps` because the UI is the operator's app-deployment
# surface; `admin` is available as an override for established clients already
# trained on that name.
dokploy_admin_hostname: "{{ lookup('dotenv', 'DOKPLOY_ADMIN_SUBDOMAIN', default='apps') }}.{{ cloudflare_zone }}"
