---
# roles/postgres -- catena-owned Postgres for infra databases (Keycloak today).
#
# Project convention is "one Postgres per VPS, multiple DBs inside" -- per-app
# DBs (Nextcloud, etc.) keep their own containers; this hosts the infra DBs.
# Portainer stores its own state in BoltDB, so nothing else on the host
# provides a shared Postgres.

catena_postgres_service_name: catena-postgres

# Pinned image major. Per-app template DBs track the central
# postgres_default_image in catena-templates (catalog.yml), also 18.x; this
# infra Postgres (Keycloak's DB) is pinned independently since it follows
# Keycloak's support matrix.
catena_postgres_image_tag: "18"
catena_postgres_image: "postgres:{{ catena_postgres_image_tag }}"

# Superuser. roles/keycloak/tasks/provision_db.yml detects the live superuser
# from the container env, so it follows this automatically.
catena_postgres_superuser: postgres

# Swarm secret carrying the superuser password (kept out of `docker service
# inspect`). Immutable -- rotation is a create-new + service-update flow,
# deferred (BACKLOG_TECHNICAL.md).
catena_postgres_secret_name: catena_postgres_password

# Named volume for the data dir. UNLIKE the old control-plane Postgres (excluded
# from restic + logically replayed), this is backed up as a RAW volume by the
# default restic set: that one was excluded because the install.sh regenerated
# the DB password on a fresh box, skewing a raw restore. We set the
# password from vault (swarm secret) and Postgres skips initdb on a restored
# (non-empty) volume, so the restored password matches the (also-restored)
# vault -- no skew, raw restore is correct. (Backup consistency across the
# cold-docker restore is exercised by the restore_dr / hot_restore bench.)
catena_postgres_data_volume: catena-postgres-data
