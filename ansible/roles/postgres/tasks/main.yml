---
# Deploy the catena-owned Postgres swarm service. Runs after roles/traefik
# (which creates the catena-network overlay) and before roles/keycloak (which
# provisions its DB inside this service). See defaults for ownership rationale.

- name: "postgres: assert catena_postgres_password is set"
  ansible.builtin.assert:
    that:
      - catena_postgres_password is defined
      - catena_postgres_password | length >= 12
      - catena_postgres_password not in ['REPLACE', 'REPLACE-LONG-RANDOM-STRING']
    fail_msg: >-
      catena_postgres_password is missing or a placeholder. The converge
      mints it on the box; a missing one means the on-box store at
      /etc/catena/config.json was not loaded or was truncated.

# ─── swarm secret (immutable; create-once) ───────────────────────────────
- name: "postgres: check swarm secret exists"
  ansible.builtin.command: "docker secret inspect {{ catena_postgres_secret_name }}"
  register: _pg_secret
  changed_when: false
  failed_when: false

# Stage the password to a 0600 file and `docker secret create <name> <file>`
# rather than piping it through a shell -- avoids any quoting/injection issue
# with special characters in the password. Removed immediately after.
- name: "postgres: create swarm secret from the on-box password"
  when: _pg_secret.rc != 0
  block:
    - name: "postgres: stage secret material"
      ansible.builtin.copy:
        dest: /root/.catena-postgres-secret
        content: "{{ catena_postgres_password }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "postgres: docker secret create"
      ansible.builtin.command: "docker secret create {{ catena_postgres_secret_name }} /root/.catena-postgres-secret"
      register: _pg_secret_create
      changed_when: _pg_secret_create.rc == 0
  always:
    - name: "postgres: remove staged secret material"
      ansible.builtin.file:
        path: /root/.catena-postgres-secret
        state: absent

# ─── swarm service ───────────────────────────────────────────────────────
- name: "postgres: check catena-postgres swarm service exists"
  ansible.builtin.command: "docker service inspect {{ catena_postgres_service_name }} --format '{{ '{{' }}.ID{{ '}}' }}'"
  register: _pg_service
  changed_when: false
  failed_when: false

# Single-node swarm service on catena-network. POSTGRES_PASSWORD_FILE points at
# the mounted secret; the named volume persists the cluster across task
# reschedules + service updates. No published host port -- reachable only on
# catena-network by the service name (catena-postgres:5432).
#
# The mounts and the environment come from defaults, not from this argv: the
# tier-1 stack file renders from the same two variables, so there is one
# spelling of each rather than a copy per renderer. PGDATA's version-agnostic
# subdir layout is explained where it is declared.
#
# --detach: do not block create on convergence. A crashlooping task would
# otherwise hang `docker service create` indefinitely; the pg_isready gate
# below is the real readiness barrier and fails fast (120s) instead.
- name: "postgres: create catena-postgres swarm service (first run)"
  ansible.builtin.command:
    # Identity + wiring flags here; the hardening subset (memory, stop-grace,
    # update policy, healthcheck) is rendered from catena_postgres_desired so
    # create and the reconcile below cannot drift apart. The image is the
    # positional argument, so it is appended after the rendered flags.
    argv: "{{ _pg_create_argv }}"
  vars:
    _pg_create_argv: >-
      {{
        ['docker', 'service', 'create', '--detach',
         '--name=' ~ catena_postgres_service_name,
         '--network=' ~ catena_postgres_network,
         '--restart-condition=any',
         '--secret=' ~ catena_postgres_secret_name]
        + (catena_postgres_env | swarm_env_create_args)
        + (catena_postgres_mounts | map('regex_replace', '^', '--mount=') | list)
        + (catena_postgres_desired | swarm_service_create_args)
        + [catena_postgres_image]
      }}
  when: _pg_service.rc != 0
  register: _pg_service_create
  changed_when: _pg_service_create.rc == 0

# Spec reconcile (rolling). Reconciles the FULL hardening spec, not just the
# pinned tag, so a flag added to the desired dict reaches an existing host and
# not only a fresh install.
- name: "postgres: inspect the live service spec"
  ansible.builtin.command: "docker service inspect {{ catena_postgres_service_name }}"
  register: _pg_inspect
  changed_when: false
  failed_when: false
  when: _pg_service.rc == 0

- name: "postgres: compute spec drift"
  ansible.builtin.set_fact:
    _pg_drift: >-
      {{ (_pg_inspect.stdout | from_json)
         | swarm_service_drift(catena_postgres_desired) }}
  when:
    - _pg_service.rc == 0
    - _pg_inspect.rc == 0

- name: "postgres: reconcile the service spec (rolling)"
  ansible.builtin.command:
    argv: "{{ ['docker', 'service', 'update'] + _pg_drift + [catena_postgres_service_name] }}"
  when:
    - _pg_service.rc == 0
    - _pg_drift | default([]) | length > 0
  register: _pg_reconcile
  changed_when: _pg_reconcile.rc == 0

# ─── tier-1 stack spec ───────────────────────────────────────────────────
# Contributed from HERE, next to the create argv, and built from the same
# variables it is: a spec assembled anywhere else would be a second reading of
# this role's intent, which is the drift the stack file exists to remove.
# roles/tier1_stack renders the accumulated list at the end of the converge.
- name: "postgres: contribute the tier-1 stack spec"
  ansible.builtin.set_fact:
    catena_tier1_specs: >-
      {{ catena_tier1_specs | default([]) | tier1_spec_upsert(
           catena_postgres_desired | combine({
             'name': catena_postgres_service_name,
             'networks': [catena_postgres_network],
             'secrets': [catena_postgres_secret_name],
             'environment': catena_postgres_env,
             'volumes': catena_postgres_mounts
                        | map('swarm_mount_to_compose') | list,
           })) }}

# ─── readiness ───────────────────────────────────────────────────────────
# Gate downstream (roles/keycloak provision_db) on the cluster actually
# accepting connections -- container-exists is not readiness (the entrypoint
# runs initdb + a first-boot restart on a fresh volume).
- name: "postgres: wait for catena-postgres to accept connections"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ctr="$(docker ps --format '{{ "{{" }}.Names{{ "}}" }}' \
        | grep -E '^{{ catena_postgres_service_name }}\.' | head -n1)"
      if [ -z "$ctr" ]; then echo "no {{ catena_postgres_service_name }} task yet" >&2; exit 1; fi
      docker exec "$ctr" pg_isready -U {{ catena_postgres_superuser }}
    executable: /bin/bash
  register: _pg_ready
  retries: 30
  delay: 4
  until: _pg_ready.rc == 0
  changed_when: false
