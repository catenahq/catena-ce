---
# Bootstrap the postmaster mailbox so docker-mailserver can start at all.
#
# docker-mailserver has two hard boot gates in start-mailserver.sh: (1) it
# polls 120s for >=1 mailbox then shuts down ("no accounts were provided -
# Dovecot could not be started"), and (2) with SSL_TYPE=manual it then
# requires the cert at SSL_CERT_PATH. Mailboxes are otherwise provisioned
# from Keycloak membership by the dashboard-sync reconciler
# (vps-scripts/mailbox_sync.py) on a 5-minute timer, which loses the 120s
# race on first deploy and provisions nothing when no member has a mailbox
# yet (the bench, and any fresh install) -- so DMS crash-loops forever.
# RFC 2142 also requires postmaster@ to be deliverable.
#
# The mailserver_cert task ran just before this and injected the cert
# during the stable account-wait window. Adding postmaster@<zone> here is
# the action that unblocks gate 1; the same boot then clears gate 2 (cert
# present) and Dovecot starts. The reconciler preserves postmaster (never
# deletes it). Password is a throwaway -- login is via Keycloak OIDC, like
# every mailbox. Idempotent: `setup email add` exits 1 with "already
# exists" on a re-converge, which we treat as success.
#
# We deliberately do NOT probe with `setup email list`: it shells out to a
# doveadm userdb lookup that needs Dovecot's socket, so it errors whenever
# Dovecot is down -- exactly the bootstrap state.
#
# Opt-in template: no-ops when the mailserver is not deployed (no dms).

- name: "Mailserver accounts: resolve the dms container (shared, waits out its restart cycle)"
  ansible.builtin.include_tasks: _mailserver_dms_locate.yml

- name: "Mailserver accounts: throwaway postmaster password (login is via OIDC)"
  ansible.builtin.set_fact:
    _ms_postmaster_pw: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  no_log: true
  when: (mailserver_dms_ct | length) > 0

# The container is re-resolved on EVERY attempt, not taken from the locate
# step. This is the task that breaks dms out of its restart loop, so it runs
# while dms is still looping and each restart mints a new swarm task id -- a
# name captured before the retries began is dead for most of them, and the
# retry would then be 30 attempts against the same corpse.
- name: "Mailserver accounts: ensure postmaster mailbox exists (unblocks DMS boot)"
  ansible.builtin.shell: |
    set -o pipefail
    ct=$(docker ps --filter label=vps.component=dms \
      --format '{{ "{{" }}.Names{{ "}}" }}' | head -n1)
    [ -n "$ct" ] || { echo "no dms container right now" >&2; exit 1; }
    docker exec "$ct" setup email add \
      {{ ("postmaster@" ~ cloudflare_zone) | quote }} {{ _ms_postmaster_pw | quote }}
  args:
    executable: /bin/bash
  register: _ms_acct_add
  # rc 0 alone is not "created": if the tool ever reports an existing mailbox
  # on stdout with rc 0, this task claims a change on every converge, and a
  # converge that never reports a clean recap fails the idempotency
  # assertions (bench restore_dr, via runner.assert_ce_idempotent_rerun).
  # Matching failed_when's own already-exists test keeps the two in step.
  changed_when:
    - _ms_acct_add.rc == 0
    - "'already exists' not in (_ms_acct_add.stderr | default(''))"
    - "'already exists' not in (_ms_acct_add.stdout | default(''))"
  # Success = created (rc 0) OR already present ("already exists" on a
  # re-converge). Retry rides out the boot crash-loop windows when the
  # container is briefly down (docker exec then errors with neither). Fail
  # loud only if it never succeeds for some other reason.
  until: _ms_acct_add.rc == 0 or 'already exists' in (_ms_acct_add.stderr | default(''))
  failed_when:
    - _ms_acct_add.rc != 0
    - "'already exists' not in (_ms_acct_add.stderr | default(''))"
  retries: 30
  delay: 10
  no_log: true
  when: (mailserver_dms_ct | length) > 0

# RFC 2142 requires abuse@ deliverable alongside postmaster@. An alias
# (not a mailbox) so abuse reports land in the postmaster mailbox the
# reconciler already preserves. Same idempotency contract as the mailbox
# add above; postmaster@ exists by the time this runs, so no retry loop
# is needed for the boot crash-loop window.
- name: "Mailserver accounts: ensure abuse@ alias -> postmaster (RFC 2142)"
  # Re-resolved for the same reason as the mailbox add above. postmaster@ now
  # exists, so dms is on its way up rather than looping -- but "on its way up"
  # still means one more restart between these two tasks.
  ansible.builtin.shell: |
    set -o pipefail
    ct=$(docker ps --filter label=vps.component=dms \
      --format '{{ "{{" }}.Names{{ "}}" }}' | head -n1)
    [ -n "$ct" ] || { echo "no dms container right now" >&2; exit 1; }
    docker exec "$ct" setup alias add \
      {{ ("abuse@" ~ cloudflare_zone) | quote }} \
      {{ ("postmaster@" ~ cloudflare_zone) | quote }}
  args:
    executable: /bin/bash
  register: _ms_alias_add
  # Same reason as the mailbox add above, against the same 'already' test the
  # until/failed_when below already use.
  changed_when:
    - _ms_alias_add.rc == 0
    - "'already' not in ((_ms_alias_add.stderr | default('')) + (_ms_alias_add.stdout | default('')))"
  until: >-
    _ms_alias_add.rc == 0
    or 'already' in ((_ms_alias_add.stderr | default('')) + (_ms_alias_add.stdout | default('')))
  retries: 6
  delay: 10
  failed_when:
    - _ms_alias_add.rc != 0
    - "'already' not in ((_ms_alias_add.stderr | default('')) + (_ms_alias_add.stdout | default('')))"
  when: (mailserver_dms_ct | length) > 0
