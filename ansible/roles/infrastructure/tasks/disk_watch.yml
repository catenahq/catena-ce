---
# Disk fill-level watchdog (host timer). Warns via ntfy at
# {{ disk_watch_warn_pct }}% and pages via the Healthchecks /fail
# escalation at {{ disk_watch_crit_pct }}% on the paths in
# {{ disk_watch_paths }}. Complements (does not replace) the hard
# free-bytes preflight aborts in disk-preflight.sh: those refuse to
# START a backup/restore/update on a full disk; this alerts the
# operator BEFORE that point is reached. RAM/CPU history stays with
# the opt-in Beszel appliance (beszel.yml) -- no duplicate collector.
#
# Installed unconditionally (no Portainer key needed): the script
# degrades to journal-only logging until Healthchecks/ntfy are wired.

- name: "disk-watch: env file"
  ansible.builtin.template:
    src: disk-watch.env.j2
    dest: "{{ disk_watch_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "disk-watch: wrapper script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/run-disk-watch.sh"
    dest: "{{ disk_watch_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: "disk-watch: systemd service unit"
  ansible.builtin.template:
    src: catena-disk-watch.service.j2
    dest: "/etc/systemd/system/{{ disk_watch_systemd_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: _disk_watch_service

- name: "disk-watch: systemd timer unit"
  ansible.builtin.template:
    src: catena-disk-watch.timer.j2
    dest: "/etc/systemd/system/{{ disk_watch_systemd_unit_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  register: _disk_watch_timer

- name: "disk-watch: reload systemd if units changed"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: (_disk_watch_service.changed | default(false)) or (_disk_watch_timer.changed | default(false))

- name: "disk-watch: enable + start timer"
  ansible.builtin.systemd_service:
    name: "{{ disk_watch_systemd_unit_name }}.timer"
    enabled: true
    state: started
  when: not ansible_check_mode
