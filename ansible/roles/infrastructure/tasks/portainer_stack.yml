---
# Find-or-create-and-deploy a Portainer compose stack. Inputs (caller sets
# via include_tasks vars):
#
#   svc_name            -- Portainer stack "Name" (stable slug; also the
#                          docker-compose project label on the containers)
#   svc_compose_content -- the full docker-compose.yml YAML as a string
#   svc_env             -- list of "KEY=value" strings OR {name,value} dicts
#                          (may be empty)
#   svc_domain_host     -- FQDN to route to this app (e.g. monitor.example.com)
#   svc_domain_service  -- compose service key the Traefik route targets
#   svc_domain_port     -- backend port inside the container
#
# Optional readiness probe (see the block at the bottom; enforces the
# CLAUDE.md atomicity rule -- a 2xx from the stack deploy means `compose up`
# exited, NOT that the app is serving healthy HTTP).
#   svc_readiness_url / svc_readiness_ok_codes / svc_readiness_validate_certs
#   svc_readiness_skip_reason
#
# Requires _portainer_endpoint_id (set by portainer_endpoint.yml).
#
# The ~8 callers (gatus/healthchecks/recovery/beszel/clamav + the cross-role
# keycloak + oauth2_proxy compose includes) all route through this one helper.
# The Portainer stack API (typed create/update paths, structured Env array,
# synchronous deploy) is the single compose seam; routing returns to us
# (Traefik file-provider route below), the control plane does no reverse proxy.

# Deploy + wait + check, retried up to infrastructure_deploy_max_attempts
# times when the failure looks like a registry transient. The attempt file
# re-resolves the stack each pass (find-or-create) and calls the typed
# Portainer create (new) or update (existing) path; Portainer deploys
# synchronously, so there is no separate status poll. See
# _portainer_stack_deploy_attempt.yml for the transient classifier.
- name: "Portainer: initialize deploy attempt state ({{ svc_name }})"
  ansible.builtin.set_fact:
    _portainer_deploy_done: false
    _portainer_deploy_transient: false

- name: "Portainer: deploy with retry on registry transient ({{ svc_name }})"
  ansible.builtin.include_tasks: _portainer_stack_deploy_attempt.yml
  loop: "{{ range(1, (infrastructure_deploy_max_attempts | default(3)) + 1) | list }}"
  loop_control:
    loop_var: _portainer_deploy_attempt_n
  when: not _portainer_deploy_done

- name: "Portainer: fail if all retries exhausted on registry transients ({{ svc_name }})"
  ansible.builtin.fail:
    msg: >-
      Portainer stack deploy for {{ svc_name }} failed all
      {{ infrastructure_deploy_max_attempts | default(3) }} attempts on
      registry transients. Check the Portainer UI (stack {{ svc_name }}) at
      http://{{ ansible_host }}:{{ portainer_ui_port }}.
  when: not _portainer_deploy_done

# Routing: write a Traefik file-provider route that catena-traefik serves
# directly (Portainer does no reverse proxy; there is no domain.create).
# Runs ON the VPS (no delegate_to) -- the file lands in traefik_dynamic_dir
# where catena-traefik's file provider hot-reloads it. Idempotent.
#
# Opt-out: intra-cluster-only services (e.g. oauth2-proxy, reached by their
# catena-network alias, not via Traefik) pass svc_domain_host="" -> the route
# file is removed instead of written.
- name: "Route: write Traefik file-provider route ({{ svc_name ~ ' -> ' ~ svc_domain_host }})"
  ansible.builtin.template:
    # Explicit playbook_dir-relative path: portainer_stack.yml is include_tasks'd
    # from OTHER roles (keycloak, oauth2_proxy) whose compose.yml deploys their
    # own stack through this helper. Ansible resolves a bare `src:` against the
    # CALLING role's templates/ dir, so a bare `app-route.yml.j2` is not found
    # when the caller is keycloak. Anchor it to infrastructure/templates so it
    # resolves from any caller (same pattern as realm_bootstrap.yml's src).
    src: "{{ playbook_dir }}/../roles/infrastructure/templates/app-route.yml.j2"
    dest: "{{ traefik_dynamic_dir }}/{{ svc_name }}-route.yml"
    owner: root
    group: root
    mode: "0644"
  when: svc_domain_host | default('') | length > 0

- name: "Route: remove Traefik route for intra-cluster-only service ({{ svc_name }})"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/{{ svc_name }}-route.yml"
    state: absent
  when: svc_domain_host | default('') | length == 0

# Atomicity: a 2xx from the stack deploy means `compose up` exited -- NOT
# that the containers are serving healthy HTTP. The tunnel + Traefik +
# container-init chain can take tens of seconds after that. Probe the public
# URL before handing control back to the caller.
- name: "Portainer: wait for public URL to serve healthy HTTP ({{ svc_name }})"
  ansible.builtin.uri:
    url: "{{ svc_readiness_url }}"
    method: GET
    status_code: "{{ svc_readiness_ok_codes | default([200, 204, 301, 302]) }}"
    validate_certs: "{{ svc_readiness_validate_certs | default(true) }}"
    follow_redirects: none
    return_content: false
    timeout: 10
  register: _svc_readiness
  retries: "{{ infrastructure_readiness_poll_retries | default(60) }}"
  delay: "{{ infrastructure_readiness_poll_delay | default(5) }}"
  until: _svc_readiness.status in (svc_readiness_ok_codes | default([200, 204, 301, 302]))
  when:
    - svc_readiness_url is defined
    - svc_readiness_url | length > 0
  delegate_to: localhost
  become: false

- name: "Portainer: log intentional readiness-probe skip ({{ svc_name }})"
  ansible.builtin.debug:
    msg: >-
      Portainer[{{ svc_name }}]: readiness probe intentionally skipped --
      {{ svc_readiness_skip_reason }}
  when:
    - svc_readiness_url is not defined or (svc_readiness_url | length) == 0
    - svc_readiness_skip_reason is defined
    - svc_readiness_skip_reason | length > 0

- name: "Portainer: warn if no readiness probe configured ({{ svc_name }})"
  ansible.builtin.debug:
    msg: >-
      No svc_readiness_url set for {{ svc_name }}; skipping post-deploy HTTP
      probe. The caller is relying on the deploy 2xx alone, which does NOT
      confirm the app is serving healthy traffic. Add a probe URL -- or set
      svc_readiness_skip_reason to declare the skip intentional.
  when:
    - svc_readiness_url is not defined or (svc_readiness_url | length) == 0
    - svc_readiness_skip_reason is not defined or (svc_readiness_skip_reason | length) == 0
