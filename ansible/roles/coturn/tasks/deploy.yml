---
# Shared TURN/STUN server. Deployed as a direct swarm service (not a
# managed compose app) because coturn needs host networking for
# ICE-candidate advertisement and is not an operator-managed app. Mirrors
# the cloudflared swarm-service pattern in
# roles/cloudflare_tunnel/tasks/main.yml.
#
# Reached only through main.yml, which gates this whole file on a running
# TURN consumer (Nextcloud Talk HPB, or a Rocket.Chat / Element JVB). Every
# side effect below -- public-port fragment, turn.<zone> DNS, the DNS-01
# certificate + certbot timer, the swarm service -- is therefore
# consumer-conditional. See main.yml for the rationale.

- name: "coturn: preflight secrets"
  ansible.builtin.assert:
    that:
      - turn_static_auth_secret is defined
      - turn_static_auth_secret | length >= 32
    fail_msg: >-
      turn_static_auth_secret missing or too short. The converge mints
      it on the box; a missing one means the on-box store at
      /etc/catena/config.json was not loaded or was truncated.

- name: "coturn: preflight public_ip"
  ansible.builtin.assert:
    that:
      - public_ip is defined
      - public_ip | length > 0
    fail_msg: >-
      public_ip is unset on this host. Coturn advertises this in ICE
      candidates; without it every relayed call fails. Set public_ip on
      the host in inventory/<name>/hosts.yml.

# ── Step 1: declare public ports (registry) ───────────────────────────
# UDP media plane lives on the public IP -- coturn does not ride the
# cloudflared TCP tunnel. Instead of hand-writing ufw rules here, declare
# the ports as a registry fragment; the public-port reconciler (installed
# by roles/common) applies the ufw rules and records them in the effective
# set read by validation. host-bound (swarm --network=host), scope=any.
- name: "coturn: ensure public-port fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "coturn: declare public ports (registry fragment)"
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/coturn.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "udp", "port": coturn_listen_port,
           "scope": "any", "bind": "host", "owner": "coturn",
           "comment": "STUN / plain TURN"},
          {"proto": "tcp", "port": coturn_tls_port,
           "scope": "any", "bind": "host", "owner": "coturn",
           "comment": "TLS-TURN (TCP)"},
          {"proto": "udp", "port": coturn_tls_port,
           "scope": "any", "bind": "host", "owner": "coturn",
           "comment": "TLS-TURN (UDP)"},
          {"proto": "udp",
           "port": coturn_min_relay_port ~ '-' ~ coturn_max_relay_port,
           "scope": "any", "bind": "host", "owner": "coturn",
           "comment": "media relay range"}
        ] | to_nice_json
      }}
  register: _coturn_ports_fragment

# Apply immediately so this converge does not leave a window where the
# media ports are firewalled off until the post_tasks reconcile. The
# reconciler is idempotent; the post_tasks run reconciles the full set.
- name: "coturn: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when: _coturn_ports_fragment.changed

# Tunnel-deferred gate: coturn's DNS registration and the DNS-01 cert
# issuance both call the Cloudflare API with cloudflare_api_token. On a
# tokenless install the token is absent from the on-box store. Defer only the
# token-dependent work (all of dns.yml; the creds-render + issue + confirm
# steps inside cert.yml) -- certbot install, /etc/letsencrypt scaffolding, the
# deploy hook, and certbot.timer still run so coturn's letsencrypt bind-mount
# source exists and the service comes up STUN-only until cf_activate persists a
# token and re-converges (which issues the cert + SIGHUPs coturn for TLS).
- name: "coturn: resolve tunnel-deferred gate (Cloudflare token presence)"
  ansible.builtin.set_fact:
    _coturn_cf_token_present: "{{ (cloudflare_api_token | default('')) | length > 0 }}"

- name: "coturn: tunnel deferred -- skipping DNS + DNS-01 cert issuance (no Cloudflare token yet)"
  ansible.builtin.debug:
    msg: >-
      No Cloudflare API token in the on-box store: deferring turn.<zone> DNS
      registration and the DNS-01 certificate until cf_activate persists a
      token and re-converges. coturn deploys STUN-only (no public TLS) for now.
  when: not _coturn_cf_token_present

# ── Step 2: DNS A record (gray-cloud) ─────────────────────────────────
- name: "coturn: ensure turn.<zone> A record points at VPS public IP"
  ansible.builtin.import_tasks: dns.yml
  when: _coturn_cf_token_present
  tags: [coturn_dns]

# ── Step 3: cert via DNS-01 (Cloudflare) ─────────────────────────────
# cert.yml itself gates the token-dependent tasks on _coturn_cf_token_present;
# the certbot install + scaffolding + timer run unconditionally.
- name: "coturn: ensure cert path exists"
  ansible.builtin.import_tasks: cert.yml
  tags: [coturn_cert]

# ── Step 4: render turnserver.conf ──────────────────────────────────
- name: "coturn: ensure config dir exists"
  ansible.builtin.file:
    path: "{{ coturn_host_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "coturn: render turnserver.conf"
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: "{{ coturn_host_config_path }}"
    owner: root
    group: root
    mode: "0640"
  register: _coturn_conf
  # Template renders turn_static_auth_secret. With --diff, ansible
  # prints the rendered diff; no_log: true prevents the secret from
  # surfacing in that output.
  no_log: true

# ── Step 5: deploy coturn as a swarm service ────────────────────────
# Pattern mirrors cloudflared (roles/cloudflare_tunnel/tasks/
# main.yml lines 220-277): inspect for existence, create on first run,
# update env / image otherwise. Host networking so external-ip in
# turnserver.conf matches a real interface.

- name: "coturn: check if swarm service exists"
  ansible.builtin.command: docker service inspect coturn --format '{{ "{{" }}.ID{{ "}}" }}'
  register: _coturn_service
  changed_when: false
  failed_when: false

# Identity + wiring from defaults, so the tier-1 stack file renders from the
# same variables this argv is built from. The reasoning for each -- the root
# user, the node-local bind sources, the placement constraint -- lives beside
# the declarations.
- name: "coturn: create swarm service (first run)"
  ansible.builtin.command:
    argv: "{{ _coturn_create_argv }}"
  vars:
    _coturn_create_argv: >-
      {{
        ['docker', 'service', 'create',
         '--name=' ~ coturn_compose_name,
         '--mode=global',
         '--network=' ~ coturn_network,
         '--user=' ~ coturn_container_user,
         '--restart-condition=any']
        + (coturn_constraints | map('regex_replace', '^', '--constraint=') | list)
        + (coturn_mounts | map('regex_replace', '^', '--mount=') | list)
        + [coturn_image] + coturn_command
      }}
  when: _coturn_service.rc != 0

- name: "coturn: read current container user (drift check)"
  ansible.builtin.command: docker service inspect coturn --format '{{ "{{" }}.Spec.TaskTemplate.ContainerSpec.User{{ "}}" }}'
  register: _coturn_current_user
  changed_when: false
  when: _coturn_service.rc == 0

- name: "coturn: reconcile container user to root (existing service)"
  # Existing services created before the root-user fix landed get rolled so
  # the TLS listener actually binds.
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - "--user={{ coturn_container_user }}"
      - "{{ coturn_compose_name }}"
  when:
    - _coturn_service.rc == 0
    - (_coturn_current_user.stdout | default('') | trim) != coturn_container_user
  changed_when: true

- name: "coturn: read current image (drift check)"
  ansible.builtin.command: docker service inspect coturn --format '{{ "{{" }}.Spec.TaskTemplate.ContainerSpec.Image{{ "}}" }}'
  register: _coturn_current_image
  changed_when: false
  when: _coturn_service.rc == 0

- name: "coturn: reconcile image to configured pin"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - "--image={{ coturn_image }}"
      - coturn
  when:
    - _coturn_service.rc == 0
    - (_coturn_current_image.stdout | default('')).split('@')[0] != coturn_image
  changed_when: true

- name: "coturn: SIGHUP on config / cert change (graceful reload)"
  # Coturn re-reads cert + config on SIGHUP without dropping calls in
  # progress. The deploy hook on the certbot timer (cert.yml) does the
  # same thing post-renewal; this branch handles config changes from
  # converge time (e.g. operator bumped coturn_min_relay_port).
  ansible.builtin.shell: |
    set -o pipefail
    for ct in $(docker ps --filter "name=coturn" --format '{{ "{{" }}.Names{{ "}}" }}'); do
      docker kill --signal=HUP "$ct" || true
    done
  args:
    executable: /bin/bash
  when:
    - _coturn_service.rc == 0
    - _coturn_conf.changed
  changed_when: true

# ─── tier-1 stack spec ───────────────────────────────────────────────────
# Contributed from HERE, next to the create argv, and built from the same
# variables it is. Only reached when the consumer gate in main.yml passed, so
# a host with no real-time app contributes no coturn spec and the rendered
# stack has no coturn service -- which is the same answer the gate gives the
# argv path.
#
# No `ports`. Host networking binds the media plane directly on the node; the
# public-port registry fragment above is what opens the firewall for it.
- name: "coturn: contribute the tier-1 stack spec"
  ansible.builtin.set_fact:
    catena_tier1_specs: >-
      {{ catena_tier1_specs | default([]) | tier1_spec_upsert({
           'name': coturn_compose_name,
           'image': coturn_image,
           'mode': 'global',
           'networks': [coturn_network],
           'user': coturn_container_user,
           'constraints': coturn_constraints,
           'command': coturn_command,
           'volumes': coturn_mounts | map('swarm_mount_to_compose') | list,
         }) }}
