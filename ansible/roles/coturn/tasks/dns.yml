---
# Render the gray-cloud (proxied: false) A record `turn.<zone>` ->
# VPS public IP. Required because cloudflared cannot carry UDP, so
# coturn lives directly on the VPS public IP -- the TURN hostname
# must resolve there, NOT to Cloudflare's edge.
#
# Mirrors roles/cloudflare_tunnel/tasks/main.yml's wildcard CNAME
# pattern (look up + create-if-absent + update-if-drift) but for an
# A record with proxied=false.

# cloudflare_zone_id is normally set by the cloudflare_tunnel role
# earlier in a full converge. Under a targeted converge (the cert-renewal
# re-converge, or an operator iterating on just coturn) the tunnel role
# is skipped and the fact is absent. Resolve it here when missing so this
# role is self-sufficient rather than silently depending on another
# role's run order. Mirrors roles/infrastructure/tasks/mailserver-dns.yml.
- name: "coturn DNS: resolve cloudflare_zone_id (when not set by cloudflare_tunnel)"
  when: cloudflare_zone_id is not defined
  delegate_to: localhost
  become: false
  block:
    - name: "coturn DNS: look up zone_id for {{ cloudflare_zone }}"
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones?name={{ cloudflare_zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
        return_content: true
      register: _coturn_dns_zones
      retries: 5
      delay: 6
      until: _coturn_dns_zones.status == 200

    - name: "coturn DNS: assert the zone is visible to this token"
      ansible.builtin.assert:
        that:
          - _coturn_dns_zones.json.result | length == 1
        fail_msg: >-
          Zone '{{ cloudflare_zone }}' not found (or token lacks access).
          The API token needs Zone:DNS:Edit scope on this zone.

    - name: "coturn DNS: capture zone_id"
      ansible.builtin.set_fact:
        cloudflare_zone_id: "{{ _coturn_dns_zones.json.result[0].id }}"

- name: "coturn DNS: look up existing A record for {{ coturn_hostname }}"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records?type=A&name={{ coturn_hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
    return_content: true
  register: _coturn_dns_existing
  delegate_to: localhost
  become: false
  retries: 5
  delay: 6
  until: _coturn_dns_existing.status == 200

- name: "coturn DNS: create A record (gray-cloud) if absent"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    body_format: json
    body:
      type: A
      name: "{{ coturn_hostname }}"
      content: "{{ public_ip }}"
      proxied: false
      ttl: 1 # 1 = automatic
      comment: "Managed by catena roles/coturn -- MUST be gray-cloud (UDP)"
    status_code: 200
  when: _coturn_dns_existing.json.result | length == 0
  delegate_to: localhost
  become: false

- name: "coturn DNS: update A record if content / proxy state drifted"
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records/{{ _coturn_dns_existing.json.result[0].id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    body_format: json
    body:
      type: A
      name: "{{ coturn_hostname }}"
      content: "{{ public_ip }}"
      proxied: false
      ttl: 1
    status_code: 200
  when:
    - _coturn_dns_existing.json.result | length > 0
    - >-
      _coturn_dns_existing.json.result[0].content != public_ip
      or _coturn_dns_existing.json.result[0].proxied | default(false)
  delegate_to: localhost
  become: false
