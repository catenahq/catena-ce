---
# Shared TURN/STUN server -- consumer-gated orchestrator.
#
# coturn is a COMPANION to the real-time apps, not base-plane
# infrastructure. Its only consumers are:
#
#   - Nextcloud Talk HPB   (compose service `talk-hpb`)
#   - Rocket.Chat Jitsi    (compose service `jvb`)
#   - Element Jitsi        (compose service `jvb`)
#
# Deploying it unconditionally on a tenant that runs none of them left a
# dead relay behind four open public port entries (3478/udp, 5349/tcp+udp,
# the media relay range), a turn.<zone> DNS record, and a Let's Encrypt
# certificate renewing forever for nothing. So the whole role now gates on
# consumer presence, same shape as roles/infrastructure/tasks/clamav.yml.
#
# Why presence, not a flag: a declared "coturn enabled" flag would have to
# be kept correct independently across fresh install / recovery /
# migration / rollback and would drift. Container presence is real state
# that every one of those flows reproduces (a restore/migrate brings the
# consumer containers back up), so reading `docker ps` is automatically
# correct everywhere. On a fresh install coturn lands on the converge
# after the consumer is first deployed -- the same converge that runs the
# Talk/Jitsi wire scripts -- matching the established "deploy app, then
# converge catches up" rhythm.
#
# Unlike clamav there is nothing to pre-create: consumers reach coturn by
# hostname (turn.<zone>), so DNS, cert, ports and service can ALL wait.
#
# NOT a teardown. A consumer that goes away leaves an already-deployed
# coturn running -- ripping out a relay would drop calls in progress, and
# the public-ports fragment already on disk keeps its ufw rules. Same
# deliberate asymmetry as clamav.

- name: "coturn: detect a running consumer (Talk HPB or a Jitsi JVB)"
  # Emits each matching consumer container name; empty when none is
  # running. PRESENCE -- not the specific name -- is the deploy gate, so
  # we list all matches rather than taking the first. Deliberately NO
  # `| head -n1`: piping a grouped command into head closes the pipe after
  # one line, the upstream `docker ps` then takes SIGPIPE (rc 141), and
  # `set -o pipefail` would promote that into a task failure even though
  # detection succeeded. Two plain `docker ps` calls avoid the pipe.
  ansible.builtin.shell: |
    docker ps --filter 'label=com.docker.compose.service=talk-hpb' --format '{{ "{{" }}.Names{{ "}}" }}'
    docker ps --filter 'label=com.docker.compose.service=jvb' --format '{{ "{{" }}.Names{{ "}}" }}'
  args:
    executable: /bin/bash
  register: _coturn_consumer
  changed_when: false

# Once deployed, keep maintaining it. Without this second arm the
# no-teardown stance above is incoherent: a tenant that removes its last
# real-time app would leave coturn RUNNING with its ufw rules intact, but
# every later converge would skip the role -- so turnserver.conf stops
# reconciling and, worse, the certbot deploy hook stops being re-asserted,
# and the cert silently ages out on a service still answering on 5349.
# Deploy is consumer-gated; MAINTENANCE is existence-gated.
- name: "coturn: detect an already-deployed coturn service"
  ansible.builtin.command:
    argv: [docker, service, ls, --filter, name=coturn, --format, '{{ "{{" }}.Name{{ "}}" }}']
  register: _coturn_existing
  changed_when: false
  failed_when: false

- name: "coturn: resolve the deploy gate"
  ansible.builtin.set_fact:
    _coturn_wanted: >-
      {{ ((_coturn_consumer.stdout | default('') | trim) | length > 0)
         or ((_coturn_existing.stdout | default('') | trim) | length > 0) }}

- name: "coturn: skip deploy when no consumer is running"
  ansible.builtin.debug:
    msg: >-
      No TURN consumer running (no Nextcloud Talk HPB, no Rocket.Chat or
      Element Jitsi). coturn is NOT deployed: no turn.<zone> DNS record,
      no DNS-01 certificate, no certbot timer, and no public UDP/TCP media
      ports. It deploys automatically on the converge after a consumer
      first comes up.
  when: not (_coturn_wanted | bool)

- name: "coturn: deploy / maintain (consumer running, or already deployed)"
  ansible.builtin.include_tasks:
    file: deploy.yml
    # apply: propagate the role's tags to every task inside the include.
    # Without it, `--tags coturn` fires the include but filters out all
    # the inner tasks. Sub-tags declared inside deploy.yml (coturn_dns,
    # coturn_cert) still work -- apply ADDS to them.
    apply:
      tags: [coturn]
  when: _coturn_wanted | bool
  tags: [coturn]
