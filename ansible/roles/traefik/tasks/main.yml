---
# roles/traefik -- deploy + own the catena-traefik reverse proxy.
#
# Replaces the Traefik-management block that used to live at the bottom of
# roles/dokploy. Traefik is no longer install.sh's `dokploy-traefik`: we create
# the overlay, render the config, and run `catena-traefik` ourselves.
#
#   - catena-network overlay created by us (Dokploy no longer owns ingress).
#   - No host port bindings on :80/:443 -- only path in is cloudflared over the
#     overlay.
#   - Plain container (not a swarm service) + a nudge unit that restarts it
#     after a docker restart once the overlay re-materializes.
#
# TRANSITION NOTE (Dokploy-present window, Phase 1->5): the config tree stays at
# /etc/dokploy/traefik so Dokploy's own file-provider route writes are still
# seen by our traefik, and the container also connects dokploy-network so it can
# reach any lingering Dokploy-managed service until Dokploy is removed. Both
# collapse to catena-only at Dokploy teardown (Phase 5).

# ─── overlay network ─────────────────────────────────────────────────────
- name: "traefik: ensure {{ catena_network_name }} overlay exists"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - overlay
      - --attachable
      - "{{ catena_network_name }}"
  register: _catena_net_create
  changed_when: "_catena_net_create.rc == 0"
  # rc!=0 with "already exists" in stderr is the idempotent no-op path.
  failed_when:
    - _catena_net_create.rc != 0
    - "'already exists' not in (_catena_net_create.stderr | default(''))"

# ─── config tree ─────────────────────────────────────────────────────────
- name: "traefik: ensure config + dynamic dirs exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"

- name: "traefik: render static traefik.yml from template"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_static_cfg

- name: "traefik: render X-Forwarded-Proto injector middleware"
  ansible.builtin.template:
    src: cf-forwarded-proto-https.yml.j2
    dest: "{{ traefik_dynamic_dir }}/cf-forwarded-proto-https.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_xfp_middleware

# ─── remove the install.sh-born dokploy-traefik (one-time cutover) ───────
# On a host that previously ran the dokploy role, Dokploy's install.sh left a
# `dokploy-traefik` plain container publishing :80/:443. We replace it with
# catena-traefik; leaving the old one bound would collide on the entrypoints.
- name: "traefik: check for legacy dokploy-traefik container"
  ansible.builtin.command: docker inspect --type=container dokploy-traefik
  register: _legacy_traefik
  changed_when: false
  failed_when: false

- name: "traefik: remove legacy dokploy-traefik container"
  ansible.builtin.command: "docker rm -f dokploy-traefik"
  when: _legacy_traefik.rc == 0
  register: _legacy_traefik_rm
  changed_when: _legacy_traefik_rm.rc == 0

# ─── deploy / reconcile catena-traefik ───────────────────────────────────
- name: "traefik: inspect catena-traefik state"
  ansible.builtin.command: docker inspect --type=container "{{ traefik_container_name }}"
  register: _traefik_inspect
  changed_when: false
  failed_when: false

- name: "traefik: read running image tag (for drift check)"
  ansible.builtin.command: >
    docker inspect {{ traefik_container_name }}
    --format '{{ "{{" }} .Config.Image {{ "}}" }}'
  register: _traefik_running_image
  changed_when: false
  failed_when: false
  when: _traefik_inspect.rc == 0

- name: "traefik: read host port bindings (must stay empty)"
  ansible.builtin.command: >
    docker inspect {{ traefik_container_name }}
    --format '{{ "{{" }} json .HostConfig.PortBindings {{ "}}" }}'
  register: _traefik_ports
  changed_when: false
  failed_when: false
  when: _traefik_inspect.rc == 0

- name: "traefik: decide whether catena-traefik needs (re)launch"
  ansible.builtin.set_fact:
    _traefik_needs_relaunch: >-
      {{
        _traefik_inspect.rc != 0
        or ((_traefik_running_image.stdout | default('') | trim) != traefik_image)
        or ((_traefik_ports.stdout | default('{}') | trim) not in ['{}', 'null'])
      }}

- name: "traefik: stop existing catena-traefik for relaunch"
  ansible.builtin.command: "docker rm -f {{ traefik_container_name }}"
  when:
    - _traefik_inspect.rc == 0
    - _traefik_needs_relaunch | bool
  register: _traefik_rm
  changed_when: _traefik_rm.rc == 0

# Launch on the catena-network overlay with the pinned image and NO host-port
# publishing. Mirrors the essential flags Dokploy's install.sh used for traefik
# (docker socket + config mounts, restart policy).
- name: "traefik: launch catena-traefik (pinned image, no host ports)"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - "--name={{ traefik_container_name }}"
      - --restart=always
      - "--network={{ catena_network_name }}"
      - -v
      - /var/run/docker.sock:/var/run/docker.sock
      - -v
      - "{{ traefik_config_dir }}/traefik.yml:/etc/traefik/traefik.yml"
      - -v
      - "{{ traefik_dynamic_dir }}:{{ traefik_dynamic_dir }}"
      - -v
      - "{{ traefik_dynamic_dir }}/acme.json:/etc/traefik/acme.json"
      - "{{ traefik_image }}"
  when: _traefik_needs_relaunch | bool
  register: _traefik_launch
  changed_when: _traefik_launch.rc == 0

# Transition-window straddle: while Dokploy is still installed, connect
# catena-traefik to dokploy-network too so it can still reach any
# Dokploy-managed service that has not yet moved to catena-network. Harmless
# no-op once dokploy-network is gone (Phase 5). Idempotent.
- name: "traefik: check for lingering dokploy-network"
  ansible.builtin.command: docker network inspect dokploy-network
  register: _dokploy_net
  changed_when: false
  failed_when: false

- name: "traefik: connect catena-traefik to dokploy-network (transition only)"
  ansible.builtin.command: "docker network connect dokploy-network {{ traefik_container_name }}"
  when: _dokploy_net.rc == 0
  register: _traefik_dk_connect
  changed_when: _traefik_dk_connect.rc == 0
  # Already-connected returns rc!=0 with "already exists"; treat as no-op.
  failed_when:
    - _traefik_dk_connect.rc != 0
    - "'already exists' not in (_traefik_dk_connect.stderr | default(''))"

- name: "traefik: restart to pick up static config change"
  ansible.builtin.command: "docker restart {{ traefik_container_name }}"
  when:
    - not (_traefik_needs_relaunch | bool)
    - _traefik_static_cfg.changed
  register: _traefik_restart
  changed_when: _traefik_restart.rc == 0

# ─── restart resilience (nudge after docker restart) ─────────────────────
- name: "traefik: drop nudge script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-traefik-nudge.sh"
    dest: /usr/local/bin/catena-traefik-nudge
    owner: root
    group: root
    mode: "0755"

- name: "traefik: render nudge systemd unit"
  ansible.builtin.template:
    src: catena-traefik-nudge.service.j2
    dest: /etc/systemd/system/catena-traefik-nudge.service
    owner: root
    group: root
    mode: "0644"
  register: _traefik_nudge_unit

- name: "traefik: ensure docker.service drop-in dir exists"
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "traefik: render docker.service drop-in that fires the nudge"
  ansible.builtin.template:
    src: docker-service-nudge-dropin.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-catena-traefik-nudge.conf
    owner: root
    group: root
    mode: "0644"
  register: _traefik_nudge_dropin

# Remove the superseded dokploy-named nudge artifacts on cutover.
- name: "traefik: remove legacy dokploy-traefik nudge artifacts"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/dokploy-traefik-nudge
    - /etc/systemd/system/dokploy-traefik-nudge.service
    - /etc/systemd/system/docker.service.d/10-dokploy-traefik-nudge.conf
  register: _traefik_legacy_nudge_rm

- name: "traefik: daemon-reload if unit or drop-in changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    _traefik_nudge_unit.changed or _traefik_nudge_dropin.changed
    or _traefik_legacy_nudge_rm.changed

# ─── dynamic config housekeeping ─────────────────────────────────────────
# Legacy forwardAuth admin route (admin-dokploy.yml) is superseded by the
# per-app reverse-proxy route the oauth2_proxy role writes. Remove it so the
# new route wins unambiguously. Idempotent.
- name: "traefik: remove legacy admin-dokploy.yml route"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/admin-dokploy.yml"
    state: absent
