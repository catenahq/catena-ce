---
# roles/traefik -- deploy + own the catena-traefik reverse proxy. This role
# creates the overlay, renders the config, and runs catena-traefik.
#
#   - catena-network overlay created here.
#   - No host port bindings on :80/:443 -- only path in is cloudflared over the
#     overlay.
#   - A swarm service, not a plain container: it rejoins the overlay by NAME
#     after a restore or a daemon flap, and the task manager re-dispatches it
#     without a nudge unit. Reasons in full at the deploy block below.
#
# The config tree lives under /etc/catena/traefik. catena-traefik is on
# catena_network_name only -- every catena app deploys onto catena-network via
# the Portainer stack seam.

# ─── overlay network ─────────────────────────────────────────────────────
- name: "traefik: ensure {{ catena_network_name }} overlay exists"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - overlay
      - --attachable
      - "{{ catena_network_name }}"
  register: _catena_net_create
  changed_when: "_catena_net_create.rc == 0"
  # rc!=0 with "already exists" in stderr is the idempotent no-op path.
  failed_when:
    - _catena_net_create.rc != 0
    - "'already exists' not in (_catena_net_create.stderr | default(''))"

# ─── config tree ─────────────────────────────────────────────────────────
- name: "traefik: ensure config + dynamic dirs exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"

# acme.json backs certificatesResolvers.letsencrypt.acme.storage
# (traefik.yml.j2). It must exist as a FILE before the container launch: a
# docker bind-mount auto-creates a missing source as a DIRECTORY, which
# breaks Traefik ACME storage. Nothing else creates it.
- name: "traefik: stat acme.json (ACME cert storage must be a file)"
  ansible.builtin.stat:
    path: "{{ traefik_dynamic_dir }}/acme.json"
  register: _traefik_acme_stat

- name: "traefik: remove acme.json auto-created as a directory by a bind-mount"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/acme.json"
    state: absent
  when:
    - _traefik_acme_stat.stat.exists
    - _traefik_acme_stat.stat.isdir | default(false)
  register: _traefik_acme_dir_rm

- name: "traefik: seed empty acme.json"
  ansible.builtin.copy:
    content: ""
    dest: "{{ traefik_dynamic_dir }}/acme.json"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: "traefik: enforce 0600 on acme.json (Traefik refuses looser modes)"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/acme.json"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: "traefik: render static traefik.yml from template"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_static_cfg

- name: "traefik: render X-Forwarded-Proto injector middleware"
  ansible.builtin.template:
    src: cf-forwarded-proto-https.yml.j2
    dest: "{{ traefik_dynamic_dir }}/cf-forwarded-proto-https.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_xfp_middleware

- name: "traefik: render response security-headers middleware"
  ansible.builtin.template:
    src: secure-headers.yml.j2
    dest: "{{ traefik_dynamic_dir }}/secure-headers.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_secure_headers_middleware

# ─── deploy / reconcile catena-traefik (swarm service) ───────────────────
# A swarm service rather than a plain container, for three reasons:
#
#   1. It rejoins catena-network by NAME. A plain container attaches by
#      network ID, so an overlay that is torn down and recreated (a restore
#      rebuilds swarm+overlay from scratch -- see roles/backup/tasks/
#      restore.yml; an interrupted converge or daemon flap does the same)
#      leaves the baked-in reference stale: `docker start` fails with
#      "network <old-id> not found" and ingress stays dead until something
#      starts it. The task manager re-dispatches a service on its own.
#   2. The managed-bump lane needs no copy of how the service was built.
#      `docker service update --image` changes only the image, so there is no
#      launch argv for the lane's spec file to reproduce and drift from.
#   3. A version bump rolls, and the engine's `--rollback` reverts, instead
#      of a hand-written rm + run with a restore path on failure.
#
# No host-port publishing: cloudflared over the overlay is the only ingress.
# That invariant is STRUCTURAL -- the create argv below has no --publish, so
# there is no port binding for a drift check to find.
- name: "traefik: check catena-traefik swarm service exists"
  ansible.builtin.command: >-
    docker service inspect {{ traefik_container_name }}
    --format '{{ "{{" }}.ID{{ "}}" }}'
  register: _traefik_service
  changed_when: false
  failed_when: false

# A plain container by this name holds the same config mounts and the same
# overlay attachment, so it has to go before the service starts. Gated on the
# service being ABSENT: once the service exists there is no plain container to
# find, and an ungated removal would tear down a swarm task container by name.
#
# This is why the existence probe above is here as well as inside the shared
# ladder: the removal has to happen BEFORE the create, and the ladder owns the
# create. Two cheap reads, in exchange for the pre-create hook staying local
# to the role that needs it.
- name: "traefik: check for a plain container holding the name"
  ansible.builtin.command: docker inspect --type=container "{{ traefik_container_name }}"
  register: _traefik_plain
  changed_when: false
  failed_when: false

- name: "traefik: remove a plain container holding the name"
  ansible.builtin.command: "docker rm -f {{ traefik_container_name }}"
  when:
    - _traefik_plain.rc == 0
    - _traefik_service.rc != 0
  register: _traefik_plain_rm
  changed_when: _traefik_plain_rm.rc == 0

# ─── the service spec ────────────────────────────────────────────────────
# One dict, two consumers: the catena-tier1 host engine creates and reconciles
# the service from it, and tier1_stack_render puts it in the file
# `docker stack config` type-checks, so the running service and the rendered
# plane cannot describe different things.
#
# No `ports`. The no-host-port invariant is structural in both renderers --
# cloudflared over the overlay is the only ingress, and neither the argv nor
# the compose service has a publish for a drift check to find.
- name: "traefik: build the tier-1 service spec"
  ansible.builtin.set_fact:
    _traefik_spec: >-
      {{ traefik_desired | combine({
           'name': traefik_container_name,
           'networks': [catena_network_name],
           'detach': true,
           'volumes': traefik_mounts | map('swarm_mount_to_compose') | list,
         }) }}

- name: "traefik: contribute the spec to the control-plane render"
  ansible.builtin.set_fact:
    catena_tier1_specs: >-
      {{ catena_tier1_specs | default([]) | tier1_spec_upsert(_traefik_spec) }}

# include_role with a literal name + tasks_from, not include_tasks with a
# templated role_path: the second works but hides the edge from the audit
# graph, which resolves the first and would file reconcile_one.yml as an
# orphan under the second.
- name: "traefik: create or reconcile the swarm service"
  ansible.builtin.include_role:
    name: tier1_stack
    tasks_from: reconcile_one.yml
    apply:
      tags: [traefik]
  vars:
    tier1_spec: "{{ _traefik_spec }}"

# NOTE: catena-traefik attaches to catena_network_name ONLY. Every catena app
# stack joins catena-network via the Portainer stack seam, so that single
# overlay is all traefik needs to route to.

# The static config is a bind mount, so a changed traefik.yml is already on
# disk inside the running task -- but Traefik reads it once at startup. Only
# the FILE PROVIDER hot-reloads, and that covers the dynamic/ dir, not this.
# So the task has to roll. Same for the acme.json directory fix: a running
# task still holds the bad mount. `--force` rolls a service whose spec is
# otherwise unchanged, which is exactly this case.
#
# Skipped when the engine above already changed the service: its update rolls
# the task on its own, and forcing a second roll would take ingress down twice.
# The engine's summary line carries changed=<n>, so this reads the same number
# the reconcile reported rather than re-deriving whether anything happened.
- name: "traefik: force-roll to pick up a static config or acme.json change"
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - --force
      - "{{ traefik_container_name }}"
  when:
    - _traefik_service.rc == 0
    - _traefik_static_cfg.changed or (_traefik_acme_dir_rm.changed | default(false))
    - "'changed=0' in (_t1_apply.stdout | default('changed=0'))"
  register: _traefik_force_roll
  changed_when: _traefik_force_roll.rc == 0

# catena-network-nudge lives in roles/docker: it heals containers the overlay
# race strands on a docker.service start, and roles/docker owns both ends of
# that race. catena-traefik is a swarm service, so the task manager
# re-dispatches it and the nudge skips it outright (swarm task containers are
# excluded by label); what the nudge protects is the Portainer compose
# containers (keycloak-server-1, oauth2-proxy, gatus, nextcloud-talk-hpb-1).
