---
# roles/traefik -- deploy + own the catena-traefik reverse proxy. We create the
# overlay, render the config, and run `catena-traefik` ourselves.
#
#   - catena-network overlay created by us.
#   - No host port bindings on :80/:443 -- only path in is cloudflared over the
#     overlay.
#   - Plain container (not a swarm service) + a nudge unit that restarts it
#     after a docker restart once the overlay re-materializes.
#
# The config tree lives under /etc/catena/traefik. catena-traefik is on
# catena_network_name only -- every catena app deploys onto catena-network via
# the Portainer stack seam.

# ─── overlay network ─────────────────────────────────────────────────────
- name: "traefik: ensure {{ catena_network_name }} overlay exists"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - overlay
      - --attachable
      - "{{ catena_network_name }}"
  register: _catena_net_create
  changed_when: "_catena_net_create.rc == 0"
  # rc!=0 with "already exists" in stderr is the idempotent no-op path.
  failed_when:
    - _catena_net_create.rc != 0
    - "'already exists' not in (_catena_net_create.stderr | default(''))"

# ─── config tree ─────────────────────────────────────────────────────────
- name: "traefik: ensure config + dynamic dirs exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"

# acme.json backs certificatesResolvers.letsencrypt.acme.storage
# (traefik.yml.j2). It must exist as a FILE before the container launch: a
# docker bind-mount auto-creates a missing source as a DIRECTORY, which
# breaks Traefik ACME storage. Nothing else creates it.
- name: "traefik: stat acme.json (ACME cert storage must be a file)"
  ansible.builtin.stat:
    path: "{{ traefik_dynamic_dir }}/acme.json"
  register: _traefik_acme_stat

- name: "traefik: remove acme.json auto-created as a directory by a bind-mount"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/acme.json"
    state: absent
  when:
    - _traefik_acme_stat.stat.exists
    - _traefik_acme_stat.stat.isdir | default(false)
  register: _traefik_acme_dir_rm

- name: "traefik: seed empty acme.json"
  ansible.builtin.copy:
    content: ""
    dest: "{{ traefik_dynamic_dir }}/acme.json"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: "traefik: enforce 0600 on acme.json (Traefik refuses looser modes)"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/acme.json"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: "traefik: render static traefik.yml from template"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_static_cfg

- name: "traefik: render X-Forwarded-Proto injector middleware"
  ansible.builtin.template:
    src: cf-forwarded-proto-https.yml.j2
    dest: "{{ traefik_dynamic_dir }}/cf-forwarded-proto-https.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_xfp_middleware

- name: "traefik: render response security-headers middleware"
  ansible.builtin.template:
    src: secure-headers.yml.j2
    dest: "{{ traefik_dynamic_dir }}/secure-headers.yml"
    owner: root
    group: root
    mode: "0644"
  register: _traefik_secure_headers_middleware

# ─── deploy / reconcile catena-traefik ───────────────────────────────────
- name: "traefik: inspect catena-traefik state"
  ansible.builtin.command: docker inspect --type=container "{{ traefik_container_name }}"
  register: _traefik_inspect
  changed_when: false
  failed_when: false

- name: "traefik: read running image tag (for drift check)"
  ansible.builtin.command: >
    docker inspect {{ traefik_container_name }}
    --format '{{ "{{" }} .Config.Image {{ "}}" }}'
  register: _traefik_running_image
  changed_when: false
  failed_when: false
  when: _traefik_inspect.rc == 0

- name: "traefik: read host port bindings (must stay empty)"
  ansible.builtin.command: >
    docker inspect {{ traefik_container_name }}
    --format '{{ "{{" }} json .HostConfig.PortBindings {{ "}}" }}'
  register: _traefik_ports
  changed_when: false
  failed_when: false
  when: _traefik_inspect.rc == 0

# Running-state check. catena-traefik is a PLAIN container that attaches to
# catena-network by network ID. If the overlay was torn down and recreated
# (a restore rebuilds swarm+overlay from scratch -- see roles/backup/tasks/
# restore.yml; an interrupted converge or daemon flap can do the same), the
# new overlay has a fresh ID and the container's baked-in reference is stale:
# `docker start` fails with "failed to set up container networking: network
# <old-id> not found" and the container sits Exited. Swarm services rejoin by
# NAME so they self-heal, but this plain container cannot -- it must be
# relaunched onto the current overlay. Detect the not-running state so the
# relaunch below fires (the drift/ports/acme conditions never catch an exited
# container, so before this an overlay rebuild left ingress dead).
- name: "traefik: read running state (an exited container must be relaunched)"
  ansible.builtin.command: >
    docker inspect {{ traefik_container_name }}
    --format '{{ "{{" }} .State.Running {{ "}}" }}'
  register: _traefik_running_state
  changed_when: false
  failed_when: false
  when: _traefik_inspect.rc == 0

# A directory-acme.json fix means any running container still holds the bad
# mount, so it must be relaunched onto the seeded file.
- name: "traefik: decide whether catena-traefik needs (re)launch"
  ansible.builtin.set_fact:
    _traefik_needs_relaunch: >-
      {{
        _traefik_inspect.rc != 0
        or ((_traefik_running_image.stdout | default('') | trim) != traefik_image)
        or ((_traefik_ports.stdout | default('{}') | trim) not in ['{}', 'null'])
        or (_traefik_acme_dir_rm.changed | default(false))
        or (
          _traefik_inspect.rc == 0
          and (_traefik_running_state.stdout | default('true') | trim) != 'true'
        )
      }}

- name: "traefik: stop existing catena-traefik for relaunch"
  ansible.builtin.command: "docker rm -f {{ traefik_container_name }}"
  when:
    - _traefik_inspect.rc == 0
    - _traefik_needs_relaunch | bool
  register: _traefik_rm
  changed_when: _traefik_rm.rc == 0

# Launch on the catena-network overlay with the pinned image and NO host-port
# publishing.
- name: "traefik: launch catena-traefik (pinned image, no host ports)"
  ansible.builtin.command:
    argv: "{{ ['docker', 'run'] + traefik_run_argv + [traefik_image] }}"
  when: _traefik_needs_relaunch | bool
  register: _traefik_launch
  changed_when: _traefik_launch.rc == 0

# NOTE: catena-traefik attaches to catena_network_name ONLY. Every catena app
# stack joins catena-network via the Portainer stack seam, so that single
# overlay is all traefik needs to route to.

- name: "traefik: restart to pick up static config change"
  ansible.builtin.command: "docker restart {{ traefik_container_name }}"
  when:
    - not (_traefik_needs_relaunch | bool)
    - _traefik_static_cfg.changed
  register: _traefik_restart
  changed_when: _traefik_restart.rc == 0

# ─── restart resilience (nudge after docker restart) ─────────────────────
# Heals every container the swarm-overlay race strands on a docker.service
# start, not just traefik: dockerd restores restart-policy containers before
# the swarm node re-materializes catena-network, and it never retries the
# ones that lose that race. See the script header for the full mechanism.
- name: "traefik: drop nudge script"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-network-nudge.sh"
    dest: /usr/local/bin/catena-network-nudge
    owner: root
    group: root
    mode: "0755"

- name: "traefik: render nudge systemd unit"
  ansible.builtin.template:
    src: catena-network-nudge.service.j2
    dest: /etc/systemd/system/catena-network-nudge.service
    owner: root
    group: root
    mode: "0644"
  register: _traefik_nudge_unit

- name: "traefik: ensure docker.service drop-in dir exists"
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "traefik: render docker.service drop-in that fires the nudge"
  ansible.builtin.template:
    src: docker-service-nudge-dropin.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-catena-network-nudge.conf
    owner: root
    group: root
    mode: "0644"
  register: _traefik_nudge_dropin

- name: "traefik: daemon-reload if unit or drop-in changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _traefik_nudge_unit.changed or _traefik_nudge_dropin.changed
