---
# Validation tasks for roles/traefik. Lifted from roles/dokploy/tasks/validate.yml
# when Traefik ownership moved out of Dokploy (Dokploy->Portainer migration).

- name: "validate/traefik: catena-traefik container running"
  ansible.builtin.command: docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' catena-traefik
  register: _tr_running
  failed_when: false
  changed_when: false

- name: "validate/traefik: catena-traefik State.Running == true"
  ansible.builtin.assert:
    that:
      - _tr_running.rc == 0
      - _tr_running.stdout | trim == 'true'
    fail_msg: "catena-traefik not running (stdout={{ _tr_running.stdout | trim }})"

- name: "validate/traefik: PortBindings empty (hardening)"
  ansible.builtin.command: docker inspect --format '{% raw %}{{json .HostConfig.PortBindings}}{% endraw %}' catena-traefik
  register: _tr_ports
  failed_when: false
  changed_when: false

- name: "validate/traefik: PortBindings is empty map"
  ansible.builtin.assert:
    that:
      - _tr_ports.rc == 0
      - (_tr_ports.stdout | trim) in ['{}', 'null']
    fail_msg: "catena-traefik has host port bindings: {{ _tr_ports.stdout | trim }}"

- name: "validate/traefik: legacy admin-dokploy.yml route is gone"
  # Two same-Host()/same-priority routes (the old forwardAuth file and the new
  # per-app reverse-proxy file) both matched apps.<zone>. The legacy file is
  # removed in roles/traefik/tasks/main.yml; assert it so a partial upgrade
  # can't silently re-introduce the 401-instead-of-302 regression.
  ansible.builtin.stat:
    path: "{{ traefik_dynamic_dir }}/admin-dokploy.yml"
  register: _tr_legacy_admin_route

- name: "validate/traefik: admin-dokploy.yml absent"
  ansible.builtin.assert:
    that:
      - not _tr_legacy_admin_route.stat.exists
    fail_msg: |
      Legacy admin-dokploy.yml is still present. It conflicts with the per-app
      reverse-proxy route on Host(apps.<zone>) and makes Traefik route to the
      forwardAuth chain (401 + Location) instead of the reverse proxy (302).
      Re-run the traefik role.

- name: "validate/traefik: traefik.yml has forwardedHeaders.trustedIPs"
  # Without this Traefik rewrites X-Forwarded-Proto to "http" on the :80
  # entrypoint (cloudflared talks to it over plain HTTP), Keycloak sees
  # "non-secure context", refuses Secure cookies, and the account-console SPA
  # loops on cross-origin POSTs.
  ansible.builtin.slurp:
    src: "{{ traefik_config_dir }}/traefik.yml"
  register: _tr_static

- name: "validate/traefik: forwardedHeaders.trustedIPs covers RFC1918"
  ansible.builtin.assert:
    that:
      - "'forwardedHeaders' in (_tr_static.content | b64decode)"
      - "'10.0.0.0/8' in (_tr_static.content | b64decode)"
      - "'172.16.0.0/12' in (_tr_static.content | b64decode)"
    fail_msg: |
      traefik.yml is missing forwardedHeaders.trustedIPs covering RFC1918.
      Keycloak will log "Non-secure context detected" on every cross-origin
      POST and the account-console SPA will loop. Re-render via
      `./catena site --tags traefik` and verify catena-traefik restarted.

- name: "validate/traefik: catena-network overlay driver"
  ansible.builtin.command: docker network inspect catena-network --format '{% raw %}{{.Driver}}{% endraw %}'
  register: _tr_net_driver
  failed_when: false
  changed_when: false

- name: "validate/traefik: catena-network driver == overlay"
  ansible.builtin.assert:
    that:
      - _tr_net_driver.rc == 0
      - _tr_net_driver.stdout | trim == 'overlay'
    fail_msg: "catena-network driver is '{{ _tr_net_driver.stdout | trim }}', expected 'overlay'"
