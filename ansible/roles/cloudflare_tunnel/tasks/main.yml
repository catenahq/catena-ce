---
# Cloudflare tunnel converge -- token-gated dispatch to the host engine.
#
# The tunnel / wildcard DNS / ingress / cloudflared swarm-service logic that
# used to live here (CF API find-or-create, DNS CNAME, ingress PUT, service
# deploy + token/network reconcile, edge->tunnel->Traefik chain probe) now
# lives in the Go engine catena-cloudflared-sync. That binary ships in the
# catena-admin host payload and is installed to /usr/local/bin on EVERY
# converge by roles/catena-admin (it is NOT license-gated -- the Cloudflare
# tunnel is a Community feature). See catena-admin
# cmd/catena-cloudflared-sync/SYNC.md for the contract.
#
# This role now does ONE thing: when the on-box store already holds a
# Cloudflare API token, dispatch the engine's `sync` on the host to bring the
# tunnel to desired state inline (idempotent -- a re-converge after the panel
# saved a token, or a bench that adopted one, finds everything already correct
# and no-ops). When the store holds NO token the tunnel is DEFERRED: the client
# enters the token in catena-admin > Settings, which validates it
# (cloudflared-check) and fires cloudflared-sync in the background. A
# present-but-INVALID token fails the converge here (the engine exits nonzero),
# preserving the fail-fast abort intent (fi_n4/fi_s5) rather than
# half-configuring a broken edge.
#
# The Community single-domain cap is enforced by the engine (a token that
# grants more than one zone with CATENA_MULTIDOMAIN_ENABLED unset), not here.

- name: "CF: is a Cloudflare token present in the on-box store?"
  # load_onbox_config.yml (site/validate/restore pre_tasks) already published
  # every store secret as a fact; vault_cloudflare_api_token stays UNDEFINED
  # until the client saves one in catena-admin > Settings. The regenerate role
  # shadows it with the operator-supplied rotation token.
  ansible.builtin.set_fact:
    _cf_token_present: "{{ (vault_cloudflare_api_token | default('')) | length > 0 }}"

- name: "CF: tunnel deferred -- no Cloudflare token yet"
  ansible.builtin.debug:
    msg: >-
      Cloudflare token not yet provided -- enter it in catena-admin > Settings;
      tunnel deferred. No cloudflared tunnel is configured until a token is
      saved (the panel validates it and brings the tunnel up in the background).
  when: not (_cf_token_present | bool)

# The engine binary is installed by roles/catena-admin -- which runs AFTER this
# role in site.yml -- so on a FIRST converge (or a bench that stages the
# payload out of band) the binary may not exist yet. Skip gracefully in that
# window: the tunnel converges on the next run (binary present) or via the
# panel-triggered cloudflared-sync. This is ORTHOGONAL to the invalid-token
# abort below -- a missing engine is "not installed yet", not "bad token".
- name: "CF: stat the cloudflared-sync engine"
  ansible.builtin.stat:
    path: "{{ cloudflared_sync_bin }}"
  register: _cf_sync_bin
  when: _cf_token_present | bool

- name: "CF: engine not installed yet -- tunnel converges on the next run"
  ansible.builtin.debug:
    msg: >-
      {{ cloudflared_sync_bin }} is not on the host yet (installed by
      roles/catena-admin later in this converge). The Cloudflare tunnel will
      converge on the next run, or when catena-admin dispatches cloudflared-sync
      after the client saves a token.
  when:
    - _cf_token_present | bool
    - not (_cf_sync_bin.stat.exists | default(false))

# Bring the tunnel to desired state on the host. Runs on the VPS (the engine
# drives docker + the https chain probe locally). The token is NOT passed here
# -- the engine reads it from /etc/catena/config.json. fail-fast: a
# present-but-invalid token (or any failed converge step) exits nonzero and
# ABORTS the converge (fi_n4/fi_s5).
- name: "CF: converge the tunnel via catena-cloudflared-sync (host engine)"
  ansible.builtin.command:
    argv:
      - "{{ cloudflared_sync_bin }}"
      - sync
  environment:
    # Base domain: the engine resolves the primary zone BY NAME, tolerating an
    # account-scoped token that grants more than one zone. Without it the engine
    # falls back to requiring a single-zone-scoped token (grants exactly 1).
    CLOUDFLARE_PRIMARY_ZONE: "{{ cloudflare_zone }}"
    CLOUDFLARED_IMAGE: "{{ cloudflared_image }}"
    CLOUDFLARED_INGRESS_SERVICE: "{{ cloudflared_ingress_service }}"
    CLOUDFLARED_TUNNEL_NAME: "{{ cloudflared_tunnel_name }}"
    CATENA_NETWORK: "{{ catena_network_name | default('catena-network') }}"
    CLOUDFLARED_STOP_GRACE: "{{ cloudflared_stop_grace }}"
    CLOUDFLARED_PROBE_ATTEMPTS: "{{ cloudflared_probe_attempts | string }}"
    CLOUDFLARED_REPROBE_ATTEMPTS: "{{ cloudflared_reprobe_attempts | string }}"
    CLOUDFLARED_PROBE_DELAY_SECONDS: "{{ cloudflared_probe_delay_seconds | string }}"
    # Business multi-domain: set to 1 ONLY under an active Business license (the
    # EE overlay sets catena_ee_multidomain_enabled). Unset on Community -> the
    # engine converges the PRIMARY domain only and leaves stored secondaries
    # intact (graceful degrade, never fail-closed).
    CATENA_MULTIDOMAIN_ENABLED: "{{ '1' if (catena_ee_multidomain_enabled | default(false) | bool) else '' }}"
  register: _cf_sync
  # The engine is internally idempotent (it owns the cloudflared re-encoded-
  # token no-op that fi_c6 guarded, plus the network/self-heal reconciles), and
  # emits no ansible-parsable changed signal, so report unchanged: a re-converge
  # must not trip the bench changed=0 idempotency gate on this single command.
  changed_when: false
  when:
    - _cf_token_present | bool
    - _cf_sync_bin.stat.exists | default(false)

- name: "CF: tunnel converged (engine summary)"
  ansible.builtin.debug:
    msg: |
      {{ _cf_sync.stdout | default('(no summary line)') | trim }}

      DO NOT enable Let's Encrypt / HTTPS on Traefik -- Cloudflare terminates
      TLS at the edge and LE conflicts with the tunnel.
  when:
    - _cf_token_present | bool
    - _cf_sync_bin.stat.exists | default(false)
