---
# Cloudflare tunnel converge pins.
#
# The tunnel/DNS/ingress/cloudflared-service logic moved into the Go engine
# catena-cloudflared-sync (host payload, installed by roles/catena-admin on
# every converge). This role now only dispatches that engine's `sync` when the
# on-box store holds a Cloudflare token (see tasks/main.yml + catena-admin
# cmd/catena-cloudflared-sync/SYNC.md). The vars below are the NON-SECRET pins
# the role exports into the engine's environment so production uses the pinned
# image / tunnel name / ingress service rather than the engine's built-in
# defaults. The token itself is read from the store by the engine, never passed
# here, and neither is the tunnel name: the engine composes that from the box's
# own hostname and the prefix the store carries.
#
# The role still runs BEFORE keycloak + oauth2_proxy in site.yml (single-pass
# converge): oauth2_proxy waits for the public auth.<zone> URL, which needs the
# tunnel up first when a token is present.

# Host engine binary (installed into /usr/local/bin by the catena-admin payload
# installer). SYNC.md is the contract.
cloudflared_sync_bin: "/usr/local/bin/catena-cloudflared-sync"

# There is no `cloudflare_zones` fact any more. The zone list is assembled by
# the host engine from the on-box store (the primary scalar plus whatever the
# Domains panel attached), capped by the licence the same store holds, and
# published to /var/lib/catena/cloudflare-zones.json after a successful
# converge. Nothing in this repo computes it, and nothing has to pass it
# between roles.

# The engine's spec pins are NOT duplicated here any more. The image, the
# Traefik ingress service, the overlay, the stop grace and the probe counts are
# product constants that catena-cloudflared-sync already carries as its own
# defaults, and listing them here made three copies of each -- this file, the
# catena-admin reserved action, and the engine -- agreeing only by hand.
#
# The image pin moved with them: Renovate and Trivy now track
# cloudflare/cloudflared in catena-admin, where the engine reads it. cloudflared
# is the highest-blast-radius service in the suite (a broken image kills the
# public path AND the route to catena-admin), so a version tracked in a file the
# host no longer reads is exactly the wrong place for it. Bumps stay manual and
# the managed-update engine still rolls back on health regression.

# `cloudflare_api_base` lives in group_vars/all/main.yml so playbooks
# that hit the Cloudflare API without importing this role (e.g.
# decommission.yml's tunnel-delete leg) can resolve it from the same
# source.
