---
# Cloudflare tunnel converge pins.
#
# The tunnel/DNS/ingress/cloudflared-service logic moved into the Go engine
# catena-cloudflared-sync (host payload, installed by roles/catena-admin on
# every converge). This role now only dispatches that engine's `sync` when the
# on-box store holds a Cloudflare token (see tasks/main.yml + catena-admin
# cmd/catena-cloudflared-sync/SYNC.md). The vars below are the NON-SECRET pins
# the role exports into the engine's environment so production uses the pinned
# image / tunnel name / ingress service rather than the engine's built-in
# defaults. The token itself is read from the store by the engine, never passed
# here.
#
# The role still runs BEFORE keycloak + oauth2_proxy in site.yml (single-pass
# converge): oauth2_proxy waits for the public auth.<zone> URL, which needs the
# tunnel up first when a token is present.

cloudflared_tunnel_name: "{{ inventory_hostname }}"

# Host engine binary (installed into /usr/local/bin by the catena-admin payload
# installer). SYNC.md is the contract.
cloudflared_sync_bin: "/usr/local/bin/catena-cloudflared-sync"

# Canonical zone list, defaulted here (lowest precedence) so EVERY context
# that runs this role has it defined -- the CE inventory group_vars sets it
# explicitly (and wins), but fresh-target flows that converge through a
# different var context (migrate.yml / restore onto a new box, driven from
# the ops or catena-ee inventory) only carry the legacy scalars. Derive the
# single-element Community list from those scalars so the per-zone loops
# never hit an undefined `cloudflare_zones`. The Business overlay
# (catena-ee) replaces this with a multi-zone list + catena_ee_multidomain_enabled.
cloudflare_zones:
  - zone: "{{ cloudflare_zone }}"
    account_id: "{{ cloudflare_account_id | default('') }}"
    api_token: "{{ vault_cloudflare_api_token }}"

# Traefik service URL inside catena-network -- the single destination for
# every *.<zone> wildcard ingress rule.
cloudflared_ingress_service: "http://catena-traefik:80"

# Pinned to a full semver so the managed-update engine handles bumps with
# auto-rollback. cloudflared is the highest-blast-radius service in the
# stack: a broken image kills the public path AND the operator's ability
# to reach OliveTin. The managed engine bumps within YYYY.M.* by default
# and uses `docker service update --rollback` (built-in swarm primitive)
# on health regression. Resolved at policy-rollout time (2026-04) to what
# was running on dev1.
cloudflared_image_tag: "2026.7.1"
cloudflared_image: "cloudflare/cloudflared:{{ cloudflared_image_tag }}"

# Remaining non-secret engine pins (SYNC.md "Environment pins"). Exported into
# the catena-cloudflared-sync environment by tasks/main.yml AND by the
# catena-admin cloudflared-sync reserved action, so both converge paths use the
# same production values rather than the engine's built-in defaults.
#   - stop-grace must outlast cloudflared's ~30s drain (40s).
#   - probe/reprobe counts + delay size the edge->tunnel->Traefik chain probe
#     for a freshly-created tunnel propagating (60x10s first pass, 30x10s
#     re-probe after the self-heal roll).
cloudflared_stop_grace: "40s"
cloudflared_probe_attempts: 60
cloudflared_reprobe_attempts: 30
cloudflared_probe_delay_seconds: 10

# `cloudflare_api_base` lives in group_vars/all/main.yml so playbooks
# that hit the Cloudflare API without importing this role (e.g.
# decommission.yml's tunnel-delete leg) can resolve it from the same
# source.
