---
# Where Docker stores containers/images/volumes. Points at the storage role's
# /mnt/data/docker subdir so container layers + named volumes live on the
# block volume (attached mode) or the pre-carved dir (built_in mode), not on
# the root filesystem where they'd eat into the OS disk.
docker_data_root: "{{ storage_mount_point }}/docker"

# json-file log driver with rotation. Prevents a misbehaving container from
# filling the disk with stdout. These values apply globally; per-container
# overrides are still possible via compose.
docker_log_max_size: "50m"
docker_log_max_files: 5

# live-restore lets dockerd restart without killing running containers.
# HOWEVER: it is incompatible with Docker Swarm mode, which the catena
# control plane requires (catena-traefik, catena-postgres, catena-portainer
# all run as swarm services). live-restore must be false; swarm's own
# orchestrator handles container lifecycle across daemon restarts instead.
docker_live_restore: false

# Docker Swarm advertise address. The tailnet IP so any future multi-node
# expansion uses the private tailnet path. This role inits a single-node
# swarm (below) that the reverse-proxy + control-plane roles deploy their
# services onto.
docker_swarm_advertise_addr: "{{ ansible_host }}"

# catena-network-nudge: seconds to wait for the overlay to re-materialize
# after a docker.service start before giving up. Reaches the script as
# CATENA_NETWORK_NUDGE_TIMEOUT, via the docker.service drop-in (--setenv) and
# the unit file (Environment=).
#
# The nudge lives in THIS role because the race it heals is between two things
# this role owns: dockerd restoring restart-policy containers during "Loading
# containers", and the swarm node re-materializing catena-network afterwards.
# It was in roles/traefik only because traefik was the first victim found; it
# moved here at the swarm conversion, which also removed its traefik special
# case. What it protects now is the Portainer compose containers
# (keycloak-server-1, oauth2-proxy, gatus, nextcloud-talk-hpb-1, ...) -- every
# swarm service, traefik included, re-dispatches itself by name.
docker_network_nudge_timeout: 60

# The `catena.role` label put on this node, and the value every stateful swarm
# service constrains itself to (node.labels.catena.role==data). One value today
# because there is one node; it exists as a variable so a second node can join
# as something else without editing every role.
#
# The constraint is what makes adding a worker safe. Without it swarm can
# reschedule a service with a node-local named volume onto the new node and
# silently create an empty volume there -- the container starts and the data is
# gone. `audit --check-swarm` in ops fails the build if a service that mounts
# anything is missing a constraint.
#
# Each stateful role spells its own constraint out literally rather than
# referencing a var from here: role defaults are only reliably in scope after
# that role has run, and a tag-scoped `--tags postgres` run would otherwise
# render an undefined constraint. The coupling is enforced by the audit gate
# (`audit --check-swarm`), which fails when the label this role SETS and the
# label the constraints REFERENCE disagree -- a check that cannot drift, unlike
# a shared variable that a tag-scoped run can leave undefined.
docker_node_role_label: "data"

# Codename-aware apt repo. Matches the pattern used by roles/tailscale/.
docker_apt_codename: "{{ ansible_facts['distribution_release'] }}"
docker_apt_key_url: "https://download.docker.com/linux/debian/gpg"
docker_apt_repo: "deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/debian {{ docker_apt_codename }} stable"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Optional pull-through Docker Hub mirror. Empty string = no mirror
# (direct docker.io pulls). Set to the mirror base URL
# (e.g. http://10.72.185.1:5000) to route registry-mirrors entries
# through it. The test bench sets this via its DOCKER_REGISTRY_MIRROR_URL
# dotenv key so VMs cache docker.io pulls on the host. The matching
# insecure-registries entry (plain host:port, no scheme) is derived
# automatically when the URL is http:// (lab use); https:// mirrors
# need no insecure-registries listing.
docker_registry_mirror_url: "{{ lookup('dotenv', 'DOCKER_REGISTRY_MIRROR_URL', default='') }}"
