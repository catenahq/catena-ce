---
# Provision Keycloak's database + role inside catena-postgres.
#
# Why here and not in roles/postgres: roles/postgres owns the
# catena-postgres server + its superuser swarm secret. Per-app DBs
# (like keycloak's) are app-role concerns.
#
# Idempotency: `CREATE ROLE` + `CREATE DATABASE` are not IF-NOT-EXISTS
# in vanilla psql, so we render a SQL script that wraps the role
# creation in a DO block and gates the DB creation on a pg_database
# existence probe (run as a separate task because CREATE DATABASE
# cannot run inside a transaction block).
#
# Atomicity: gated on catena-postgres being `running`. Per project
# memory `feedback_pg_password_state_machine`, catena-postgres becoming
# reachable AFTER this point is the postgres role's invariant, not ours.
#
# SQL rendered to /root and piped via stdin instead of inlined in
# `command:`/`shell:` argv -- ansible-core 2.20's stricter arg scanner
# trips on Jinja-rendered SQL embedded in a shell heredoc (same root
# cause as the Healthchecks seed-script-to-file refactor recorded in
# memory `feedback_pg_password_state_machine`).

- name: "Keycloak DB: find catena-postgres swarm task"
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{{ "{{" }}.Names{{ "}}" }}' \
      | grep -E '^catena-postgres\..*' \
      | head -n1
  args:
    executable: /bin/bash
  register: _kc_pg_container
  changed_when: false
  retries: 30
  delay: 4
  until: _kc_pg_container.stdout | length > 0

# A container that EXISTS is not a postgres that ACCEPTS CONNECTIONS, and
# after a rewind the gap between the two is seconds wide. The task above
# retries until the swarm task appears and then every psql below ran with no
# readiness gate at all, which failed fi_a2_oidc_secret_rotation's converge:
#
#     psql: error: connection to server on socket
#     "/var/run/postgresql/.s.PGSQL.5432" failed:
#     FATAL:  the database system is starting up
#
# It surfaced only once the bench got FASTER. Before ops 9ffea356 a rewind
# spent up to 300s failing to reach a stale address, which gave postgres all
# the time it needed; with the address resolved correctly the converge starts
# as soon as SSH answers. Removing an accidental delay exposed a role that was
# relying on it.
#
# pg_isready checks server acceptance only -- no auth, no role, no database --
# so it needs none of the facts the tasks after it derive, and it is the same
# probe roles/postgres and the bench's own _fi_helpers.pg_settled_sample use.
# It goes here, before the POSTGRES_USER probe, because that probe is itself a
# `docker exec` that can race the same window.
- name: "Keycloak DB: wait for postgres to accept connections"
  ansible.builtin.command:
    argv: [docker, exec, "{{ _kc_pg_container.stdout | trim }}", pg_isready, -q]
  register: _kc_pg_ready
  until: _kc_pg_ready.rc == 0
  retries: 30
  delay: 4
  changed_when: false

# catena-postgres ships POSTGRES_USER=postgres (roles/postgres sets it).
# Detect the live superuser from the container env anyway so this role
# survives any future default-user change. Same probe the restore
# engine does per container (catena-recovery post-restore).
- name: "Keycloak DB: detect POSTGRES_USER from catena-postgres env"
  ansible.builtin.shell: >-
    docker exec {{ _kc_pg_container.stdout | quote }}
    sh -c 'printf %s "${POSTGRES_USER:-}"'
  args:
    executable: /bin/bash
  register: _kc_pg_superuser_probe
  changed_when: false

- name: "Keycloak DB: set POSTGRES_USER fact (fallback to `postgres` if env unset)"
  ansible.builtin.set_fact:
    _kc_pg_superuser: "{{ (_kc_pg_superuser_probe.stdout | trim) or 'postgres' }}"

- name: "Keycloak DB: probe whether `keycloak` database already exists"
  ansible.builtin.shell: |
    set -o pipefail
    docker exec -i {{ _kc_pg_container.stdout | quote }} \
      psql -U {{ _kc_pg_superuser | quote }} -tAc "SELECT 1 FROM pg_database WHERE datname='{{ keycloak_db_name }}'"
  args:
    executable: /bin/bash
  register: _kc_db_exists
  changed_when: false

- name: "Keycloak DB: render provisioner SQL to /root"
  ansible.builtin.template:
    src: provision-db.sql.j2
    dest: /root/catena-keycloak-provision-db.sql
    owner: root
    group: root
    mode: "0600"
  vars:
    keycloak_db_create: "{{ (_kc_db_exists.stdout | trim) != '1' }}"
  changed_when: false # idempotent reconciliation; don't noisy-up the run
  no_log: true # hides the rendered password embedded in the script

- name: "Keycloak DB: apply provisioner SQL"
  ansible.builtin.shell: >-
    docker exec -i {{ _kc_pg_container.stdout | quote }}
    psql -U {{ _kc_pg_superuser | quote }} -d postgres
    < /root/catena-keycloak-provision-db.sql
  args:
    executable: /bin/bash
  register: _kc_provision_apply
  changed_when:
    - _kc_provision_apply.rc == 0
    - >-
      'CREATE ROLE' in (_kc_provision_apply.stdout | default(''))
      or 'CREATE DATABASE' in (_kc_provision_apply.stdout | default(''))
