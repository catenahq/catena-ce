---
# Render keycloak.compose.yml.j2 + deploy via the Portainer API. Reuses
# roles/infrastructure/tasks/portainer_stack.yml -- single canonical
# helper for stack create/update + Traefik route + readiness probe. See
# its header for contract details.
#
# The readiness probe is the public URL (auth.<zone>) which only
# resolves once cloudflared + Traefik route this host AND Keycloak's
# /health/ready returns 200. cloudflared is up by now (roles/
# cloudflare_tunnel runs before this role since 2026-05-08), but the
# Traefik route for auth.<zone> is the keycloak compose itself --
# which we are deploying RIGHT NOW. Skip the public probe and let
# the in-container healthcheck (defined in keycloak.compose.yml.j2)
# gate readiness; the post-deploy probe in tasks/validate.yml handles
# the cross-check once Traefik picks up the new compose.

# Multi-domain: which domains this host serves. Read from the projection the
# tunnel engine writes after a SUCCESSFUL converge (roles/cloudflare_tunnel runs
# before this role), rather than from a fact computed here -- so an
# auth.<zone> route can never be written for a domain the edge is not serving.
#
# Every failure mode collapses to the same safe answer, primary-only: a missing
# file (single-domain host, or a converge that has not reached the tunnel yet), a
# malformed one, an unknown schema, or a stamp older than the staleness bound. A
# host whose subscription lapsed publishes only its primary domain, so the routes
# follow the entitlement without this repo knowing anything about licences.
- name: "Keycloak: read the served-domain projection"
  ansible.builtin.slurp:
    src: "{{ keycloak_zone_projection_path }}"
  register: _kc_zones_raw
  become: true
  failed_when: false

- name: "Keycloak: resolve the secondary auth domains"
  ansible.builtin.set_fact:
    _kc_secondary_zones: >-
      {{ (_kc_zones_raw.content | default('') | b64decode)
         | catena_served_zones(
             schema=keycloak_zone_projection_schema,
             now=ansible_date_time.iso8601 | default(''),
             max_age_hours=keycloak_zone_projection_max_age_hours) }}

- name: "Keycloak: deploy as a swarm stack"
  ansible.builtin.include_tasks: ../../infrastructure/tasks/swarm_stack.yml
  vars:
    svc_name: "{{ keycloak_compose_name }}"
    svc_compose_content: "{{ lookup('template', 'keycloak.compose.yml.j2') }}"
    svc_domain_host: "{{ keycloak_hostname }}"
    # Multi-domain (EE): one Keycloak serves an auth.<zone> island per attached
    # domain. Route every secondary zone's auth host to Keycloak too (the
    # primary is svc_domain_host above). Empty on single-domain -> the route
    # rule stays a single Host() (byte-identical).
    svc_domain_extra_hosts: >-
      {{ _kc_secondary_zones
         | map('regex_replace', '^', keycloak_subdomain ~ '.')
         | list }}
    svc_domain_service: "{{ keycloak_server_service }}"
    svc_domain_port: "{{ keycloak_internal_port }}"
    svc_readiness_skip_reason: >-
      auth.<zone> only becomes reachable once roles/infrastructure
      renders the cloudflared ingress + Traefik route. Verified by
      tasks/validate.yml's /health/ready probe + the aggregate post-
      role probe in roles/infrastructure.
