# catena-admin (unified admin shell) -- stack compose.
#
# Single source of truth for deploying the admin shell as a Portainer
# stack. Every per-host value -- INCLUDING the image ref -- arrives via the
# stack Env ${VAR} substitution at deploy time, so both consumers share this
# file verbatim with no build:/image: fork:
#   - Operator (production): roles/catena-admin/tasks/deploy.yml pushes this
#     file through the Portainer stack API with svc_env supplying
#     CATENA_ADMIN_IMAGE = the PUBLIC GHCR image ({{ catena_admin_image }});
#     anonymous pull, no registry credential -- the license check gates the
#     Business feature set at runtime.
#   - Test bench: builds the image on the VPS (local/catena-admin:bench) and
#     supplies CATENA_ADMIN_IMAGE = that local tag through its Env array
#     (orchestrator/catena_admin_deploy.py). It reads THIS file raw.
#
# The roles/catena-admin Ansible role creates the host-side bind targets
# (/etc/catena/admin-ssh, /etc/catena/admin-actions.yml, /etc/catena/
# extra-tiles.yml, /var/lib/catena stats + ee-payload, /var/backups/
# catena-export) before the container boots. Every panel (CE + Business) is
# compiled into the image; the Business set is enabled at runtime only while
# the license token verifies. The image also carries the host-side Business
# payload, which the shell mirrors into the ee-payload bind mount for the
# ee-install-engines action to install host-side.

services:
  app:
    # Image ref supplied per-consumer via the stack Env array
    # (CATENA_ADMIN_IMAGE): the published GHCR tag/digest in production, the
    # locally-built tag on the bench. The :- default keeps a bare
    # `docker compose up` (no Env) pullable.
    image: ${CATENA_ADMIN_IMAGE:-ghcr.io/catenahq/catena-admin:latest}
    restart: unless-stopped
    # Host-published tailnet port for the native-login listener (:8001 inside
    # the container). Firewalled to the tailnet + RFC1918 by the public-ports
    # registry (roles/catena-admin writes the fragment), exactly like Portainer.
    # The internal :8000 stays cluster-only (oauth2-proxy upstream on the
    # dash.<zone> path). Publishing ONLY the direct listener keeps the trust
    # boundary airtight: the host port can never reach the header-trusting
    # listener.
    ports:
      - target: 8001
        published: ${CATENA_ADMIN_UI_PORT:-9010}
        protocol: tcp
        mode: host
    environment:
      # Listen on :8000 to match the oauth2-proxy slug + the dash.<zone>
      # domain port (the image default is :8080).
      CATENA_ADMIN_ADDR: ":8000"
      # Native-login listener for the host-published tailnet port. Started only
      # when a session key is set (roles/catena-admin supplies the on-box-minted
      # catena_admin_session_key); LOCAL_USER is the admin email.
      CATENA_ADMIN_DIRECT_ADDR: ${CATENA_ADMIN_DIRECT_ADDR:-:8001}
      CATENA_ADMIN_SESSION_KEY: ${CATENA_ADMIN_SESSION_KEY:-}
      CATENA_ADMIN_LOCAL_USER: ${CATENA_ADMIN_LOCAL_USER:-}
      CATENA_DEFAULT_LANG: ${CATENA_DEFAULT_LANG:-en}
      CATENA_DEFAULT_THEME: ${CATENA_DEFAULT_THEME:-system}
      CATENA_CLIENTS_TAB_ENABLED: ${CATENA_CLIENTS_TAB_ENABLED:-}
      # License FALLBACK. The token's real home is the on-box config store
      # (secrets.catena_license), which the panel reads through the
      # catena-config host action and the host engines read directly -- so a
      # client can paste a renewed key into Settings without anyone redeploying
      # this stack, and the engines can see it at all. These two stay as the
      # fallback for the window before the host dispatch is up, and for the test
      # bench, which activates a host by redeploying with them. A released image
      # carries the public key stamped in and ignores the PUBKEY variable: the
      # trust root must not be replaceable by editing a compose file.
      # A lapse past grace disables the Business set -- never the shell.
      CATENA_LICENSE: ${CATENA_LICENSE:-}
      CATENA_LICENSE_PUBKEY: ${CATENA_LICENSE_PUBKEY:-}
      # The domain this server serves. A license token names the one domain it
      # entitles, and the panel compares the two -- so the same key cannot
      # unlock a second server. Normally read from the store alongside the
      # token; supplied here for the same fallback window.
      CLOUDFLARE_PRIMARY_ZONE: ${CLOUDFLARE_PRIMARY_ZONE:-}
      # Host-mounted target the shell mirrors its embedded Business host
      # payload into (engines + lane scripts + units + installer); the
      # ee-install-engines action installs from there host-side.
      CATENA_EE_PAYLOAD_DIR: /var/lib/catena/ee-payload
      # Where the audit hash chain is written. Unset disables the chain and
      # leaves journald as the only sink, which is what a host predating this
      # mount does -- degraded, never broken.
      CATENA_ADMIN_STATE_DIR: /var/lib/catena-admin
      PORTAINER_API_BASE: ${PORTAINER_API_BASE}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-vps}
      INFRA_MONITOR_HOSTNAME: ${INFRA_MONITOR_HOSTNAME:-}
      INFRA_HEARTBEAT_HOSTNAME: ${INFRA_HEARTBEAT_HOSTNAME:-}
      INFRA_BESZEL_HOSTNAME: ${INFRA_BESZEL_HOSTNAME:-}
      CATENA_ADMIN_RECOVERY_URL: ${CATENA_ADMIN_RECOVERY_URL:-}
      GATUS_COMPOSE_NAME: ${GATUS_COMPOSE_NAME:-gatus}
      GATUS_INTERNAL_PORT: ${GATUS_INTERNAL_PORT:-8080}
      HEALTHCHECKS_COMPOSE_NAME: ${HEALTHCHECKS_COMPOSE_NAME:-healthchecks}
      HEALTHCHECKS_INTERNAL_PORT: ${HEALTHCHECKS_INTERNAL_PORT:-8000}
      HEALTHCHECKS_API_KEY_READONLY: ${HEALTHCHECKS_API_KEY_READONLY:-}
      # Host-dispatch SSH: the shell SSHes into the forced-command runner
      # account to execute Actions/Recovery on the host.
      ADMIN_SSH_HOST: ${ADMIN_SSH_HOST:-host.docker.internal}
      ADMIN_SSH_USER: ${ADMIN_SSH_USER:-catena-admin-runner}
      ADMIN_SSH_KEY_PATH: /etc/catena/admin-ssh/id_ed25519
    volumes:
      # Writable nested bind: the shell mirrors its embedded Business host
      # payload here at startup; the host-side installer action reads it at
      # the same path. The ro /var/lib/catena mount below provides host
      # stats; this bind shadows the ee-payload subpath rw.
      - /var/lib/catena/ee-payload:/var/lib/catena/ee-payload
      # The shell's own writable state: the audit hash chain and the per-host
      # key that signs its head. Separate from the ro /var/lib/catena mount
      # below because this is state the shell WRITES, and separate from the
      # journal because it has to survive as a file the export can ship.
      - /var/lib/catena-admin:/var/lib/catena-admin
      - /etc/catena/admin-ssh:/etc/catena/admin-ssh:ro
      - /var/backups/catena-export:/var/backups/catena-export:ro
      - /var/lib/catena:/var/lib/catena:ro
      - /etc/catena/admin-actions.yml:/etc/catena/admin-actions.yml:ro
      - /etc/catena/extra-tiles.yml:/etc/catena/extra-tiles.yml:ro
      # Host journald socket: the shell's audit log IS journald
      # (internal/auditlog Emit -> go-systemd journal.Send, which writes to
      # this datagram socket). Without it journal.Enabled() is false in the
      # container and every audit entry is silently dropped. Mounting the
      # host socket routes structured audit rows (SYSLOG_IDENTIFIER=
      # catena-admin) into the HOST journal, where the EE audit panel + the
      # Alloy shipper read them back. Send-only: the socket lets the
      # container WRITE journald entries, not read other services' logs.
      - /run/systemd/journal/socket:/run/systemd/journal/socket
    # The recovery export dir (/var/backups/catena-export) is mode 0750
    # owned root:1000 (gid 1000 is the shared recovery-downloads group; the
    # nginx sidecar reads it as root via owner-rwx). The shell image runs
    # USER nonroot:nonroot, which is neither the owner nor in group 1000, so
    # without this the Recovery tab's ListArtifacts (os.ReadDir) gets EACCES
    # and renders the empty state even when host-side generation wrote a
    # recovery-*.zip. Add gid 1000 as a supplementary group so the nonroot
    # shell can traverse + read the dir (read-only; the bytes are still
    # served by the gated nginx sidecar, not the shell).
    group_add:
      - "1000"
    labels:
      - "vps.auth.mode=private"
      - "vps.auth.groups=staff,admin"
      - "vps.auto-update=patch"
      - "vps.homepage.name=Catena Admin"
      - "vps.homepage.icon=mdi-shield-account"
      - "vps.homepage.description=Operator panel: apps, system, actions, recovery"
    # host.docker.internal -> host-gateway so the SSH dispatch resolves the
    # host from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      catena-network:
        aliases:
          - catena-admin

networks:
  catena-network:
    external: true
