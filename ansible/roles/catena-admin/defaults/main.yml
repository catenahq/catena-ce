---
# roles/catena-admin -- per-VPS admin panel (the catena-admin Go shell).
#
# The role manages the container's HOST-SIDE state (host.yml + catalog.yml)
# AND deploys the container itself as a Portainer stack (deploy.yml, pulling
# catena_admin_image). See README.md.

# --- Hostname ---------------------------------------------------------
# The admin panel is served at dash.<zone> by default. Override the
# subdomain via CATENA_ADMIN_SUBDOMAIN in the inventory's .env.
catena_admin_subdomain: "{{ lookup('dotenv', 'CATENA_ADMIN_SUBDOMAIN', default='dash') }}"
catena_admin_hostname: "{{ catena_admin_subdomain }}.{{ cloudflare_zone }}"

# --- Container image + port -------------------------------------------
# PUBLIC catena-admin image the converge deploys (deploy.yml). Clients
# PULL this at converge time -- they never build on the client box (no Go
# toolchain on a client VPS). Published by the private catena-admin repo's
# publish-image.yml on a v* tag from main; the IMAGE is public (anonymous
# pull, no registry credential) while the Business feature set inside it
# is gated at runtime by the license check. Defaults to the floating
# :latest GHCR tag; pin to an immutable @sha256 digest here once the first
# publish lands, and let the version bumper manage the pin thereafter. The
# bench does not use this var (it builds local/catena-admin:bench on the
# VPS and passes that tag).
catena_admin_image: "ghcr.io/catenahq/catena-admin:latest"

# Deploy the catena-admin container FROM the converge (deploy.yml). Production
# pulls the published GHCR image at converge time. The test bench builds the
# image on the VPS and deploys it OUT OF BAND (stage-2.6, build-on-host per the
# resolved 1z decision) -- the published GHCR image does not exist there -- so
# the bench sets CATENA_ADMIN_DEPLOY_FROM_CONVERGE=false to skip the converge
# deploy. Production leaves it true.
catena_admin_deploy_from_converge: >-
  {{ lookup('env', 'CATENA_ADMIN_DEPLOY_FROM_CONVERGE', default='true') | bool }}

# Port the Go shell listens on inside the container (CATENA_ADMIN_ADDR
# :8000 in the compose; oauth2_proxy upstreams to catena-admin:8000).
catena_admin_internal_port: 8000

# Native-login listener inside the container, published on the host (tailnet-
# only) so the panel is reachable at http://<tailnet-ip>:<catena_admin_ui_port>
# without the Cloudflare/oauth2-proxy edge -- the same pattern as Portainer's
# UI port. Firewalled by the public-ports registry (host.yml fragment).
catena_admin_direct_port: 8001
catena_admin_ui_port: "{{ lookup('dotenv', 'CATENA_ADMIN_UI_PORT', default='9010') }}"

# --- Host-side runner -------------------------------------------------
# Dedicated SSH account the admin container uses to dispatch actions on
# the host. Forced-command pinned to the dispatcher script below; the
# dispatcher's allow-list is rendered from the action catalog at
# converge time.
catena_admin_runner_user: "catena-admin-runner"
catena_admin_runner_home: "/home/catena-admin-runner"

# The catena-admin container runs as the distroless `nonroot` user
# (uid/gid 65532), set by `USER nonroot:nonroot` in the repo-root Dockerfile
# -- NOT uid 1000. Host-side files the container reads through its read-only
# bind mounts (the SSH runner private key, known_hosts, ssh config) must be
# owned by this uid, and the 0700 ssh dir must be owned by it, or the Go
# shell's SSH action runner fails every dispatch with
# "known_hosts load failed: ... permission denied". Keep in lockstep with
# the Dockerfile's USER.
catena_admin_container_uid: "65532"
catena_admin_container_gid: "65532"

# Host paths -- the bind-mount targets the admin compose expects. Keep
# these in sync with the compose file when you rename either.
catena_admin_host_ssh_dir: "/etc/catena/admin-ssh"
catena_admin_dispatcher_path: "/usr/local/sbin/catena-admin-runner"
catena_admin_allowed_actions_path: "/etc/catena/admin-allowed.yaml"
catena_admin_dispatch_actions_path: "/etc/catena/admin-actions"
catena_admin_actions_yml_path: "/etc/catena/admin-actions.yml"
catena_admin_actions_extra_yml_path: "/etc/catena/admin-actions.extra.yml"
catena_admin_extra_tiles_path: "/etc/catena/extra-tiles.yml"
# Host dir where run-backup.sh + gatus-sync.py write their summary JSON
# files (backup-stats.json, gatus-summary.json, healthchecks-summary.json).
# Bind-mounted read-only into the admin container; the admin's stats
# reader picks up the files unchanged. Matches roles/backup defaults'
# backup_stats_dir; do not move without updating that role + the
# post-restore.needed marker contract (test_restore_option_a).
catena_admin_stats_dir: "/var/lib/catena"
catena_admin_state_dir: "/var/lib/catena-admin"

# The audit.db SQLite Online-Backup quiesce hooks that ride this role
# in the Business edition are NOT part of Community: the audit module
# is license-gated, so no audit.db exists here, and the quiesce.d hooks
# are consumed by the (Business-only) catena-daily orchestrator.

# Source-of-truth action catalog. Rendered by catalog.yml into the
# host dispatch table + the catalog the Go shell reads at runtime.
# Role-relative template; the only Jinja marker is `ansible_managed`.
catena_admin_actions_source: "{{ role_path }}/templates/actions.yml.j2"

# Default locale + theme rendered into the admin container's env.
# Inventory overrides via catena_default_language / catena_default_theme.
catena_admin_default_language: "{{ catena_default_language | default('en') }}"
catena_admin_default_theme: "{{ catena_default_theme | default('system') }}"

# Per-inventory action extras + tiles. Same shape as the canonical
# `actions:` list in templates/actions.yml.j2 and the `tiles:` list the
# Go shell's Apps tab consumes (shell/apps).
catena_admin_extra_actions: []
catena_admin_extra_tiles: []

# Host payload paths. The catena-admin container mirrors its embedded host
# payload (all engines + lane scripts + units) into this bind-mounted dir at
# startup; roles/catena-admin then installs it into /usr/local/bin on EVERY
# converge (deploy.yml, ungated -- the payload is NOT license-gated). The
# installer is idempotent (install -m over each engine).
catena_admin_ee_payload_dir: "{{ catena_admin_stats_dir }}/ee-payload"
catena_admin_ee_payload_installer: "{{ catena_admin_ee_payload_dir }}/install-ee-payload.sh"
catena_admin_ee_payload_bin_dir: "{{ catena_admin_ee_payload_dir }}/bin"

# The host restore engine, installed by the payload above like every other
# engine. Declared here rather than at the call site because this role owns
# where the payload lands; site.yml's post-restore hook reads it.
catena_recovery_bin: /usr/local/bin/catena-recovery
# The host audit CLI, from the same payload. Two callers: the Business
# audit-export action, and the Community journal-seal check.
catena_admin_audit_bin: /usr/local/bin/catena-audit
# Where the restore machine persists progress. Under /var/lib/catena, NOT
# /etc: this is transient run state, and /etc is in the backup set -- a
# snapshot taken mid-restore would otherwise carry a half-finished restore's
# state into the next host that restored it. The panel reads both through the
# status action.
catena_recovery_state_file: /var/lib/catena/recovery.state
catena_recovery_history_file: /var/lib/catena/recovery.history

# The migration lane: the source side of a server-to-server move. A HOST
# process, not a container, because a migration stops docker on this server and
# the endpoint that puts it back has to still be answering afterwards. Installed
# by the same payload as every other engine, on every host and every edition.
#
# It listens on this host's tailnet address only, and it answers nothing until
# someone on this server arms it. The port is declared tailnet-only in the
# public-port registry below for the same reason Portainer's UI port is: defence
# in depth behind the bind, not instead of it.
catena_migrate_lane_bin: /usr/local/bin/catena-migrate-lane
catena_migrate_lane_port: 9040

# The same binary is also the TARGET side of a move, and that side keeps its own
# progress record. Separate files from the restore machine's on purpose: a
# migration DRIVES a restore, so the two would otherwise overwrite each other
# and the page watching the migration would read the restore's state as its own.
# Under /var/lib/catena for the same reason as the restore's -- transient run
# state, and /etc rides the backup set.
catena_migration_state_file: /var/lib/catena/migration.state
catena_migration_history_file: /var/lib/catena/migration.history

# EE-reserved HOST dispatch entries. The Go shell renders Business action
# BUTTONS at runtime from its compiled-in panels (audit, daily, ...) only
# under an active license, and dispatches each by NAME through the host
# forced-command runner. The runner's dispatch table is CE-rendered, so
# without a matching entry it rejects the action name; these entries authorize
# the known Business action names -> the host engines. The engines install on
# EVERY host at converge (the payload is not license-gated -- see deploy.yml),
# so the binaries are present even on a plain Community host; the license only
# controls which buttons the shell RENDERS. The dispatcher already runs as root
# (the forced-command pipes through sudo), so no extra sudoers is needed. These
# are appended to the host dispatch table + allow-list ONLY, never to the
# shell-read catalog (actions.yml), so no Business button ever appears on a
# Community host -- the panel contributes the button only while its license is
# active. Names + commands MUST match the panels' ActionSpec (catena-admin
# shell/panels/audit + shell/panels/daily); a drift means the shell dispatches a
# name the host cannot resolve.
catena_admin_ee_reserved_actions:
  # Payload (re-)install: refreshes the shell-synced host payload (engines +
  # lane scripts + units) from the ee-payload bind mount. The converge installs
  # the payload unconditionally (deploy.yml); this reserved action lets the
  # shell re-run the installer out of band after an image bump without a full
  # converge. Must match dailyplugin ee-install-engines ActionSpec.
  - name: ee-install-engines
    shell: "bash {{ catena_admin_ee_payload_installer }}"
  - name: daily-status
    shell: "/usr/local/bin/catena-daily status"
  - name: daily-run-now
    shell: "/usr/local/bin/catena-daily run"
  - name: audit-export
    shell: "{{ catena_admin_audit_bin }} export"
  # restore-report panel's on-demand restore drill. Runs the verify-hot
  # lane standalone (single-state), which rewrites verify-hot.json so the
  # Restore report panel refreshes with a fresh pass/fail + RTO. Name +
  # shell MUST match catena-admin restorereport/plugin.go's ActionSpec.
  - name: verify-backup
    shell: "/usr/local/bin/catena-daily step VERIFY_HOT"
  # Migration lane arming. The MECHANISM ships on every host (the lane binary
  # is part of the ungated payload, and the quiesce verbs it drives are
  # Community); what is licensed is the panel that opens a window, so these
  # authorize Business action names the same way the daily/audit entries do.
  #
  # Arming mints a pairing code and prints it ONCE. --json is for the panel,
  # which shows it to the person who armed it and never stores it; only an
  # argon2id hash goes to the state register, so a stolen backup carries no way
  # to join a migration.
  - name: catena-migrate-arm
    shell: "{{ catena_migrate_lane_bin }} arm -json"
  - name: catena-migrate-disarm
    shell: "{{ catena_migrate_lane_bin }} disarm"
  - name: catena-migrate-status
    shell: "{{ catena_migrate_lane_bin }} status"
  # The abort path, dispatched from THIS server when a move failed and its
  # applications have to come back. Deliberately the recovery engine and not
  # the lane: resuming is not a migration operation, it is the inverse of a
  # quiesce, and it has to work whether or not a window is still open.
  - name: catena-migrate-resume
    shell: "{{ catena_recovery_bin }} quiesce resume"
  # The TARGET side: this server pulling another one onto itself. Detached under
  # systemd-run for the same reason a restore is -- a move runs for hours and
  # must not die with the panel container that started it -- and --pipe hands the
  # request through on stdin, which is what keeps the source's pairing code out
  # of argv. A code on a command line is readable by every process on this box
  # for the whole migration.
  #
  # The request is {"source","code","preseed_passes"}. The address must be the
  # source's tailnet address and the binary refuses a NAME: the name of the
  # server being moved is about to point at this one, so a move that resolved it
  # could talk to itself and report that the source paused when nothing did.
  - name: catena-migrate-run
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      systemd-run --unit catena-migrate-run --collect --pipe
      {{ catena_migrate_lane_bin }} run --stdin
  # Read-only progress, in the same shape as the restore's: the migration page
  # reads these two files directly through its read-only mount, so this is the
  # hand-run and bench view rather than the polling path.
  - name: catena-migrate-run-status
    shell: >-
      printf 'state=%s\n'
      "$(head -n 1 {{ catena_migration_state_file }} 2>/dev/null || echo idle)";
      printf 'unit=%s\n'
      "$(systemctl is-active catena-migrate-run.service 2>/dev/null || true)";
      tail -n 40 {{ catena_migration_history_file }} 2>/dev/null || true
  # Forgetting a move, which is NOT undoing one. Clears this host's record and
  # touches neither the source, nor this host's data, nor DNS.
  - name: catena-migrate-run-reset
    shell: "{{ catena_migrate_lane_bin }} reset"
  # The way back after a failure past the point of no return, dispatched from
  # the TARGET (catena-migrate-resume above is the same act dispatched from the
  # source itself, for when the target is what failed). Deliberately a separate
  # action from the move: once the source is stopped, putting it back is a
  # decision, and a decision belongs to a person.
  - name: catena-migrate-resume-source
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_migrate_lane_bin }} resume-source --stdin
  # Multi-domain Cloudflare zone save (EE cloudflarezones plugin). The panel's
  # single-field form POSTs an opaque PAYLOAD: for an add it is the raw CF API
  # token the user typed (no browser JS/base64 needed, so it survives the strict
  # CSP); for a remove it is base64(JSON {op:remove,zone}) rendered server-side
  # by the plugin (the zone is known). The EE host binary reads PAYLOAD on
  # stdin, auto-detects add-token vs remove-JSON, verifies an add token grants
  # exactly one zone, derives zone/account_id, writes the 0644 panel projection,
  # and emits the store-write request piped to onbox_config (the sole store
  # writer). Name + shell MUST match catena-admin cloudflarezones/plugin.go's
  # ActionSpec. The binary exists on the host only under a Business license.
  - name: cloudflare-zones-save
    shell: >-
      echo "$PAYLOAD" |
      /usr/local/bin/catena-cloudflare-zones save |
      {{ catena_admin_onbox_config_path }} --dispatch-stdin
      --path {{ catena_admin_config_store_path }}

# --- 0b on-box config store (settings API) ----------------------------
# The Settings tab (shell/settings) reads/writes the on-box config
# store through the host dispatcher, since the unprivileged container cannot
# touch the root-owned 0600 store. host.yml installs onbox_config.py on the
# host; this CE-reserved dispatch action base64-decodes the container's opaque
# PAYLOAD (a {op,secrets,config} request) and pipes it to
# onbox_config.py --dispatch-stdin as root. Same reserved-action pattern as the
# EE entries: host dispatch table + allow-list ONLY, never a shell-catalog
# button (the Settings page is a first-class nav tab, not an Actions button).
catena_admin_config_store_path: "/etc/catena/config.json"
catena_admin_onbox_config_path: "/usr/local/bin/catena-onbox-config"
# Backup-password (restic) validate + rotate: USER_HELD, never a settings
# field, so these are deliberate button+confirm actions dispatched to the host,
# not part of a settings save. Same opaque-PAYLOAD pattern as catena-config.
catena_admin_restic_key_path: "/usr/local/bin/catena-restic-key"
catena_admin_ce_reserved_actions:
  - name: catena-config
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_admin_onbox_config_path }} --dispatch-stdin
      --path {{ catena_admin_config_store_path }}
  - name: catena-restic-validate
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_admin_restic_key_path }}
  - name: catena-restic-rotate
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_admin_restic_key_path }}
  # State register (COMMUNITY). The Apps tab records client intent here when
  # someone stops or starts an application, so a later restore knows not to
  # bring back something that was deliberately switched off. Portainer's own
  # status only covers intent up to the last backup; the register covers the
  # window after it, and it lives under /etc so it rides the snapshot.
  # PAYLOAD is base64(JSON {stack,desired,reason}) rendered server-side.
  - name: catena-register-set
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_recovery_bin }} register set-stdin
  - name: catena-register-get
    shell: "{{ catena_recovery_bin }} register get"
  # Quiesce (COMMUNITY -- the mechanism ships everywhere; only the migration
  # panel that drives it is licensed). pause freezes the application tier
  # before a snapshot; stop takes the host out of service; resume undoes
  # exactly what those two did and nothing else. Every one records what to
  # undo before it mutates, which is what makes an aborted migration
  # recoverable.
  - name: catena-quiesce-pause
    shell: "{{ catena_recovery_bin }} quiesce pause"
  - name: catena-quiesce-stop
    shell: "{{ catena_recovery_bin }} quiesce stop"
  - name: catena-quiesce-resume
    shell: "{{ catena_recovery_bin }} quiesce resume"
  - name: catena-quiesce-status
    shell: "{{ catena_recovery_bin }} quiesce status"
  # Journal tamper-evidence check (COMMUNITY). The common role turns Forward
  # Secure Sealing on for EVERY host, so being able to CHECK the seal is not a
  # paid feature -- only the panel that displays the trail is. With no argument
  # this verifies the journal's structure and prints the command that checks
  # the seals themselves; the verification key is deliberately not on the box,
  # because whoever holds it can re-seal an edited journal.
  - name: catena-audit-fss-verify
    shell: "{{ catena_admin_audit_bin }} fss-verify"
  # Data-scoped restore (COMMUNITY). Three actions, deliberately separate:
  # one that starts a restore, one that reports on it, and one that clears a
  # halted run. Folding the clear into the report would make a page refresh
  # destroy the state it was refreshing.
  #
  # The run goes through systemd-run rather than running inline, because the
  # dispatcher's SSH session is a child of the admin container's connection.
  # The restore does not stop the panel -- that is the whole design -- but a
  # panel that restarts for any other reason mid-restore would otherwise take
  # the restore down with it. --collect reaps the unit on exit so a second
  # attempt is not blocked by the first one's corpse, and --pipe hands the
  # request through on stdin so no part of it travels in argv.
  #
  # The request is {"snapshot","preseed","foreign"} as JSON. Note what it does
  # NOT carry: a path. Which repository to read is a BOOLEAN selecting one fixed
  # file, because a path would let the panel have an arbitrary file on this box
  # loaded as the environment of a root process.
  - name: catena-restore-run
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      systemd-run --unit catena-recovery-restore --collect --pipe
      {{ catena_recovery_bin }} restore -stdin
  # Read-only progress. The restore page reads the same two files directly
  # through its read-only mount of {{ catena_recovery_state_file | dirname }},
  # so this is the hand-run and bench view, not the panel's polling path -- a
  # restore runs for as long as the data takes, and an SSH round trip every few
  # seconds for an hour is not how to watch it.
  - name: catena-restore-status
    shell: >-
      printf 'state=%s\n'
      "$(head -n 1 {{ catena_recovery_state_file }} 2>/dev/null || echo idle)";
      printf 'unit=%s\n'
      "$(systemctl is-active catena-recovery-restore.service 2>/dev/null || true)";
      tail -n 40 {{ catena_recovery_history_file }} 2>/dev/null || true
  - name: catena-restore-reset
    shell: "{{ catena_recovery_bin }} restore -reset"
  # The snapshot list the restore page's picker renders. Read-only, JSON on
  # stdout. Two entries rather than one taking a flag from the panel: a
  # reserved action is a FIXED command, and "which repository" is exactly the
  # kind of thing that must not be caller-supplied.
  - name: catena-restore-snapshots
    shell: "{{ catena_recovery_bin }} snapshots"
  - name: catena-restore-snapshots-foreign
    shell: "{{ catena_recovery_bin }} snapshots -foreign"
  # The keyset for ANOTHER server's backup repository, for a machine that is
  # replacing one that is gone. PAYLOAD is base64(JSON
  # {op,repository,password,env}); the host writes it 0600 under /run, which is
  # tmpfs, so it does not survive a reboot. The engine allow-lists the variable
  # names it will accept -- the file is loaded into a root process's
  # environment, so an arbitrary name would be a way to set LD_PRELOAD for it.
  - name: catena-restore-credentials
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_recovery_bin }} credentials -stdin

# Cloudflare tunnel reserved actions (COMMUNITY -- the tunnel is a CE feature).
# The Settings panel dispatches these when the client saves a Cloudflare token:
#   - cloudflared-check validates a CANDIDATE token BEFORE persist. The token
#     arrives in the SSH env (CATENA_CF_CANDIDATE_TOKEN, whitelisted via sshd
#     AcceptEnv in host.yml) -- NOT in argv/$PAYLOAD -- so it never lands in
#     $SSH_ORIGINAL_COMMAND or any process argv/log; the action pipes it to the
#     engine on stdin. --token-stdin does not touch the store.
#   - cloudflared-sync runs the full converge after a valid token is persisted.
#     It exports the templated NON-SECRET pins (real image pin, ingress service,
#     tunnel name, network, stop-grace, probe counts) into the engine env so
#     production uses the pinned values, not the engine built-in defaults;
#     `env VAR=val ... cmd` preserves the rest of the session env, including
#     CATENA_MULTIDOMAIN_ENABLED forwarded on the sync dispatch (AcceptEnv). The
#     token is NOT passed -- the engine reads it from the on-box store.
# These are appended to catena_admin_ce_reserved_actions in catalog.yml ONLY in
# cloudflare access mode. The pins reference roles/cloudflare_tunnel defaults;
# `| default(...)` keeps the render safe if that role is not in scope (tailnet),
# where these actions are inert anyway.
catena_admin_cloudflared_reserved_actions:
  - name: cloudflared-check
    shell: >-
      printf '%s' "$CATENA_CF_CANDIDATE_TOKEN" |
      {{ cloudflared_sync_bin | default('/usr/local/bin/catena-cloudflared-sync') }}
      check --token-stdin
  - name: cloudflared-sync
    shell: >-
      env
      CLOUDFLARED_IMAGE={{ cloudflared_image | default('cloudflare/cloudflared:2026.7.1') }}
      CLOUDFLARED_INGRESS_SERVICE={{ cloudflared_ingress_service | default('http://catena-traefik:80') }}
      CLOUDFLARED_TUNNEL_NAME={{ cloudflared_tunnel_name | default(inventory_hostname) }}
      CATENA_NETWORK={{ catena_network_name | default('catena-network') }}
      CLOUDFLARED_STOP_GRACE={{ cloudflared_stop_grace | default('40s') }}
      CLOUDFLARED_PROBE_ATTEMPTS={{ cloudflared_probe_attempts | default(60) }}
      CLOUDFLARED_REPROBE_ATTEMPTS={{ cloudflared_reprobe_attempts | default(30) }}
      CLOUDFLARED_PROBE_DELAY_SECONDS={{ cloudflared_probe_delay_seconds | default(10) }}
      {{ cloudflared_sync_bin | default('/usr/local/bin/catena-cloudflared-sync') }} sync
