---
# roles/catena-admin -- per-VPS admin panel (the catena-admin Go shell).
#
# The role manages the container's HOST-SIDE state (host.yml + catalog.yml)
# AND deploys the container itself as a Portainer stack (deploy.yml, pulling
# catena_admin_image). See README.md.

# --- Hostname ---------------------------------------------------------
# The admin panel is served at dash.<zone> by default. Override the
# subdomain via CATENA_ADMIN_SUBDOMAIN in the inventory's .env.
catena_admin_subdomain: "{{ lookup('dotenv', 'CATENA_ADMIN_SUBDOMAIN', default='dash') }}"
catena_admin_hostname: "{{ catena_admin_subdomain }}.{{ cloudflare_zone }}"

# --- Container image + port -------------------------------------------
# The PUBLIC catena-admin image the converge deploys (deploy.yml). Clients PULL
# it at converge time -- they never build on the client box (no Go toolchain on
# a client VPS). Published by the private catena-admin repo's publish-image.yml
# on a v* tag from main; the IMAGE is public (anonymous pull, no registry
# credential) while the Business feature set inside it is gated at runtime by
# the licence check. The bench does not use it (it builds
# local/catena-admin:bench on the VPS and passes that tag).
#
# catena_admin_image lives in roles/common/defaults: roles/payload extracts the
# host engines from the same image at role 5.5, long before this role's defaults
# are in scope, and the two must agree. Which release it names, and that
# release's digest, are resolved from the registry once per converge by
# playbooks/tasks/load_onbox_config.yml. See the block there.

# The digest roles/payload refuses to extract anything from unless it matches.
# One value drives both halves: the engines and the shell come from one image.
catena_admin_image_digest: "{{ catena_payload_image_digest | default('') }}"

# Deploy the catena-admin container FROM the converge (deploy.yml). Production
# pulls the published GHCR image at converge time. The test bench builds the
# image on the VPS and deploys it OUT OF BAND (stage-2.6, build-on-host per the
# resolved 1z decision) -- the published GHCR image does not exist there -- so
# the bench sets CATENA_ADMIN_DEPLOY_FROM_CONVERGE=false to skip the converge
# deploy. Production leaves it true.
catena_admin_deploy_from_converge: >-
  {{ lookup('env', 'CATENA_ADMIN_DEPLOY_FROM_CONVERGE', default='true') | bool }}

# --- tier-1 swarm service ---------------------------------------------
# The panel is created directly with `docker service create`, not through
# Portainer's stack API. It holds the key that drives Portainer, so being
# deployed BY Portainer meant a broken Portainer took down the one tool that
# could repair it -- and the post-restore path that needs the panel runs
# precisely when Portainer is the thing that did not come back.
#
# catena_admin_service_name lives in roles/common/defaults for the same reason
# the image does: roles/payload reads it at role 5.5 to ask swarm which image
# this service runs, and this role's defaults are not in scope that early. See
# the block there, including why the name is load-bearing for oauth2_proxy.

# Swarm secrets for the three values that must not travel in argv: the key
# that signs native-login session cookies, the Healthchecks read key, and
# the Portainer API key. Each real name gets the value's hash appended
# (filter_plugins/catena_admin_service.py secret_name) because swarm secrets
# are immutable -- a fixed name would make every rotation a silent no-op.
#
# The target name doubles as the env var: <KEY>_FILE points at
# /run/secrets/<target>, which catena-admin's secretenv.go reads.
catena_admin_secret_specs:
  - base: catena_admin_session_key
    target: CATENA_ADMIN_SESSION_KEY
    value: "{{ catena_admin_session_key }}"
  - base: catena_admin_healthchecks_key
    target: HEALTHCHECKS_API_KEY_READONLY
    value: "{{ healthchecks_api_key_readonly | default('') }}"
  - base: catena_admin_portainer_key
    target: PORTAINER_API_KEY
    value: "{{ portainer_api_key | default('') }}"
  # The realm service account behind the People panel. Absent on a host whose
  # converge predates it, which the panel renders as "no directory credential
  # yet" rather than as an error -- an empty secret is a state, not a fault.
  - base: catena_admin_keycloak_secret
    target: KEYCLOAK_ADMIN_CLIENT_SECRET
    value: "{{ catena_admin_panel_client_secret | default('') }}"
  # The path segment in the App Templates URL Portainer fetches. A secret
  # because the catalog it guards carries every client app's credentials, and
  # a secret rather than an --env for the same reason as the four above: an
  # --env value is in the host's process table for the length of the create.
  - base: catena_admin_marketplace_token
    target: CATENA_MARKETPLACE_TOKEN
    value: "{{ catena_marketplace_token | default('') }}"

# Supplementary group. The recovery export dir is 0750 root:1000 (gid 1000
# is the shared recovery-downloads group) and the image runs USER nonroot,
# so without this the Recovery tab lists nothing even when the host wrote a
# recovery zip.
catena_admin_supplementary_gid: "1000"

# Where a secret's bytes are staged for `docker secret create`. Root-owned
# 0600 and removed in the same block that writes it.
catena_admin_secret_staging_path: "/root/.catena-admin-secret"

# Hardening subset, reconciled by swarm_service_drift on every converge.
#
# No health_cmd HERE, on purpose. The image is distroless, and swarm's
# --health-cmd is always run as `/bin/sh -c`, which it cannot. The healthcheck
# is the image's own HEALTHCHECK in exec form (`catena-admin health`, probing
# its /health), which swarm honours without a shell. swarm_service_drift only
# touches the healthcheck when health_cmd is in this spec, so the image's
# survives every converge -- and `docker service ls` reading 1/1 means the
# listener answers, not merely that the process started.
#
# stop-first for the same reason as Portainer: the UI port is published
# mode=host, so two tasks cannot hold it at once and start-first would have
# the new task fail its bind while the old one still listens.
catena_admin_limit_memory: "512m"
catena_admin_reserve_memory: "128m"
catena_admin_stop_grace_period: "20s"
catena_admin_update_failure_action: "pause"
catena_admin_update_monitor: "30s"
catena_admin_update_max_failure_ratio: 0
catena_admin_update_order: "stop-first"

# Placement. It bind-mounts node-LOCAL paths (the audit chain, the synced
# payload, the SSH runner key), so it must land on the node that has them,
# and it reaches the host dispatch, which is that node's.
catena_admin_constraints:
  - "node.role==manager"
  - "node.labels.catena.role==data"

catena_admin_desired:
  image: "{{ catena_admin_image }}"
  constraints: "{{ catena_admin_constraints }}"
  limit_memory: "{{ catena_admin_limit_memory }}"
  reserve_memory: "{{ catena_admin_reserve_memory }}"
  stop_grace_period: "{{ catena_admin_stop_grace_period }}"
  update_failure_action: "{{ catena_admin_update_failure_action }}"
  update_monitor: "{{ catena_admin_update_monitor }}"
  update_max_failure_ratio: "{{ catena_admin_update_max_failure_ratio }}"
  update_order: "{{ catena_admin_update_order }}"

# Port the Go shell listens on inside the container (CATENA_ADMIN_ADDR
# in the service env; oauth2_proxy upstreams to catena-admin:8000).
# catena_admin_internal_port lives in roles/common/defaults for the same reason
# catena_admin_service_name does: roles/portainer builds the App Templates URL
# out of the pair, and cannot see this role's defaults.

# Native-login listener inside the container, published on the host (tailnet-
# only) so the panel is reachable at http://<tailnet-ip>:<catena_admin_ui_port>
# without the Cloudflare/oauth2-proxy edge -- the same pattern as Portainer's
# UI port. Firewalled by the public-ports registry (host.yml fragment).
catena_admin_direct_port: 8001
catena_admin_ui_port: "{{ lookup('dotenv', 'CATENA_ADMIN_UI_PORT', default='9010') }}"

# How long the converge waits for a newly-created service to report a Running
# task before giving up and printing what swarm said. Five minutes: long enough
# for a cold image pull on a slow link, short enough that a task which will
# never start is reported rather than waited on.
catena_admin_converge_retries: 60
catena_admin_converge_delay: 5

# --- Host-side runner -------------------------------------------------
# Dedicated SSH account the admin container uses to dispatch actions on
# the host. Forced-command pinned to the dispatcher script below; the
# dispatcher's allow-list is rendered from the action catalog at
# converge time.
catena_admin_runner_user: "catena-admin-runner"
catena_admin_runner_home: "/home/catena-admin-runner"

# Env vars the container may push into a root-run host action, for values
# that must not appear in argv or the process table. Consumed TWICE by
# tasks/host.yml -- sshd's AcceptEnv and the sudoers env_keep -- because the
# dispatch crosses both, and a name missing from either arrives as an empty
# string rather than an error. Names must match what the panel sends
# (catena-admin shell/web/cloudflared.go + shell/web/backupendpoint.go).
catena_admin_dispatch_env_passthrough:
  - X_FORWARDED_EMAIL
  - CATENA_CF_CANDIDATE_TOKEN
  - CATENA_BACKUP_CANDIDATE_REPO
  - CATENA_BACKUP_CANDIDATE_ACCESS_KEY
  - CATENA_BACKUP_CANDIDATE_SECRET_KEY

# The catena-admin container runs as the distroless `nonroot` user
# (uid/gid 65532), set by `USER nonroot:nonroot` in the repo-root Dockerfile
# -- NOT uid 1000. Host-side files the container reads through its read-only
# bind mounts (the SSH runner private key, known_hosts, ssh config) must be
# owned by this uid, and the 0700 ssh dir must be owned by it, or the Go
# shell's SSH action runner fails every dispatch with
# "known_hosts load failed: ... permission denied". Keep in lockstep with
# the Dockerfile's USER.
catena_admin_container_uid: "{{ catena_container_uid }}"
catena_admin_container_gid: "{{ catena_container_gid }}"

# Host paths -- the bind-mount targets the admin compose expects. Keep
# these in sync with the compose file when you rename either.
catena_admin_host_ssh_dir: "/etc/catena/admin-ssh"
catena_admin_dispatcher_path: "/usr/local/sbin/catena-admin-runner"
catena_admin_allowed_actions_path: "/etc/catena/admin-allowed.yaml"
catena_admin_dispatch_actions_path: "/etc/catena/admin-actions"
# Where the PAYLOAD drops dispatch arms the converge does not know about. The
# converge creates the directory root-owned and reads nothing from it, the same
# one-way dependency /etc/catena/post-restore.d has: the converge provides the
# moment, the image subscribes to it.
#
# Base-first: the rendered case arms are tried first and win outright, so a
# drop-in can only ADD a name. It also can never add an env var -- AcceptEnv and
# sudoers env_keep stay converge-owned, deliberately.
catena_admin_actions_overlay_dir: "/etc/catena/admin-actions.d"
catena_admin_actions_yml_path: "/etc/catena/admin-actions.yml"
catena_admin_actions_extra_yml_path: "/etc/catena/admin-actions.extra.yml"
catena_admin_extra_tiles_path: "/etc/catena/extra-tiles.yml"
# Host dir where run-backup.sh + gatus-sync.py write their summary JSON
# files (backup-stats.json, gatus-summary.json, healthchecks-summary.json).
# Bind-mounted read-only into the admin container; the admin's stats
# reader picks up the files unchanged. Matches roles/backup defaults'
# backup_stats_dir; do not move without updating that role + the
# post-restore.needed marker contract (test_restore_option_a).
catena_admin_stats_dir: "/var/lib/catena"
catena_admin_state_dir: "/var/lib/catena-admin"

# The audit.db SQLite Online-Backup quiesce hooks that ride this role
# in the Business edition are NOT part of Community: the audit module
# is license-gated, so no audit.db exists here, and the quiesce.d hooks
# are consumed by the (Business-only) catena-daily orchestrator.

# Source-of-truth action catalog. Rendered by catalog.yml into the
# host dispatch table + the catalog the Go shell reads at runtime.
# Role-relative template; the only Jinja marker is `ansible_managed`.
catena_admin_actions_source: "{{ role_path }}/templates/actions.yml.j2"

# Default theme rendered into the admin container's env. Inventory override
# via catena_default_theme. Language has no install-time default: the panel
# always starts in English, and a visitor can switch to French any time via
# the header toggle (shell/i18n) -- no inventory field for it.
catena_admin_default_theme: "{{ catena_default_theme | default('system') }}"

# Per-inventory action extras + tiles. Same shape as the canonical
# `actions:` list in templates/actions.yml.j2 and the `tiles:` list the
# Go shell's Apps tab consumes (shell/apps).
catena_admin_extra_actions: []
catena_admin_extra_tiles: []

# Host payload paths. roles/payload fills this dir from the image and installs
# its contents into /usr/local/bin, right after roles/docker. The catena-admin
# container ALSO mirrors its embedded payload here at startup, which is what
# keeps the panel's ee-install-engines action (defaults below) able to reinstall
# the engines on demand without a converge. Both writers, one directory -- see
# roles/payload/README.md on the ownership dance that makes that safe.
catena_admin_ee_payload_dir: "{{ catena_admin_stats_dir }}/ee-payload"
catena_admin_ee_payload_installer: "{{ catena_admin_ee_payload_dir }}/install-ee-payload.sh"

# The scheduling owner. Installed with the rest of the ungated payload; it
# reads /etc/catena/config.json and is the only thing that enables a timer,
# writes a timer OnCalendar drop-in, or renders the restic retention file.
catena_schedule_bin: /usr/local/bin/catena-schedule

# The offsite-copy owner. Installed with the rest of the ungated payload; it
# reads and writes the `offsite_copies` list in /etc/catena/config.json and is
# the binary the lane's systemd unit runs.
catena_offsite_bin: /usr/local/bin/catena-offsite-copy

# Per-host configuration for the daily orchestrator chain.
#
# catena-daily.service and catena-daily-resume.service both declare
# EnvironmentFile=/etc/catena/daily.env with no leading dash, so systemd
# fails the unit outright when the file is missing -- and until now NOTHING
# wrote it. Not this repo, not catena-admin, not ops. The scheduled Business
# chain could not start on any real host; only the test bench had one, because
# the bench writes its own copy.
#
# It belongs to this role for the same reason the payload install does: it is
# per-host configuration, and the converge is what knows the host. The values
# are paths and toggles, not secrets -- the chain reads its credentials from
# the config store like everything else.
catena_daily_env_path: /etc/catena/daily.env

# Per-host configuration for the two managed-update lanes, and the spec list
# the container lane bumps from. Same story as daily.env above, three more
# times: catena-auto-update{,@,-resume}.service and
# catena-stack-update-managed.service all declare their EnvironmentFile with no
# leading dash, nothing rendered them, and the engine's --specs-file default
# pointed at a path nothing wrote. Both lanes were unstartable on a real host
# and neither showed it, because the bench ships its own copies.
#
# Same owner as daily.env for the same reason: this role installs the payload,
# so it is the role that knows the host these files describe.
catena_auto_update_env_path: /etc/catena/auto-update.env
catena_stack_update_env_path: /etc/catena/stack-update.env
catena_managed_services_path: /etc/catena/managed-services.json

# The container-bump engine, which also carries the `self-update` verb that
# moves the panel itself.
catena_admin_stack_update_bin: /usr/local/bin/catena-stack-update-managed

# Where the self-update writes its progress. The panel cannot be streamed to
# during its own update -- the operation kills the process that would do the
# streaming -- so it polls this once it is back, the same shape as the restore
# and migration state files. /var/lib rather than /etc for the same reason as
# those: transient run state, and /etc rides the backup set.
catena_admin_selfupdate_state_file: /var/lib/catena/selfupdate.state

# Where every run of the update engine keeps an account of itself.
#
# The state file above is one overwritable line for the panel to poll, and it is
# gone the moment anything else runs. Standard output is no better a record: the
# self-update runs as a transient systemd unit launched deliberately without
# --pipe, so what survived a failure was a journal entry for a unit that no
# longer exists, on hosts where journald is often volatile. A failed update is
# the thing this engine most has to be answerable for.
#
# The engine defaults to this same path, so a run that reaches the host any
# other way lands in one file rather than two.
catena_admin_stack_update_log_file: /var/lib/catena/stack-update.log

# The self-update's OWN health baseline. Separate from the container lane's
# stack-update-baseline.json: both files hold "what healthy looked like before
# the thing I am about to do", so sharing one means a panel update overwrites
# the baseline a container bump is still holding, and the diff that decides
# whether to roll back is taken against the wrong moment.
catena_admin_selfupdate_baseline_file: /var/lib/catena/selfupdate-baseline.json

# What an apply run does. security-only with a reboot when the packages ask
# for one is the shipped posture; the chain drives this lane behind its own
# backup and cold-verify gates.
catena_auto_update_mode: security
catena_auto_update_reboot: if-required
# Zero retries after a rollback: a package set that regressed once regresses
# again, and an apply-rollback loop is worse than a pending update.
catena_auto_update_max_rollback_retries: 0
# Abort before apt writes anything below this much free space (3 GiB).
catena_auto_update_preflight_min_bytes: 3221225472
catena_auto_update_healthcheck_url: ""
# Tier-2 provider disk snapshot. none is a no-op; see the template for why the
# OVH credentials are blank.
catena_auto_update_provider: none
catena_auto_update_provider_ovh_region: ovh-ca
catena_auto_update_provider_ovh_vps_name: ""

# Container-bump gates. Seven days of tag age because a withdrawn upstream
# release is usually withdrawn within days and this lane runs unattended; two
# minutes of stabilisation before the next service is bumped.
catena_stack_update_min_tag_age_days: 7
catena_stack_update_stabilize_seconds: 120
catena_stack_update_cve_severity: "HIGH,CRITICAL"
# ON-BOX base: the update lane is a unit running on the host, so it addresses
# Portainer locally. portainer_api_base carries ansible_host, which is where
# the CONTROLLER reaches the box -- an address that changes across converges
# and after a restore, and that this file would then hold forever.
catena_stack_update_portainer_api_base: "{{ portainer_api_base_onbox | default('') }}"

# Health gate for the pre-update state. Blank on a host without Gatus, which
# is a skip rather than a failure: the chain cannot ask whether the host is
# healthy, so it does not pretend to have asked.
catena_daily_gatus_api_url: "{{ gatus_api_url | default('') }}"

# Whether the chain takes ownership of Debian's apt-daily-upgrade.timer. True
# is the shipped posture: the chain applies security updates behind its own
# backup and verify gates, and two things applying updates is one too many.
catena_daily_manage_apt_timer: true

# The host restore engine, installed by the payload above like every other
# engine. Declared here rather than at the call site because this role owns
# where the payload lands; site.yml's post-restore hook reads it.
catena_recovery_bin: /usr/local/bin/catena-recovery
# The host audit CLI, from the same payload. Two callers: the Business
# audit-export action, and the Community journal-seal check.
catena_admin_audit_bin: /usr/local/bin/catena-audit
# Where the restore machine persists progress. Under /var/lib/catena, NOT
# /etc: this is transient run state, and /etc is in the backup set -- a
# snapshot taken mid-restore would otherwise carry a half-finished restore's
# state into the next host that restored it. The panel reads both through the
# status action.
catena_recovery_state_file: /var/lib/catena/recovery.state
catena_recovery_history_file: /var/lib/catena/recovery.history

# The migration lane: the source side of a server-to-server move. A HOST
# process, not a container, because a migration stops docker on this server and
# the endpoint that puts it back has to still be answering afterwards. Installed
# by the same payload as every other engine, on every host and every edition.
#
# It listens on this host's tailnet address only, and it answers nothing until
# someone on this server arms it. The port is declared tailnet-only in the
# public-port registry below for the same reason Portainer's UI port is: defence
# in depth behind the bind, not instead of it.
catena_migrate_lane_bin: /usr/local/bin/catena-migrate-lane
catena_migrate_lane_port: 9040

# The same binary is also the TARGET side of a move, and that side keeps its own
# progress record. Separate files from the restore machine's on purpose: a
# migration DRIVES a restore, so the two would otherwise overwrite each other
# and the page watching the migration would read the restore's state as its own.
# Under /var/lib/catena for the same reason as the restore's -- transient run
# state, and /etc rides the backup set.
catena_migration_state_file: /var/lib/catena/migration.state
catena_migration_history_file: /var/lib/catena/migration.history

# EE-reserved HOST dispatch entries. The Go shell renders Business action
# BUTTONS at runtime from its compiled-in panels (audit, daily, ...) only
# under an active license, and dispatches each by NAME through the host
# forced-command runner. The runner's dispatch table is CE-rendered, so
# without a matching entry it rejects the action name; these entries authorize
# the known Business action names -> the host engines. The engines install on
# EVERY host at converge (the payload is not license-gated -- see deploy.yml),
# so the binaries are present even on a plain Community host; the license only
# controls which buttons the shell RENDERS. The dispatcher already runs as root
# (the forced-command pipes through sudo), so no extra sudoers is needed. These
# are appended to the host dispatch table + allow-list ONLY, never to the
# shell-read catalog (actions.yml), so no Business button ever appears on a
# Community host -- the panel contributes the button only while its license is
# active. Names + commands MUST match the panels' ActionSpec (catena-admin
# shell/panels/audit + shell/panels/daily); a drift means the shell dispatches a
# name the host cannot resolve.
catena_admin_ee_reserved_actions:
  # Payload (re-)install: refreshes the host payload (engines + lane scripts +
  # units) from the image the panel is running. The converge installs the
  # payload unconditionally (deploy.yml); this reserved action lets the shell
  # re-run the install out of band after an image bump without a full converge.
  # Must match dailyplugin ee-install-engines ActionSpec.
  #
  # It runs the ENGINE, not the installer script under
  # {{ catena_admin_ee_payload_dir }}. That directory is chowned to the
  # container's uid so the shell's startup mirror can write it, so a root
  # dispatch pointed at a script inside it made the panel -- which is built
  # with no root and no docker socket for exactly this reason -- the thing
  # choosing what root executes. The verb does its own docker create + docker
  # cp out of the running image into a root-owned 0700 stage dir, so the image
  # is the trust root and the mirror is a convenience the container keeps for
  # itself.
  - name: ee-install-engines
    shell: "{{ catena_admin_stack_update_bin }} install-payload"
  # The two self-update entries used to sit here. They are Community and live
  # in the shell-read catalog now (catena_admin_ce_selfupdate_actions below):
  # a panel nobody has patched is the same shape of problem as a backup nobody
  # has verified, and withholding the mechanism leaves a free-edition host
  # running whatever its install day happened to ship.
  # Twelve Business actions moved OUT of this list and into the payload's own
  # dispatch drop-in (catena-admin payload/actions.d/10-business.sh): the four
  # catena-daily / catena-audit ones and the eight migration-lane ones.
  #
  # Every command they ran was a binary the PAYLOAD installs, at a path the
  # payload chose, so this list was an authorization record for names the
  # converge does not own and cannot verify -- and a panel that gained an
  # action had to wait for a converge before the host would accept it. The
  # dispatcher offers any name this table does not carry to
  # {{ catena_admin_actions_overlay_dir }} before refusing it, and the payload
  # installer records the names it added in release.json's payload_actions so
  # the panel does not raise a converge-required banner for them.
  #
  # What stayed: ee-install-engines, because the action that REINSTALLS the
  # payload cannot depend on the payload having installed correctly, and
  # cloudflare-zones-save, whose shell pipes through a catena-ce binary at a
  # catena-ce path.
  # Multi-domain Cloudflare zone save (EE cloudflarezones plugin). The panel's
  # single-field form POSTs an opaque PAYLOAD: for an add it is the raw CF API
  # token the user typed (no browser JS/base64 needed, so it survives the strict
  # CSP); for a remove it is base64(JSON {op:remove,zone}) rendered server-side
  # by the plugin (the zone is known). The EE host binary reads PAYLOAD on
  # stdin, auto-detects add-token vs remove-JSON, verifies an add token grants
  # exactly one zone, derives zone/account_id, writes the 0644 panel projection,
  # and emits the store-write request piped to onbox_config (the sole store
  # writer). Name + shell MUST match catena-admin cloudflarezones/plugin.go's
  # ActionSpec. The binary exists on the host only under a Business license.
  - name: cloudflare-zones-save
    shell: >-
      echo "$PAYLOAD" |
      /usr/local/bin/catena-cloudflare-zones save |
      {{ catena_admin_onbox_config_path }} --dispatch-stdin
      --path {{ catena_admin_config_store_path }}

# --- 0b on-box config store (settings API) ----------------------------
# The Settings tab (shell/settings) reads/writes the on-box config
# store through the host dispatcher, since the unprivileged container cannot
# touch the root-owned 0600 store. host.yml installs onbox_config.py on the
# host; this CE-reserved dispatch action base64-decodes the container's opaque
# PAYLOAD (a {op,secrets,config} request) and pipes it to
# onbox_config.py --dispatch-stdin as root. Same reserved-action pattern as the
# EE entries: host dispatch table + allow-list ONLY, never a shell-catalog
# button (the Settings page is a first-class nav tab, not an Actions button).
catena_admin_config_store_path: "/etc/catena/config.json"
catena_admin_onbox_config_path: "/usr/local/bin/catena-onbox-config"
# Backup-password (restic) validate + rotate: USER_HELD, never a settings
# field, so these are deliberate button+confirm actions dispatched to the host,
# not part of a settings save. Same opaque-PAYLOAD pattern as catena-config.
catena_admin_restic_key_path: "/usr/local/bin/catena-restic-key"
# The backup-endpoint (S3 repo) candidate-check binary. Part of the ungated
# host payload like catena-cloudflared-sync -- roles/payload extracts it from
# the catena-admin image (payload/cmd/catena-backup-check) via the blanket
# `for f in bin/*` install in install-ee-payload.sh, so no per-binary listing
# is needed here.
catena_admin_backup_check_bin: "/usr/local/bin/catena-backup-check"
catena_admin_ce_reserved_actions:
  - name: catena-config
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_admin_onbox_config_path }} --dispatch-stdin
      --path {{ catena_admin_config_store_path }}
  # Scheduling (COMMUNITY). The backup lane is a Community feature, so a
  # client on the free edition has to be able to say when it runs -- and
  # nothing is scheduled until they do.
  #
  # Three actions rather than one taking a verb: the dispatch table maps a
  # NAME to a fixed shell line, and that is what stops the container choosing
  # which command runs as root. A single entry reading the verb out of PAYLOAD
  # would hand that choice back.
  #
  # validate and set take their input on stdin. An OnCalendar value is
  # punctuation by design -- spaces, commas, stars, slashes -- so the field
  # whose whole purpose is to accept punctuation is the last one to
  # interpolate into a command line.
  - name: catena-schedule-show
    shell: "{{ catena_schedule_bin }} show"
  - name: catena-schedule-validate
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_schedule_bin }} validate
  - name: catena-schedule-set
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_schedule_bin }} set
  # Offsite copies (COMMUNITY on the CONFIGURATION side). The lane that runs
  # them is licensed; being able to say what this host would copy, and to
  # read back what it holds, is not -- a client whose licence lapsed must
  # still be able to see and correct the credentials pointing at their own
  # bucket.
  #
  # The list rides PAYLOAD like every other write here. It carries
  # object-store credentials and repository URLs, and neither has any
  # business on a command line.
  - name: catena-offsite-show
    shell: "{{ catena_offsite_bin }} show"
  - name: catena-offsite-set
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_offsite_bin }} set
  - name: catena-restic-validate
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_admin_restic_key_path }}
  - name: catena-restic-rotate
    shell: >-
      echo "$PAYLOAD" | base64 -d | {{ catena_admin_restic_key_path }}
  # Updating the panel itself (COMMUNITY). Withholding this leaves a
  # free-edition host running whatever its install day happened to ship,
  # forever -- a panel nobody has patched is the same shape of problem as a
  # backup nobody has verified. What is licensed is the nightly chain that
  # decides WHEN, not the ability to update at all.
  #
  # Detached under systemd-run for the obvious reason -- the operation kills
  # the container that asked for it -- and WITHOUT --pipe, unlike the restore
  # and migrate actions: there is nothing left to stream to. The panel polls
  # {{ catena_admin_selfupdate_state_file }} once it is back, the way the
  # restore page reads the recovery state file.
  #
  # Same /run/catena.lock every other lane takes, and for the same reason: a
  # panel-dispatched update that ran alongside the nightly chain would race its
  # health baseline, and a baseline captured mid-roll is a baseline that
  # excuses the regression it was meant to catch. -w 3600 sits under the
  # unit-less systemd-run default, so the wait is reachable.
  #
  # The target image arrives base64 through $PAYLOAD like the other dispatched
  # requests. It is not a secret -- an image reference is public by
  # construction -- but the encoding is what keeps a value with a space in it
  # from becoming two arguments. Which image is ACCEPTABLE is the host's
  # decision, not this line's: the engine refuses any reference whose
  # repository differs from the one the service is running.
  #
  # This is NOT in managed-services.json, deliberately: the generic bump path
  # is `docker service update --image` and nothing else, and for catena-admin
  # that is half an update. The host engines come out of the same image and
  # have to be reinstalled from the new one in the same operation.
  #
  # Reserved rather than catalogued: the dispatch table + allow-list get it,
  # the shell-read catalog does not. The Panel-updates page is a first-class
  # surface with a version field and a confirmation, not an Actions button
  # whose argument would be a base64 blob typed by hand.
  - name: catena-admin-self-update
    shell: >-
      systemd-run --unit catena-admin-selfupdate --collect
      --setenv=SELF_UPDATE_IMAGE="$(echo "$PAYLOAD" | base64 -d)"
      --setenv=SELF_UPDATE_STATE_FILE={{ catena_admin_selfupdate_state_file }}
      --setenv=SELF_UPDATE_BASELINE_FILE={{ catena_admin_selfupdate_baseline_file }}
      --setenv=STACK_UPDATE_LOG_FILE={{ catena_admin_stack_update_log_file }}
      --setenv=HOME=/var/lib/catena/restic-home
      --setenv=XDG_CACHE_HOME=/var/lib/catena/restic-cache
      /usr/bin/flock -w 3600 /run/catena.lock
      {{ catena_admin_stack_update_bin }} self-update
  # Read-only progress, in the same shape as the restore's and the migration's.
  - name: catena-admin-self-update-status
    shell: >-
      printf 'state=%s\n'
      "$(head -n 1 {{ catena_admin_selfupdate_state_file }} 2>/dev/null || echo idle)";
      printf 'unit=%s\n'
      "$(systemctl is-active catena-admin-selfupdate.service 2>/dev/null || true)";
      printf 'image=%s\n'
      "$(docker service inspect --format '{{ '{{' }}.Spec.TaskTemplate.ContainerSpec.Image{{ '}}' }}' {{ catena_admin_service_name }} 2>/dev/null || true)";
      tail -n 40 {{ catena_admin_stack_update_log_file }} 2>/dev/null | sed 's/^/log=/' || true
  # Backup-endpoint (S3) candidate check (COMMUNITY -- the backup lane is a
  # Community feature). The Settings panel validates a CANDIDATE repository
  # string + access/secret key BEFORE persisting them, the same pre-persist
  # shape as cloudflared-check below: a dispatch/transport failure or a
  # rejected candidate must never let a save go through. The three values ride
  # the SSH Runner's env map -- CATENA_BACKUP_CANDIDATE_REPO,
  # *_ACCESS_KEY, *_SECRET_KEY (whitelisted via sshd AcceptEnv in host.yml) --
  # NOT $PAYLOAD/argv, so they never land in $SSH_ORIGINAL_COMMAND or any host
  # process argv. jq (baseline-installed on every host, roles/common) folds
  # them into the {"repo","access_key","secret_key"} JSON
  # payload/cmd/catena-backup-check expects on stdin -- shell.web.
  # backupendpoint.go's BackupEndpointCandidateRepoEnv/*AccessKeyEnv/
  # *SecretKeyEnv in catena-admin MUST match these three names exactly, or the
  # candidate silently arrives empty.
  - name: backup-endpoint-check
    shell: >-
      jq -n
      --arg repo "$CATENA_BACKUP_CANDIDATE_REPO"
      --arg access_key "$CATENA_BACKUP_CANDIDATE_ACCESS_KEY"
      --arg secret_key "$CATENA_BACKUP_CANDIDATE_SECRET_KEY"
      '{repo:$repo,access_key:$access_key,secret_key:$secret_key}' |
      {{ catena_admin_backup_check_bin }}
  # State register (COMMUNITY). The Apps tab records client intent here when
  # someone stops or starts an application, so a later restore knows not to
  # bring back something that was deliberately switched off. Portainer's own
  # status only covers intent up to the last backup; the register covers the
  # window after it, and it lives under /etc so it rides the snapshot.
  # PAYLOAD is base64(JSON {stack,desired,reason}) rendered server-side.
  - name: catena-register-set
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_recovery_bin }} register set-stdin
  - name: catena-register-get
    shell: "{{ catena_recovery_bin }} register get"
  # Quiesce (COMMUNITY -- the mechanism ships everywhere; only the migration
  # panel that drives it is licensed). pause freezes the application tier
  # before a snapshot; stop takes the host out of service; resume undoes
  # exactly what those two did and nothing else. Every one records what to
  # undo before it mutates, which is what makes an aborted migration
  # recoverable.
  - name: catena-quiesce-pause
    shell: "{{ catena_recovery_bin }} quiesce pause"
  - name: catena-quiesce-stop
    shell: "{{ catena_recovery_bin }} quiesce stop"
  - name: catena-quiesce-resume
    shell: "{{ catena_recovery_bin }} quiesce resume"
  - name: catena-quiesce-status
    shell: "{{ catena_recovery_bin }} quiesce status"
  # Journal tamper-evidence check (COMMUNITY). The common role turns Forward
  # Secure Sealing on for EVERY host, so being able to CHECK the seal is not a
  # paid feature -- only the panel that displays the trail is. With no argument
  # this verifies the journal's structure and prints the command that checks
  # the seals themselves; the verification key is deliberately not on the box,
  # because whoever holds it can re-seal an edited journal.
  - name: catena-audit-fss-verify
    shell: "{{ catena_admin_audit_bin }} fss-verify"
  # Data-scoped restore (COMMUNITY). Three actions, deliberately separate:
  # one that starts a restore, one that reports on it, and one that clears a
  # halted run. Folding the clear into the report would make a page refresh
  # destroy the state it was refreshing.
  #
  # The run goes through systemd-run rather than running inline, because the
  # dispatcher's SSH session is a child of the admin container's connection.
  # The restore does not stop the panel -- that is the whole design -- but a
  # panel that restarts for any other reason mid-restore would otherwise take
  # the restore down with it. --collect reaps the unit on exit so a second
  # attempt is not blocked by the first one's corpse, and --pipe hands the
  # request through on stdin so no part of it travels in argv.
  #
  # The request is {"snapshot","preseed","foreign"} as JSON. Note what it does
  # NOT carry: a path. Which repository to read is a BOOLEAN selecting one fixed
  # file, because a path would let the panel have an arbitrary file on this box
  # loaded as the environment of a root process.
  #
  # --setenv is not optional. A transient systemd unit starts with a CLEAN
  # environment, and restic refuses to run without a cache location:
  #   unable to open cache: unable to locate cache directory:
  #   neither $XDG_CACHE_HOME nor $HOME are defined
  # Every other action inherits the dispatcher's environment (sudo supplies
  # HOME), which is why only the systemd-run ones need this and why the fault
  # was invisible until wizard_restore_smoke first reached stage 4.
  # The values MATCH catena-backup.service (roles/backup/templates/
  # catena-backup.service.j2) so both callers share one warm cache rather than
  # each keeping its own; test_catena_admin_systemd_run_env.py pins them equal.
  - name: catena-restore-run
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      systemd-run --unit catena-recovery-restore --collect --pipe
      --setenv=HOME=/var/lib/catena/restic-home
      --setenv=XDG_CACHE_HOME=/var/lib/catena/restic-cache
      {{ catena_recovery_bin }} restore -stdin
  # Read-only progress. The restore page reads the same two files directly
  # through its read-only mount of {{ catena_recovery_state_file | dirname }},
  # so this is the hand-run and bench view, not the panel's polling path -- a
  # restore runs for as long as the data takes, and an SSH round trip every few
  # seconds for an hour is not how to watch it.
  - name: catena-restore-status
    shell: >-
      printf 'state=%s\n'
      "$(head -n 1 {{ catena_recovery_state_file }} 2>/dev/null || echo idle)";
      printf 'unit=%s\n'
      "$(systemctl is-active catena-recovery-restore.service 2>/dev/null || true)";
      tail -n 40 {{ catena_recovery_history_file }} 2>/dev/null || true
  - name: catena-restore-reset
    shell: "{{ catena_recovery_bin }} restore -reset"
  # The snapshot list the restore page's picker renders. Read-only, JSON on
  # stdout. Two entries rather than one taking a flag from the panel: a
  # reserved action is a FIXED command, and "which repository" is exactly the
  # kind of thing that must not be caller-supplied.
  - name: catena-restore-snapshots
    shell: "{{ catena_recovery_bin }} snapshots"
  - name: catena-restore-snapshots-foreign
    shell: "{{ catena_recovery_bin }} snapshots -foreign"
  # The keyset for ANOTHER server's backup repository, for a machine that is
  # replacing one that is gone. PAYLOAD is base64(JSON
  # {op,repository,password,env}); the host writes it 0600 under /run, which is
  # tmpfs, so it does not survive a reboot. The engine allow-lists the variable
  # names it will accept -- the file is loaded into a root process's
  # environment, so an arbitrary name would be a way to set LD_PRELOAD for it.
  - name: catena-restore-credentials
    shell: >-
      echo "$PAYLOAD" | base64 -d |
      {{ catena_recovery_bin }} credentials -stdin

# Cloudflare tunnel reserved actions (COMMUNITY -- the tunnel is a CE feature).
# The Settings panel dispatches these when the client saves a Cloudflare token:
#   - cloudflared-check validates a CANDIDATE token BEFORE persist. The token
#     arrives in the SSH env (CATENA_CF_CANDIDATE_TOKEN, whitelisted via sshd
#     AcceptEnv in host.yml) -- NOT in argv/$PAYLOAD -- so it never lands in
#     $SSH_ORIGINAL_COMMAND or any process argv/log; the action pipes it to the
#     engine on stdin. --token-stdin does not touch the store.
#   - cloudflared-sync runs the full converge after a valid token is persisted.
#     It exports the templated NON-SECRET pins (real image pin, ingress service,
#     tunnel name, network, stop-grace, probe counts) into the engine env so
#     production uses the pinned values, not the engine built-in defaults;
#     `env VAR=val ... cmd` preserves the rest of the session env, including
#     CATENA_MULTIDOMAIN_ENABLED forwarded on the sync dispatch (AcceptEnv). The
#     token is NOT passed -- the engine reads it from the on-box store.
# These are appended to catena_admin_ce_reserved_actions in catalog.yml ONLY in
# cloudflare access mode. The pins reference roles/cloudflare_tunnel defaults;
# `| default(...)` keeps the render safe if that role is not in scope (tailnet),
# where these actions are inert anyway.
catena_admin_cloudflared_reserved_actions:
  - name: cloudflared-check
    shell: >-
      printf '%s' "$CATENA_CF_CANDIDATE_TOKEN" |
      {{ cloudflared_sync_bin | default('/usr/local/bin/catena-cloudflared-sync') }}
      check --token-stdin
  # Only the tunnel NAME is exported. The image, ingress service, network, stop
  # grace and probe counts used to be listed here too, duplicating both the
  # cloudflare_tunnel role defaults and the engine's own -- three copies of each
  # value, kept in agreement by hand, with a `default(...)` fallback here that
  # was a fourth. The engine owns them; this passes only what it cannot know.
  #
  # The tunnel name is the exception because the engine's fallback is the box's
  # hostname, which is not always the inventory name.
  - name: cloudflared-sync
    shell: >-
      env
      CLOUDFLARED_TUNNEL_NAME={{ cloudflared_tunnel_name | default(inventory_hostname) }}
      {{ cloudflared_sync_bin | default('/usr/local/bin/catena-cloudflared-sync') }} sync
