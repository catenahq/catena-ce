---
# Deploy the catena-admin Go shell as a TIER-1 SWARM SERVICE, not a Portainer
# stack: the panel holds PORTAINER_API_BASE + PORTAINER_API_KEY and
# reconciles Portainer's stacks, so deploying it VIA Portainer would make it
# a dependent of the thing it exists to drive -- a Portainer that would not
# start would take down the only tool that could repair it, and the
# post-restore path that needs the panel runs at exactly the moment
# Portainer is what did not come back.
#
# So it is created the same way roles/traefik, roles/postgres and
# roles/portainer create theirs -- `docker service create` against the local
# swarm, with the spec reconciled on every converge. Nothing in the path
# needs Portainer to be up, or an API key to exist.
#
# The argv is rendered by filter_plugins/catena_admin_service.py, which the
# TEST BENCH imports too: the bench deploys this same container with an
# image it built on the VPS, and the parts that must not drift between the
# two are the eight mounts and six container labels nobody re-reads.
#
# Credentials arrive as SWARM SECRETS, not --env: `docker service create`
# has no --env-file, so an --env value sits in the host process table for
# the duration of the create where any local user can read it. The service
# gets <KEY>_FILE pointing into /run/secrets and catena-admin's
# secretenv.go reads the file.
#
# License env (CATENA_LICENSE*) is deliberately NOT supplied. The token
# lives in the on-box store (secrets.catena_license) and the shell reads it
# from there, which is what makes the deploy mechanism replaceable: an
# activated host keeps its licence across a redeploy because neither the
# stack API nor this service is where the licence lives.
#
# The image is PUBLIC GHCR: every install deploys the panel, and the
# Business feature set inside it is gated at runtime by the license check.

- name: "Catena-admin: name each swarm secret after its value"
  # Content-hashed names, because swarm secrets are IMMUTABLE: a fixed name
  # keeps mounting the original bytes forever after a rotation, and nothing
  # reports it. Blank values are dropped -- the shell's env fallback is the
  # documented degraded path, an empty secret file is not.
  ansible.builtin.set_fact:
    _ca_secrets: "{{ catena_admin_secret_specs | catena_admin_secret_entries }}"
  no_log: true
  when: catena_admin_deploy_from_converge | bool

- name: "Catena-admin: which swarm secrets already exist"
  ansible.builtin.command:
    argv: [docker, secret, inspect, "{{ item.name }}"]
  loop: "{{ _ca_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ca_secret_exists
  changed_when: false
  failed_when: false
  when: catena_admin_deploy_from_converge | bool

- name: "Catena-admin: create the missing swarm secrets"
  ansible.builtin.include_tasks: secret.yml
  loop: >-
    {{ _ca_secret_exists.results
       | rejectattr('skipped', 'defined')
       | selectattr('rc', 'ne', 0)
       | map(attribute='item') | list }}
  loop_control:
    loop_var: ca_secret
    label: "{{ ca_secret.name }}"
  when: catena_admin_deploy_from_converge | bool

# ─── the service spec ────────────────────────────────────────────────────
# One dict feeding create AND reconcile, so a fresh host and a converged one
# cannot end up with different services. The plain env holds no credential:
# every one of those is in _ca_secrets above.
- name: "Catena-admin: build the service spec"
  ansible.builtin.set_fact:
    _ca_spec:
      name: "{{ catena_admin_service_name }}"
      image: "{{ catena_admin_image }}"
      network: "{{ catena_network_name | default('catena-network') }}"
      ui_port: "{{ catena_admin_ui_port }}"
      direct_port: "{{ catena_admin_direct_port }}"
      group: "{{ catena_admin_supplementary_gid }}"
      secrets: "{{ _ca_secrets }}"
      hardening: "{{ catena_admin_desired | swarm_service_create_args }}"
      env:
        # :8000 to match the oauth2-proxy upstream and the dash.<zone> route;
        # the image default is :8080.
        CATENA_ADMIN_ADDR: ":{{ catena_admin_internal_port }}"
        CATENA_ADMIN_DIRECT_ADDR: ":{{ catena_admin_direct_port }}"
        CATENA_ADMIN_LOCAL_USER: "{{ admin_email }}"
        CATENA_DEFAULT_THEME: "{{ catena_admin_default_theme }}"
        CATENA_EE_PAYLOAD_DIR: "{{ catena_admin_ee_payload_dir }}"
        CATENA_ADMIN_STATE_DIR: "{{ catena_admin_state_dir }}"
        # The domain this server serves, compared against the domain a
        # licence token names so one key cannot unlock two servers.
        CLOUDFLARE_PRIMARY_ZONE: "{{ cloudflare_zone | default('') }}"
        PORTAINER_API_BASE: >-
          http://{{ portainer_service_name }}:{{ portainer_ui_port }}/api
        KEYCLOAK_HOSTNAME: "{{ keycloak_hostname }}"
        KEYCLOAK_REALM: "{{ keycloak_realm }}"
        INFRA_GATUS_HOSTNAME: "{{ infrastructure_gatus_hostname }}"
        INFRA_HEARTBEAT_HOSTNAME: "{{ healthchecks_hostname }}"
        INFRA_BESZEL_HOSTNAME: "{{ beszel_hostname }}"
        GATUS_COMPOSE_NAME: "{{ gatus_compose_name }}"
        GATUS_INTERNAL_PORT: "{{ gatus_internal_port }}"
        HEALTHCHECKS_COMPOSE_NAME: "{{ healthchecks_compose_name }}"
        HEALTHCHECKS_INTERNAL_PORT: "{{ healthchecks_internal_port }}"
        ADMIN_SSH_HOST: "host.docker.internal"
        ADMIN_SSH_USER: "{{ catena_admin_runner_user }}"
        ADMIN_SSH_KEY_PATH: "{{ catena_admin_host_ssh_dir }}/id_ed25519"
  when: catena_admin_deploy_from_converge | bool

- name: "Catena-admin: check the swarm service exists"
  ansible.builtin.command:
    argv: [docker, service, inspect, "{{ catena_admin_service_name }}",
           --format, '{{ "{{" }}.ID{{ "}}" }}']
  register: _ca_service
  changed_when: false
  failed_when: false
  when: catena_admin_deploy_from_converge | bool

- name: "Catena-admin: create the swarm service (first run)"
  ansible.builtin.command:
    argv: "{{ _ca_spec | catena_admin_service_argv }}"
  register: _ca_service_create
  changed_when: _ca_service_create.rc == 0
  when:
    - catena_admin_deploy_from_converge | bool
    - _ca_service.rc | default(1) != 0

# ─── reconcile (rolling) ─────────────────────────────────────────────────
# Three diffs against one live spec: the hardening subset, the environment,
# and the mounted secrets. Concatenated into a SINGLE `docker service
# update` so the task is recreated once, not three times.
- name: "Catena-admin: inspect the live service spec"
  ansible.builtin.command:
    argv: [docker, service, inspect, "{{ catena_admin_service_name }}"]
  register: _ca_inspect
  changed_when: false
  failed_when: false
  when:
    - catena_admin_deploy_from_converge | bool
    - _ca_service.rc | default(1) == 0

- name: "Catena-admin: compute spec drift"
  ansible.builtin.set_fact:
    _ca_drift: >-
      {{ ((_ca_inspect.stdout | from_json) | swarm_service_drift(catena_admin_desired))
         + ((_ca_inspect.stdout | from_json) | catena_admin_env_drift(_ca_spec | catena_admin_full_env))
         + ((_ca_inspect.stdout | from_json) | catena_admin_secret_drift(_ca_secrets)) }}
  no_log: true
  when:
    - catena_admin_deploy_from_converge | bool
    - _ca_service.rc | default(1) == 0
    - _ca_inspect.rc | default(1) == 0

- name: "Catena-admin: reconcile the service spec (rolling)"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'service', 'update'] + _ca_drift
         + [catena_admin_service_name] }}
  register: _ca_reconcile
  changed_when: _ca_reconcile.rc == 0
  no_log: true
  when:
    - catena_admin_deploy_from_converge | bool
    - _ca_drift | default([]) | length > 0

# --- host engine payload install --------------------------------------------
# Not here any more. roles/payload extracts the engines straight out of the
# image and installs them right after roles/docker, so they are on the host
# eight roles before this one -- which is what roles/cloudflare_tunnel needs.
# The container still mirrors its embedded payload into the ee-payload bind
# mount at startup; that copy is now a mirror of what is already installed
# rather than the only source of it.

# Make the host match what the config store says about scheduling.
#
# ONE owner for every scheduled lane: which timers are enabled, at what
# OnCalendar, and the restic retention run-backup.sh reads. The converge does
# not template any of that -- it calls the binary that does, so a value set in
# the panel is not reverted by the next converge, and a value in the store is
# not shadowed by a template.
#
# Gated on the BINARY, not on who deployed the container. It carried the
# converge-deploy trio above by copy-paste, which meant a host whose payload
# arrived any other way -- the bench, a restore, a migrate -- converged with
# no /etc/catena/backup-retention.env at all, and run-backup.sh sources it.
# Nothing about applying a stored schedule depends on this converge having
# deployed the shell; it depends on catena-schedule being installed, which is
# what the stat asks.
#
# The binary itself decides what an unlicensed host may schedule: it verifies
# the licence offline and refuses a Business lane or a tighter-than-weekly
# backup cadence. Community's cap is also asserted below against the stored
# value, because a client can edit their own config.json and CV8 has to hold in
# this repo, not only in the panel.
#
# Idempotent: it skips identical writes, so a converge with nothing to change
# touches no file and reports unchanged.
- name: "Catena-admin: is the schedule binary installed"
  ansible.builtin.stat:
    path: "{{ catena_schedule_bin }}"
  register: _catena_schedule_bin_stat

- name: "Catena-admin: apply the stored schedule (timers + retention)"
  ansible.builtin.command:
    argv:
      - "{{ catena_schedule_bin }}"
      - apply
  register: _catena_schedule_apply
  changed_when: false
  when: _catena_schedule_bin_stat.stat.exists

- name: "Catena-admin: schedule state"
  ansible.builtin.debug:
    var: _catena_schedule_apply.stderr_lines
  when:
    - _catena_schedule_apply is not skipped
    - (_catena_schedule_apply.stderr | default('')) | length > 0
