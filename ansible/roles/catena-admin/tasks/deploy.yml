---
# Deploy the catena-admin Go shell as a Portainer stack.
#
# Converge-time equivalent of the bench's
# orchestrator/catena_admin_deploy.py: it pushes the SAME compose
# (files/catena-admin.compose.yml in this role) through the Portainer stack
# API, supplying every per-host value -- including the image ref -- via
# svc_env (${VAR} substitution). Production pulls the published GHCR image
# ({{ catena_admin_image }}); the bench supplies a locally-built tag instead.
#
# Gated on vault_portainer_api_key (like every other stack deploy). No Traefik
# route is written here: catena-admin is auth-gated and roles/oauth2_proxy
# already owns the priority-100 dash.<zone> route to its own oauth2-proxy
# container (which upstreams to catena-admin:8000). svc_domain_host is empty so
# portainer_stack.yml removes any stale catena-admin route instead of writing a
# competing backend route.
#
# License env (CATENA_LICENSE*) is intentionally NOT supplied: the compose's
# ${VAR:-} empty defaults keep the shell Community-only, and merge_env_portainer
# preserves any license keys an EE activation later wrote into the stack Env, so
# a CE re-converge never clobbers an activated license.
#
# The image is PUBLIC GHCR: every install deploys the panel; the Business
# feature set inside it is gated at runtime by the license check (a pull
# token would be theater -- anyone can install Catena, so distribution
# gating adds no enforcement; the support contract is the moat). The bench
# builds the image locally and deploys out of band either way.

- name: "Catena-admin: resolve Portainer endpoint id"
  # Idempotent read-only GET /endpoints. Re-included here (mirrors
  # roles/keycloak + roles/oauth2_proxy) so a tag-scoped `--tags catena_admin`
  # run -- where roles/infrastructure did not execute -- still has
  # _portainer_endpoint_id in scope for portainer_stack.yml.
  ansible.builtin.include_tasks: ../../infrastructure/tasks/portainer_endpoint.yml
  when:
    - catena_admin_deploy_from_converge | bool
    - vault_portainer_api_key is defined
    - (vault_portainer_api_key | default('') | length) > 0

- name: "Catena-admin: deploy the Go shell as a Portainer stack"
  ansible.builtin.include_tasks: ../../infrastructure/tasks/portainer_stack.yml
  vars:
    svc_name: "catena-admin"
    # Plain ${VAR} compose in files/, NOT a template: the bench pushes the
    # byte-identical file without Jinja (orchestrator/catena_admin_deploy.py).
    svc_compose_content: >-
      {{ lookup('file', role_path ~ '/files/catena-admin.compose.yml') }}
    # Env array the Portainer stack API substitutes into the compose ${VAR}
    # placeholders. Mirrors orchestrator/catena_admin_deploy.py _build_env,
    # mapped to the canonical Ansible vars. Values with a compose ${VAR:-}
    # default that we still supply (hostnames, ports) render the live value.
    svc_env:
      - "CATENA_ADMIN_IMAGE={{ catena_admin_image }}"
      - "CATENA_DEFAULT_LANG={{ catena_admin_default_language }}"
      - "CATENA_DEFAULT_THEME={{ catena_admin_default_theme }}"
      # Access mode drives the compliance panel's SSO posture (shell/panels/compliance
      # reads CATENA_ACCESS_MODE): a tailnet host has no self-hosted
      # SSO edge, so without this the panel would falsely claim SSO. Always
      # converge-supplied, so the merge keeps it current (non-credential key
      # the catalog owns). CATENA_MULTIDOMAIN_ENABLED is NOT set here -- the
      # shell derives multidomain from the enabled cloudflare-zones panel
      # (Business), not a compose env (see SYNC.md).
      - "CATENA_ACCESS_MODE={{ access_mode | default('cloudflare') }}"
      - "PORTAINER_API_BASE=http://{{ portainer_service_name }}:{{ portainer_ui_port }}/api"
      - "PORTAINER_API_KEY={{ vault_portainer_api_key }}"
      - "KEYCLOAK_HOSTNAME={{ keycloak_hostname }}"
      - "KEYCLOAK_REALM={{ keycloak_realm }}"
      - "INFRA_MONITOR_HOSTNAME={{ infrastructure_monitor_hostname }}"
      - "INFRA_HEARTBEAT_HOSTNAME={{ healthchecks_hostname }}"
      - "INFRA_BESZEL_HOSTNAME={{ beszel_hostname }}"
      - "CATENA_ADMIN_RECOVERY_URL=https://{{ infrastructure_recovery_hostname }}"
      - "GATUS_COMPOSE_NAME={{ gatus_compose_name }}"
      - "GATUS_INTERNAL_PORT={{ gatus_internal_port }}"
      - "HEALTHCHECKS_COMPOSE_NAME={{ healthchecks_compose_name }}"
      - "HEALTHCHECKS_INTERNAL_PORT={{ healthchecks_internal_port }}"
      - "HEALTHCHECKS_API_KEY_READONLY={{ vault_healthchecks_api_key_readonly }}"
      - "ADMIN_SSH_HOST=host.docker.internal"
      - "ADMIN_SSH_USER={{ catena_admin_runner_user }}"
      # Native-login listener (host-published tailnet port). The session key is
      # the on-box-minted vault_catena_admin_session_key; LOCAL_USER is the
      # admin email. UI_PORT is the host-published port (compose ${VAR}).
      - "CATENA_ADMIN_UI_PORT={{ catena_admin_ui_port }}"
      - "CATENA_ADMIN_DIRECT_ADDR=:{{ catena_admin_direct_port }}"
      - "CATENA_ADMIN_SESSION_KEY={{ vault_catena_admin_session_key }}"
      - "CATENA_ADMIN_LOCAL_USER={{ admin_email }}"
    # No Traefik route -- oauth2_proxy owns the gated dash.<zone> route.
    svc_domain_host: ""
    svc_domain_service: "app"
    svc_domain_port: "{{ catena_admin_internal_port | default(8000) }}"
    # An HTTP probe of dash.<zone> is oauth2-gated: it returns 302 regardless
    # of whether the catena-admin backend is up, so it is not a meaningful
    # readiness signal. The Portainer stack deploy is synchronous (its 2xx
    # means `compose up` exited); rely on that here.
    svc_readiness_skip_reason: >-
      dash.<zone> is oauth2-proxy gated (302 regardless of backend health); the
      synchronous Portainer stack deploy 2xx is the readiness signal.
  when:
    - catena_admin_deploy_from_converge | bool
    - vault_portainer_api_key is defined
    - (vault_portainer_api_key | default('') | length) > 0

# --- host engine payload install (UNCONDITIONAL, NOT license-gated) ---------
# The catena-admin container mirrors its embedded host payload (all engines --
# catena-cloudflared-sync, catena-daily, the lane scripts, units -- and the
# installer) into the ee-payload bind mount at startup. Install it into
# /usr/local/bin on EVERY converge so a plain Community host has the engines
# present (the Cloudflare tunnel engine especially -- roles/cloudflare_tunnel
# dispatches it). The license only gates which UI buttons the shell renders, it
# does NOT gate the payload install. Idempotent (install -m over each file).
#
# Same converge-only gate as the container deploy above: the container must be
# deployed by this converge to have synced the payload. The bench deploys the
# container out of band (catena_admin_deploy_from_converge=false) and installs
# the payload out of band too, so this block is skipped there.
- name: "Catena-admin: wait for the host payload to sync from the container"
  ansible.builtin.stat:
    path: "{{ catena_admin_ee_payload_bin_dir }}"
  register: _catena_admin_payload_bin
  until: _catena_admin_payload_bin.stat.exists | default(false)
  retries: 30
  delay: 4
  when:
    - catena_admin_deploy_from_converge | bool
    - vault_portainer_api_key is defined
    - (vault_portainer_api_key | default('') | length) > 0

- name: "Catena-admin: install the host engine payload (every host, ungated)"
  ansible.builtin.command:
    argv:
      - bash
      - "{{ catena_admin_ee_payload_installer }}"
  register: _catena_admin_payload_install
  # The installer is idempotent and emits no ansible-parsable changed signal
  # (it install -m's byte-identical files on a re-converge), so report unchanged
  # to keep the bench changed=0 idempotency gate green. Real installs are
  # observable in the task stdout ("installed N binary(ies)...").
  changed_when: false
  when:
    - catena_admin_deploy_from_converge | bool
    - vault_portainer_api_key is defined
    - (vault_portainer_api_key | default('') | length) > 0
