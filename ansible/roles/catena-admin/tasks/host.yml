---
# Host-side state for catena-admin: the runner user + dispatcher +
# SSH keypair the Go shell container uses to dispatch actions on the
# host. A dedicated per-service runner account makes attribution
# unambiguous: any command through this dispatcher is sourced from the
# admin container, never anything else.

# SSH dispatch passes several values as env vars so the reserved-action shells
# read them without exposing them in argv/$SSH_ORIGINAL_COMMAND/the process
# table. The container's paramiko client calls
# channel.set_environment_variable(NAME, ...); sshd rejects each var unless it
# is whitelisted via AcceptEnv. Match-User scope so the rule only applies to
# the runner account and does not leak to operator-shell sessions.
#   - X_FORWARDED_EMAIL       -- the clicking admin's email, for audit-trail
#                                actions (e.g. managed-update-pause).
#   - CATENA_CF_CANDIDATE_TOKEN -- a candidate Cloudflare token the Settings
#                                panel validates via cloudflared-check BEFORE
#                                persist; piped to the engine on stdin.
#   - CATENA_BACKUP_CANDIDATE_REPO / *_ACCESS_KEY / *_SECRET_KEY -- a candidate
#                                S3 backup endpoint the Settings panel
#                                validates via backup-endpoint-check BEFORE
#                                persist; folded into JSON and piped to
#                                catena-backup-check on stdin. Names MUST match
#                                catena-admin shell/web/backupendpoint.go's
#                                BackupEndpointCandidateRepoEnv/*AccessKeyEnv/
#                                *SecretKeyEnv.
# The list is deliberately short: every name here is a value the container can
# push into a root-run host process, so it stays the minimum the dispatch needs.
# The tunnel engine reads the licence directly out of the on-box store, so
# the panel does not need to tell the host what it is entitled to via this
# list.
#
# It is rendered from catena_admin_dispatch_env_passthrough here AND in the
# sudoers env_keep below. Both hops have to name a var or it arrives empty,
# and sshd accepting a var the sudoers drop-in then drops is invisible: the
# action runs, reads "", and reports on nothing.
- name: "sshd: AcceptEnv for catena-admin-runner dispatch env vars"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/30-catena-admin-runner-acceptenv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      # Allow the catena-admin container's paramiko client to forward the
      # clicking admin's email, a candidate Cloudflare token, and a candidate
      # S3 backup endpoint to the host dispatcher via env vars. Scoped to the
      # runner account; does not affect operator shells.
      Match User {{ catena_admin_runner_user }}
          AcceptEnv {{ catena_admin_dispatch_env_passthrough | join(' ') }}
      Match all
  notify: reload sshd

- name: "Runner: ensure system account exists ({{ catena_admin_runner_user }})"
  ansible.builtin.user:
    name: "{{ catena_admin_runner_user }}"
    system: true
    shell: /bin/bash
    home: "{{ catena_admin_runner_home }}"
    create_home: true
    # useradd --system leaves the shadow password as `!` (locked); sshd
    # then rejects key auth with "User ... not allowed because account
    # is locked" (the PAM `account` stack treats !-prefixed entries as
    # locked, independent of PubkeyAuthentication). `*` means "no valid
    # password" without locking the account, which is what we want for
    # a key-only forced-command runner.
    password: "*"
    state: present

- name: "Runner: ~/.ssh directory"
  ansible.builtin.file:
    path: "{{ catena_admin_runner_home }}/.ssh"
    state: directory
    owner: "{{ catena_admin_runner_user }}"
    group: "{{ catena_admin_runner_user }}"
    mode: "0700"

- name: "Runner: sudoers drop-in pinned to dispatcher only"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/catena-admin-runner"
    owner: root
    group: root
    mode: "0440"
    content: |
      # {{ ansible_managed }}
      # The runner user may NOPASSWD-sudo exactly one binary: the
      # dispatcher at {{ catena_admin_dispatcher_path }}. The dispatcher
      # (root-owned 0755, not writable by the runner) enforces its own
      # allow-list of action names. !requiretty because SSH forced-
      # command has no tty.
      Defaults:{{ catena_admin_runner_user }} !requiretty
      # sudo's env_reset (/etc/sudoers) drops the whole environment, so the
      # candidate credentials sshd accepted (the AcceptEnv drop-in above) are
      # gone before the dispatcher runs -- a check would validate an empty
      # string and reject creds that are fine. These names carry values that
      # must NOT ride argv, which is the whole reason they travel as env:
      # env_keep is what lets them survive the one sudo hop between sshd and
      # the dispatcher, and it is scoped to this user and these names.
      Defaults:{{ catena_admin_runner_user }} env_keep += "{{ catena_admin_dispatch_env_passthrough | join(' ') }}"
      {{ catena_admin_runner_user }} ALL=(root) NOPASSWD: {{ catena_admin_dispatcher_path }}
    validate: /usr/sbin/visudo -cf %s

- name: "Runner: /etc/catena config dir"
  ansible.builtin.file:
    path: /etc/catena
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Runner: dispatcher script ({{ catena_admin_dispatcher_path }})"
  # Plain bash under vps-scripts/ -- the data file rendered by
  # catalog.yml carries any per-action Jinja; the runner stays Jinja-
  # free so the no-Jinja-in-executables CI guard passes.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-admin-runner.sh"
    dest: "{{ catena_admin_dispatcher_path }}"
    owner: root
    group: root
    mode: "0755"

# 0b: install onbox_config.py on the host so the catena-config reserved
# dispatch action can serve the Settings-tab read/write API as root. Stdlib-
# only, so the host system python runs it without the CE uv venv.
- name: "Runner: install onbox_config.py for the settings-API dispatch"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../helpers/onbox_config.py"
    dest: "{{ catena_admin_onbox_config_path }}"
    owner: root
    group: root
    mode: "0755"

# 0b: install the restic-key helper so the catena-restic-validate /
# catena-restic-rotate reserved actions can check or re-key the backup
# password as root (the restic password is USER_HELD, never a settings field).
- name: "Runner: install catena-restic-key for the backup-password actions"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/catena-restic-key.py"
    dest: "{{ catena_admin_restic_key_path }}"
    owner: root
    group: root
    mode: "0755"

# --- SSH keypair for the catena-admin container ----------------------
# Generated on the VPS so the private key never leaves the host. We
# bind-mount the dir read-only into the admin container; the container
# uses the key to SSH back to {{ ansible_host }} as the runner user.

- name: "SSH dir on host ({{ catena_admin_host_ssh_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_host_ssh_dir }}"
    state: directory
    # The container runs as the distroless nonroot user
    # ({{ catena_admin_container_uid }}); this 0700 dir + the files in it
    # are mounted read-only and must be owned by that uid or the Go shell's
    # SSH runner cannot read them (EACCES on every action dispatch).
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0700"

- name: "SSH dir: generate ed25519 keypair if missing"
  community.crypto.openssh_keypair:
    path: "{{ catena_admin_host_ssh_dir }}/id_ed25519"
    type: ed25519
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0600"
    regenerate: never

- name: "SSH dir: read public key"
  ansible.builtin.slurp:
    src: "{{ catena_admin_host_ssh_dir }}/id_ed25519.pub"
  register: _catena_admin_pubkey

- name: "Runner: authorized_keys with forced-command pinned to dispatcher"
  ansible.builtin.copy:
    dest: "{{ catena_admin_runner_home }}/.ssh/authorized_keys"
    owner: "{{ catena_admin_runner_user }}"
    group: "{{ catena_admin_runner_user }}"
    mode: "0600"
    content: "{{ _runner_authorized_keys }}"
  vars:
    # Forced-command pipes $SSH_ORIGINAL_COMMAND through sudo into the
    # dispatcher as a SINGLE quoted arg -- shell metacharacters in the
    # client's requested command (e.g. `foo; rm -rf /`) cannot smuggle
    # extra commands past sudo. The dispatcher matches arg $1 against
    # its allow-list and rejects anything unknown.
    _runner_options: >-
      no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty
    _runner_command: >-
      command="/usr/bin/sudo -n {{ catena_admin_dispatcher_path }}
      \"$SSH_ORIGINAL_COMMAND\""
    _runner_pubkey: "{{ _catena_admin_pubkey.content | b64decode | trim }}"
    _runner_authorized_keys: >
      # {{ ansible_managed }}

      {{ _runner_command }},{{ _runner_options }} {{ _runner_pubkey }}

- name: "SSH dir: scan host key of {{ ansible_host }}"
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -t
      - ed25519
      - "{{ ansible_host }}"
  register: _catena_admin_keyscan
  changed_when: false

- name: "SSH dir: write known_hosts"
  ansible.builtin.copy:
    dest: "{{ catena_admin_host_ssh_dir }}/known_hosts"
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0644"
    # ssh-keyscan emits "HOST keytype keydata"; the SSH client matches the
    # connection hostname against the first field literally. From inside the
    # container, the Go shell's SSH runner ONLY ever connects to
    # host.docker.internal (resolved via the extra_hosts host-gateway mapping
    # in the admin compose), so the scanned HOST is never matched against --
    # and it is the one volatile part of the content (ansible_host flips
    # public-IP <-> tailnet-IP across converges, and differs again after a
    # cross-host restore), which made this copy non-idempotent (changed every
    # re-converge). The `keyscan_alias` filter (Python; see playbooks/
    # filter_plugins/keyscan_alias.py) with replace=true REPLACES the scanned
    # HOST with the constant alias, emitting "host.docker.internal keytype
    # keydata" -- idempotent, no functional loss -- without the YAML folded-
    # scalar + Jinja string-literal backref traps that broke a regex_replace.
    content: "{{ _catena_admin_keyscan.stdout_lines | keyscan_alias('host.docker.internal', replace=true) }}"

- name: "SSH dir: ssh client config (StrictHostKeyChecking yes)"
  ansible.builtin.template:
    src: admin-ssh-config.j2
    dest: "{{ catena_admin_host_ssh_dir }}/config"
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0644"

# --- Bind-mount targets the admin container expects -----------------
# {{ catena_admin_stats_dir }} hosts the backup/gatus/healthchecks
# summary JSON files written by run-backup.sh + gatus-sync.py (Phase 4a
# fold). The backup role's install task creates this dir; we mirror
# `state: directory` here as belt-and-braces in case catena-admin runs
# on a host where backup is somehow disabled.
- name: "Stats dir for admin gauges ({{ catena_admin_stats_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_stats_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The admin compose mounts {{ catena_admin_stats_dir }} (/var/lib/catena)
# READ-ONLY and then bind-mounts the ee-payload subdir NESTED (rw) at
# /var/lib/catena/ee-payload. Docker can only create that nested mountpoint
# if the subdir already exists on the host -- a read-only parent makes the
# mkdirat fail ("read-only file system") and the container never starts, so
# Portainer settles the stack deploy in a failed state. Pre-create it here,
# owned by the container's nonroot uid: the shell WRITES its embedded
# Business host payload into this dir at startup (payload sync), and the
# ee-install-engines host action installs from it.
- name: "EE payload mountpoint for the admin container ({{ catena_admin_stats_dir }}/ee-payload)"
  ansible.builtin.file:
    path: "{{ catena_admin_stats_dir }}/ee-payload"
    state: directory
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0755"

# Admin state volume: the shell's own writable state, bind-mounted rw. The
# audit hash chain and its per-host signing key live here, which is why the
# ownership matters -- it must be the CONTAINER's uid (65532, from USER
# nonroot in the image), not 1000. It was 1000 while the shell was the old
# Python image; under distroless the container could not write here at all,
# so anything that tried degraded silently.
- name: "State dir for admin container ({{ catena_admin_state_dir }})"
  ansible.builtin.file:
    path: "{{ catena_admin_state_dir }}"
    state: directory
    owner: "{{ catena_admin_container_uid }}"
    group: "{{ catena_admin_container_gid }}"
    mode: "0700"

# Per-host configuration for the daily orchestrator chain.
#
# catena-daily.service and catena-daily-resume.service declare
# EnvironmentFile for this path with NO leading dash, so systemd fails the
# unit outright when it is absent.
#
# Written on EVERY converge, unlike backup.env next door: this file holds no
# secrets, only paths and toggles, so there is no rotated value for a
# re-render to clobber. The chain reads its credentials from the config store.
#
# Not gated on the payload install. The file describing how the chain should
# behave is cheap and harmless on a host that has no chain, and the ordering
# is one less thing to get wrong on a first converge.
- name: "Catena-admin: daily orchestrator configuration ({{ catena_daily_env_path }})"
  ansible.builtin.template:
    src: daily.env.j2
    dest: "{{ catena_daily_env_path }}"
    owner: root
    group: root
    mode: "0644"

# The two managed-update lanes, same story as daily.env: their units declare a
# non-optional EnvironmentFile and nothing rendered it, so both were
# unstartable on a real host.
#
# 0600 rather than 0644: this one carries the provider credentials when a
# provider is configured.
- name: "Catena-admin: host-package update lane configuration ({{ catena_auto_update_env_path }})"
  ansible.builtin.template:
    src: auto-update.env.j2
    dest: "{{ catena_auto_update_env_path }}"
    owner: root
    group: root
    mode: "0600"

- name: "Catena-admin: container update lane configuration ({{ catena_stack_update_env_path }})"
  ansible.builtin.template:
    src: stack-update.env.j2
    dest: "{{ catena_stack_update_env_path }}"
    owner: root
    group: root
    mode: "0600"

# Which infra services the container lane may bump, and how. With no spec file
# the lane bumped nothing and reported a clean run for it.
- name: "Catena-admin: managed infra spec list ({{ catena_managed_services_path }})"
  ansible.builtin.template:
    src: managed-services.json.j2
    dest: "{{ catena_managed_services_path }}"
    owner: root
    group: root
    mode: "0644"

# --- tailnet-only firewall for the native-login UI port (registry fragment) ---
# The admin panel's host-published port (compose ports: mode=host -> :8001)
# must be reachable only from the tailnet + RFC1918, never the public internet
# -- same posture as Portainer's UI port. The public-ports reconciler applies
# the DOCKER-USER rules from this fragment.
- name: "catena-admin: ensure public-port fragment dir exists"
  ansible.builtin.file:
    path: "{{ public_ports_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "catena-admin: declare UI + migration-lane ports (registry fragment, tailnet-only)"
  # The migration lane binds this host's tailnet address directly (a host
  # process, bind=host, not a published container port), and refuses to start
  # with no tailnet address rather than binding every interface. The declaration
  # is belt-and-braces behind that bind, and it is what makes the port appear in
  # the effective set validation reads -- an undeclared listener would show up
  # as an unexpected open port instead of an intended one.
  ansible.builtin.copy:
    dest: "{{ public_ports_fragment_dir }}/catena-admin.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        [
          {"proto": "tcp", "port": catena_admin_ui_port | int,
           "scope": "tailnet", "bind": "docker", "owner": "catena-admin",
           "comment": "catena-admin native-login panel -- tailnet + RFC1918 only"},
          {"proto": "tcp", "port": catena_migrate_lane_port | int,
           "scope": "tailnet", "bind": "host", "owner": "catena-admin",
           "comment": "migration lane (source side) -- tailnet only"}
        ] | to_nice_json
      }}
  register: _catena_admin_ports_fragment

- name: "catena-admin: reconcile public ports now (fragment changed)"
  ansible.builtin.systemd_service:
    name: catena-public-ports.service
    state: started
  changed_when: false
  when: _catena_admin_ports_fragment.changed

- name: Catena-admin host setup summary
  ansible.builtin.debug:
    msg: |
      catena-admin host setup:
        hostname:        {{ catena_admin_hostname }}
        runner user:     {{ catena_admin_runner_user }} ({{ catena_admin_runner_home }})
        dispatcher:      {{ catena_admin_dispatcher_path }}
        ssh keys (host): {{ catena_admin_host_ssh_dir }}/
        stats dir:       {{ catena_admin_stats_dir }}
        state dir:       {{ catena_admin_state_dir }}
        default theme:   {{ catena_admin_default_theme }}
