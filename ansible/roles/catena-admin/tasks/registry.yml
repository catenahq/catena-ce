---
# Ensure a Portainer registry credential for the PRIVATE catena-admin GHCR
# image, from the client's on-box GHCR pull token (vault_ghcr_pull_token,
# EXTERNAL secret: operator-issued, entered at install or on the Settings
# page). Portainer matches the credential to the image by URL prefix at
# stack-deploy pull time, so a single ghcr.io entry covers the pull.
#
# Idempotent by lookup: created only when no ghcr.io registry exists yet.
# Portainer's GET /registries never returns the stored password, so a
# drift-update would report changed on every converge; token ROTATION is a
# deliberate operator action (delete the registry in Portainer or set
# catena_admin_registry_force_update=true for one converge).

- name: "Catena-admin: list Portainer registries"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/registries"
    method: GET
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    status_code: 200
    return_content: true
  register: _catena_admin_registries
  delegate_to: localhost
  become: false

- name: "Catena-admin: resolve existing ghcr.io registry id"
  ansible.builtin.set_fact:
    _catena_admin_ghcr_registry_id: >-
      {{ (_catena_admin_registries.json
          | selectattr('URL', 'equalto', catena_admin_registry_url)
          | map(attribute='Id') | first | default('')) }}

- name: "Catena-admin: create the ghcr.io registry credential"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/registries"
    method: POST
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    body_format: json
    body:
      # Type 3 = custom registry (ghcr.io is not a Portainer built-in type).
      Type: 3
      Name: "{{ catena_admin_registry_name }}"
      URL: "{{ catena_admin_registry_url }}"
      Authentication: true
      Username: "{{ catena_admin_registry_username }}"
      Password: "{{ vault_ghcr_pull_token }}"
    status_code: 200
  register: _catena_admin_registry_create
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false
  when: (_catena_admin_ghcr_registry_id | string | length) == 0

- name: "Catena-admin: rotate the ghcr.io registry credential (forced)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/registries/{{ _catena_admin_ghcr_registry_id }}"
    method: PUT
    headers:
      X-API-Key: "{{ vault_portainer_api_key }}"
    body_format: json
    body:
      Name: "{{ catena_admin_registry_name }}"
      URL: "{{ catena_admin_registry_url }}"
      Authentication: true
      Username: "{{ catena_admin_registry_username }}"
      Password: "{{ vault_ghcr_pull_token }}"
    status_code: 200
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false
  when:
    - (_catena_admin_ghcr_registry_id | string | length) > 0
    - catena_admin_registry_force_update | default(false) | bool
