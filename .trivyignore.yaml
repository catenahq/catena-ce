# Time-boxed Trivy suppressions for the operator-stack pinned base images.
#
# Every entry below is a HIGH/CRITICAL CVE in a THIRD-PARTY image Catena
# pins by role default (postgres, portainer, cloudflared, traefik) but does
# NOT compile: the CVEs live in vendored Go binaries baked into the upstream
# image (postgres' gosu, portainer's bundled docker/containerd/buildkit
# client libs, the cloudflared/traefik server binaries). The fix exists
# upstream (Go stdlib / the vendored module) but the image has not been
# rebuilt yet, so a pin bump cannot clear them -- postgres:16 is a rolling
# tag whose stale gosu re-appears on every pull, and portainer 2.39.4 is
# already the latest release.
#
# These do NOT weaken the gate's purpose: a Renovate PR that pins a NEW
# vulnerable tag still trips on any CVE not listed here. expiredAt forces a
# re-evaluation: after the date, Trivy stops ignoring the CVE and the gate
# goes red again -- at which point bump the pin if upstream has rebuilt, or
# renew the entry with a fresh date + reason.
#
# Reviewed 2026-07-13. Next review 2026-10-13.

vulnerabilities:
