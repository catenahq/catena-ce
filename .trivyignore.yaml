# Time-boxed Trivy suppressions for the infra app images catena-ce pins by
# role default: gatus, healthchecks, the beszel hub + agent + its python
# shim, the Phase Two Keycloak, keycloak-config-cli and oauth2-proxy.
# (clamav and the recovery nginx are clean and need no entry.)
#
# Every entry is a fixable HIGH or CRITICAL CVE in a THIRD-PARTY image
# Catena pins but does NOT compile: the fix exists upstream -- in a vendored
# Go module, a shaded jar, or a distro package -- and the image has not been
# rebuilt. EVERY image listed here is already the newest published tag, so no
# pin bump can clear any of it. That was checked at the registry per image,
# not assumed; where a newer tag did exist the pin moved instead.
#
# oauth2-proxy is worth naming because it carries the only CRITICAL and the
# obvious move does not work: v7.15.3-alpine, the latest release, ships the
# IDENTICAL package set as the pinned v7.15.2-alpine -- libcrypto3 and
# libssl3 3.5.5-r0, musl 1.2.5-r21, zlib 1.3.1-r2 -- while alpine v3.23 has
# carried openssl 3.5.6-r0 and 3.5.7-r0 for weeks. Bumping the tag would
# change the vendored Go modules and clear nothing here.
#
# These do NOT weaken the gate: a Renovate PR that pins a NEW vulnerable tag
# still trips on any CVE not listed here, and this gate is ABSOLUTE (no
# baseline), so a suppression is the only way debt stays visible. expiredAt
# forces re-evaluation -- after the date Trivy stops ignoring the CVE and the
# gate goes red again. Rebuild-watch: when upstream ships a rebuilt image,
# bump the pin to clear these for real instead of renewing the date.
#
# The postgres / portainer / cloudflared / traefik entries that used to live
# here are GONE, not expired: those pins moved into catena-admin's engine
# catalog on 2026-08-03 and this repo no longer scans them. Their
# suppressions moved with them.
#
# Reviewed 2026-08-07. Next review 2026-10-13.

