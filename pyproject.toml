[project]
name = "catena-installer"
version = "0.0.0"
description = "Install a Catena server from this machine, and reach its panel"
readme = "installer/README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# paramiko is pure Python, so the installer needs no SSH client and runs alike
# on Windows, macOS and Linux; PyYAML reads the knob registry and the input
# file. Everything else is stdlib, the browser page included.
dependencies = [
    "paramiko>=3.4",
    "pyyaml>=6",
]

[project.scripts]
# `uvx catena-installer` from PyPI, `uv run catena-installer` in a checkout.
catena-installer = "catena_installer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["installer/catena_installer"]

# The tree files the installer uses on the client's machine and sends to a
# server before the release is there (catena_installer/tree.py says which).
# In a checkout it reads them from ansible/; a wheel carries copies.
[tool.hatch.build.targets.wheel.force-include]
"ansible/seed.py" = "catena_installer/tree/seed.py"
"ansible/helpers" = "catena_installer/tree/helpers"
"ansible/skel" = "catena_installer/tree/skel"
"ansible/playbooks/filter_plugins/image_pin.py" = "catena_installer/tree/playbooks/filter_plugins/image_pin.py"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["installer/tests"]
