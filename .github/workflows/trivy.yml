name: Trivy

# Wave 4 (blocking) CVE gate for catena-ce. The fs scan (repo deps + misconfig
# + secrets) is the scanctl security gate (security.yml).
#
# This workflow no longer scans any image. It used to resolve the cloudflared +
# traefik + postgres + portainer tags out of the Ansible role defaults, and all
# four have left this repo: the tier-1 three when their specs moved into the
# catena-admin engine catalog (2026-08-03), cloudflared when its pin stopped
# being duplicated out of the tunnel engine's own default. Their scans live in
# catena-admin's trivy.yml now, reading the pins where the host reads them.
# Scanning them here after the move would have gated a PR on a tag no host runs.
#
# What remains is the suppression-expiry guard, which is repo-local: the
# .trivyignore.yaml it polices is this repo's.
#
# KNOWN GAP, pre-existing and not introduced here: the infra app images pinned
# in roles/infrastructure + roles/keycloak defaults (gatus, healthchecks,
# recovery nginx, clamav, beszel hub+agent, keycloak) are Renovate-tracked and
# their packageRule claims "Trivy gates each PR" -- nothing has ever scanned
# them. The machinery that would have hosted them left with the pins above, so
# the claim is now visibly unbacked rather than quietly so. Tracked in
# ops/BACKLOG_TECHNICAL.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:

  # Advance-warning guard for the time-boxed .trivyignore.yaml suppressions:
  # warns (::warning::) when an entry is within 30 days of expiredAt and FAILS
  # only on an already-expired entry (a dead suppression Trivy would re-fire).
  # Gives the review signal the trivy image jobs above cannot -- they only
  # notice a suppression once it has already lapsed.
  trivyignore-expiry:
    name: Trivy suppression expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Warn on suppressions nearing expiry (fail on already-expired)
        run: uv run .github/scripts/check_trivyignore_expiry.py

  # Single stable check for branch rulesets: succeeds when every needed job
  # succeeded or was legitimately skipped, fails on any failure/cancellation.
  # Required-check lists reference THIS name, so it is kept even though only
  # one job feeds it now -- renaming or removing it would leave every ruleset
  # waiting on a check that never reports.
  trivy-gate:
    name: trivy-gate
    runs-on: ubuntu-latest
    needs: [trivyignore-expiry]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a needed job reported $r"; exit 1 ;;
            esac
          done
          echo "all needed jobs green"
