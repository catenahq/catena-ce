name: Trivy

# Wave 4 (blocking) container-image CVE gate for catena-ce. Ported from
# catenahq/ops at the M3.7 cutover: the catena-admin image and the operator-
# stack base-image pins moved here with the client-facing Ansible roles. The
# fs scan (repo deps + misconfig + secrets) is the scanctl security gate
# (security.yml). What stays here cannot fold into scanctl's static fs scan:
#   - image (catena-admin): builds the distroless catena-admin image (top-level
#     Dockerfile) and scans the runtime layers.
#   - image (operator-stack pins): scans the cloudflared + traefik + postgres +
#     portainer tags resolved at runtime from the Ansible role defaults.
#
# Severity floor is HIGH+CRITICAL, ignore-unfixed:true so unpatched CVEs do not
# block until a fix exists upstream. Tune via .trivyignore.yaml (passed as the
# trivyignores input; entries are time-boxed via expiredAt so a suppression
# auto-expires and the gate re-fires for review).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:
  trivy-catena-admin-image:
    name: Trivy image (catena-admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Build catena-admin image
        # Build context is the repo root; the top-level Dockerfile is the
        # multi-stage Go build of ./cmd/catena-admin into distroless/static.
        run: docker buildx build -t catena-admin:ci -f Dockerfile .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: catena-admin:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: 'json'
          output: 'trivy-catena-admin.json'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-catena-admin-report
          path: trivy-catena-admin.json
          if-no-files-found: ignore

  # Image-CVE scan for the two operator-stack base images we pin by role
  # default (cloudflared + traefik). Renovate's docker manager does not see
  # these because they live as plain YAML values, not in a Dockerfile or
  # docker-compose. The customManagers open the BUMP PRs; this job catches the
  # CVE BEFORE merging a PR that pins a vulnerable tag.
  trivy-operator-stack-pins:
    name: Trivy image (operator-stack pins)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudflared
            pin_file: ansible/roles/cloudflare_tunnel/defaults/main.yml
            pin_key: cloudflared_image_tag
            image_repo: cloudflare/cloudflared
          - name: traefik
            pin_file: ansible/roles/traefik/defaults/main.yml
            pin_key: traefik_image_tag
            image_repo: traefik
          - name: postgres
            pin_file: ansible/roles/postgres/defaults/main.yml
            pin_key: catena_postgres_image_tag
            image_repo: postgres
          - name: portainer
            pin_file: ansible/roles/portainer/defaults/main.yml
            pin_key: portainer_image_tag
            image_repo: portainer/portainer-ce
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Resolve pinned image ref
        id: resolve
        env:
          PIN_FILE: ${{ matrix.pin_file }}
          PIN_KEY: ${{ matrix.pin_key }}
        run: |
          set -euo pipefail
          tag=$(uv run --with pyyaml python -c 'import os, yaml; print(yaml.safe_load(open(os.environ["PIN_FILE"]))[os.environ["PIN_KEY"]])')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${{ matrix.image_repo }}:$tag" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: 'json'
          output: 'trivy-${{ matrix.name }}.json'
          ignore-unfixed: true
          # CVE-only for these THIRD-PARTY images. The default vuln+secret
          # scan flags Debian's placeholder /etc/ssl/private/ssl-cert-
          # snakeoil.key (rule private-key, HIGH) baked into any base image
          # carrying the ssl-cert package -- e.g. postgres:16 since it moved
          # to a Debian 13/trixie base. That is a benign false positive we
          # cannot remove from an upstream image, and secrets in OUR tree are
          # already covered by the scanctl fs gate (security.yml). The
          # catena-admin job (our image) keeps the default secret scan.
          scanners: vuln
          trivyignores: .trivyignore.yaml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-${{ matrix.name }}-report
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: ignore

  # Advance-warning guard for the time-boxed .trivyignore.yaml suppressions:
  # warns (::warning::) when an entry is within 30 days of expiredAt and FAILS
  # only on an already-expired entry (a dead suppression Trivy would re-fire).
  # Gives the review signal the trivy image jobs above cannot -- they only
  # notice a suppression once it has already lapsed.
  trivyignore-expiry:
    name: Trivy suppression expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Warn on suppressions nearing expiry (fail on already-expired)
        run: uv run .github/scripts/check_trivyignore_expiry.py
