name: Trivy

# Expiry guard for the time-boxed .trivyignore.yaml suppressions.
#
# The image CVE scan itself lives in security.yml, as scanctl's `image_pins`.
# scanctl resolves each ref from the role default that declares it, applies
# this repo's .trivyignore.yaml, and grades the DELTA against the commit before
# the change -- so a bump is judged on what it introduces. The pins it reads
# are asserted to resolve by ansible/tests/unit/test_renovate_managers_resolve.py.
#
# cloudflared, traefik, postgres and portainer are scanned in catena-admin,
# which is where the host reads their pins.
#
# trivy-gate stays: the branch ruleset requires that check name, and a required
# check that never reports blocks auto-merge forever.

on:
  pull_request:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:

  # Warns (::warning::) when an entry is within 30 days of expiredAt and FAILS
  # only on an already-expired entry (a dead suppression Trivy would re-fire).
  # This is the review signal a scan cannot give: a scan notices a suppression
  # only once it has already lapsed and the CVE is back.
  trivyignore-expiry:
    name: Trivy suppression expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Warn on suppressions nearing expiry (fail on already-expired)
        run: uv run .github/scripts/check_trivyignore_expiry.py

  # Single stable check for branch rulesets: succeeds when every needed job
  # succeeded or was legitimately skipped, fails on any failure/cancellation.
  # One job feeds it. It stays a separate job rather than folding into that
  # one because the ruleset requires this NAME: renaming or removing it leaves
  # every ruleset waiting on a check that never reports.
  trivy-gate:
    name: trivy-gate
    runs-on: ubuntu-latest
    needs: [trivyignore-expiry]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a needed job reported $r"; exit 1 ;;
            esac
          done
          echo "all needed jobs green"
