name: security

# Bundled FOSS security scan via catenahq/scanctl. One run detects the repo's
# ecosystems, runs the matching scanners, merges SARIF (uploaded to code
# scanning), and emits a CycloneDX SBOM artifact. profile=full enables
# semgrep's registry packs.

on:
  pull_request:
  # The same branches as ci.yml.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scanctl:
    # @main on purpose: first-party reusable workflow, auto-updating, gated
    # by the ruleset on catenahq/scanctl itself (zizmor's bundled policy
    # allows catenahq/* ref-pins; renovate-config stops Renovate re-pinning
    # it to a SHA, which froze callers at stale scanctl versions).
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
