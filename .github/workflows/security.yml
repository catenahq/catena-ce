name: security

# Bundled FOSS security scan via catenahq/scanctl. Replaces the former per-tool
# workflows (gitleaks, osv-scanner, trivy fs, semgrep, zizmor, licenses-sbom,
# go-analysis's govulncheck, socket). One run detects the repo's ecosystems,
# runs the matching scanners, merges SARIF (uploaded to code scanning), and
# emits a CycloneDX SBOM artifact. profile=full enables semgrep's registry packs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scanctl:
    # @main on purpose: first-party reusable workflow, auto-updating, gated
    # by the ruleset on catenahq/scanctl itself (zizmor's bundled policy
    # allows catenahq/* ref-pins; renovate-config stops Renovate re-pinning
    # it to a SHA, which froze callers at stale scanctl versions).
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
      # No .scanctl/baseline.sarif exists yet (missing file = no-op, so this
      # is safe today) -- seed one per scanctl's README ("Seeding or
      # regenerating a baseline") and commit .scanctl/baseline.sarif +
      # .scanctl/README.md + baseline-drift.yml (catenahq/docs has an example
      # of the repo-specific-vs-generic split) to activate suppression +
      # auto-dismiss.
      baseline: .scanctl/baseline.sarif
