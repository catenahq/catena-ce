name: seed baseline

# Manual, one-shot: opens a PR proposing .scanctl/baseline.sarif when none
# exists yet. Review every finding before merging -- see the PR body and
# catenahq/scanctl's README ("Seeding or regenerating a baseline").
#
# runner: ubuntu-latest is deliberate, not a copy-paste of security.yml's
# choice: a reusable-workflow `uses:` call fails to start on a self-hosted
# runner (same reason security.yml itself pins ubuntu-latest here rather
# than self-hosted).

on:
  workflow_dispatch:

jobs:
  seed:
    uses: catenahq/scanctl/.github/workflows/seed-baseline-reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
