name: CI

# The Ansible tree's unit tests and syntax check, and the installer's
# (installer/). This repo carries no Go. Python tooling comes from uv.

on:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    # The Ansible tree's unit tests and those of `catena-installer`, the root
    # project, whose tests include the gate that holds the declaration, the
    # code it points at and the documented commands to one another, and what
    # a wheel carries.
    name: Installer and tree unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # In ansible/'s own project, on the ansible-core the host runs: some of
      # the tree's tests render its templates through ansible-core's
      # templating, others with the Jinja2 it brings.
      - name: Ansible tree unit tests
        working-directory: ansible
        run: uv run python -m pytest tests/unit -q
      - name: Installer tests
        run: uv run pytest -q

  entry-points:
    # `catena-installer`, the one entry point a client runs, from the root
    # project and as the wheel uvx installs. The locks are held to their
    # pyprojects here, since resolving needs the index.
    name: Entry point and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Locks match their pyprojects
        run: |
          set -eu
          uv lock --check
          uv lock --check --project ansible
      - name: The entry point runs
        run: uv run catena-installer --help
      - name: A wheel builds
        run: uv build --wheel

  syntax:
    # Every playbook parses, roles and all. The unit tests read task files as
    # data and render single templates; this loads the tree the way a converge
    # does, so a bad task keyword, a malformed block or a module name
    # ansible-core does not provide fails here rather than on a client's
    # server.
    #
    # --syntax-check loads the whole play including every role it includes, so
    # this covers roles/ without naming them. With no collection installed, a
    # module from one reads as a conflicting action statement: the tree runs
    # on ansible-core alone, on the server.
    #
    # -i localhost, because syntax-check parses rather than connects; the
    # inventory only has to exist.
    name: Ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Syntax-check every playbook
        working-directory: ansible
        run: |
          set -eu
          rc=0
          for playbook in playbooks/*.yml; do
            echo "== $playbook"
            uv run ansible-playbook --syntax-check -i localhost, "$playbook" || rc=1
          done
          exit $rc

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: jscpd (threshold in .jscpd.json)
        run: npx --yes jscpd@4 --silent

  sentences:
    # The same ratchet for prose: a sentence written in two places fails,
    # unless .github/duplicate-sentences-debt.txt carries it.
    name: Duplicate sentences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Duplicate sentences (debt in .github/duplicate-sentences-debt.txt)
        run: python3 .github/scripts/duplicate_sentences.py

  prose:
    # Comments describe the code as it stands. Its history belongs in
    # the commit message. The rules and the runner both live in
    # catenahq/contracts and run from there, so this repo holds only its
    # own .github/prose-debt.txt.
    name: Comment prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: catena-ce
          # Needed for the merge-base the prose scope is measured against.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Repo rules (no tracked env file; .gitignore carries the env rule)
        working-directory: ./catena-ce
        run: node ../contracts/scripts/check-repo-rules.mjs
      # Pinned in contracts/.vale-version, which check-prose.mjs also
      # reads and enforces: the grammars decide which comments are
      # visible, so a different version is a different gate.
      - name: Install vale
        run: |
          version="$(cat contracts/.vale-version)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: check:prose
        working-directory: ./catena-ce
        # On a pull request, gate only on the files the change touches. A
        # prose finding that landed on the base branch is not this change's
        # doing, and failing every open dependency PR on it blames the wrong
        # commit. The whole tree is still scanned and anything carried is still
        # printed; the push and cron runs of the default branch keep the
        # absolute gate.
        env:
          PROSE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$PROSE_BASE" ]; then
            node ../contracts/scripts/check-prose.mjs --changed-since "$PROSE_BASE"
          else
            node ../contracts/scripts/check-prose.mjs
          fi
