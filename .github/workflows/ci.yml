name: CI

# Python installer (ansible/) unit tests. This repo carries no Go. Python
# tooling comes from uv.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Python) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The installer tests import only seed.py + helpers (no ansible-core), so
      # run them in a lightweight ephemeral env instead of syncing the project
      # (which would pull ansible-core for nothing here).
      - name: Unit tests
        working-directory: ansible
        run: uv run --no-project --with pytest --with pyyaml python -m pytest tests/unit -q

  syntax:
    # Every playbook parses, roles and all. The unit job above deliberately
    # runs without ansible-core, so nothing until now READ the tree Ansible
    # actually executes: a bad task keyword, a malformed block, a module name
    # no installed collection provides -- all of it reached a converge before
    # anything noticed, and a converge is a client's server.
    #
    # --syntax-check loads the whole play including every role it includes, so
    # this covers roles/ without naming them. It resolves module FQCNs, which
    # is why it needs the pinned collections: without them every
    # community.general task reads as a conflicting action statement.
    #
    # -i localhost, because syntax-check parses rather than connects; the
    # inventory only has to exist.
    name: Ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Vendor the pinned collections
        working-directory: ansible
        run: uv run ansible-galaxy collection install -r requirements.yml -p .collections
      - name: Syntax-check every playbook
        working-directory: ansible
        run: |
          set -eu
          rc=0
          for playbook in playbooks/*.yml; do
            echo "== $playbook"
            uv run ansible-playbook --syntax-check -i localhost, "$playbook" || rc=1
          done
          exit $rc

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: jscpd (threshold in .jscpd.json)
        run: npx --yes jscpd@4 --silent
