name: CI

# Python installer (ansible/) unit tests. This repo carries no Go since the
# license package moved to the private catena-admin repo (which was the last
# Go here after the shell moved out at the unification). Python tooling comes
# from uv.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Python) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The installer tests import only seed.py + helpers (no ansible-core), so
      # run them in a lightweight ephemeral env instead of syncing the project
      # (which would pull ansible-core for nothing here).
      - name: Unit tests
        working-directory: ansible
        run: uv run --no-project --with pytest --with pyyaml python -m pytest tests/unit -q

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: jscpd (threshold in .jscpd.json)
        run: npx --yes jscpd@4 --silent
