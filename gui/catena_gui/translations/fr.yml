check.key_opens: "la clé ouvre déjà {login}"
check.no_password_needed: "aucun mot de passe n'est nécessaire"
check.refused: "refusé"
check.key_refused: "le serveur n'accepte pas encore cette clé"
check.key_refused_detail: >-
  {tried}. Entrer le mot de passe de l'hébergeur pour {user}, et l'installation
  y ajoute la clé, ou fournir la clé publique à l'hébergeur et vérifier de
  nouveau
check.password_opens: "le mot de passe de l'hébergeur ouvre {login}"
